id: c1-l1
chapter: c1
title:
  en: "Why automate — and where AI fits"
  ru: "Зачем автоматизировать — и где здесь ИИ"
goal:
  en: "See an automated test as a test case written in code, and know what the AI agent does and what you do."
  ru: "Увидеть в автотесте тест-кейс, записанный кодом, и понять, что делает ИИ-агент, а что — ты."
minutes: 8
keyPoints:
  - id: kp-regression-cost
    title:
      en: "Automation runs slow, repetitive regression in minutes"
      ru: "Автоматизация прогоняет долгую однообразную регрессию за минуты"
  - id: kp-test-is-script
    title:
      en: "An automated test is a test case written as code"
      ru: "Автотест — это тест-кейс, записанный кодом"
  - id: kp-qa-role-ai
    title:
      en: "The agent writes the code; you decide what to check"
      ru: "Код пишет агент, а что проверять — решаешь ты"
terms: [manual-testing, test-automation, automated-test, regression-testing, test-case, test-runner, test-suite, smoke-test]

steps:
  - type: story
    lines:
      - who: leo
        text:
          en: "Last release, regression took three full days. Two people clicked through the same 400 test cases. Again."
          ru: "В прошлый релиз регрессия заняла три полных дня. Два человека прокликали те же 400 тест-кейсов. Опять."
      - who: maya
        text:
          en: "And by day three everyone is tired — that's exactly when bugs slip through. Let's see what automation changes, and where Petal fits in."
          ru: "А к третьему дню все устают — и именно тогда баги проскакивают. Давай посмотрим, что меняет автоматизация и какое место в ней у Petal."
      - who: mochi
        text:
          en: "Mrrp?"
          ru: "Мрр?"

  - type: pretest
    intro:
      en: "Quick guess before we start. Wrong answers are fine — they help you remember."
      ru: "Быстрая догадка перед началом. Ошибаться можно — так лучше запоминается."
    items:
      - id: c1-l1-p1
        kind: choice
        keyPoint: kp-regression-cost
        prompt:
          en: "Bloomly has about 400 regression test cases. What changes first when they are automated?"
          ru: "В Bloomly около 400 регрессионных тест-кейсов. Что изменится в первую очередь, когда их автоматизируют?"
        options:
          - text:
              en: "The same checks run in minutes on every release, and people get time for exploratory testing."
              ru: "Те же проверки проходят за минуты на каждом релизе, а у людей появляется время на исследовательское тестирование."
            correct: true
            why:
              en: "Automation takes over the repetitive part. People keep the part that needs thinking."
              ru: "Автоматизация забирает однообразную часть. Людям остаётся то, где нужно думать."
          - text:
              en: "Testers are no longer needed."
              ru: "Тестировщики больше не нужны."
            why:
              en: "Someone still decides what to check and reads the results. That someone is a tester."
              ru: "Кто-то всё равно решает, что проверять, и разбирает результаты. Это тестировщик."
          - text:
              en: "The app stops having bugs."
              ru: "В приложении перестают появляться баги."
            why:
              en: "Automation doesn't prevent bugs. It finds regressions faster — minutes after a change, not days."
              ru: "Автоматизация не предотвращает баги. Она быстрее находит регрессии — через минуты после изменения, а не через дни."
        hints:
          - en: "Think about what is slow and boring in manual regression."
            ru: "Подумай, что в ручной регрессии долго и скучно."
          - en: "Automation repeats known checks. Does it replace thinking?"
            ru: "Автоматизация повторяет известные проверки. Заменяет ли она мышление?"
        explain:
          en: "Automated tests repeat the same checks quickly and reliably. Bugs still happen, and testers still decide what is worth checking — they just stop doing it by hand 400 times."
          ru: "Автотесты быстро и надёжно повторяют одни и те же проверки. Баги по-прежнему случаются, и тестировщики по-прежнему решают, что стоит проверять, — просто больше не делают это руками 400 раз."
      - id: c1-l1-p2
        kind: choice
        keyPoint: kp-qa-role-ai
        prompt:
          en: "Petal, the team's AI agent, can write a test in ten seconds. What does it do badly without you?"
          ru: "Petal, ИИ-агент команды, пишет тест за десять секунд. Что у него плохо получается без тебя?"
        options:
          - text:
              en: "Decide what is important to check and what the correct expected result is."
              ru: "Решить, что важно проверить и какой ожидаемый результат правильный."
            correct: true
            why:
              en: "The agent doesn't know Bloomly's risks or requirements. It guesses — and sounds sure. That judgement is yours."
              ru: "Агент не знает рисков и требований Bloomly. Он угадывает — и звучит уверенно. Это решение за тобой."
          - text:
              en: "Type code quickly."
              ru: "Быстро набирать код."
            why:
              en: "Speed is exactly what agents are good at."
              ru: "Скорость — как раз сильная сторона агентов."
          - text:
              en: "Write Python."
              ru: "Писать на Python."
            why:
              en: "Agents write Python well. They are weaker at knowing what the code should check."
              ru: "На Python агенты пишут хорошо. Слабее у них понимание, что именно код должен проверять."
        hints:
          - en: "What does an agent not know about Bloomly?"
            ru: "Чего агент не знает о Bloomly?"
          - en: "Think about expected results and product risks."
            ru: "Подумай об ожидаемых результатах и рисках продукта."
        explain:
          en: "Agents are fast at code but don't know what matters for the product. Choosing what to check and the right expected result is test design — your strongest skill."
          ru: "Агенты быстро пишут код, но не знают, что важно для продукта. Выбрать, что проверять, и правильный ожидаемый результат — это тест-дизайн, твой самый сильный навык."

  - type: theory
    keyPoint: kp-regression-cost
    title:
      en: "Regression: the same checks, every release"
      ru: "Регрессия: те же проверки на каждом релизе"
    figure: manual-vs-auto
    body:
      - en: "[[Regression testing|regression-testing]] checks that what worked yesterday still works today. You know it well: the same cases, every release, by hand."
        ru: "[[Регрессионное тестирование|regression-testing]] проверяет, что работавшее вчера работает и сегодня. Ты хорошо это знаешь: те же кейсы, каждый релиз, руками."
      - en: "At Bloomly that's ~400 cases and 3 days of [[manual testing|manual-testing]]. [[Test automation|test-automation]] runs the same checks in minutes — on every release, even at night."
        ru: "В Bloomly это около 400 кейсов и 3 дня [[ручного тестирования|manual-testing]]. [[Автоматизация тестирования|test-automation]] прогоняет те же проверки за минуты — на каждом релизе, хоть ночью."
      - en: "Automation doesn't replace testing. It takes the repetitive part, so you get time for exploratory testing and new features."
        ru: "Автоматизация не заменяет тестирование. Она забирает однообразную часть, и у тебя появляется время на исследовательское тестирование и новые фичи."
    mentor:
      en: "In my last team, the login smoke check ran forty times a day — after every merge. Nobody could do that by hand."
      ru: "В моей прошлой команде смоук-проверка логина запускалась сорок раз в день — после каждого мержа. Вручную так не сможет никто."

  - type: theory
    keyPoint: kp-test-is-script
    title:
      en: "An automated test is a test case written as code"
      ru: "Автотест — это тест-кейс, записанный кодом"
    body:
      - en: "You already write [[test cases|test-case]]: a title, steps, an expected result. An [[automated test|automated-test]] has exactly the same parts — only written as code."
        ru: "Ты уже пишешь [[тест-кейсы|test-case]]: название, шаги, ожидаемый результат. У [[автотеста|automated-test]] ровно те же части — только записаны они кодом."
      - en: "A [[test runner|test-runner]] — for us, pytest — finds every function whose name starts with `test_` and runs it: Playwright opens a browser, does the steps and checks the result. Then pytest reports: passed or failed."
        ru: "[[Тест-раннер|test-runner]] — у нас это pytest — находит все функции, имя которых начинается с `test_`, и запускает их: Playwright открывает браузер, выполняет шаги и проверяет результат. Потом pytest сообщает: прошёл тест или упал."
      - en: "Don't try to read every symbol yet — the first line just brings in Playwright's tools. Find the three parts you already know: the title (the function name after `def`), the steps, the check."
        ru: "Пока не пытайся разобрать каждый символ — первая строка просто подключает инструменты Playwright. Найди три знакомые части: название (имя функции после `def`), шаги, проверку."
    code: |
      from playwright.sync_api import Page, expect


      def test_registered_user_can_log_in(page: Page):
          page.goto("/login")
          page.get_by_label("Email").fill("anna@bloomly.app")
          page.get_by_label("Password").fill("bloom123")
          page.get_by_role("button", name="Log in").click()
          expect(page).to_have_url("http://localhost:3000/account")

  - type: mapping
    keyPoint: kp-test-is-script
    title:
      en: "TC-001 and its automated test, side by side"
      ru: "TC-001 и его автотест рядом"
    intro:
      en: "Every line of the test case has its own line of code, and the title becomes the function name. Tap a step to see where it lives."
      ru: "У каждой строки тест-кейса есть своя строка кода, а название становится именем функции. Нажми на шаг, чтобы увидеть, где он в коде."
    testCase:
      id: TC-001
      title: Registered user can log in
      preconditions: ["User anna@bloomly.app / bloom123 exists", "The user is logged out"]
      steps:
        - action: "Open the login page"
        - action: "Enter email"
          data: "anna@bloomly.app"
        - action: "Enter password"
          data: "bloom123"
        - action: "Click \"Log in\""
          expected: "The account page opens and shows \"Welcome back, Anna!\""
    code: |
      from playwright.sync_api import Page, expect


      def test_registered_user_can_log_in(page: Page):
          page.goto("/login")
          page.get_by_label("Email").fill("anna@bloomly.app")
          page.get_by_label("Password").fill("bloom123")
          page.get_by_role("button", name="Log in").click()
          expect(page).to_have_url("http://localhost:3000/account")
          expect(page.get_by_role("heading", name="Welcome back, Anna!")).to_be_visible()
    links:
      - { from: s1, lines: [5] }
      - { from: s2, lines: [6] }
      - { from: s3, lines: [7] }
      - { from: s4, lines: [8] }
      - { from: e4, lines: [9, 10] }

  - type: example
    keyPoint: kp-test-is-script
    title:
      en: "Your first run: a smoke test"
      ru: "Первый запуск: смоук-тест"
    intro:
      en: "A [[smoke test|smoke-test]] is a quick check that the most important path works. Read the notes, then press Run and watch the runner do the steps."
      ru: "[[Смоук-тест|smoke-test]] — быстрая проверка, что самый важный путь работает. Прочитай пояснения, потом нажми «Run» и посмотри, как раннер выполняет шаги."
    code: |
      from playwright.sync_api import Page, expect


      def test_home_page_leads_to_the_shop(page: Page):
          page.goto("/")
          page.get_by_role("link", name="Shop now").click()
          expect(page).to_have_url("http://localhost:3000/shop")
          expect(page.get_by_role("heading", name="Shop")).to_be_visible()
    notes:
      - lines: 1
        text:
          en: "A standard first line: it imports `Page` and `expect` from Playwright. You'll see it at the top of every test file — `tests/test_shop.py`, `tests/test_login.py` and so on."
          ru: "Стандартная первая строка: импортирует `Page` и `expect` из Playwright. Она стоит в начале каждого файла с тестами — `tests/test_shop.py`, `tests/test_login.py` и так далее."
      - lines: 4
        text:
          en: "The test itself is a function. Its name is the test case title in English, with `_` instead of spaces. The `test_` prefix tells pytest to run it; `page` is the browser tab pytest hands to the test."
          ru: "Сам тест — это функция. Её имя — название тест-кейса по-английски, с `_` вместо пробелов. Приставка `test_` говорит pytest, что функцию надо запустить; `page` — вкладка браузера, которую pytest передаёт тесту."
      - lines: [5, 6]
        text:
          en: "Steps: open the home page, click the \"Shop now\" link."
          ru: "Шаги: открыть главную, нажать ссылку «Shop now»."
      - lines: [7, 8]
        text:
          en: "Expected result: the shop page opens and its heading \"Shop\" is visible."
          ru: "Ожидаемый результат: открылась страница магазина, виден заголовок «Shop»."
    runnable: true

  - type: theory
    keyPoint: kp-qa-role-ai
    title:
      en: "Where Petal fits — and where you do"
      ru: "Где здесь Petal — и где ты"
    figure: agent-loop
    body:
      - en: "An AI agent like Petal turns a request into code in seconds. It reads the page, picks methods, writes the test."
        ru: "ИИ-агент вроде Petal превращает запрос в код за секунды. Он читает страницу, подбирает методы, пишет тест."
      - en: "But it doesn't know your product's risks. It doesn't know the greeting must show the first name, or that \"Remember me\" broke last month. It guesses — and sounds sure."
        ru: "Но он не знает рисков твоего продукта. Не знает, что в приветствии должно быть имя, или что «Remember me» сломался в прошлом месяце. Он угадывает — и звучит уверенно."
      - en: "So the loop is: you decide what to check → the agent writes → you review and run → you accept or ask for changes. Your test design is the core skill here."
        ru: "Поэтому цикл такой: ты решаешь, что проверять → агент пишет → ты проверяешь и запускаешь → принимаешь или просишь исправить. Твой тест-дизайн здесь — главный навык."
    mentor:
      en: "Petal once \"tested\" checkout without checking the total. The test was green, the price was wrong. The agent was fast — it just checked the wrong thing."
      ru: "Однажды Petal «протестировал» оформление заказа, не проверив итоговую сумму. Тест был зелёный, цена — неправильная. Агент был быстрым — просто проверял не то."

  - type: task
    task:
      id: c1-l1-t1
      kind: match
      keyPoint: kp-test-is-script
      prompt:
        en: "Match each part of TC-001 with its line of code."
        ru: "Сопоставь каждую часть TC-001 со строкой кода."
      pairs:
        - left: { en: "Test case title", ru: "Название тест-кейса" }
          right: 'def test_registered_user_can_log_in(page: Page):'
        - left: { en: "Step: open the login page", ru: "Шаг: открыть страницу входа" }
          right: 'page.goto("/login")'
        - left: { en: "Step: enter the password bloom123", ru: "Шаг: ввести пароль bloom123" }
          right: 'page.get_by_label("Password").fill("bloom123")'
        - left: { en: "Expected result: the account page opens", ru: "Ожидаемый результат: открывается страница аккаунта" }
          right: 'expect(page).to_have_url("http://localhost:3000/account")'
      rightCode: true
      hints:
        - en: "Look for familiar words in each line: a title, a page address, a password, an expectation."
          ru: "Ищи знакомые слова в каждой строке: название, адрес страницы, пароль, ожидание."
        - en: "The line that starts with `def test_` holds the title. The line with `expect` is the check."
          ru: "Строка, которая начинается с `def test_`, содержит название. Строка с `expect` — это проверка."
        - en: '`goto("/login")` opens the login page; `fill("bloom123")` types the password.'
          ru: '`goto("/login")` открывает страницу входа; `fill("bloom123")` вводит пароль.'
      praise:
        en: "You read code through the test case — that's the habit that makes reviews fast."
        ru: "Ты {прочитала|прочитал} код через тест-кейс — именно эта привычка делает ревью быстрым."
      explain:
        en: "Each part of a test case has a direct twin in code: the title becomes the function name `test_registered_user_can_log_in`, each step is one line, and the expected result becomes `expect(...)`."
        ru: "У каждой части тест-кейса есть прямой двойник в коде: название становится именем функции `test_registered_user_can_log_in`, каждый шаг — одна строка, а ожидаемый результат становится `expect(...)`."

  - type: task
    task:
      id: c1-l1-t2
      kind: choice
      keyPoint: kp-regression-cost
      prompt:
        en: "Leo asks: \"What should we automate first?\" Which candidate is the best start?"
        ru: "Лео спрашивает: «Что автоматизируем первым?» Какой кандидат лучше всего для старта?"
      options:
        - text:
            en: "The login smoke check that the team runs before every release"
            ru: "Смоук-проверка логина, которую команда гоняет перед каждым релизом"
          correct: true
          why:
            en: "Stable, repeated often, high value if it breaks. A perfect first candidate."
            ru: "Стабильная, повторяется часто, очень важна, если сломается. Идеальный первый кандидат."
        - text:
            en: "A one-time check of the holiday banner that will be removed next week"
            ru: "Разовая проверка праздничного баннера, который уберут через неделю"
          why:
            en: "It runs once. Writing and maintaining a test costs more than checking it by hand."
            ru: "Её запустят один раз. Написать и поддерживать тест дороже, чем проверить руками."
        - text:
            en: "Exploring how a brand-new feature behaves with unusual input"
            ru: "Исследовать, как новая фича ведёт себя на необычных данных"
          why:
            en: "Exploratory testing needs curiosity and judgement. Automate what you already know how to check."
            ru: "Исследовательскому тестированию нужны любопытство и суждение. Автоматизируют то, что уже понятно, как проверять."
        - text:
            en: "Checking that the bouquet photos \"look fresh\""
            ru: "Проверка, что фото букетов «выглядят свежими»"
          why:
            en: "A subjective judgement. Code can't decide what \"fresh\" looks like."
            ru: "Это субъективная оценка. Код не решит, как выглядит «свежий»."
      hints:
        - en: "Which check repeats most often?"
          ru: "Какая проверка повторяется чаще всего?"
        - en: "Good candidates are stable, repeated, and important if broken."
          ru: "Хорошие кандидаты стабильны, повторяются и важны, если сломаются."
        - en: "Think about what runs before every release."
          ru: "Подумай, что гоняют перед каждым релизом."
      praise:
        en: "That's a test lead's answer: automate what is stable, frequent and risky."
        ru: "Это ответ тест-лида: автоматизировать стабильное, частое и рискованное."
      explain:
        en: "Automation pays off when a check runs many times. A smoke check before every release is the classic first target. One-off, exploratory and subjective checks stay manual."
        ru: "Автоматизация окупается, когда проверка запускается много раз. Смоук-проверка перед каждым релизом — классическая первая цель. Разовые, исследовательские и субъективные проверки остаются ручными."

  - type: task
    task:
      id: c1-l1-t3
      kind: vocab
      mode: cloze
      prompt:
        en: "Pick the word that fits."
        ru: "Выбери подходящее слово."
      sentence:
        en: "Before every release we run the ___ suite: about 400 cases that check old features still work."
        ru: "Перед каждым релизом мы прогоняем регрессионный набор: около 400 кейсов, которые проверяют, что старые функции работают."
      answer: regression
      options: [regression, smoke, exploratory]

  - type: task
    task:
      id: c1-l1-t4
      kind: predict
      keyPoint: kp-test-is-script
      context:
        en: "Petal copied the TC-001 test to check that Tom (tom@bloomly.app / tulips42) can log in. The data is correct. Read the last line carefully."
        ru: "Petal скопировал тест TC-001, чтобы проверить вход Тома (tom@bloomly.app / tulips42). Данные верные. Внимательно прочитай последнюю строку."
      prompt:
        en: "Will this test pass or fail?"
        ru: "Этот тест пройдёт или упадёт?"
      code: |
        def test_tom_can_log_in(page: Page):
            page.goto("/login")
            page.get_by_label("Email").fill("tom@bloomly.app")
            page.get_by_label("Password").fill("tulips42")
            page.get_by_role("button", name="Log in").click()
            expect(page.get_by_role("heading", name="Welcome back, Anna!")).to_be_visible()
      outcome: fail
      reasons:
        - text:
            en: "The page greets Tom, but the test expects Anna. The check compares expected with actual — just like you would."
            ru: "Страница приветствует Тома, а тест ждёт Анну. Проверка сравнивает ожидаемое с фактическим — как {сделала|сделал} бы ты."
          correct: true
        - text:
            en: "Tom's password is wrong."
            ru: "У Тома неверный пароль."
          why:
            en: "tulips42 is Tom's real password — the login itself works."
            ru: "tulips42 — настоящий пароль Тома, сам вход работает."
        - text:
            en: "It passes: the heading check only looks for any heading."
            ru: "Пройдёт: проверка заголовка ищет любой заголовок."
          why:
            en: "The check names the exact heading text: \"Welcome back, Anna!\"."
            ru: "Проверка называет точный текст заголовка: «Welcome back, Anna!»."
      hints:
        - en: "What will the account page say for Tom?"
          ru: "Что покажет страница аккаунта для Тома?"
        - en: "Compare that with the text in the last line."
          ru: "Сравни это с текстом в последней строке."
        - en: "Tom sees \"Welcome back, Tom!\" — the test waits for Anna."
          ru: "Том видит «Welcome back, Tom!» — а тест ждёт Анну."
      praise:
        en: "You compared expected with actual before running anything. That's a tester's eye."
        ru: "Ты {сравнила|сравнил} ожидаемое с фактическим ещё до запуска. Вот он, глаз тестировщика."
      explain:
        en: "The steps work, so Tom logs in and sees \"Welcome back, Tom!\". The last line expects \"Welcome back, Anna!\" — the expected result doesn't match the actual one, so the test fails. Copy-paste mistakes like this are typical for AI agents."
        ru: "Шаги работают, Том входит и видит «Welcome back, Tom!». Последняя строка ждёт «Welcome back, Anna!» — ожидаемое не совпадает с фактическим, и тест падает. Такие ошибки копипаста типичны для ИИ-агентов."

  - type: task
    task:
      id: c1-l1-t5
      kind: review
      keyPoint: kp-qa-role-ai
      context:
        en: "Petal: \"Here's TC-002, done in 4 seconds!\" Compare the code with the test case before you trust it."
        ru: "Petal: «Вот TC-002, готово за 4 секунды!» Сравни код с тест-кейсом, прежде чем ему доверять."
      prompt:
        en: "Find the line that doesn't match the test case and choose the problem type."
        ru: "Найди строку, которая не совпадает с тест-кейсом, и выбери тип проблемы."
      testCase:
        id: TC-002
        title: Wrong password shows an error
        preconditions: ["User anna@bloomly.app exists", "The user is logged out"]
        steps:
          - action: "Open the login page"
          - action: "Enter email"
            data: "anna@bloomly.app"
          - action: "Enter password"
            data: "wrong-pass"
          - action: "Click \"Log in\""
            expected: "Error \"Invalid email or password.\" is shown"
      code: |
        def test_wrong_password_shows_an_error(page: Page):
            page.goto("/login")
            page.get_by_label("Email").fill("anna@bloomly.app")
            page.get_by_label("Password").fill("bloom123")
            page.get_by_role("button", name="Log in").click()
            expect(page.get_by_role("alert")).to_have_text("Invalid email or password.")
      issues:
        - line: 4
          type: wrong-data
          note:
            en: "TC-002 uses the wrong password \"wrong-pass\". Petal copied the real password from the happy-path test — this test would log in instead of showing the error."
            ru: "В TC-002 неверный пароль «wrong-pass». Petal скопировал настоящий пароль из позитивного теста — этот тест войдёт в аккаунт вместо того, чтобы показать ошибку."
      types: [wrong-data, wrong-step, no-assertion, hallucination]
      hints:
        - en: "Read the test case data column, then the values in the code."
          ru: "Прочитай данные в тест-кейсе, а потом значения в коде."
        - en: "A negative test needs negative data. Which value is from the happy path?"
          ru: "Негативному тесту нужны негативные данные. Какое значение — из позитивного сценария?"
        - en: "Look at the password on line 4."
          ru: "Посмотри на пароль в строке 4."
      praise:
        en: "You checked the data against the test case — the agent can't do that for you."
        ru: "Ты {сверила|сверил} данные с тест-кейсом — агент этого за тебя не сделает."
      explain:
        en: "The steps and the check look right, but line 4 uses the correct password. The test would log in, never see the error, and fail for the wrong reason. Agents often reuse data from a similar test — always compare with the test case."
        ru: "Шаги и проверка выглядят правильно, но в строке 4 верный пароль. Тест войдёт в аккаунт, не увидит ошибку и упадёт не по той причине. Агенты часто переиспользуют данные из похожего теста — всегда сверяйся с тест-кейсом."

  - type: task
    task:
      id: c1-l1-t6
      kind: agent
      keyPoint: kp-qa-role-ai
      prompt:
        en: "Build a prompt for Petal from the blocks. Add what the agent needs, leave out what it doesn't. Then run the test it writes."
        ru: "Собери промпт для Petal из блоков. Добавь то, что нужно агенту, и не добавляй лишнее. Потом запусти тест, который он напишет."
      context:
        en: "This is a simulation: a real agent's answers vary, but the pattern is the same — vague input, vague test."
        ru: "Это симуляция: ответы настоящего агента бывают разными, но закономерность та же — размытый запрос, размытый тест."
      testCase:
        id: TC-001
        title: Registered user can log in
        preconditions: ["User anna@bloomly.app / bloom123 exists"]
        steps:
          - action: "Open the login page"
          - action: "Enter email"
            data: "anna@bloomly.app"
          - action: "Enter password"
            data: "bloom123"
          - action: "Click \"Log in\""
            expected: "The account page shows \"Welcome back, Anna!\""
      blocks:
        - id: task
          locked: true
          text: "Write a Playwright test for TC-001: a registered user can log in to Bloomly."
          ru: "Напиши Playwright-тест для TC-001: зарегистрированный пользователь может войти в Bloomly."
        - id: steps
          text: 'Steps: open /login, enter anna@bloomly.app and bloom123, click the "Log in" button.'
          ru: "Шаги: открой /login, введи anna@bloomly.app и bloom123, нажми кнопку «Log in»."
        - id: expected
          text: 'Expected result: the account page shows the heading "Welcome back, Anna!".'
          ru: "Ожидаемый результат: на странице аккаунта виден заголовок «Welcome back, Anna!»."
        - id: noise
          text: "You are the best tester in the world. Make no mistakes!"
          ru: "Ты лучший тестировщик в мире. Не ошибайся!"
      responses:
        - when: [steps, expected]
          best: true
          message:
            en: "Here's the test for TC-001. It follows your steps and checks the greeting from the expected result."
            ru: "Вот тест для TC-001. Он идёт по твоим шагам и проверяет приветствие из ожидаемого результата."
          code: |
            from playwright.sync_api import Page, expect


            def test_registered_user_can_log_in(page: Page):
                page.goto("/login")
                page.get_by_label("Email").fill("anna@bloomly.app")
                page.get_by_label("Password").fill("bloom123")
                page.get_by_role("button", name="Log in").click()
                expect(page.get_by_role("heading", name="Welcome back, Anna!")).to_be_visible()
        - when: [steps]
          message:
            en: "Done! The test logs in successfully. It's ready to merge."
            ru: "Готово! Тест успешно входит в аккаунт. Можно мержить."
          code: |
            from playwright.sync_api import Page, expect


            def test_registered_user_can_log_in(page: Page):
                page.goto("/login")
                page.get_by_label("Email").fill("anna@bloomly.app")
                page.get_by_label("Password").fill("bloom123")
                page.get_by_role("button", name="Log in").click()
        - when: [expected]
          message:
            en: "I used standard test credentials for the login. The test checks the greeting."
            ru: "Для входа я взял стандартные тестовые данные. Тест проверяет приветствие."
          code: |
            from playwright.sync_api import Page, expect


            def test_registered_user_can_log_in(page: Page):
                page.goto("/login")
                page.get_by_label("Email").fill("test@example.com")
                page.get_by_label("Password").fill("password123")
                page.get_by_role("button", name="Log in").click()
                expect(page.get_by_role("heading", name="Welcome back, Anna!")).to_be_visible()
        - when: []
          message:
            en: "You didn't say which flow, so I tested that the home page opens. Looks great!"
            ru: "Ты не {сказала|сказал}, какой сценарий, поэтому я проверил, что открывается главная. Выглядит отлично!"
          code: |
            from playwright.sync_api import Page, expect


            def test_bloomly_works(page: Page):
                page.goto("/")
                expect(page).to_have_title("Bloomly — Fresh flowers delivered")
      missing:
        steps:
          en: "Without the steps and data, the agent guessed — it invented test@example.com, a user that doesn't exist in Bloomly."
          ru: "Без шагов и данных агент угадывал — и придумал test@example.com, пользователя, которого в Bloomly нет."
        expected:
          en: "Without the expected result, the agent had nothing to check — the test has no assertion and stays green even if login breaks."
          ru: "Без ожидаемого результата агенту нечего было проверять — в тесте нет проверки, и он останется зелёным, даже если вход сломается."
        noise:
          en: "Flattery doesn't change the code. Facts from the test case do."
          ru: "Комплименты не меняют код. Меняют его факты из тест-кейса."
      checks: { expect: pass }
      hints:
        - en: "What does a tester need to run TC-001? The agent needs the same."
          ru: "Что нужно тестировщику, чтобы пройти TC-001? Агенту нужно то же самое."
        - en: "Steps with data, and the expected result."
          ru: "Шаги с данными и ожидаемый результат."
        - en: "Add the steps and expected blocks. Motivational text adds nothing."
          ru: "Добавь блоки со шагами и ожидаемым результатом. Мотивирующий текст ничего не даёт."
      praise:
        en: "You gave the agent exactly what a good test case gives a tester: steps, data, expected result."
        ru: "Ты {дала|дал} агенту ровно то, что хороший тест-кейс даёт тестировщику: шаги, данные, ожидаемый результат."
      explain:
        en: "An agent can only check what you tell it to check. Your test case is the best prompt: steps with exact data and an expected result. Without them, the agent invents data or skips the assertion."
        ru: "Агент проверяет только то, что ты {попросила|попросил} проверить. Твой тест-кейс — лучший промпт: шаги с точными данными и ожидаемый результат. Без них агент выдумывает данные или пропускает проверку."

  - type: mistakes
    keyPoint: kp-qa-role-ai
    title:
      en: "Typical mistakes when an agent writes the test"
      ru: "Типичные ошибки, когда тест пишет агент"
    items:
      - wrong: 'page.get_by_role("button", name="Log in").click()  # done, test is green'
        right: "page.get_by_role(\"button\", name=\"Log in\").click()\nexpect(page).to_have_url(\"http://localhost:3000/account\")"
        why:
          en: "A test that ends after the click checks nothing. It stays green even when login is broken. Ask: what would make this test fail?"
          ru: "Тест, который заканчивается после клика, ничего не проверяет. Он остаётся зелёным, даже когда вход сломан. Спроси себя: что заставит этот тест упасть?"
      - wrong: 'page.get_by_label("Password").fill("password123")'
        right: 'page.get_by_label("Password").fill("bloom123")'
        why:
          en: "Agents invent plausible test data. Take the data from the test case, not from the agent's imagination."
          ru: "Агенты придумывают правдоподобные тестовые данные. Бери данные из тест-кейса, а не из фантазии агента."
      - wrong: "def test_1(page: Page):\n    page.goto(\"/login\")"
        right: "def test_registered_user_can_log_in(page: Page):\n    page.goto(\"/login\")"
        why:
          en: "The test name is the test case title. In a red report, `FAILED tests/test_login.py::test_1` tells nobody what broke."
          ru: "Имя теста — это название тест-кейса. В красном отчёте `FAILED tests/test_login.py::test_1` никому не скажет, что сломалось."

  - type: explain
    keyPoint: kp-qa-role-ai
    prompt:
      en: "In your own words: if Petal can write tests in seconds, why does Bloomly need you?"
      ru: "Своими словами: если Petal пишет тесты за секунды, зачем Bloomly {нужна|нужен} ты?"
    model:
      en: "Petal writes code fast, but it doesn't know what matters for our customers. I decide what to check, take the steps, data and expected results from the test case, and verify that the test really checks them. Without that, a fast agent produces fast green tests that catch nothing."
      ru: "Petal быстро пишет код, но не знает, что важно для наших клиентов. Я решаю, что проверять, беру шаги, данные и ожидаемые результаты из тест-кейса и проверяю, что тест действительно их проверяет. Без этого быстрый агент быстро наделает зелёных тестов, которые ничего не ловят."

  - type: phrases
    items:
