        en: "Today I'm starting on regression automation. First target: the login smoke tests."
        ru: "Сегодня начинаю автоматизацию регрессии. Первая цель — смоук-тесты логина."
      - context: chat
        en: "How long does the full regression take right now? I'd like to estimate what to automate first."
        ru: "Сколько сейчас занимает полная регрессия? Хочу оценить, что автоматизировать первым."
        note:
          en: "\"I'd like to\" sounds polite and professional in a team chat."
          ru: "«I'd like to» звучит вежливо и профессионально в рабочем чате."
      - context: prompt
        en: "Write a Playwright test for TC-001. Use the steps, test data and expected result from the test case."
        ru: "Напиши Playwright-тест для TC-001. Используй шаги, тестовые данные и ожидаемый результат из тест-кейса."
      - context: code-review
        en: "The test passes, but it doesn't check the expected result from TC-001. Could you add an assertion?"
        ru: "Тест проходит, но не проверяет ожидаемый результат из TC-001. Можешь добавить проверку?"
      - context: meeting
        en: "Let's automate the stable, repetitive cases first and keep exploratory testing manual."
        ru: "Давайте сначала автоматизируем стабильные повторяющиеся кейсы, а исследовательское тестирование оставим ручным."

checkPool:
  - id: c1-l1-k1
    kind: choice
    keyPoint: kp-regression-cost
    placement: true
    prompt:
      en: "Checkout has 30 test cases that run before every release. The new holiday banner needs one check before launch. What goes to automation?"
      ru: "У оформления заказа 30 тест-кейсов, которые гоняют перед каждым релизом. Новый праздничный баннер нужно проверить один раз перед запуском. Что отдаём в автоматизацию?"
    options:
      - text:
          en: "The 30 checkout cases"
          ru: "30 кейсов оформления заказа"
        correct: true
        why:
          en: "They repeat every release — automation pays off many times."
          ru: "Они повторяются каждый релиз — автоматизация окупится много раз."
      - text:
          en: "The banner check"
          ru: "Проверку баннера"
        why:
          en: "It runs once; automating it costs more than doing it by hand."
          ru: "Её запустят один раз; автоматизировать дороже, чем проверить руками."
      - text:
          en: "Both, right now"
          ru: "Обе, прямо сейчас"
        why:
          en: "Automation time is limited. Start where repetition is highest."
          ru: "Время на автоматизацию ограничено. Начинай там, где больше всего повторов."
    hints:
      - en: "Which check will be repeated many times?"
        ru: "Какая проверка будет повторяться много раз?"
      - en: "One-off checks rarely pay off as code."
        ru: "Разовые проверки редко окупаются в виде кода."
    explain:
      en: "Automate what repeats: regression cases that run every release. A one-off check is cheaper by hand."
      ru: "Автоматизируют то, что повторяется: регрессионные кейсы, которые гоняют каждый релиз. Разовую проверку дешевле сделать руками."

  - id: c1-l1-k2
    kind: choice
    keyPoint: kp-regression-cost
    prompt:
      en: "Leo: \"Once the regression is automated, do we still need manual testing?\" What is the best answer?"
      ru: "Лео: «Когда регрессию автоматизируем, ручное тестирование ещё понадобится?» Какой ответ лучший?"
    options:
      - text:
          en: "Yes. Automation repeats known checks; people explore new features and risky areas."
          ru: "Да. Автоматизация повторяет известные проверки, а люди исследуют новые фичи и рискованные места."
        correct: true
        why:
          en: "Automated and manual testing do different jobs. Together they cover more."
          ru: "Автоматизированное и ручное тестирование решают разные задачи. Вместе они покрывают больше."
      - text:
          en: "No. Automated tests find every bug."
          ru: "Нет. Автотесты находят все баги."
        why:
          en: "Automated tests only find what they were written to check."
          ru: "Автотесты находят только то, что им велели проверить."
      - text:
          en: "Only if the automated tests fail."
          ru: "Только если автотесты упадут."
        why:
          en: "New features, usability and unusual scenarios need people even when everything is green."
          ru: "Новым фичам, удобству и необычным сценариям нужны люди, даже когда всё зелёное."
    hints:
      - en: "Can a test check something nobody thought of?"
        ru: "Может ли тест проверить то, о чём никто не подумал?"
      - en: "Automation repeats; people discover."
        ru: "Автоматизация повторяет, люди открывают новое."
    explain:
      en: "Automation frees people from repeating known checks. Exploratory testing of new and risky areas stays human work."
      ru: "Автоматизация освобождает людей от повторения известных проверок. Исследовательское тестирование нового и рискованного остаётся работой людей."

  - id: c1-l1-k3
    kind: match
    keyPoint: kp-test-is-script
    prompt:
      en: "Match the parts of TC-002 \"Wrong password shows an error\" with the code."
      ru: "Сопоставь части TC-002 «Wrong password shows an error» с кодом."
    pairs:
      - left: { en: "Title", ru: "Название" }
        right: 'def test_wrong_password_shows_an_error(page: Page):'
      - left: { en: "Step: open the login page", ru: "Шаг: открыть страницу входа" }
        right: 'page.goto("/login")'
      - left: { en: "Step: enter the password wrong-pass", ru: "Шаг: ввести пароль wrong-pass" }
        right: 'page.get_by_label("Password").fill("wrong-pass")'
      - left: { en: "Expected: the error \"Invalid email or password.\" is shown", ru: "Ожидаемый результат: показана ошибка «Invalid email or password.»" }
        right: 'expect(page.get_by_role("alert")).to_have_text("Invalid email or password.")'
    rightCode: true
    hints:
      - en: "Find the title first: it's the function name after `def`."
        ru: "Сначала найди название: это имя функции после `def`."
      - en: "The expected result is the line with `expect`."
        ru: "Ожидаемый результат — строка с `expect`."
    explain:
      en: "Same structure as every test case: title → steps → expected result. Only the words are code."
      ru: "Та же структура, что у любого тест-кейса: название → шаги → ожидаемый результат. Только слова — код."

  - id: c1-l1-k4
    kind: predict
    keyPoint: kp-test-is-script
    placement: true
    prompt:
      en: "Will this smoke test pass or fail on Bloomly?"
      ru: "Этот смоук-тест пройдёт или упадёт на Bloomly?"
    context:
      en: "The Bloomly home page heading says \"Fresh flowers, delivered with love\"."
      ru: "Заголовок главной страницы Bloomly — «Fresh flowers, delivered with love»."
    code: |
      def test_home_page_shows_the_main_heading(page: Page):
          page.goto("/")
          expect(page.get_by_role("heading", name="Fresh flowers, delivered with love")).to_be_visible()
    outcome: pass
    reasons:
      - text:
          en: "It opens the home page and the expected heading is really there."
          ru: "Он открывает главную, и ожидаемый заголовок там действительно есть."
        correct: true
      - text:
          en: "It fails: a test needs at least one click."
          ru: "Упадёт: в тесте должен быть хотя бы один клик."
        why:
          en: "A test can be just \"open and check\". Steps depend on the test case."
          ru: "Тест может быть просто «открыть и проверить». Шаги зависят от тест-кейса."
    hints:
      - en: "Compare the expected heading with the context."
        ru: "Сравни ожидаемый заголовок с контекстом."
      - en: "Does the test need any other steps for this check?"
        ru: "Нужны ли этому тесту другие шаги для такой проверки?"
    explain:
      en: "One step and one check: open the home page, expect the main heading. The text matches the page exactly, so the test passes."
      ru: "Один шаг и одна проверка: открыть главную, ожидать главный заголовок. Текст совпадает со страницей, поэтому тест проходит."

  - id: c1-l1-k5
    kind: review
    keyPoint: kp-qa-role-ai
    prompt:
      en: "Petal wrote a test for TC-004. Find the line that contradicts the test case."
      ru: "Petal написал тест для TC-004. Найди строку, которая противоречит тест-кейсу."
    testCase:
      id: TC-004
      title: Account page shows the customer's city
      preconditions: ["Anna (anna@bloomly.app) is logged in"]
      steps:
        - action: "Open the account page"
          expected: "City shows \"Lisbon\""
    code: |
      def test_account_page_shows_the_city(page: Page):
          page.goto("/account")
          expect(page.get_by_test_id("account-city")).to_have_text("Berlin")
    issues:
      - line: 3
        type: wrong-assertion
        note:
          en: "TC-004 expects \"Lisbon\" — Anna's city. \"Berlin\" is Tom's city: the agent mixed up the test data of two users."
          ru: "TC-004 ожидает «Lisbon» — город Анны. «Berlin» — город Тома: агент перепутал тестовые данные двух пользователей."
    types: [wrong-assertion, wrong-data, no-assertion, hallucination]
    hints:
      - en: "Read the expected result in the test case."
        ru: "Прочитай ожидаемый результат в тест-кейсе."
      - en: "Compare it with the value inside `to_have_text(...)`."
        ru: "Сравни его со значением внутри `to_have_text(...)`."
    explain:
      en: "The assertion expects the wrong value. The test would fail on a correct app — or, worse, someone would \"fix\" the app to match it. The test case is the source of truth."
      ru: "Проверка ждёт неправильное значение. Тест упадёт на правильном приложении — или, что хуже, кто-то «починит» приложение под него. Источник истины — тест-кейс."

  - id: c1-l1-k6
    kind: choice
    keyPoint: kp-qa-role-ai
    prompt:
      en: "Petal: \"All 12 tests I wrote overnight are green!\" What do you do first?"
      ru: "Petal: «Все 12 тестов, что я написал за ночь, зелёные!» Что ты делаешь первым делом?"
    options:
      - text:
          en: "Open the tests and compare each one with its test case: steps, data, and a real check of the expected result."
          ru: "Открываю тесты и сверяю каждый с его тест-кейсом: шаги, данные и настоящая проверка ожидаемого результата."
        correct: true
        why:
          en: "Green only means \"nothing failed\". You need to know what was actually checked."
          ru: "Зелёный значит только «ничего не упало». Нужно знать, что на самом деле проверялось."
      - text:
          en: "Merge them — green means they work."
          ru: "Мержу — зелёные же, значит работают."
        why:
          en: "A test without an assertion is also green. Green proves nothing until you know what it checks."
          ru: "Тест без проверки тоже зелёный. Зелёный цвет ничего не доказывает, пока ты не знаешь, что тест проверяет."
      - text:
          en: "Ask Petal whether it's sure."
          ru: "Спрашиваю Petal, уверен ли он."
        why:
          en: "Agents almost always say yes. Verify the code, not the confidence."
          ru: "Агенты почти всегда отвечают «да». Проверяй код, а не уверенность."
      - text:
          en: "Run them three more times."
          ru: "Запускаю их ещё три раза."
        why:
          en: "They will be green again. That still doesn't tell you what they check."
          ru: "Они снова будут зелёными. Это всё равно не скажет, что они проверяют."
    hints:
      - en: "Can a useless test be green?"
        ru: "Может ли бесполезный тест быть зелёным?"
      - en: "What is the source of truth for each test?"
        ru: "Что для каждого теста источник истины?"
    explain:
      en: "Your job is to verify that each test checks what its test case says. Green tests that check the wrong thing are worse than no tests — they give false confidence."
      ru: "Твоя задача — убедиться, что каждый тест проверяет то, что сказано в его тест-кейсе. Зелёные тесты, которые проверяют не то, хуже отсутствия тестов — они дают ложную уверенность."

  - id: c1-l1-k7
    kind: predict
    keyPoint: kp-qa-role-ai
    context:
      en: "Petal got the request \"test the login\" without a test case and picked the data itself."
      ru: "Petal получил запрос «протестируй логин» без тест-кейса и сам выбрал данные."
    prompt:
      en: "Will this test pass or fail on Bloomly?"
      ru: "Этот тест пройдёт или упадёт на Bloomly?"
    code: |
      def test_registered_user_can_log_in(page: Page):
          page.goto("/login")
          page.get_by_label("Email").fill("test@example.com")
          page.get_by_label("Password").fill("password123")
          page.get_by_role("button", name="Log in").click()
          expect(page).to_have_url("http://localhost:3000/account")
    outcome: fail
    reasons:
      - text:
          en: "There is no such user in Bloomly — the agent invented the test data, so login fails and the page stays on /login."
          ru: "Такого пользователя в Bloomly нет — агент выдумал тестовые данные, вход не проходит, и страница остаётся на /login."
        correct: true
      - text:
          en: "Any email works on a test site."
          ru: "На тестовом сайте подходит любой email."
        why:
          en: "Bloomly checks real users. Only existing accounts can log in."
          ru: "Bloomly проверяет настоящих пользователей. Войти могут только существующие аккаунты."
    hints:
      - en: "Who are the real Bloomly test users?"
        ru: "Кто настоящие тестовые пользователи Bloomly?"
      - en: "test@example.com is not one of them."
        ru: "test@example.com среди них нет."
    explain:
      en: "test@example.com / password123 is what agents typically invent. Bloomly says \"Invalid email or password.\", the URL stays /login, and the check fails. Give the agent real test data from your test case."
      ru: "test@example.com / password123 — типичные данные, которые выдумывают агенты. Bloomly отвечает «Invalid email or password.», URL остаётся /login, и проверка падает. Давай агенту настоящие тестовые данные из тест-кейса."

  - id: c1-l1-k8
    kind: choice
    keyPoint: kp-test-is-script
    prompt:
      en: "What does the test runner (pytest) do with a test like this?"
      ru: "Что тест-раннер (pytest) делает с таким тестом?"
    code: |
      def test_registered_user_can_log_in(page: Page):
          page.goto("/login")
          page.get_by_label("Email").fill("anna@bloomly.app")
          page.get_by_label("Password").fill("bloom123")
          page.get_by_role("button", name="Log in").click()
          expect(page).to_have_url("http://localhost:3000/account")
    options:
      - text:
          en: "Opens a browser, performs the steps one by one, checks the expected result and reports pass or fail."
          ru: "Открывает браузер, выполняет шаги по очереди, проверяет ожидаемый результат и сообщает: прошёл тест или упал."
        correct: true
        why:
          en: "Exactly what you do with a test case — only automatically."
          ru: "Ровно то же, что ты делаешь с тест-кейсом, — только автоматически."
      - text:
          en: "Sends the code to a tester to run it by hand."
          ru: "Отправляет код тестировщику, чтобы тот прошёл его руками."
        why:
          en: "The whole point is that nobody has to click through it."
          ru: "Весь смысл в том, что никому не нужно прокликивать это вручную."
      - text:
          en: "Only checks the code for typos."
          ru: "Только проверяет код на опечатки."
        why:
          en: "It really runs the test against the app."
          ru: "Он по-настоящему запускает тест на приложении."
      - text:
          en: "Generates new test cases from the code."
          ru: "Генерирует из кода новые тест-кейсы."
        why:
          en: "Test cases come from you. The runner executes them."
          ru: "Тест-кейсы придумываешь ты. Раннер их выполняет."
    hints:
      - en: "Think of the runner as a very fast, very literal tester."
        ru: "Представь раннер как очень быстрого и очень буквального тестировщика."
      - en: "What happens to each line, and what do you get at the end?"
        ru: "Что происходит с каждой строкой и что получаешь в конце?"
    explain:
      en: "The test runner (pytest, with Playwright driving the browser) runs the steps in a real browser, checks the assertions and prints a report: passed or failed, with details."
      ru: "Тест-раннер (pytest, а браузером управляет Playwright) выполняет шаги в настоящем браузере, сверяет ожидаемые результаты и выводит отчёт: прошёл тест или упал, с подробностями."
