id: c1-l2
chapter: c1
title:
  en: "Anatomy of a test: steps become actions"
  ru: "Анатомия теста: шаги становятся действиями"
goal:
  en: "Read a test line by line and match each line to a test-case step: which element, what to do, which data."
  ru: "Читать тест построчно и сопоставлять каждую строку с шагом тест-кейса: какой элемент, что сделать, какие данные."
minutes: 9
keyPoints:
  - id: kp-test-block
    title:
      en: "def test_…(page: Page) is a test case: a name and steps"
      ru: "def test_…(page: Page) — это тест-кейс: название и шаги"
  - id: kp-goto
    title:
      en: "page.goto(\"/login\") opens the page"
      ru: "page.goto(\"/login\") открывает страницу"
  - id: kp-actions
    title:
      en: "fill, click, check, select_option are the step verbs"
      ru: "fill, click, check, select_option — глаголы шагов"
  - id: kp-locator-intro
    title:
      en: "A locator says which element: get_by_label, get_by_role"
      ru: "Локатор говорит, какой элемент: get_by_label, get_by_role"
terms: [test-step, action, locator, test-file, test-data, precondition, test-case]

steps:
  - type: story
    lines:
      - who: maya
        text:
          en: "Yesterday you saw a whole test. Today we read it line by line — the same way you read a test case, step by step."
          ru: "Вчера ты {увидела|увидел} тест целиком. Сегодня читаем его построчно — так же, как ты читаешь тест-кейс, шаг за шагом."
      - who: petal
        text:
          en: "I wrote twelve login tests overnight! Could you check that the steps are right? I'm sure they are."
          ru: "За ночь я написал двенадцать тестов на логин! Проверишь, что шаги правильные? Я уверен, что да."
      - who: mochi
        text:
          en: "Mrrp!"
          ru: "Мрр!"

  - type: pretest
    intro:
      en: "Quick guess before we start. Wrong answers are fine — they help you remember."
      ru: "Быстрая догадка перед началом. Ошибаться можно — так лучше запоминается."
    items:
      - id: c1-l2-p1
        kind: choice
        keyPoint: kp-actions
        prompt:
          en: "The manual step says: \"Enter email anna@bloomly.app\". Which line of code does that?"
          ru: "Ручной шаг: «Ввести email anna@bloomly.app». Какая строка кода это делает?"
        options:
          - text: 'page.get_by_label("Email").fill("anna@bloomly.app")'
            correct: true
            why:
              en: "`fill` types the value into the field, like you do with the keyboard."
              ru: "`fill` вводит значение в поле, как ты делаешь это с клавиатуры."
          - text: 'page.get_by_label("Email").click("anna@bloomly.app")'
            why:
              en: "`click` only clicks. It doesn't type anything."
              ru: "`click` только кликает. Он ничего не вводит."
          - text: 'page.goto("anna@bloomly.app")'
            why:
              en: "`goto` opens a page address, not a field."
              ru: "`goto` открывает адрес страницы, а не поле."
        optionsCode: true
        hints:
          - en: "Which word means \"type into a field\"?"
            ru: "Какое слово значит «ввести в поле»?"
          - en: "In English you \"fill in\" a form."
            ru: "По-английски форму «fill in» — заполняют."
        explain:
          en: 'Typing data into a field is `fill`. The field is found by its label: `get_by_label("Email")`.'
          ru: 'Ввод данных в поле — это `fill`. Поле находим по его подписи: `get_by_label("Email")`.'
      - id: c1-l2-p2
        kind: choice
        keyPoint: kp-locator-intro
        prompt:
          en: "In `page.get_by_label(\"Email\")`, what is 'Email'?"
          ru: "Что такое 'Email' в `page.get_by_label(\"Email\")`?"
        options:
          - text:
              en: "The label of the field — it tells the test which element to use"
              ru: "Подпись поля — она говорит тесту, с каким элементом работать"
            correct: true
            why:
              en: "Like \"the Email field\" in a test case step."
              ru: "Как «поле Email» в шаге тест-кейса."
          - text:
              en: "The text to type into the field"
              ru: "Текст, который нужно ввести в поле"
            why:
              en: "The text to type goes into `fill(...)`, after the locator."
              ru: "Текст для ввода идёт в `fill(...)`, после локатора."
          - text:
              en: "The name of the test"
              ru: "Название теста"
            why:
              en: "The test name comes right after `def`, like `def test_registered_user_can_log_in`."
              ru: "Название теста стоит сразу после `def`, например `def test_registered_user_can_log_in`."
        hints:
          - en: "\"get_by\" means \"find by\"."
            ru: "«get_by» значит «найти по»."
          - en: "What text is next to the input on the login page?"
            ru: "Какой текст стоит рядом с полем на странице входа?"
        explain:
          en: '`get_by_label("Email")` finds the field whose label is "Email". It answers the question "which element?".'
          ru: '`get_by_label("Email")` находит поле с подписью «Email». Это ответ на вопрос «какой элемент?».'

  - type: theory
    keyPoint: kp-test-block
    title:
      en: "A test function is your test case"
      ru: "Тестовая функция — это твой тест-кейс"
    figure: test-anatomy
    body:
      - en: "A [[test file|test-file]] such as `tests/test_login.py` is like a folder of test cases in your TMS. Each `def test_…` inside it is one [[test case|test-case]]."
        ru: "[[Файл с тестами|test-file]] вроде `tests/test_login.py` — как папка тест-кейсов в твоей TMS. Каждый `def test_…` внутри — один [[тест-кейс|test-case]]."
      - en: "`def test_registered_user_can_log_in(page: Page):` — first the name, then a colon, then the steps. Each step is one line, indented by four spaces: the indent shows that the line belongs to this test."
        ru: "`def test_registered_user_can_log_in(page: Page):` — сначала название, потом двоеточие, потом шаги. Каждый шаг — одна строка с отступом в четыре пробела: отступ показывает, что строка относится к этому тесту."
      - en: "The name is the test case title in English, words joined by underscores: `test_registered_user_can_log_in`, not `test_1`. pytest runs every function whose name starts with `test_`, and in a report the name is all people see."
        ru: "Имя теста — это название тест-кейса по-английски, слова через подчёркивание: `test_registered_user_can_log_in`, а не `test_1`. pytest запускает каждую функцию, чьё имя начинается с `test_`, а в отчёте люди видят только это имя."
    code: |
      def test_registered_user_can_log_in(page: Page):
          # steps go here: one line per step,
          # each indented by four spaces
          page.goto("/login")
    mentor:
      en: "`def` means \"define\": here we define a test. `page` in brackets is the browser tab the test works in. You don't open it yourself — pytest sees that the test asks for `page` and hands it a fresh tab. `: Page` just names what kind of thing it is; we'll look closer in chapter 3."
      ru: "`def` — от «define», «определить»: здесь мы определяем тест. `page` в скобках — вкладка браузера, в которой работает тест. Открывать её не нужно: pytest видит, что тест просит `page`, и выдаёт ему новую вкладку. `: Page` просто подсказывает, что это за штука; подробнее разберём в третьей главе."

  - type: theory
    keyPoint: kp-goto
    title:
      en: "Step 1: open the page"
      ru: "Шаг 1: открыть страницу"
    body:
      - en: '"Open the login page" is `page.goto("/login")`. You write only the path; the runner (pytest) takes the site address (`http://localhost:3000`) from the project settings.'
        ru: '«Открыть страницу входа» — это `page.goto("/login")`. Пишешь только путь, а адрес сайта (`http://localhost:3000`) раннер (pytest) возьмёт из настроек проекта.'
      - en: "Every test starts in a fresh, empty browser tab: nobody is logged in, the cart is empty. So the first step is almost always `goto`."
        ru: "Каждый тест начинается в новой пустой вкладке: никто не вошёл, корзина пуста. Поэтому первый шаг почти всегда `goto`."
      - en: "Steps run top to bottom, one at a time: each line finishes its step before the next one starts. So the order of the lines is the order of the steps in your test case."
        ru: "Шаги выполняются сверху вниз, по одному: каждая строка доводит свой шаг до конца, и только потом начинается следующая. Поэтому порядок строк — это порядок шагов в твоём тест-кейсе."
    code: |
      page.goto("/login")  # Open the login page
      page.goto("/shop")  # Open the shop
      page.goto("/cart")  # Open the cart

  - type: theory
    keyPoint: kp-actions
    title:
      en: "Step verbs become actions"
      ru: "Глаголы шагов становятся действиями"
    body:
      - en: "In a test case you write: enter, click, tick, choose. In code these are [[actions|action]]: `fill`, `click`, `check`, `select_option`."
        ru: "В тест-кейсе ты пишешь: ввести, нажать, отметить, выбрать. В коде это [[действия|action]]: `fill`, `click`, `check`, `select_option`."
      - en: 'The value in brackets is your [[test data|test-data]]: `fill("anna@bloomly.app")`, `select_option("Portugal")`. Same data as in the "Data" column of your test case.'
        ru: 'Значение в скобках — твои [[тестовые данные|test-data]]: `fill("anna@bloomly.app")`, `select_option("Portugal")`. Те же данные, что в колонке «Данные» тест-кейса.'
    code: |
      page.get_by_label("Email").fill("anna@bloomly.app")  # Enter email
      page.get_by_role("button", name="Log in").click()  # Click "Log in"
      page.get_by_label("Remember me").check()  # Tick "Remember me"
      page.get_by_label("Country").select_option("Portugal")  # Choose a country

  - type: theory
    keyPoint: kp-locator-intro
    title:
      en: "A locator says which element"
      ru: "Локатор говорит, какой элемент"
    body:
      - en: "Before the action comes the [[locator|locator]]: *which* element. In a test case you'd write \"the Email field\" or \"the Log in button\". Code says the same."
        ru: "Перед действием стоит [[локатор|locator]]: *какой* элемент. В тест-кейсе ты пишешь «поле Email» или «кнопка Log in». Код говорит то же самое."
      - en: '`page.get_by_label("Email")` is the field labelled Email. `page.get_by_role("button", name="Log in")` is the button called "Log in".'
        ru: '`page.get_by_label("Email")` — поле с подписью Email. `page.get_by_role("button", name="Log in")` — кнопка с названием «Log in».'
      - en: "Use the exact words users see. If the label says \"Email\", a locator for \"E-mail\" finds nothing."
        ru: "Используй точные слова, которые видит пользователь. Если подпись «Email», локатор для «E-mail» ничего не найдёт."
    mentor:
      en: 'Why not just `get_by_text("Log in")`? On the login page that text appears three times: the heading, the menu link and the button. Playwright refuses to guess. `get_by_role("button", ...)` points at exactly one.'
      ru: 'Почему не просто `get_by_text("Log in")`? На странице входа этот текст встречается трижды: заголовок, ссылка в меню и кнопка. Playwright не станет угадывать. `get_by_role("button", ...)` указывает ровно на одну.'

  - type: example
    keyPoint: kp-actions
    title:
      en: "All four step verbs in one test"
      ru: "Все четыре глагола в одном тесте"
    intro:
      en: "A sign-up test: every line is locator + action + data. Read the notes, then run it."
      ru: "Тест регистрации: каждая строка — локатор + действие + данные. Прочитай пояснения и запусти."
    code: |
      from playwright.sync_api import Page, expect


      def test_new_customer_can_create_an_account(page: Page):
          page.goto("/signup")
          page.get_by_label("Full name").fill("Lena Novak")
          page.get_by_label("Email").fill("lena@bloomly.app")
          page.get_by_label("Password").fill("spring2026")
          page.get_by_label("Country").select_option("Poland")
          page.get_by_label("I agree to the Terms of Service").check()
          page.get_by_role("button", name="Create account").click()
          expect(page.get_by_role("heading", name="Account created!")).to_be_visible()
    notes:
      - lines: 1
        text:
          en: "Brings in `Page` and `expect` from Playwright. Test files usually start like this."
          ru: "Подключает `Page` и `expect` из Playwright. Так обычно начинаются файлы с тестами."
      - lines: 4
        text:
          en: "The test name = the test case title: what behaviour we check. `page` is the fresh tab pytest hands to the test."
          ru: "Название теста = название тест-кейса: какое поведение проверяем. `page` — новая вкладка, которую pytest выдаёт тесту."
      - lines: 5
        text:
          en: "Step 1: open the sign-up page."
          ru: "Шаг 1: открыть страницу регистрации."
      - lines: [6, 7, 8]
        text:
          en: "Enter name, email and password: locator `get_by_label(...)` + action `fill(...)` + test data."
          ru: "Ввести имя, email и пароль: локатор `get_by_label(...)` + действие `fill(...)` + тестовые данные."
      - lines: 9
        text:
          en: "Choose Poland in the Country dropdown: `select_option`."
          ru: "Выбрать Poland в выпадающем списке Country: `select_option`."
      - lines: 10
        text:
          en: "Tick the terms checkbox: `check`."
          ru: "Отметить чекбокс с условиями: `check`."
      - lines: 11
        text:
          en: 'Click the "Create account" button: `click`.'
          ru: "Нажать кнопку «Create account»: `click`."
      - lines: 12
        text:
          en: "The expected result. That's the next lesson."
          ru: "Ожидаемый результат. Это тема следующего урока."
    runnable: true

  - type: task
    task:
      id: c1-l2-t1
      kind: match
      keyPoint: kp-actions
      prompt:
        en: "Match each manual step with its line of code."
        ru: "Сопоставь каждый ручной шаг со строкой кода."
      pairs:
        - left: { en: "Open the sign-up page", ru: "Открыть страницу регистрации" }
          right: 'page.goto("/signup")'
        - left: { en: "Enter password bloom123", ru: "Ввести пароль bloom123" }
          right: 'page.get_by_label("Password").fill("bloom123")'
        - left: { en: "Click \"Log in\"", ru: "Нажать «Log in»" }
          right: 'page.get_by_role("button", name="Log in").click()'
        - left: { en: "Tick \"Remember me\"", ru: "Отметить «Remember me»" }
          right: 'page.get_by_label("Remember me").check()'
        - left: { en: "Choose the country Portugal", ru: "Выбрать страну Portugal" }
          right: 'page.get_by_label("Country").select_option("Portugal")'
      rightCode: true
      hints:
        - en: "Look at the verb at the end of each line."
          ru: "Смотри на глагол в конце каждой строки."
        - en: "goto = open, fill = enter, click = click, check = tick, select_option = choose."
          ru: "goto = открыть, fill = ввести, click = нажать, check = отметить, select_option = выбрать."
      praise:
        en: "Five for five. You already speak both languages: test case and code."
        ru: "Пять из пяти. Ты уже говоришь на обоих языках: тест-кейсов и кода."
      explain:
        en: "Every manual step verb has a code twin. The locator before it says which element; the value inside the brackets is the test data."
        ru: "У каждого глагола ручного шага есть двойник в коде. Локатор перед ним говорит, какой элемент, а значение в скобках — тестовые данные."

  - type: task
    task:
      id: c1-l2-t2
      kind: fill
      keyPoint: kp-actions
      prompt:
        en: "Fill the gaps so the test follows TC-001 step by step."
        ru: "Заполни пропуски, чтобы тест шёл по TC-001 шаг за шагом."
      code: |
        def test_registered_user_can_log_in(page: Page):
            page.___("/login")
            page.get_by_label("Email").___("anna@bloomly.app")
            page.get_by_label("Password").___("bloom123")
            page.get_by_role("button", name="Log in").___()
            expect(page).to_have_url("http://localhost:3000/account")
      blanks:
        - { answers: [goto], options: [goto, open, navigate] }
        - { answers: [fill], options: [fill, click, enter] }
        - { answers: [fill], options: [fill, check, select_option] }
        - { answers: [click], options: [click, check, fill] }
      checks: { expect: pass }
      hints:
        - en: "Open → enter → enter → click."
          ru: "Открыть → ввести → ввести → нажать."
        - en: "Playwright opens pages with `goto`. `open` and `navigate` don't exist on `page`."
          ru: "Playwright открывает страницы через `goto`. `open` и `navigate` у `page` нет."
        - en: "goto, fill, fill, click."
          ru: "goto, fill, fill, click."
      praise:
        en: "Green test, and every word in it is yours."
        ru: "Зелёный тест, и каждое слово в нём — твоё."
      explain:
        en: "`goto` opens the page, `fill` types into the two fields, `click` presses the button. The last line checks that the account page opened."
        ru: "`goto` открывает страницу, `fill` вводит данные в два поля, `click` нажимает кнопку. Последняя строка проверяет, что открылась страница аккаунта."

  - type: task
    task:
      id: c1-l2-t3
      kind: parsons
      keyPoint: kp-test-block
      prompt:
        en: "Petal's lines got shuffled. Put them in order to build the test for TC-002. One line doesn't belong."
        ru: "Строки Petal перемешались. Расставь их по порядку, чтобы собрать тест для TC-002. Одна строка лишняя."
      testCase:
        id: TC-002
        title: Wrong password shows an error
        preconditions: ["User anna@bloomly.app exists", "The user is logged out"]
        steps:
          - action: "Open the login page"
          - action: "Enter email"
            data: "anna@bloomly.app"
          - action: "Enter password"
            data: "wrong-pass"
          - action: "Click \"Log in\""
            expected: "Error \"Invalid email or password.\" is shown"
      lines:
        - "def test_wrong_password_shows_an_error(page: Page):"
        - '    page.goto("/login")'
        - '    page.get_by_label("Email").fill("anna@bloomly.app")'
        - '    page.get_by_label("Password").fill("wrong-pass")'
        - '    page.get_by_role("button", name="Log in").click()'
        - '    expect(page.get_by_role("alert")).to_have_text("Invalid email or password.")'
      alt: [[0, 1, 3, 2, 4, 5]]
      distractors: ['    page.get_by_label("Password").fill("bloom123")']
      checks: { expect: pass }
      hints:
        - en: "A test starts with the `def test_…` line. The steps go under it, indented, in the test case order."
          ru: "Тест начинается со строки `def test_…`. Шаги идут под ней, с отступом, в порядке тест-кейса."
        - en: "Check the test data: which password does TC-002 use?"
          ru: "Проверь тестовые данные: какой пароль в TC-002?"
        - en: "The line with `bloom123` is the extra one — it's the real password."
          ru: "Лишняя — строка с `bloom123`: это настоящий пароль."
      praise:
        en: "Right order and right data — you didn't fall for the real password."
        ru: "Правильный порядок и правильные данные — на настоящий пароль ты не {купилась|купился}."
      explain:
        en: "The `def` line with the name first, then the indented steps in the test case order, then the check. Email and password can swap places — both orders work. The `bloom123` line is happy-path data and would break this negative test."
        ru: "Сначала строка `def` с названием, потом шаги с отступом в порядке тест-кейса, затем проверка. Email и пароль можно поменять местами — работают оба порядка. Строка с `bloom123` — данные позитивного сценария, она сломала бы этот негативный тест."

  - type: task
    task:
      id: c1-l2-t4
      kind: fill
      keyPoint: kp-locator-intro
      prompt:
        en: "Fill in the locators — this time without options."
        ru: "Впиши локаторы — на этот раз без вариантов."
      context:
        en: "Email is a field with a label. \"Log in\" is a button."
        ru: "Email — поле с подписью. «Log in» — кнопка."
      code: |
        def test_registered_user_can_log_in(page: Page):
            page.goto("/login")
            page.___("Email").fill("anna@bloomly.app")
            page.get_by_label("Password").fill("bloom123")
            page.get_by_role("___", name="Log in").click()
            expect(page).to_have_url("http://localhost:3000/account")
      blanks:
        - { answers: [get_by_label] }
        - { answers: [button] }
      checks: { expect: pass }
      hints:
        - en: "Look at the line with the password — it uses the same kind of locator as the email."
          ru: "Посмотри на строку с паролем — там такой же локатор, как нужен для email."
        - en: '`get_by_role` needs the type of element: is "Log in" a link, a heading or a button?'
          ru: "`get_by_role` нужен тип элемента: «Log in» — это ссылка, заголовок или кнопка?"
        - en: "get_by_label and button."
          ru: "get_by_label и button."
      praise:
        en: "From memory, no options — the locators are sticking."
        ru: "По памяти, без подсказок-вариантов — локаторы запоминаются."
      explain:
        en: 'Form fields are found by their label: `get_by_label("Email")`. Buttons by role and name: `get_by_role("button", name="Log in")`.'
