        await page.getByRole('button', { name: 'Create account' }).click();
        await expect(page.getByRole('heading', { name: 'Account created!' })).toBeVisible();
      });
    issues:
      - line: 6
        type: wrong-data
        note:
          en: "TC-006 says Poland, the code chooses Portugal."
          ru: "В TC-006 указана Poland, а код выбирает Portugal."
      - line: 7
        type: wrong-step
        note:
          en: "The step is \"tick the Terms of Service\", but the code ticks the newsletter. Without the terms, sign-up fails."
          ru: "Шаг — «отметить условия использования», а код отмечает рассылку. Без принятия условий регистрация не пройдёт."
    types: [wrong-data, wrong-step, no-assertion, hallucination]
    hints:
      - en: "Check each data value and each checkbox against the test case."
        ru: "Сверь каждое значение и каждый чекбокс с тест-кейсом."
      - en: "Two lines: one has the wrong country, one ticks the wrong box."
        ru: "Две строки: в одной не та страна, в другой не тот чекбокс."
    explain:
      en: "Line 6 has the wrong data, line 7 performs a different step. Both look plausible — only a comparison with the test case reveals them."
      ru: "В строке 6 неверные данные, строка 7 выполняет другой шаг. Обе выглядят правдоподобно — выдаёт их только сравнение с тест-кейсом."

  - id: c1-l2-k6
    kind: predict
    keyPoint: kp-locator-intro
    prompt:
      en: "Will this test pass or fail?"
      ru: "Этот тест пройдёт или упадёт?"
    context:
      en: "On the login page, \"Log in\" is the heading, the menu link and the button text."
      ru: "На странице входа «Log in» — это заголовок, ссылка в меню и текст кнопки."
    code: |
      test('registered user can log in', async ({ page }) => {
        await page.goto('/login');
        await page.getByLabel('Email').fill('anna@bloomly.app');
        await page.getByLabel('Password').fill('bloom123');
        await page.getByText('Log in').click();
        await expect(page).toHaveURL('/account');
      });
    outcome: fail
    reasons:
      - text:
          en: "`getByText('Log in')` matches three elements. Playwright won't guess which one to click and stops the test."
          ru: "`getByText('Log in')` находит три элемента. Playwright не станет угадывать, на какой кликнуть, и останавливает тест."
        correct: true
      - text:
          en: "It passes: Playwright clicks the first match."
          ru: "Пройдёт: Playwright кликнет по первому совпадению."
        why:
          en: "Playwright is strict: if a locator matches several elements, an action fails."
          ru: "Playwright строгий: если локатор находит несколько элементов, действие падает."
    hints:
      - en: "How many elements on the page contain the text \"Log in\"?"
        ru: "Сколько элементов на странице содержат текст «Log in»?"
      - en: "Would a manual step \"click Log in\" be clear if there were three of them?"
        ru: "Был бы понятен ручной шаг «нажать Log in», если их три?"
    explain:
      en: "The locator is ambiguous: heading, menu link and button all say \"Log in\". Playwright reports a strict mode violation instead of guessing. `getByRole('button', { name: 'Log in' })` points at exactly one."
      ru: "Локатор неоднозначный: заголовок, ссылка в меню и кнопка — все «Log in». Playwright сообщает о нарушении strict mode вместо того, чтобы угадывать. `getByRole('button', { name: 'Log in' })` указывает ровно на одну."

