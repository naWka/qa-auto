      en: "Petal didn't finish the name: the test is called just `test_`. Which name fits this test best?"
      ru: "Petal не дописал название: тест называется просто `test_`. Какое название лучше всего подходит этому тесту?"
    code: |
      def test_(page: Page):
          page.goto("/login")
          page.get_by_label("Email").fill("locked@bloomly.app")
          page.get_by_label("Password").fill("bloom123")
          page.get_by_role("button", name="Log in").click()
          expect(page.get_by_role("alert")).to_have_text("Your account is locked. Please contact support.")
    options:
      - text: "test_locked_user_sees_an_error_message"
        correct: true
        why:
          en: "Describes the behaviour: who does what and what should happen."
          ru: "Описывает поведение: кто что делает и что должно произойти."
      - text: "test_3"
        why:
          en: "Says nothing. In a red report nobody knows what broke."
          ru: "Ничего не говорит. В красном отчёте никто не поймёт, что сломалось."
      - text: "test_login"
        why:
          en: "Too vague — there are a dozen login tests."
          ru: "Слишком размыто — тестов на логин десяток."
      - text: "test_check_that_everything_works"
        why:
          en: "No test checks \"everything\". Name the specific behaviour."
          ru: "Ни один тест не проверяет «всё». Назови конкретное поведение."
    optionsCode: true
    hints:
      - en: "Who logs in here, and what is expected?"
        ru: "Кто здесь входит и что ожидается?"
      - en: "A good test name reads like a test case title."
        ru: "Хорошее название теста читается как название тест-кейса."
    explain:
      en: "The test name is the test case title. In the report, `test_locked_user_sees_an_error_message` tells everyone exactly what this test protects."
      ru: "Название теста — это название тест-кейса. `test_locked_user_sees_an_error_message` в отчёте сразу говорит всем, что защищает этот тест."
