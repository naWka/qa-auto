      mode: match
      prompt:
        en: "Match the terms with their meanings."
        ru: "Сопоставь термины с их значениями."
      terms: [test-step, action, locator, test-data]

  - type: task
    task:
      id: c1-l2-t6
      kind: review
      keyPoint: kp-actions
      context:
        en: "Petal: \"TC-003 is ready, all steps included!\""
        ru: "Petal: «TC-003 готов, все шаги на месте!»"
      prompt:
        en: "Compare the code with TC-003. Flag the problems. If a step is missing from the whole test, flag line 0."
        ru: "Сравни код с TC-003. Отметь проблемы. Если какого-то шага нет во всём тесте, отметь строку 0."
      testCase:
        id: TC-003
        title: User can log in with "Remember me"
        preconditions: ["User tom@bloomly.app / tulips42 exists", "The user is logged out"]
        steps:
          - action: "Open the login page"
          - action: "Enter email"
            data: "tom@bloomly.app"
          - action: "Enter password"
            data: "tulips42"
          - action: "Tick \"Remember me\""
          - action: "Click \"Log in\""
            expected: "The account page shows \"Welcome back, Tom!\""
      code: |
        from playwright.sync_api import Page, expect


        def test_user_can_log_in_with_remember_me(page: Page):
            page.goto("/login")
            page.get_by_label("Email").fill("tom@bloomly.app")
            page.get_by_label("Password").fill("tulips24")
            page.get_by_role("button", name="Log in").click()
            expect(page.get_by_role("heading", name="Welcome back, Tom!")).to_be_visible()
      issues:
        - line: 7
          type: wrong-data
          note:
            en: "Tom's password in TC-003 is \"tulips42\", not \"tulips24\". Swapped digits — a classic."
            ru: "Пароль Тома в TC-003 — «tulips42», а не «tulips24». Переставленные цифры — классика."
        - line: 0
          type: wrong-step
          note:
            en: "Step 4 \"Tick Remember me\" is missing. Without it the test doesn't check what its name promises."
            ru: "Нет шага 4 «Отметить Remember me». Без него тест не проверяет то, что обещает его название."
      types: [wrong-data, wrong-step, no-assertion, hallucination]
      hints:
        - en: "Count the steps in TC-003 and the step lines in the code."
          ru: "Посчитай шаги в TC-003 и строки-шаги в коде."
        - en: "One step has no line at all. And look closely at the digits in the data."
          ru: "Для одного шага строки нет вообще. И присмотрись к цифрам в данных."
        - en: "Line 7 has the wrong password; the \"Remember me\" step is missing (line 0)."
          ru: "В строке 7 неверный пароль; шага «Remember me» нет (строка 0)."
      praise:
        en: "You caught a missing step — the hardest thing to notice, because there's nothing to look at."
        ru: "Ты {заметила|заметил} пропущенный шаг — это сложнее всего, ведь смотреть не на что."
      explain:
        en: "The name ends in `with_remember_me`, but no line ticks the checkbox — the test checks a plain login. And \"tulips24\" would make login fail. Comparing step by step with the test case catches both."
        ru: "Название заканчивается на `with_remember_me`, но ни одна строка не ставит галочку — тест проверяет обычный вход. А с «tulips24» вход не пройдёт. Пошаговое сравнение с тест-кейсом ловит обе проблемы."

  - type: task
    task:
      id: c1-l2-t7
      kind: predict
      keyPoint: kp-locator-intro
      context:
        en: "On the Bloomly login page the field label is \"Email\"."
        ru: "На странице входа Bloomly подпись поля — «Email»."
      prompt:
        en: "Petal wrote this test. Will it pass or fail?"
        ru: "Petal написал этот тест. Он пройдёт или упадёт?"
      code: |
        def test_registered_user_can_log_in(page: Page):
            page.goto("/login")
            page.get_by_label("E-mail").fill("anna@bloomly.app")
            page.get_by_label("Password").fill("bloom123")
            page.get_by_role("button", name="Log in").click()
            expect(page).to_have_url("http://localhost:3000/account")
      outcome: fail
      reasons:
        - text:
            en: "No field is labelled \"E-mail\". The runner waits for it, gives up after the timeout and the test fails on line 3."
            ru: "Поля с подписью «E-mail» нет. Раннер ждёт его, сдаётся по тайм-ауту, и тест падает на строке 3."
          correct: true
        - text:
            en: "It passes: Playwright understands that E-mail and Email are the same."
            ru: "Пройдёт: Playwright понимает, что E-mail и Email — одно и то же."
          why:
            en: "Locators are literal. A hyphen is enough to find nothing."
            ru: "Локаторы буквальны. Одного дефиса достаточно, чтобы ничего не найти."
        - text:
            en: "It fails because the password is wrong."
            ru: "Упадёт, потому что пароль неверный."
          why:
            en: "bloom123 is Anna's real password. The test never gets that far."
            ru: "bloom123 — настоящий пароль Анны. До него тест даже не дойдёт."
      hints:
        - en: "Compare the label in the code with the label on the page."
          ru: "Сравни подпись в коде с подписью на странице."
        - en: "Does \"E-mail\" equal \"Email\" letter by letter?"
          ru: "Совпадает ли «E-mail» с «Email» буква в букву?"
      praise:
        en: "Good eye: one hyphen, one failed test."
        ru: "Зоркий глаз: один дефис — один упавший тест."
      explain:
        en: "A locator must match what's on the page. `get_by_label(\"E-mail\")` finds nothing, so `fill` waits and fails with a timeout. Agents often \"normalise\" labels like this — check them against the real page."
        ru: 'Локатор должен совпадать с тем, что на странице. `get_by_label("E-mail")` ничего не находит, `fill` ждёт и падает по тайм-ауту. Агенты часто так «нормализуют» подписи — сверяй их с реальной страницей.'

  - type: mistakes
    keyPoint: kp-actions
    title:
      en: "Typical mistakes in steps (agents make them too)"
      ru: "Типичные ошибки в шагах (агенты их тоже делают)"
    items:
      - wrong: 'page.get_by_label("Email").click("anna@bloomly.app")'
        right: 'page.get_by_label("Email").fill("anna@bloomly.app")'
        why:
          en: "`click` only clicks. To type data into a field, use `fill`."
          ru: "`click` только кликает. Чтобы ввести данные в поле, нужен `fill`."
      - wrong: 'page.get_by_text("Log in").click()'
        right: 'page.get_by_role("button", name="Log in").click()'
        why:
          en: "\"Log in\" appears three times on the page: heading, menu link, button. Say which one: the button."
          ru: "«Log in» на странице трижды: заголовок, ссылка в меню, кнопка. Скажи, какой именно: кнопка."
      - wrong: 'page.open("/login")'
        right: 'page.goto("/login")'
        why:
          en: "`page.open` doesn't exist. Agents sometimes invent methods that sound right."
          ru: "`page.open` не существует. Агенты иногда придумывают методы, которые звучат правдоподобно."
      - wrong: 'page.get_by_label("Country").fill("Portugal")'
        right: 'page.get_by_label("Country").select_option("Portugal")'
        why:
          en: "Country is a dropdown. You choose an option, you don't type into it."
          ru: "Country — выпадающий список. В нём выбирают вариант, а не вводят текст."

  - type: explain
    keyPoint: kp-locator-intro
    prompt:
      en: "In your own words: how does the manual step \"Enter email anna@bloomly.app\" become a line of code?"
      ru: "Своими словами: как ручной шаг «Ввести email anna@bloomly.app» превращается в строку кода?"
    model:
      en: "A step has three parts: which element, what to do, and the data. The locator `page.get_by_label(\"Email\")` is the element, the action `fill` is what to do, and `\"anna@bloomly.app\"` is the test data. Together: `page.get_by_label(\"Email\").fill(\"anna@bloomly.app\")` — the same step, written so the runner can do it."
      ru: "У шага три части: какой элемент, что сделать и какие данные. Локатор `page.get_by_label(\"Email\")` — элемент, действие `fill` — что сделать, `\"anna@bloomly.app\"` — тестовые данные. Вместе: `page.get_by_label(\"Email\").fill(\"anna@bloomly.app\")` — тот же шаг, записанный так, чтобы раннер мог его выполнить."

