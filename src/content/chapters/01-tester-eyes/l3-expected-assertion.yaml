id: c1-l3
chapter: c1
title:
  en: "The expected result becomes an assertion"
  ru: "Ожидаемый результат становится проверкой"
goal:
  en: "Turn an expected result into an assertion, spot tests that can't fail, and choose a check that matches the test case."
  ru: "Превращать ожидаемый результат в проверку, замечать тесты, которые не могут упасть, и выбирать проверку, которая соответствует тест-кейсу."
minutes: 9
keyPoints:
  - id: kp-expect
    title:
      en: "expect(...) checks the expected result"
      ru: "expect(...) проверяет ожидаемый результат"
  - id: kp-no-assertion
    title:
      en: "No assertion — no test: it can't fail"
      ru: "Нет проверки — нет теста: он не может упасть"
  - id: kp-what-to-assert
    title:
      en: "Assert exactly what the test case expects"
      ru: "Проверяй ровно то, что ожидает тест-кейс"
terms: [assertion, outage, wording, spot, turn-red, catch-a-bug, go-unnoticed]

steps:
  - type: story
    lines:
      - who: petal
        text:
          en: "Good news: all forty of my login tests are green!"
          ru: "Хорошие новости: все сорок моих тестов на логин зелёные!"
      - who: maya
        text:
          en: "Hmm. Kai says login was broken for an hour this morning. And all forty stayed green?"
          ru: "Хм. Кай говорит, что утром логин был сломан целый час. И все сорок остались зелёными?"
      - who: mochi
        text:
          en: "Mrrp?!"
          ru: "Мрр?!"
      - who: maya
        text:
          en: "Let's find out why. Spoiler: it's about the expected result."
          ru: "Давай разберёмся почему. Спойлер: всё дело в ожидаемом результате."

  - type: pretest
    intro:
      en: "Quick guess before we start. Wrong answers are fine — they help you remember."
      ru: "Быстрая догадка перед началом. Ошибаться можно — так лучше запоминается."
    items:
      - id: c1-l3-p1
        kind: predict
        keyPoint: kp-no-assertion
        app: { bugs: [login-redirect-home] }
        context:
          en: "Today's build has a bug: after logging in, users land on the home page instead of their account."
          ru: "В сегодняшней сборке баг: после входа пользователь попадает на главную, а не в аккаунт."
        prompt:
          en: "Will this test pass or fail on today's build?"
          ru: "Этот тест пройдёт или упадёт на сегодняшней сборке?"
        code: |
          def test_registered_user_can_log_in(page: Page):
              page.goto("/login")
              page.get_by_label("Email").fill("anna@bloomly.app")
              page.get_by_label("Password").fill("bloom123")
              page.get_by_role("button", name="Log in").click()
        outcome: pass
        reasons:
          - text:
              en: "Every step can be done, and nothing checks where the user lands — so nothing can fail."
              ru: "Все шаги выполнимы, а куда попал пользователь, никто не проверяет — значит, упасть нечему."
            correct: true
          - text:
              en: "It fails: the runner notices the wrong page."
              ru: "Упадёт: раннер заметит не ту страницу."
            why:
              en: "The runner only notices what the test tells it to check."
              ru: "Раннер замечает только то, что тест велит проверить."
        hints:
          - en: "Find the line that checks the result."
            ru: "Найди строку, которая проверяет результат."
          - en: "Is there an `expect` anywhere?"
            ru: "Есть ли где-нибудь `expect`?"
        explain:
          en: "There's no assertion. The test types, clicks and ends — green, even though login is broken. That's how Petal's forty tests stayed green this morning."
          ru: "Проверки нет. Тест вводит, кликает и заканчивается — зелёный, хотя вход сломан. Вот так сорок тестов Petal и остались зелёными сегодня утром."

  - type: theory
    keyPoint: kp-expect
    title:
      en: "Expected result → assertion"
      ru: "Ожидаемый результат → проверка"
    body:
      - en: "In a test case, a step can have an [[expected result|expected-result]]. You compare it with the [[actual result|actual-result]] and decide: OK or [[bug|bug]]."
        ru: "В тест-кейсе у шага может быть [[ожидаемый результат|expected-result]]. Ты сравниваешь его с [[фактическим|actual-result]] и решаешь: всё хорошо или [[баг|bug]]."
      - en: "In code that comparison is an [[assertion|assertion]]: `expect(what).to_something(expected)`. If the actual result differs, the test fails."
        ru: "В коде это сравнение — [[проверка|assertion]] (assertion): `expect(что).to_что_то(ожидаемое)`. Если фактический результат другой, тест падает."
      - en: "Read it as a sentence: \"I expect the page to have URL /account.\" \"I expect the alert to have text …\"."
        ru: "Читай как предложение: «Я ожидаю, что у страницы URL /account». «Я ожидаю, что в сообщении об ошибке текст …»."
    code: |
      # Expected: the account page opens
      expect(page).to_have_url("http://localhost:3000/account")

      # Expected: an error is shown
      expect(page.get_by_role("alert")).to_be_visible()

      # Expected: the error says "Invalid email or password."
      expect(page.get_by_role("alert")).to_have_text("Invalid email or password.")
    mentor:
      en: "`expect(page)` checks the whole page, like its URL. `expect(page.get_by_role(...))` checks one element — with the same locators you already use for steps. Python also has a plain `assert`, but for anything on the page, `expect` is the tool."
      ru: "`expect(page)` проверяет страницу целиком, например её URL. `expect(page.get_by_role(...))` проверяет один элемент — теми же локаторами, что ты уже используешь в шагах. В Python есть и обычный `assert`, но всё, что на странице, проверяют через `expect`."

  - type: theory
    keyPoint: kp-no-assertion
    title:
      en: "No assertion — no test"
      ru: "Нет проверки — нет теста"
    figure: red-green
    body:
      - en: "A test without an assertion only performs steps. It compares nothing, so it can't [[fail|fail]] — even when login is broken. Its green means nothing."
        ru: "Тест без проверки только выполняет шаги. Он ничего не сравнивает, поэтому не может [[упасть|fail]] — даже когда вход сломан. Его зелёный цвет ничего не значит."
      - en: "It's a test case with steps and no expected result. You'd never accept that in a review."
        ru: "Это тест-кейс с шагами, но без ожидаемого результата. Такой ты бы на ревью не {приняла|принял}."
      - en: "AI agents forget assertions surprisingly often, or leave a comment like `# should show an error` instead. Always ask: what would make this test red?"
        ru: "ИИ-агенты на удивление часто забывают проверки или оставляют вместо них комментарий вроде `# should show an error`. Всегда спрашивай: что сделает этот тест красным?"
    mentor:
      en: "My rule: before I trust a green test, I imagine the bug it should catch. If I can't imagine it turning red, it's not a test yet."
      ru: "Моё правило: прежде чем доверять зелёному тесту, я представляю баг, который он должен поймать. Если не могу представить его красным — это ещё не тест."

  - type: theory
    keyPoint: kp-what-to-assert
    title:
      en: "Assert what the test case says — not just anything"
      ru: "Проверяй то, что сказано в тест-кейсе, а не что-нибудь"
    body:
      - en: "The expected result is your spec. \"The account page shows 'Welcome back, Anna!'\" means: check that exact heading, not \"some heading is visible\"."
        ru: "Ожидаемый результат — твоя спецификация. «На странице аккаунта написано „Welcome back, Anna!“» значит: проверить именно этот заголовок, а не «какой-то заголовок виден»."
      - en: "Weak checks pass on broken apps: only the URL (while the greeting says \"Silva\"), \"Welcome back\" without the name, \"an error is visible\" without its text."
        ru: "Слабые проверки проходят на сломанном приложении: только URL (а в приветствии «Silva»), «Welcome back» без имени, «ошибка видна» без её текста."
      - en: "Pick the matcher from the wording: a text → `to_have_text`, a page opens → `to_have_url`, something is shown → `to_be_visible`."
        ru: "Выбирай метод проверки по формулировке: текст → `to_have_text`, открывается страница → `to_have_url`, что-то показано → `to_be_visible`."
    code: |
      # Not enough on its own: passes even if the greeting is wrong
      expect(page).to_have_url("http://localhost:3000/account")

      # Matches TC-001: the page AND the exact greeting
      expect(page).to_have_url("http://localhost:3000/account")
      expect(page.get_by_role("heading", name="Welcome back, Anna!")).to_be_visible()

  - type: mapping
    keyPoint: kp-expect
    title:
      en: "TC-002: the expected result in code"
      ru: "TC-002: ожидаемый результат в коде"
    intro:
      en: "The expected result of step 4 has two parts — and each part gets its own assertion."
      ru: "У ожидаемого результата шага 4 две части — и у каждой своя проверка."
    testCase:
      id: TC-002
      title: Wrong password shows an error
      preconditions: ["User anna@bloomly.app exists", "The user is logged out"]
      steps:
        - action: "Open the login page"
        - action: "Enter email"
          data: "anna@bloomly.app"
        - action: "Enter password"
          data: "wrong-pass"
        - action: "Click \"Log in\""
          expected: "Error \"Invalid email or password.\" is shown; the user stays on the login page"
    code: |
      from playwright.sync_api import Page, expect


      def test_wrong_password_shows_an_error(page: Page):
          page.goto("/login")
          page.get_by_label("Email").fill("anna@bloomly.app")
          page.get_by_label("Password").fill("wrong-pass")
          page.get_by_role("button", name="Log in").click()
          expect(page.get_by_role("alert")).to_have_text("Invalid email or password.")
          expect(page).to_have_url("http://localhost:3000/login")
    links:
      - { from: s1, lines: [5] }
      - { from: s2, lines: [6] }
      - { from: s3, lines: [7] }
      - { from: s4, lines: [8] }
      - { from: e4, lines: [9, 10] }

  - type: task
    task:
      id: c1-l3-t1
      kind: choice
      keyPoint: kp-expect
      prompt:
        en: "Expected result: \"The error 'Please enter your email.' is shown.\" Which assertion checks it fully?"
        ru: "Ожидаемый результат: «Показана ошибка „Please enter your email.“». Какая проверка проверяет его полностью?"
      options:
        - text: 'expect(page.get_by_role("alert")).to_have_text("Please enter your email.")'
          correct: true
          why:
            en: "Checks that the error is there and that it is exactly the expected one."
            ru: "Проверяет, что ошибка есть и что это именно ожидаемая ошибка."
        - text: 'expect(page.get_by_role("alert")).to_be_visible()'
          why:
            en: "Shows that *some* error is visible, not which one. \"Invalid email or password.\" would pass too."
            ru: "Показывает, что видна *какая-то* ошибка, но не какая. «Invalid email or password.» тоже прошла бы."
        - text: 'expect(page).to_have_url("http://localhost:3000/account")'
          why:
            en: "That's the expected result of a successful login — the opposite case."
            ru: "Это ожидаемый результат успешного входа — противоположный случай."
        - text: 'page.get_by_role("alert").to_have_text("Please enter your email.")'
          why:
            en: "An assertion starts with `expect(...)`. Without it, this line isn't a check at all: a locator has no `to_have_text`, so Python stops with an error. A typical AI slip."
            ru: "Проверка начинается с `expect(...)`. Без него эта строка вообще не проверка: у локатора нет `to_have_text`, и Python остановится с ошибкой. Типичная оплошность ИИ."
      optionsCode: true
      hints:
        - en: "The expected result names a specific text."
          ru: "В ожидаемом результате назван конкретный текст."
        - en: "Which matcher compares text? And does the line start with `expect`?"
          ru: "Какой метод сравнивает текст? И начинается ли строка с `expect`?"
        - en: 'Almost the answer: `expect(...).to_have_text("Please enter your email.")`.'
          ru: 'Почти ответ: `expect(...).to_have_text("Please enter your email.")`.'
      praise:
        en: "Exactly the expected result, nothing weaker. That's precise test design."
        ru: "Ровно ожидаемый результат и ничего слабее. Это точный тест-дизайн."
      explain:
        en: "When the expected result names a text, check the text with `to_have_text`. `to_be_visible` alone would accept any error message."
        ru: "Когда в ожидаемом результате назван текст, проверяй текст через `to_have_text`. Один `to_be_visible` принял бы любое сообщение об ошибке."

  - type: task
    task:
      id: c1-l3-t2
      kind: match
      keyPoint: kp-expect
      prompt:
        en: "Match each expected result with its assertion."
        ru: "Сопоставь каждый ожидаемый результат с его проверкой."
      pairs:
        - left: { en: "The account page opens", ru: "Открывается страница аккаунта" }
          right: 'expect(page).to_have_url("http://localhost:3000/account")'
        - left: { en: "An error message is shown", ru: "Показано сообщение об ошибке" }
          right: 'expect(page.get_by_role("alert")).to_be_visible()'
        - left: { en: "The error says \"Invalid email or password.\"", ru: "Текст ошибки — «Invalid email or password.»" }
          right: 'expect(page.get_by_role("alert")).to_have_text("Invalid email or password.")'
        - left: { en: "The browser tab title is \"Shop · Bloomly\"", ru: "Заголовок вкладки браузера — «Shop · Bloomly»" }
          right: 'expect(page).to_have_title("Shop · Bloomly")'
      rightCode: true
      hints:
        - en: "Look at the last word of each matcher: `url`, `visible`, `text`, `title`."
          ru: "Смотри на последнее слово в каждом методе: `url`, `visible`, `text`, `title`."
        - en: "\"Is shown\" = visible; \"says\" = text."
          ru: "«Показано» = visible; «текст — …» = text."
      praise:
        en: "You picked the matcher from the wording of the expected result — exactly the right instinct."
        ru: "Ты {выбрала|выбрал} метод проверки по формулировке ожидаемого результата — правильное чутьё."
      explain:
        en: "The wording of the expected result tells you the matcher: a page → `to_have_url`, shown → `to_be_visible`, a text → `to_have_text`, a tab title → `to_have_title`."
        ru: "Формулировка ожидаемого результата подсказывает метод: страница → `to_have_url`, показано → `to_be_visible`, текст → `to_have_text`, заголовок вкладки → `to_have_title`."

  - type: task
    task:
      id: c1-l3-t3
      kind: fill
      keyPoint: kp-expect
      prompt:
        en: "Complete the assertions for TC-002: the error text is shown and the user stays on /login."
        ru: "Допиши проверки для TC-002: показан текст ошибки, и пользователь остаётся на /login."
      code: |
        def test_wrong_password_shows_an_error(page: Page):
            page.goto("/login")
            page.get_by_label("Email").fill("anna@bloomly.app")
            page.get_by_label("Password").fill("wrong-pass")
            page.get_by_role("button", name="Log in").click()
            ___(page.get_by_role("alert")).___("Invalid email or password.")
            expect(page).___("http://localhost:3000/login")
      blanks:
        - { answers: [expect] }
        - { answers: [to_have_text], options: [to_have_text, to_be_visible, to_have_url] }
        - { answers: [to_have_url], options: [to_have_url, to_have_text, to_be_visible] }
      checks: { expect: pass }
      hints:
        - en: "Every assertion starts with the same word. Look at the last line."
          ru: "Каждая проверка начинается с одного и того же слова. Посмотри на последнюю строку."
        - en: "A text needs a text matcher; a page address needs a URL matcher."
          ru: "Для текста нужен метод для текста, для адреса страницы — метод для URL."
        - en: "In order: expect, to_have_text, to_have_url."
          ru: "По порядку: expect, to_have_text, to_have_url."
      praise:
        en: "Two expected results, two precise assertions, and a green run."
        ru: "Два ожидаемых результата, две точные проверки и зелёный прогон."
      explain:
        en: "`expect(...)` opens the check, `to_have_text` compares the error text, `to_have_url` confirms the user is still on the login page — so they weren't logged in."
        ru: "`expect(...)` начинает проверку, `to_have_text` сравнивает текст ошибки, а `to_have_url` подтверждает, что пользователь остался на странице входа — значит, вход не произошёл."

  - type: task
    task:
      id: c1-l3-t4
      kind: vocab
      mode: cloze
      prompt:
        en: "Pick the word that fits."
        ru: "Выбери подходящее слово."
      sentence:
        en: "The test is always green because it has no ___ — it never compares anything."
        ru: "Тест всегда зелёный, потому что в нём нет проверки — он ничего не сравнивает."
      answer: assertion
      options: [assertion, locator, action]

  - type: task
    task:
      id: c1-l3-t5
      kind: predict
      keyPoint: kp-what-to-assert
      app: { bugs: [greeting-wrong-name] }
      context:
        en: "Today's build has a bug: the account page says \"Welcome back, Silva!\" instead of \"Welcome back, Anna!\"."
        ru: "В сегодняшней сборке баг: на странице аккаунта «Welcome back, Silva!» вместо «Welcome back, Anna!»."
      prompt:
        en: "Will this test pass or fail on today's build?"
        ru: "Этот тест пройдёт или упадёт на сегодняшней сборке?"
      code: |
        def test_registered_user_can_log_in(page: Page):
            page.goto("/login")
            page.get_by_label("Email").fill("anna@bloomly.app")
            page.get_by_label("Password").fill("bloom123")
            page.get_by_role("button", name="Log in").click()
            expect(page).to_have_url("http://localhost:3000/account")
      outcome: pass
      reasons:
        - text:
            en: "The account page does open, and the test checks only the URL. The wrong greeting isn't checked, so the bug slips through."
            ru: "Страница аккаунта действительно открывается, а тест проверяет только URL. Неправильное приветствие никто не проверяет, и баг проскакивает."
          correct: true
        - text:
            en: "It fails: the account page is broken."
            ru: "Упадёт: страница аккаунта сломана."
          why:
            en: "The page opens fine — only the greeting text is wrong, and nothing checks it."
            ru: "Страница открывается нормально — неправильный только текст приветствия, а его никто не проверяет."
      hints:
        - en: "What exactly does the last line check?"
          ru: "Что именно проверяет последняя строка?"
        - en: "Is the URL affected by this bug?"
          ru: "Затрагивает ли этот баг URL?"
      praise:
        en: "You saw that a green test can hide a bug. That's the core of reviewing assertions."
        ru: "Ты {увидела|увидел}, что зелёный тест может прятать баг. В этом суть ревью проверок."
      explain:
        en: "The test passes on a buggy app because its only assertion checks the URL. TC-001 also expects the greeting — without that assertion the bug reaches customers."
        ru: "Тест проходит на приложении с багом, потому что его единственная проверка — URL. TC-001 ожидает ещё и приветствие — без этой проверки баг доберётся до клиентов."

  - type: task
    task:
      id: c1-l3-t6
      kind: review
      keyPoint: kp-no-assertion
      context:
        en: "Petal: \"TC-002 is done! I ran it five times — always green.\""
        ru: "Petal: «TC-002 готов! Я запустил его пять раз — всегда зелёный»."
      prompt:
        en: "Review the test against TC-002. If the problem is in the whole test, flag line 0."
        ru: "Проверь тест по TC-002. Если проблема во всём тесте, отметь строку 0."
      testCase:
        id: TC-002
        title: Wrong password shows an error
        steps:
          - action: "Open the login page"
          - action: "Enter email"
            data: "anna@bloomly.app"
          - action: "Enter password"
            data: "wrong-pass"
          - action: "Click \"Log in\""
            expected: "Error \"Invalid email or password.\" is shown"
      code: |
        from playwright.sync_api import Page, expect


        def test_wrong_password_shows_an_error(page: Page):
            page.goto("/login")
            page.get_by_label("Email").fill("anna@bloomly.app")
            page.get_by_label("Password").fill("wrong-pass")
            page.get_by_role("button", name="Log in").click()
      issues:
        - line: 0
          type: no-assertion
          note:
            en: "The error message is never checked. The test is green whether the error appears or not — \"always green\" is the symptom."
            ru: "Сообщение об ошибке нигде не проверяется. Тест зелёный, появилась ошибка или нет, — «всегда зелёный» как раз симптом."
      types: [no-assertion, weak-assertion, wrong-data, wrong-step]
      hints:
        - en: "The steps and data match TC-002. What about the expected result?"
          ru: "Шаги и данные совпадают с TC-002. А ожидаемый результат?"
        - en: "Look for `expect` in the test."
          ru: "Поищи в тесте `expect`."
        - en: "No line checks the error — that's a problem of the whole test: line 0, no-assertion."
          ru: "Ни одна строка не проверяет ошибку — это проблема всего теста: строка 0, no-assertion."
      praise:
        en: "\"Always green\" didn't fool you. A healthy suspicion of green is a senior skill."
        ru: "«Всегда зелёный» тебя не обманул. Здоровое недоверие к зелёному — навык сеньора."
      explain:
        en: "Steps and data are perfect, but there's no assertion, so the test can't fail. Running it five times proves nothing: it would be green on a broken app too."
        ru: "Шаги и данные идеальны, но проверки нет, поэтому тест не может упасть. Пять запусков ничего не доказывают: на сломанном приложении он тоже был бы зелёным."

  - type: task
    task:
      id: c1-l3-t7
      kind: fix
      keyPoint: kp-no-assertion
      prompt:
        en: "Add the missing assertion for TC-002's expected result. We'll also run your test on a build where the error never appears — it must fail there."
        ru: "Добавь недостающую проверку ожидаемого результата TC-002. Мы ещё запустим твой тест на сборке, где ошибка не появляется, — там он должен упасть."
      testCase:
        id: TC-002
        title: Wrong password shows an error
        steps:
          - action: "Open the login page"
          - action: "Enter email"
            data: "anna@bloomly.app"
          - action: "Enter password"
            data: "wrong-pass"
          - action: "Click \"Log in\""
            expected: "Error \"Invalid email or password.\" is shown"
      starter: |
        from playwright.sync_api import Page, expect


        def test_wrong_password_shows_an_error(page: Page):
            page.goto("/login")
            page.get_by_label("Email").fill("anna@bloomly.app")
            page.get_by_label("Password").fill("wrong-pass")
            page.get_by_role("button", name="Log in").click()
      solution: |
        from playwright.sync_api import Page, expect


        def test_wrong_password_shows_an_error(page: Page):
            page.goto("/login")
            page.get_by_label("Email").fill("anna@bloomly.app")
            page.get_by_label("Password").fill("wrong-pass")
            page.get_by_role("button", name="Log in").click()
            expect(page.get_by_role("alert")).to_have_text("Invalid email or password.")
      checks:
        expect: pass
        static: [hasAssertion]
        also:
          - app: { bugs: [login-no-error] }
            expect: fail
      hints:
        - en: "Add one line after the click: an assertion on the error box."
          ru: "Добавь одну строку после клика: проверку блока с ошибкой."
        - en: 'The error box is `page.get_by_role("alert")`. The expected result names a text.'
          ru: 'Блок с ошибкой — `page.get_by_role("alert")`. В ожидаемом результате назван текст.'
        - en: 'Add this line: `expect(page.get_by_role("alert")).to_have_text("Invalid email or password.")`'
          ru: 'Добавь строку: `expect(page.get_by_role("alert")).to_have_text("Invalid email or password.")`'
      praise:
        en: "Now it's a real test: green on a working app, red on a broken one."
        ru: "Теперь это настоящий тест: зелёный на рабочем приложении и красный на сломанном."
      explain:
        en: "With the assertion, the test compares the actual error with the expected one. On the build where the error never appears, it fails — which proves it can catch the bug."
        ru: "С проверкой тест сравнивает фактическую ошибку с ожидаемой. На сборке, где ошибка не появляется, он падает — а значит, умеет ловить этот баг."

  - type: mistakes
    keyPoint: kp-what-to-assert
    title:
      en: "Weak and missing checks (AI favourites)"
      ru: "Слабые и пропущенные проверки (любимое у ИИ)"
    items:
      - wrong: "# the error message should appear"
        right: 'expect(page.get_by_role("alert")).to_have_text("Invalid email or password.")'
        why:
          en: "A comment checks nothing. Agents sometimes leave the expected result as a comment."
          ru: "Комментарий ничего не проверяет. Агенты иногда оставляют ожидаемый результат в виде комментария."
      - wrong: 'assert page.get_by_role("alert").is_visible()'
        right: 'expect(page.get_by_role("alert")).to_be_visible()'
        why:
          en: "A plain `assert` looks only once, immediately. If the error appears a moment later, the test fails for no reason. `expect(...)` waits and retries. A very common AI habit."
          ru: "Обычный `assert` смотрит один раз, сразу. Если ошибка появится чуть позже, тест упадёт без причины. `expect(...)` ждёт и повторяет попытки. Очень частая привычка ИИ."
      - wrong: 'expect(page.get_by_role("heading", name="Welcome back")).to_be_visible()'
        right: 'expect(page.get_by_role("heading", name="Welcome back, Anna!")).to_be_visible()'
        why:
          en: "Without the name, \"Welcome back, Silva!\" passes too. Assert the exact expected result."
          ru: "Без имени пройдёт и «Welcome back, Silva!». Проверяй точный ожидаемый результат."
      - wrong: 'expect(page.get_by_role("button", name="Log in")).to_be_visible()'
        right: 'expect(page.get_by_role("alert")).to_have_text("Invalid email or password.")'
        why:
          en: "The button is visible with or without the error. Check the thing the expected result talks about."
          ru: "Кнопка видна и с ошибкой, и без неё. Проверяй то, о чём говорит ожидаемый результат."

  - type: explain
    keyPoint: kp-no-assertion
    prompt:
      en: "In your own words: why is a test without an assertion not really a test?"
      ru: "Своими словами: почему тест без проверки — на самом деле не тест?"
    model:
      en: "Because it can't fail. It only performs the steps and never compares the actual result with the expected one. If login breaks, it's still green — so its green tells us nothing. It's like a test case without an expected result."
      ru: "Потому что он не может упасть. Он только выполняет шаги и никогда не сравнивает фактический результат с ожидаемым. Если вход сломается, тест всё равно зелёный — значит, его зелёный цвет ничего не говорит. Это как тест-кейс без ожидаемого результата."

  - type: phrases
    items:
      - context: code-review
        en: "This test has no assertion, so it can't fail. Please add a check for the expected result from TC-002."
        ru: "В этом тесте нет проверки, поэтому он не может упасть. Добавь, пожалуйста, проверку ожидаемого результата из TC-002."
      - context: code-review
        en: "The assertion is too weak: it only checks the URL. TC-001 also expects the greeting \"Welcome back, Anna!\"."
        ru: "Проверка слишком слабая: она смотрит только на URL. TC-001 ожидает ещё и приветствие «Welcome back, Anna!»."
      - context: prompt
        en: "Add an assertion for the expected result: the error \"Invalid email or password.\" is visible. Use to_have_text with the exact text."
        ru: "Добавь проверку ожидаемого результата: видна ошибка «Invalid email or password.». Используй to_have_text с точным текстом."
      - context: standup
        en: "Petal's login tests stayed green during the outage because they had no assertions. I'm adding them today."
        ru: "Логин-тесты Petal остались зелёными во время сбоя, потому что в них не было проверок. Сегодня добавляю их."
      - context: bug-report
        en: "Expected result: the heading shows \"Welcome back, Anna!\". Actual result: it shows \"Welcome back, Silva!\"."
        ru: "Ожидаемый результат: в заголовке «Welcome back, Anna!». Фактический результат: там «Welcome back, Silva!»."
        note:
          en: "In bug reports, \"Expected result / Actual result\" is the standard pair — the same pair an assertion compares."
          ru: "В баг-репортах «Expected result / Actual result» — стандартная пара, ровно та, которую сравнивает проверка."

checkPool:
  - id: c1-l3-k1
    kind: predict
    keyPoint: kp-no-assertion
    placement: true
    app: { bugs: [login-no-error] }
    context:
      en: "Bug in today's build: a wrong password shows no error at all."
      ru: "Баг в сегодняшней сборке: при неверном пароле никакой ошибки не показывается."
    prompt:
      en: "Will this test pass or fail on today's build?"
      ru: "Этот тест пройдёт или упадёт на сегодняшней сборке?"
    code: |
      def test_wrong_password_shows_an_error(page: Page):
          page.goto("/login")
          page.get_by_label("Email").fill("anna@bloomly.app")
          page.get_by_label("Password").fill("wrong-pass")
          page.get_by_role("button", name="Log in").click()
    outcome: pass
    reasons:
      - text:
          en: "Nothing checks the error, so the missing error goes unnoticed."
          ru: "Ошибку никто не проверяет, поэтому её отсутствие остаётся незамеченным."
        correct: true
      - text:
          en: "It fails because the error is missing."
          ru: "Упадёт, потому что ошибки нет."
        why:
          en: "Only an assertion can notice a missing error. There is none."
          ru: "Заметить отсутствие ошибки может только проверка. А её нет."
    hints:
      - en: "Which line would notice that the error is missing?"
        ru: "Какая строка заметила бы, что ошибки нет?"
      - en: "Look for `expect`."
        ru: "Поищи `expect`."
    explain:
      en: "No assertion — no failure. The test is green on a build where the error message is broken."
      ru: "Нет проверки — нет падения. Тест зелёный на сборке, где сломано сообщение об ошибке."

  - id: c1-l3-k2
    kind: choice
    keyPoint: kp-expect
    placement: true
    prompt:
      en: "Expected result: \"The account page opens.\" Which line checks it?"
      ru: "Ожидаемый результат: «Открывается страница аккаунта». Какая строка это проверяет?"
    options:
      - text: 'expect(page).to_have_url("http://localhost:3000/account")'
        correct: true
        why:
          en: "It checks the actual address against the expected one."
          ru: "Сравнивает фактический адрес с ожидаемым."
      - text: 'page.goto("/account")'
        why:
          en: "That's an action — it opens the page itself instead of checking that login opened it."
          ru: "Это действие — оно само открывает страницу, вместо того чтобы проверить, что её открыл вход."
      - text: 'expect(page).to_have_title("Log in · Bloomly")'
        why:
          en: "That's the title of the login page — the opposite of what we expect."
          ru: "Это заголовок страницы входа — противоположность ожидаемому."
      - text: 'expect(page.get_by_role("button", name="Log in")).to_be_visible()'
        why:
          en: "The Log in button belongs to the login page, not the account page."
          ru: "Кнопка Log in — на странице входа, а не аккаунта."
    optionsCode: true
    hints:
      - en: "A check starts with `expect`."
        ru: "Проверка начинается с `expect`."
      - en: "\"A page opens\" is about the URL."
        ru: "«Открывается страница» — это про URL."
    explain:
      en: "`to_have_url` compares where the browser actually is with where it should be. `goto` would hide the bug by opening the page itself."
      ru: "`to_have_url` сравнивает, где браузер на самом деле, с тем, где он должен быть. `goto` спрятал бы баг, открыв страницу сам."

