id: c1-l4
chapter: c1
title:
  en: "Run it and read the report"
  ru: "Запусти и прочитай отчёт"
goal:
  en: "Read pytest's report and the error of a failed test, and decide whether a red test means a bug in the app or a broken test."
  ru: "Читать отчёт pytest и ошибку упавшего теста и решать, что значит красный тест: баг в приложении или сломанный тест."
minutes: 10
keyPoints:
  - id: kp-pass-fail
    title:
      en: "The report: PASSED or FAILED for each test, then a summary"
      ru: "Отчёт: PASSED или FAILED по каждому тесту и итоговая строка"
  - id: kp-read-error
    title:
      en: "Read the error: the failing line, the expected text, the Actual value"
      ru: "Читай ошибку: упавшая строка, ожидаемый текст, Actual value"
  - id: kp-bug-or-test
    title:
      en: "Red means a bug in the app or a broken test — triage it"
      ru: "Красный — это баг в приложении или сломанный тест: разберись"
terms: [nightly-run, triage, file-a-bug, rerun, on-purpose, outdated, for-the-right-reason]

steps:
  - type: story
    lines:
      - who: leo
        text:
          en: "The nightly run is in: \"2 failed, 38 passed\". Do we block the release?"
          ru: "Ночной прогон готов: «2 failed, 38 passed». Блокируем релиз?"
      - who: maya
        text:
          en: "Red isn't bad news — it's information. Let's read the report like a bug report: what was expected, what actually happened."
          ru: "Красный — не плохая новость, а информация. Читаем отчёт как баг-репорт: что ожидали и что произошло на самом деле."
      - who: petal
        text:
          en: "I can just rerun them until they're green!"
          ru: "Я могу просто перезапускать их, пока не позеленеют!"
      - who: maya
        text:
          en: "Please don't, Petal."
          ru: "Пожалуйста, не надо, Petal."

  - type: pretest
    intro:
      en: "Quick guess before we start. Wrong answers are fine — they help you remember."
      ru: "Быстрая догадка перед началом. Ошибаться можно — так лучше запоминается."
    items:
      - id: c1-l4-p1
        kind: choice
        keyPoint: kp-read-error
        prompt:
          en: "Part of pytest's output for a failed test. What happened?"
          ru: "Фрагмент вывода pytest для упавшего теста. Что произошло?"
        code: |
          $ pytest
          ...
          E       AssertionError: Locator expected to have text 'Welcome back, Anna!'
          E       Actual value: Welcome back, Silva!
        options:
          - text:
              en: "The page showed \"Welcome back, Silva!\" where \"Welcome back, Anna!\" was expected."
              ru: "Страница показала «Welcome back, Silva!» там, где ожидалось «Welcome back, Anna!»."
            correct: true
            why:
              en: "The first `E` line says what the test expected. `Actual value` is what the page really showed."
              ru: "Первая строка `E` — что тест ожидал. `Actual value` — что страница показала на самом деле."
          - text:
              en: "The test couldn't find the page."
              ru: "Тест не нашёл страницу."
            why:
              en: "It found the page and read a heading from it — that's what `Actual value` shows."
              ru: "Он нашёл страницу и прочитал на ней заголовок — это и показывает `Actual value`."
          - text:
              en: "The test code has a typo."
              ru: "В коде теста опечатка."
            why:
              en: "Nothing here points to a typo: the test expected exactly what TC-001 says."
              ru: "Ничто не указывает на опечатку: тест ожидал ровно то, что сказано в TC-001."
        hints:
          - en: "\"Actual value\" = what the test actually got."
            ru: "«Actual value» = что тест получил на самом деле."
          - en: "Compare the two texts word by word."
            ru: "Сравни два текста слово за словом."
        explain:
          en: "The expected text and the `Actual value` are the same pair as Expected result and Actual result in your bug reports."
          ru: "Ожидаемый текст и `Actual value` — та же пара, что «ожидаемый» и «фактический результат» в твоих баг-репортах."
      - id: c1-l4-p2
        kind: choice
        keyPoint: kp-bug-or-test
        prompt:
          en: "A test turned red. What's your first thought?"
          ru: "Тест покраснел. О чём ты думаешь первым делом?"
        options:
          - text:
              en: "It's either a bug in the app or a mistake in the test — I need to find out which."
              ru: "Это либо баг в приложении, либо ошибка в тесте — нужно понять, что именно."
            correct: true
            why:
              en: "Both happen all the time. The error and the test case tell you which."
              ru: "Бывает и то и другое, постоянно. Какое из двух — подскажут ошибка и тест-кейс."
          - text:
              en: "The app is broken — file a bug right away."
              ru: "Приложение сломано — сразу заводить баг."
            why:
              en: "Maybe. But tests break too: a typo, a changed label, wrong data."
              ru: "Возможно. Но тесты тоже ломаются: опечатка, изменившаяся подпись, неверные данные."
          - text:
              en: "The test is unreliable — just rerun it."
              ru: "Тест ненадёжный — просто перезапустить."
            why:
              en: "Rerunning without reading the error hides real bugs."
              ru: "Перезапуск без чтения ошибки прячет настоящие баги."
        hints:
          - en: "Who can be wrong: the app, the test, or both?"
            ru: "Кто может ошибаться: приложение, тест или оба?"
          - en: "Think like a tester triaging a report."
            ru: "Думай как тестировщик, который разбирает отчёт."
        explain:
          en: "A red test is a signal, not a verdict. First triage: bug in the app or problem in the test?"
          ru: "Красный тест — сигнал, а не приговор. Сначала разбор: баг в приложении или проблема в тесте?"

  - type: theory
    keyPoint: kp-pass-fail
    title:
      en: "Green, red, and what the report shows"
      ru: "Зелёный, красный и что показывает отчёт"
    figure: red-green
    body:
      - en: "Tests run with one command: `pytest`. It's the [[test runner|test-runner]]: it finds every `test_…` function in files named `test_*.py`, runs them and prints a [[test report|test-report]]. Plain `pytest` prints one character per test: `.` — [[passed|pass]], `F` — [[failed|fail]]. So `tests/test_login.py .F.` means three tests, and the second one is red."
        ru: "Тесты запускают одной командой: `pytest`. Это [[тест-раннер|test-runner]]: он находит все функции `test_…` в файлах `test_*.py`, запускает их и выводит [[отчёт|test-report]]. Просто `pytest` печатает по символу на тест: `.` — [[прошёл|pass]], `F` — [[упал|fail]]. Значит, `tests/test_login.py .F.` — это три теста, и второй красный."
      - en: "With `pytest -v` (verbose) every test gets its own line: its name and PASSED or FAILED. This is where names pay off: `test_wrong_password_shows_an_error FAILED` already tells you where to look. The last line sums up the run: `1 failed, 2 passed in 7.81s`."
        ru: "С `pytest -v` (verbose, «подробно») у каждого теста своя строка: имя и PASSED или FAILED. Вот где окупаются хорошие имена: `test_wrong_password_shows_an_error FAILED` уже говорит, куда смотреть. Последняя строка подводит итог: `1 failed, 2 passed in 7.81s`."
      - en: "A test stops at the first failed step or assertion. The lines after it don't run — like a test case blocked at step 3."
        ru: "Тест останавливается на первом упавшем шаге или проверке. Строки после неё не выполняются — как тест-кейс, заблокированный на шаге 3."
    code: |
      $ pytest -v
      ============================= test session starts ==============================
      collected 3 items

      tests/test_login.py::test_registered_user_can_log_in PASSED              [ 33%]
      tests/test_login.py::test_wrong_password_shows_an_error FAILED           [ 66%]
      tests/test_login.py::test_locked_user_sees_an_error PASSED               [100%]

      =================================== FAILURES ===================================
      ______________________ test_wrong_password_shows_an_error ______________________
      ...
      =========================== short test summary info ============================
      FAILED tests/test_login.py::test_wrong_password_shows_an_error - AssertionError: Locator expected to have text 'Invalid email or password.'
      ========================= 1 failed, 2 passed in 7.81s ==========================
    mentor:
      en: "7.81 seconds for three login tests? Suspicious. A failing assertion keeps waiting for the expected result — here up to 5 seconds — before it gives up. That's where the time went. Want proof? `pytest --durations=3` lists the slowest tests."
      ru: "7,81 секунды на три теста логина? Подозрительно. Падающая проверка продолжает ждать ожидаемый результат — здесь до 5 секунд — и только потом сдаётся. Вот куда ушло время. Нужны доказательства? `pytest --durations=3` покажет самые медленные тесты."

  - type: theory
    keyPoint: kp-read-error
    title:
      en: "Anatomy of an error"
      ru: "Анатомия ошибки"
    body:
      - en: "Every failed test gets its own block under **FAILURES**. Read it like a mini bug report, top to bottom. First comes the test's code, up to the line marked `>` — where the test stopped."
        ru: "У каждого упавшего теста свой блок в разделе **FAILURES**. Читай его как мини-баг-репорт, сверху вниз. Сначала идёт код теста — до строки с `>`: на ней тест и остановился."
      - en: "Then the error, on the lines starting with `E`. The first one says what was expected: `Locator expected to have text 'Welcome back, Anna!'`. **Actual value** is the [[actual result|actual-result]]. The **Call log** shows what Playwright tried and how long it waited — the [[timeout|timeout]]."
        ru: "Дальше ошибка — строки, которые начинаются с `E`. Первая говорит, что ожидалось: `Locator expected to have text 'Welcome back, Anna!'`. **Actual value** — [[фактический результат|actual-result]]. **Call log** показывает, что пробовал Playwright и сколько ждал, — [[тайм-аут|timeout]]."
      - en: "The last line is the address: `tests/test_login.py:10: AssertionError` means file `tests/test_login.py`, line 10, an assertion failed."
        ru: "Последняя строка — адрес: `tests/test_login.py:10: AssertionError` значит файл `tests/test_login.py`, строка 10, упала проверка."
    code: |
      $ pytest
      ...
      =================================== FAILURES ===================================
      _______________________ test_registered_user_can_log_in ________________________

      page = <Page url='http://localhost:3000/account'>

          def test_registered_user_can_log_in(page: Page):
              page.goto("/login")
              page.get_by_label("Email").fill("anna@bloomly.app")
              page.get_by_label("Password").fill("bloom123")
              page.get_by_role("button", name="Log in").click()
              expect(page).to_have_url("http://localhost:3000/account")
      >       expect(page.get_by_role("heading", level=1)).to_have_text("Welcome back, Anna!")
      E       AssertionError: Locator expected to have text 'Welcome back, Anna!'
      E       Actual value: Welcome back, Silva!
      E       Call log:
      E         - Expect "to_have_text" with timeout 5000ms
      E         - waiting for get_by_role("heading", level=1)
      E           9 × locator resolved to <h1>Welcome back, Silva!</h1>
      E             - unexpected value "Welcome back, Silva!"

      tests/test_login.py:10: AssertionError
    mentor:
      en: "If the Actual value says `<element(s) not found>` and the call log only says `waiting for get_by_label(\"E-mail\")`, the element was never found. Usually that's a typo or a changed label — a problem in the test."
      ru: "Если в Actual value написано `<element(s) not found>`, а в call log только `waiting for get_by_label(\"E-mail\")`, элемент так и не нашёлся. Обычно это опечатка или изменившаяся подпись — проблема в тесте."

  - type: theory
    keyPoint: kp-bug-or-test
    title:
      en: "Red: a bug in the app or a broken test?"
      ru: "Красный: баг в приложении или сломанный тест?"
    body:
      - en: "A red test means one of two things: a [[bug|bug]] in the app, or a mistake in the test — a wrong locator, wrong data, an outdated expected result."
        ru: "Красный тест значит одно из двух: [[баг|bug]] в приложении или ошибку в тесте — неверный локатор, неверные данные, устаревший ожидаемый результат."
      - en: "Triage it like you always do: compare the expected text and the Actual value with the test case. The test expects what the test case says, but the app shows something else → bug. The test expects something else, or can't find an element → check the test first."
        ru: "Разбирай как обычно: сравни ожидаемый текст и Actual value с тест-кейсом. Тест ждёт то, что сказано в тест-кейсе, а приложение показывает другое → баг. Тест ждёт что-то другое или не находит элемент → сначала проверь тест."
      - en: "If it's a bug, write a bug report in English: steps, expected, actual. The error already gives you most of it."
        ru: "Если это баг, пиши баг-репорт на английском: шаги, ожидаемый, фактический результат. Большую часть уже даёт ошибка."
    mentor:
      en: "Never \"fix\" a test to match a bug. If the app says \"Silva\" and the test case says \"Anna\", the test is right."
      ru: "Никогда не «чини» тест под баг. Если приложение пишет «Silva», а тест-кейс — «Anna», прав тест."

  - type: example
    keyPoint: kp-read-error
    title:
      en: "See a red report for yourself"
      ru: "Посмотри на красный отчёт {сама|сам}"
    intro:
      en: "This build has a bug switched on, so the test will fail — on purpose. Run it and find in the report the line marked `>`, the expected text and the Actual value. The trainer's report shows the same pieces as pytest in a terminal."
      ru: "В этой сборке включён баг, поэтому тест упадёт — так и задумано. Запусти его и найди в отчёте строку с `>`, ожидаемый текст и Actual value. Отчёт тренажёра показывает те же части, что и pytest в терминале."
    app: { bugs: [greeting-wrong-name] }
    code: |
      from playwright.sync_api import Page, expect


      def test_registered_user_can_log_in(page: Page):
          page.goto("/login")
          page.get_by_label("Email").fill("anna@bloomly.app")
          page.get_by_label("Password").fill("bloom123")
          page.get_by_role("button", name="Log in").click()
          expect(page).to_have_url("http://localhost:3000/account")
          expect(page.get_by_role("heading", level=1)).to_have_text("Welcome back, Anna!")
    notes:
      - lines: [5, 6, 7, 8]
        text:
          en: "The steps all work: login itself is fine in this build."
          ru: "Все шаги проходят: сам вход в этой сборке работает."
      - lines: 9
        text:
          en: "Passes: the account page does open."
          ru: "Проходит: страница аккаунта действительно открывается."
      - lines: 10
        text:
          en: "Fails: the test expects \"Welcome back, Anna!\", the Actual value is \"Welcome back, Silva!\". The test follows TC-001, so this is a bug in the app."
          ru: "Падает: тест ждёт «Welcome back, Anna!», а Actual value — «Welcome back, Silva!». Тест следует TC-001, значит, это баг в приложении."
    runnable: true

  - type: task
    task:
      id: c1-l4-t1
      kind: choice
      keyPoint: kp-pass-fail
      prompt:
        en: "Read the nightly report. Which statement is true?"
        ru: "Прочитай ночной отчёт. Какое утверждение верно?"
      code: |
        $ pytest -v
        ============================= test session starts ==============================
        collected 4 items

        tests/test_login.py::test_registered_user_can_log_in PASSED              [ 25%]
        tests/test_login.py::test_wrong_password_shows_an_error PASSED           [ 50%]
        tests/test_login.py::test_locked_user_sees_an_error FAILED               [ 75%]
        tests/test_login.py::test_empty_email_shows_an_error PASSED              [100%]

        =================================== FAILURES ===================================
        ________________________ test_locked_user_sees_an_error ________________________
        ...
        tests/test_login.py:26: AssertionError
        =========================== short test summary info ============================
        FAILED tests/test_login.py::test_locked_user_sees_an_error - AssertionError: Locator expected to be visible
        ========================= 1 failed, 3 passed in 8.24s ==========================
      options:
        - text:
            en: "One test failed — test_locked_user_sees_an_error. It stopped on line 26 of tests/test_login.py."
            ru: "Упал один тест — test_locked_user_sees_an_error. Он остановился на строке 26 файла tests/test_login.py."
          correct: true
          why:
            en: "FAILED marks the red test, and `tests/test_login.py:26` is the line in the test file where it stopped."
            ru: "FAILED отмечает красный тест, а `tests/test_login.py:26` — строка в файле с тестами, на которой он остановился."
        - text:
            en: "Login is broken for everyone."
            ru: "Вход сломан у всех."
          why:
            en: "`test_registered_user_can_log_in` PASSED. Only the locked-user case is red."
            ru: "`test_registered_user_can_log_in` — PASSED. Красный только кейс с заблокированным пользователем."
        - text:
            en: "There is a bug on line 26 of the Bloomly app."
            ru: "Баг в строке 26 приложения Bloomly."
          why:
            en: "Line 26 is in the test file. Whether the app has a bug — you don't know yet."
            ru: "Строка 26 — в файле с тестами. Есть ли баг в приложении, ты пока не знаешь."
        - text:
            en: "Three tests failed."
            ru: "Упали три теста."
          why:
            en: "PASSED means passed. The last line says it: 1 failed, 3 passed."
            ru: "PASSED значит «прошёл». Последняя строка так и говорит: 1 failed, 3 passed."
      hints:
        - en: "Find the word FAILED."
          ru: "Найди слово FAILED."
        - en: "`tests/test_login.py:26` points into the test file, not the app."
          ru: "`tests/test_login.py:26` указывает в файл с тестами, а не в приложение."
      praise:
        en: "You read the report precisely — including what it does not tell you yet."
        ru: "Ты {прочитала|прочитал} отчёт точно — включая то, чего он пока не говорит."
      explain:
        en: "The report says which test failed and on which line of the test file it stopped. It doesn't say why yet — that's in the `E` lines, hidden behind `...` here."
        ru: "Отчёт говорит, какой тест упал и на какой строке файла с тестами он остановился. Почему — пока не говорит: это в строках `E`, здесь они спрятаны за `...`."

  - type: task
    task:
      id: c1-l4-t2
      kind: choice
      keyPoint: kp-read-error
      prompt:
        en: "TC-002 \"Wrong password shows an error\" failed. What does the Actual value tell you?"
        ru: "TC-002 «Wrong password shows an error» упал. Что тебе говорит Actual value?"
      code: |
        $ pytest tests/test_login.py
        ...
        >       expect(page.get_by_role("alert")).to_have_text("Invalid email or password.")
        E       AssertionError: Locator expected to have text 'Invalid email or password.'
        E       Actual value: Please enter a valid email address.
      options:
        - text:
            en: "The app showed a different error: it didn't accept the email as valid, so the password was never checked."
            ru: "Приложение показало другую ошибку: оно не приняло email как корректный, поэтому до пароля дело не дошло."
          correct: true
          why:
            en: "The Actual value is the actual message. The next step: look at the email in the test — or suspect email validation."
            ru: "Actual value — фактическое сообщение. Следующий шаг: посмотреть на email в тесте — или заподозрить проверку email."
        - text:
            en: "The test found the correct error."
            ru: "Тест нашёл правильную ошибку."
          why:
            en: "The expected text and the Actual value differ — that's why it failed."
            ru: "Ожидаемый текст и Actual value различаются — поэтому тест и упал."
        - text:
            en: "The error box wasn't found."
            ru: "Блок с ошибкой не нашёлся."
          why:
            en: "It was found — the Actual value shows its text. For a missing element you'd see `<element(s) not found>`."
            ru: "Нашёлся — Actual value показывает его текст. Для ненайденного элемента там было бы `<element(s) not found>`."
        - text:
            en: "The password is wrong."
            ru: "Пароль неверный."
          why:
            en: "That's what the test wanted to check, but the app stopped earlier — at the email."
            ru: "Это тест и хотел проверить, но приложение остановилось раньше — на email."
      hints:
        - en: "The Actual value is the actual result. Read it literally."
          ru: "Actual value — фактический результат. Прочитай его буквально."
        - en: "Which field does \"Please enter a valid email address.\" talk about?"
          ru: "О каком поле говорит «Please enter a valid email address.»?"
      praise:
        en: "You read the actual result, not just \"it's red\". That's how triage starts."
        ru: "Ты {прочитала|прочитал} фактический результат, а не просто «красное». С этого начинается разбор."
      explain:
        en: "The Actual value says the app rejected the email. Either the test typed it wrong (a test problem) or the app rejects a valid email — for example, one with a space at the end that should be trimmed (a bug)."
        ru: "Actual value говорит, что приложение отвергло email. Либо тест ввёл его неправильно (проблема теста), либо приложение отвергает корректный email — например, с пробелом в конце, который должен обрезаться (баг)."

  - type: task
    task:
      id: c1-l4-t3
      kind: predict
      keyPoint: kp-read-error
      app: { bugs: [login-redirect-home] }
      context:
        en: "Today's build has a bug: after logging in, users land on the home page (`/`)."
        ru: "В сегодняшней сборке баг: после входа пользователь попадает на главную (`/`)."
      prompt:
        en: "Will this test pass or fail? If it fails — where?"
        ru: "Этот тест пройдёт или упадёт? Если упадёт — где?"
      code: |
        def test_registered_user_can_log_in(page: Page):
            page.goto("/login")
            page.get_by_label("Email").fill("anna@bloomly.app")
