    solution: |
      from playwright.sync_api import Page, expect


      def test_wrong_password_shows_an_error(page: Page):
          page.goto("/login")
          page.get_by_label("Email").fill("anna@bloomly.app")
          page.get_by_label("Password").fill("wrong-pass")
          page.get_by_role("button", name="Log in").click()
          expect(page.get_by_role("alert")).to_have_text("Invalid email or password.")
    checks:
      expect: pass
      static: [hasAssertion]
    hints:
      - en: "The expected text and the Actual value differ by one character."
        ru: "Ожидаемый текст и Actual value отличаются одним символом."
      - en: "Look at the very end of the two texts."
