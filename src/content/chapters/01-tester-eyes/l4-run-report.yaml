      en: "I read the failure in the report: the line marked with `>`, then the `E` lines with the expected value and the Actual value. Then I compare them with the test case. If the test expects what the test case says and the app shows something else, it's a bug — I write a bug report with steps, expected and actual. If the test expects something different, uses the wrong data, or can't find an element because of a typo or an old label, the test needs fixing."
