    context:
      en: "Petal: \"The test was red with 'bloom10', so I switched to 'BLOOM10'. Green now!\""
      ru: "Petal: «Тест был красным с 'bloom10', поэтому я поменял на 'BLOOM10'. Теперь зелёный!»"
    prompt:
      en: "Review Petal's change against TC-013. Flag the problem line."
      ru: "Проверь изменение Petal по TC-013. Отметь проблемную строку."
    testCase:
      id: TC-013
      title: Promo code is not case-sensitive
      preconditions: ["The cart contains one Rose Bouquet"]
      steps:
        - action: "Open the cart"
        - action: "Enter the promo code in lower case"
          data: "bloom10"
        - action: "Click \"Apply\""
          expected: "\"Promo code BLOOM10 applied: −10%.\" is shown"
    code: |
      test('promo code is not case-sensitive', async ({ page }) => {
        await page.goto('/cart');
        await page.getByLabel('Promo code').fill('BLOOM10');
        await page.getByRole('button', { name: 'Apply' }).click();
        await expect(page.getByTestId('promo-message')).toHaveText('Promo code BLOOM10 applied: −10%.');
      });
    issues:
      - line: 3
        type: wrong-data
        note:
          en: "TC-013 is about lower case: \"bloom10\". With \"BLOOM10\" the test no longer checks case-insensitivity — and the real bug is hidden."
          ru: "TC-013 — про нижний регистр: «bloom10». С «BLOOM10» тест больше не проверяет нечувствительность к регистру — а настоящий баг спрятан."
    types: [wrong-data, wrong-assertion, weak-assertion, wrong-step]
