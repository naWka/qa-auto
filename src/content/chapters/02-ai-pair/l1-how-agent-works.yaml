      - text:
          en: "The login page has a heading"
          ru: "На странице входа есть заголовок"
        why:
          en: "Low value: if the heading is missing, the other tests will notice anyway."
          ru: "Мало пользы: если заголовка нет, другие тесты это и так заметят."
    hints:
      - en: "Think like a test designer: negative cases and edge cases."
        ru: "Думай как тест-дизайнер: негативные и пограничные случаи."
      - en: "Which cases have their own business rule or their own risk?"
        ru: "У каких кейсов есть своё бизнес-правило или свой риск?"
      - en: "The locked account and the email with spaces and capitals."
        ru: "Заблокированный аккаунт и email с пробелами и заглавными."
    praise:
      en: "That's test design the agent doesn't do on its own: you went for rules and risks."
      ru: "Это тест-дизайн, который агент сам не делает: ты пош{ла|ёл} за правилами и рисками."
    explain:
      en: "Agents tend to cover the happy path and the obvious errors. A [[negative test|negative-test]] for locked users and an [[edge case|edge-case]] for messy input come from your experience."
      ru: "Агенты обычно покрывают позитивный сценарий и очевидные ошибки. [[Негативный тест|negative-test]] на заблокированных пользователей и [[пограничный случай|edge-case]] с «грязным» вводом приходят из твоего опыта."

  - id: c2-l1-k6
    kind: agent
    keyPoint: kp-you-decide
    context:
      en: "Petal is simulated here; a real agent's wording and code will vary."
      ru: "Petal здесь симулирован; у настоящего агента формулировки и код будут другими."
    prompt:
      en: "Compose the prompt for TC-102 and run Petal's test."
      ru: "Собери промпт для TC-102 и запусти тест Petal."
    testCase:
      id: TC-102
      title: Wrong password shows an error
      steps:
        - { action: "Open /login" }
        - { action: "Enter email and a wrong password", data: "anna@bloomly.app / nope123" }
        - { action: "Click \"Log in\"", expected: "Alert \"Invalid email or password.\"; the user stays on /login" }
    blocks:
      - { id: task, locked: true, text: "Write a Playwright test for TC-102: a wrong password shows an error.", ru: "Напиши Playwright-тест для TC-102: неверный пароль показывает ошибку." }
      - { id: steps, text: 'Steps: open /login, enter anna@bloomly.app and the wrong password nope123, click "Log in".', ru: "Шаги: открой /login, введи anna@bloomly.app и неверный пароль nope123, нажми «Log in»." }
      - { id: expected, text: 'Expected: the alert says "Invalid email or password." and the URL stays /login.', ru: "Ожидаемый результат: в сообщении об ошибке «Invalid email or password.», URL остаётся /login." }
      - { id: noise, text: "Use wait_for_timeout(5000) to be safe.", ru: "Используй wait_for_timeout(5000) на всякий случай." }
    responses:
      - when: [steps, expected]
        unless: [noise]
        best: true
        message:
          en: "Done! The test enters the wrong password and checks the exact alert text from TC-102 and the URL. Green ✅"
          ru: "Готово! Тест вводит неверный пароль и проверяет точный текст ошибки из TC-102 и URL. Зелёный ✅"
        code: |
          from playwright.sync_api import Page, expect


          def test_wrong_password_shows_an_error(page: Page):
              page.goto("/login")
              page.get_by_label("Email").fill("anna@bloomly.app")
              page.get_by_label("Password").fill("nope123")
              page.get_by_role("button", name="Log in").click()
              expect(page.get_by_role("alert")).to_have_text("Invalid email or password.")
              expect(page).to_have_url("http://localhost:3000/login")
      - when: [steps, expected]
        message:
          en: "Done! I added a 5-second wait to be safe, as you asked. Green ✅ (it takes a bit longer now)."
          ru: "Готово! Как ты и просил{а|}, добавил ожидание 5 секунд на всякий случай. Зелёный ✅ (правда, теперь он идёт дольше)."
        code: |
          from playwright.sync_api import Page, expect


          def test_wrong_password_shows_an_error(page: Page):
              page.goto("/login")
              page.get_by_label("Email").fill("anna@bloomly.app")
              page.get_by_label("Password").fill("nope123")
              page.get_by_role("button", name="Log in").click()
              page.wait_for_timeout(5000)
              expect(page.get_by_role("alert")).to_have_text("Invalid email or password.")
      - when: [steps]
        message:
          en: "Done! After the click the test checks that we're still on the login page. Green ✅"
          ru: "Готово! После клика тест проверяет, что мы всё ещё на странице входа. Зелёный ✅"
        code: |
          from playwright.sync_api import Page, expect


          def test_wrong_password_shows_an_error(page: Page):
              page.goto("/login")
              page.get_by_label("Email").fill("anna@bloomly.app")
              page.get_by_label("Password").fill("nope123")
              page.get_by_role("button", name="Log in").click()
              expect(page.get_by_role("heading", name="Log in")).to_be_visible()
      - when: []
        message:
          en: "I wasn't sure about the details, so I checked the login page title. Green ✅"
          ru: "Я не был уверен в деталях, поэтому проверил заголовок вкладки страницы входа. Зелёный ✅"
        code: |
          from playwright.sync_api import Page, expect


          def test_login_page_works(page: Page):
              page.goto("/login")
              expect(page).to_have_title("Log in · Bloomly")
    missing:
      expected:
        en: "Without the expected result Petal only checked that the “Log in” heading is there. That passes even if no error appears at all."
        ru: "Без ожидаемого результата Petal проверил только, что на месте заголовок «Log in». Это пройдёт, даже если ошибка вообще не появится."
      steps:
        en: "Without steps and data Petal never even tried a wrong password."
        ru: "Без шагов и данных Petal даже не попробовал ввести неверный пароль."
    checks:
      expect: pass
      static: [hasAssertion, noHardWait]
    hints:
      - en: "The expected result is the part only you can give: the exact error text."
        ru: "Ожидаемый результат — то, что можешь дать только ты: точный текст ошибки."
      - en: "One block makes every run 5 seconds slower."
        ru: "Один блок делает каждый прогон на 5 секунд медленнее."
      - en: "Steps + expected. Leave out the wait_for_timeout block."
        ru: "Шаги + ожидаемый результат. Блок с wait_for_timeout не бери."
    praise:
      en: "You gave Petal the exact error text and kept the hard wait out. Clean prompt."
      ru: "Ты дал{а|} Petal точный текст ошибки и не пустил{а|} в промпт жёсткое ожидание. Чистый промпт."
    explain:
      en: "The error text “Invalid email or password.” is a requirement — Petal can't know it's the *right* text. And `expect(...)` already waits for the alert, so a 5-second pause only slows the suite down."
      ru: "Текст ошибки «Invalid email or password.» — это требование: Petal не может знать, что это *правильный* текст. А `expect(...)` и так ждёт появления ошибки, так что пауза в 5 секунд только замедляет набор тестов."

  - id: c2-l1-k7
    kind: choice
    keyPoint: kp-agent-limits
    prompt:
      en: "Petal reports: “All 12 new tests pass ✅”. What do you do first?"
      ru: "Petal докладывает: «Все 12 новых тестов проходят ✅». Что ты делаешь в первую очередь?"
    options:
      - text:
          en: "Open the tests and check what each one asserts, against the test cases"
          ru: "Открываю тесты и сверяю, что проверяет каждый, с тест-кейсами"
        correct: true
        why:
          en: "Green says nothing about *what* is checked. The review answers that."
          ru: "Зелёный цвет ничего не говорит о том, *что* проверяется. На это отвечает ревью."
      - text:
          en: "Merge them — green is green"
          ru: "Мержу — зелёный значит зелёный"
        why:
          en: "A test without a real assertion is green too."
          ru: "Тест без настоящей проверки тоже зелёный."
      - text:
          en: "Ask Petal whether it's sure"
          ru: "Спрашиваю Petal, уверен ли он"
        why:
          en: "It will say yes. Agents sound equally confident when they're wrong."
          ru: "Он скажет «да». Агенты звучат одинаково уверенно, когда ошибаются."
      - text:
          en: "Run them ten more times"
          ru: "Запускаю их ещё десять раз"
        why:
          en: "Ten green runs of a test that checks nothing still check nothing."
          ru: "Десять зелёных прогонов теста, который ничего не проверяет, всё так же ничего не проверяют."
    hints:
      - en: "What does “green” actually prove?"
        ru: "Что на самом деле доказывает «зелёный»?"
      - en: "Confidence isn't evidence."
        ru: "Уверенность — не доказательство."
    explain:
      en: "An agent's report is a claim, not a proof. Reading what each test asserts is the first step of every review."
      ru: "Отчёт агента — это утверждение, а не доказательство. Прочитать, что проверяет каждый тест, — первый шаг любого ревью."

  - id: c2-l1-k8
    kind: choice
    keyPoint: kp-agent-loop
    placement: true
    prompt:
      en: "Petal runs its new test, and pytest reports: `AttributeError: 'Page' object has no attribute 'open'`. What does a good agent do next in its loop?"
      ru: "Petal запускает новый тест, и pytest сообщает: `AttributeError: 'Page' object has no attribute 'open'`. Что хороший агент делает дальше в своём цикле?"
    options:
      - text:
          en: "Reads the error, replaces it with `page.goto` and runs the test again"
          ru: "Читает ошибку, заменяет на `page.goto` и запускает тест снова"
        correct: true
        why:
          en: "Run → read output → fix → run again. That's the loop."
          ru: "Запуск → чтение вывода → исправление → снова запуск. Это и есть цикл."
      - text:
          en: "Reports success — the test file was created"
          ru: "Докладывает об успехе — файл с тестом ведь создан"
        why:
          en: "A crashing test isn't a success. (Though a hurried agent might say so.)"
          ru: "Падающий тест — не успех. (Хотя торопливый агент может так и сказать.)"
      - text:
          en: "Deletes the test"
          ru: "Удаляет тест"
        why:
          en: "The goal is a working test, not an empty folder."
          ru: "Цель — работающий тест, а не пустая папка."
    hints:
      - en: "Remember steps 5 and 6 of the loop."
        ru: "Вспомни шаги 5 и 6 цикла."
      - en: "Agents read the output of their own runs."
        ru: "Агенты читают вывод собственных прогонов."
    explain:
      en: "Running and reading the output is what makes an agent more than a chatbot: it can catch its own crashes. It still can't catch a *wrong expected value* — that one doesn't crash."
      ru: "Запуск и чтение вывода — то, что отличает агента от чат-бота: он может поймать собственные падения. А вот *неверное ожидаемое значение* он не поймает — оно не вызывает падения."
