checkPool:
  - id: c2-l1-k1
    kind: choice
    keyPoint: kp-agent-loop
    placement: true
    prompt:
      en: "Petal reads Bloomly through Playwright MCP. Which line could appear in the accessibility snapshot it gets?"
      ru: "Petal читает Bloomly через Playwright MCP. Какая строка может оказаться в снимке доступности, который он получает?"
    options:
      - text: '- button "Add to cart"'
        correct: true
        why:
          en: "Yes: a role and an accessible name. That's what the snapshot is made of."
          ru: "Да: роль и доступное имя. Из этого и состоит снимок."
      - text: '<button class="btn small" data-id="rose-bouquet">Add to cart</button>'
        why:
          en: "That's raw HTML. The snapshot keeps roles, names and text — not classes."
          ru: "Это сырой HTML. В снимке остаются роли, имена и текст, а не классы."
      - text: "pixel (412, 230): rgb(233, 30, 99)"
        why:
          en: "Pixels are what a screenshot has. The snapshot is text."
          ru: "Пиксели — это скриншот. Снимок доступности — это текст."
    optionsCode: true
    hints:
      - en: "The snapshot describes the page the way a screen reader would."
        ru: "Снимок описывает страницу так, как это сделал бы экранный диктор."
      - en: "Look for a role plus a name."
        ru: "Ищи роль плюс имя."
    explain:
      en: "Accessibility snapshots list roles and accessible names (`button \"Add to cart\"`). That's also why `get_by_role` locators come so naturally to agents."
      ru: 'Снимок доступности перечисляет роли и доступные имена (`button "Add to cart"`). Поэтому агентам так легко даются локаторы `get_by_role`.'

  - id: c2-l1-k2
    kind: parsons
    keyPoint: kp-agent-loop
    code: false
    prompt:
      en: "Put the agent loop in order."
      ru: "Расставь шаги цикла агента по порядку."
    lines:
      - "You write a prompt with the test case"
      - "The agent reads the context: prompt, project files, existing tests"
      - "It opens the app via Playwright MCP and reads the accessibility snapshot"
      - "It writes the test code"
      - "It runs pytest and reads the output"
      - "It reports back, and you review the result"
    distractors:
      - "It asks the product manager for the requirements"
    hints:
      - en: "Everything starts with you."
        ru: "Всё начинается с тебя."
      - en: "The agent can't write locators before it has seen the page."
        ru: "Агент не может писать локаторы, пока не увидел страницу."
      - en: "Prompt → context → browser → code → run → report."
        ru: "Промпт → контекст → браузер → код → запуск → отчёт."
    explain:
      en: "Prompt, context, browser, code, run, report — and the loop ends with your review. Agents don't go and ask the PM: that's your job."
      ru: "Промпт, контекст, браузер, код, запуск, отчёт — а завершает цикл твоё ревью. Агенты не ходят к продакт-менеджеру с вопросами: это твоя работа."

  - id: c2-l1-k3
    kind: predict
    keyPoint: kp-agent-limits
    prompt:
      en: "Petal wrote this test from memory without running it. Pass or fail?"
      ru: "Petal написал этот тест по памяти и не запускал его. Пройдёт или упадёт?"
    code: |
