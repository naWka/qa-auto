          ru: "Упадёт: `get_by_link` в Playwright не существует — тест сломается на строке 6."
        correct: true
      - text:
          en: "Pass: the “Shop now” link is on the home page."
          ru: "Пройдёт: ссылка «Shop now» есть на главной."
      - text:
