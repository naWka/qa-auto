  - type: mistakes
    keyPoint: kp-agent-limits
    title: { en: "Agent mistakes from this lesson", ru: "Ошибки агента из этого урока" }
    items:
      - wrong: 'page.open("/login")'
        right: 'page.goto("/login")'
        why:
          en: "Invented method. Playwright opens pages with `goto`."
          ru: "Выдуманный метод. Playwright открывает страницы через `goto`."
      - wrong: 'page.get_by_button("Log in").click()'
        right: 'page.get_by_role("button", name="Log in").click()'
        why:
          en: "Invented locator. Buttons are found by role and accessible name."
          ru: "Выдуманный локатор. Кнопки ищут по роли и доступному имени."
      - wrong: 'expect(page.get_by_role("heading", name="Welcome back, Silva!")).to_be_visible()'
        right: 'expect(page.get_by_role("heading", name="Welcome back, Anna!")).to_be_visible()'
        why:
          en: "Copied from a buggy page. The expected value must come from the requirement, not from the screen."
          ru: "Списано с багованной страницы. Ожидаемое значение берётся из требования, а не с экрана."

  - type: explain
    keyPoint: kp-agent-limits
    prompt:
      en: "In your own words: what does the agent see when it works with Bloomly — and what can't it know?"
      ru: "Своими словами: что видит агент, когда работает с Bloomly, — и чего он знать не может?"
    model:
      en: "It sees my prompt, the project files and the page as an accessibility snapshot: roles, names, texts. It can't know the requirements, which test data matters, or whether what the page shows is correct. It may also invent methods or elements. So I decide what to check, and I review what it writes."
      ru: "Он видит мой промпт, файлы проекта и страницу в виде снимка доступности: роли, имена, тексты. Он не может знать требований, какие тестовые данные важны и правильно ли то, что показывает страница. А ещё он может выдумать методы или элементы. Поэтому что проверять, решаю я, и я же проверяю то, что он написал."

