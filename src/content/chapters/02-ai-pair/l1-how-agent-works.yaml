id: c2-l1
chapter: c2
title: { en: "How an AI agent writes a test", ru: "Как ИИ-агент пишет тест" }
goal:
  en: "See what the agent does step by step — and what it can't know without you."
  ru: "Увидеть, что агент делает шаг за шагом, — и чего он не может знать без тебя."
minutes: 9
keyPoints:
  - id: kp-agent-loop
    title: { en: "The agent loop: prompt → context → browser → code → run → report", ru: "Цикл агента: промпт → контекст → браузер → код → запуск → отчёт" }
  - id: kp-agent-limits
    title: { en: "The agent doesn't know the requirements and can hallucinate", ru: "Агент не знает требований и может галлюцинировать" }
  - id: kp-you-decide
    title: { en: "You decide what to test and whether to trust the result", ru: "Ты решаешь, что проверять и можно ли доверять результату" }
terms: [ai-agent, llm, prompt, context, mcp, accessibility-snapshot, hallucination, negative-test, edge-case]
steps:
  - type: story
    lines:
      - who: leo
        text:
          en: "Welcome to the AI Lab! This is Petal, our AI coding agent. Your access is ready."
          ru: "Добро пожаловать в ИИ-лабораторию! Это Petal, наш ИИ-агент для написания кода. Доступ у тебя уже есть."
      - who: petal
        text:
          en: "Hello! I can write a Playwright test for anything in Bloomly. In seconds!"
          ru: "Привет! Я могу написать Playwright-тест на что угодно в Bloomly. За секунды!"
      - who: maya
        text:
          en: "Fast isn't the same as right. Today we look inside: how Petal works, and where it slips."
          ru: "Быстро — не значит правильно. Сегодня заглянем внутрь: как работает Petal и где он ошибается."

  - type: pretest
    intro:
      en: "Quick guess before we start. Wrong answers are fine — they help you remember."
      ru: "Быстрая догадка перед стартом. Ошибаться можно — так лучше запоминается."
    items:
      - id: c2-l1-p1
        kind: choice
        keyPoint: kp-agent-loop
        prompt:
          en: "Petal opens Bloomly in a browser through Playwright MCP. What does it actually “see”?"
          ru: "Petal открывает Bloomly в браузере через Playwright MCP. Что он на самом деле «видит»?"
        options:
          - text:
              en: 'A list of elements with roles and names, like `button "Log in"`'
              ru: 'Список элементов с ролями и именами, например `button "Log in"`'
            correct: true
            why:
              en: "Right. It's an accessibility snapshot: the page the way a screen reader hears it — text, not pixels."
              ru: "Верно. Это снимок доступности: страница такой, какой её «слышит» экранный диктор, — текст, а не пиксели."
          - text:
              en: "A screenshot, pixel by pixel, like a human"
              ru: "Скриншот, пиксель за пикселем, как человек"
            why:
              en: "Agents can take screenshots, but Playwright MCP mainly gives them the accessibility snapshot — structured text."
              ru: "Агенты умеют делать скриншоты, но Playwright MCP в основном отдаёт им снимок доступности — структурированный текст."
          - text:
              en: "The server code and the database"
              ru: "Код сервера и базу данных"
            why:
              en: "No. Through the browser it sees only what the page shows — like a user."
              ru: "Нет. Через браузер он видит только то, что показывает страница, — как пользователь."
        hints:
          - en: "MCP gives the agent tools to drive a real browser. Think about what a browser can expose as text."
            ru: "MCP даёт агенту инструменты для управления настоящим браузером. Подумай, что браузер может отдать в виде текста."
          - en: "Screen readers don't look at pixels either."
            ru: "Экранные дикторы тоже не смотрят на пиксели."
        explain:
          en: "Playwright MCP sends the agent an accessibility snapshot: roles (button, heading, textbox) and accessible names (“Log in”). That's why agents are good at writing `get_by_role(...)` locators."
          ru: "Playwright MCP отправляет агенту снимок доступности: роли (button, heading, textbox) и доступные имена («Log in»). Поэтому агенты хорошо пишут локаторы `get_by_role(...)`."
      - id: c2-l1-p2
        kind: choice
        keyPoint: kp-agent-limits
        prompt:
          en: "Petal logs in as Anna and sees the heading “Welcome back, Silva!”. What will it most likely do?"
          ru: "Petal входит как Anna и видит заголовок «Welcome back, Silva!». Что он, скорее всего, сделает?"
        options:
          - text:
              en: "Write a test that expects “Welcome back, Silva!”"
              ru: "Напишет тест, который ожидает «Welcome back, Silva!»"
            correct: true
            why:
              en: "Yes. Petal doesn't know the requirement (greet by first name). It records what the page shows today — even if it's a bug."
              ru: "Да. Petal не знает требования (приветствовать по имени). Он записывает то, что страница показывает сегодня, — даже если это баг."
          - text:
              en: "Report a bug: the greeting should use the first name"
              ru: "Заведёт баг: в приветствии должно быть имя, а не фамилия"
            why:
              en: "That needs the requirement. Petal doesn't have it unless you give it."
              ru: "Для этого нужно знать требование. У Petal его нет, пока ты его не дашь."
          - text:
              en: "Refuse to write the test until someone confirms the text"
              ru: "Откажется писать тест, пока кто-нибудь не подтвердит текст"
            why:
              en: "Agents rarely stop to ask. They are built to finish the task."
              ru: "Агенты редко останавливаются, чтобы спросить. Они созданы, чтобы довести задачу до конца."
        hints:
          - en: "Does Petal know how Bloomly *should* greet people?"
            ru: "Знает ли Petal, как Bloomly *должен* приветствовать людей?"
          - en: "An agent writes down what it observes."
            ru: "Агент записывает то, что наблюдает."
        explain:
          en: "The agent tests what IS. Only someone who knows the requirement can say that “Silva” is wrong. That someone is you."
          ru: "Агент проверяет то, что ЕСТЬ. Сказать, что «Silva» — ошибка, может только тот, кто знает требование. Это ты."

  - type: theory
    keyPoint: kp-agent-loop
    title: { en: "LLM + tools = agent", ru: "LLM + инструменты = агент" }
    body:
      - en: "An [[LLM|llm]] (large language model) predicts text: you give it text, it continues it. It has read a huge part of the internet — but on its own it can't click anything."
        ru: "[[LLM|llm]] (большая языковая модель) предсказывает текст: даёшь ей текст — она его продолжает. Она прочитала огромную часть интернета, но сама по себе ничего не кликает."
      - en: "An [[AI agent|ai-agent]] is an LLM plus tools: it can read files, run commands and drive a browser. Claude Code, GitHub Copilot in agent mode, Cursor — these are all agents."
        ru: "[[ИИ-агент|ai-agent]] — это LLM плюс инструменты: он читает файлы, запускает команды и управляет браузером. Claude Code, GitHub Copilot в режиме агента, Cursor — всё это агенты."
      - en: "Picture a new colleague who reads and types incredibly fast — but joined yesterday and has never seen your requirements."
        ru: "Представь нового коллегу, который невероятно быстро читает и печатает, — но пришёл вчера и ни разу не видел ваших требований."
    mentor:
      en: "That's Petal. Brilliant on day one, and knows nothing about our business."
      ru: "Это и есть Petal. Блестящий с первого дня — и ничего не знает о нашем бизнесе."

  - type: theory
    keyPoint: kp-agent-loop
    title: { en: "The agent loop", ru: "Цикл агента" }
    body:
      - en: "1) You write a [[prompt]]. 2) The agent reads the [[context]]: your prompt, the project files, the existing tests."
        ru: "1) Ты пишешь [[промпт|prompt]]. 2) Агент читает [[контекст|context]]: твой промпт, файлы проекта, существующие тесты."
      - en: "3) It opens a real browser through [[Playwright MCP|mcp]] (or the more token-efficient Playwright CLI, `@playwright/cli`) and reads an [[accessibility snapshot|accessibility-snapshot]] — roles and names, like the fragment below."
        ru: "3) Он открывает настоящий браузер через [[Playwright MCP|mcp]] (или более экономный по токенам Playwright CLI, `@playwright/cli`) и читает [[снимок доступности|accessibility-snapshot]] — роли и имена, как во фрагменте ниже."
      - en: "4) It writes the test, 5) runs `pytest`, reads the output and fixes what broke, 6) reports back to you."
        ru: "4) Пишет тест, 5) запускает `pytest`, читает вывод и чинит то, что сломалось, 6) отчитывается тебе."
    code: |
      - article:
        - img "Bouquet of pink roses"
        - heading "Rose Bouquet" [level=2]
        - paragraph: €35.00
        - button "Add to cart"
    figure: agent-loop
    mentor:
      en: "Notice: the snapshot has `button \"Add to cart\"` — no colours, no CSS classes. That's why a good agent writes `get_by_role(\"button\", name=\"Add to cart\")`."
      ru: 'Обрати внимание: в снимке есть `button "Add to cart"` — ни цветов, ни CSS-классов. Поэтому хороший агент пишет `get_by_role("button", name="Add to cart")`.'

  - type: theory
    keyPoint: kp-agent-limits
    title: { en: "Where the agent slips", ru: "Где агент ошибается" }
    body:
      - en: "**It doesn't know the requirements.** It sees what the page does *now* and writes that down — even if it's a bug."
        ru: "**Он не знает требований.** Он видит, что страница делает *сейчас*, и записывает это — даже если это баг."
      - en: "**It hallucinates.** A [[hallucination]] is confident nonsense: a method that doesn't exist (`page.open`), a button that isn't there, a text nobody wrote."
        ru: "**Он галлюцинирует.** [[Галлюцинация|hallucination]] — это уверенная чепуха: несуществующий метод (`page.open`), кнопка, которой нет, текст, который никто не писал."
      - en: "**It sounds equally sure when it's wrong.** “Done, all tests pass ✅” tells you nothing about *what* they check."
        ru: "**Он так же уверен, когда ошибается.** «Готово, все тесты проходят ✅» ничего не говорит о том, *что* они проверяют."
    mentor:
      en: "The agent tests what IS. You test what SHOULD BE. That's the whole difference."
      ru: "Агент проверяет то, что ЕСТЬ. Ты — то, что ДОЛЖНО БЫТЬ. В этом вся разница."

  - type: theory
    keyPoint: kp-you-decide
    title: { en: "What stays yours", ru: "Что остаётся за тобой" }
    body:
      - en: "The agent takes the typing: code, runs, reading error output. You keep the thinking: **what** to test, **reviewing** the code, **verifying** that a green test means something."
        ru: "Агент берёт на себя набор: код, запуски, чтение ошибок. За тобой — мышление: **что** проверять, **ревью** кода и **проверка** того, что зелёный тест что-то значит."
      - en: "Boundary values, [[negative tests|negative-test]], [[edge cases|edge-case]], product knowledge — that's your three years of experience. The agent has none of it."
        ru: "Граничные значения, [[негативные тесты|negative-test]], [[пограничные случаи|edge-case]], знание продукта — это твои три года опыта. У агента ничего этого нет."
      - en: "Playwright even has its own Test Agents — planner, generator and healer — but they work only with its JavaScript test runner. In a Python project you set up the same roles yourself: Claude Code or Copilot subagents + Playwright MCP + pytest. That's chapter 8. The rule stays the same: a human decides."
        ru: "У Playwright есть даже собственные Test Agents — planner, generator и healer, — но они работают только с его JavaScript-раннером. В Python-проекте те же роли настраиваешь ты: сабагенты Claude Code или Copilot + Playwright MCP + pytest. Это глава 8. Правило то же: решает человек."
    mentor:
      en: "You've reviewed requirements and junior colleagues' test cases. Reviewing Petal is the same job — in code."
      ru: "Ты уже проверял{а|} требования и тест-кейсы младших коллег. Ревью Petal — та же работа, только в коде."

  - type: example
    keyPoint: kp-agent-loop
    title: { en: "Petal's first test, line by line", ru: "Первый тест Petal построчно" }
    intro:
      en: "Leo asked Petal: “Write a test: Anna logs in and sees her greeting.” Here is the result — and where each piece came from."
      ru: "Leo попросил Petal: «Напиши тест: Anna входит и видит приветствие». Вот результат — и откуда взялась каждая часть."
    code: |
      from playwright.sync_api import Page, expect


      def test_registered_user_can_log_in(page: Page):
          page.goto("/login")
          page.get_by_label("Email").fill("anna@bloomly.app")
          page.get_by_label("Password").fill("bloom123")
          page.get_by_role("button", name="Log in").click()
          expect(page.get_by_role("heading", name="Welcome back, Anna!")).to_be_visible()
    notes:
      - lines: 1
        text:
          en: "The standard import. Petal copied it from the existing test files — that's context."
          ru: "Стандартный импорт. Petal взял его из существующих тестов — это контекст."
      - lines: 4
        text:
          en: "The test name: Petal phrased it from the prompt. The `test_` prefix is what makes pytest find and run this function."
          ru: "Имя теста: Petal сформулировал его по промпту. Благодаря приставке `test_` pytest находит эту функцию и запускает её."
      - lines: 5
        text:
          en: "The URL /login: Petal found it by clicking around the app in the browser."
          ru: "URL /login: Petal нашёл его, пощёлкав по приложению в браузере."
      - lines: [6, 7]
        text:
          en: "The email and password came from the prompt. The labels “Email” and “Password” came from the accessibility snapshot."
          ru: "Email и пароль пришли из промпта. Метки «Email» и «Password» — из снимка доступности."
      - lines: 8
        text:
          en: 'Role and name straight from the snapshot: `button "Log in"`.'
          ru: 'Роль и имя прямо из снимка: `button "Log in"`.'
      - lines: 9
        text:
          en: "The expected greeting: the prompt said “sees her greeting”, and Petal took the text from the page. Is “Welcome back, Anna!” the *required* text? Only the test case knows."
          ru: "Ожидаемое приветствие: в промпте было «видит приветствие», а текст Petal взял со страницы. Это *требуемый* текст — «Welcome back, Anna!»? Знает только тест-кейс."
    runnable: true

  - type: task
    task:
      id: c2-l1-t1
      kind: agent
      keyPoint: kp-agent-loop
      context:
        en: "Petal in this trainer is **simulated**: its answers are scripted so you can practise safely. A real agent's output differs from run to run — but its mistakes are of the same kinds."
        ru: "Petal в тренажёре **симулирован**: его ответы написаны заранее, чтобы тренироваться было безопасно. Настоящий агент отвечает по-разному от запуска к запуску, но ошибается так же."
      prompt:
        en: "Build a prompt for Petal from the blocks: pick the ones that give a good test for TC-101. Then run what Petal writes."
        ru: "Собери промпт для Petal из блоков: выбери те, что дадут хороший тест для TC-101. Потом запусти то, что напишет Petal."
      testCase:
        id: TC-101
        title: Registered user can log in
        preconditions: ["User anna@bloomly.app / bloom123 exists"]
        steps:
          - { action: "Open /login" }
          - { action: "Enter email and password", data: "anna@bloomly.app / bloom123" }
          - { action: "Click \"Log in\"", expected: "Heading \"Welcome back, Anna!\" is shown" }
      blocks:
        - { id: task, locked: true, text: "Write a Playwright test for TC-101: a registered user can log in to Bloomly.", ru: "Напиши Playwright-тест для TC-101: зарегистрированный пользователь может войти в Bloomly." }
        - { id: steps, text: 'Steps: open /login, enter anna@bloomly.app and bloom123, click "Log in".', ru: "Шаги: открой /login, введи anna@bloomly.app и bloom123, нажми «Log in»." }
        - { id: expected, text: 'Expected: the heading "Welcome back, Anna!" is visible.', ru: "Ожидаемый результат: виден заголовок «Welcome back, Anna!»." }
        - { id: noise, text: "Make it perfect!!!", ru: "Сделай идеально!!!" }
      responses:
        - when: [steps, expected]
          best: true
          message:
            en: "Done! I opened /login, read the form in the accessibility snapshot and wrote the test. It checks the greeting from TC-101. Ran it once — green ✅"
            ru: "Готово! Я открыл /login, прочитал форму в снимке доступности и написал тест. Он проверяет приветствие из TC-101. Один раз запустил — зелёный ✅"
          code: |
            from playwright.sync_api import Page, expect


            def test_registered_user_can_log_in(page: Page):
                page.goto("/login")
                page.get_by_label("Email").fill("anna@bloomly.app")
                page.get_by_label("Password").fill("bloom123")
                page.get_by_role("button", name="Log in").click()
                expect(page.get_by_role("heading", name="Welcome back, Anna!")).to_be_visible()
        - when: [steps]
          message:
            en: "Done! The test logs in as Anna. Ran it — green ✅"
            ru: "Готово! Тест входит как Anna. Запустил — зелёный ✅"
          code: |
            from playwright.sync_api import Page, expect


            def test_registered_user_can_log_in(page: Page):
                page.goto("/login")
                page.get_by_label("Email").fill("anna@bloomly.app")
                page.get_by_label("Password").fill("bloom123")
                page.get_by_role("button", name="Log in").click()
        - when: []
          message:
            en: "Done! I wasn't sure which user to take, so I checked that the login page opens. Green ✅"
            ru: "Готово! Я не знал, какого пользователя взять, поэтому проверил, что страница входа открывается. Зелёный ✅"
          code: |
            from playwright.sync_api import Page, expect


            def test_login_page_opens(page: Page):
                page.goto("/login")
                expect(page.get_by_role("heading", name="Log in")).to_be_visible()
      missing:
        steps:
          en: "Without steps and data Petal didn't know which account to use — so it only checked that the login page opens. That's not TC-101."
          ru: "Без шагов и данных Petal не знал, какой аккаунт взять, — и проверил только, что открывается страница входа. Это не TC-101."
        expected:
          en: "Without the expected result Petal had nothing to check: the test logs in and stops. It's green — and proves nothing."
          ru: "Без ожидаемого результата Petal нечего было проверять: тест входит и останавливается. Он зелёный — и ничего не доказывает."
      checks:
        expect: pass
        static: [hasAssertion, noHardWait]
      hints:
        - en: "Look at TC-101: which parts of the test case does Petal need?"
          ru: "Посмотри на TC-101: какие части тест-кейса нужны Petal?"
        - en: "A test needs actions *and* something to check at the end."
          ru: "Тесту нужны действия *и* то, что проверить в конце."
        - en: "Take the steps block and the expected block. “Make it perfect!!!” adds nothing."
          ru: "Возьми блок шагов и блок ожидаемого результата. «Сделай идеально!!!» ничего не добавляет."
      praise:
        en: "Your prompt carried the whole test case — that's why Petal's test checks the right thing."
        ru: "В твоём промпте был весь тест-кейс — поэтому тест Petal проверяет то, что нужно."
      explain:
        en: "Steps, data and the expected result give Petal everything TC-101 has. “Make it perfect!!!” sounds motivating, but it contains no information: an agent can't turn emotions into checks."
        ru: "Шаги, данные и ожидаемый результат дают Petal всё, что есть в TC-101. «Сделай идеально!!!» звучит мотивирующе, но информации в этом нет: эмоции агент в проверки не превратит."

  - type: task
    task:
      id: c2-l1-t2
      kind: choice
      keyPoint: kp-agent-limits
      multi: true
      prompt:
        en: "Which of these can Petal NOT find out on its own by exploring Bloomly in the browser? Pick all."
        ru: "Что из этого Petal НЕ сможет узнать сам, исследуя Bloomly в браузере? Выбери всё подходящее."
      options:
        - text:
            en: "That the greeting must use the first name (“Anna”), not the last name"
            ru: "Что в приветствии должно быть имя («Anna»), а не фамилия"
          correct: true
          why:
            en: "That's a requirement. The page shows whatever it shows — right or wrong."
            ru: "Это требование. Страница показывает то, что показывает, — правильно это или нет."
        - text:
            en: "Which test account is meant for this case"
            ru: "Какой тестовый аккаунт нужен для этого кейса"
          correct: true
          why:
            en: "It may guess or even invent one. Test data is your decision."
            ru: "Он может угадать или даже выдумать аккаунт. Тестовые данные — твоё решение."
        - text:
            en: "That a locked user must see “Your account is locked. Please contact support.”"
            ru: "Что заблокированный пользователь должен видеть «Your account is locked. Please contact support.»"
          correct: true
          why:
            en: "Unless it happens to try the locked account, it won't even know this rule exists."
            ru: "Если он случайно не попробует заблокированный аккаунт, то даже не узнает, что такое правило есть."
        - text:
            en: "The accessible name of the login button"
            ru: "Доступное имя кнопки входа"
          why:
            en: 'This it *can* see: the snapshot shows `button "Log in"`.'
            ru: 'Это он *может* увидеть: в снимке есть `button "Log in"`.'
        - text:
            en: "The URL of the login page"
            ru: "URL страницы входа"
          why:
            en: "It can find it by clicking the “Log in” link."
            ru: "Он найдёт его, нажав на ссылку «Log in»."
      hints:
        - en: "Split the list: what's visible on the page vs what lives in requirements and in your head."
          ru: "Раздели список: что видно на странице, а что живёт в требованиях и у тебя в голове."
        - en: "Names, labels and URLs are on the page. Rules and intentions are not."
          ru: "Имена, метки и URL есть на странице. Правил и намерений там нет."
        - en: "Three answers: the first-name rule, the test account and the locked-user rule."
          ru: "Три ответа: правило про имя, тестовый аккаунт и правило про заблокированного пользователя."
      praise:
        en: "Exactly — you separated what the page shows from what the business wants."
        ru: "Именно — ты отделил{а|} то, что показывает страница, от того, чего хочет бизнес."
      explain:
        en: "The agent sees structure: roles, names, URLs. Requirements, business rules and the choice of test data are outside the page. That's where you come in."
        ru: "Агент видит структуру: роли, имена, URL. Требования, бизнес-правила и выбор тестовых данных — за пределами страницы. Здесь вступаешь ты."

  - type: task
    task:
      id: c2-l1-t3
      kind: review
      keyPoint: kp-agent-limits
      context:
        en: "Petal wrote this login test in a hurry and hasn't run it yet."
        ru: "Petal написал этот тест входа в спешке и ещё не запускал его."
      prompt:
        en: "Find the lines with problems and choose the issue type."
        ru: "Найди строки с проблемами и выбери тип проблемы."
      code: |
        from playwright.sync_api import Page, expect


        def test_registered_user_can_log_in(page: Page):
            page.open("/login")
            page.get_by_label("Email").fill("anna@bloomly.app")
            page.get_by_label("Password").fill("bloom123")
            page.get_by_button("Log in").click()
            expect(page.get_by_role("heading", name="Welcome back, Anna!")).to_be_visible()
      issues:
        - line: 5
          type: hallucination
          note:
            en: 'There is no `page.open` in Playwright. Pages are opened with `page.goto("/login")`.'
            ru: 'В Playwright нет `page.open`. Страницы открывают через `page.goto("/login")`.'
        - line: 8
          type: hallucination
          note:
            en: "`get_by_button` doesn't exist. Buttons are found by role: `page.get_by_role(\"button\", name=\"Log in\")`."
            ru: '`get_by_button` не существует. Кнопки ищут по роли: `page.get_by_role("button", name="Log in")`.'
      types: [hallucination, fragile-locator, no-assertion, wrong-data]
      hints:
        - en: "Compare the method names with Petal's first test from the example."
          ru: "Сравни названия методов с первым тестом Petal из примера."
        - en: "Look at how the page is opened and how the button is found."
          ru: "Посмотри, как открывается страница и как ищется кнопка."
        - en: "Lines 5 and 8 use methods Playwright doesn't have."
          ru: "В строках 5 и 8 — методы, которых в Playwright нет."
      praise:
        en: "Sharp eye: plausible-looking but invented methods are the classic AI hallucination."
        ru: "Зоркий глаз: правдоподобные, но выдуманные методы — классическая галлюцинация ИИ."
      explain:
        en: "Agents mix up APIs from different tools and invent plausible names. `page.open` and `get_by_button` look reasonable — that's what makes them dangerous. A run would crash on line 5 with `AttributeError: 'Page' object has no attribute 'open'`; a good agent fixes that in its next loop, a hurried one leaves it to you."
        ru: "Агенты путают API разных инструментов и придумывают правдоподобные имена. `page.open` и `get_by_button` выглядят разумно — этим они и опасны. Прогон упадёт на строке 5 с `AttributeError: 'Page' object has no attribute 'open'`; хороший агент исправит это на следующем круге цикла, торопливый — оставит тебе."

  - type: task
    task:
      id: c2-l1-t4
      kind: predict
      keyPoint: kp-agent-limits
      app: { bugs: [greeting-wrong-name] }
      context:
        en: "Kai's latest build has a bug: the account greeting uses the last name. Petal explored this build and wrote a test from what it saw."
        ru: "В последней сборке Kai есть баг: приветствие в аккаунте использует фамилию. Petal исследовал эту сборку и написал тест по тому, что увидел."
      prompt:
        en: "Will this test pass or fail on that build?"
        ru: "Этот тест пройдёт или упадёт на этой сборке?"
      code: |
        from playwright.sync_api import Page, expect


        def test_user_sees_a_greeting_after_login(page: Page):
            page.goto("/login")
            page.get_by_label("Email").fill("anna@bloomly.app")
            page.get_by_label("Password").fill("bloom123")
            page.get_by_role("button", name="Log in").click()
            expect(page.get_by_role("heading", name="Welcome back, Silva!")).to_be_visible()
      outcome: pass
      reasons:
        - text:
            en: "Pass: Petal copied the buggy text from the page, so the test agrees with the bug."
            ru: "Пройдёт: Petal списал текст с багованной страницы, и тест согласен с багом."
          correct: true
        - text:
            en: "Fail: the app has a bug, so the test must be red."
            ru: "Упадёт: в приложении баг, значит, тест обязан покраснеть."
        - text:
            en: "Fail: `get_by_role(\"heading\")` can't find headings by text."
            ru: 'Упадёт: `get_by_role("heading")` не умеет искать заголовки по тексту.'
      hints:
        - en: "Compare the expected text in the test with what this build shows."
          ru: "Сравни ожидаемый текст в тесте с тем, что показывает эта сборка."
        - en: "The test expects “Silva”. What does the buggy build show?"
          ru: "Тест ждёт «Silva». Что показывает багованная сборка?"
        - en: "The test and the bug say the same thing — so they agree."
          ru: "Тест и баг говорят одно и то же — значит, они согласны."
      praise:
        en: "You saw it: green, and wrong. That's exactly the trap the agent can't see."
        ru: "Ты это увидел{а|}: зелёный — и неправильный. Именно эту ловушку агент не видит."
      explain:
        en: "A test only knows what you tell it. Petal took its expected value from a buggy screen, so the bug became “expected”. This is a [[false negative|false-negative]]: the bug is there, the test is green. Only the requirement “greet by first name” — your knowledge — catches it."
        ru: "Тест знает только то, что ему сказали. Petal взял ожидаемое значение с багованного экрана, и баг стал «ожидаемым». Это [[ложноотрицательный результат|false-negative]]: баг есть, а тест зелёный. Поймать его можно только через требование «приветствовать по имени» — то есть через твоё знание."

  - type: task
    task:
      id: c2-l1-t5
      kind: choice
      keyPoint: kp-you-decide
      prompt:
        en: "Sofia asks in Slack: “Can Petal just test the whole checkout by itself? Then we don't need test design anymore, right?” What's your best reply?"
        ru: "Sofia спрашивает в Slack: «А Petal может сам протестировать весь чекаут? Тогда тест-дизайн нам больше не нужен, да?» Какой ответ лучший?"
      options:
        - text:
            en: "“Petal can write and run the tests fast. I'll decide what to cover — past delivery dates, empty fields, the gift message limit — and review what it writes.”"
            ru: "«Petal быстро напишет и прогонит тесты. А я решу, что покрывать, — даты в прошлом, пустые поля, лимит подарочного сообщения — и проверю, что он написал.»"
          correct: true
          why:
            en: "That's the split: the agent types and runs, you design and verify."
            ru: "Вот это разделение: агент печатает и запускает, ты проектируешь и проверяешь."
        - text:
            en: "“Yes, Petal knows the app better than we do — it reads the code.”"
            ru: "«Да, Petal знает приложение лучше нас — он же читает код.»"
          why:
            en: "It reads code and pages, not requirements. It can't tell a bug from a feature."
            ru: "Он читает код и страницы, а не требования. Отличить баг от фичи он не может."
        - text:
            en: "“No, AI agents are useless for testing.”"
            ru: "«Нет, ИИ-агенты для тестирования бесполезны.»"
          why:
            en: "Too far the other way. Petal saves hours of typing — when someone leads it."
            ru: "Перегиб в другую сторону. Petal экономит часы набора — если им кто-то руководит."
        - text:
            en: "“Yes, if we ask it to make the tests perfect.”"
            ru: "«Да, если попросить его сделать тесты идеальными.»"
          why:
            en: "“Perfect” isn't a requirement. The agent needs concrete checks."
            ru: "«Идеально» — не требование. Агенту нужны конкретные проверки."
      hints:
        - en: "Who knows which cases are risky in checkout?"
          ru: "Кто знает, какие кейсы в чекауте рискованные?"
        - en: "The best answer gives each side the work it's good at."
          ru: "Лучший ответ отдаёт каждой стороне ту работу, в которой она сильна."
        - en: "Look for the reply that names concrete risky cases."
          ru: "Ищи ответ, где названы конкретные рискованные кейсы."
      praise:
        en: "A calm, senior answer: you value the agent's speed and keep the test design."
        ru: "Спокойный ответ уровня senior: ты ценишь скорость агента и оставляешь тест-дизайн за собой."
      explain:
        en: "Past dates, empty required fields, the 200-character gift message — that's test design: [[negative tests|negative-test]] and [[edge cases|edge-case]]. The agent won't invent them from requirements it has never seen. In test design you are stronger than the agent."
        ru: "Даты в прошлом, пустые обязательные поля, подарочное сообщение на 200 символов — это тест-дизайн: [[негативные тесты|negative-test]] и [[пограничные случаи|edge-case]]. Агент не придумает их из требований, которых никогда не видел. В тест-дизайне ты сильнее агента."

