        ru: "Сравни каждую метку и название кнопки с настоящей страницей входа."
      - en: "Many sites say “Username” and “Sign in”. Bloomly doesn't."
        ru: "На многих сайтах пишут «Username» и «Sign in». В Bloomly — нет."
      - en: "Lines 6 and 8."
        ru: "Строки 6 и 8."
    explain:
      en: "Without looking at the page, the agent filled the gaps with the most common words on the internet. Elements can be hallucinated just like methods."
      ru: "Не глядя на страницу, агент заполнил пробелы самыми частыми словами из интернета. Элементы галлюцинируются так же, как методы."

