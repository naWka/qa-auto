      code: |
        import { test, expect } from '@playwright/test';

        test('search finds roses', async ({ page }) => {
          await page.goto('/shop');
          await page.getByLabel('Search').fill('Rose');
          await expect(page.getByTestId('results-count')).toHaveText('1 product');
        });
      outcome: pass
      reasons:
        - text:
            en: "Pass: Petal typed “Rose” exactly like the product name, so the case bug never shows up."
            ru: "Пройдёт: Petal ввёл «Rose» точно как в названии товара, и баг с регистром не проявился."
          correct: true
        - text:
            en: "Fail: search is broken on this build, so any search test fails."
            ru: "Упадёт: поиск в этой сборке сломан, значит, любой тест поиска упадёт."
        - text:
            en: "Fail: the count text should be “1 products”."
            ru: "Упадёт: текст счётчика должен быть «1 products»."
      hints:
        - en: "The bug breaks lower case. What did Petal type?"
          ru: "Баг ломает поиск в нижнем регистре. Что ввёл Petal?"
        - en: "“Rose” matches “Rose Bouquet” even with case-sensitive search."
          ru: "«Rose» совпадает с «Rose Bouquet» даже при поиске с учётом регистра."
        - en: "The test passes — and misses the bug."
          ru: "Тест проходит — и пропускает баг."
      praise:
        en: "Right — and you see why: the vague prompt left out the detail that matters."
        ru: "Верно — и ты видишь почему: в размытом промпте не было важной детали."
      explain:
        en: "Real customers type “rose”, lower case. Petal copied the product name, so the bug slipped through. Your test-design instinct (“try lower case”) has to be *in the prompt* — the agent won't add it for you."
        ru: "Реальные покупатели пишут «rose», с маленькой буквы. Petal скопировал название товара, и баг проскочил. Твоё чутьё тест-дизайнера («попробуй нижний регистр») должно быть *в промпте* — сам агент его не добавит."

