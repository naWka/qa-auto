  - type: mistakes
    keyPoint: kp-prompt-context
    title: { en: "Weak prompt → strong prompt", ru: "Слабый промпт → сильный промпт" }
    items:
      - wrong: "Test the login."
        right: 'TC-102: on /login log in as anna@bloomly.app with password nope123. Expect the alert "Invalid email or password."'
        why:
          en: "A vague task gets *a* test, not *your* test."
          ru: "На размытую задачу получаешь *какой-то* тест, а не *твой*."
      - wrong: "Make it perfect!!!"
        right: 'Expected: the header cart counter shows "1".'
        why:
          en: "Emotions aren't checks. Name the exact result."
          ru: "Эмоции — не проверки. Назови точный результат."
      - wrong: "Use waitForTimeout(5000) to be safe."
        right: "Wait with expect(...) assertions — no waitForTimeout."
        why:
          en: "Hard waits make tests slow and still flaky. Playwright assertions wait by themselves."
          ru: "Жёсткие ожидания делают тесты медленными и всё равно нестабильными. Проверки Playwright ждут сами."
      - wrong: "Log in as some user."
        right: "Log in as anna@bloomly.app / bloom123 (existing test data)."
        why:
          en: "Without data the agent invents accounts that don't exist."
          ru: "Без данных агент выдумывает несуществующие аккаунты."

  - type: explain
    keyPoint: kp-prompt-parts
    prompt:
      en: "In your own words: why is a good test case already a good prompt?"
      ru: "Своими словами: почему хороший тест-кейс — это уже хороший промпт?"
    model:
      en: "Both have to be executed by someone who doesn't know what I know. A test case has a goal, preconditions, steps, data and an expected result — and each of these becomes part of the test: the start state, the actions, the values, the assertions. If a part is missing, the agent guesses, and its guesses become bugs in the test. I add the team's rules and an example file so it writes the test our way."
      ru: "И то и другое выполняет кто-то, кто не знает того, что знаю я. В тест-кейсе есть цель, предусловия, шаги, данные и ожидаемый результат — и каждая часть становится частью теста: стартовым состоянием, действиями, значениями, проверками. Если части нет, агент гадает, и его догадки становятся багами в тесте. Я добавляю правила команды и файл-образец, чтобы он написал тест так, как принято у нас."

  - type: phrases
    items:
      - context: prompt
        en: "Write a Playwright test for TC-130. Use getByRole and getByLabel locators, no waitForTimeout."
        ru: "Напиши Playwright-тест для TC-130. Используй локаторы getByRole и getByLabel, без waitForTimeout."
      - context: prompt
        en: "Use the existing test account anna@bloomly.app — don't create new users."
        ru: "Используй существующий тестовый аккаунт anna@bloomly.app — не создавай новых пользователей."
      - context: prompt
        en: "Follow the conventions in tests/login.spec.ts."
        ru: "Следуй соглашениям из tests/login.spec.ts."
        note:
          en: "Pointing to an existing file is the fastest way to give context."
          ru: "Ссылка на существующий файл — самый быстрый способ дать контекст."
      - context: chat
        en: "Petal's test was too generic, so I rewrote the prompt with the expected result from the test case."
        ru: "Тест от Petal получился слишком общим, поэтому я переписал{а|} промпт и добавил{а|} ожидаемый результат из тест-кейса."
      - context: standup
        en: "I've turned five checkout test cases into prompts; Petal is generating the tests now."
        ru: "Я превратил{а|} пять тест-кейсов чекаута в промпты, сейчас Petal генерирует по ним тесты."

checkPool:
  - id: c2-l2-k1
    kind: choice
    keyPoint: kp-prompt-parts
    placement: true
    prompt:
      en: "Your prompt has the goal, the steps and the test data. What's missing, so that the test gets an assertion?"
      ru: "В твоём промпте есть цель, шаги и тестовые данные. Чего не хватает, чтобы в тесте появилась проверка?"
    options:
      - text: { en: "The expected result", ru: "Ожидаемого результата" }
        correct: true
        why:
          en: "The expected result is what becomes `expect(...)`."
          ru: "Именно ожидаемый результат превращается в `expect(...)`."
      - text: { en: "A compliment for the agent", ru: "Комплимента агенту" }
        why:
          en: "Compliments don't turn into checks."
          ru: "Комплименты в проверки не превращаются."
      - text: { en: "The word “please”", ru: "Слова «пожалуйста»" }
        why:
          en: "Polite is nice, but it adds no facts."
          ru: "Вежливость — это приятно, но фактов она не добавляет."
      - text: { en: "A longer test title", ru: "Более длинного названия теста" }
        why:
          en: "The title describes the test; it doesn't check anything."
          ru: "Название описывает тест, но ничего не проверяет."
    hints:
      - en: "Which part of a test case says what should happen?"
        ru: "Какая часть тест-кейса говорит, что должно произойти?"
      - en: "No ___ → no assertion."
        ru: "Нет ___ → нет проверки."
    explain:
      en: "Steps become actions, the expected result becomes assertions. Without it the agent writes a test that only clicks."
      ru: "Шаги становятся действиями, ожидаемый результат — проверками. Без него агент напишет тест, который только кликает."

  - id: c2-l2-k2
    kind: agent
    keyPoint: kp-prompt-rules
    app: { state: { cart: [{ id: rose-bouquet, qty: 1 }] } }
    context:
      en: "The cart is preset with 1 Rose Bouquet (like a saved browser state). Petal is simulated."
      ru: "В корзине заранее лежит 1 Rose Bouquet (как сохранённое состояние браузера). Petal симулирован."
    prompt:
      en: "Compose the prompt for TC-150 so that Petal's test follows the team rules."
      ru: "Собери промпт для TC-150 так, чтобы тест Petal соответствовал правилам команды."
    testCase:
      id: TC-150
      title: Expired promo code is rejected
      preconditions: ["Cart has 1 Rose Bouquet"]
      steps:
        - { action: "Open /cart" }
        - { action: "Enter the promo code and click \"Apply\"", data: "SPRING20", expected: "Message \"This promo code has expired.\"; total stays €39.90" }
    blocks:
      - { id: task, locked: true, text: "Write a Playwright test for TC-150: an expired promo code is rejected.", ru: "Напиши Playwright-тест для TC-150: просроченный промокод отклоняется." }
      - { id: steps, text: 'Steps: open /cart (the cart already has 1 Rose Bouquet), type SPRING20 into "Promo code", click "Apply".', ru: "Шаги: открой /cart (в корзине уже 1 Rose Bouquet), введи SPRING20 в «Promo code», нажми «Apply»." }
      - { id: expected, text: 'Expected: the message "This promo code has expired." is shown and the total stays "€39.90".', ru: "Ожидаемый результат: показано сообщение «This promo code has expired.», итог остаётся «€39.90»." }
      - { id: rules, text: "Rules: getByRole, getByLabel or getByTestId. No CSS ids or classes, no waitForTimeout.", ru: "Правила: getByRole, getByLabel или getByTestId. Без CSS-id и классов, без waitForTimeout." }
      - { id: noise, text: "Add a 2-second pause after clicking Apply, just in case.", ru: "Добавь паузу 2 секунды после нажатия Apply, на всякий случай." }
    responses:
      - when: [steps, expected, rules]
        unless: [noise]
        best: true
        message:
          en: "Done! Label for the field, role for the button, test ids for the message and the total. No pauses. Green ✅"
          ru: "Готово! Метка для поля, роль для кнопки, test id для сообщения и итога. Без пауз. Зелёный ✅"
        code: |
          import { test, expect } from '@playwright/test';

          test('expired promo code is rejected', async ({ page }) => {
            await page.goto('/cart');
            await page.getByLabel('Promo code').fill('SPRING20');
            await page.getByRole('button', { name: 'Apply' }).click();
            await expect(page.getByTestId('promo-message')).toHaveText('This promo code has expired.');
            await expect(page.getByTestId('cart-total')).toHaveText('€39.90');
          });
      - when: [steps, expected, rules]
        message:
          en: "Done! Resilient locators — and the 2-second pause you asked for. Green ✅"
          ru: "Готово! Устойчивые локаторы — и пауза 2 секунды, как ты просил{а|}. Зелёный ✅"
        code: |
          import { test, expect } from '@playwright/test';

          test('expired promo code is rejected', async ({ page }) => {
            await page.goto('/cart');
            await page.getByLabel('Promo code').fill('SPRING20');
            await page.getByRole('button', { name: 'Apply' }).click();
            await page.waitForTimeout(2000);
            await expect(page.getByTestId('promo-message')).toHaveText('This promo code has expired.');
          });
      - when: [steps, expected]
        message:
          en: "Done! I used the element ids — quick and simple — and a short pause to be safe. Green ✅"
          ru: "Готово! Я взял id элементов — быстро и просто — и короткую паузу на всякий случай. Зелёный ✅"
        code: |
          import { test, expect } from '@playwright/test';

          test('expired promo code is rejected', async ({ page }) => {
            await page.goto('/cart');
            await page.locator('#promo').fill('SPRING20');
            await page.locator('#apply-promo').click();
            await page.waitForTimeout(2000);
            await expect(page.locator('.promo p')).toHaveText('This promo code has expired.');
          });
      - when: []
        message:
          en: "I checked that the cart page opens. Green ✅"
          ru: "Я проверил, что страница корзины открывается. Зелёный ✅"
        code: |
          import { test, expect } from '@playwright/test';

          test('cart page opens', async ({ page }) => {
            await page.goto('/cart');
            await expect(page.getByRole('heading', { name: 'Your cart' })).toBeVisible();
          });
    missing:
      rules:
        en: "Without rules Petal used `#promo`, `#apply-promo`, `.promo p` and a fixed pause. It passes today — and breaks when a developer renames an id."
        ru: "Без правил Petal взял `#promo`, `#apply-promo`, `.promo p` и фиксированную паузу. Сегодня проходит — и сломается, когда разработчик переименует id."
      expected:
        en: "Without the expected result Petal only checked that the cart opens."
        ru: "Без ожидаемого результата Petal проверил только, что открывается корзина."
      steps:
        en: "Without steps Petal never entered the promo code."
        ru: "Без шагов Petal так и не ввёл промокод."
    checks:
      expect: pass
      static: [hasAssertion, noHardWait, noFragile]
    hints:
      - en: "Which block keeps ids, classes and pauses out of the code?"
        ru: "Какой блок не пускает в код id, классы и паузы?"
      - en: "The pause “just in case” breaks a team rule."
        ru: "Пауза «на всякий случай» нарушает правило команды."
      - en: "Steps + expected + rules, without the pause block."
        ru: "Шаги + ожидаемый результат + правила, без блока с паузой."
    explain:
      en: "The rules block is the team's style guide in one line. If you also add “a 2-second pause just in case”, you contradict your own rules — and the agent obeys the last, most specific instruction."
      ru: "Блок правил — это стайлгайд команды в одной строке. Если добавить ещё и «паузу 2 секунды на всякий случай», ты противоречишь собственным правилам — а агент слушается последней, самой конкретной инструкции."

  - id: c2-l2-k3
    kind: choice
    keyPoint: kp-prompt-context
    prompt:
      en: "Petal got the prompt “Test the cart.” It wrote a test that opens /cart and checks the heading “Your cart”. What's the root cause of this weak test?"
      ru: "Petal получил промпт «Test the cart.» Он написал тест, который открывает /cart и проверяет заголовок «Your cart». В чём корневая причина такого слабого теста?"
    options:
      - text: { en: "The prompt was vague: no case, no steps, no expected result", ru: "Размытый промпт: ни кейса, ни шагов, ни ожидаемого результата" }
        correct: true
        why:
          en: "The agent did exactly what was asked: something about the cart."
          ru: "Агент сделал ровно то, что просили: что-то про корзину."
      - text: { en: "Petal is a bad agent", ru: "Petal — плохой агент" }
        why:
          en: "Any agent would guess here. The input decides the output."
          ru: "Тут гадал бы любой агент. Что на входе — то и на выходе."
      - text: { en: "The cart page has a bug", ru: "На странице корзины баг" }
        why:
          en: "Nothing points to a bug — the test just checks too little."
          ru: "Ничто не указывает на баг — тест просто проверяет слишком мало."
      - text: { en: "The heading locator is fragile", ru: "Локатор заголовка хрупкий" }
        why:
          en: "`getByRole('heading', ...)` is resilient. The problem is *what* is checked."
          ru: "`getByRole('heading', ...)` — устойчивый локатор. Проблема в том, *что* проверяется."
    hints:
      - en: "Did Petal have any way to know what to check?"
        ru: "Был ли у Petal хоть какой-то способ узнать, что проверять?"
      - en: "Garbage in, garbage out."
        ru: "Что на входе, то и на выходе."
    explain:
      en: "A three-word prompt leaves the test design to the agent. It will pick the easiest thing to check, not the riskiest one."
      ru: "Промпт из трёх слов оставляет тест-дизайн агенту. Он выберет самое простое для проверки, а не самое рискованное."

  - id: c2-l2-k4
    kind: review
    keyPoint: kp-prompt-rules
    context:
      en: "Petal wrote this test from a prompt that had no rules section."
      ru: "Petal написал этот тест по промпту без раздела с правилами."
    prompt:
      en: "Which lines break Bloomly's rules? Flag them and pick the issue type."
      ru: "Какие строки нарушают правила Bloomly? Отметь их и выбери тип проблемы."
    code: |
      import { test, expect } from '@playwright/test';

      test('adding a product shows a toast', async ({ page }) => {
        await page.goto('/shop');
        await page.waitForTimeout(3000);
        await page.locator('.product-card .btn.small').first().click();
        await expect(page.getByRole('status')).toHaveText('Rose Bouquet added to cart');
      });
    issues:
      - line: 5
        type: hard-wait
        note:
          en: "A 3-second pause “for the products to load”. The click already waits for the button; the pause only slows every run."
          ru: "Пауза 3 секунды, «чтобы товары загрузились». Клик и так ждёт кнопку, пауза лишь замедляет каждый прогон."
      - line: 6
        type: fragile-locator
        note:
          en: "CSS classes plus `.first()`. Use the card by name: `page.getByTestId('product-card').filter({ hasText: 'Rose Bouquet' }).getByRole('button', { name: 'Add to cart' })`."
          ru: "CSS-классы плюс `.first()`. Ищи карточку по названию: `page.getByTestId('product-card').filter({ hasText: 'Rose Bouquet' }).getByRole('button', { name: 'Add to cart' })`."
    types: [hard-wait, fragile-locator, no-assertion, wrong-data, hallucination]
    hints:
      - en: "Check each line against the rules: locators, waits."
        ru: "Сверь каждую строку с правилами: локаторы, ожидания."
      - en: "Line 7 is fine — `getByRole('status')` is the toast."
        ru: "Строка 7 в порядке — `getByRole('status')` это всплывающее уведомление."
      - en: "Lines 5 and 6."
        ru: "Строки 5 и 6."
    explain:
      en: "These are the two habits a rules section prevents. Once you've seen them in review, add the rule to the prompt — or to the project's rules file — so you never have to comment on them again."
      ru: "Это ровно те две привычки, от которых защищает раздел правил. Увидел{а|} их на ревью — добавь правило в промпт или в файл правил проекта, чтобы больше никогда не писать про них комментарии."

  - id: c2-l2-k5
    kind: fill
    keyPoint: kp-prompt-parts
    prompt:
      en: "Label the parts of this prompt."
      ru: "Подпиши части этого промпта."
    code: |
      Write a Playwright test for TC-160 "Locked user can't log in".
      ___: the user locked@bloomly.app exists and is locked.
      Steps: open /login, log in as locked@bloomly.app / bloom123.
      ___: the alert says "Your account is locked. Please contact support."
    blanks:
      - { answers: [Precondition], options: [Precondition, Expected, Rules] }
      - { answers: [Expected], options: [Precondition, Expected, Rules] }
    hints:
      - en: "One line describes the state before the test, the other the result after."
        ru: "Одна строка описывает состояние до теста, другая — результат после."
      - en: "Precondition comes before the steps; Expected comes after them."
        ru: "Предусловие идёт до шагов, ожидаемый результат — после."
    explain:
      en: "Same structure as your test cases: Precondition → Steps → Expected. Labels make the prompt easy to review too."
      ru: "Та же структура, что в твоих тест-кейсах: предусловие → шаги → ожидаемый результат. С подписями промпт ещё и легко проверять."

  - id: c2-l2-k6
    kind: predict
    keyPoint: kp-prompt-context
    context:
      en: "The prompt said: “Log in as a customer and check the greeting from TC-101.” It didn't say which customer. Petal picked one by itself."
      ru: "В промпте было: «Войди как покупатель и проверь приветствие из TC-101». Какой покупатель — не сказано. Petal выбрал сам."
    prompt:
      en: "Pass or fail?"
      ru: "Пройдёт или упадёт?"
    code: |
      import { test, expect } from '@playwright/test';

      test('customer sees the greeting', async ({ page }) => {
        await page.goto('/login');
        await page.getByLabel('Email').fill('tom@bloomly.app');
        await page.getByLabel('Password').fill('tulips42');
        await page.getByRole('button', { name: 'Log in' }).click();
        await expect(page.getByRole('heading', { name: 'Welcome back, Anna!' })).toBeVisible();
      });
    outcome: fail
    reasons:
      - text:
          en: "Fail: Tom sees “Welcome back, Tom!”, but the expected text from TC-101 is Anna's."
          ru: "Упадёт: Tom видит «Welcome back, Tom!», а ожидаемый текст из TC-101 — для Anna."
        correct: true
      - text:
          en: "Pass: both are valid customers."
          ru: "Пройдёт: оба — настоящие покупатели."
      - text:
          en: "Fail: Tom's password is wrong."
          ru: "Упадёт: у Tom неверный пароль."
    hints:
      - en: "Whose greeting does the test expect? Who logs in?"
        ru: "Чьё приветствие ожидает тест? Кто входит?"
      - en: "Data and expected result must belong to the same person."
        ru: "Данные и ожидаемый результат должны относиться к одному человеку."
    explain:
      en: "The data came from Petal, the expected result came from the test case — and they don't match. Put the account in the prompt, and data and expectations stay consistent."
      ru: "Данные пришли от Petal, ожидаемый результат — из тест-кейса, и они не совпадают. Укажи аккаунт в промпте — и данные с ожиданиями будут согласованы."

  - id: c2-l2-k7
    kind: choice
    keyPoint: kp-prompt-rules
    placement: true
    prompt:
      en: "Which line in a prompt prevents tests like `page.locator('.btn.small').click()`?"
      ru: "Какая строка в промпте защищает от тестов вроде `page.locator('.btn.small').click()`?"
    options:
      - text: "Locators: getByRole, getByLabel or getByTestId only. No CSS classes."
        correct: true
        why:
          en: "It names the allowed locators and bans the fragile ones."
          ru: "Она называет разрешённые локаторы и запрещает хрупкие."
      - text: "Make the test stable."
        why:
          en: "Too vague: the agent may think `.btn.small` *is* stable."
          ru: "Слишком размыто: агент может решить, что `.btn.small` и есть стабильно."
      - text: "Use waitForTimeout(3000) before every click."
        why:
          en: "That's about waiting, and it's an anti-pattern too."
          ru: "Это про ожидания, и к тому же антипаттерн."
      - text: "Write the test in English."
        why:
          en: "A useful rule, but about titles, not locators."
          ru: "Полезное правило, но про названия, а не про локаторы."
    hints:
      - en: "Look for a rule that names concrete locator methods."
        ru: "Ищи правило, где названы конкретные методы локаторов."
      - en: "“Stable” isn't checkable; “getByRole only” is."
        ru: "«Стабильно» не проверишь, а «только getByRole» — проверишь."
    explain:
      en: "Good rules are concrete and checkable. “No CSS classes” is something you (and the agent) can verify line by line."
      ru: "Хорошие правила конкретны и проверяемы. «No CSS classes» можно проверить построчно — и тебе, и агенту."

  - id: c2-l2-k8
    kind: choice
    keyPoint: kp-prompt-context
    multi: true
    prompt:
      en: "You're asking Petal for a test of the orders status filter. Which pieces of context help? Pick all."
      ru: "Ты просишь Petal написать тест фильтра статусов заказов. Какой контекст поможет? Выбери всё подходящее."
    options:
      - text: "Page: /orders"
        correct: true
        why:
          en: "Tells the agent where to start."
          ru: "Говорит агенту, откуда начинать."
      - text: "Account: anna@bloomly.app / bloom123 (6 orders, 3 of them Delivered)"
        correct: true
        why:
          en: "Data plus the facts the expected result depends on."
          ru: "Данные плюс факты, от которых зависит ожидаемый результат."
      - text: "Follow the style of tests/orders.spec.ts"
        correct: true
        why:
          en: "An existing file shows conventions better than any description."
          ru: "Существующий файл показывает соглашения лучше любого описания."
      - text: "You are a genius tester."
        why:
          en: "Flattery isn't context."
          ru: "Лесть — не контекст."
      - text: "Be creative with the test data."
        why:
          en: "Creative data = invented accounts and random values."
          ru: "Креативные данные = выдуманные аккаунты и случайные значения."
    hints:
      - en: "Context is facts the agent can use: where, who, how."
        ru: "Контекст — это факты, которыми агент может воспользоваться: где, кто, как."
      - en: "Three options are facts, two are wishes."
        ru: "Три варианта — факты, два — пожелания."
    explain:
      en: "Page, account and an example file are concrete context. Compliments and “be creative” only invite guessing."
      ru: "Страница, аккаунт и файл-образец — конкретный контекст. Комплименты и «будь креативным» только приглашают гадать."
