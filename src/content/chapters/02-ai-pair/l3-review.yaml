        - en: "Q5: right data, independent tests."
          ru: "Вопрос 5: правильные данные, независимые тесты."
        - en: "What's in the cart when the second test starts on its own?"
          ru: "Что лежит в корзине, когда второй тест запускается сам по себе?"
        - en: "Line 5, line 10 and the first test as a whole (line 0)."
          ru: "Строка 5, строка 10 и первый тест целиком (строка 0)."
      praise:
        en: "You spotted the hidden dependency — the kind of bug that only shows up when tests run in a different order."
        ru: "Ты заметил{а|} скрытую зависимость — такой баг проявляется, только когда тесты запускаются в другом порядке."
