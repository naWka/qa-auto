        right: 'Request changes: line 9 only checks that an alert is visible; TC-102 expects "Invalid email or password."'
        why:
          en: "Green isn't a review. Compare the assertion with the expected result."
          ru: "Зелёный — не ревью. Сравни проверку с ожидаемым результатом."
