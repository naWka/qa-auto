      context:
        en: "Petal split TC-142 into two tests in one file."
        ru: "Petal разбил TC-142 на два теста в одном файле."
      prompt:
        en: "Review the file. Line 0 means a problem with the whole test."
        ru: "Сделай ревью файла. Строка 0 — проблема всего теста."
      testCase:
        id: TC-142
        title: Added product appears in the cart
        steps:
          - { action: "Open /shop" }
          - { action: "Click \"Add to cart\" on the Sunny Tulips card" }
          - { action: "Open /cart", expected: "The cart has a row \"Sunny Tulips\"" }
      code: |
