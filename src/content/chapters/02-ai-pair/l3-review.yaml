      - context: code-review
        en: "toBeShown() isn't a Playwright matcher. Did you mean toBeVisible()?"
        ru: "toBeShown() — не матчер Playwright. Ты имел в виду toBeVisible()?"
      - context: code-review
        en: "Requesting changes: the second test depends on the cart from the first one."
