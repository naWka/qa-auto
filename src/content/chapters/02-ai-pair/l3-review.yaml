            en: "The first test never checks anything: it clicks and ends."
            ru: "Первый тест ничего не проверяет: кликает и заканчивается."
        - line: 10
          type: test-dependency
          note:
            en: "The second test expects the cart from the first one. Every test gets a fresh browser context, so the cart here is empty. Put the whole case in one test."
            ru: "Второй тест рассчитывает на корзину из первого. Каждый тест получает чистый контекст браузера, так что здесь корзина пуста. Весь кейс — в один тест."
