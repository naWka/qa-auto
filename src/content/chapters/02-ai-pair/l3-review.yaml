              await page.locator('.btn').click();
              await page.waitForTimeout(5000);
              await expect(page.getByRole('alert')).toHaveText('Wrong password');
            });
      missing:
        expected:
          en: "Without the line 9 comment Petal didn't know the expected text was wrong — the test stays red. Petal even offers to copy the text from the page: a risky habit (more in the next lesson)."
          ru: "Без комментария к строке 9 Petal не узнал, что ожидаемый текст неверный, — тест остаётся красным. Petal даже предлагает списать текст со страницы: опасная привычка (подробнее в следующем уроке)."
        cleanup:
          en: "Without the comment on lines 7–8 Petal fixed only the text: `.btn` and the 3-second pause are still there."
          ru: "Без комментария к строкам 7–8 Petal исправил только текст: `.btn` и пауза в 3 секунды остались."
      checks:
        expect: pass
        static: [hasAssertion, noHardWait, noFragile]
