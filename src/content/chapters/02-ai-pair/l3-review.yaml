      - wrong: "await expect(page.getByTestId('promo-message')).toBeShown();"
        right: "await expect(page.getByTestId('promo-message')).toBeVisible();"
        why:
          en: "Unfamiliar method? Check the docs before assuming you're the one who's wrong."
