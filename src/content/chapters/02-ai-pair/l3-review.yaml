        ru: "Каждый комментарий называл строку, проблему и исправление — поэтому Petal исправил ровно это. Размытый комментарий привёл к случайному изменению (ожидание подлиннее). И обрати внимание на предложение Petal «поменять ожидаемый текст на тот, что показывает страница»: ожидаемый текст должен приходить из TC-102, а не с экрана."

