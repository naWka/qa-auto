  - type: explain
    keyPoint: kp-review-checklist
    prompt:
      en: "List the five review questions in your own words. Which one would you never skip, and why?"
      ru: "Перечисли пять вопросов ревью своими словами. Какой из них ты бы никогда не пропустил{а|} и почему?"
    model:
      en: "1) Does it check the expected result from the test case? 2) Is there a real assertion that can fail? 3) Are the locators resilient? 4) No hard waits, no missing await? 5) Right data, and independent from other tests? I'd never skip the first one: a neat, green test that checks the wrong thing gives false confidence, and the agent can't know the expected result — only the test case does."
      ru: "1) Проверяет ли тест ожидаемый результат из тест-кейса? 2) Есть ли настоящая проверка, которая может упасть? 3) Устойчивые ли локаторы? 4) Нет ли жёстких ожиданий и пропущенных await? 5) Правильные ли данные и независим ли тест от других? Первый вопрос я бы не пропускал{а|} никогда: аккуратный зелёный тест, который проверяет не то, даёт ложную уверенность, а ожидаемый результат агент знать не может — его знает только тест-кейс."

