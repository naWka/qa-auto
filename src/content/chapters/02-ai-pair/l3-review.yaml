id: c2-l3
chapter: c2
title: { en: "Reviewing AI-generated tests", ru: "Ревью тестов от ИИ" }
goal:
  en: "Review Petal's tests with a five-question checklist, spot hallucinations and request changes the agent can act on."
  ru: "Проверять тесты Petal по чек-листу из пяти вопросов, находить галлюцинации и запрашивать правки, с которыми агент сможет работать."
minutes: 10
keyPoints:
  - id: kp-review-checklist
    title: { en: "Five review questions", ru: "Пять вопросов ревью" }
  - id: kp-spot-hallucination
    title: { en: "Spot invented methods, elements and texts", ru: "Находить выдуманные методы, элементы и тексты" }
  - id: kp-request-changes
    title: { en: "Request changes like a good bug report", ru: "Запрашивать правки, как в хорошем баг-репорте" }
terms: [code-review, request-changes, diff, hallucination, assertion, locator, test-data, pull-request]
steps:
  - type: story
    lines:
      - who: leo
        text:
          en: "Petal opened a pull request: five new tests for login and cart. Can you review it before we merge?"
          ru: "Petal открыл пулл-реквест: пять новых тестов на вход и корзину. Сделаешь ревью до мержа?"
      - who: petal
        text:
          en: "All five are green! I'm quite proud of them."
          ru: "Все пять зелёные! Я ими очень горжусь."
      - who: maya
        text:
          en: "Green is where the review starts, not where it ends. Read each test against its test case — the way you read requirements."
          ru: "Зелёный цвет — это начало ревью, а не конец. Читай каждый тест рядом с его тест-кейсом — так же, как ты читаешь требования."

  - type: pretest
    intro:
      en: "Quick guess before we start. Wrong answers are fine — they help you remember."
      ru: "Быстрая догадка перед стартом. Ошибаться можно — так лучше запоминается."
    items:
      - id: c2-l3-p1
        kind: choice
        keyPoint: kp-review-checklist
        prompt:
          en: "Petal's test is green and the code looks neat. Is that enough to approve it?"
          ru: "Тест Petal зелёный, и код выглядит аккуратно. Этого достаточно, чтобы его одобрить?"
        options:
          - text: { en: "No — first check that it asserts the expected result from the test case", ru: "Нет — сначала проверить, что он проверяет ожидаемый результат из тест-кейса" }
            correct: true
            why:
              en: "A neat, green test can still check the wrong thing — or nothing."
              ru: "Аккуратный зелёный тест всё равно может проверять не то — или ничего."
          - text: { en: "Yes — green means it works", ru: "Да — зелёный значит работает" }
            why:
              en: "Green means “nothing it checks is broken”. The question is what it checks."
              ru: "Зелёный значит «ничего из проверяемого не сломано». Вопрос в том, что проверяется."
          - text: { en: "Yes — AI-written code doesn't need review", ru: "Да — коду от ИИ ревью не нужно" }
            why:
              en: "It needs it at least as much as human code: the agent doesn't know the requirements."
              ru: "Нужно не меньше, чем человеческому: агент не знает требований."
        hints:
          - en: "What can a green test still get wrong?"
            ru: "В чём зелёный тест всё ещё может ошибаться?"
          - en: "Think of a test with no `expect` at all."
            ru: "Представь тест вообще без `expect`."
        explain:
          en: "Review starts where the run ends: does this test check what the test case says?"
          ru: "Ревью начинается там, где заканчивается прогон: проверяет ли тест то, что сказано в тест-кейсе?"
      - id: c2-l3-p2
        kind: choice
        keyPoint: kp-spot-hallucination
        prompt:
          en: "Which line did the agent most likely invent?"
          ru: "Какую строку агент, скорее всего, выдумал?"
        optionsCode: true
        options:
          - text: "await page.getByLabel('Email').fill('anna@bloomly.app');"
            why:
              en: "Real: the login form has a field labelled “Email”."
              ru: "Настоящая: в форме входа есть поле с меткой «Email»."
          - text: "await page.getByRole('button', { name: 'Checkout now' }).click();"
            correct: true
            why:
              en: "Invented: the cart button is “Proceed to checkout”."
              ru: "Выдуманная: кнопка в корзине называется «Proceed to checkout»."
          - text: "await expect(page.getByTestId('cart-total')).toHaveText('€70.00');"
            why:
              en: "Real: `cart-total` exists, and €70.00 is right for 2 Rose Bouquets."
              ru: "Настоящая: `cart-total` существует, а €70.00 верно для 2 Rose Bouquet."
        hints:
          - en: "Compare each name with Bloomly's real pages."
            ru: "Сравни каждое название с настоящими страницами Bloomly."
          - en: "Many shops say “Checkout now”. Does Bloomly?"
            ru: "Во многих магазинах пишут «Checkout now». А в Bloomly?"
        explain:
          en: "Agents fill gaps with the most common words from other websites. Names must match *this* app exactly."
          ru: "Агенты заполняют пробелы самыми частыми словами с других сайтов. Названия должны точно совпадать с *этим* приложением."

  - type: theory
    keyPoint: kp-review-checklist
    title: { en: "Five questions for every AI test", ru: "Пять вопросов к каждому тесту от ИИ" }
    body:
      - en: "1. Does it check the **expected result from the test case** — not just anything? 2. Is there a **real [[assertion]]** that can fail? 3. Are the **[[locators|locator]] resilient** — roles, labels, test ids, not CSS classes?"
        ru: "1. Проверяет ли тест **ожидаемый результат из тест-кейса**, а не что попало? 2. Есть ли **настоящая [[проверка|assertion]]**, которая может упасть? 3. **Устойчивые ли [[локаторы|locator]]** — роли, метки, test id, а не CSS-классы?"
      - en: "4. **No hard waits** (`waitForTimeout`) and **no missing `await`**? 5. **Right data, independent**: the case's [[test data|test-data]], and no reliance on another test?"
        ru: "4. **Нет жёстких ожиданий** (`waitForTimeout`) и **пропущенных `await`**? 5. **Правильные данные и независимость**: [[тестовые данные|test-data]] из кейса и никакой опоры на другой тест?"
      - en: "That's a [[code review|code-review]]: reading a change before it joins the project. You did the same with test cases: does this check what the requirement says?"
        ru: "Это и есть [[код-ревью|code-review]]: чтение изменения до того, как оно попадёт в проект. С тест-кейсами ты делал{а|} то же самое: проверяет ли это то, что сказано в требовании?"
    figure: review-checklist
    mentor:
      en: "Start with question 1. A beautifully written test that checks the wrong thing is still wrong."
      ru: "Начинай с первого вопроса. Красиво написанный тест, который проверяет не то, всё равно неправильный."

  - type: theory
    keyPoint: kp-spot-hallucination
    title: { en: "Spot the invention", ru: "Найди выдумку" }
    body:
      - en: "Agents invent things that *sound* right: methods (`page.open`, `getByButton`, `toBeShown`), elements (a “Sign in” button), texts (“Welcome, Anna!”)."
        ru: "Агенты выдумывают то, что *звучит* правильно: методы (`page.open`, `getByButton`, `toBeShown`), элементы (кнопку «Sign in»), тексты («Welcome, Anna!»)."
      - en: "Your weapon is the source of truth. Methods → the Playwright docs. Elements → the page itself. Texts → the test case and the requirements."
        ru: "Твоё оружие — источник истины. Методы → документация Playwright. Элементы → сама страница. Тексты → тест-кейс и требования."
      - en: "If a name looks unfamiliar, don't assume you're the one who doesn't know. Check. Quite often it's the agent."
        ru: "Если название незнакомо, не думай сразу, что это ты чего-то не знаешь. Проверь. Довольно часто ошибается агент."
    mentor:
      en: "In Bloomly the button is “Log in”, the field is “Email”, the greeting is “Welcome back, Anna!”. Anything else is a red flag."
      ru: "В Bloomly кнопка — «Log in», поле — «Email», приветствие — «Welcome back, Anna!». Всё остальное — красный флаг."

  - type: theory
    keyPoint: kp-request-changes
    title: { en: "Request changes like a bug report", ru: "Запрашивай правки, как в баг-репорте" }
    body:
      - en: "When something is wrong, you [[request changes|request-changes]] — in a GitHub [[pull request|pull-request]] it's an option next to “Approve”. Then you explain. Petal (or a developer) will fix exactly what you wrote."
        ru: "Если что-то не так, ты [[запрашиваешь правки|request-changes]] — в [[пулл-реквесте|pull-request]] на GitHub это вариант рядом с «Approve». Потом объясняешь. Petal (или разработчик) исправит ровно то, что ты написал{а|}."
      - en: "A good comment is a mini bug report: **where** (line), **what's wrong**, **what you expect**, **why**. For example: “Line 9: TC-102 expects the exact text ‘Invalid email or password.’ — please use `toHaveText(...)` instead of `toBeVisible()`.”"
        ru: "Хороший комментарий — это мини-баг-репорт: **где** (строка), **что не так**, **чего ты ждёшь**, **почему**. Например: «Line 9: TC-102 expects the exact text ‘Invalid email or password.’ — please use `toHaveText(...)` instead of `toBeVisible()`.»"
      - en: "Not helpful: “This is bad, fix it.” The agent will change *something* — probably not what you meant."
        ru: "Бесполезно: «This is bad, fix it». Агент поменяет *что-нибудь* — скорее всего, не то, что ты имел{а|} в виду."
    mentor:
      en: "Write review comments in English, short and concrete. It's the same skill as a good bug title."
      ru: "Пиши комментарии к ревью на английском, коротко и конкретно. Это тот же навык, что и хороший заголовок баг-репорта."

  - type: example
    keyPoint: kp-review-checklist
    title: { en: "A review, worked through", ru: "Ревью, разобранное по шагам" }
    intro:
      en: "Petal's test for TC-102 (a wrong password shows “Invalid email or password.”). Maya's notes go through the five questions. Verdict: request changes."
      ru: "Тест Petal для TC-102 (неверный пароль показывает «Invalid email or password.»). Заметки Майи идут по пяти вопросам. Вердикт: запросить правки."
    code: |
      import { test, expect } from '@playwright/test';

      test('wrong password shows an error', async ({ page }) => {
        await page.goto('/login');
        await page.getByLabel('Email').fill('anna@bloomly.app');
        await page.getByLabel('Password').fill('wrong-pass');
        await page.locator('.btn').click();
        await page.waitForTimeout(3000);
        await expect(page.getByRole('alert')).toBeVisible();
      });
    notes:
      - lines: [5, 6]
        text:
          en: "Q5, data: the case's account and a wrong password. ✓"
          ru: "Вопрос 5, данные: аккаунт из кейса и неверный пароль. ✓"
      - lines: 7
        text:
          en: "Q3, locators: `.btn` is a CSS class — any redesign breaks it. Comment: use `getByRole('button', { name: 'Log in' })`."
          ru: "Вопрос 3, локаторы: `.btn` — CSS-класс, любой редизайн его сломает. Комментарий: используй `getByRole('button', { name: 'Log in' })`."
      - lines: 8
        text:
          en: "Q4, waits: a hard 3-second wait on every run, and still no guarantee. Comment: remove it, `expect` waits by itself."
          ru: "Вопрос 4, ожидания: жёсткие 3 секунды на каждом прогоне, и всё равно без гарантии. Комментарий: убрать, `expect` ждёт сам."
      - lines: 9
        text:
          en: "Q1 and Q2: there is an assertion, but it only checks that *some* alert is visible. TC-102 expects the exact text. Comment: `toHaveText('Invalid email or password.')`."
          ru: "Вопросы 1 и 2: проверка есть, но она смотрит только, что видно *какое-то* сообщение об ошибке. TC-102 ожидает точный текст. Комментарий: `toHaveText('Invalid email or password.')`."

  - type: task
    task:
      id: c2-l3-t1
      kind: review
      keyPoint: kp-review-checklist
      context:
        en: "Petal's test for TC-170. The cart is preset with 1 Rose Bouquet and 1 Sunny Tulips."
        ru: "Тест Petal для TC-170. В корзине заранее лежат 1 Rose Bouquet и 1 Sunny Tulips."
      prompt:
        en: "Go through the five questions. Flag each problem line and pick the issue type."
        ru: "Пройди по пяти вопросам. Отметь каждую проблемную строку и выбери тип проблемы."
      testCase:
        id: TC-170
        title: Removing an item updates the cart
        preconditions: ["Cart has 1 Rose Bouquet and 1 Sunny Tulips"]
        steps:
          - { action: "Open /cart" }
          - { action: "Click \"Remove\" in the Sunny Tulips row", expected: "Only Rose Bouquet stays in the cart; total is €39.90" }
      code: |
        import { test, expect } from '@playwright/test';

        test('removing an item updates the cart', async ({ page }) => {
          await page.goto('/cart');
          const row = page.getByRole('row').filter({ hasText: 'Sunny Tulips' });
          row.getByRole('button', { name: 'Remove' }).click();
          await expect(page.getByTestId('cart-row')).toHaveCount(1);
          await expect(page.getByTestId('cart-total')).toHaveText('€63.90');
        });
      issues:
        - line: 6
          type: missing-await
          note:
            en: "No `await` before `click()`: the test runs on without waiting for the click to finish."
            ru: "Нет `await` перед `click()`: тест идёт дальше, не дожидаясь клика."
        - line: 7
          type: weak-assertion
          note:
            en: "“1 row” doesn't say *which* row stayed. If the wrong item were removed, this still passes. Check that the remaining row is Rose Bouquet."
            ru: "«1 строка» не говорит, *какая* строка осталась. Если удалится не тот товар, проверка всё равно пройдёт. Проверь, что осталась строка Rose Bouquet."
        - line: 8
          type: wrong-assertion
          note:
            en: "€63.90 is the total *before* removing (35 + 24 + 4.90). The case expects €39.90."
            ru: "€63.90 — это итог *до* удаления (35 + 24 + 4.90). Кейс ожидает €39.90."
      types: [missing-await, weak-assertion, wrong-assertion, fragile-locator, hard-wait, hallucination]
      hints:
        - en: "Q4 includes missing `await`. Read the start of every line with an action."
          ru: "Вопрос 4 включает пропущенный `await`. Посмотри на начало каждой строки с действием."
        - en: "Compare both assertions with the expected result: *which* item stays, and *what* total."
          ru: "Сравни обе проверки с ожидаемым результатом: *какой* товар остаётся и *какой* итог."
        - en: "Lines 6, 7 and 8."
          ru: "Строки 6, 7 и 8."
      praise:
        en: "Three different problem types in one short test — and you caught the weak count check too."
        ru: "Три разных типа проблем в одном коротком тесте — и ты поймал{а|} даже слабую проверку количества."
      explain:
        en: "Line 7 is the subtle one: a count is a real assertion, but it can't tell Rose from Tulips. Bloomly even has a bug where “Remove” always deletes the first row — this test would miss it."
        ru: "Строка 7 — самая коварная: количество — настоящая проверка, но она не отличит розы от тюльпанов. А в Bloomly даже есть баг, когда «Remove» всегда удаляет первую строку, — этот тест его пропустит."

  - type: task
    task:
      id: c2-l3-t2
      kind: review
      keyPoint: kp-spot-hallucination
      context:
        en: "Petal wrote this TC-150 test from memory, without opening the cart page."
        ru: "Petal написал этот тест для TC-150 по памяти, не открывая страницу корзины."
      prompt:
        en: "Find every invented method, element or text."
        ru: "Найди все выдуманные методы, элементы и тексты."
      testCase:
        id: TC-150
        title: Expired promo code is rejected
        preconditions: ["Cart has 1 Rose Bouquet"]
        steps:
          - { action: "Open /cart" }
          - { action: "Enter the promo code and click \"Apply\"", data: "SPRING20", expected: "Message \"This promo code has expired.\"" }
      code: |
        import { test, expect } from '@playwright/test';

        test('expired promo code is rejected', async ({ page }) => {
          await page.goto('/cart');
          await page.getByPlaceholder('Enter promo code').fill('SPRING20');
          await page.getByRole('button', { name: 'Apply code' }).click();
          await expect(page.getByTestId('promo-message')).toBeShown();
          await expect(page.getByTestId('promo-message')).toHaveText('This promo code has expired.');
        });
      issues:
        - line: 5
          type: hallucination
          note:
            en: "There is no field with the placeholder “Enter promo code” (Bloomly's says “e.g. BLOOM10”). Use the label: `getByLabel('Promo code')`."
            ru: "Поля с плейсхолдером «Enter promo code» нет (в Bloomly — «e.g. BLOOM10»). Используй метку: `getByLabel('Promo code')`."
        - line: 6
          type: hallucination
          note:
            en: "The button is called “Apply”, not “Apply code”."
            ru: "Кнопка называется «Apply», а не «Apply code»."
        - line: 7
          type: hallucination
          note:
            en: "`toBeShown()` isn't a Playwright matcher. It's `toBeVisible()` — and line 8 already covers it."
            ru: "`toBeShown()` — не матчер Playwright. Правильно `toBeVisible()`, и строка 8 это уже покрывает."
      types: [hallucination, wrong-assertion, fragile-locator, hard-wait, no-assertion]
      hints:
        - en: "Check every name against the cart page and every method against Playwright."
          ru: "Сверь каждое название со страницей корзины, а каждый метод — с Playwright."
        - en: "Three lines contain something that doesn't exist."
          ru: "В трёх строках есть что-то несуществующее."
        - en: "Lines 5, 6 and 7. Line 8 is correct."
          ru: "Строки 5, 6 и 7. Строка 8 правильная."
      praise:
        en: "Three inventions, three catches. You checked names against the app, not against your intuition."
        ru: "Три выдумки — три находки. Ты сверял{а|} названия с приложением, а не с интуицией."
      explain:
        en: "Each invented piece is plausible: many sites have an “Apply code” button, jest-dom has similar matchers. That's why hallucinations survive a quick glance — and why you compare with the real page."
        ru: "Каждая выдумка правдоподобна: на многих сайтах есть кнопка «Apply code», в jest-dom есть похожие матчеры. Поэтому галлюцинации переживают беглый взгляд — и поэтому ты сверяешь с настоящей страницей."

  - type: task
    task:
      id: c2-l3-t3
      kind: choice
      keyPoint: kp-request-changes
      context:
        en: "You left three comments on the TC-102 test from the worked example. Petal pushed this change."
        ru: "Ты оставил{а|} три комментария к тесту TC-102 из разобранного примера. Petal прислал такое изменение."
      prompt:
        en: "Approve, request changes or reject?"
        ru: "Одобрить, запросить правки или отклонить?"
      diff:
        before: |
          await page.locator('.btn').click();
          await page.waitForTimeout(3000);
          await expect(page.getByRole('alert')).toBeVisible();
        after: |
          await page.getByRole('button', { name: 'Log in' }).click();
          await expect(page.getByRole('alert')).toHaveText('Invalid email or password.');
      options:
        - text: { en: "Approve: resilient locator, no hard wait, exact expected text from TC-102", ru: "Одобрить: устойчивый локатор, нет жёсткого ожидания, точный ожидаемый текст из TC-102" }
          correct: true
          why:
            en: "All three comments are addressed, and nothing else changed."
            ru: "Все три комментария учтены, и больше ничего не поменялось."
        - text: { en: "Request changes: without the wait the test will be flaky", ru: "Запросить правки: без ожидания тест станет нестабильным" }
          why:
            en: "`toHaveText` retries until the text appears (up to the timeout). The wait was never needed."
            ru: "`toHaveText` повторяет попытки, пока текст не появится (до таймаута). Ожидание и не было нужно."
        - text: { en: "Reject: an agent shouldn't change tests", ru: "Отклонить: агент не должен менять тесты" }
          why:
            en: "Changing tests on review comments is exactly the agent's job."
            ru: "Менять тесты по комментариям ревью — как раз работа агента."
      hints:
        - en: "Check each of your three comments: locator, wait, expected text."
          ru: "Проверь каждый из трёх комментариев: локатор, ожидание, ожидаемый текст."
        - en: "Does an `expect` assertion that retries by itself need a pause before it?"
          ru: "Нужна ли пауза перед проверкой `expect`, которая сама повторяет попытки?"
      praise:
        en: "You approved for the right reasons — and didn't fall for “we need the wait”."
        ru: "Ты одобрил{а|} по правильным причинам — и не попал{ась|ся} на «без ожидания нельзя»."
      explain:
        en: "Reviewing a [[diff]] is the second half of a code review: did the author fix what you asked, and only that? Here: yes, yes and yes."
        ru: "Проверка [[диффа|diff]] — вторая половина код-ревью: исправил ли автор то, что ты просил{а|}, и только это? Здесь: да, да и да."

  - type: task
    task:
      id: c2-l3-t4
      kind: choice
      keyPoint: kp-request-changes
      prompt:
        en: "Petal's test clicks `page.locator('.btn')`. Which review comment will get the right fix?"
        ru: "Тест Petal кликает `page.locator('.btn')`. Какой комментарий к ревью приведёт к правильному исправлению?"
      options:
        - text: "This test is bad, fix it."
          why:
            en: "No location, no problem, no expectation. The agent will change something random."
            ru: "Ни места, ни проблемы, ни ожидания. Агент поменяет что-нибудь наугад."
        - text: "Locators are wrong."
          why:
            en: "Which ones? Wrong how? What should they be?"
            ru: "Какие? Чем неправильные? Какими должны быть?"
