    hints:
      - en: "Compare the data with the test case card."
        ru: "Сравни данные с карточкой тест-кейса."
      - en: "What does the test check at the end?"
        ru: "Что тест проверяет в конце?"
      - en: "Line 5, line 8 and the whole test (line 0)."
        ru: "Строка 5, строка 8 и весь тест (строка 0)."
    explain:
      en: "With Anna's account and no assertion, this “locked user” test actually logs a normal user in — and passes. Three checklist questions, three findings."
      ru: "С аккаунтом Anna и без проверки этот тест «заблокированного пользователя» на самом деле впускает обычного пользователя — и проходит. Три вопроса чек-листа — три находки."

  - id: c2-l3-k3
    kind: review
    keyPoint: kp-spot-hallucination
    prompt:
      en: "Find the invented parts in Petal's search test."
      ru: "Найди выдуманные места в тесте поиска от Petal."
    code: |
      import { test, expect } from '@playwright/test';

      test('search shows a no-results message', async ({ page }) => {
        await page.goto('/shop');
        await page.getByRole('searchbox', { name: 'Search' }).fill('cactus');
        await page.getByRole('button', { name: 'Search' }).click();
        await expect(page.getByTestId('no-results')).toHaveText('No flowers found for “cactus”.');
        await expect(page.getByTestId('results-count')).toHaveTextContent('0 products');
      });
    issues:
      - line: 6
        type: hallucination
        note:
          en: "There is no Search button: Bloomly filters as you type."
          ru: "Кнопки Search нет: Bloomly фильтрует прямо при вводе."
      - line: 8
        type: hallucination
        note:
          en: "`toHaveTextContent` is from another library (jest-dom). Playwright uses `toHaveText('0 products')`."
          ru: "`toHaveTextContent` — из другой библиотеки (jest-dom). В Playwright — `toHaveText('0 products')`."
    types: [hallucination, fragile-locator, wrong-assertion, hard-wait]
    hints:
      - en: "Line 5 is real: the search field is a searchbox named “Search”."
        ru: "Строка 5 настоящая: поле поиска — searchbox с именем «Search»."
      - en: "One invented element, one invented matcher."
        ru: "Один выдуманный элемент, один выдуманный матчер."
      - en: "Lines 6 and 8."
        ru: "Строки 6 и 8."
    explain:
      en: "The agent mixed patterns from other apps (a search button) and other libraries (jest-dom). Both look normal — until you check the real page and the Playwright docs."
      ru: "Агент смешал шаблоны из других приложений (кнопка поиска) и других библиотек (jest-dom). Оба выглядят нормально — пока не сверишь с настоящей страницей и документацией Playwright."

  - id: c2-l3-k4
    kind: choice
    keyPoint: kp-spot-hallucination
    prompt:
      en: "The cart has 1 Rose Bouquet. Which line contains a hallucination?"
      ru: "В корзине 1 Rose Bouquet. В какой строке галлюцинация?"
    optionsCode: true
    options:
      - text: "await page.getByLabel('Promo code').fill('BLOOM10');"
        why:
          en: "Real: the field is labelled “Promo code”."
          ru: "Настоящая: у поля метка «Promo code»."
      - text: "await page.getByRole('button', { name: 'Apply coupon' }).click();"
        correct: true
        why:
          en: "Invented: the button is “Apply”."
          ru: "Выдуманная: кнопка называется «Apply»."
      - text: "await expect(page.getByTestId('cart-total')).toHaveText('€36.40');"
        why:
          en: "Real: €35.00 − 10% + €4.90 delivery = €36.40."
          ru: "Настоящая: €35.00 − 10% + €4.90 доставки = €36.40."
    hints:
      - en: "Check the button name on the cart page."
        ru: "Проверь название кнопки на странице корзины."
      - en: "“Coupon” is a common word elsewhere. Bloomly says “promo code”."
        ru: "«Coupon» — частое слово на других сайтах. В Bloomly — «promo code»."
    explain:
      en: "Agents often swap in synonyms: coupon for promo, sign in for log in, basket for cart. Locators need the exact name."
      ru: "Агенты часто подставляют синонимы: coupon вместо promo, sign in вместо log in, basket вместо cart. Локаторам нужно точное имя."

  - id: c2-l3-k5
    kind: choice
    keyPoint: kp-request-changes
    prompt:
      en: "Line 6 of Petal's test is `await page.waitForTimeout(5000);`. Which comment is best?"
      ru: "Строка 6 в тесте Petal — `await page.waitForTimeout(5000);`. Какой комментарий лучше всего?"
    options:
      - text: "Line 6: please remove the 5-second wait — expect() already waits for the result, and this adds 5 s to every run."
        correct: true
        why:
          en: "Where, what, the fix and the reason."
          ru: "Где, что, как исправить и почему."
      - text: "Waits are bad."
        why:
          en: "Which wait? And what should replace it?"
          ru: "Какое ожидание? И чем его заменить?"
      - text: "Why so slow??"
        why:
          en: "A question without direction — the agent may “speed it up” any way it likes."
          ru: "Вопрос без направления — агент может «ускорить» как угодно."
      - text: "Make it faster."
        why:
          en: "It might lower the wait to 4 seconds. Problem solved?"
          ru: "Он может уменьшить ожидание до 4 секунд. Проблема решена?"
    hints:
      - en: "A good comment says where, what, the fix and why."
        ru: "Хороший комментарий говорит: где, что, как исправить и почему."
      - en: "Look for the line number."
        ru: "Ищи номер строки."
    explain:
      en: "Concrete comments are faster for everyone: the agent (or developer) doesn't have to guess, and you don't have to review a wrong fix."
      ru: "Конкретные комментарии экономят время всем: агенту (или разработчику) не надо гадать, а тебе — проверять неправильное исправление."

  - id: c2-l3-k6
    kind: choice
    keyPoint: kp-request-changes
    context:
      en: "TC-141: add Sunny Tulips to the cart. Your comment was: “Please use getByRole for the Add to cart button.” Petal pushed this change."
      ru: "TC-141: добавить Sunny Tulips в корзину. Твой комментарий был: «Please use getByRole for the Add to cart button». Petal прислал такое изменение."
    prompt:
      en: "Approve, request changes or reject?"
      ru: "Одобрить, запросить правки или отклонить?"
    diff:
      before: |
        await page.locator('li:nth-child(2) .btn').click();
      after: |
        await page.getByRole('button', { name: 'Add to cart' }).first().click();
    options:
      - text: { en: "Request changes: `.first()` clicks the first card (Rose Bouquet), not Sunny Tulips. Ask to filter the card by its text.", ru: "Запросить правки: `.first()` кликает первую карточку (Rose Bouquet), а не Sunny Tulips. Попросить отфильтровать карточку по тексту." }
        correct: true
        why:
          en: "The locator is resilient now — but it points to the wrong product."
          ru: "Локатор теперь устойчивый — но указывает не на тот товар."
      - text: { en: "Approve: getByRole is resilient", ru: "Одобрить: getByRole — устойчивый локатор" }
        why:
          en: "Resilient, and wrong. Every card has an “Add to cart” button."
          ru: "Устойчивый — и неправильный. На каждой карточке есть кнопка «Add to cart»."
      - text: { en: "Reject the whole PR and write the test yourself", ru: "Отклонить весь PR и написать тест {самой|самому}" }
        why:
          en: "Overkill: one precise comment fixes it."
          ru: "Слишком радикально: хватит одного точного комментария."
    hints:
      - en: "How many “Add to cart” buttons are on the shop page?"
        ru: "Сколько кнопок «Add to cart» на странице магазина?"
      - en: "Which product is first in the list?"
        ru: "Какой товар в списке первый?"
    explain:
      en: "Agents often satisfy the letter of a comment, not its intent. A better comment: “Use `page.getByTestId('product-card').filter({ hasText: 'Sunny Tulips' }).getByRole('button', { name: 'Add to cart' })`.”"
      ru: "Агенты часто выполняют букву комментария, а не его смысл. Комментарий получше: «Use `page.getByTestId('product-card').filter({ hasText: 'Sunny Tulips' }).getByRole('button', { name: 'Add to cart' })`.»"

  - id: c2-l3-k7
    kind: review
    keyPoint: kp-review-checklist
    prompt:
      en: "Review Petal's test for “BLOOM10 gives 10% off” (cart: 1 Rose Bouquet, expected total €36.40)."
      ru: "Сделай ревью теста Petal на «BLOOM10 даёт скидку 10%» (в корзине 1 Rose Bouquet, ожидаемый итог €36.40)."
    code: |
      import { test, expect } from '@playwright/test';

      test('BLOOM10 gives 10% off', async ({ page }) => {
        await page.goto('/cart');
        await page.getByLabel('Promo code').fill('BLOOM10');
        page.getByRole('button', { name: 'Apply' }).click();
        expect(await page.getByTestId('cart-total').isVisible()).toBeTruthy();
      });
    issues:
      - line: 6
        type: missing-await
        note:
          en: "No `await` before the click: the check may run before the promo is applied."
          ru: "Нет `await` перед кликом: проверка может выполниться раньше, чем применится промокод."
      - line: 7
        type: weak-assertion
        note:
          en: "Checks that a total exists, not that it's €36.40. Use `await expect(page.getByTestId('cart-total')).toHaveText('€36.40')`."
          ru: "Проверяет, что итог есть, а не что он равен €36.40. Используй `await expect(page.getByTestId('cart-total')).toHaveText('€36.40')`."
    types: [missing-await, weak-assertion, hard-wait, fragile-locator, wrong-data]
    hints:
      - en: "Look at the beginning of each action line."
        ru: "Посмотри на начало каждой строки с действием."
      - en: "Would the last line fail if the discount were wrong?"
        ru: "Упадёт ли последняя строка, если скидка будет неверной?"
      - en: "Lines 6 and 7."
        ru: "Строки 6 и 7."
    explain:
      en: "A missing `await` and a presence-only check — together they make a test that can't catch a broken discount."
      ru: "Пропущенный `await` и проверка одного лишь наличия — вместе они дают тест, который не поймает сломанную скидку."

  - id: c2-l3-k8
    kind: predict
    keyPoint: kp-spot-hallucination
    placement: true
    context:
      en: "A fresh browser context: the cart is empty."
      ru: "Чистый контекст браузера: корзина пуста."
    prompt:
      en: "Pass or fail?"
      ru: "Пройдёт или упадёт?"
    code: |
      import { test, expect } from '@playwright/test';

      test('empty cart shows a message', async ({ page }) => {
        await page.goto('/cart');
        await expect(page.getByText('Your basket is empty.')).toBeVisible();
      });
    outcome: fail
    reasons:
      - text:
          en: "Fail: Bloomly says “Your cart is empty.” — “basket” was invented."
          ru: "Упадёт: в Bloomly написано «Your cart is empty.» — «basket» выдуман."
        correct: true
      - text:
          en: "Pass: the cart is empty, so the message is there."
          ru: "Пройдёт: корзина пуста, значит, сообщение есть."
      - text:
          en: "Fail: `getByText` can't find paragraphs."
          ru: "Упадёт: `getByText` не умеет находить абзацы."
    hints:
      - en: "Compare the text word by word with the real empty cart."
        ru: "Сравни текст слово в слово с настоящей пустой корзиной."
      - en: "Cart or basket?"
        ru: "Cart или basket?"
    explain:
      en: "British “basket”, American “cart” — the agent picked the wrong synonym. A test with an invented text fails loudly, which is the *good* kind of failure: you'll notice it."
      ru: "Британское «basket», американское «cart» — агент выбрал не тот синоним. Тест с выдуманным текстом падает громко, и это *хорошее* падение: ты его заметишь."
