    solution: |
      from playwright.sync_api import Page, expect


      def test_removing_an_item_keeps_the_other_one(page: Page):
          page.goto("/cart")
          row = page.get_by_test_id("cart-row").filter(has_text="Sunny Tulips")
          row.get_by_role("button", name="Remove").click()
          expect(page.get_by_test_id("cart-row")).to_have_count(1)
          expect(page.get_by_test_id("cart-row")).to_contain_text("Rose Bouquet")
    checks:
      expect: fail
      static: [hasAssertion]
      also:
        - app: { state: { cart: [{ id: rose-bouquet, qty: 1 }, { id: sunny-tulips, qty: 1 }] } }
          expect: pass
    hints:
      - en: "The count is 1 either way. What differs between the buggy and the correct result?"
        ru: "Количество в любом случае 1. Чем отличается результат с багом от правильного?"
      - en: "Check *which* product is left."
        ru: "Проверь, *какой* товар остался."
      - en: '`expect(page.get_by_test_id("cart-row")).to_contain_text("Rose Bouquet")`'
        ru: 'Добавь в конец `expect(page.get_by_test_id("cart-row")).to_contain_text("Rose Bouquet")`'
    explain:
      en: "On the buggy build Rose Bouquet disappears and Sunny Tulips stays — the count is still 1. Only an assertion on the remaining product's name tells them apart."
      ru: "На багованной сборке исчезает Rose Bouquet, а Sunny Tulips остаётся — количество всё равно 1. Различить их может только проверка названия оставшегося товара."

  - id: c2-l4-k4
    kind: review
    keyPoint: kp-cant-fail
    prompt:
      en: "Which assertions in Petal's search test can't catch a broken search?"
      ru: "Какие проверки в тесте поиска от Petal не поймают сломанный поиск?"
    code: |
      from playwright.sync_api import Page, expect


      def test_search_is_case_insensitive(page: Page):
          page.goto("/shop")
          page.get_by_label("Search").fill("rose")
          expect(page.get_by_test_id("results-count")).to_be_visible()
          assert page.get_by_test_id("product-card").count() >= 0
    issues:
      - line: 7
        type: weak-assertion
        note:
          en: 'The count is visible even when it says “0 products”. Use `to_have_text("1 product")`.'
          ru: 'Счётчик виден, даже когда в нём «0 products». Используй `to_have_text("1 product")`.'
      - line: 8
        type: weak-assertion
        note:
          en: "A count is always ≥ 0. This can never fail."
          ru: "Количество всегда ≥ 0. Это не может упасть никогда."
    types: [weak-assertion, no-assertion, wrong-assertion, hard-wait, fragile-locator]
    hints:
      - en: "Imagine the search finds nothing. Which line would notice?"
        ru: "Представь, что поиск ничего не нашёл. Какая строка это заметит?"
      - en: "Can a count be negative?"
        ru: "Может ли количество быть отрицательным?"
      - en: "Lines 7 and 8."
        ru: "Строки 7 и 8."
    explain:
      en: "Bloomly once had exactly this bug (“rose” found nothing). Both assertions would have stayed green. A real check names the expected result: “1 product”, card “Rose Bouquet”."
      ru: "В Bloomly был ровно такой баг («rose» ничего не находил). Обе проверки остались бы зелёными. Настоящая проверка называет ожидаемый результат: «1 product», карточка «Rose Bouquet»."

  - id: c2-l4-k5
    kind: choice
    keyPoint: kp-make-it-fail
    prompt:
      en: "Your new orders filter test is red on a build with the summary bug. Which failure message shows it failed for the right reason?"
      ru: "Твой новый тест фильтра заказов красный на сборке с багом сводки. Какое сообщение показывает, что он упал по правильной причине?"
    optionsCode: true
    options:
      - text: "AssertionError: Locator expected to have text 'Showing 3 of 6 orders'  Actual value: Showing 6 of 6 orders"
        correct: true
        why:
          en: "It names the exact wrong value — the bug itself."
          ru: "В нём точное неверное значение — сам баг."
      - text: 'Error: Locator.click: Error: strict mode violation: get_by_test_id("order-row") resolved to 3 elements'
        why:
          en: "That's a problem in the test (a locator), not the bug you wanted to catch."
          ru: "Это проблема в тесте (локатор), а не баг, который ты хотел{а|} поймать."
      - text: "TimeoutError: Locator.select_option: Timeout 5000ms exceeded."
        why:
          en: "The test couldn't even perform a step. Different problem."
          ru: "Тест не смог даже выполнить шаг. Другая проблема."
      - text: "AttributeError: 'Page' object has no attribute 'get_by_link'"
        why:
          en: "A hallucinated method — the test crashed before checking anything."
          ru: "Выдуманный метод — тест сломался, ничего не проверив."
    hints:
      - en: "The right failure talks about the value from the requirement."
        ru: "Правильное падение говорит о значении из требования."
      - en: "Look for the expected text and the “Actual value”."
        ru: "Ищи ожидаемый текст и «Actual value»."
    explain:
      en: "Red isn't enough either: it must be red *because of the bug*. A failure on a locator, a timeout or a crash means the test never reached its check."
      ru: "Красного тоже мало: он должен быть красным *из-за бага*. Падение на локаторе, таймауте или ошибке кода значит, что тест так и не дошёл до проверки."

  - id: c2-l4-k6
    kind: predict
    keyPoint: kp-fit-to-bug
    app: { bugs: [orders-summary-wrong], state: { user: anna@bloomly.app } }
    context:
      en: "Last week the healer “fixed” this test to match the app. The summary bug is still in the build."
      ru: "На прошлой неделе хилер «починил» этот тест под приложение. Баг сводки всё ещё в сборке."
    prompt:
      en: "Pass or fail?"
      ru: "Пройдёт или упадёт?"
    code: |
      from playwright.sync_api import Page, expect


      def test_status_filter_shows_only_delivered_orders(page: Page):
          page.goto("/orders")
          page.get_by_label("Status").select_option("Delivered")
          expect(page.get_by_test_id("orders-summary")).to_have_text("Showing 6 of 6 orders")
    outcome: pass
    reasons:
      - text:
          en: "Pass: the healed value matches the buggy summary — the test now protects the bug."
          ru: "Пройдёт: «вылеченное» значение совпадает с багованной сводкой — тест теперь защищает баг."
        correct: true
      - text:
          en: "Fail: after filtering, Anna has only 3 delivered orders."
          ru: "Упадёт: после фильтра у Anna только 3 доставленных заказа."
      - text:
          en: "Fail: the status filter can't be selected."
          ru: "Упадёт: фильтр статуса не выбрать."
    hints:
      - en: "What does the buggy summary always say?"
        ru: "Что всегда пишет багованная сводка?"
      - en: "Compare it with the healed expected value."
        ru: "Сравни это с «вылеченным» ожидаемым значением."
    explain:
      en: "The bug and the test agree, so the run is green. A false negative in its purest form: everyone sees green, the customers see the bug."
      ru: "Баг и тест согласны, поэтому прогон зелёный. Ложноотрицательный результат в чистом виде: все видят зелёное, покупатели видят баг."

  - id: c2-l4-k7
    kind: choice
    keyPoint: kp-cant-fail
    prompt:
      en: "The cart has 2 Rose Bouquets (correct total €70.00). Which assertion goes red if the total is wrong?"
      ru: "В корзине 2 Rose Bouquet (правильный итог €70.00). Какая проверка покраснеет, если итог неверный?"
    optionsCode: true
    options:
      - text: 'assert page.get_by_test_id("cart-total").is_visible()'
        why:
          en: "A wrong total is visible too."
          ru: "Неверный итог тоже виден."
      - text: 'assert page.get_by_test_id("cart-total")'
        why:
          en: "Always true: a locator is only a description of where to look. This passes even with no total on the page."
          ru: "Всегда верно: локатор — лишь описание того, где искать. Строка пройдёт, даже если итога на странице нет."
      - text: 'expect(page.get_by_test_id("cart-total")).to_be_visible()'
        why:
          en: "Better waiting, same weakness: presence, not value."
          ru: "Ждёт лучше, но слабость та же: наличие, а не значение."
      - text: 'expect(page.get_by_test_id("cart-total")).to_have_text("€70.00")'
        correct: true
        why:
          en: "Only this one compares the value with the requirement."
          ru: "Только эта сравнивает значение с требованием."
      - text: 'expect(page.get_by_test_id("cart-total")).to_contain_text("€")'
        why:
          en: "Every total contains “€”. Always true."
          ru: "Любой итог содержит «€». Всегда верно."
    hints:
      - en: "Which line mentions the expected amount?"
        ru: "В какой строке есть ожидаемая сумма?"
      - en: "“€” is in every price."
        ru: "«€» есть в любой цене."
    explain:
      en: "If the expected value isn't in the assertion, the assertion can't notice a wrong value."
      ru: "Если ожидаемого значения нет в проверке, неверное значение она не заметит."

  - id: c2-l4-k8
    kind: choice
    keyPoint: kp-fit-to-bug
    placement: true
    prompt:
      en: "A test is green, but the bug it should catch is in the app. What is this called?"
      ru: "Тест зелёный, но баг, который он должен ловить, в приложении есть. Как это называется?"
    options:
      - text: "false negative"
        correct: true
        why:
          en: "Yes: the test says “no problem” while there is one."
          ru: "Да: тест говорит «проблемы нет», а она есть."
      - text: "false positive"
        why:
          en: "That's the opposite: a red test without a real bug."
          ru: "Это наоборот: красный тест без настоящего бага."
      - text: "flaky test"
        why:
          en: "Flaky means sometimes green, sometimes red for the same code."
          ru: "Нестабильный — это когда тест на том же коде то зелёный, то красный."
      - text: "smoke test"
        why:
          en: "A smoke test is a quick check of the main features — unrelated."
          ru: "Смоук-тест — быстрая проверка основных функций, это о другом."
    hints:
      - en: "“Negative” here means the test reports no problem."
        ru: "«Negative» здесь значит, что тест не сообщает о проблеме."
      - en: "It's the dangerous one."
        ru: "Это опасный вариант."
    explain:
      en: "False negative: green on a bug — dangerous, because nobody looks. False positive: red without a bug — annoying, but at least it gets attention."
      ru: "False negative: зелёный при баге — опасно, потому что никто не смотрит. False positive: красный без бага — раздражает, но хотя бы привлекает внимание."
