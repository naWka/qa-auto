        ru: "Посчитай: сколько доставленных заказов, сколько всего?"
      - en: "Which line matches the requirement?"
        ru: "Какая строка соответствует требованию?"
    explain:
      en: "“Showing 6 of 6” after filtering to 3 orders is exactly the bug the test was written to catch. The heal would make it a false negative."
      ru: "«Showing 6 of 6» после фильтра до 3 заказов — ровно тот баг, ради которого писали тест. Лечение сделало бы его ложноотрицательным."

  - id: c2-l4-k3
    kind: find-bug
