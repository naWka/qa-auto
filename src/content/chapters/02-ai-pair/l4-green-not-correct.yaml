        ru: "Поищи `expect` или `assert`."
    explain:
      en: 'The name promises a check the code never makes. A great edge case — and a test that can''t fail. It needs `expect(page.get_by_test_id("cart-total")).to_have_text("€36.40")`.'
      ru: 'Название обещает проверку, которой в коде нет. Отличный пограничный случай — и тест, который не может упасть. Нужно добавить `expect(page.get_by_test_id("cart-total")).to_have_text("€36.40")`.'

