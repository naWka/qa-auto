id: c2-l4
chapter: c2
title: { en: "Green is not the same as correct", ru: "Зелёный — не значит правильный" }
goal:
  en: "Tell a test you can trust from a test that only looks green — and make every new test prove it can fail."
  ru: "Отличать тест, которому можно доверять, от теста, который просто зелёный, — и заставлять каждый новый тест доказать, что он умеет падать."
minutes: 9
keyPoints:
  - id: kp-cant-fail
    title: { en: "Tests that can't fail", ru: "Тесты, которые не могут упасть" }
  - id: kp-fit-to-bug
    title: { en: "“Fixing” a red test to match a bug", ru: "«Починка» красного теста под баг" }
  - id: kp-make-it-fail
    title: { en: "Trust a test after you've seen it fail for the right reason", ru: "Доверяй тесту, когда увидел{а|}, как он падает по правильной причине" }
terms: [false-negative, false-positive, test-coverage, assertion, pass, fail, bug, diff]
steps:
  - type: story
    lines:
      - who: petal
        text:
          en: "Great news! I ran the whole suite: 40 tests, all green ✅"
          ru: "Отличные новости! Я прогнал весь набор: 40 тестов, все зелёные ✅"
      - who: sofia
        text:
          en: "So we can ship Bloomly 3.0 today?"
          ru: "Значит, можно выпускать Bloomly 3.0 сегодня?"
      - who: maya
        text:
          en: "Green means “nothing these tests check is broken”. Before we ship, let's see *what* they check."
          ru: "Зелёный значит «ничего из того, что проверяют эти тесты, не сломано». Прежде чем выпускать, посмотрим, *что* они проверяют."
      - who: mochi
        text: { en: "Mrrp.", ru: "Мрр." }

  - type: pretest
    intro:
      en: "Quick guess before we start. Wrong answers are fine — they help you remember."
      ru: "Быстрая догадка перед стартом. Ошибаться можно — так лучше запоминается."
    items:
      - id: c2-l4-p1
        kind: predict
        keyPoint: kp-cant-fail
        app: { bugs: [add-to-cart-double] }
        context:
          en: "Today's build has a bug: one click on “Add to cart” adds 2 items, so the header counter shows 2 instead of 1."
          ru: "В сегодняшней сборке баг: один клик по «Add to cart» добавляет 2 товара, и счётчик в шапке показывает 2 вместо 1."
        prompt:
          en: "Will Petal's test catch it — or pass?"
          ru: "Поймает ли это тест Petal — или пройдёт?"
        code: |
          from playwright.sync_api import Page, expect


          def test_adding_a_product_updates_the_cart_counter(page: Page):
              page.goto("/shop")
              card = page.get_by_test_id("product-card").filter(has_text="Sunny Tulips")
              card.get_by_role("button", name="Add to cart").click()
              assert page.get_by_test_id("cart-count").is_visible()
        outcome: pass
        reasons:
          - text:
              en: "Pass: it only checks that the counter is visible, not what it says."
              ru: "Пройдёт: он проверяет только, что счётчик виден, а не что на нём написано."
            correct: true
          - text:
              en: "Fail: the counter is wrong, so the test catches it."
              ru: "Упадёт: счётчик неверный, тест это поймает."
        hints:
          - en: "What exactly does the last line compare?"
            ru: "Что именно сравнивает последняя строка?"
          - en: "Is a counter showing “2” visible?"
            ru: "Счётчик с цифрой «2» виден?"
        explain:
          en: "The counter is visible whether it shows 1, 2 or 99. This test can't fail because of a wrong count — it's green on a bug."
          ru: "Счётчик виден, что бы он ни показывал: 1, 2 или 99. Из-за неверного количества этот тест упасть не может — он зелёный при баге."

  - type: theory
    keyPoint: kp-cant-fail
    title: { en: "Tests that can't fail", ru: "Тесты, которые не могут упасть" }
    body:
      - en: "A test is useful only if it *can* go red when the feature breaks. Some tests can't: they have no [[assertion]], or they check something that is always true. Forty such tests look like great [[test coverage|test-coverage]] and cover almost nothing."
        ru: "Тест полезен, только если он *может* покраснеть, когда функция ломается. Некоторые не могут: в них нет [[проверки|assertion]] или они проверяют то, что верно всегда. Сорок таких тестов выглядят как отличное [[покрытие|test-coverage]] и почти ничего не покрывают."
      - en: "A classic AI pattern: `assert total.is_visible()`. It checks that the total *exists* — not that it's *right*. Python has two even sneakier ones: `assert total` is always true (a locator is only a description of where to look, so it always “exists”), and `expect(total).to_be_visible` without `()` never runs at all."
        ru: "Классика от ИИ: `assert total.is_visible()`. Проверяет, что итог *есть*, а не что он *правильный*. В Python есть два варианта ещё коварнее: `assert total` проходит всегда (локатор — лишь описание того, где искать, поэтому он «есть» всегда), а `expect(total).to_be_visible` без `()` вообще не выполняется."
      - en: "Manual analogy: a test case whose expected result is “the page works”. Nobody can ever fail it."
        ru: "Аналогия из ручного тестирования: тест-кейс с ожидаемым результатом «страница работает». Его невозможно провалить."
    code: |
      # can't catch a wrong total:
      assert page.get_by_test_id("cart-total").is_visible()    # exists, not right
      assert page.get_by_test_id("cart-total")                 # always true
      expect(page.get_by_test_id("cart-total")).to_be_visible  # no () - never runs
      expect(page).to_have_url(re.compile(r"cart"))            # the test opened /cart itself
      # can:
      expect(page.get_by_test_id("cart-total")).to_have_text("€70.00")
    mentor:
      en: "Ask every test: what bug would make you red? If the answer is “none”, it's decoration."
      ru: "Спроси у каждого теста: какой баг сделает тебя красным? Если ответ «никакой» — это декорация."

  - type: theory
    keyPoint: kp-fit-to-bug
    title: { en: "When the agent fixes the test instead of the bug", ru: "Когда агент чинит тест вместо бага" }
    body:
      - en: "A test goes red. The agent's goal is “make it green”, so it may change the expected value to whatever the app shows now. Green again — and the [[bug]] is now *part of the test*."
        ru: "Тест покраснел. Цель агента — «сделать зелёным», и он может поменять ожидаемое значение на то, что приложение показывает сейчас. Снова зелёный — а [[баг|bug]] теперь *часть теста*."
      - en: "That's a [[false negative|false-negative]]: the bug is there, the test says “all good”. Its opposite, a [[false positive|false-positive]], is a red test without a real bug — annoying, but at least it makes noise."
        ru: "Это [[ложноотрицательный результат|false-negative]]: баг есть, а тест говорит «всё хорошо». Противоположность — [[ложное срабатывание|false-positive]]: тест красный, а бага нет. Раздражает, но хотя бы шумит."
      - en: "A healer — an AI agent that repairs failing tests — should change the *test* only when the test is outdated (a changed locator, a timing issue). When the app is wrong, it should say so — for example, mark the test `@pytest.mark.xfail(reason=\"BUG-123\")` — instead of hiding the bug. Any agent can still get it wrong, so read every “heal” as a [[diff]]."
        ru: "Хилер — ИИ-агент, который чинит упавшие тесты, — должен менять *тест*, только когда устарел сам тест (изменился локатор, проблема с таймингом). Если ошибается приложение, он должен так и сказать — например, пометить тест `@pytest.mark.xfail(reason=\"BUG-123\")`, — а не прятать баг. Но ошибиться может любой агент, поэтому читай каждое «лечение» как [[дифф|diff]]."
    code: |
      - expect(page.get_by_test_id("cart-total")).to_have_text("€70.00")
      + expect(page.get_by_test_id("cart-total")).to_have_text("€39.90")
    mentor:
      en: "The expected value comes from the requirements — never from the screen. If the screen disagrees, that's a bug report, not a test fix."
      ru: "Ожидаемое значение берётся из требований — никогда с экрана. Если экран с ним не согласен, это баг-репорт, а не правка теста."

  - type: theory
    keyPoint: kp-make-it-fail
    title: { en: "Trust a test after you've seen it fail", ru: "Доверяй тесту, когда увидел{а|} его падение" }
    body:
      - en: "Before you trust a new test, make it [[fail]] on purpose: change the expected value (€70.00 → €71.00), or run it on a build where the bug is switched on. It must go red."
        ru: "Прежде чем доверять новому тесту, заставь его [[упасть|fail]] нарочно: поменяй ожидаемое значение (€70.00 → €71.00) или запусти на сборке, где включён баг. Он обязан покраснеть."
      - en: "Then read the message: does it fail *for the right reason*? `Locator expected to have text '€70.00'` and `Actual value: €39.90` — yes. A timeout because the element was never found — no, that's a different problem."
        ru: "Потом прочитай сообщение: падает ли он *по правильной причине*? `Locator expected to have text '€70.00'` и `Actual value: €39.90` — да. Таймаут, потому что элемент так и не нашёлся, — нет, это другая проблема."
      - en: "You did this as a manual QA: to verify a bug fix, you first reproduce the bug. Same idea, applied to the test itself."
        ru: "Ты делал{а|} это в ручном тестировании: чтобы проверить исправление бага, сначала воспроизводишь баг. Та же идея, только применённая к самому тесту."
    figure: red-green
    mentor:
      en: "A test you have never seen red is a promise, not a proof."
      ru: "Тест, который ты ни разу не видел{а|} красным, — это обещание, а не доказательство."

  - type: example
    keyPoint: kp-make-it-fail
    title: { en: "Red for the right reason", ru: "Красный по правильной причине" }
    intro:
      en: "Maya's test for the orders status filter, run on a build where the summary bug is switched on (it always says “Showing 6 of 6 orders”). Run it: you should see red — on the right line."
      ru: "Тест Майи для фильтра статусов заказов, запущенный на сборке с включённым багом сводки (она всегда пишет «Showing 6 of 6 orders»). Запусти: должно быть красное — и на правильной строке."
    app: { bugs: [orders-summary-wrong], state: { user: anna@bloomly.app } }
    code: |
      from playwright.sync_api import Page, expect


      def test_status_filter_shows_only_delivered_orders(page: Page):
          page.goto("/orders")
          page.get_by_label("Status").select_option("Delivered")
          expect(page.get_by_test_id("order-row")).to_have_count(3)
          expect(page.get_by_test_id("orders-summary")).to_have_text("Showing 3 of 6 orders")
    notes:
      - lines: 5
        text:
          en: "Anna is already logged in (preset state), so the test starts right on /orders."
          ru: "Anna уже вошла (предустановленное состояние), поэтому тест начинается сразу с /orders."
      - lines: 6
        text:
          en: "The action from the test case: filter by “Delivered”."
          ru: "Действие из тест-кейса: фильтр по «Delivered»."
      - lines: 7
        text:
          en: "Guards the filter: Anna has exactly 3 delivered orders. On this build it passes — the rows are fine."
          ru: "Охраняет фильтр: у Anna ровно 3 доставленных заказа. На этой сборке проходит — строки в порядке."
      - lines: 8
        text:
          en: "Guards the summary, with the value from the requirements. On this build it fails: `Locator expected to have text 'Showing 3 of 6 orders'`, `Actual value: Showing 6 of 6 orders`. Red for the right reason."
          ru: "Охраняет сводку, со значением из требований. На этой сборке падает: `Locator expected to have text 'Showing 3 of 6 orders'`, `Actual value: Showing 6 of 6 orders`. Красный по правильной причине."
    runnable: true

  - type: task
    task:
      id: c2-l4-t1
      kind: choice
      keyPoint: kp-cant-fail
      multi: true
      context:
        en: "The cart has 1 Rose Bouquet. Each test applies BLOOM10; the correct total is €36.40."
        ru: "В корзине 1 Rose Bouquet. Каждый тест применяет BLOOM10; правильный итог — €36.40."
      prompt:
        en: "Which of these tests would stay green if the total were calculated wrong? Pick all."
        ru: "Какие из этих тестов останутся зелёными, если итог посчитается неверно? Выбери все."
      options:
        - text: { en: "A test with no assertion at all — no `expect`, no `assert`", ru: "Тест вообще без проверки — ни `expect`, ни `assert`" }
          correct: true
          why:
            en: "No assertion — nothing can make it red except a crash."
            ru: "Нет проверки — покраснеть он может только от падения кода."
        - text: { en: 'A test that checks `expect(page).to_have_url(re.compile(r"cart"))`', ru: 'Тест, который проверяет `expect(page).to_have_url(re.compile(r"cart"))`' }
          correct: true
          why:
            en: "Always true: the test itself navigated to /cart."
            ru: "Всегда верно: тест сам перешёл на /cart."
        - text: { en: "A test with `assert total.is_visible()`", ru: "Тест с `assert total.is_visible()`" }
          correct: true
          why:
            en: "A wrong total is still visible."
            ru: "Неверный итог тоже виден."
        - text: { en: 'A test with `expect(total).to_have_text("€36.40")`', ru: 'Тест с `expect(total).to_have_text("€36.40")`' }
          why:
            en: "This one goes red as soon as the total is anything but €36.40."
            ru: "Этот покраснеет, как только итог будет хоть немного не €36.40."
      hints:
        - en: "For each test ask: what would a wrong total change in it?"
          ru: "Для каждого теста спроси: что в нём изменит неверный итог?"
        - en: "Only an assertion on the *value* notices a wrong value."
          ru: "Неверное значение замечает только проверка *значения*."
        - en: "Three of four stay green."
          ru: "Зелёными останутся три из четырёх."
      praise:
        en: "You judged each test by the bug it can catch — exactly the right question."
        ru: "Ты оценивал{а|} каждый тест по тому, какой баг он может поймать, — ровно правильный вопрос."
      explain:
        en: 'No assertion, an always-true URL check, a presence check — three ways to be green on a broken total. Only `to_have_text("€36.40")` turns the requirement into a check.'
        ru: 'Нет проверки, всегда верная проверка URL, проверка наличия — три способа быть зелёным при сломанном итоге. Только `to_have_text("€36.40")` превращает требование в проверку.'

  - type: task
    task:
      id: c2-l4-t2
      kind: review
      keyPoint: kp-cant-fail
      context:
        en: "Petal's test for TC-205. The cart is preset with 1 Rose Bouquet."
        ru: "Тест Petal для TC-205. В корзине заранее лежит 1 Rose Bouquet."
      prompt:
        en: "Flag every assertion that can't catch a broken discount."
        ru: "Отметь каждую проверку, которая не поймает сломанную скидку."
      testCase:
        id: TC-205
        title: BLOOM10 gives 10% off
        preconditions: ["Cart has 1 Rose Bouquet (€35.00)"]
        steps:
          - { action: "Open /cart" }
          - { action: "Enter the promo code and click \"Apply\"", data: "BLOOM10", expected: "Message \"Promo code BLOOM10 applied: −10%.\"; total €36.40" }
      code: |
        import re
        from playwright.sync_api import Page, expect


        def test_bloom10_gives_10_percent_off(page: Page):
            page.goto("/cart")
            page.get_by_label("Promo code").fill("BLOOM10")
            page.get_by_role("button", name="Apply").click()
            expect(page.get_by_test_id("promo-message")).to_be_visible()
            assert page.get_by_test_id("cart-total")
            expect(page).to_have_url(re.compile(r"cart"))
      issues:
        - line: 9
          type: weak-assertion
          note:
            en: "An error like “This promo code is not valid.” is visible too. Check the text: “Promo code BLOOM10 applied: −10%.”"
            ru: "Ошибка вроде «This promo code is not valid.» тоже видна. Проверяй текст: «Promo code BLOOM10 applied: −10%.»"
        - line: 10
          type: weak-assertion
          note:
            en: 'Always true: a locator is only a description of where to look, so this passes even with no total on the page — let alone a wrong one. Use `expect(page.get_by_test_id("cart-total")).to_have_text("€36.40")`.'
            ru: 'Всегда верно: локатор — лишь описание того, где искать, поэтому строка пройдёт, даже если итога на странице нет вовсе, не говоря уж о неверном. Используй `expect(page.get_by_test_id("cart-total")).to_have_text("€36.40")`.'
        - line: 11
          type: weak-assertion
          note:
            en: "Always true — the test opened /cart itself. It checks nothing about the discount."
            ru: "Всегда верно — тест сам открыл /cart. О скидке это ничего не говорит."
      types: [weak-assertion, no-assertion, wrong-assertion, hard-wait, fragile-locator]
      hints:
        - en: "For each check — `expect` or `assert` — imagine the discount is broken. Would it go red?"
          ru: "Для каждой проверки — `expect` или `assert` — представь, что скидка сломана. Покраснеет ли она?"
        - en: "Even an error message is “visible”. And what does `assert` get on line 10 — a value, or just a locator?"
          ru: "Даже сообщение об ошибке «видно». А что получает `assert` в строке 10 — значение или просто локатор?"
        - en: "Lines 9, 10 and 11 — all three assertions."
          ru: "Строки 9, 10 и 11 — все три проверки."
      praise:
        en: "Three assertions, zero protection — and you saw through all of them."
        ru: "Три проверки и ноль защиты — и ты раскусил{а|} все три."
      explain:
        en: "This test has three assertions and still can't fail on a broken discount. Counting assertions says nothing — ask what each one would catch."
        ru: "В этом тесте три проверки, и всё равно он не упадёт на сломанной скидке. Количество проверок ничего не значит — спрашивай, что ловит каждая."

  - type: task
    task:
      id: c2-l4-t3
      kind: choice
      keyPoint: kp-fit-to-bug
      context:
        en: "TC-141's test went red on today's build: `Locator expected to have text '1'`, `Actual value: 2`. Petal ran a heal and reports: “Fixed 1 test: updated the expected cart count to match the application. All green ✅”"
        ru: "Тест TC-141 покраснел на сегодняшней сборке: `Locator expected to have text '1'`, `Actual value: 2`. Petal запустил лечение и докладывает: «Fixed 1 test: updated the expected cart count to match the application. All green ✅»"
      testCase:
        id: TC-141
        title: Adding a product updates the cart counter
        preconditions: ["Cart is empty"]
        steps:
          - { action: "Open /shop" }
          - { action: "Click \"Add to cart\" on the Sunny Tulips card", expected: "Cart counter in the header shows 1" }
      prompt:
        en: "What do you do with this change?"
        ru: "Что ты делаешь с этим изменением?"
      diff:
        before: |
          expect(page.get_by_test_id("cart-count")).to_have_text("1")
        after: |
          expect(page.get_by_test_id("cart-count")).to_have_text("2")
      options:
        - text: { en: "Reject the change and file a bug: one click adds 2 items. The test was right.", ru: "Отклонить изменение и завести баг: один клик добавляет 2 товара. Тест был прав." }
          correct: true
          why:
            en: "TC-141 says 1. The app shows 2. That's a bug in the app, not in the test."
            ru: "В TC-141 — 1. Приложение показывает 2. Это баг в приложении, а не в тесте."
        - text: { en: "Accept: the test is green again", ru: "Принять: тест снова зелёный" }
          why:
            en: "Green now means “the bug is still there”. That's a false negative."
            ru: "Теперь зелёный значит «баг на месте». Это ложноотрицательный результат."
        - text: { en: "Accept, and rename the test to “adds two items”", ru: "Принять и переименовать тест в «добавляет два товара»" }
          why:
            en: "That rewrites the requirement to match the bug."
            ru: "Это переписывает требование под баг."
        - text: { en: "Delete the test — it's flaky", ru: "Удалить тест — он нестабильный" }
          why:
            en: "It isn't flaky: it failed every time, for the right reason."
            ru: "Он не нестабильный: он падал каждый раз и по правильной причине."
      hints:
        - en: "Where does the expected value come from: the test case or the screen?"
          ru: "Откуда берётся ожидаемое значение: из тест-кейса или с экрана?"
        - en: "Read TC-141's expected result."
          ru: "Прочитай ожидаемый результат в TC-141."
        - en: "The red test was doing its job."
          ru: "Красный тест делал свою работу."
      praise:
        en: "You protected the requirement instead of the green checkmark. That's the core of QA."
        ru: "Ты защитил{а|} требование, а не зелёную галочку. В этом суть QA."
      explain:
        en: "A red test that says “expected '1', actual value: 2” is a perfect bug report. The heal turned it into a [[false negative|false-negative]]. Reject the diff, file the bug, and keep the original assertion."
        ru: "Красный тест с «expected '1', actual value: 2» — идеальный баг-репорт. Лечение превратило его в [[ложноотрицательный результат|false-negative]]. Отклони дифф, заведи баг и оставь исходную проверку."

  - type: task
    task:
      id: c2-l4-t4
      kind: predict
      keyPoint: kp-fit-to-bug
      context:
        en: "Nobody noticed, and Petal's “heal” was merged. A day later Kai fixed the double-add bug. Now one click adds exactly 1 item."
        ru: "Никто не заметил, и «лечение» Petal смержили. Через день Kai починил баг с двойным добавлением. Теперь один клик добавляет ровно 1 товар."
      prompt:
        en: "Will the healed test pass or fail on the fixed build?"
        ru: "«Вылеченный» тест пройдёт или упадёт на исправленной сборке?"
      code: |
        from playwright.sync_api import Page, expect


        def test_adding_a_product_updates_the_cart_counter(page: Page):
            page.goto("/shop")
            card = page.get_by_test_id("product-card").filter(has_text="Sunny Tulips")
            card.get_by_role("button", name="Add to cart").click()
            expect(page.get_by_test_id("cart-count")).to_have_text("2")
      outcome: fail
      reasons:
        - text:
            en: "Fail: the counter now correctly shows 1, but the healed test expects the old bug, 2."
            ru: "Упадёт: счётчик теперь правильно показывает 1, а «вылеченный» тест ждёт старый баг — 2."
          correct: true
        - text:
            en: "Pass: the test was healed, so it's stable now."
            ru: "Пройдёт: тест вылечили, теперь он стабильный."
        - text:
            en: "Fail: the Sunny Tulips card can't be found."
            ru: "Упадёт: карточку Sunny Tulips не найти."
      hints:
        - en: "What does the counter show after the fix?"
          ru: "Что показывает счётчик после исправления?"
        - en: "What does the test expect?"
          ru: "Чего ждёт тест?"
        - en: "1 ≠ 2."
          ru: "1 ≠ 2."
      praise:
        en: "Exactly: the healed test punishes the fix. Double damage."
        ru: "Именно: «вылеченный» тест наказывает исправление. Двойной вред."
      explain:
        en: "Fitting a test to a bug does damage twice: first it hides the bug (false negative), then it fails on the correct app ([[false positive|false-positive]]). Kai will now waste time on a “broken” fix that actually works."
        ru: "Подгонка теста под баг вредит дважды: сначала прячет баг (ложноотрицательный результат), потом падает на правильном приложении ([[ложное срабатывание|false-positive]]). Kai теперь потратит время на «сломанное» исправление, которое на самом деле работает."

  - type: task
    task:
      id: c2-l4-t5
      kind: choice
      keyPoint: kp-fit-to-bug
      prompt:
        en: "The healer reports: “Updated the expected value to match the application.” What's the first question you ask?"
        ru: "Хилер докладывает: «Updated the expected value to match the application». Какой вопрос ты задаёшь первым?"
      options:
        - text: { en: "Which value is right according to the requirements: the old expected one or the new actual one?", ru: "Какое значение верно по требованиям: старое ожидаемое или новое фактическое?" }
          correct: true
          why:
            en: "If the requirement changed — accept. If not — it's a bug, reject and report it."
            ru: "Если требование поменялось — принять. Если нет — это баг: отклонить и завести."
        - text: { en: "Is the test green now?", ru: "Тест теперь зелёный?" }
          why:
            en: "It always is after such a heal. That's the problem."
            ru: "После такого лечения он всегда зелёный. В этом и проблема."
        - text: { en: "How long did the heal take?", ru: "Сколько времени заняло лечение?" }
          why:
            en: "Speed doesn't matter if the result hides a bug."
            ru: "Скорость не важна, если результат прячет баг."
        - text: { en: "Can the healer fix more tests the same way?", ru: "Может ли хилер так же починить и другие тесты?" }
          why:
            en: "That would hide more bugs, faster."
            ru: "Так он спрячет больше багов, и быстрее."
      hints:
        - en: "A changed expected value is either a new requirement or a bug."
          ru: "Изменённое ожидаемое значение — это либо новое требование, либо баг."
        - en: "Who decides which one? Not the healer."
          ru: "Кто решает, что именно? Не хилер."
      praise:
        en: "That's the question that separates a test fix from a bug cover-up."
        ru: "Именно этот вопрос отличает починку теста от сокрытия бага."
      explain:
        en: "Locator and timing changes are fair game for a healer. A changed *expected value* always needs a human decision against the requirements."
        ru: "Изменения локаторов и таймингов — нормальная работа для хилера. Изменённое *ожидаемое значение* всегда требует решения человека — по требованиям."

  - type: task
    task:
      id: c2-l4-t6
      kind: find-bug
      keyPoint: kp-make-it-fail
      app: { bugs: [add-to-cart-double] }
      context:
        en: "This is Petal's weak test from the start of the lesson. The build still has the double-add bug."
        ru: "Это слабый тест Petal из начала урока. В сборке всё ещё баг с двойным добавлением."
      prompt:
        en: "Change the test so it fails on this build and passes once the bug is fixed."
        ru: "Измени тест так, чтобы он падал на этой сборке и проходил, когда баг починят."
      testCase:
        id: TC-141
        title: Adding a product updates the cart counter
        preconditions: ["Cart is empty"]
        steps:
          - { action: "Open /shop" }
          - { action: "Click \"Add to cart\" on the Sunny Tulips card", expected: "Cart counter in the header shows 1" }
      starter: |
        from playwright.sync_api import Page, expect


        def test_adding_a_product_updates_the_cart_counter(page: Page):
            page.goto("/shop")
            card = page.get_by_test_id("product-card").filter(has_text="Sunny Tulips")
            card.get_by_role("button", name="Add to cart").click()
            assert page.get_by_test_id("cart-count").is_visible()
      solution: |
        from playwright.sync_api import Page, expect


        def test_adding_a_product_updates_the_cart_counter(page: Page):
            page.goto("/shop")
            card = page.get_by_test_id("product-card").filter(has_text="Sunny Tulips")
            card.get_by_role("button", name="Add to cart").click()
            expect(page.get_by_test_id("cart-count")).to_have_text("1")
      checks:
        expect: fail
        static: [hasAssertion]
        also:
          - app: {}
            expect: pass
      hints:
        - en: "The last line checks that the counter exists. TC-141 says what it should show."
          ru: "Последняя строка проверяет, что счётчик есть. TC-141 говорит, что он должен показывать."
        - en: "Use a web-first assertion on the text: `expect(...).to_have_text(...)`."
          ru: "Используй проверку текста, которая сама ждёт: `expect(...).to_have_text(...)`."
        - en: 'Replace the last line with `expect(page.get_by_test_id("cart-count")).to_have_text("1")`'
          ru: 'Замени последнюю строку на `expect(page.get_by_test_id("cart-count")).to_have_text("1")`'
      praise:
        en: "Red on the bug, green on the fix. You've just turned decoration into a real test."
        ru: "Красный при баге, зелёный после исправления. Ты только что превратил{а|} декорацию в настоящий тест."
      explain:
        en: "On the buggy build the run now fails with `Locator expected to have text '1'` and `Actual value: 2` — the failure describes the bug itself. That's how you know the test fails for the right reason."
        ru: "На багованной сборке прогон теперь падает с `Locator expected to have text '1'` и `Actual value: 2` — падение описывает сам баг. Так ты и понимаешь, что тест падает по правильной причине."

  - type: task
    task:
      id: c2-l4-t7
      kind: choice
      keyPoint: kp-make-it-fail
      prompt:
        en: 'Your new assertion `expect(page.get_by_test_id("cart-count")).to_have_text("1")` is green on the fixed build. How do you make sure it can actually catch a bug?'
        ru: 'Твоя новая проверка `expect(page.get_by_test_id("cart-count")).to_have_text("1")` зелёная на исправленной сборке. Как убедиться, что она действительно может поймать баг?'
      options:
        - text: { en: "Temporarily change `\"1\"` to `\"5\"`, run, see red with `Locator expected to have text '5'` and `Actual value: 1`, then change it back", ru: "Временно поменять `\"1\"` на `\"5\"`, запустить, увидеть красный с `Locator expected to have text '5'` и `Actual value: 1` и вернуть обратно" }
          correct: true
          why:
            en: "You've seen it fail, and fail for the right reason. (Running it on a build with the bug works too.)"
            ru: "Ты увидел{а|}, как она падает, и по правильной причине. (Запуск на сборке с багом тоже подходит.)"
        - text: { en: "Run it ten more times — if it stays green, it's reliable", ru: "Запустить ещё десять раз — если останется зелёной, она надёжна" }
          why:
            en: "Ten green runs prove it's stable, not that it can fail."
            ru: "Десять зелёных прогонов доказывают стабильность, а не способность падать."
        - text: { en: "Ask Petal to confirm the test is correct", ru: "Попросить Petal подтвердить, что тест правильный" }
          why:
            en: "Petal will say yes — about any test."
            ru: "Petal скажет «да» — про любой тест."
        - text: { en: "Add `page.wait_for_timeout(2000)` before the assertion", ru: "Добавить `page.wait_for_timeout(2000)` перед проверкой" }
          why:
            en: "That slows the test down and proves nothing."
            ru: "Это замедлит тест и ничего не докажет."
      hints:
        - en: "To trust a test, you need to see it red at least once."
          ru: "Чтобы доверять тесту, нужно хотя бы раз увидеть его красным."
        - en: "Break the expectation on purpose."
          ru: "Нарочно сломай ожидание."
      praise:
        en: "That's the habit: never trust a test you haven't seen fail."
        ru: "Вот она, привычка: не доверять тесту, который ты не видел{а|} падающим."
      explain:
        en: "Breaking the expected value for one run is the cheapest way to prove the assertion is alive. Read the message too: it should name the value you broke."
        ru: "Сломать ожидаемое значение на один прогон — самый дешёвый способ доказать, что проверка живая. И прочитай сообщение: в нём должно быть значение, которое ты сломал{а|}."

  - type: task
    task:
      id: c2-l4-t8
      kind: vocab
      keyPoint: kp-fit-to-bug
      mode: cloze
      sentence:
        en: "The healer changed the expected count from 1 to 2. Now the test is green, but the bug is still there — a ___."
        ru: "Хилер поменял ожидаемое количество с 1 на 2. Теперь тест зелёный, а баг на месте — это ложноотрицательный результат."
      answer: false negative
      options: [false negative, false positive, flaky test]

  - type: mistakes
    keyPoint: kp-cant-fail
    title: { en: "Looks like a check, isn't one", ru: "Похоже на проверку, но не проверка" }
    items:
      - wrong: 'assert page.get_by_test_id("cart-count").is_visible()'
        right: 'expect(page.get_by_test_id("cart-count")).to_have_text("1")'
        why:
          en: "Presence isn't correctness. Check the value from the test case."
          ru: "Наличие — не правильность. Проверяй значение из тест-кейса."
      - wrong: 'expect(page).to_have_url(re.compile(r"cart"))'
        right: 'expect(page.get_by_test_id("cart-total")).to_have_text("€36.40")'
        why:
          en: "The test navigated there itself — this is always true."
          ru: "Тест сам туда перешёл — это верно всегда."
      - wrong: 'expect(page.get_by_test_id("promo-message")).to_be_visible'
        right: 'expect(page.get_by_test_id("promo-message")).to_have_text("Promo code BLOOM10 applied: −10%.")'
        why:
          en: "Without `()` the check never runs. And even with them, “visible” would pass on an error message too. Call it, and check the text."
          ru: "Без `()` проверка вообще не выполняется. А со скобками «виден» прошло бы и на сообщении об ошибке. Вызови проверку и сверяй текст."
      - wrong: 'expect(page.get_by_test_id("cart-count")).to_have_text("2")  # healed'
        right: 'expect(page.get_by_test_id("cart-count")).to_have_text("1")  # + bug report'
        why:
          en: "Never fit the expected value to the app. A disagreement is a bug report."
          ru: "Никогда не подгоняй ожидаемое значение под приложение. Расхождение — это баг-репорт."

  - type: explain
    keyPoint: kp-make-it-fail
    prompt:
      en: "In your own words: why isn't a green test enough, and how do you check that a test can be trusted?"
      ru: "Своими словами: почему зелёного теста недостаточно и как проверить, что тесту можно доверять?"
    model:
      en: "Green only means that what the test checks isn't broken. If it checks nothing, or only that an element exists, or if someone fitted the expected value to a bug, it stays green while the bug is there. So I read what each assertion compares, I make sure the expected values come from the test case, and I see the test fail at least once — by breaking the expected value or running it on a buggy build — and check that the message points at the right problem."
      ru: "Зелёный значит только, что сломано не то, что проверяет тест. Если он ничего не проверяет, или проверяет лишь наличие элемента, или кто-то подогнал ожидаемое значение под баг, он остаётся зелёным при баге. Поэтому я читаю, что сравнивает каждая проверка, слежу, чтобы ожидаемые значения брались из тест-кейса, и хотя бы раз вижу, как тест падает, — ломаю ожидаемое значение или запускаю на сборке с багом — и проверяю, что сообщение указывает на правильную проблему."

  - type: phrases
    items:
      - context: code-review
        en: "This assertion can't fail: it only checks that the total is visible. Please assert the value from TC-205."
        ru: "Эта проверка не может упасть: она смотрит только, видно ли итог. Пожалуйста, проверяй значение из TC-205."
      - context: code-review
        en: "Rejecting this heal: the app is wrong, not the test. I've filed a bug."
        ru: "Отклоняю это лечение: ошибается приложение, а не тест. Я {завела|завёл} баг."
        note:
          en: "Say clearly which side is wrong — the app or the test."
          ru: "Чётко скажи, кто ошибается, — приложение или тест."
      - context: bug-report
        en: "Clicking “Add to cart” once adds two items. Expected: the cart counter shows 1. Actual: 2."
        ru: "Один клик по «Add to cart» добавляет два товара. Ожидаемый результат: счётчик корзины показывает 1. Фактический: 2."
      - context: standup
        en: "All 40 tests are green, but I found six that can't fail. I'm fixing their assertions today."
        ru: "Все 40 тестов зелёные, но я нашл{а|ёл} шесть, которые не могут упасть. Сегодня исправляю их проверки."
      - context: chat
        en: "Before we trust the new checkout test, let's see it fail on the build with the bug."
        ru: "Прежде чем доверять новому тесту чекаута, давай посмотрим, как он падает на сборке с багом."

checkPool:
  - id: c2-l4-k1
    kind: predict
