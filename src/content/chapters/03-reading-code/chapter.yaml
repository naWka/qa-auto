      solution: |
        import pytest
        from playwright.sync_api import Page, expect

        # Test data: Anna has 6 orders
        ANNA = {"email": "anna@bloomly.app", "password": "bloom123"}
        FILTERS = [
            ("Delivered", 3),
            ("Shipped", 1),
            ("Cancelled", 1),
        ]


        def log_in(page: Page, email, password):
            page.goto("/login")
            page.get_by_label("Email").fill(email)
            page.get_by_label("Password").fill(password)
            page.get_by_role("button", name="Log in").click()
            expect(page).to_have_url("http://localhost:3000/account")


        @pytest.mark.parametrize("status, count", FILTERS)
        def test_orders_filter_shows_only_that_status(page: Page, status, count):
            log_in(page, email=ANNA["email"], password=ANNA["password"])
            page.goto("/orders")
            expect(page.get_by_test_id("orders-loading")).to_be_hidden()
            page.get_by_label("Status").select_option(status)
            expect(page.get_by_test_id("order-row")).to_have_count(count)
      checks:
        expect: pass
        minTests: 3
        also:
          - app: { bugs: [orders-filter-wrong] }
            expect: fail
        static:
          - callsMethods
          - rule: regex
            value: 'to_have_count\(count\)|f["'']Showing \{count\} of'
            message:
              en: "Check the number of rows using `count` — the expected result from the data row."
              ru: "Проверь число строк через `count` — ожидаемый результат из строки данных."
      hints:
        - { en: "Three edits: line 8 (data), line 25 (brackets), line 27 (assertion).", ru: "Три правки: строка 8 (данные), строка 25 (скобки), строка 27 (проверка)." }
        - { en: "Each order is a row with the test id `order-row`. `to_have_count(n)` checks how many there are — and `count` already holds the right number for each test.", ru: "Каждый заказ — строка с test id `order-row`. `to_have_count(n)` проверяет, сколько их, — а в `count` уже лежит нужное число для каждого теста." }
        - { en: 'Line 27 → `expect(page.get_by_test_id("order-row")).to_have_count(count)`', ru: 'Строка 27 → `expect(page.get_by_test_id("order-row")).to_have_count(count)`' }
      praise:
        en: "Three green tests that actually prove what their names promise — and they go red when the filter breaks. Request changes → approved. That's the job."
        ru: "Три зелёных теста, которые действительно доказывают то, что обещают их имена, — и краснеют, когда фильтр ломается. Запросить изменения → одобрить. Вот это и есть работа."
      explain:
        en: 'Now the data row drives the check: `to_have_count(count)` fails when the filter shows the wrong orders — that''s why `[Shipped-1]` went red on the broken build. It would also have caught the wrong "Shipped: 2". Checking the summary works too, with an f-string: `to_have_text(f"Showing {count} of 6 orders")` — without the `f`, it would look for the literal text `{count}`.'
        ru: 'Теперь проверкой управляет строка данных: `to_have_count(count)` падает, когда фильтр показывает не те заказы, — поэтому на сломанной сборке покраснел `[Shipped-1]`. И неверное «Shipped: 2» эта проверка тоже поймала бы. Можно проверить и сводку — через f-строку: `to_have_text(f"Showing {count} of 6 orders")`. Без `f` тест искал бы буквальный текст `{count}`.'
