        ru: "Сделай PR честным: исправь данные, добавь недостающие скобки и замени слабую проверку на проверку числа строк — через `count`. Все 3 теста должны пройти, а потом тот же файл запустится ещё раз на сборке со сломанным фильтром Shipped — и там он должен упасть."
      starter: |
        import pytest
        from playwright.sync_api import Page, expect

        # Test data: Anna has 6 orders
        ANNA = {"email": "anna@bloomly.app", "password": "bloom123"}
        FILTERS = [
