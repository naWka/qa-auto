    hints:
      - { en: "Read line 6 slowly, up to the closing quote.", ru: "Прочитай строку 6 медленно, до закрывающей кавычки." }
      - { en: "What is between `3` and the closing `\"`?", ru: "Что стоит между `3` и закрывающей `\"`?" }
    explain:
      en: "`\"bloom123 \"` is 9 characters, the real password is 8. Bloomly says \"Invalid email or password.\" and stays on /login. In a report this looks like a broken login — only reading the string shows the truth."
      ru: "В `\"bloom123 \"` 9 символов, а в настоящем пароле 8. Bloomly отвечает «Invalid email or password.» и остаётся на /login. В отчёте это выглядит как сломанный логин — правду показывает только чтение строки."

