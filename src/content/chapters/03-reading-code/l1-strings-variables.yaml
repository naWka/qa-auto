id: c3-l1
chapter: c3
title: { en: "Strings, variables and f-strings", ru: "Строки, переменные и f-строки" }
goal:
  en: "Find the test data in a test and read exactly what will be typed or checked — including text built with f-strings."
  ru: "Находить тестовые данные в тесте и точно читать, что будет введено или проверено, — включая текст, собранный f-строкой."
minutes: 8
keyPoints:
  - id: kp-strings
    title: { en: "Text in quotes is exact data", ru: "Текст в кавычках — точные данные" }
  - id: kp-variable
    title: { en: "A variable gives test data a name", ru: "Переменная даёт тестовым данным имя" }
  - id: kp-fstring
    title: { en: "f-strings put data into text", ru: "f-строки подставляют данные в текст" }
terms: [string, variable, quotes, lowercase, trailing-space, character-by-character, double-check]

steps:
  - type: story
    lines:
      - who: maya
        text:
          en: "Petal's overnight PR has 30 tests. Before we approve anything, let's find where the test data lives."
          ru: "В ночном PR от Petal 30 тестов. Прежде чем что-то одобрять, давай найдём, где в них живут тестовые данные."
      - who: petal
        text:
          en: "The data is perfect. I copied every email and every text very carefully. Probably."
          ru: "Данные идеальны. Я очень аккуратно скопировал все email и тексты. Наверное."
      - who: maya
        text:
          en: "\"Probably\" is our job. In code, one wrong letter in a string means a red test — or a test that checks the wrong thing."
          ru: "«Наверное» — это как раз наша работа. В коде одна неверная буква в строке — это красный тест или тест, который проверяет не то."

  - type: pretest
    intro:
      en: "Quick guess before we start. Wrong answers are fine — they help you remember."
      ru: "Быстрая догадка перед началом. Ошибаться можно — так лучше запоминается."
    items:
      - id: c3-l1-p1
        kind: choice
        keyPoint: kp-strings
        prompt:
          en: "For the code, are `\"Log in\"` and `\"Login\"` the same text?"
          ru: "Для кода `\"Log in\"` и `\"Login\"` — это один и тот же текст?"
        options:
          - text: { en: "No — one has a space, so they are different strings", ru: "Нет — в одном есть пробел, значит, это разные строки" }
            correct: true
            why: { en: "Code compares text character by character, and a space is a character.", ru: "Код сравнивает текст посимвольно, а пробел — тоже символ." }
          - text: { en: "Yes — they mean the same thing", ru: "Да — смысл же одинаковый" }
            why: { en: "A human reads meaning; code reads characters. For code these are two different texts.", ru: "Человек читает смысл, а код — символы. Для кода это два разных текста." }
          - text: { en: "Yes — code ignores spaces", ru: "Да — код не замечает пробелов" }
            why: { en: "Spaces inside quotes are part of the data, just like letters.", ru: "Пробелы внутри кавычек — часть данных, так же как буквы." }
        hints:
          - { en: "Compare the two texts letter by letter.", ru: "Сравни два текста буква за буквой." }
          - { en: "Look between \"Log\" and \"in\".", ru: "Посмотри, что стоит между «Log» и «in»." }
        explain:
          en: "`\"Log in\"` has 6 characters, `\"Login\"` has 5. For code they are different strings — like two different expected results in a test case."
          ru: "В `\"Log in\"` 6 символов, в `\"Login\"` — 5. Для кода это разные строки — как два разных ожидаемых результата в тест-кейсе."
      - id: c3-l1-p2
        kind: choice
        keyPoint: kp-variable
        prompt:
          en: "What will this code type into the Email field?"
          ru: "Что этот код введёт в поле Email?"
        code: |
          email = "anna@bloomly.app"
          page.get_by_label("Email").fill(email)
        options:
          - text: "anna@bloomly.app"
            correct: true
            why: { en: "`email` is a name; its value is the text in quotes on the first line.", ru: "`email` — это имя, а его значение — текст в кавычках в первой строке." }
          - text: "email"
            why: { en: "No quotes around `email` in `fill(email)` — so it's a name, not the word itself.", ru: "В `fill(email)` вокруг `email` нет кавычек — значит, это имя, а не само слово." }
          - text: 'email = "anna@bloomly.app"'
            why: { en: "That line only gives the text a name. It types nothing — typing is the job of `fill`.", ru: "Эта строка только даёт тексту имя. Сама она ничего не вводит — вводит `fill`." }
        optionsCode: true
        hints:
          - { en: "The first line gives a name to some text.", ru: "Первая строка даёт имя какому-то тексту." }
          - { en: "Which text is attached to the name `email`?", ru: "Какой текст привязан к имени `email`?" }
        explain:
          en: "Line 1 stores the text \"anna@bloomly.app\" under the name `email`. Line 2 uses the name, so the stored text is typed."
          ru: "Строка 1 сохраняет текст «anna@bloomly.app» под именем `email`. Строка 2 использует это имя — значит, вводится сохранённый текст."

  - type: theory
    keyPoint: kp-strings
    title: { en: "Text in quotes is exact data", ru: "Текст в кавычках — точные данные" }
    body:
      - en: "In a test case you write: Click \"Log in\". In [[code]] it looks almost the same: `\"Log in\"`. Anything inside quotes is a [[string]] — text that the code uses exactly as written."
        ru: "В тест-кейсе ты пишешь: Нажать «Log in». В [[коде|code]] это выглядит почти так же: `\"Log in\"`. Всё, что в кавычках, — это [[строка|string]]: текст, который код использует ровно так, как он записан."
      - en: "Exactly means exactly: `\"Log in\"`, `\"Login\"` and `\"log in\"` are three different strings. A space, a capital letter or a full stop changes the data — like a typo in the expected result of a test case."
        ru: "Ровно — значит ровно: `\"Log in\"`, `\"Login\"` и `\"log in\"` — три разные строки. Пробел, заглавная буква или точка меняют данные — как опечатка в ожидаемом результате тест-кейса."
      - en: "Python accepts double quotes `\"...\"` and single quotes `'...'` — they mean the same; most projects use double. Values without quotes are something else: `2` is a [[number]], `True` / `False` is a [[boolean]] (yes/no), and [[None|none]] means \"no value at all\"."
        ru: "Python понимает и двойные кавычки `\"...\"`, и одинарные `'...'` — разницы нет, в большинстве проектов пишут двойные. Значения без кавычек — другое: `2` — это [[число|number]], `True` / `False` — [[логическое значение|boolean]] (да/нет), а [[None|none]] значит «значения нет вообще»."
    code: |
      page.get_by_label("Email").fill("anna@bloomly.app")
      page.get_by_role("button", name="Log in").click()
      expect(page.get_by_role("heading", level=1)).to_have_text("Welcome back, Anna!")
    mentor:
      en: "Agents copy texts from the page — or guess them. Your check: every string the agent wrote must match the app character by character."
      ru: "Агенты копируют тексты со страницы — или угадывают их. Твоя проверка: каждая строка, которую написал агент, должна совпадать с приложением символ в символ."

  - type: theory
    keyPoint: kp-variable
    title: { en: "Variables: test data with a name", ru: "Переменные: тестовые данные с именем" }
    body:
      - en: "A test case has a Test data column: Email = anna@bloomly.app. In code the same idea is a [[variable]]: `email = \"anna@bloomly.app\"` — the name on the left, the value on the right. This `=` doesn't compare anything: it attaches the name to the value."
        ru: "В тест-кейсе есть колонка «Тестовые данные»: Email = anna@bloomly.app. В коде та же идея — [[переменная|variable]]: `email = \"anna@bloomly.app\"` — слева имя, справа значение. Этот `=` ничего не сравнивает: он привязывает имя к значению."
      - en: "Further down, the code uses the name instead of repeating the text. When you see `fill(email)` — no quotes! — look up: what value was given to `email`? That is what will be typed."
        ru: "Дальше код использует имя, а не повторяет текст. Видишь `fill(email)` — без кавычек! — посмотри выше: какое значение дали `email`? Именно оно и будет введено."
      - en: "A name can get a new value later — the last `=` above the line wins. Names in CAPITALS, like `PASSWORD = \"bloom123\"`, are a [[constant]] by team agreement: data shared by several tests, set once at the top of the file and never changed."
        ru: "Имени можно потом дать новое значение — действует последний `=` выше строки. Имена ЗАГЛАВНЫМИ, вроде `PASSWORD = \"bloom123\"`, — это [[константа|constant]] по договорённости команды: общие данные для нескольких тестов, их задают один раз в начале файла и больше не меняют."
    code: |
      def test_registered_user_can_log_in(page: Page):
          email = "anna@bloomly.app"
          password = "bloom123"

          page.goto("/login")
          page.get_by_label("Email").fill(email)
          page.get_by_label("Password").fill(password)

  - type: example
    keyPoint: kp-variable
    title: { en: "Where is the data in this test?", ru: "Где в этом тесте данные?" }
    intro:
      en: "A login test the way Petal writes it: test data first, then the steps. Read the notes line by line."
      ru: "Тест логина в стиле Petal: сначала тестовые данные, потом шаги. Читай заметки строка за строкой."
    code: |
      from playwright.sync_api import Page, expect


      def test_anna_can_log_in(page: Page):
          # Test data
          email = "anna@bloomly.app"
          password = "bloom123"

          page.goto("/login")
          page.get_by_label("Email").fill(email)
          page.get_by_label("Password").fill(password)
          page.get_by_role("button", name="Log in").click()
          expect(page.get_by_role("heading", level=1)).to_have_text("Welcome back, Anna!")
    notes:
      - lines: 5
        text:
          en: "`#` starts a [[comment]] — a note for humans. Python skips it."
          ru: "`#` начинает [[комментарий|comment]] — заметку для людей. Python её пропускает."
      - lines: [6, 7]
        text:
          en: "The test data: two variables at the top of the test. This is the \"Test data\" column of the test case."
          ru: "Тестовые данные: две переменные в начале теста. Это колонка «Тестовые данные» из тест-кейса."
      - lines: 10
        text:
          en: "`email` without quotes is a name. Look up to line 6: \"anna@bloomly.app\" will be typed."
          ru: "`email` без кавычек — это имя. Смотрим на строку 6: будет введено «anna@bloomly.app»."
      - lines: 12
        text:
          en: "\"Log in\" in quotes is the exact button text from the app."
          ru: "«Log in» в кавычках — точный текст кнопки из приложения."
      - lines: 13
        text:
          en: "The expected result. `to_have_text` compares the whole text exactly — every letter, comma and `!`."
          ru: "Ожидаемый результат. `to_have_text` сравнивает весь текст точно — каждую букву, запятую и `!`."
    runnable: true

  - type: task
    task:
      id: c3-l1-t1
      kind: choice
      keyPoint: kp-strings
      prompt:
        en: "Petal needs the exact text of the submit button on Bloomly's login page. Which string is exactly right?"
        ru: "Petal нужен точный текст кнопки отправки на странице логина Bloomly. Какая строка абсолютно верна?"
      context:
        en: "On the login page the heading, the nav link and the submit button all say: Log in"
        ru: "На странице логина заголовок, ссылка в меню и кнопка отправки подписаны одинаково: Log in"
      options:
        - text: '"Log in"'
          correct: true
          why: { en: "Same letters, same case, one space — a perfect copy.", ru: "Те же буквы, тот же регистр, один пробел — идеальная копия." }
        - text: '"Login"'
          why: { en: "The space is missing. This is a classic agent guess — many apps use \"Login\", Bloomly doesn't.", ru: "Пропал пробел. Классическая догадка агента: во многих приложениях «Login», но не в Bloomly." }
        - text: '"Log In"'
          why: { en: "Capital I. Some Playwright locators forgive letter case, but assertions and typed data don't — so always copy texts exactly.", ru: "Заглавная I. Некоторые локаторы Playwright прощают регистр, но проверки и вводимые данные — нет. Поэтому тексты всегда копируем точно." }
        - text: '"Log in "'
          why: { en: "There is an extra space at the end, inside the quotes. It's part of the string.", ru: "В конце, внутри кавычек, лишний пробел. Он — часть строки." }
      optionsCode: true
      hints:
        - { en: "Compare each option with \"Log in\" character by character.", ru: "Сравни каждый вариант с «Log in» посимвольно." }
        - { en: "Check three things: the space, the capital letters, the end of the string.", ru: "Проверь три вещи: пробел, заглавные буквы и конец строки." }
        - { en: "Only one option has a lowercase \"i\", one space in the middle and nothing after \"in\".", ru: "Только в одном варианте строчная «i», один пробел посередине и ничего после «in»." }
      praise:
        en: "Sharp eye! Character-by-character comparison is exactly how you review strings."
        ru: "Зоркий глаз! Посимвольное сравнение — именно так и проверяют строки на ревью."
      explain:
        en: "`\"Log in\"` matches the app exactly. The other three differ by one character each — the kind of difference you'd circle in red in someone's test case."
        ru: "`\"Log in\"` точно совпадает с приложением. Остальные три отличаются ровно на один символ — такое ты бы обв{ела|ёл} в чужом тест-кейсе красным."

  - type: task
    task:
      id: c3-l1-t2
      kind: match
      keyPoint: kp-variable
      prompt:
        en: "Petal put the test data at the top of the test. Match each call with the text it will actually type."
        ru: "Petal задал тестовые данные в начале теста. Сопоставь каждый вызов с текстом, который он на самом деле введёт."
      context:
        en: |
          Test data from the test:
          ```python
          email = "maya@bloomly.app"
          password = "qa-rocks"
          promo = "BLOOM10"
          ```
        ru: |
          Тестовые данные из теста:
          ```python
          email = "maya@bloomly.app"
          password = "qa-rocks"
          promo = "BLOOM10"
          ```
      pairs:
        - left: "fill(email)"
          right: "maya@bloomly.app"
        - left: "fill(password)"
          right: "qa-rocks"
        - left: "fill(promo)"
          right: "BLOOM10"
        - left: 'fill("email")'
          right: "email"
      leftCode: true
      rightCode: true
      hints:
        - { en: "A name without quotes → look up its value in the variables.", ru: "Имя без кавычек → ищи его значение среди переменных." }
        - { en: "One call has quotes around the word. What is inside quotes is typed as is.", ru: "В одном вызове слово в кавычках. Текст в кавычках вводится как есть." }
        - { en: '`fill("email")` types the five letters e-m-a-i-l.', ru: '`fill("email")` вводит пять букв: e-m-a-i-l.' }
      praise:
        en: 'You caught the quotes trap — `fill("email")` is a real mistake agents make after a refactoring.'
        ru: 'Ты замети{ла|л} ловушку с кавычками — `fill("email")` агенты правда пишут после рефакторинга.'
      explain:
        en: 'No quotes = a name, so the code types its value. Quotes = the text itself. `fill("email")` would type the word "email" and the login would fail.'
        ru: 'Без кавычек — это имя, и код вводит его значение. В кавычках — сам текст. `fill("email")` ввёл бы слово «email», и логин бы не прошёл.'

  - type: theory
    keyPoint: kp-fstring
    title: { en: "f-strings: text with gaps", ru: "f-строки: текст с пропусками" }
    body:
      - en: "Some texts depend on the data: Anna sees \"Welcome back, Anna!\", Tom sees \"Welcome back, Tom!\". Python builds such text with an [[f-string]] — a string with the letter `f` right before the opening quote: `f\"...\"`."
        ru: "Некоторые тексты зависят от данных: Анна видит «Welcome back, Anna!», Том — «Welcome back, Tom!». Такой текст Python собирает [[f-строкой|f-string]] — строкой с буквой `f` прямо перед открывающей кавычкой: `f\"...\"`."
      - en: "Inside it, `{name}` is a gap: the value of `name` goes there. To read it, replace the gap with the value in your head: `f\"Welcome back, {name}!\"` with `name = \"Tom\"` becomes `Welcome back, Tom!`."
        ru: "Внутри неё `{name}` — это пропуск: туда подставляется значение `name`. Чтобы прочитать такую строку, мысленно замени пропуск значением: `f\"Welcome back, {name}!\"` при `name = \"Tom\"` превращается в `Welcome back, Tom!`."
      - en: "Watch the `f`. Without it, the braces are just characters: `\"Welcome back, {name}!\"` stays exactly that, braces included. Agents drop the `f` now and then — and the test expects a text no page will ever show."
        ru: "Следи за `f`. Без неё фигурные скобки — просто символы: `\"Welcome back, {name}!\"` так и останется, вместе со скобками. Агенты иногда теряют `f` — и тест ждёт текст, которого не покажет ни одна страница."
    code: |
      name = "Tom"
      greeting = f"Welcome back, {name}!"
      # greeting is now: Welcome back, Tom!

      broken = "Welcome back, {name}!"
      # broken is now: Welcome back, {name}!
    mentor:
      en: "You know this from test cases: Expected: \"Welcome back, <first name>!\". An f-string is the same template — the code fills in the field from the data."
      ru: "Ты знаешь это по тест-кейсам: Ожидаемый результат: «Welcome back, <имя>!». f-строка — тот же шаблон, только поле заполняет код из данных."

  - type: task
    task:
      id: c3-l1-t3
      kind: input
      keyPoint: kp-fstring
      prompt:
        en: "What will this script print? Type the exact text."
        ru: "Что выведет этот скрипт? Напиши точный текст."
      code: |
        name = "Tom"
        count = 2
        print(f"{name} has {count} orders")
      answers: ["Tom has 2 orders"]
      caseSensitive: true
      run: script
      placeholder: "Printed text"
      hints:
        - { en: "Replace each `{...}` with the value of that name.", ru: "Замени каждый `{...}` значением этого имени." }
        - { en: "`{name}` becomes Tom, `{count}` becomes 2. Everything else stays as written.", ru: "`{name}` превращается в Tom, `{count}` — в 2. Всё остальное остаётся как написано." }
        - { en: "Tom has … orders", ru: "Tom has … orders" }
      praise:
        en: "Exactly. You read the f-string the way Python does."
        ru: "Точно. Ты прочита{ла|л} f-строку так же, как её читает Python."
      explain:
        en: '`print` shows a line of text in the output. The f-string takes the values of `name` and `count` and puts them into the gaps: "Tom has 2 orders". Note that `2` is a number — no quotes needed.'
        ru: "`print` выводит строку текста. f-строка берёт значения `name` и `count` и вставляет их в пропуски: «Tom has 2 orders». Заметь: `2` — число, кавычки не нужны."

  - type: task
    task:
      id: c3-l1-t4
      kind: fill
      keyPoint: kp-fstring
      prompt:
        en: "Complete the test data for Tom from the test case. The heading check uses an f-string."
        ru: "Заполни тестовые данные Тома по тест-кейсу. Проверка заголовка собрана f-строкой."
      testCase:
        id: TC-003
        title: Tom can log in
        preconditions: ["User tom@bloomly.app / tulips42 exists (Tom Becker, Berlin)"]
        steps:
          - { action: "Open the login page" }
          - { action: "Log in", data: "tom@bloomly.app / tulips42" }
          - { action: "Look at the account page heading", expected: "\"Welcome back, Tom!\"" }
      code: |
        from playwright.sync_api import Page, expect


        def test_tom_can_log_in(page: Page):
            email = "tom@bloomly.app"
            password = "___"
            first_name = "___"

            page.goto("/login")
            page.get_by_label("Email").fill(email)
            page.get_by_label("Password").fill(password)
            page.get_by_role("button", name="Log in").click()
            expect(page.get_by_role("heading", level=1)).to_have_text(f"Welcome back, {first_name}!")
      blanks:
        - { answers: [tulips42], options: [tulips42, Tulips42, bloom123] }
        - { answers: [Tom], options: [Tom, Becker, Tom Becker] }
      checks: { expect: pass }
      hints:
        - { en: "Both values are in the test case card — copy them exactly.", ru: "Оба значения есть в карточке тест-кейса — скопируй их точно." }
        - { en: "For the name: put it into the f-string and read the full heading. Does it match the expected result?", ru: "Для имени: подставь его в f-строку и прочитай заголовок целиком. Совпадает с ожидаемым результатом?" }
        - { en: "Password all lowercase; the greeting uses only the first name.", ru: "Пароль — только строчными; в приветствии только имя." }
      praise:
        en: "Green! You took the data straight from the test case — that's the habit that saves hours."
        ru: "Зелёный! Ты взя{ла|л} данные прямо из тест-кейса — эта привычка экономит часы."
      explain:
        en: "Tom's password is \"tulips42\" (lowercase t). With `first_name = \"Tom\"` the f-string gives \"Welcome back, Tom!\" — exactly the expected result. \"Tom Becker\" would produce \"Welcome back, Tom Becker!\" and fail."
        ru: "Пароль Тома — «tulips42» (со строчной t). С `first_name = \"Tom\"` f-строка даёт «Welcome back, Tom!» — ровно ожидаемый результат. С «Tom Becker» получилось бы «Welcome back, Tom Becker!», и тест бы упал."

  - type: task
    task:
      id: c3-l1-t5
      kind: review
      keyPoint: kp-strings
      prompt:
        en: "Review Petal's test for TC-001. Flag every line where the data or the expected text doesn't match the test case."
        ru: "Сделай ревью теста Petal для TC-001. Отметь каждую строку, где данные или ожидаемый текст не совпадают с тест-кейсом."
      context:
        en: "Petal: \"Login test for TC-001 is ready. I double-checked the data!\""
        ru: "Petal: «Тест логина для TC-001 готов. Данные я перепроверил!»"
      testCase:
        id: TC-001
        title: Registered user can log in
        preconditions: ["User anna@bloomly.app / bloom123 exists"]
        steps:
          - { action: "Open the login page" }
          - { action: "Enter email and password", data: "anna@bloomly.app / bloom123" }
          - { action: "Click \"Log in\"", expected: "Account page shows \"Welcome back, Anna!\"" }
      code: |
        from playwright.sync_api import Page, expect


        def test_registered_user_can_log_in(page: Page):
            email = "anna@bloomly.app"
            password = "Bloom123"

            page.goto("/login")
            page.get_by_label("Email").fill(email)
            page.get_by_label("Password").fill(password)
            page.get_by_role("button", name="Log in").click()
            expect(page.get_by_role("heading", level=1)).to_have_text("Welcome Back, Anna!")
      issues:
        - line: 6
          type: wrong-data
          note:
            en: "The password is \"bloom123\" with a lowercase b. Passwords are case-sensitive: this test can't log in."
            ru: "Пароль — «bloom123» со строчной b. Пароли чувствительны к регистру: с таким тест не войдёт."
        - line: 12
          type: wrong-assertion
          note:
            en: 'The app says "Welcome back, Anna!" — lowercase b in "back". `to_have_text` compares exactly, so this check fails even when login works.'
            ru: "В приложении «Welcome back, Anna!» — «back» со строчной b. `to_have_text` сравнивает точно, так что проверка упадёт, даже когда логин работает."
      types: [wrong-data, wrong-assertion, fragile-locator, not-called, no-assertion]
      hints:
        - { en: "Compare every string in quotes with the test case card. Two of them are off by one letter.", ru: "Сравни каждую строку в кавычках с карточкой тест-кейса. Две отличаются на одну букву." }
        - { en: "Look at the variables at the top of the test and at the expected text in the last step.", ru: "Посмотри на переменные в начале теста и на ожидаемый текст в последнем шаге." }
        - { en: "Line 6: compare the first letter of the password. Line 12: compare the word \"back\".", ru: "Строка 6: сравни первую букву пароля. Строка 12: сравни слово «back»." }
      praise:
        en: "Two one-letter bugs, both found. That's a review Petal can learn from."
        ru: "Два бага в одну букву — оба найдены. На таком ревью Petal может учиться."
      explain:
        en: "Note where you flagged the data bug: on line 6, where the variable gets its value — not on line 10, where it's used. Fix it once at the source, and every line that uses `password` is fixed."
        ru: "Обрати внимание, где ты отмечаешь ошибку в данных: в строке 6, где переменная получает значение, а не в строке 10, где она используется. Исправишь в источнике — исправится каждая строка, где есть `password`."

  - type: task
    task:
      id: c3-l1-t6
      kind: predict
      keyPoint: kp-fstring
      prompt:
        en: "Will this test pass or fail? Build the expected heading in your head first — read the last line slowly."
        ru: "Этот тест пройдёт или упадёт? Сначала мысленно собери ожидаемый заголовок — прочитай последнюю строку медленно."
      code: |
        from playwright.sync_api import Page, expect


        def test_tom_sees_his_greeting(page: Page):
            email = "tom@bloomly.app"
            password = "tulips42"
            name = "Tom"

            page.goto("/login")
            page.get_by_label("Email").fill(email)
            page.get_by_label("Password").fill(password)
            page.get_by_role("button", name="Log in").click()
            expect(page.get_by_role("heading", level=1)).to_have_text("Welcome back, {name}!")
      outcome: fail
      reasons:
        - text:
            en: "There's no `f` before the quotes, so the test expects the literal text \"Welcome back, {name}!\""
            ru: "Перед кавычками нет `f`, поэтому тест ждёт буквально текст «Welcome back, {name}!»"
          correct: true
        - text:
            en: "Tom's password is wrong"
            ru: "У Тома неверный пароль"
          why: { en: "\"tulips42\" is exactly Tom's password.", ru: "«tulips42» — ровно пароль Тома." }
        - text:
            en: "It passes: `{name}` becomes Tom"
            ru: "Пройдёт: `{name}` превратится в Tom"
          why: { en: "Only inside an f-string. Without the `f`, the braces and the word \"name\" are ordinary characters.", ru: "Только внутри f-строки. Без `f` скобки и слово «name» — обычные символы." }
      hints:
        - { en: "Look at what stands right before the opening quote in the last line.", ru: "Посмотри, что стоит прямо перед открывающей кавычкой в последней строке." }
        - { en: "No `f` — no gaps. Which text does the test expect, character by character?", ru: "Нет `f` — нет пропусков. Какой текст ждёт тест, символ за символом?" }
      praise:
        en: "Right — one missing letter turns a correct check into one that can never pass."
        ru: "Верно — одна потерянная буква превращает правильную проверку в ту, что не пройдёт никогда."
      explain:
        en: "Login works, but without the `f` the braces stay in the text: the test expects \"Welcome back, {name}!\" while the app shows \"Welcome back, Tom!\". The report says it plainly: `Locator expected to have text 'Welcome back, {name}!'`, `Actual value: Welcome back, Tom!`. The fix is one letter — but only if someone reads the string."
        ru: "Логин проходит, но без `f` скобки остаются в тексте: тест ждёт «Welcome back, {name}!», а приложение показывает «Welcome back, Tom!». В отчёте это видно сразу: `Locator expected to have text 'Welcome back, {name}!'`, `Actual value: Welcome back, Tom!`. Исправление — одна буква, но только если кто-то прочитает строку."

  - type: task
    task:
      id: c3-l1-t7
      kind: vocab
      mode: cloze
      sentence:
        en: "Petal stored the email in a ___ at the top of the test, so every step reuses it."
        ru: "Petal сохранил email в переменной в начале теста, чтобы каждый шаг её переиспользовал."
      answer: variable
      options: [variable, comment, boolean]

  - type: mistakes
    title: { en: "Typical string mistakes (agents make them too)", ru: "Типичные ошибки со строками (агенты тоже их делают)" }
    items:
      - wrong: 'page.get_by_label("Email").fill("email")'
        right: 'page.get_by_label("Email").fill(email)'
        why:
          en: "Quotes turn the name into the literal word: the test types \"email\" instead of the address."
          ru: "Кавычки превращают имя в само слово: тест вводит «email» вместо адреса."
      - wrong: 'expect(heading).to_have_text("Welcome back, {name}!")'
        right: 'expect(heading).to_have_text(f"Welcome back, {name}!")'
        why:
          en: "No `f` — no gaps. The test expects the text \"{name}\" literally and fails even when the page is right."
          ru: "Нет `f` — нет пропусков. Тест ждёт буквально текст «{name}» и падает, даже когда страница в порядке."
      - wrong: 'expect(heading).to_have_text(f"Welcome back, ${name}!")'
        right: 'expect(heading).to_have_text(f"Welcome back, {name}!")'
        why:
          en: "`${name}` is JavaScript syntax. In a Python f-string the `$` stays in the text: \"Welcome back, $Tom!\". Agents that also write JavaScript slip into this."
          ru: "`${name}` — синтаксис JavaScript. В f-строке Python знак `$` остаётся в тексте: «Welcome back, $Tom!». Агенты, которые пишут и на JavaScript, легко на этом спотыкаются."
      - wrong: 'password = "bloom123 "'
        right: 'password = "bloom123"'
        why:
          en: "A trailing space inside the quotes is part of the password. The login fails, and the space is invisible in the report."
          ru: "Пробел в конце внутри кавычек — часть пароля. Логин не проходит, а в отчёте пробел не видно."

  - type: explain
    keyPoint: kp-variable
    prompt:
      en: "In your own words: how do you find out what a test will type into the Email field?"
      ru: "Своими словами: как узнать, что тест введёт в поле Email?"
    model:
      en: "I find the line with `get_by_label(\"Email\").fill(...)` and look inside the brackets. If there's text in quotes, that exact text is typed. If there's a name without quotes, like `email`, I look up to the line where `email = ...` gets its value — the last one above. Then I compare that value with the test case data, character by character."
      ru: "Я нахожу строку с `get_by_label(\"Email\").fill(...)` и смотрю, что в скобках. Если там текст в кавычках — вводится ровно он. Если имя без кавычек, например `email`, я ищу выше строку, где `email = ...` получает значение, — последнюю такую. Потом сравниваю это значение с данными тест-кейса посимвольно."

  - type: phrases
    items:
      - context: code-review
        en: "The expected text doesn't match the app: it's \"Welcome back, Anna!\" with a lowercase b."
        ru: "Ожидаемый текст не совпадает с приложением: там «Welcome back, Anna!» со строчной b."
      - context: code-review
        en: "This string is missing the f prefix, so the name never gets filled in."
        ru: "У этой строки нет префикса f, поэтому имя так и не подставляется."
      - context: code-review
        en: "Could we move the test data into variables at the top of the test?"
        ru: "Можем вынести тестовые данные в переменные в начало теста?"
        note:
          en: "\"Could we…?\" sounds softer than \"Move it\" — standard tone in code review."
          ru: "«Could we…?» звучит мягче, чем «Move it», — обычный тон для код-ревью."
      - context: chat
        en: "Quick question: where does this test get the password from?"
        ru: "Быстрый вопрос: откуда этот тест берёт пароль?"
      - context: prompt
        en: "Use the exact texts from the page. Don't guess labels or button names."
        ru: "Используй точные тексты со страницы. Не угадывай подписи полей и названия кнопок."
      - context: standup
        en: "I reviewed Petal's login tests yesterday: two had wrong test data, I left comments."
        ru: "Вчера я посмотре{ла|л} тесты логина от Petal: в двух неверные тестовые данные, я оставил{а|} комментарии."

checkPool:
  - id: c3-l1-k1
    kind: choice
    keyPoint: kp-strings
    placement: true
    prompt:
      en: "Bloomly's account heading is \"Welcome back, Anna!\". Which expected text will make `to_have_text` pass?"
      ru: "Заголовок аккаунта в Bloomly — «Welcome back, Anna!». С каким ожидаемым текстом `to_have_text` пройдёт?"
    options:
      - text: '"Welcome back, Anna!"'
        correct: true
        why: { en: "Identical, character by character.", ru: "Совпадает посимвольно." }
      - text: '"Welcome Back, Anna!"'
        why: { en: "Capital B. `to_have_text` is case-sensitive.", ru: "Заглавная B. `to_have_text` учитывает регистр." }
      - text: '"Welcome back Anna!"'
        why: { en: "The comma is missing.", ru: "Пропала запятая." }
      - text: '"Welcome back, Anna"'
        why: { en: "The `!` is missing. `to_have_text` compares the whole text.", ru: "Пропал `!`. `to_have_text` сравнивает текст целиком." }
    optionsCode: true
    hints:
      - { en: "Compare letters, case and punctuation.", ru: "Сравни буквы, регистр и знаки препинания." }
      - { en: "Three options each lose or change exactly one character.", ru: "В трёх вариантах ровно один символ потерян или изменён." }
    explain:
      en: "`to_have_text` with a string checks the whole text exactly. Only an identical copy passes."
      ru: "`to_have_text` со строкой проверяет весь текст точно. Проходит только идентичная копия."

  - id: c3-l1-k2
    kind: input
    keyPoint: kp-variable
    prompt:
      en: "Petal wrote this. What will be typed into the Email field?"
      ru: "Это написал Petal. Что будет введено в поле Email?"
    code: |
      user = "maya@bloomly.app"
      secret = "qa-rocks"

      page.get_by_label("Email").fill(secret)
      page.get_by_label("Password").fill(user)
    answers: ["qa-rocks"]
    hints:
      - { en: "Look only at the Email line. Which name is inside `fill(...)`?", ru: "Смотри только на строку с Email. Какое имя внутри `fill(...)`?" }
      - { en: "Now find the value of that name at the top.", ru: "Теперь найди значение этого имени наверху." }
      - { en: "`fill(secret)` → the value of `secret`.", ru: "`fill(secret)` → значение `secret`." }
    praise:
      en: "Well spotted — the names are swapped, and only careful reading shows it."
      ru: "Отлично замечено — имена перепутаны, и видно это только при внимательном чтении."
    explain:
      en: "The Email field gets `secret`, which is \"qa-rocks\". The data is right, but it's sent to the wrong fields — the test will fail with \"Please enter a valid email address.\""
      ru: "В поле Email уходит `secret`, то есть «qa-rocks». Данные верные, но попали не в те поля — тест упадёт с «Please enter a valid email address.»"

  - id: c3-l1-k3
    kind: review
    keyPoint: kp-variable
    prompt:
      en: "Review Petal's sign-up test against the test case. Flag the data and the expected text that are wrong."
      ru: "Сделай ревью теста регистрации от Petal по тест-кейсу. Отметь неверные данные и неверный ожидаемый текст."
    testCase:
      id: TC-021
      title: New customer can create an account
      preconditions: ["Bloomly passwords need at least 8 characters"]
      steps:
        - { action: "Open the sign-up page" }
        - { action: "Fill in name, email, password, country", data: "Lena Novak / lena@bloomly.app / tulips2026 / Poland" }
        - { action: "Accept the terms and click \"Create account\"", expected: "\"Account created!\" and \"Welcome to Bloomly, Lena.\"" }
    code: |
      from playwright.sync_api import Page, expect


      def test_new_customer_can_create_an_account(page: Page):
          full_name = "Lena Novak"
          email = "lena@bloomly.app"
          password = "tulip"
          page.goto("/signup")
          page.get_by_label("Full name").fill(full_name)
          page.get_by_label("Email").fill(email)
          page.get_by_label("Password").fill(password)
          page.get_by_label("Country").select_option("Poland")
          page.get_by_label("I agree to the Terms of Service").check()
          page.get_by_role("button", name="Create account").click()
          expect(page.get_by_test_id("signup-success")).to_contain_text(f"Welcome to Bloomly, {full_name}.")
    issues:
      - line: 7
        type: wrong-data
        note:
          en: "\"tulip\" has 5 characters; Bloomly needs at least 8. A positive test needs valid data: \"tulips2026\" from the case."
          ru: "В «tulip» 5 символов, а Bloomly нужно минимум 8. Позитивному тесту нужны валидные данные: «tulips2026» из кейса."
      - line: 15
        type: wrong-assertion
        note:
          en: "The f-string builds \"Welcome to Bloomly, Lena Novak.\" but the app greets by first name only: \"Welcome to Bloomly, Lena.\""
          ru: "f-строка собирает «Welcome to Bloomly, Lena Novak.», а приложение приветствует только по имени: «Welcome to Bloomly, Lena.»"
    types: [wrong-data, wrong-assertion, fragile-locator, not-called, hard-wait]
    hints:
      - { en: "Check each variable against the test case data and the precondition.", ru: "Сверь каждую переменную с данными и предусловием тест-кейса." }
      - { en: "Build the text in the last `expect` in your head. Is it the same as the expected result?", ru: "Мысленно собери текст в последнем `expect`. Он совпадает с ожидаемым результатом?" }
      - { en: "Line 7: count the characters. Line 15: which name goes into the f-string?", ru: "Строка 7: посчитай символы. Строка 15: какое имя попадает в f-строку?" }
    explain:
      en: "Data bugs hide in variables, expected-text bugs hide in f-strings. Read both: the variable's value, then the text the f-string builds from it."
      ru: "Ошибки в данных прячутся в переменных, ошибки в ожидаемом тексте — в f-строках. Читай и то, и другое: значение переменной и текст, который из неё собирает f-строка."

  - id: c3-l1-k4
    kind: predict
    keyPoint: kp-fstring
    prompt:
      en: "Will this test pass or fail?"
      ru: "Этот тест пройдёт или упадёт?"
    context:
      en: "After \"Add to cart\", Bloomly shows a toast like \"Rose Bouquet added to cart\"."
      ru: "После «Add to cart» Bloomly показывает всплывающее сообщение вида «Rose Bouquet added to cart»."
    code: |
      from playwright.sync_api import Page, expect


      def test_toast_names_the_added_product(page: Page):
          product = "Sunny Tulips"

          page.goto("/shop")
          card = page.get_by_test_id("product-card").filter(has_text=product)
          card.get_by_role("button", name="Add to cart").click()
          expect(page.get_by_role("status")).to_have_text(f"{product} added to cart")
    outcome: pass
    reasons:
      - text:
          en: "The f-string builds \"Sunny Tulips added to cart\" — exactly the toast text"
          ru: "f-строка собирает «Sunny Tulips added to cart» — ровно текст сообщения"
        correct: true
      - text:
          en: "It fails: `product` can't be used twice"
          ru: "Упадёт: `product` нельзя использовать дважды"
        why: { en: "Reusing a variable is the whole point of having one.", ru: "Переиспользовать переменную — ровно то, зачем она нужна." }
      - text:
          en: "It fails: the toast says \"Sunny Tulips added to Cart\""
          ru: "Упадёт: в сообщении «Sunny Tulips added to Cart»"
        why: { en: "Bloomly's toast uses a lowercase \"cart\".", ru: "В сообщении Bloomly «cart» со строчной." }
    hints:
      - { en: "Put the value of `product` into the f-string.", ru: "Подставь значение `product` в f-строку." }
      - { en: "Compare the result with the toast format from the context.", ru: "Сравни результат с форматом сообщения из контекста." }
    explain:
      en: '`product` is used twice: to find the right card and to build the expected toast. The text comes out as "Sunny Tulips added to cart" — a match, so the test passes. (`card` is a variable too: a name for the card locator.)'
      ru: "`product` используется дважды: чтобы найти нужную карточку и чтобы собрать ожидаемое сообщение. Получается «Sunny Tulips added to cart» — совпадение, тест проходит. (`card` — тоже переменная: имя для локатора карточки.)"

