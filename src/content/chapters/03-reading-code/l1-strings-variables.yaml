id: c3-l1
chapter: c3
title: { en: "Data in code: strings and variables", ru: "Данные в коде: строки и переменные" }
goal:
  en: "Find the test data in a test and read exactly what will be typed or checked."
  ru: "Находить тестовые данные в тесте и точно читать, что будет введено или проверено."
minutes: 8
keyPoints:
  - id: kp-strings
    title: { en: "Text in quotes is exact data", ru: "Текст в кавычках — точные данные" }
  - id: kp-const
    title: { en: "const gives test data a name", ru: "const даёт тестовым данным имя" }
  - id: kp-template
    title: { en: "Template literals put data into text", ru: "Шаблонные строки подставляют данные в текст" }
terms: [code, string, number, boolean, constant, variable, comment, console, test-data]

steps:
  - type: story
    lines:
      - who: maya
        text:
          en: "Petal's overnight PR has 30 tests. Before we approve anything, let's find where the test data lives."
          ru: "В ночном PR от Petal 30 тестов. Прежде чем что-то одобрять, давай найдём, где в них живут тестовые данные."
      - who: petal
        text:
          en: "The data is perfect. I copied every email and every text very carefully. Probably."
          ru: "Данные идеальны. Я очень аккуратно скопировал все email и тексты. Наверное."
      - who: maya
        text:
          en: "\"Probably\" is our job. In code, one wrong letter in a string means a red test — or a test that checks the wrong thing."
          ru: "«Наверное» — это как раз наша работа. В коде одна неверная буква в строке — это красный тест или тест, который проверяет не то."

  - type: pretest
    intro:
      en: "Quick guess before we start. Wrong answers are fine — they help you remember."
      ru: "Быстрая догадка перед началом. Ошибаться можно — так лучше запоминается."
    items:
      - id: c3-l1-p1
        kind: choice
        keyPoint: kp-strings
        prompt:
          en: "For the code, are `'Log in'` and `'Login'` the same text?"
          ru: "Для кода `'Log in'` и `'Login'` — это один и тот же текст?"
        options:
          - text: { en: "No — one has a space, so they are different strings", ru: "Нет — в одном есть пробел, значит, это разные строки" }
            correct: true
            why: { en: "Code compares text character by character, and a space is a character.", ru: "Код сравнивает текст посимвольно, а пробел — тоже символ." }
          - text: { en: "Yes — they mean the same thing", ru: "Да — смысл же одинаковый" }
            why: { en: "A human reads meaning; code reads characters. For code these are two different texts.", ru: "Человек читает смысл, а код — символы. Для кода это два разных текста." }
          - text: { en: "Yes — code ignores spaces", ru: "Да — код не замечает пробелов" }
            why: { en: "Spaces inside quotes are part of the data, just like letters.", ru: "Пробелы внутри кавычек — часть данных, так же как буквы." }
        hints:
          - { en: "Compare the two texts letter by letter.", ru: "Сравни два текста буква за буквой." }
          - { en: "Look between \"Log\" and \"in\".", ru: "Посмотри, что стоит между «Log» и «in»." }
        explain:
          en: "`'Log in'` has 6 characters, `'Login'` has 5. For code they are different strings — like two different expected results in a test case."
          ru: "В `'Log in'` 6 символов, в `'Login'` — 5. Для кода это разные строки — как два разных ожидаемых результата в тест-кейсе."
      - id: c3-l1-p2
        kind: choice
        keyPoint: kp-const
        prompt:
          en: "What will this code type into the Email field?"
          ru: "Что этот код введёт в поле Email?"
        code: |
          const email = 'anna@bloomly.app';
          await page.getByLabel('Email').fill(email);
        options:
          - text: "anna@bloomly.app"
            correct: true
            why: { en: "`email` is a name; its value is the text in quotes on the first line.", ru: "`email` — это имя, а его значение — текст в кавычках в первой строке." }
          - text: "email"
            why: { en: "No quotes around `email` in `fill(email)` — so it's a name, not the word itself.", ru: "В `fill(email)` вокруг `email` нет кавычек — значит, это имя, а не само слово." }
          - text: "const email"
            why: { en: "`const` only creates the name. It is never typed anywhere.", ru: "`const` только создаёт имя. Его никуда не вводят." }
        optionsCode: true
        hints:
          - { en: "The first line gives a name to some text.", ru: "Первая строка даёт имя какому-то тексту." }
          - { en: "Which text is attached to the name `email`?", ru: "Какой текст привязан к имени `email`?" }
        explain:
          en: "Line 1 stores the text 'anna@bloomly.app' under the name `email`. Line 2 uses the name, so the stored text is typed."
          ru: "Строка 1 сохраняет текст 'anna@bloomly.app' под именем `email`. Строка 2 использует это имя — значит, вводится сохранённый текст."

  - type: theory
    keyPoint: kp-strings
    title: { en: "Text in quotes is exact data", ru: "Текст в кавычках — точные данные" }
    body:
      - en: "In a test case you write: Click \"Log in\". In [[code]] it looks almost the same: `'Log in'`. Anything inside quotes is a [[string]] — text that the code uses exactly as written."
        ru: "В тест-кейсе ты пишешь: Нажать «Log in». В [[коде|code]] это выглядит почти так же: `'Log in'`. Всё, что в кавычках, — это [[строка|string]]: текст, который код использует ровно так, как он записан."
      - en: "Exactly means exactly: `'Log in'`, `'Login'` and `'log in'` are three different strings. A space, a capital letter or a full stop changes the data — like a typo in the expected result of a test case."
        ru: "Ровно — значит ровно: `'Log in'`, `'Login'` и `'log in'` — три разные строки. Пробел, заглавная буква или точка меняют данные — как опечатка в ожидаемом результате тест-кейса."
      - en: "Single quotes `'...'`, double quotes `\"...\"` and backticks `` `...` `` all make strings. Values without quotes are something else: `2` is a [[number]], `true` / `false` is a [[boolean]] (yes/no)."
        ru: "Одинарные кавычки `'...'`, двойные `\"...\"` и обратные `` `...` `` — всё это строки. Значения без кавычек — другое: `2` — это [[число|number]], `true` / `false` — [[логическое значение|boolean]] (да/нет)."
    code: |
      await page.getByLabel('Email').fill('anna@bloomly.app');
      await page.getByRole('button', { name: 'Log in' }).click();
      await expect(page.getByRole('heading', { level: 1 })).toHaveText('Welcome back, Anna!');
    mentor:
      en: "Agents copy texts from the page — or guess them. Your check: every string the agent wrote must match the app character by character."
      ru: "Агенты копируют тексты со страницы — или угадывают их. Твоя проверка: каждая строка, которую написал агент, должна совпадать с приложением символ в символ."

  - type: theory
    keyPoint: kp-const
    title: { en: "const = named test data", ru: "const — тестовые данные с именем" }
    body:
      - en: "A test case has a Test data column: Email = anna@bloomly.app. In code the same idea is a [[constant]]: `const email = 'anna@bloomly.app';` — the name on the left, the value on the right."
        ru: "В тест-кейсе есть колонка «Тестовые данные»: Email = anna@bloomly.app. В коде та же идея — [[константа|constant]]: `const email = 'anna@bloomly.app';` — слева имя, справа значение."
      - en: "Further down, the code uses the name instead of repeating the text. When you see `fill(email)` — no quotes! — look up: what value was given to `email`? That is what will be typed."
        ru: "Дальше код использует имя, а не повторяет текст. Видишь `fill(email)` — без кавычек! — посмотри выше: какое значение дали `email`? Именно оно и будет введено."
      - en: "`let` creates a [[variable]] whose value can change later. In tests you'll mostly see `const`: the data is set once and stays."
        ru: "`let` создаёт [[переменную|variable]], значение которой потом можно поменять. В тестах чаще встречается `const`: данные задали один раз, и они не меняются."
    code: |
      const email = 'anna@bloomly.app';
      const password = 'bloom123';

      await page.getByLabel('Email').fill(email);
      await page.getByLabel('Password').fill(password);

  - type: example
    keyPoint: kp-const
    title: { en: "Where is the data in this test?", ru: "Где в этом тесте данные?" }
    intro:
      en: "A login test the way Petal writes it: test data first, then the steps. Read the notes line by line."
      ru: "Тест логина в стиле Petal: сначала тестовые данные, потом шаги. Читай заметки строка за строкой."
    code: |
      import { test, expect } from '@playwright/test';

      // Test data
      const email = 'anna@bloomly.app';
      const password = 'bloom123';

      test('Anna can log in', async ({ page }) => {
        await page.goto('/login');
        await page.getByLabel('Email').fill(email);
        await page.getByLabel('Password').fill(password);
        await page.getByRole('button', { name: 'Log in' }).click();
        await expect(page.getByRole('heading', { level: 1 })).toHaveText('Welcome back, Anna!');
      });
    notes:
      - lines: 3
        text:
          en: "`//` starts a [[comment]] — a note for humans. The computer skips it."
          ru: "`//` начинает [[комментарий|comment]] — заметку для людей. Компьютер её пропускает."
      - lines: [4, 5]
        text:
          en: "The test data: two constants. This is the \"Test data\" column of the test case."
          ru: "Тестовые данные: две константы. Это колонка «Тестовые данные» из тест-кейса."
      - lines: 9
        text:
          en: "`email` without quotes is a name. Look up to line 4: 'anna@bloomly.app' will be typed."
          ru: "`email` без кавычек — это имя. Смотрим на строку 4: будет введено 'anna@bloomly.app'."
      - lines: 11
        text:
          en: "'Log in' in quotes is the exact button text from the app."
          ru: "'Log in' в кавычках — точный текст кнопки из приложения."
      - lines: 12
        text:
          en: "The expected result. `toHaveText` compares the whole text exactly — every letter, comma and `!`."
          ru: "Ожидаемый результат. `toHaveText` сравнивает весь текст точно — каждую букву, запятую и `!`."
    runnable: true

  - type: task
    task:
      id: c3-l1-t1
      kind: choice
      keyPoint: kp-strings
      prompt:
        en: "Petal needs the exact text of the submit button on Bloomly's login page. Which string is exactly right?"
        ru: "Petal нужен точный текст кнопки отправки на странице логина Bloomly. Какая строка абсолютно верна?"
      context:
        en: "On the login page the heading, the nav link and the submit button all say: Log in"
        ru: "На странице логина заголовок, ссылка в меню и кнопка отправки подписаны одинаково: Log in"
      options:
        - text: "'Log in'"
          correct: true
          why: { en: "Same letters, same case, one space — a perfect copy.", ru: "Те же буквы, тот же регистр, один пробел — идеальная копия." }
        - text: "'Login'"
          why: { en: "The space is missing. This is a classic agent guess — many apps use \"Login\", Bloomly doesn't.", ru: "Пропал пробел. Классическая догадка агента: во многих приложениях «Login», но не в Bloomly." }
        - text: "'Log In'"
          why: { en: "Capital I. Some Playwright locators forgive letter case, but assertions and typed data don't — so always copy texts exactly.", ru: "Заглавная I. Некоторые локаторы Playwright прощают регистр, но проверки и вводимые данные — нет. Поэтому тексты всегда копируем точно." }
        - text: "'Log in '"
          why: { en: "There is an extra space at the end, inside the quotes. It's part of the string.", ru: "В конце, внутри кавычек, лишний пробел. Он — часть строки." }
      optionsCode: true
      hints:
        - { en: "Compare each option with \"Log in\" character by character.", ru: "Сравни каждый вариант с «Log in» посимвольно." }
        - { en: "Check three things: the space, the capital letters, the end of the string.", ru: "Проверь три вещи: пробел, заглавные буквы и конец строки." }
        - { en: "Only one option has a lowercase \"i\", one space in the middle and nothing after \"in\".", ru: "Только в одном варианте строчная «i», один пробел посередине и ничего после «in»." }
      praise:
        en: "Sharp eye! Character-by-character comparison is exactly how you review strings."
        ru: "Зоркий глаз! Посимвольное сравнение — именно так и проверяют строки на ревью."
      explain:
        en: "`'Log in'` matches the app exactly. The other three differ by one character each — the kind of difference you'd circle in red in someone's test case."
        ru: "`'Log in'` точно совпадает с приложением. Остальные три отличаются ровно на один символ — такое ты бы обв{ела|ёл} в чужом тест-кейсе красным."

  - type: task
    task:
      id: c3-l1-t2
      kind: match
      keyPoint: kp-const
      prompt:
        en: "Petal declared the test data at the top of the file. Match each line with the text it will actually type."
        ru: "Petal объявил тестовые данные в начале файла. Сопоставь каждую строку с текстом, который она на самом деле введёт."
      context:
        en: |
          ```js
          const email = 'maya@bloomly.app';
          const password = 'qa-rocks';
          const promo = 'BLOOM10';
          ```
        ru: |
          Тестовые данные из файла:
          ```js
          const email = 'maya@bloomly.app';
          const password = 'qa-rocks';
          const promo = 'BLOOM10';
          ```
      pairs:
        - left: "fill(email)"
          right: "maya@bloomly.app"
        - left: "fill(password)"
          right: "qa-rocks"
        - left: "fill(promo)"
          right: "BLOOM10"
        - left: "fill('email')"
          right: "email"
      leftCode: true
      rightCode: true
      hints:
        - { en: "A name without quotes → look up its value in the constants.", ru: "Имя без кавычек → ищи его значение среди констант." }
        - { en: "One line has quotes around the word. What is inside quotes is typed as is.", ru: "В одной строке слово в кавычках. Текст в кавычках вводится как есть." }
        - { en: "`fill('email')` types the five letters e-m-a-i-l.", ru: "`fill('email')` вводит пять букв: e-m-a-i-l." }
      praise:
        en: "You caught the quotes trap — `fill('email')` is a real mistake agents make after a refactoring."
        ru: "Ты замети{ла|л} ловушку с кавычками — `fill('email')` агенты правда пишут после рефакторинга."
      explain:
        en: "No quotes = a name, so the code types its value. Quotes = the text itself. `fill('email')` would type the word \"email\" and the login would fail."
        ru: "Без кавычек — это имя, и код вводит его значение. В кавычках — сам текст. `fill('email')` ввёл бы слово «email», и логин бы не прошёл."

  - type: theory
    keyPoint: kp-template
    title: { en: "Template literals: text with gaps", ru: "Шаблонные строки: текст с пропусками" }
    body:
      - en: "Some texts depend on the data: Anna sees \"Welcome back, Anna!\", Tom sees \"Welcome back, Tom!\". Code builds such text with a template literal — a string in backticks `` `...` ``."
        ru: "Некоторые тексты зависят от данных: Анна видит «Welcome back, Anna!», Том — «Welcome back, Tom!». Такой текст код собирает шаблонной строкой — строкой в обратных кавычках `` `...` ``."
      - en: "Inside it, `${name}` is a gap: the value of `name` goes there. To read it, replace the gap with the value in your head."
        ru: "Внутри неё `${name}` — это пропуск: туда подставляется значение `name`. Чтобы прочитать такую строку, мысленно замени пропуск значением."
      - en: "So `` `Welcome back, ${name}!` `` with `name = 'Tom'` becomes `Welcome back, Tom!`. Then check the result against the app's real text — commas, spaces and `!` included."
        ru: "Так `` `Welcome back, ${name}!` `` при `name = 'Tom'` превращается в `Welcome back, Tom!`. А потом сверь результат с реальным текстом приложения — с запятыми, пробелами и `!`."
    code: |
      const name = 'Tom';
      const greeting = `Welcome back, ${name}!`;
      // greeting is now: Welcome back, Tom!
    mentor:
      en: "You know this from test cases: Expected: \"Welcome back, <first name>!\". A template literal is the same template — the code fills in the field from the data."
      ru: "Ты знаешь это по тест-кейсам: Ожидаемый результат: «Welcome back, <имя>!». Шаблонная строка — тот же шаблон, только поле заполняет код из данных."

  - type: task
    task:
      id: c3-l1-t3
      kind: input
      keyPoint: kp-template
      prompt:
        en: "What will this script print? Type the exact text."
        ru: "Что выведет этот скрипт? Напиши точный текст."
      code: |
        const name = 'Tom';
        const count = 2;
        console.log(`${name} has ${count} orders`);
      answers: ["Tom has 2 orders"]
      caseSensitive: true
      run: script
      placeholder: "Printed text"
      hints:
        - { en: "Replace each `${...}` with the value of that name.", ru: "Замени каждый `${...}` значением этого имени." }
        - { en: "`${name}` becomes Tom, `${count}` becomes 2. Everything else stays as written.", ru: "`${name}` превращается в Tom, `${count}` — в 2. Всё остальное остаётся как написано." }
        - { en: "Tom has … orders", ru: "Tom has … orders" }
      praise:
        en: "Exactly. You read the template the way the computer does."
        ru: "Точно. Ты прочита{ла|л} шаблон так же, как его читает компьютер."
      explain:
        en: "`console.log` prints a message to the [[console]]. The template takes the values of `name` and `count` and puts them into the gaps: \"Tom has 2 orders\". Note that `2` is a number — no quotes needed."
        ru: "`console.log` выводит сообщение в [[консоль|console]]. Шаблон берёт значения `name` и `count` и вставляет их в пропуски: «Tom has 2 orders». Заметь: `2` — число, кавычки не нужны."

  - type: task
    task:
      id: c3-l1-t4
      kind: fill
      keyPoint: kp-template
      prompt:
        en: "Complete the test data for Tom from the test case. The heading check uses a template literal."
        ru: "Заполни тестовые данные Тома по тест-кейсу. Проверка заголовка собрана шаблонной строкой."
      testCase:
        id: TC-003
        title: Tom can log in
        preconditions: ["User tom@bloomly.app / tulips42 exists (Tom Becker, Berlin)"]
        steps:
          - { action: "Open the login page" }
          - { action: "Log in", data: "tom@bloomly.app / tulips42" }
          - { action: "Look at the account page heading", expected: "\"Welcome back, Tom!\"" }
      code: |
        import { test, expect } from '@playwright/test';

        const email = 'tom@bloomly.app';
        const password = '___';
        const firstName = '___';

        test('Tom can log in', async ({ page }) => {
          await page.goto('/login');
          await page.getByLabel('Email').fill(email);
          await page.getByLabel('Password').fill(password);
          await page.getByRole('button', { name: 'Log in' }).click();
          await expect(page.getByRole('heading', { level: 1 })).toHaveText(`Welcome back, ${firstName}!`);
        });
      blanks:
        - { answers: [tulips42], options: [tulips42, Tulips42, bloom123] }
        - { answers: [Tom], options: [Tom, Becker, Tom Becker] }
      checks: { expect: pass }
      hints:
        - { en: "Both values are in the test case card — copy them exactly.", ru: "Оба значения есть в карточке тест-кейса — скопируй их точно." }
        - { en: "For the name: put it into the template and read the full heading. Does it match the expected result?", ru: "Для имени: подставь его в шаблон и прочитай заголовок целиком. Совпадает с ожидаемым результатом?" }
        - { en: "Password all lowercase; the greeting uses only the first name.", ru: "Пароль — только строчными; в приветствии только имя." }
      praise:
        en: "Green! You took the data straight from the test case — that's the habit that saves hours."
        ru: "Зелёный! Ты взя{ла|л} данные прямо из тест-кейса — эта привычка экономит часы."
      explain:
        en: "Tom's password is 'tulips42' (lowercase t). With `firstName = 'Tom'` the template gives \"Welcome back, Tom!\" — exactly the expected result. 'Tom Becker' would produce \"Welcome back, Tom Becker!\" and fail."
        ru: "Пароль Тома — 'tulips42' (со строчной t). С `firstName = 'Tom'` шаблон даёт «Welcome back, Tom!» — ровно ожидаемый результат. С 'Tom Becker' получилось бы «Welcome back, Tom Becker!», и тест бы упал."

  - type: task
    task:
      id: c3-l1-t5
      kind: review
      keyPoint: kp-strings
      prompt:
        en: "Review Petal's test for TC-001. Flag every line where the data or the expected text doesn't match the test case."
        ru: "Сделай ревью теста Petal для TC-001. Отметь каждую строку, где данные или ожидаемый текст не совпадают с тест-кейсом."
      context:
        en: "Petal: \"Login test for TC-001 is ready. I double-checked the data!\""
        ru: "Petal: «Тест логина для TC-001 готов. Данные я перепроверил!»"
      testCase:
        id: TC-001
        title: Registered user can log in
        preconditions: ["User anna@bloomly.app / bloom123 exists"]
        steps:
          - { action: "Open the login page" }
          - { action: "Enter email and password", data: "anna@bloomly.app / bloom123" }
          - { action: "Click \"Log in\"", expected: "Account page shows \"Welcome back, Anna!\"" }
      code: |
        import { test, expect } from '@playwright/test';

        const email = 'anna@bloomly.app';
        const password = 'Bloom123';

        test('Anna can log in', async ({ page }) => {
          await page.goto('/login');
          await page.getByLabel('Email').fill(email);
          await page.getByLabel('Password').fill(password);
          await page.getByRole('button', { name: 'Log in' }).click();
          await expect(page.getByRole('heading', { level: 1 })).toHaveText('Welcome Back, Anna!');
        });
      issues:
        - line: 4
          type: wrong-data
          note:
            en: "The password is 'bloom123' with a lowercase b. Passwords are case-sensitive: this test can't log in."
            ru: "Пароль — 'bloom123' со строчной b. Пароли чувствительны к регистру: с таким тест не войдёт."
        - line: 11
          type: wrong-assertion
          note:
            en: "The app says \"Welcome back, Anna!\" — lowercase b in \"back\". `toHaveText` compares exactly, so this check fails even when login works."
            ru: "В приложении «Welcome back, Anna!» — «back» со строчной b. `toHaveText` сравнивает точно, так что проверка упадёт, даже когда логин работает."
      types: [wrong-data, wrong-assertion, fragile-locator, missing-await, no-assertion]
      hints:
        - { en: "Compare every string in quotes with the test case card. Two of them are off by one letter.", ru: "Сравни каждую строку в кавычках с карточкой тест-кейса. Две отличаются на одну букву." }
        - { en: "Look at the constants at the top and at the expected text in the last step.", ru: "Посмотри на константы в начале и на ожидаемый текст в последнем шаге." }
        - { en: "Line 4: compare the first letter of the password. Line 11: compare the word \"back\".", ru: "Строка 4: сравни первую букву пароля. Строка 11: сравни слово «back»." }
      praise:
        en: "Two one-letter bugs, both found. That's a review Petal can learn from."
        ru: "Два бага в одну букву — оба найдены. На таком ревью Petal может учиться."
      explain:
        en: "Note where you flagged the data bug: on line 4, where the constant is defined — not on line 9, where it's used. Fix it once at the source, and every line that uses `password` is fixed."
        ru: "Обрати внимание, где ты отмечаешь ошибку в данных: в строке 4, где объявлена константа, а не в строке 9, где она используется. Исправишь в источнике — исправится каждая строка, где есть `password`."

  - type: task
    task:
      id: c3-l1-t6
      kind: predict
      keyPoint: kp-template
      prompt:
        en: "Will this test pass or fail? Build the expected heading in your head first."
        ru: "Этот тест пройдёт или упадёт? Сначала мысленно собери ожидаемый заголовок."
      code: |
        import { test, expect } from '@playwright/test';

        const email = 'tom@bloomly.app';
        const password = 'tulips42';
        const name = 'Tom';

        test('Tom sees his greeting', async ({ page }) => {
          await page.goto('/login');
          await page.getByLabel('Email').fill(email);
          await page.getByLabel('Password').fill(password);
          await page.getByRole('button', { name: 'Log in' }).click();
          await expect(page.getByRole('heading', { level: 1 })).toHaveText(`Welcome back, ${name}.`);
        });
      outcome: fail
      reasons:
        - text:
            en: "The expected text ends with a full stop, but the page says \"Welcome back, Tom!\""
            ru: "Ожидаемый текст заканчивается точкой, а на странице «Welcome back, Tom!»"
          correct: true
        - text:
            en: "Tom's password is wrong"
            ru: "У Тома неверный пароль"
          why: { en: "'tulips42' is exactly Tom's password.", ru: "'tulips42' — ровно пароль Тома." }
        - text:
            en: "`${name}` doesn't work inside `expect`"
            ru: "`${name}` не работает внутри `expect`"
          why: { en: "Template literals work anywhere. Here it builds \"Welcome back, Tom.\" — and that's the problem.", ru: "Шаблонные строки работают где угодно. Здесь получается «Welcome back, Tom.» — в этом и проблема." }
      hints:
        - { en: "Replace `${name}` with its value and read the whole expected text.", ru: "Замени `${name}` значением и прочитай ожидаемый текст целиком." }
        - { en: "Now compare it with Bloomly's account heading, down to the last character.", ru: "Теперь сравни его с заголовком страницы аккаунта Bloomly до последнего символа." }
      praise:
        en: "Right — one punctuation mark is enough to turn a test red."
        ru: "Верно — одного знака препинания хватает, чтобы тест стал красным."
      explain:
        en: "Login works, but the template builds \"Welcome back, Tom.\" while the app shows \"Welcome back, Tom!\". The report will say the expected and received texts differ. The fix is one character — but only if someone reads the string."
        ru: "Логин проходит, но шаблон собирает «Welcome back, Tom.», а приложение показывает «Welcome back, Tom!». В отчёте будет видно, что ожидаемый и полученный тексты различаются. Исправление — один символ, но только если кто-то прочитает строку."

  - type: task
    task:
      id: c3-l1-t7
      kind: vocab
      mode: cloze
      sentence:
        en: "Petal stored the email in a ___ at the top of the file, so all five tests reuse it."
        ru: "Petal сохранил email в константе в начале файла, чтобы все пять тестов её переиспользовали."
      answer: constant
      options: [constant, comment, console]

  - type: mistakes
    title: { en: "Typical string mistakes (agents make them too)", ru: "Типичные ошибки со строками (агенты тоже их делают)" }
    items:
      - wrong: "await page.getByLabel('Email').fill('email');"
        right: "await page.getByLabel('Email').fill(email);"
        why:
          en: "Quotes turn the name into the literal word: the test types \"email\" instead of the address."
          ru: "Кавычки превращают имя в само слово: тест вводит «email» вместо адреса."
      - wrong: "await expect(heading).toHaveText('Welcome back, ${name}!');"
        right: "await expect(heading).toHaveText(`Welcome back, ${name}!`);"
        why:
          en: "`${...}` works only inside backticks. In single quotes the text stays literally \"${name}\"."
          ru: "`${...}` работает только внутри обратных кавычек. В одинарных кавычках так и останется текст «${name}»."
      - wrong: "const password = 'bloom123 ';"
        right: "const password = 'bloom123';"
        why:
          en: "A trailing space inside the quotes is part of the password. The login fails, and the space is invisible in the report."
          ru: "Пробел в конце внутри кавычек — часть пароля. Логин не проходит, а в отчёте пробел не видно."
      - wrong: "await page.getByRole('button', { name: 'Login' }).click();"
        right: "await page.getByRole('button', { name: 'Log in' }).click();"
        why:
          en: "The agent guessed a common label. Bloomly says \"Log in\". Always take texts from the app, not from memory."
          ru: "Агент угадал популярную подпись. В Bloomly — «Log in». Тексты всегда берём из приложения, а не из памяти."

  - type: explain
    keyPoint: kp-const
    prompt:
      en: "In your own words: how do you find out what a test will type into the Email field?"
      ru: "Своими словами: как узнать, что тест введёт в поле Email?"
    model:
      en: "I find the line with `getByLabel('Email').fill(...)` and look inside the brackets. If there's text in quotes, that exact text is typed. If there's a name without quotes, like `email`, I look up to the `const` with that name — its value is what will be typed. Then I compare it with the test case data, character by character."
      ru: "Я нахожу строку с `getByLabel('Email').fill(...)` и смотрю, что в скобках. Если там текст в кавычках — вводится ровно он. Если имя без кавычек, например `email`, я ищу выше `const` с этим именем — его значение и будет введено. Потом сравниваю его с данными тест-кейса посимвольно."

  - type: phrases
    items:
      - context: code-review
        en: "The expected text doesn't match the app: it's \"Welcome back, Anna!\" with a lowercase b."
        ru: "Ожидаемый текст не совпадает с приложением: там «Welcome back, Anna!» со строчной b."
      - context: code-review
        en: "Could we move the test data into constants at the top of the file?"
        ru: "Можем вынести тестовые данные в константы в начало файла?"
        note:
          en: "\"Could we…?\" sounds softer than \"Move it\" — standard tone in code review."
          ru: "«Could we…?» звучит мягче, чем «Move it», — обычный тон для код-ревью."
      - context: chat
        en: "Quick question: where does this test get the password from?"
        ru: "Быстрый вопрос: откуда этот тест берёт пароль?"
      - context: prompt
        en: "Use the exact texts from the page. Don't guess labels or button names."
        ru: "Используй точные тексты со страницы. Не угадывай подписи полей и названия кнопок."
      - context: standup
        en: "I reviewed Petal's login tests yesterday: two had wrong test data, I left comments."
        ru: "Вчера я посмотре{ла|л} тесты логина от Petal: в двух неверные тестовые данные, я оставил{а|} комментарии."

checkPool:
  - id: c3-l1-k1
    kind: choice
    keyPoint: kp-strings
    placement: true
    prompt:
      en: "Bloomly's account heading is \"Welcome back, Anna!\". Which expected text will make `toHaveText` pass?"
      ru: "Заголовок аккаунта в Bloomly — «Welcome back, Anna!». С каким ожидаемым текстом `toHaveText` пройдёт?"
    options:
      - text: "'Welcome back, Anna!'"
        correct: true
        why: { en: "Identical, character by character.", ru: "Совпадает посимвольно." }
      - text: "'Welcome Back, Anna!'"
        why: { en: "Capital B. `toHaveText` is case-sensitive.", ru: "Заглавная B. `toHaveText` учитывает регистр." }
      - text: "'Welcome back Anna!'"
        why: { en: "The comma is missing.", ru: "Пропала запятая." }
      - text: "'Welcome back, Anna'"
        why: { en: "The `!` is missing. `toHaveText` compares the whole text.", ru: "Пропал `!`. `toHaveText` сравнивает текст целиком." }
    optionsCode: true
    hints:
      - { en: "Compare letters, case and punctuation.", ru: "Сравни буквы, регистр и знаки препинания." }
      - { en: "Three options each lose or change exactly one character.", ru: "В трёх вариантах ровно один символ потерян или изменён." }
    explain:
      en: "`toHaveText` with a string checks the whole text exactly. Only an identical copy passes."
      ru: "`toHaveText` со строкой проверяет весь текст точно. Проходит только идентичная копия."

  - id: c3-l1-k2
    kind: input
    keyPoint: kp-const
    prompt:
      en: "Petal wrote this. What will be typed into the Email field?"
      ru: "Это написал Petal. Что будет введено в поле Email?"
