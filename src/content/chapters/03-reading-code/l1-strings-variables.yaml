    explain:
      en: "Only `f\"Welcome back, {first_name}!\"` builds \"Welcome back, Anna!\". Without the `f` you get the braces literally; with `city` — \"Welcome back, Lisbon!\"; with the JavaScript-style `${...}` — \"Welcome back, $Anna!\"."
      ru: "Только `f\"Welcome back, {first_name}!\"` собирает «Welcome back, Anna!». Без `f` получатся буквально фигурные скобки; с `city` — «Welcome back, Lisbon!»; с `${...}` в стиле JavaScript — «Welcome back, $Anna!»."

