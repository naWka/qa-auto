  - id: c3-l1-k8
    kind: choice
    keyPoint: kp-variable
    prompt:
      en: "Anna's test password changes to \"spring26\". Petal's file uses `PASSWORD` in 5 tests. What is the smallest correct change?"
      ru: "Тестовый пароль Анны меняется на «spring26». В файле Petal `PASSWORD` используется в 5 тестах. Какое минимальное правильное изменение?"
    code: |
      EMAIL = "anna@bloomly.app"
      PASSWORD = "bloom123"


      def test_anna_can_log_in(page: Page):
          ...  # uses EMAIL and PASSWORD


      def test_anna_sees_her_orders(page: Page):
          ...  # uses EMAIL and PASSWORD


      def test_anna_can_reorder(page: Page):
          ...  # uses EMAIL and PASSWORD

      # ...and 2 more tests
    options:
      - text: { en: 'Change only line 2: `PASSWORD = "spring26"`', ru: 'Поменять только строку 2: `PASSWORD = "spring26"`' }
        correct: true
        why: { en: "Every test reads the value from this one constant.", ru: "Все тесты берут значение из этой одной константы." }
      - text: { en: "Change the password in each of the 5 tests", ru: "Поменять пароль в каждом из 5 тестов" }
        why: { en: "The tests don't contain the password — they only use the name `PASSWORD`.", ru: "В тестах нет самого пароля — они используют только имя `PASSWORD`." }
      - text: { en: "Rename the constant to `NEW_PASSWORD`", ru: "Переименовать константу в `NEW_PASSWORD`" }
        why: { en: "The value would stay \"bloom123\", and every test would break on the unknown name `PASSWORD` (`NameError`).", ru: "Значение так и останется «bloom123», а все тесты сломаются на неизвестном имени `PASSWORD` (`NameError`)." }
    hints:
      - { en: "Where is the text \"bloom123\" written?", ru: "Где написан текст «bloom123»?" }
      - { en: "The tests use the name; the value lives in one place.", ru: "Тесты используют имя, а значение живёт в одном месте." }
    explain:
      en: "That's why shared test data lives in constants at the top of the file: one place to read, one place to change — like a shared test data sheet for many test cases. The CAPITAL letters tell the team: set once, don't change it inside a test."
      ru: "Именно поэтому общие тестовые данные хранят в константах в начале файла: одно место, чтобы прочитать, одно — чтобы поменять. Как общая таблица тестовых данных для многих тест-кейсов. ЗАГЛАВНЫЕ буквы говорят команде: задано один раз, внутри теста не меняем."
