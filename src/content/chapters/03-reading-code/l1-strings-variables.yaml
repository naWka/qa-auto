  - id: c3-l1-k3
    kind: review
    keyPoint: kp-const
    prompt:
      en: "Review Petal's sign-up test against the test case. Flag the data and the expected text that are wrong."
      ru: "Сделай ревью теста регистрации от Petal по тест-кейсу. Отметь неверные данные и неверный ожидаемый текст."
    testCase:
      id: TC-021
      title: New customer can create an account
      preconditions: ["Bloomly passwords need at least 8 characters"]
      steps:
        - { action: "Open the sign-up page" }
        - { action: "Fill in name, email, password, country", data: "Lena Novak / lena@bloomly.app / tulips2026 / Poland" }
        - { action: "Accept the terms and click \"Create account\"", expected: "\"Account created!\" and \"Welcome to Bloomly, Lena.\"" }
    code: |
      import { test, expect } from '@playwright/test';

      const fullName = 'Lena Novak';
      const email = 'lena@bloomly.app';
      const password = 'tulip';

      test('new customer can sign up', async ({ page }) => {
        await page.goto('/signup');
        await page.getByLabel('Full name').fill(fullName);
        await page.getByLabel('Email').fill(email);
        await page.getByLabel('Password').fill(password);
        await page.getByLabel('Country').selectOption('Poland');
        await page.getByLabel('I agree to the Terms of Service').check();
        await page.getByRole('button', { name: 'Create account' }).click();
        await expect(page.getByTestId('signup-success')).toContainText(`Welcome to Bloomly, ${fullName}.`);
      });
    issues:
      - line: 5
        type: wrong-data
        note:
          en: "'tulip' has 5 characters; Bloomly needs at least 8. A positive test needs valid data: 'tulips2026' from the case."
          ru: "В 'tulip' 5 символов, а Bloomly нужно минимум 8. Позитивному тесту нужны валидные данные: 'tulips2026' из кейса."
      - line: 15
        type: wrong-assertion
        note:
          en: "The template builds \"Welcome to Bloomly, Lena Novak.\" but the app greets by first name only: \"Welcome to Bloomly, Lena.\""
          ru: "Шаблон собирает «Welcome to Bloomly, Lena Novak.», а приложение приветствует только по имени: «Welcome to Bloomly, Lena.»"
    types: [wrong-data, wrong-assertion, fragile-locator, missing-await, hard-wait]
    hints:
      - { en: "Check each constant against the test case data and the precondition.", ru: "Сверь каждую константу с данными и предусловием тест-кейса." }
      - { en: "Build the text in the last `expect` in your head. Is it the same as the expected result?", ru: "Мысленно собери текст в последнем `expect`. Он совпадает с ожидаемым результатом?" }
      - { en: "Line 5: count the characters. Line 15: which name goes into the template?", ru: "Строка 5: посчитай символы. Строка 15: какое имя попадает в шаблон?" }
    explain:
      en: "Data bugs hide in constants, expected-text bugs hide in templates. Read both: the constant's value, then the text the template builds from it."
      ru: "Ошибки в данных прячутся в константах, ошибки в ожидаемом тексте — в шаблонах. Читай и то, и другое: значение константы и текст, который из неё собирает шаблон."

  - id: c3-l1-k4
    kind: predict
    keyPoint: kp-template
    prompt:
      en: "Will this test pass or fail?"
      ru: "Этот тест пройдёт или упадёт?"
    context:
      en: "After \"Add to cart\", Bloomly shows a toast like \"Rose Bouquet added to cart\"."
      ru: "После «Add to cart» Bloomly показывает всплывающее сообщение вида «Rose Bouquet added to cart»."
    code: |
      import { test, expect } from '@playwright/test';

      const product = 'Sunny Tulips';

      test('toast names the added product', async ({ page }) => {
        await page.goto('/shop');
        await page.getByTestId('product-card').filter({ hasText: product })
          .getByRole('button', { name: 'Add to cart' }).click();
        await expect(page.getByRole('status')).toHaveText(`${product} added to cart`);
      });
    outcome: pass
    reasons:
      - text:
          en: "The template builds \"Sunny Tulips added to cart\" — exactly the toast text"
          ru: "Шаблон собирает «Sunny Tulips added to cart» — ровно текст сообщения"
        correct: true
      - text:
          en: "It fails: `product` can't be used twice"
          ru: "Упадёт: `product` нельзя использовать дважды"
        why: { en: "Reusing a constant is the whole point of having one.", ru: "Переиспользовать константу — ровно то, зачем она нужна." }
      - text:
          en: "It fails: the toast says \"Sunny Tulips added to Cart\""
          ru: "Упадёт: в сообщении «Sunny Tulips added to Cart»"
        why: { en: "Bloomly's toast uses a lowercase \"cart\".", ru: "В сообщении Bloomly «cart» со строчной." }
    hints:
      - { en: "Put the value of `product` into the template.", ru: "Подставь значение `product` в шаблон." }
      - { en: "Compare the result with the toast format from the context.", ru: "Сравни результат с форматом сообщения из контекста." }
    explain:
      en: "`product` is used twice: to find the right card and to build the expected toast. The text comes out as \"Sunny Tulips added to cart\" — a match, so the test passes."
      ru: "`product` используется дважды: чтобы найти нужную карточку и чтобы собрать ожидаемое сообщение. Получается «Sunny Tulips added to cart» — совпадение, тест проходит."

  - id: c3-l1-k5
    kind: predict
    keyPoint: kp-strings
    prompt:
      en: "Look very closely at the test data. Will this test pass or fail?"
      ru: "Посмотри очень внимательно на тестовые данные. Тест пройдёт или упадёт?"
    code: |
