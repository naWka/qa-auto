  - id: c3-l2-k8
    kind: predict
    keyPoint: kp-return
    app: { state: { cart: [{ id: rose-bouquet, qty: 2 }, { id: sunny-tulips, qty: 1 }] } }
    prompt:
      en: "Anna's cart has 2 × Rose Bouquet and 1 × Sunny Tulips. Will this test pass or fail?"
      ru: "В корзине Анны 2 × Rose Bouquet и 1 × Sunny Tulips. Этот тест пройдёт или упадёт?"
    code: |
      from playwright.sync_api import Page, expect


      def cart_row(page: Page, product: str):
          return page.get_by_test_id("cart-row").filter(has_text=product)


      def test_rose_bouquet_row_shows_the_subtotal_for_2(page: Page):
          page.goto("/cart")
          row = cart_row(page, "Rose Bouquet")
          expect(row.get_by_test_id("row-subtotal")).to_have_text("€70.00")
    outcome: pass
    reasons:
      - text:
          en: "Pass: `cart_row` returns the Rose Bouquet row, and its subtotal is €70.00"
          ru: "Пройдёт: `cart_row` возвращает строку Rose Bouquet, и её подытог — €70.00"
        correct: true
      - text:
          en: "Fail: `row` is None"
          ru: "Упадёт: `row` — это None"
        why: { en: "Line 5 starts with `return`, so the row comes back to the test.", ru: "Строка 5 начинается с `return`, так что строка таблицы возвращается в тест." }
      - text:
          en: "Fail: the filter matches both rows"
          ru: "Упадёт: фильтр находит обе строки"
        why: { en: "Only one row contains the text \"Rose Bouquet\".", ru: "Текст «Rose Bouquet» есть только в одной строке." }
    hints:
      - { en: "Find `return` in the helper. What does the test get back?", ru: "Найди `return` в помощнике. Что тест получает обратно?" }
      - { en: "2 × €35.00 = ?", ru: "2 × €35.00 = ?" }
    explain:
      en: "`cart_row` hands back a locator for one row; the test keeps it in `row` and looks for the subtotal inside it: 2 × €35.00 = €70.00. Helpers that return locators are common in AI-written tests — check that they really `return`."
      ru: "`cart_row` отдаёт обратно локатор одной строки, тест сохраняет его в `row` и ищет подытог внутри неё: 2 × €35.00 = €70.00. Помощники, возвращающие локаторы, часто встречаются в тестах от ИИ — проверяй, что они действительно делают `return`."
