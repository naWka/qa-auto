id: c3-l2
chapter: c3
title: { en: "Functions: def, arguments, return", ru: "Функции: def, аргументы, return" }
goal:
  en: "Read a helper function and a test header: what goes in, which steps run, with which data — and what comes back."
  ru: "Читать функцию-помощник и заголовок теста: что передаётся, какие шаги выполняются, с какими данными и что возвращается."
minutes: 10
keyPoints:
  - id: kp-function
    title: { en: "`def` gives a set of steps a name; a call runs them", ru: "`def` даёт набору шагов имя, а вызов их выполняет" }
  - id: kp-page-fixture
    title: { en: "A test is a function too: pytest passes in `page`", ru: "Тест — тоже функция: pytest передаёт в неё `page`" }
  - id: kp-arguments
    title: { en: "Positional arguments go by order, keyword arguments by name", ru: "Позиционные аргументы идут по порядку, именованные — по имени" }
  - id: kp-return
    title: { en: "`return` hands a value back; without it you get None", ru: "`return` отдаёт значение обратно, а без него приходит None" }
terms: [function, parameter, argument, keyword-argument, method, none, fixture, precondition]

steps:
  - type: story
    lines:
      - who: kai
        text:
          en: "Morning! Maya says you're reading Petal's code this week. Shout whenever a line looks strange — that's what I'm here for."
          ru: "Доброе утро! Майя говорит, ты на этой неделе читаешь код Petal. Зови, как только строка покажется странной, — я для этого здесь."
      - who: petal
        text:
          en: "Good news: I created a helper function `log_in` and used it in 12 tests. Very efficient!"
          ru: "Хорошие новости: я создал функцию-помощник `log_in` и использовал её в 12 тестах. Очень эффективно!"
      - who: maya
        text:
          en: "Efficient — if it logs in as the right person. One helper, twelve tests: one mistake inside it breaks all twelve."
          ru: "Эффективно — если она логинит того, кого нужно. Один помощник на двенадцать тестов: одна ошибка в нём ломает все двенадцать."

  - type: pretest
    intro:
      en: "Quick guess before we start. Wrong answers are fine — they help you remember."
      ru: "Быстрая догадка перед началом. Ошибаться можно — так лучше запоминается."
    items:
      - id: c3-l2-p1
        kind: choice
        keyPoint: kp-function
        prompt:
          en: 'Inside a test, Petal wrote `log_in(page, "tom@bloomly.app", "tulips42")`. What does this line most likely do?'
          ru: 'Внутри теста Petal написал `log_in(page, "tom@bloomly.app", "tulips42")`. Что, скорее всего, делает эта строка?'
        options:
          - text: { en: "Runs the login steps with Tom's email and password", ru: "Выполняет шаги логина с email и паролем Тома" }
            correct: true
            why: { en: "`log_in` is a name for a set of steps; the values in brackets are the data for them.", ru: "`log_in` — имя набора шагов, а значения в скобках — данные для них." }
          - text: { en: "Creates a new user called Tom", ru: "Создаёт нового пользователя Тома" }
            why: { en: "The name says \"log in\", and Tom already exists in Bloomly.", ru: "Имя говорит «войти», а Том в Bloomly уже существует." }
          - text: { en: "Describes how login works, without doing anything yet", ru: "Описывает, как работает логин, но пока ничего не делает" }
            why: { en: "Describing is the *definition* — the `def` line and its steps. A line like this one, with values in brackets, is a *call*: it runs the steps.", ru: "Описание — это *объявление*: строка `def` и шаги под ней. Строка вроде этой, со значениями в скобках, — *вызов*: она выполняет шаги." }
        hints:
          - { en: "Read the name like a test step: \"log in\".", ru: "Прочитай имя как шаг тест-кейса: «войти»." }
          - { en: "What could the two strings in brackets be for?", ru: "Для чего могут быть нужны две строки в скобках?" }
        explain:
          en: "This is a function call: it runs the steps saved under the name `log_in`, using Tom's data. Let's see how that works."
          ru: "Это вызов функции: он выполняет шаги, сохранённые под именем `log_in`, с данными Тома. Сейчас разберёмся, как это устроено."
      - id: c3-l2-p2
        kind: choice
        keyPoint: kp-return
        prompt:
          en: "And one more: what will this code print?"
          ru: "И ещё одна: что напечатает этот код?"
        code: |
          def welcome_text(first_name):
              text = f"Welcome back, {first_name}!"


          print(welcome_text("Anna"))
        options:
          - text: "None"
            correct: true
            why: { en: "The function builds the text but never hands it back — there's no `return`. Then Python gives back None, \"no value\".", ru: "Функция собирает текст, но не отдаёт его обратно — `return` нет. Тогда Python возвращает None, «нет значения»." }
          - text: "Welcome back, Anna!"
            why: { en: "That's what `text` holds inside the function. But the text stays inside — nothing hands it back to `print`.", ru: "Это то, что лежит в `text` внутри функции. Но текст там и остаётся — ничто не передаёт его обратно в `print`." }
          - text: "Welcome back, {first_name}!"
            why: { en: "The `f` before the quotes does fill in the name. The catch is elsewhere: what does the function give back?", ru: "Буква `f` перед кавычками как раз подставляет имя. Подвох в другом: что функция отдаёт обратно?" }
        optionsCode: true
        run: script
        hints:
          - { en: "Look for the word `return` inside the function.", ru: "Поищи слово `return` внутри функции." }
        explain:
          en: "It prints `None`. A function hands a value back only with `return`; without it the caller gets None. We'll come back to this."
          ru: "Напечатается `None`. Функция отдаёт значение обратно только через `return`, а без него вызывающий код получает None. Мы ещё к этому вернёмся."

  - type: theory
    keyPoint: kp-function
    title: { en: "A function is a reusable set of steps", ru: "Функция — набор шагов для повторного использования" }
    body:
      - en: "In test cases you write a [[precondition]] once — \"User is logged in as Anna\" — and many cases refer to it. Code has the same trick: a [[function]], a named sequence of steps."
        ru: "В тест-кейсах ты один раз описываешь [[предусловие|precondition]] — «Пользователь залогинен как Анна» — и многие кейсы на него ссылаются. В коде тот же приём: [[функция|function]], именованная последовательность шагов."
      - en: "First the function is *defined*: `def`, its name, what it needs in brackets, a colon — and its steps, indented underneath. Nothing runs yet. Later it is *called* — `log_in(page, ...)` — and only then the steps run."
        ru: "Сначала функцию *объявляют*: `def`, имя, в скобках — что ей нужно, двоеточие, а ниже с отступом — её шаги. Пока ничего не выполняется. Потом её *вызывают* — `log_in(page, ...)` — и только тогда шаги выполняются."
      - en: "The values in brackets of a call are [[arguments|argument]]. Inside the function they arrive under the names from its definition — the [[parameters|parameter]]. Here they are matched by position: first to first, second to second."
        ru: "Значения в скобках при вызове — это [[аргументы|argument]]. Внутрь функции они попадают под именами из объявления — [[параметрами|parameter]]. Здесь они сопоставляются по порядку: первый с первым, второй со вторым."
    code: |
      def log_in(page, email, password):
          page.goto("/login")
          page.get_by_label("Email").fill(email)
          page.get_by_label("Password").fill(password)
          page.get_by_role("button", name="Log in").click()


      # later, inside a test:
      log_in(page, "tom@bloomly.app", "tulips42")
    mentor:
      en: 'Read a call by lining it up with the `def` line: page → page, "tom@bloomly.app" → email, "tulips42" → password.'
      ru: 'Читай вызов, прикладывая его к строке `def`: page → page, "tom@bloomly.app" → email, "tulips42" → password.'

  - type: theory
    keyPoint: kp-page-fixture
    title: { en: "The test is a function too", ru: "Тест — тоже функция" }
    body:
      - en: "Look at the first line of any test: `def` again. A test is a function whose name starts with `test_`. Nobody calls it by hand — pytest finds every `test_…` function and calls it."
        ru: "Посмотри на первую строку любого теста: снова `def`. Тест — это функция, имя которой начинается с `test_`. Вручную её никто не вызывает: pytest находит все функции `test_…` и вызывает их сам."
      - en: "Before the call, pytest reads the parameters. The test asks for `page`, so pytest opens a fresh, clean browser page — like a new incognito window for every test case — and passes it in. Things pytest prepares by name like this are [[fixtures|fixture]]."
        ru: "Перед вызовом pytest смотрит на параметры. Тест просит `page` — и pytest открывает новую чистую страницу браузера (как новое окно инкогнито для каждого тест-кейса) и передаёт её в тест. То, что pytest вот так готовит по имени, называется [[фикстурами|fixture]]."
      - en: "`: Page` is a type hint — a label for readers and the editor: \"this is a Playwright page\". Python doesn't enforce it: `def test_x(page):` would run the same. What matters is the name in brackets. Without `page` there, the word `page` means nothing inside the test, and it crashes on the first step with `NameError`."
        ru: "`: Page` — подсказка типа: ярлык для читателя и редактора кода, «это страница Playwright». Python её не проверяет: `def test_x(page):` работал бы точно так же. Важно имя в скобках. Если там нет `page`, слово `page` внутри теста ничего не значит, и тест падает на первом же шаге с `NameError`."
    code: |
      def test_shop_shows_6_products(page: Page):
          page.goto("/shop")
          expect(page.get_by_test_id("results-count")).to_have_text("6 products")
    mentor:
      en: "A helper needs the page too, but pytest only serves tests — nobody hands the page to a helper automatically. That's why the test passes its own page on: `log_in(page, ...)`."
      ru: "Помощнику тоже нужна страница, но pytest обслуживает только тесты — сама она к помощнику не попадёт. Поэтому тест передаёт свою страницу дальше: `log_in(page, ...)`."

  - type: theory
    keyPoint: kp-arguments
    title: { en: "Positional and keyword arguments", ru: "Позиционные и именованные аргументы" }
    body:
      - en: "Arguments come in two kinds. *Positional* ones are matched by order: in `get_by_role(\"button\", ...)`, `\"button\"` is the role because it comes first. *Keyword* ones carry a label: in `name=\"Log in\"` the label says which parameter gets the value. That's a [[keyword argument|keyword-argument]]."
        ru: "Аргументы бывают двух видов. *Позиционные* сопоставляются по порядку: в `get_by_role(\"button\", ...)` строка `\"button\"` — это роль, потому что стоит первой. *Именованные* несут подпись: в `name=\"Log in\"` подпись говорит, какой параметр получит значение. Это [[именованный аргумент|keyword-argument]]."
      - en: "Playwright [[methods|method]] — functions that belong to `page` or a locator — take their settings as keyword arguments: `name=\"Log in\"` = \"the one named Log in\", `exact=True` = \"match the whole text exactly\", `level=1` = \"an h1 heading\"."
        ru: "[[Методы|method]] Playwright — функции, которые принадлежат `page` или локатору, — получают настройки именованными аргументами: `name=\"Log in\"` = «тот, что называется Log in», `exact=True` = «совпадение всего текста целиком», `level=1` = «заголовок h1»."
      - en: "Python checks the labels. A label the function doesn't have is an instant crash: `get_by_role(\"button\", label=\"Log in\")` → `TypeError: Page.get_by_role() got an unexpected keyword argument 'label'`."
        ru: "Python проверяет подписи. Подпись, которой у функции нет, — мгновенное падение: `get_by_role(\"button\", label=\"Log in\")` → `TypeError: Page.get_by_role() got an unexpected keyword argument 'label'`."
    code: |
      page.get_by_role("button", name="Log in")
      page.get_by_role("heading", level=1)
      page.get_by_text("Out of stock", exact=True)
      log_in(page, email="tom@bloomly.app", password="tulips42")
    mentor:
      en: "Keyword arguments are a reviewer's friend: `log_in(page, email=..., password=...)` reads like test data with labels, and the email and password can't swap places unnoticed. When a helper takes several strings, ask the agent to call it with keywords."
      ru: "Именованные аргументы — друзья ревьюера: `log_in(page, email=..., password=...)` читается как тестовые данные с подписями, и email с паролем уже не поменяются местами незаметно. Если помощник принимает несколько строк, попроси агента вызывать его с именами."

  - type: theory
    keyPoint: kp-return
    title: { en: "return: what a function hands back", ru: "return: что функция отдаёт обратно" }
    body:
      - en: "Some functions only do steps, like `log_in`. Others also hand a result back — with `return`. The call is then replaced by that value, and you can keep it in a variable: `card = product_card(page, \"Sunny Tulips\")`."
        ru: "Одни функции только выполняют шаги, как `log_in`. Другие ещё и отдают результат — через `return`. Тогда вызов заменяется этим значением, и его можно сохранить в переменную: `card = product_card(page, \"Sunny Tulips\")`."
      - en: "It's like writing down the actual result of one step to use in the next. Playwright methods work the same way: `page.title()` returns the page title, `get_by_role(...)` returns a locator."
        ru: "Это как записать фактический результат одного шага, чтобы использовать его в следующем. Методы Playwright работают так же: `page.title()` возвращает заголовок страницы, `get_by_role(...)` — локатор."
      - en: "No `return` → the function hands back [[None|none]], Python's \"no value\". A typical AI slip: the helper finds the element but forgets `return`, and the test crashes with `AttributeError: 'NoneType' object has no attribute …`."
        ru: "Нет `return` → функция возвращает [[None|none]], в Python это «нет значения». Типичный промах ИИ: помощник находит элемент, но забывает `return`, и тест падает с `AttributeError: 'NoneType' object has no attribute …`."
    code: |
      def product_card(page: Page, name: str):
          return page.get_by_test_id("product-card").filter(has_text=name)


      # inside a test:
      card = product_card(page, "Sunny Tulips")
      expect(card.get_by_test_id("product-price")).to_have_text("€24.00")
    mentor:
      en: "When an error mentions `'NoneType'`, ask: which function produced this value — and does it really `return` it?"
      ru: "Если в ошибке есть `'NoneType'`, спроси себя: какая функция дала это значение — и правда ли она его возвращает через `return`?"

  - type: example
    keyPoint: kp-function
    title: { en: "One helper, two tests", ru: "Один помощник — два теста" }
    intro:
      en: "Petal's refactoring: the login steps moved into a helper, and two tests call it with different data."
      ru: "Рефакторинг от Petal: шаги логина переехали в функцию-помощник, и два теста вызывают её с разными данными."
    code: |
      from playwright.sync_api import Page, expect


      def log_in(page: Page, email: str, password: str):
          page.goto("/login")
          page.get_by_label("Email").fill(email)
          page.get_by_label("Password").fill(password)
          page.get_by_role("button", name="Log in").click()


      def test_anna_sees_her_full_name(page: Page):
          log_in(page, "anna@bloomly.app", "bloom123")
          expect(page.get_by_test_id("account-name")).to_have_text("Anna Silva")


      def test_tom_sees_his_city(page: Page):
          log_in(page, email="tom@bloomly.app", password="tulips42")
          expect(page.get_by_test_id("account-city")).to_have_text("Berlin")
    notes:
      - lines: 4
        text:
          en: "The definition: name `log_in`, three parameters. `: Page` and `: str` (text) are type hints — labels for the reader."
          ru: "Объявление: имя `log_in`, три параметра. `: Page` и `: str` (текст) — подсказки типа, ярлыки для читателя."
      - lines: [5, 6, 7, 8]
        text:
          en: "The shared steps, indented under `def`. They don't run here — only when a test calls `log_in`."
          ru: "Общие шаги, с отступом под `def`. Здесь они не выполняются — только когда тест вызывает `log_in`."
      - lines: 11
        text:
          en: "A test is a function too. pytest calls it and passes in this test's own fresh `page`."
          ru: "Тест — тоже функция. pytest вызывает её и передаёт собственную новую `page` этого теста."
      - lines: 12
        text:
          en: "The call with positional arguments: email = \"anna@bloomly.app\", password = \"bloom123\". `page` hands the browser page on to the helper."
          ru: "Вызов с позиционными аргументами: email = \"anna@bloomly.app\", password = \"bloom123\". `page` передаёт помощнику страницу браузера."
      - lines: 13
        text:
          en: "The assertion stays in the test: the helper does the precondition, the test checks the result."
          ru: "Проверка остаётся в тесте: помощник выполняет предусловие, тест проверяет результат."
      - lines: 17
        text:
          en: "Same steps, other data — this time with keyword arguments: each value says which parameter it's for."
          ru: "Те же шаги, другие данные — на этот раз именованными аргументами: каждое значение само говорит, для какого оно параметра."
    runnable: true

  - type: task
    task:
      id: c3-l2-t1
      kind: choice
      keyPoint: kp-arguments
      prompt:
        en: "Petal calls the helper like this. What will be typed into the Email field?"
        ru: "Petal вызывает помощника вот так. Что будет введено в поле Email?"
      code: |
        def log_in(page, email, password):
            page.goto("/login")
            page.get_by_label("Email").fill(email)
            page.get_by_label("Password").fill(password)
            page.get_by_role("button", name="Log in").click()


        # in a test:
        log_in(page, "tulips42", "tom@bloomly.app")
      options:
        - text: "tulips42"
          correct: true
          why: { en: "The second argument goes to the second parameter, `email` — whatever it is.", ru: "Второй аргумент попадает во второй параметр, `email`, — что бы в нём ни было." }
        - text: "tom@bloomly.app"
          why: { en: "That's what was meant, but code doesn't read intentions — positional arguments are matched by order.", ru: "Так задумывалось, но код не читает намерения — позиционные аргументы сопоставляются по порядку." }
        - text: "email"
          why: { en: "`email` is the parameter's name; its value comes from the call.", ru: "`email` — имя параметра, а значение приходит из вызова." }
      optionsCode: true
      hints:
        - { en: "Line up the call with the `def` line: page, email, password.", ru: "Приложи вызов к строке `def`: page, email, password." }
        - { en: "Which argument is in the second position?", ru: "Какой аргумент стоит на втором месте?" }
        - { en: "Second argument → second parameter → `email`.", ru: "Второй аргумент → второй параметр → `email`." }
      praise:
        en: "Exactly — you read what the code does, not what it meant to do."
        ru: "Именно — ты прочита{ла|л}, что код делает, а не что он собирался сделать."
      explain:
        en: "Positional arguments are matched by order, not by meaning. Here they are swapped: the password goes into Email and the email into Password. Bloomly will say \"Please enter a valid email address.\" With keyword arguments — `email=\"tom@bloomly.app\", password=\"tulips42\"` — a mix-up like this is visible at a glance."
        ru: "Позиционные аргументы сопоставляются по порядку, а не по смыслу. Здесь они перепутаны: пароль уходит в Email, а email — в Password. Bloomly ответит «Please enter a valid email address.» С именованными аргументами — `email=\"tom@bloomly.app\", password=\"tulips42\"` — такая путаница видна сразу."

  - type: task
    task:
      id: c3-l2-t3
      kind: parsons
      keyPoint: kp-function
      prompt:
        en: "Put the helper and the test in order. Two lines are wrong — leave them out."
        ru: "Расставь помощника и тест по порядку. Две строки неверные — не используй их."
      lines:
        - "def log_in(page, email, password):"
        - '    page.goto("/login")'
        - '    page.get_by_label("Email").fill(email)'
        - '    page.get_by_label("Password").fill(password)'
        - '    page.get_by_role("button", name="Log in").click()'
        - "def test_maya_can_log_in(page: Page):"
        - '    log_in(page, "maya@bloomly.app", "qa-rocks")'
        - '    expect(page.get_by_role("heading", name="Welcome back, Maya!")).to_be_visible()'
      alt: [[0, 1, 3, 2, 4, 5, 6, 7], [5, 6, 7, 0, 1, 2, 3, 4], [5, 6, 7, 0, 1, 3, 2, 4]]
      distractors:
        - '    log_in("maya@bloomly.app", "qa-rocks")'
        - "def test_maya_can_log_in():"
      checks: { expect: pass }
      hints:
        - { en: "First the definition (the `def log_in` line and its indented steps), then the test that calls it.", ru: "Сначала объявление (строка `def log_in` и шаги под ней с отступом), потом тест, который её вызывает." }
        - { en: "The helper needs the page, and the test must receive it — check both wrong lines for a missing `page`.", ru: "Помощнику нужна страница, а тест должен её получить — проверь обе неверные строки: где пропала `page`?" }
        - { en: "Steps inside the helper: open /login → email → password → click.", ru: "Шаги внутри помощника: открыть /login → email → пароль → клик." }
      praise:
        en: "Assembled and green. You placed the call exactly where the precondition belongs."
