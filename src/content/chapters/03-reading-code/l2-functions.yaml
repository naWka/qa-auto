  - id: c3-l2-k6
    kind: fix
    keyPoint: kp-arguments
    prompt:
      en: "Petal's test crashes: `TypeError: Page.get_by_role() got an unexpected keyword argument 'label'`. Fix the locator so the test passes."
      ru: "Тест Petal падает: `TypeError: Page.get_by_role() got an unexpected keyword argument 'label'`. Исправь локатор, чтобы тест прошёл."
    starter: |
      from playwright.sync_api import Page, expect


      def test_empty_email_shows_an_error(page: Page):
          page.goto("/login")
          page.get_by_role("button", label="Log in").click()
          expect(page.get_by_role("alert")).to_have_text("Please enter your email.")
    solution: |
      from playwright.sync_api import Page, expect


      def test_empty_email_shows_an_error(page: Page):
          page.goto("/login")
          page.get_by_role("button", name="Log in").click()
          expect(page.get_by_role("alert")).to_have_text("Please enter your email.")
    checks:
      expect: pass
      static:
        - rule: regex
          value: 'name\s*=\s*["'']Log in["'']'
          message:
            en: "Keep the button's name in the locator: `name=\"Log in\"`."
            ru: "Оставь в локаторе имя кнопки: `name=\"Log in\"`."
    hints:
      - { en: "Which keyword argument gives `get_by_role` the element's accessible name?", ru: "Какой именованный аргумент передаёт `get_by_role` доступное имя элемента?" }
      - { en: "Replace `label=` with `name=`.", ru: "Замени `label=` на `name=`." }
    explain:
      en: "`get_by_role` takes the element's name as `name=`. `label` is not one of its parameters, so Python refuses the call before anything happens in the browser. Agents mix up `label`, `text` and `name` — the error message tells you which keyword is wrong."
      ru: "`get_by_role` принимает имя элемента как `name=`. `label` среди его параметров нет, поэтому Python отказывается выполнять вызов ещё до того, как в браузере что-то произойдёт. Агенты путают `label`, `text` и `name` — сообщение об ошибке подсказывает, какой аргумент неверный."

