              return page.get_by_test_id("product-card").filter(has_text=name)
        why:
          en: "A helper that finds something must `return` it. Without `return` the test gets None and crashes on the next step."
          ru: "Помощник, который что-то находит, должен вернуть это через `return`. Без `return` тест получает None и падает на следующем шаге."

