      - wrong: 'log_in(page, "bloom123", "anna@bloomly.app")'
        right: 'log_in(page, email="anna@bloomly.app", password="bloom123")'
        why:
          en: "Positional arguments are matched by order, so the password went into Email. With keyword arguments every value says where it goes."
          ru: "Позиционные аргументы сопоставляются по порядку, поэтому пароль ушёл в Email. С именованными аргументами каждое значение само говорит, куда оно идёт."
      - wrong: 'page.get_by_role("button", label="Log in")'
        right: 'page.get_by_role("button", name="Log in")'
        why:
          en: "`get_by_role` has no `label` parameter — an invented setting. Python stops at once: `TypeError: … got an unexpected keyword argument 'label'`."
          ru: "У `get_by_role` нет параметра `label` — настройка выдумана. Python сразу останавливается: `TypeError: … got an unexpected keyword argument 'label'`."
