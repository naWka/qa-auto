          correct: true
        - text:
            en: "It fails: there is no heading “Welcome back, Anna!” on the page"
            ru: "Упадёт: заголовка «Welcome back, Anna!» на странице нет"
          why: { en: "That's what *should* happen — if the check ran. Look at the very end of line 9.", ru: "Так *должно* быть — если бы проверка выполнилась. Посмотри на самый конец строки 9." }
        - text:
            en: "It fails with a SyntaxError: the brackets are missing"
            ru: "Упадёт с SyntaxError: не хватает скобок"
          why: { en: "For Python it's a valid line: it just mentions the method. No error, no check.", ru: "Для Python это допустимая строка: она просто упоминает метод. Ни ошибки, ни проверки." }
      hints:
        - { en: "Read the end of the last line very carefully.", ru: "Очень внимательно прочитай конец последней строки." }
        - { en: "Does the assertion actually *run*?", ru: "Проверка вообще *выполняется*?" }
      praise:
        en: "Right — and that's the scariest kind of green: a test that can't fail."
