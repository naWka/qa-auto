checkPool:
  - id: c3-l3-k1
    kind: input
    keyPoint: kp-indentation
    placement: true
    prompt:
      en: "What will this script print? Type the exact text."
      ru: "Что выведет этот скрипт? Напиши точный текст."
    code: |
      is_gift = False
      if is_gift:
          print("Typing the gift message")
      print("Placing the order")
    answers: ["Placing the order"]
    caseSensitive: true
    run: script
    placeholder: "Printed text"
    hints:
      - { en: "`is_gift` is False, so the indented line is skipped.", ru: "`is_gift` равно False, поэтому строка с отступом пропускается." }
      - { en: "Which line is back at the left edge, outside the `if`?", ru: "Какая строка вернулась к левому краю, за пределы `if`?" }
    explain:
      en: "Line 3 belongs to the `if` and runs only for gifts. Line 4 is back at the left edge, so it runs every time: “Placing the order”."
      ru: "Строка 3 принадлежит `if` и выполняется только для подарков. Строка 4 снова у левого края, поэтому выполняется всегда: «Placing the order»."

  - id: c3-l3-k2
    kind: predict
    keyPoint: kp-indentation
    prompt:
      en: "Petal pasted this test from a chat. Will it pass or fail?"
      ru: "Petal вставил этот тест из чата. Он пройдёт или упадёт?"
    code: |
      from playwright.sync_api import Page, expect


      def test_shop_has_a_search_field(page: Page):
          page.goto("/shop")
        expect(page.get_by_label("Search")).to_be_visible()
    outcome: fail
    reasons:
      - text:
          en: "Line 6 has 2 spaces, the test's lines have 4: Python can't tell which block it belongs to, so the file doesn't start"
          ru: "В строке 6 два пробела, а у строк теста — четыре: Python не понимает, к какому блоку она относится, и файл не запускается"
        correct: true
      - text:
          en: "It passes: indentation is only for readability"
          ru: "Пройдёт: отступы — только для читаемости"
        why: { en: "In Python, indentation *is* the structure. Broken spaces mean a broken file.", ru: "В Python отступы и *есть* структура. Сломанные пробелы — сломанный файл." }
      - text:
          en: "It fails because the shop has no Search field"
          ru: "Упадёт, потому что в магазине нет поля Search"
        why: { en: "It has one — `get_by_label(\"Search\")` is right. The test never gets that far.", ru: "Есть — `get_by_label(\"Search\")` верный. Просто тест до него не доходит." }
    hints:
      - { en: "Count the spaces at the start of lines 5 and 6.", ru: "Посчитай пробелы в начале строк 5 и 6." }
      - { en: "Do 2 spaces match any block that's open — the test (4) or the left edge (0)?", ru: "Подходят ли 2 пробела хоть к одному открытому блоку — к тесту (4) или к левому краю (0)?" }
    explain:
      en: "The test's lines are 4 spaces in; line 6 has 2. That matches neither the test nor the left edge, so Python can't read the file: `unindent does not match any outer indentation level`. Nothing runs. The fix: 4 spaces."
      ru: "Строки теста сдвинуты на 4 пробела, а строка 6 — на 2. Это не совпадает ни с тестом, ни с левым краем, поэтому Python не может прочитать файл: `unindent does not match any outer indentation level`. Не выполняется ничего. Исправление: 4 пробела."

  - id: c3-l3-k3
    kind: fix
    keyPoint: kp-imports
    prompt:
      en: "The run stops with `NameError: name 're' is not defined`. Fix the file so the test passes. Keep the check as it is."
      ru: "Прогон останавливается с `NameError: name 're' is not defined`. Исправь файл, чтобы тест прошёл. Проверку оставь как есть."
    starter: |
      from playwright.sync_api import Page, expect


      def test_logged_out_visit_to_account_opens_login(page: Page):
          page.goto("/account")
          expect(page).to_have_url(re.compile(r"/login"))
    solution: |
      import re

      from playwright.sync_api import Page, expect


      def test_logged_out_visit_to_account_opens_login(page: Page):
          page.goto("/account")
          expect(page).to_have_url(re.compile(r"/login"))
    checks:
      expect: pass
      static:
        - rule: uses
          value: "import re"
          message: { en: "Import the module the check uses: `import re`.", ru: "Импортируй модуль, который использует проверка: `import re`." }
        - rule: uses
          value: "re.compile("
          message: { en: "Keep the check as it is — with `re.compile(...)`.", ru: "Оставь проверку как есть — с `re.compile(...)`." }
    hints:
      - { en: "`re` is Python's own module for text patterns. Is it imported?", ru: "`re` — встроенный модуль Python для текстовых шаблонов. Он импортирован?" }
      - { en: "Python's own modules are imported with `import <name>`.", ru: "Встроенные модули Python импортируют так: `import <имя>`." }
      - { en: "Add `import re` as the very first line.", ru: "Добавь `import re` самой первой строкой." }
    explain:
      en: "`re.compile(...)` uses the `re` module, so the file needs `import re` at the top (Python's own modules first, then a blank line, then installed packages like Playwright). A logged-out visit to /account lands on `/login?next=%2Faccount`, and the pattern finds “/login” in it."
      ru: "`re.compile(...)` использует модуль `re`, поэтому файлу нужен `import re` сверху (сначала встроенные модули Python, потом пустая строка, потом установленные пакеты вроде Playwright). Незалогиненный переход на /account приводит на `/login?next=%2Faccount`, и шаблон находит в адресе «/login»."

  - id: c3-l3-k4
    kind: predict
    keyPoint: kp-imports
    prompt:
      en: "Petal marked a test as skipped. Will the run pass or fail?"
      ru: "Petal пометил тест как пропущенный. Прогон пройдёт или упадёт?"
    code: |
      from playwright.sync_api import Page, expect


      @pytest.mark.skip(reason="BLOOM-342: the Evening slot is being redesigned")
      def test_evening_delivery_can_be_chosen(page: Page):
          page.goto("/checkout")
          page.get_by_label("Evening").check()
          expect(page.get_by_label("Evening")).to_be_checked()
    outcome: fail
    reasons:
      - text:
          en: "It fails while loading the file: `pytest` is used on line 4 but never imported — `NameError`"
          ru: "Упадёт ещё при загрузке файла: `pytest` используется в строке 4, но не импортирован — `NameError`"
        correct: true
      - text:
          en: "It passes: a skipped test can't fail"
          ru: "Пройдёт: пропущенный тест упасть не может"
        why: { en: "True for a skip that works. This one is never applied — Python stops at line 4.", ru: "Верно для работающего skip. Этот так и не применяется — Python останавливается на строке 4." }
      - text:
          en: "It fails: the Evening option can't be checked"
          ru: "Упадёт: вариант Evening нельзя выбрать"
        why: { en: "The steps never run. Look at the top of the file.", ru: "Шаги не выполняются вовсе. Посмотри на начало файла." }
    hints:
      - { en: "Where does the name `pytest` on line 4 come from?", ru: "Откуда берётся имя `pytest` в строке 4?" }
      - { en: "Compare line 1 with the imports in the lesson's example.", ru: "Сравни строку 1 с импортами из примера в уроке." }
    explain:
      en: "Decorators run while the file loads. Line 4 needs the name `pytest`, which was never imported, so pytest stops with `NameError: name 'pytest' is not defined` — the report shows an ERROR, not SKIPPED. The fix: `import pytest` at the top."
      ru: "Декораторы выполняются при загрузке файла. Строке 4 нужно имя `pytest`, которое не импортировали, поэтому pytest останавливается с `NameError: name 'pytest' is not defined` — в отчёте будет ERROR, а не SKIPPED. Исправление: `import pytest` сверху."

  - id: c3-l3-k5
    kind: choice
    keyPoint: kp-decorators
    placement: true
    prompt:
      en: "What does `@pytest.mark.skip(reason=\"BLOOM-311\")` above a test do?"
      ru: "Что делает `@pytest.mark.skip(reason=\"BLOOM-311\")` над тестом?"
    options:
      - text: { en: "pytest doesn't run the test and shows it as skipped, with the reason", ru: "pytest не запускает тест и показывает его как пропущенный, с причиной" }
        correct: true
        why: { en: "Exactly — the test stays in the file but stays out of the run.", ru: "Именно — тест остаётся в файле, но не попадает в прогон." }
      - text: { en: "pytest runs the test but ignores a failure", ru: "pytest запускает тест, но не обращает внимания на падение" }
        why: { en: "That's closer to `xfail` (expected to fail because of a known bug). `skip` doesn't run the test at all.", ru: "Это ближе к `xfail` (ожидаемое падение из-за известного бага). `skip` вообще не запускает тест." }
      - text: { en: "It deletes the test from the file", ru: "Удаляет тест из файла" }
        why: { en: "The code stays; only the run changes. Remove the line, and the test runs again.", ru: "Код остаётся, меняется только прогон. Убери строку — и тест снова запускается." }
      - text: { en: "It's a comment for humans; pytest ignores it", ru: "Это комментарий для людей, pytest его не замечает" }
        why: { en: "Comments start with `#`. A line with `@` changes how pytest treats the function.", ru: "Комментарии начинаются с `#`. Строка с `@` меняет то, как pytest обращается с функцией." }
    hints:
      - { en: "Read the mark's name literally.", ru: "Прочитай название пометки буквально." }
    explain:
      en: "A skip mark keeps a test out of the run and shows it as SKIPPED with the reason — handy for unreleased features. Skipped isn't passed: when an agent reports “all green”, ask how many were skipped."
      ru: "Пометка skip убирает тест из прогона и показывает его как SKIPPED с причиной — удобно для невыпущенных фич. Пропущенный — не пройденный: когда агент докладывает «всё зелёное», спроси, сколько тестов пропущено."

  - id: c3-l3-k6
    kind: choice
    keyPoint: kp-decorators
    prompt:
      en: "pytest stops with `fixture 'shop_page' not found`. What is missing?"
      ru: "pytest останавливается с `fixture 'shop_page' not found`. Чего не хватает?"
    code: |
      import pytest
      from playwright.sync_api import Page, expect


      def shop_page(page: Page):
          page.goto("/shop")
          return page


      def test_shop_lists_6_products(shop_page: Page):
          expect(shop_page.get_by_test_id("results-count")).to_have_text("6 products")
    options:
      - text: { en: "`@pytest.fixture` on the line above `def shop_page`", ru: "`@pytest.fixture` в строке над `def shop_page`" }
        correct: true
        why: { en: "Without it, `shop_page` is an ordinary function, and pytest doesn't know it may hand it to tests.", ru: "Без него `shop_page` — обычная функция, и pytest не знает, что её можно передавать в тесты." }
      - text: { en: "Brackets in the test header: `shop_page()`", ru: "Скобки в заголовке теста: `shop_page()`" }
        why: { en: "In the header's brackets a test lists the *names* it asks for. No calls there.", ru: "В скобках заголовка тест перечисляет *имена*, которые просит. Вызовам там не место." }
      - text: { en: "`import shop_page` at the top", ru: "`import shop_page` сверху" }
        why: { en: "`shop_page` is defined right in this file, so there's nothing to import. It needs a label.", ru: "`shop_page` объявлена прямо в этом файле, импортировать нечего. Ей нужен ярлык." }
      - text: { en: "`return page` at the end of `shop_page`", ru: "`return page` в конце `shop_page`" }
        why: { en: "It's already there, on line 7.", ru: "Он уже есть — в строке 7." }
    hints:
      - { en: "The test asks for `shop_page` by name. How does pytest know which functions can be asked for?", ru: "Тест просит `shop_page` по имени. Как pytest узнаёт, какие функции можно просить?" }
      - { en: "Compare with the lesson's example: what stands above `def shop_page` there?", ru: "Сравни с примером из урока: что там стоит над `def shop_page`?" }
    explain:
      en: "pytest only hands a test the things marked with `@pytest.fixture`. Add the decorator above line 5, and pytest will run `shop_page` first and pass its result into the test."
      ru: "pytest передаёт тесту только то, что помечено `@pytest.fixture`. Добавь декоратор над строкой 5 — и pytest сначала выполнит `shop_page`, а потом передаст результат в тест."

  - id: c3-l3-k7
    kind: find-bug
    keyPoint: kp-call-brackets
    prompt:
      en: "On this build a wrong password shows no error at all — and the test is still green. Change the last line so the test catches the bug."
      ru: "На этой сборке при неверном пароле вообще нет сообщения об ошибке — а тест всё равно зелёный. Измени последнюю строку, чтобы тест поймал баг."
    app: { bugs: [login-no-error] }
    starter: |
      from playwright.sync_api import Page, expect


      def test_wrong_password_shows_an_error(page: Page):
          page.goto("/login")
          page.get_by_label("Email").fill("anna@bloomly.app")
          page.get_by_label("Password").fill("wrong-pass")
          page.get_by_role("button", name="Log in").click()
          assert page.get_by_role("alert")
    solution: |
      from playwright.sync_api import Page, expect


      def test_wrong_password_shows_an_error(page: Page):
          page.goto("/login")
          page.get_by_label("Email").fill("anna@bloomly.app")
          page.get_by_label("Password").fill("wrong-pass")
          page.get_by_role("button", name="Log in").click()
          expect(page.get_by_role("alert")).to_have_text("Invalid email or password.")
    checks:
      expect: fail
      also:
        - app: {}
          expect: pass
      static: [hasAssertion, callsMethods]
    hints:
      - { en: "`assert` on a bare locator is always true. What should look at the page instead?", ru: "`assert` на голом локаторе верен всегда. Что должно посмотреть на страницу вместо него?" }
      - { en: "Use `expect(…)` with a matcher — and don't forget its brackets.", ru: "Используй `expect(…)` с проверкой — и не забудь её скобки." }
      - { en: "For example: `expect(page.get_by_role(\"alert\")).to_have_text(\"Invalid email or password.\")`", ru: "Например: `expect(page.get_by_role(\"alert\")).to_have_text(\"Invalid email or password.\")`" }
    explain:
      en: "`assert page.get_by_role(\"alert\")` only checks that a *description* exists — always true. `expect(…).to_have_text(…)` looks at the real page and waits for the message, so on the buggy build it goes red, as it should, and on a correct build it's green."
      ru: "`assert page.get_by_role(\"alert\")` проверяет лишь, что существует *описание*, — это верно всегда. `expect(…).to_have_text(…)` смотрит на настоящую страницу и ждёт сообщение, поэтому на сломанной сборке тест краснеет, как и должен, а на исправной — зелёный."

  - id: c3-l3-k8
    kind: choice
    keyPoint: kp-call-brackets
    prompt:
      en: "Petal: “I added brackets everywhere, just to be safe.” Which line is now broken?"
      ru: "Petal: «Я на всякий случай поставил скобки везде». Какая строка теперь сломана?"
    options:
      - text: 'page.get_by_test_id("order-row").first().click()'
        correct: true
        why: { en: "`.first` is a property, not a method: it already *is* the first row. Calling it fails with `TypeError: 'Locator' object is not callable`.", ru: "`.first` — свойство, а не метод: это уже и *есть* первая строка. Вызов падает с `TypeError: 'Locator' object is not callable`." }
      - text: "page.reload()"
        why: { en: "A method — the brackets make it run. Correct.", ru: "Метод — скобки его запускают. Всё верно." }
      - text: 'page.get_by_role("link", name="My orders").click()'
        why: { en: "Correct: `click` is an action and needs `()`.", ru: "Верно: `click` — действие, ему нужны `()`." }
      - text: 'expect(page.get_by_test_id("orders-summary")).to_have_text("Showing 6 of 6 orders")'
        why: { en: "Correct: a matcher with its expected value in the brackets.", ru: "Верно: проверка с ожидаемым значением в скобках." }
    optionsCode: true
    hints:
      - { en: "Brackets run a method. Which of these names is a value, not an action?", ru: "Скобки запускают метод. Какое из этих имён — значение, а не действие?" }
      - { en: "Remember the names without brackets: `.first`, `.last`, `page.url`.", ru: "Вспомни имена без скобок: `.first`, `.last`, `page.url`." }
    explain:
      en: "Methods *do* something and need `()`. Properties *are* something: `.first`, `.last`, `page.url`. Brackets everywhere is as wrong as brackets nowhere — read each name."
      ru: "Методы что-то *делают*, и им нужны `()`. Свойства чем-то *являются*: `.first`, `.last`, `page.url`. Скобки везде — такая же ошибка, как скобки нигде: читай каждое имя."
