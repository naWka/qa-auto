id: c3-l3
chapter: c3
title: { en: "Indentation, imports and brackets", ru: "Отступы, импорты и скобки" }
goal:
  en: "Read the shape of a Python test: what belongs to the test, where its names come from, what the `@` lines change — and spot a method that never runs."
  ru: "Читать форму Python-теста: что относится к тесту, откуда берутся имена, что меняют строки с `@`, — и замечать метод, который так и не выполняется."
minutes: 10
keyPoints:
  - id: kp-indentation
    title: { en: "Indentation shows what belongs to what", ru: "Отступ показывает, что чему принадлежит" }
  - id: kp-imports
    title: { en: "Imports say where names come from", ru: "Импорты говорят, откуда берутся имена" }
  - id: kp-decorators
    title: { en: "An @ line changes how pytest treats a function", ru: "Строка с @ меняет то, как pytest обращается с функцией" }
  - id: kp-call-brackets
    title: { en: "A method runs only with ()", ru: "Метод выполняется только со скобками ()" }
terms: [indentation, traceback, brackets, colon, misspelled, up-front, just-to-be-safe]

steps:
  - type: story
    lines:
      - who: kai
        text:
          en: "Petal pushed five new tests this morning. Two of them won't even start. And one is green on my test build — where I broke the login greeting on purpose."
          ru: "Petal утром запушил пять новых тестов. Два даже не запускаются. А один зелёный на моей тестовой сборке — там, где я специально сломал приветствие после логина."
      - who: petal
        text:
          en: "I took the best parts from an answer in a chat. Some of it was JavaScript, but the logic is identical!"
          ru: "Я взял лучшие куски из ответа в чате. Часть была на JavaScript, но логика та же самая!"
      - who: maya
        text:
          en: "The logic, maybe. But Python also cares about the *shape*: the spaces on the left, the imports at the top, the `@` lines and the brackets at the end. Let's learn to read all of them."
          ru: "Логика — может быть. Но для Python важна ещё и *форма*: пробелы слева, импорты сверху, строки с `@` и скобки в конце. Давай научимся всё это читать."

  - type: pretest
    intro:
      en: "Quick guess before we start. Wrong answers are fine — they help you remember."
      ru: "Быстрая догадка перед началом. Ошибаться можно — так лучше запоминается."
    items:
      - id: c3-l3-p1
        kind: choice
        keyPoint: kp-indentation
        prompt:
          en: "A Python test has no curly braces around it. How does Python know which lines belong to the test?"
          ru: "Вокруг Python-теста нет фигурных скобок. Как Python понимает, какие строки относятся к тесту?"
        options:
          - text: { en: "By the indentation: the lines shifted right under `def …:` are the test's lines", ru: "По отступу: строки, сдвинутые вправо под `def …:`, — это строки теста" }
            correct: true
            why: { en: "Exactly — the spaces on the left are the border of the test.", ru: "Именно — пробелы слева и есть граница теста." }
          - text: { en: "By the empty line after the last step", ru: "По пустой строке после последнего шага" }
            why: { en: "Empty lines are only for humans; Python skips them.", ru: "Пустые строки — только для людей, Python их пропускает." }
          - text: { en: "By the word `end` after the last step", ru: "По слову `end` после последнего шага" }
            why: { en: "Python has no `end`. A block ends where its indentation ends.", ru: "В Python нет `end`. Блок заканчивается там, где заканчивается его отступ." }
          - text: { en: "It doesn't: the whole file is one test", ru: "Никак: весь файл — один тест" }
            why: { en: "A file can hold many tests; each `def test_…` starts a new one.", ru: "В файле может быть много тестов; каждый `def test_…` начинает новый." }
        hints:
          - { en: "Look at how the lines under a `def` line start.", ru: "Посмотри, с чего начинаются строки под строкой `def`." }
          - { en: "What is different at the left edge?", ru: "Что отличается у левого края?" }
        explain:
          en: "Python reads the left edge: the lines shifted right under `def …:` belong to the test, and the first line back at the left edge is outside it. Let's see why that matters so much."
          ru: "Python читает левый край: строки, сдвинутые вправо под `def …:`, принадлежат тесту, а первая строка, вернувшаяся к левому краю, уже вне его. Сейчас разберёмся, почему это так важно."

      - id: c3-l3-p2
        kind: choice
        keyPoint: kp-call-brackets
        prompt:
          en: "What does the second line do — `page.reload` without brackets?"
          ru: "Что делает вторая строка — `page.reload` без скобок?"
        code: |
          page.goto("/cart")
          page.reload
        options:
          - text: { en: "Nothing: it only names the method — without `()` it never runs", ru: "Ничего: она только называет метод — без `()` он не выполняется" }
            correct: true
            why: { en: "Right. Brackets are what makes a method run.", ru: "Верно. Выполняет метод именно пара скобок." }
          - text: { en: "Reloads the page — brackets are optional", ru: "Перезагружает страницу — скобки необязательны" }
            why: { en: "In Python, `()` is what runs a method. Without it, nothing happens.", ru: "В Python метод запускают именно `()`. Без них ничего не происходит." }
          - text: { en: "Stops the test with an error", ru: "Останавливает тест с ошибкой" }
            why: { en: "That would be kind. But for Python it's a valid line, so it quietly moves on.", ru: "Это было бы по-доброму. Но для Python это допустимая строка, и он молча идёт дальше." }
        hints:
          - { en: "Compare it with `page.goto(\"/cart\")` on the line above.", ru: "Сравни её с `page.goto(\"/cart\")` строкой выше." }
          - { en: "What comes after `goto`, and what comes after `reload`?", ru: "Что стоит после `goto` и что — после `reload`?" }
        explain:
          en: "`page.reload` only *mentions* the method; `page.reload()` *calls* it. Python doesn't complain about the first one — and that silence is exactly what makes it dangerous."
          ru: "`page.reload` только *упоминает* метод, а `page.reload()` его *вызывает*. На первое Python не жалуется — и именно это молчание делает его опасным."

  - type: theory
    keyPoint: kp-indentation
    title: { en: "Spaces show what belongs where", ru: "Пробелы показывают, что чему принадлежит" }
    body:
      - en: "In a test case, the steps sit under the title. In Python, the steps of a test sit under the `def` line, shifted right by 4 spaces. That shift is called [[indentation]]."
        ru: "В тест-кейсе шаги стоят под названием. В Python шаги теста стоят под строкой `def`, сдвинутые вправо на 4 пробела. Этот сдвиг называется [[отступом|indentation]]."
      - en: "A colon at the end of a line — `def …:`, `if …:`, `for …:` — opens a block. Every line shifted right under it belongs to the block; the first line back at the left edge ends it. No braces, no `end` — just spaces."
        ru: "Двоеточие в конце строки — `def …:`, `if …:`, `for …:` — открывает блок. Каждая строка, сдвинутая вправо под ним, принадлежит блоку; первая строка, вернувшаяся к левому краю, его закрывает. Никаких фигурных скобок и `end` — только пробелы."
      - en: "So the spaces *are* the structure. If they get mangled when code is pasted from a chat, Python refuses to read the file (`IndentationError`). Worse, a line can slip to *another* valid level: out of an `if`, it runs every time; out of the test, it runs once while the file loads — where there is no `page` at all."
        ru: "Значит, пробелы — это и *есть* структура. Если они поедут при вставке кода из чата, Python откажется читать файл (`IndentationError`). Хуже, если строка съедет на *другой* допустимый уровень: выпав из `if`, она выполняется всегда; выпав из теста — один раз при загрузке файла, где никакого `page` нет."
    code: |
      def test_cart_starts_empty(page: Page):     # ":" opens the test's block
          page.goto("/cart")                       # inside: step 1
          expect(page.get_by_test_id("cart-empty")).to_be_visible()  # inside: step 2


      def test_shop_opens(page: Page):            # back at the left edge: a new test
          page.goto("/shop")
    mentor:
      en: "In a review, run your eyes down the left edge first: which lines sit under which header? It takes two seconds and catches a whole class of bugs."
      ru: "На ревью сначала пробеги взглядом по левому краю: какие строки под каким заголовком? Это две секунды — и целый класс багов пойман."

  - type: theory
    keyPoint: kp-imports
    title: { en: "The first lines: where names come from", ru: "Первые строки: откуда берутся имена" }
    body:
      - en: "A test file starts with [[imports|import]]. `from playwright.sync_api import Page, expect` means: “from Playwright, take `Page` and `expect`”. It's like the preconditions of a test case: everything the steps rely on is listed up front."
        ru: "Файл с тестами начинается с [[импортов|import]]. `from playwright.sync_api import Page, expect` значит: «возьми из Playwright `Page` и `expect`». Это как предусловия тест-кейса: всё, на что опираются шаги, перечислено заранее."
      - en: "Use a name that wasn't imported, and the run stops on the first line that needs it: `NameError: name 'expect' is not defined`. The steps before that line did run — the test stops exactly where the missing name is needed."
        ru: "Используй имя, которое не импортировали, — и прогон остановится на первой строке, где оно нужно: `NameError: name 'expect' is not defined`. Шаги до этой строки выполнятся — тест остановится ровно там, где понадобилось недостающее имя."
      - en: "Agents that mix up languages bring JavaScript along — most often the word `await` in front of a step. Our tests use Playwright's *sync* API, where every step already waits on its own. In a normal `def`, `await` is a [[syntax]] error — `SyntaxError: 'await' outside async function` — and the file doesn't start at all."
        ru: "Агенты, которые путают языки, приносят с собой JavaScript — чаще всего слово `await` перед шагом. Наши тесты используют *синхронный* API Playwright, где каждый шаг и так сам дожидается результата. В обычном `def` слово `await` — [[синтаксическая ошибка|syntax]]: `SyntaxError: 'await' outside async function`, и файл не запускается вовсе."
    code: |
      import re                                     # Python's own module for text patterns

      import pytest                                 # pytest: marks and fixtures
      from playwright.sync_api import Page, expect  # Playwright: the page type and expect
    mentor:
      en: "In an [[error message|error-message]], find the line that names the error — in pytest it starts with `E`. Its first word is the kind of problem: `NameError` → a missing import or a typo; `SyntaxError` or `IndentationError` → Python couldn't even read the file. The lines around it — the [[traceback]] — show where: the file, the line number and the line itself, marked with `>`."
      ru: "В [[сообщении об ошибке|error-message]] найди строку, которая называет ошибку, — в pytest она начинается с `E`. Её первое слово — вид проблемы: `NameError` → забытый импорт или опечатка; `SyntaxError` или `IndentationError` → Python даже не смог прочитать файл. Строки вокруг — [[трейсбек|traceback]] — показывают, где это случилось: файл, номер строки и саму строку, отмеченную `>`."

  - type: theory
    keyPoint: kp-decorators
    title: { en: "Lines that start with @", ru: "Строки, которые начинаются с @" }
    body:
      - en: "A line that starts with `@` right above a `def` is a [[decorator]]: a label that changes how pytest treats the [[function]] below it. Read it first — like the status of a test case (“Blocked”, “Known bug”) before its steps."
        ru: "Строка, которая начинается с `@` прямо над `def`, — это [[декоратор|decorator]]: ярлык, который меняет то, как pytest обращается с [[функцией|function]] под ним. Читай его первым — как статус тест-кейса («Blocked», «Known bug») перед шагами."
      - en: "The ones you'll meet most:\n- `@pytest.mark.skip(reason=\"…\")` — don't run this test; report it as SKIPPED with the reason.\n- `@pytest.fixture` — not a test but a preparation step; a test that names it in its brackets gets its result.\n- `@pytest.mark.parametrize(…)` — run the test once per row of data (next lesson)."
        ru: "Чаще всего встретятся:\n- `@pytest.mark.skip(reason=\"…\")` — не запускать этот тест, показать его в отчёте как SKIPPED с причиной.\n- `@pytest.fixture` — это не тест, а шаг подготовки; тест, который назовёт его в своих скобках, получит его результат.\n- `@pytest.mark.parametrize(…)` — запустить тест по разу на каждую строку данных (в следующем уроке)."
      - en: "Decorators come from pytest, so the file needs `import pytest`. And when an agent reports “all tests pass”, look for skip marks: a skipped test is not a passed one."
        ru: "Декораторы берутся из pytest, поэтому файлу нужен `import pytest`. А когда агент докладывает «все тесты прошли», поищи пометки skip: пропущенный тест — не пройденный."
    code: |
      @pytest.mark.skip(reason="BLOOM-311: gift cards are not released yet")
      def test_gift_card_can_be_added_to_cart(page: Page):
          page.goto("/shop?q=gift")
          expect(page.get_by_test_id("results-count")).to_have_text("1 product")
    mentor:
      en: "Agents sometimes “fix” a red test by adding a skip mark. That's hiding, not fixing. Ask for the reason, a ticket number and a plan to remove the mark."
      ru: "Агенты иногда «чинят» красный тест, добавляя пометку skip. Это не исправление, а сокрытие. Спроси причину, номер тикета и когда пометку снимут."

  - type: theory
    keyPoint: kp-call-brackets
    title: { en: "Brackets mean “do it”", ru: "Скобки значат «сделай»" }
    body:
      - en: "`page.reload()` reloads the page. `page.reload` without brackets only *names* the [[method]] — like reading the step “Reload the page” aloud and not doing it. Python sees nothing wrong, and nothing happens."
        ru: "`page.reload()` перезагружает страницу. `page.reload` без скобок только *называет* [[метод|method]] — как прочитать вслух шаг «Перезагрузить страницу» и не сделать его. Python не видит тут ошибки, и ничего не происходит."
      - en: "With an assertion this is dangerous: `expect(heading).to_be_visible` without `()` never checks anything, so the test stays green on any build. Its cousin `assert page.get_by_text(\"Saved\")` is always true: a locator is only a description of where to look, and a description always “exists”."
        ru: "С проверкой это опасно: `expect(heading).to_be_visible` без `()` ничего не проверяет, и тест зелёный на любой сборке. Его родственник `assert page.get_by_text(\"Saved\")` верен всегда: локатор — лишь описание того, где искать, а описание «существует» всегда."
      - en: "Not every name takes brackets: `.first`, `.last` and `page.url` are properties — values, not actions. In a review, check the *end* of each line: actions and checks end with `(…)`."
        ru: "Скобки нужны не всем именам: `.first`, `.last` и `page.url` — свойства, то есть значения, а не действия. На ревью смотри на *конец* каждой строки: действия и проверки заканчиваются на `(…)`."
    code: |
      page.reload()                       # reloads the page
      page.reload                         # only names the method: nothing happens
      expect(heading).to_be_visible()     # checks
      expect(heading).to_be_visible       # checks nothing: green on any build
      assert page.get_by_text("Saved")    # always true
    mentor:
      en: "You met these in chapter 2. They are the most dangerous mistakes in this lesson because nothing turns red: the trainer adds a note under the report, but real pytest just prints PASSED."
      ru: "Ты уже встречал{а|} их во второй главе. Это самые опасные ошибки урока, потому что ничего не краснеет: тренажёр добавит заметку под отчётом, а настоящий pytest просто напишет PASSED."

  - type: example
    title: { en: "One file, all four ideas", ru: "Один файл — все четыре идеи" }
    intro:
      en: "A whole test file, top to bottom: imports, a fixture, a test and a skipped test. Read the left edge, the `@` lines and the ends of the lines. Then run it."
      ru: "Целый файл с тестами, сверху вниз: импорты, фикстура, тест и пропущенный тест. Читай левый край, строки с `@` и концы строк. Потом запусти."
    code: |
      import pytest
      from playwright.sync_api import Page, expect


      @pytest.fixture
      def shop_page(page: Page):
          page.goto("/shop")
          return page


      def test_search_finds_sunny_tulips(shop_page: Page):
          shop_page.get_by_label("Search").fill("tulips")
          expect(shop_page.get_by_test_id("results-count")).to_have_text("1 product")


      @pytest.mark.skip(reason="BLOOM-311: gift cards are not released yet")
      def test_gift_card_can_be_added_to_cart(page: Page):
          page.goto("/shop?q=gift")
          expect(page.get_by_test_id("results-count")).to_have_text("1 product")
    notes:
      - lines: [1, 2]
        text:
          en: "Imports: `pytest` for the `@` lines; `Page` and `expect` from Playwright. Short snippets in this trainer sometimes leave these lines out and get the usual names for free. A real file — and any snippet with its own imports — must import every name it uses."
          ru: "Импорты: `pytest` — для строк с `@`, `Page` и `expect` — из Playwright. В коротких фрагментах тренажёра эти строки иногда опускают, и привычные имена подставляются сами. Настоящий файл — и любой фрагмент со своими импортами — должен импортировать каждое имя, которое использует."
      - lines: 5
        text:
          en: "A decorator: the function below is a fixture — a preparation step, not a test."
          ru: "Декоратор: функция ниже — фикстура, шаг подготовки, а не тест."
      - lines: [7, 8]
        text:
          en: "Indented under the fixture's `def`: open the shop, then `return` hands the page to whoever asked for it."
          ru: "Сдвинуты под `def` фикстуры: открыть магазин, а потом `return` отдаёт страницу тому, кто её попросил."
      - lines: 11
        text:
          en: "The test asks for `shop_page` by name in its brackets. pytest runs the fixture first and passes the result in."
          ru: "Тест просит `shop_page` по имени в своих скобках. pytest сначала выполняет фикстуру и передаёт результат в тест."
      - lines: [12, 13]
        text:
          en: "The test's steps, 4 spaces in. Both lines end with `(…)`, so both really run."
          ru: "Шаги теста, с отступом в 4 пробела. Обе строки заканчиваются на `(…)`, значит, обе действительно выполняются."
      - lines: 16
        text:
          en: "A skip mark with a reason. pytest won't run this test; the report shows SKIPPED and the reason."
          ru: "Пометка skip с причиной. pytest не запустит этот тест; в отчёте будет SKIPPED и причина."
      - lines: [17, 18, 19]
        text:
          en: "This body never runs — today a search for “gift” finds 0 products. When the feature ships, someone deletes line 16 and the test runs again."
          ru: "Это тело не выполняется: сегодня поиск по «gift» находит 0 товаров. Когда фича выйдет, строку 16 удалят — и тест снова начнёт запускаться."
    runnable: true

  - type: task
    task:
      id: c3-l3-t1
      kind: choice
      multi: true
      keyPoint: kp-indentation
      prompt:
        en: "Which of these lines belong to the test? Pick all that apply."
        ru: "Какие из этих строк относятся к тесту? Выбери все подходящие."
      context:
        en: "Petal pasted this test from a chat, and the spacing got lost on the way."
        ru: "Petal вставил этот тест из чата, и отступы по дороге потерялись."
      code: |
        from playwright.sync_api import Page, expect


        def test_bloom10_is_accepted(page: Page):
            page.goto("/cart")
            page.get_by_label("Promo code").fill("BLOOM10")
            page.get_by_role("button", name="Apply").click()
        expect(page.get_by_test_id("promo-message")).to_contain_text("BLOOM10 applied")
      options:
        - text: 'page.goto("/cart")'
          correct: true
          why: { en: "4 spaces in, under the `def` line: step 1.", ru: "Сдвинута на 4 пробела под строкой `def`: шаг 1." }
        - text: 'page.get_by_label("Promo code").fill("BLOOM10")'
          correct: true
          why: { en: "Indented like the line above: step 2.", ru: "С тем же отступом, что и строка выше: шаг 2." }
        - text: 'page.get_by_role("button", name="Apply").click()'
          correct: true
          why: { en: "Still indented: step 3.", ru: "Всё ещё с отступом: шаг 3." }
        - text: 'expect(page.get_by_test_id("promo-message")).to_contain_text("BLOOM10 applied")'
          why: { en: "It starts at the left edge — outside the test. Python would run it once while loading the file.", ru: "Она начинается у левого края — вне теста. Python выполнил бы её один раз, при загрузке файла." }
      optionsCode: true
      hints:
        - { en: "Look only at the left edge of each line.", ru: "Смотри только на левый край каждой строки." }
        - { en: "Three lines are shifted right under `def`. One isn't.", ru: "Три строки сдвинуты вправо под `def`. Одна — нет." }
      praise:
        en: "Right — and you noticed that the line that fell out is the most important one: the check."
        ru: "Верно — и ты заметил{а|}, что выпала самая важная строка: проверка."
      explain:
        en: "Only the indented lines belong to the test. The assertion at the left edge runs while the file loads, and there is no `page` there — pytest stops with `NameError: name 'page' is not defined`, and no test runs at all. The fix: indent it by 4 spaces."
        ru: "К тесту относятся только строки с отступом. Проверка у левого края выполняется при загрузке файла, а там никакого `page` нет — pytest останавливается с `NameError: name 'page' is not defined`, и не запускается ни один тест. Исправление: сдвинуть её на 4 пробела."

