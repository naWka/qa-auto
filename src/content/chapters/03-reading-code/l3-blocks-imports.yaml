      prompt:
        en: "This is Kai's test build: after login the heading says “Welcome back, Silva!” instead of “Welcome back, Anna!”. Will Petal's test pass or fail here?"
        ru: "Это тестовая сборка Кая: после логина заголовок говорит «Welcome back, Silva!» вместо «Welcome back, Anna!». Тест Petal здесь пройдёт или упадёт?"
      app: { bugs: [greeting-wrong-name] }
