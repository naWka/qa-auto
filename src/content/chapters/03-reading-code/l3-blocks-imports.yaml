  - type: task
    task:
      id: c3-l3-t6
      kind: predict
      keyPoint: kp-imports
      prompt:
        en: "Petal translated this test from a JavaScript example in a chat. Will it pass or fail?"
        ru: "Petal перевёл этот тест с примера на JavaScript из чата. Он пройдёт или упадёт?"
      code: |
        from playwright.sync_api import Page, expect


        def open_cart(page: Page):
            page.goto("/cart")


        def test_empty_cart_shows_a_message(page: Page):
            await open_cart(page)
            expect(page.get_by_test_id("cart-empty")).to_have_text("Your cart is empty.")
      outcome: fail
      reasons:
        - text:
            en: "It fails before any step: `await` isn't allowed in our sync tests — `SyntaxError: 'await' outside async function`"
            ru: "Упадёт до первого шага: `await` в наших синхронных тестах не разрешён — `SyntaxError: 'await' outside async function`"
          correct: true
        - text:
            en: "It passes: `await` just waits a little longer, which is harmless"
            ru: "Пройдёт: `await` просто подождёт чуть дольше, это безвредно"
          why: { en: "In the sync API every step already waits on its own. Here `await` isn't extra safety — it's a word Python refuses to read in a normal `def`.", ru: "В синхронном API каждый шаг и так ждёт сам. Здесь `await` — не лишняя страховка, а слово, которое Python отказывается читать в обычном `def`." }
        - text:
            en: "It fails because the cart isn't empty"
            ru: "Упадёт, потому что корзина не пустая"
          why: { en: "Every test starts with a fresh browser and an empty cart. And this test never gets that far.", ru: "Каждый тест начинается с нового браузера и пустой корзины. Да и до проверки этот тест не доходит." }
      hints:
        - { en: "Which word on line 9 comes from JavaScript?", ru: "Какое слово в строке 9 пришло из JavaScript?" }
        - { en: "Our tests use Playwright's *sync* API. Does a normal `def` allow `await`?", ru: "Наши тесты используют *синхронный* API Playwright. Разрешает ли обычный `def` слово `await`?" }
      praise:
        en: "Right. This one is loud: the whole file stops — easy to find, as long as you read the error message."
        ru: "Верно. Эта ошибка громкая: останавливается весь файл — найти её легко, если читать сообщение об ошибке."
      explain:
        en: "`await` belongs to async code. In a normal `def` Python can't even read the file: `SyntaxError: 'await' outside async function`, and no test runs. The fix is to delete the word — the sync API waits for every step on its own."
        ru: "`await` — слово из асинхронного кода. В обычном `def` Python даже не может прочитать файл: `SyntaxError: 'await' outside async function`, и не запускается ни один тест. Исправление — удалить это слово: синхронный API сам дожидается каждого шага."

  - type: task
    task:
      id: c3-l3-t7
      kind: choice
      keyPoint: kp-imports
      prompt:
        en: "The run stops with `NameError: name 'expect' is not defined` on line 9. Petal offers four fixes. Which one do you approve?"
        ru: "Прогон останавливается с `NameError: name 'expect' is not defined` в строке 9. Petal предлагает четыре исправления. Какое ты одобришь?"
      code: |
        from playwright.sync_api import Page


        def test_anna_can_log_in(page: Page):
            page.goto("/login")
            page.get_by_label("Email").fill("anna@bloomly.app")
            page.get_by_label("Password").fill("bloom123")
            page.get_by_role("button", name="Log in").click()
            expect(page.get_by_role("heading", name="Welcome back, Anna!")).to_be_visible()
      options:
        - text: { en: "Line 1: `from playwright.sync_api import Page, expect`", ru: "Строка 1: `from playwright.sync_api import Page, expect`" }
          correct: true
          why: { en: "`expect` exists in Playwright — the file just didn't import it. One word fixes the cause.", ru: "`expect` в Playwright есть — файл просто его не импортировал. Одно слово устраняет причину." }
        - text: { en: "Delete line 9 — then the error is gone", ru: "Удалить строку 9 — и ошибки не будет" }
          why: { en: "The error goes, and so does the only check. The test would be green on any build.", ru: "Уйдёт ошибка — а вместе с ней и единственная проверка. Тест будет зелёным на любой сборке." }
        - text: { en: "Line 9: `assert page.get_by_role(\"heading\", name=\"Welcome back, Anna!\")`", ru: "Строка 9: `assert page.get_by_role(\"heading\", name=\"Welcome back, Anna!\")`" }
          why: { en: "No import needed — but it's always true. You'd swap a loud error for a silent lie.", ru: "Импорт не нужен — но это верно всегда. Громкая ошибка сменится тихим враньём." }
        - text: { en: "A new line at the top: `import expect`", ru: "Новая строка сверху: `import expect`" }
          why: { en: "There is no module called `expect` (`ModuleNotFoundError`). `expect` lives inside `playwright.sync_api`.", ru: "Модуля `expect` не существует (`ModuleNotFoundError`). `expect` живёт внутри `playwright.sync_api`." }
      hints:
        - { en: "Read the error: which name is missing?", ru: "Прочитай ошибку: какого имени не хватает?" }
        - { en: "Where do `Page` and `expect` come from in every test file you've seen?", ru: "Откуда берутся `Page` и `expect` во всех файлах с тестами, которые ты видел{а|}?" }
        - { en: "Pick the fix that keeps the check.", ru: "Выбери исправление, которое сохраняет проверку." }
      praise:
        en: "You approved the right one — the fix that keeps the check. Agents love fixes that make errors disappear; you look at what disappears with them."
        ru: "Ты одобри{ла|л} правильное исправление — то, что сохраняет проверку. Агенты любят исправления, после которых исчезает ошибка; ты смотришь, что исчезает вместе с ней."
      explain:
        en: "`NameError` means Python doesn't know the name. `expect` comes from `playwright.sync_api`, so it goes into line 1 next to `Page`. Deleting or weakening the check would also silence the error — and leave a test that can't fail."
        ru: "`NameError` значит, что Python не знает этого имени. `expect` берётся из `playwright.sync_api`, поэтому его дописывают в строку 1 рядом с `Page`. Удалить или ослабить проверку — тоже способ заглушить ошибку, но тогда останется тест, который не может упасть."

  - type: task
