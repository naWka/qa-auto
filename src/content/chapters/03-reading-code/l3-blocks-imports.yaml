  - type: task
    task:
      id: c3-l3-t3
      kind: fill
      keyPoint: kp-decorators
      prompt:
        en: "Complete the two decorator lines. `cart_page` prepares the cart page for the test; the wedding-bouquet test must not run until the feature ships."
        ru: "Допиши две строки с декораторами. `cart_page` готовит страницу корзины для теста; тест на свадебные букеты не должен запускаться, пока фича не вышла."
      code: |
        import pytest
        from playwright.sync_api import Page, expect


        @pytest.___
        def cart_page(page: Page):
            page.goto("/cart")
            return page


        def test_empty_cart_shows_a_message(cart_page: Page):
            expect(cart_page.get_by_test_id("cart-empty")).to_have_text("Your cart is empty.")


        @pytest.mark.___(reason="BLOOM-318: wedding bouquets are not in the shop yet")
        def test_wedding_bouquet_is_listed(page: Page):
            page.goto("/shop?q=wedding")
            expect(page.get_by_test_id("results-count")).to_have_text("1 product")
      blanks:
        - { answers: [fixture], options: [fixture, mark.skip, test] }
        - { answers: [skip] }
      checks: { expect: pass }
      hints:
        - { en: "The first one is a preparation step that a test asks for by name.", ru: "Первый — шаг подготовки, который тест просит по имени." }
        - { en: "The second mark is named after exactly what it does: don't run, report as skipped.", ru: "Вторая пометка называется ровно так, как работает: не запускать, показать как пропущенный." }
        - { en: "`fixture`, then `skip`.", ru: "`fixture`, потом `skip`." }
      praise:
        en: "Both right. You read the `@` lines before the functions — the same order pytest uses."
        ru: "Оба ответа верны. Ты читаешь строки с `@` раньше функций — в том же порядке, что и pytest."
      explain:
        en: "`@pytest.fixture` turns `cart_page` into a preparation step: the test asks for it by name and gets the opened cart. `@pytest.mark.skip(reason=…)` keeps the wedding test out of the run and shows it as SKIPPED. `xfail` would be wrong here: it means “run it, we expect it to fail because of a known bug”."
        ru: "`@pytest.fixture` превращает `cart_page` в шаг подготовки: тест просит его по имени и получает открытую корзину. `@pytest.mark.skip(reason=…)` убирает свадебный тест из прогона и показывает его как SKIPPED. `xfail` здесь не подошёл бы: он значит «запусти, мы ждём падения из-за известного бага»."

  - type: task
    task:
      id: c3-l3-t4
      kind: predict
