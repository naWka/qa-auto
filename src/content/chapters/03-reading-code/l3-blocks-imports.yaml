      explain:
        en: "Without `()`, Python only looks up the method `to_be_visible` and moves on. The test reaches its end with nothing checked, so pytest reports PASSED on a broken build. The trainer adds a “method never runs” note under the report; real pytest stays silent."
        ru: "Без `()` Python только находит метод `to_be_visible` и идёт дальше. Тест доходит до конца, ничего не проверив, и pytest пишет PASSED на сломанной сборке. Тренажёр добавит под отчётом заметку «метод не выполняется»; настоящий pytest промолчит."

  - type: task
    task:
      id: c3-l3-t5
      kind: review
      keyPoint: kp-call-brackets
      prompt:
        en: "Petal: “BLOOM10 test — green on the first run!” Flag every line that can't catch a broken discount, and pick the problem."
        ru: "Petal: «Тест на BLOOM10 — зелёный с первого прогона!» Отметь каждую строку, которая не поймает сломанную скидку, и выбери проблему."
      testCase:
        id: TC-214
        title: Promo code BLOOM10 gives 10% off
