      - wrong: 'await log_in(page, "anna@bloomly.app", "bloom123")'
        right: 'log_in(page, "anna@bloomly.app", "bloom123")'
        why:
          en: "A JavaScript habit. In our sync tests `await` is a SyntaxError — and the sync API already waits for every step."
          ru: "Привычка из JavaScript. В наших синхронных тестах `await` — это SyntaxError, а синхронный API и так дожидается каждого шага."

  - type: explain
    keyPoint: kp-call-brackets
    prompt:
      en: "In your own words: one of Petal's test files doesn't start at all, and another test is green on a build with a known bug. What do you check first in each case?"
      ru: "Своими словами: один файл с тестами от Petal вообще не запускается, а другой тест зелёный на сборке с известным багом. Что ты проверишь первым в каждом случае?"
    model:
      en: "If a file doesn't start, I read the error message: the line that names the error. `IndentationError` means the spaces got broken; `NameError` means something isn't imported or is misspelled; `SyntaxError: 'await' outside async function` is a JavaScript habit. If a test is green on a broken build, I look at the end of every assertion line: `expect(…).to_be_visible` without `()` never runs, and `assert` on a bare locator is always true. The loud errors are easy; the silent green is the dangerous one."
      ru: "Если файл не запускается, я читаю сообщение об ошибке — строку, которая её называет. `IndentationError` значит, что поехали пробелы; `NameError` — что-то не импортировано или написано с опечаткой; `SyntaxError: 'await' outside async function` — привычка из JavaScript. Если тест зелёный на сломанной сборке, я смотрю на конец каждой строки с проверкой: `expect(…).to_be_visible` без `()` не выполняется, а `assert` на голом локаторе верен всегда. Громкие ошибки найти легко; опасен тихий зелёный."

  - type: phrases
    items:
      - context: code-review
        en: "Line 9 has no brackets: to_be_visible is never called, so this test checks nothing."
        ru: "В строке 9 нет скобок: to_be_visible не вызывается, так что тест ничего не проверяет."
      - context: code-review
        en: "Please add expect to the import on line 1 — the run stops with a NameError."
        ru: "Добавь, пожалуйста, expect в импорт в строке 1 — прогон падает с NameError."
      - context: chat
        en: "The file won't start: IndentationError on line 12. I think the spaces got lost when the code was pasted."
        ru: "Файл не запускается: IndentationError в строке 12. Похоже, отступы потерялись при вставке кода."
      - context: standup
        en: "Two of yesterday's tests were green on the broken build because their assertions had no brackets. I fixed them, and now both catch the bug."
        ru: "Два вчерашних теста были зелёными на сломанной сборке: в их проверках не было скобок. Я исправи{ла|л} их, и теперь оба ловят баг."
      - context: prompt
        en: "This is a pytest project with Playwright's sync API. Don't use async or await, import every name you use, and call every method with brackets."
        ru: "Это проект на pytest с синхронным API Playwright. Не используй async и await, импортируй каждое имя, которое используешь, и вызывай каждый метод со скобками."
