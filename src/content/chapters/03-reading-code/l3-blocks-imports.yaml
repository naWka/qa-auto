            ru: "`assert` на голом локаторе верен всегда: локатор — это описание, а описание «существует» всегда. Кейс ждёт `to_have_text(\"€36.40\")`."
      types: [not-called, weak-assertion, hard-wait, fragile-locator, wrong-data, hallucination]
      hints:
        - { en: "Look at the *end* of each line with an action or a check.", ru: "Смотри на *конец* каждой строки с действием или проверкой." }
        - { en: "Two lines are missing their brackets. One `assert` can never be false.", ru: "В двух строках не хватает скобок. Один `assert` никогда не бывает ложным." }
        - { en: "Lines 7, 8 and 9.", ru: "Строки 7, 8 и 9." }
