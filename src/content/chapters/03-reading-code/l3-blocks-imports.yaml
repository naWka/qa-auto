        - line: 8
          type: not-called
          note:
            en: "No `()` after `to_be_visible`: the check never runs. (And even with brackets, “visible” doesn't say *which* message — the case gives the exact text.)"
            ru: "После `to_be_visible` нет `()`: проверка не выполняется. (И даже со скобками «видно» не говорит, *какое* сообщение, — а кейс даёт точный текст.)"
        - line: 9
          type: weak-assertion
          note:
