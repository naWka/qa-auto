            ru: "Строка 4 открывает магазин. Строки 5–6 выбирают категорию Plants и сортировку по цене по возрастанию. Проверки: строка 7 — ровно 3 карточки, строка 8 — первая карточка Mint Succulent. (Код не изменён.)"
