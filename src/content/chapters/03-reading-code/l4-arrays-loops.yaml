id: c3-l4
chapter: c3
title: { en: "Arrays, loops and unfamiliar code", ru: "Массивы, циклы и незнакомый код" }
goal:
  en: "Read data-driven tests, count the tests a loop creates, and use a strategy (and the agent) to understand code you've never seen."
  ru: "Читать тесты на наборах данных, считать, сколько тестов создаёт цикл, и разбираться в незнакомом коде — по плану и с помощью агента."
minutes: 10
keyPoints:
  - id: kp-array
    title: { en: "An array is a list of test data rows", ru: "Массив — список строк тестовых данных" }
  - id: kp-loop
    title: { en: "for...of repeats the steps for each row", ru: "for...of повторяет шаги для каждой строки" }
  - id: kp-read-strategy
    title: { en: "Read unfamiliar code in four passes — and verify the agent's explanation", ru: "Читаем незнакомый код в четыре прохода — и проверяем объяснение агента" }
terms: [array, loop, test-data, test-case, code-review, ai-agent]

steps:
  - type: story
    lines:
      - who: sofia
        text:
          en: "We deliver to Lisbon, Berlin and Warsaw. Do we have login tests for users from every city?"
          ru: "Мы доставляем в Лиссабон, Берлин и Варшаву. У нас есть тесты логина для пользователей из каждого города?"
      - who: petal
        text:
          en: "Yes! One test, many users — I used a loop. Very elegant."
          ru: "Да! Один тест, много пользователей — я использовал цикл. Очень элегантно."
      - who: maya
        text:
          en: "A loop multiplies tests. It also multiplies a wrong data row. Let's learn to read it — and then to read anything Petal throws at us."
          ru: "Цикл размножает тесты. И неверную строку данных — тоже. Научимся его читать, а потом — читать вообще всё, что выдаст Petal."

  - type: pretest
    intro:
      en: "Quick guess before we start. Wrong answers are fine — they help you remember."
      ru: "Быстрая догадка перед началом. Ошибаться можно — так лучше запоминается."
    items:
      - id: c3-l4-p1
        kind: input
        keyPoint: kp-loop
        prompt:
          en: "Guess: how many tests will this file show in the report?"
          ru: "Угадай: сколько тестов этот файл покажет в отчёте?"
        code: |
          const users = ['anna@bloomly.app', 'tom@bloomly.app', 'maya@bloomly.app'];

          for (const user of users) {
            test(`${user} can open the account page`, async ({ page }) => {
              // ...steps
            });
          }
        answers: ["3", "three"]
        placeholder: "Number of tests"
        hints:
          - { en: "The block with `test(...)` repeats for each item of the list.", ru: "Блок с `test(...)` повторяется для каждого элемента списка." }
          - { en: "Count the emails in square brackets.", ru: "Посчитай email-адреса в квадратных скобках." }
        explain:
          en: "Three emails → the block runs three times → three tests, one per user. Let's see how to read this."
          ru: "Три email → блок выполняется три раза → три теста, по одному на пользователя. Сейчас разберём, как это читать."

  - type: theory
    keyPoint: kp-array
    title: { en: "An array is a test data table", ru: "Массив — это таблица тестовых данных" }
    body:
      - en: "Remember the [[test data|test-data]] table in a [[test case|test-case]]: several rows, the same columns. In code, a list of values is an [[array]]: square brackets, items separated by commas."
        ru: "Вспомни таблицу [[тестовых данных|test-data]] в [[тест-кейсе|test-case]]: несколько строк, одни и те же колонки. В коде список значений — это [[массив|array]]: квадратные скобки, элементы через запятую."
      - en: "Each item has a position number — an index. Counting starts at **0**: `searches[0]` is the first item, `searches[1]` the second."
        ru: "У каждого элемента есть номер позиции — индекс. Счёт начинается с **0**: `searches[0]` — первый элемент, `searches[1]` — второй."
      - en: "Items can be simple strings — or whole rows with named columns, written as objects: `{ email: 'tom@bloomly.app', name: 'Tom' }`. You read a column with a dot: `user.email`."
        ru: "Элементы могут быть простыми строками — или целыми строками таблицы с именованными колонками, записанными как объекты: `{ email: 'tom@bloomly.app', name: 'Tom' }`. Колонку читают через точку: `user.email`."
    code: |
      const searches = ['rose', 'tulips', 'orchid'];
      // searches[0] is 'rose', searches[2] is 'orchid'

      const users = [
        { email: 'anna@bloomly.app', name: 'Anna' },
        { email: 'tom@bloomly.app', name: 'Tom' },
      ];

  - type: theory
    keyPoint: kp-loop
    title: { en: "A loop: the same steps for every row", ru: "Цикл: одни и те же шаги для каждой строки" }
    body:
      - en: "A data-driven test case says: \"Repeat steps 1–4 for each row of the table.\" In code that's a [[loop]]: `for (const user of users) { ... }`."
        ru: "Тест-кейс на наборе данных говорит: «Повтори шаги 1–4 для каждой строки таблицы». В коде это [[цикл|loop]]: `for (const user of users) { ... }`."
      - en: "Read it as: \"for each `user` of `users`, do the block\". On every round, `user` is the next row: first Anna, then Tom."
        ru: "Читай так: «для каждого `user` из `users` выполни блок». В каждом проходе `user` — следующая строка: сначала Анна, потом Том."
      - en: "If the block contains `test(...)`, the loop creates one test per row. Count the rows — that's how many tests you'll see in the report. A template literal in the title gives each test its own name."
        ru: "Если в блоке есть `test(...)`, цикл создаёт по тесту на строку. Посчитай строки — столько тестов будет в отчёте. Шаблонная строка в названии даёт каждому тесту своё имя."
    code: |
      for (const user of users) {
        test(`${user.name} can log in`, async ({ page }) => {
          // ...steps using user.email
        });
      }
      // creates: "Anna can log in", "Tom can log in"

  - type: example
    keyPoint: kp-loop
    title: { en: "A data-driven login test", ru: "Тест логина на наборе данных" }
    intro:
      en: "Petal's loop for three users. One file — three tests in the report."
      ru: "Цикл от Petal для трёх пользователей. Один файл — три теста в отчёте."
    code: |
      import { test, expect } from '@playwright/test';

      const users = [
        { email: 'anna@bloomly.app', password: 'bloom123', name: 'Anna' },
        { email: 'tom@bloomly.app', password: 'tulips42', name: 'Tom' },
        { email: 'maya@bloomly.app', password: 'qa-rocks', name: 'Maya' },
      ];

      for (const user of users) {
        test(`${user.name} can log in`, async ({ page }) => {
          await page.goto('/login');
          await page.getByLabel('Email').fill(user.email);
          await page.getByLabel('Password').fill(user.password);
          await page.getByRole('button', { name: 'Log in' }).click();
          await expect(page.getByRole('heading', { level: 1 })).toHaveText(`Welcome back, ${user.name}!`);
        });
      }
    notes:
      - lines: [3, 4, 5, 6, 7]
        text:
          en: "The test data table: an array of 3 rows. Each row has 3 columns: email, password, name."
          ru: "Таблица тестовых данных: массив из 3 строк. В каждой строке 3 колонки: email, password, name."
      - lines: 9
        text:
          en: "The loop: for each row, `user` is that row."
          ru: "Цикл: для каждой строки `user` — это она."
      - lines: 10
        text:
          en: "One test per row; the title becomes \"Anna can log in\", \"Tom can log in\", \"Maya can log in\"."
          ru: "По тесту на строку; названия — «Anna can log in», «Tom can log in», «Maya can log in»."
      - lines: [12, 13]
        text:
          en: "`user.email` and `user.password` — the columns of the current row."
          ru: "`user.email` и `user.password` — колонки текущей строки."
      - lines: 15
        text:
          en: "The expected result is built from the same row — it changes with the data."
          ru: "Ожидаемый результат собирается из той же строки — он меняется вместе с данными."
      - lines: 17
        text:
          en: "The end of the loop block."
          ru: "Конец блока цикла."
    runnable: true

  - type: task
    task:
      id: c3-l4-t1
      kind: choice
      keyPoint: kp-array
      prompt:
        en: "What will this script print?"
        ru: "Что выведет этот скрипт?"
      code: |
        const cities = ['Lisbon', 'Berlin', 'Warsaw'];
        console.log(cities[1]);
      options:
        - text: "Berlin"
          correct: true
          why: { en: "Index 1 is the second item: counting starts at 0.", ru: "Индекс 1 — второй элемент: счёт начинается с 0." }
        - text: "Lisbon"
          why: { en: "Lisbon is `cities[0]`.", ru: "Lisbon — это `cities[0]`." }
        - text: "Warsaw"
          why: { en: "Warsaw is `cities[2]`.", ru: "Warsaw — это `cities[2]`." }
      optionsCode: true
      run: script
      hints:
        - { en: "Indexes start at 0.", ru: "Индексы начинаются с 0." }
        - { en: "0 → Lisbon, 1 → ?", ru: "0 → Lisbon, 1 → ?" }
      praise:
        en: "Right — the \"counting from zero\" habit is now yours."
        ru: "Верно — привычка «считать с нуля» теперь у тебя есть."
      explain:
        en: "`cities[1]` is the second item, \"Berlin\". Agents and humans both slip on this — `users[1]` is the second user, not the first."
        ru: "`cities[1]` — второй элемент, «Berlin». На этом спотыкаются и агенты, и люди: `users[1]` — второй пользователь, а не первый."

  - type: task
    task:
      id: c3-l4-t2
      kind: input
      keyPoint: kp-loop
      prompt:
        en: "How many tests will this file show in the report?"
        ru: "Сколько тестов этот файл покажет в отчёте?"
      code: |
        const searches = ['rose', 'tulips', 'lavender', 'peony'];

        for (const q of searches) {
          test(`search finds ${q}`, async ({ page }) => {
            await page.goto('/shop');
            await page.getByLabel('Search').fill(q);
            await expect(page.getByTestId('results-count')).toHaveText('1 product');
          });
        }

        test('search with no match shows 0 products', async ({ page }) => {
          await page.goto('/shop');
          await page.getByLabel('Search').fill('cactus');
          await expect(page.getByTestId('results-count')).toHaveText('0 products');
        });
      answers: ["5", "five"]
      placeholder: "Number of tests"
      hints:
        - { en: "Count the tests the loop creates, then look below the loop.", ru: "Посчитай тесты, которые создаёт цикл, а потом посмотри ниже цикла." }
        - { en: "The loop: one test per search term. Below it: one more `test(...)`.", ru: "Цикл: по тесту на каждое слово поиска. Ниже — ещё один `test(...)`." }
        - { en: "4 + 1", ru: "4 + 1" }
      praise:
        en: "Exactly — you didn't stop at the end of the loop."
        ru: "Именно — ты не останови{лась|лся} на конце цикла."
      explain:
        en: "4 search terms → 4 tests from the loop, plus 1 separate negative test = 5. When you review a PR, this count tells you how much coverage it really adds."
        ru: "4 слова поиска → 4 теста из цикла плюс 1 отдельный негативный тест = 5. На ревью PR это число говорит, сколько покрытия он реально добавляет."

  - type: task
    task:
      id: c3-l4-t3
      kind: predict
      keyPoint: kp-loop
      prompt:
        en: "Will the whole run be green? (A run is green only if every test passes.)"
        ru: "Весь прогон будет зелёным? (Прогон зелёный, только если проходит каждый тест.)"
      code: |
        import { test, expect } from '@playwright/test';

        const searches = ['rose', 'tulips', 'orchid', 'daisy'];

        for (const q of searches) {
          test(`search for ${q} finds 1 product`, async ({ page }) => {
            await page.goto('/shop');
            await page.getByLabel('Search').fill(q);
            await expect(page.getByTestId('results-count')).toHaveText('1 product');
          });
        }
      outcome: fail
      reasons:
        - text:
            en: "The \"daisy\" test fails: Bloomly sells no daisies, so it shows \"0 products\""
            ru: "Тест «daisy» упадёт: ромашек в Bloomly нет, будет «0 products»"
          correct: true
        - text:
            en: "The \"orchid\" test fails: White Orchid is out of stock"
            ru: "Тест «orchid» упадёт: White Orchid нет в наличии"
          why: { en: "Search still shows out-of-stock products: \"1 product\".", ru: "Поиск всё равно показывает товары не в наличии: «1 product»." }
        - text:
            en: "Everything passes: a loop counts as one test"
            ru: "Всё пройдёт: цикл считается одним тестом"
          why: { en: "The loop creates 4 separate tests, each with its own result.", ru: "Цикл создаёт 4 отдельных теста, у каждого свой результат." }
      hints:
        - { en: "Check each data row against Bloomly's products.", ru: "Сверь каждую строку данных с товарами Bloomly." }
        - { en: "Products: Rose Bouquet, Sunny Tulips, Lavender Pot, Peony Dream, Mint Succulent, White Orchid.", ru: "Товары: Rose Bouquet, Sunny Tulips, Lavender Pot, Peony Dream, Mint Succulent, White Orchid." }
      praise:
        en: "Right — you checked every data row against the app, like a data table in a test case."
        ru: "Верно — ты сверил{а|} каждую строку данных с приложением, как таблицу в тест-кейсе."
      explain:
        en: "3 tests pass, \"search for daisy finds 1 product\" fails. The report names the failing row thanks to the template literal in the title. Here the data row is wrong, not the app."
        ru: "3 теста проходят, «search for daisy finds 1 product» падает. Благодаря шаблонной строке в названии отчёт показывает, какая строка упала. Здесь ошибка в строке данных, а не в приложении."

  - type: task
    task:
      id: c3-l4-t4
      kind: review
      keyPoint: kp-array
      prompt:
        en: "Review Petal's data-driven login test. One data row is wrong, and one check only works for one row."
        ru: "Сделай ревью теста логина на наборе данных от Petal. Одна строка данных неверная, а одна проверка работает только для одной строки."
      testCase:
        id: TC-020
        title: Registered users can log in
        preconditions: ["Users: anna@bloomly.app / bloom123 (Anna), tom@bloomly.app / tulips42 (Tom)"]
        steps:
          - { action: "Open the login page" }
          - { action: "Log in with the user's email and password", data: "each user from the table" }
          - { action: "Look at the account heading", expected: "\"Welcome back, <first name>!\"" }
      code: |
        import { test, expect } from '@playwright/test';

        const users = [
          { email: 'anna@bloomly.app', password: 'bloom123', name: 'Anna' },
          { email: 'tom@bloomly.app', password: 'bloom123', name: 'Tom' },
        ];

        for (const user of users) {
          test(`${user.name} can log in`, async ({ page }) => {
            await page.goto('/login');
            await page.getByLabel('Email').fill(user.email);
            await page.getByLabel('Password').fill(user.password);
            await page.getByRole('button', { name: 'Log in' }).click();
            await expect(page.getByRole('heading', { level: 1 })).toHaveText('Welcome back, Anna!');
          });
        }
      issues:
        - line: 5
          type: wrong-data
          note:
            en: "Tom's password is 'tulips42'. 'bloom123' is Anna's — copy-pasted from the row above."
            ru: "Пароль Тома — 'tulips42'. 'bloom123' — пароль Анны, скопирован из строки выше."
        - line: 14
          type: wrong-assertion
          note:
            en: "The expected text is hard-coded for Anna. It must come from the row: `` `Welcome back, ${user.name}!` ``."
            ru: "Ожидаемый текст жёстко прописан для Анны. Он должен браться из строки: `` `Welcome back, ${user.name}!` ``."
      types: [wrong-data, wrong-assertion, missing-await, fragile-locator, hard-wait]
      hints:
        - { en: "Compare each row with the test case table.", ru: "Сравни каждую строку с таблицей тест-кейса." }
        - { en: "Inside the loop: does every line use `user.…` where the data should change?", ru: "Внутри цикла: каждая ли строка использует `user.…` там, где данные должны меняться?" }
        - { en: "Line 5: Tom's password. Line 14: whose name is in the expected text?", ru: "Строка 5: пароль Тома. Строка 14: чьё имя в ожидаемом тексте?" }
      praise:
        en: "Both found. A loop multiplies mistakes — and your review just stopped two of them."
        ru: "Обе найдены. Цикл размножает ошибки — а твоё ревью только что остановило две."
      explain:
        en: "Two classic loop bugs: a copy-pasted data row, and a value inside the loop that should come from the row but is hard-coded. Tom's test would fail at login and, even with the right password, at the heading."
        ru: "Две классические ошибки цикла: строка данных, скопированная из соседней, и значение внутри цикла, которое должно браться из строки, но прописано жёстко. Тест Тома упал бы на логине, а с верным паролем — на заголовке."

  - type: task
    task:
      id: c3-l4-t5
      kind: fill
      keyPoint: kp-loop
      prompt:
        en: "Complete the loop so that it creates one checkout test per city."
        ru: "Допиши цикл, чтобы он создавал по одному тесту оформления заказа на каждый город."
      context:
        en: "The cart already has one Rose Bouquet, so the checkout page is available."
        ru: "В корзине уже лежит один Rose Bouquet, поэтому страница оформления заказа доступна."
      app: { state: { cart: [{ id: rose-bouquet, qty: 1 }] } }
      code: |
        import { test, expect } from '@playwright/test';

        const cities = ['Lisbon', 'Berlin', 'Warsaw'];

        ___ (const city ___ cities) {
          test(`checkout delivers to ${city}`, async ({ page }) => {
            await page.goto('/checkout');
            await page.getByLabel('City').selectOption(city);
            await expect(page.getByLabel('City')).toHaveValue(city);
          });
        }
      blanks:
        - { answers: [for], options: [for, test, if] }
        - { answers: [of], options: [of, in, from] }
      checks: { expect: pass, minTests: 3 }
      hints:
        - { en: "The pattern is `for (const item of list) {`.", ru: "Шаблон: `for (const item of list) {`." }
        - { en: "`in` exists too, but it gives positions (0, 1, 2), not the city names.", ru: "`in` тоже существует, но даёт позиции (0, 1, 2), а не названия городов." }
      praise:
        en: "Three green tests from one block. Data-driven testing, read and verified."
        ru: "Три зелёных теста из одного блока. Тестирование на наборах данных — прочитано и проверено."
      explain:
        en: "`for (const city of cities)` — for each city of the list. With `in`, `city` would be '0', '1', '2', and `selectOption` would fail."
        ru: "`for (const city of cities)` — для каждого города из списка. С `in` в `city` попали бы '0', '1', '2', и `selectOption` бы упал."

  - type: theory
    keyPoint: kp-read-strategy
    title: { en: "How to read code you didn't write", ru: "Как читать код, который писал{а|} не ты" }
    body:
      - en: "Petal's PR has 300 lines. Don't read it top to bottom like a novel. Read it like a test case from a colleague, in four passes:"
        ru: "В PR от Petal 300 строк. Не читай его сверху вниз, как роман. Читай как тест-кейс коллеги — в четыре прохода:"
      - en: "1) **Titles** — what does each test claim to check? 2) **Steps** — do the actions match the scenario? 3) **Assertions** — is every expected result really checked, with the right text? 4) **Data** — constants, arrays, arguments: is every value correct?"
        ru: "1) **Названия** — что каждый тест обещает проверить? 2) **Шаги** — совпадают ли действия со сценарием? 3) **Проверки** — каждый ли ожидаемый результат действительно проверяется, и с верным текстом? 4) **Данные** — константы, массивы, аргументы: каждое ли значение верное?"
      - en: "Stuck on a line? Ask the [[agent|ai-agent]]: \"Explain this test line by line.\" Then verify the explanation against the code and the app — an agent can explain its own bug with total confidence."
        ru: "Застрял{а|} на строке? Спроси [[агента|ai-agent]]: «Explain this test line by line». А потом сверь объяснение с кодом и приложением — агент может с полной уверенностью объяснить собственный баг."
    figure: review-checklist
    mentor:
      en: "You already do this with other people's test cases: title, steps, expected result, data. Same eyes, new format."
      ru: "Ты уже делаешь это с чужими тест-кейсами: название, шаги, ожидаемый результат, данные. Те же глаза, новый формат."

  - type: task
    task:
      id: c3-l4-t6
      kind: choice
      keyPoint: kp-read-strategy
      prompt:
        en: "You open a 120-line test file the agent generated overnight. What do you read first?"
        ru: "Ты открываешь файл на 120 строк, который агент сгенерировал за ночь. Что читаешь первым?"
      options:
        - text: { en: "The test titles — to know what each test claims to check", ru: "Названия тестов — чтобы понять, что каждый обещает проверить" }
          correct: true
          why: { en: "Titles are the map. Then you check whether steps and assertions keep the promise.", ru: "Названия — это карта. Потом проверяешь, выполняют ли шаги и проверки это обещание." }
        - text: { en: "Every line from top to bottom, very carefully", ru: "Каждую строку сверху вниз, очень внимательно" }
          why: { en: "You'll get lost in details before you know what matters. Passes first, details later.", ru: "Утонешь в деталях раньше, чем поймёшь, что важно. Сначала проходы, детали потом." }
        - text: { en: "Nothing — just run it. If it's green, it's fine", ru: "Ничего — просто запустить. Зелёный — значит, всё хорошо" }
          why: { en: "Green tests can check nothing, or the wrong thing. You've seen both this week.", ru: "Зелёные тесты могут не проверять ничего — или проверять не то. На этой неделе ты видел{а|} и то, и другое." }
        - text: { en: "The import line, to see which libraries are used", ru: "Строку import — посмотреть, какие библиотеки используются" }
          why: { en: "It's almost always the same line. It tells you nothing about the tests.", ru: "Это почти всегда одна и та же строка. О тестах она ничего не говорит." }
      hints:
        - { en: "Think of how you review a colleague's test cases.", ru: "Вспомни, как ты ревьюишь тест-кейсы коллеги." }
        - { en: "Pass 1 of the four passes.", ru: "Проход 1 из четырёх." }
      praise:
        en: "Yes — start with the map, then walk the streets."
        ru: "Да — сначала карта, потом улицы."
      explain:
        en: "Titles first, then steps, assertions, data. The titles also become your checklist: every title is a promise the assertions must keep."
        ru: "Сначала названия, потом шаги, проверки, данные. Названия заодно становятся чек-листом: каждое — обещание, которое должны выполнить проверки."

  - type: task
