      - context: code-review
        en: "Could you use parametrize instead of the loop, so that every status shows up as its own test in the report?"
        ru: "Можешь заменить цикл на parametrize, чтобы каждый статус был в отчёте отдельным тестом?"
      - context: prompt
        en: "Rewrite this test with @pytest.mark.parametrize: one test per promo code, with the code as the id. Keep the same data and steps."
        ru: "Перепиши этот тест через @pytest.mark.parametrize: по тесту на промокод, сам код — в id. Данные и шаги оставь прежними."
