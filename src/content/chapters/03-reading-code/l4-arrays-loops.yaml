  - type: explain
    keyPoint: kp-parametrize
    prompt:
      en: "In your own words: what's the difference between a loop inside a test and @pytest.mark.parametrize — and why does it matter in review?"
      ru: "Своими словами: чем цикл внутри теста отличается от @pytest.mark.parametrize — и почему это важно на ревью?"
    model:
      en: "A loop repeats steps inside one test: if one item fails, the whole test is red, the items after it don't run, and the report doesn't say which item broke. parametrize turns every data row into its own test with its own result and an id like `test_orders_filter[Shipped-1]`, so I see exactly which row failed, and the other rows still run. When I review a data-driven test, I read the decorator first — the data table — count the rows, check every value against the app, and make sure the steps and the expected result use the row's values, not hard-coded ones."
      ru: "Цикл повторяет шаги внутри одного теста: если падает один элемент, красный весь тест, следующие элементы не выполняются, а по отчёту не понять, какой сломался. parametrize превращает каждую строку данных в отдельный тест со своим результатом и id вроде `test_orders_filter[Shipped-1]`, поэтому я точно вижу, какая строка упала, а остальные строки всё равно выполняются. На ревью теста на наборе данных я сначала читаю декоратор — таблицу данных, — считаю строки, сверяю каждое значение с приложением и проверяю, что шаги и ожидаемый результат берут значения из строки, а не прописаны жёстко."

