  - id: c3-l4-k8
    kind: input
    keyPoint: kp-loop
    prompt:
      en: "What will the second printed line be? Type the exact text."
      ru: "Какой будет вторая напечатанная строка? Напиши точный текст."
    code: |
      const cities = ['Lisbon', 'Berlin', 'Warsaw'];

      for (const city of cities) {
        console.log(`Delivery to ${city}`);
      }
