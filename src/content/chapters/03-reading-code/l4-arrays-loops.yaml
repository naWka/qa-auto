    run: script
    hints:
      - { en: "The loop prints one line per city, in order.", ru: "Цикл печатает по строке на каждый город, по порядку." }
      - { en: "In round 2, `city` is the second city.", ru: "Во втором проходе `city` — второй город." }
    explain:
      en: "Round 1: \"Delivery to Lisbon\", round 2: \"Delivery to Berlin\", round 3: \"Delivery to Warsaw\"."
      ru: "Проход 1: «Delivery to Lisbon», проход 2: «Delivery to Berlin», проход 3: «Delivery to Warsaw»."
