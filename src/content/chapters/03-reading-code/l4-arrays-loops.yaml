  - id: c3-l4-k5
    kind: predict
    keyPoint: kp-loop
    prompt:
      en: "Will this test pass?"
      ru: "Этот тест пройдёт?"
    code: |
      from playwright.sync_api import Page, expect


      def test_can_add_each_product_to_the_cart(page: Page):
          page.goto("/shop")
          for product in ["Rose Bouquet", "Peony Dream", "Mint Succulent"]:
              card = page.get_by_test_id("product-card").filter(has_text=product)
              card.get_by_role("button", name="Add to cart").click()
              expect(page.get_by_test_id("cart-count")).to_have_text("1")
    outcome: fail
    reasons:
      - text:
          en: "No: all rounds of the loop share one page and one cart — after the second click the count is 2, not 1"
          ru: "Нет: у всех проходов цикла одна страница и одна корзина — после второго клика счётчик 2, а не 1"
        correct: true
      - text:
          en: "Yes: every round of the loop starts with an empty cart"
          ru: "Да: каждый проход цикла начинается с пустой корзины"
        why: { en: "Only separate tests start clean (with parametrize, each one gets a fresh `page`). Rounds of a loop share everything.", ru: "С чистого листа начинаются только отдельные тесты (с parametrize каждый получает новый `page`). У проходов цикла всё общее." }
      - text:
          en: "No: Mint Succulent is out of stock"
          ru: "Нет: Mint Succulent нет в наличии"
        why: { en: "Only White Orchid is out of stock — and the test fails before it gets to Mint Succulent.", ru: "Нет в наличии только White Orchid — а тест падает раньше, чем доходит до Mint Succulent." }
    hints:
      - { en: "How many tests does this file have — and how many pages?", ru: "Сколько в этом файле тестов — и сколько страниц?" }
      - { en: "What does the cart count show after the second click?", ru: "Что покажет счётчик корзины после второго клика?" }
    explain:
      en: "One test, one page, one cart. Round 1: count \"1\" — pass. Round 2: Peony Dream joins Rose Bouquet, the count is \"2\" and the check fails. Round 3 never runs. With parametrize, each product would get its own fresh page and an empty cart."
      ru: "Один тест, одна страница, одна корзина. Проход 1: счётчик «1» — проверка проходит. Проход 2: к Rose Bouquet добавляется Peony Dream, счётчик «2», проверка падает. Проход 3 не выполняется. С parametrize каждый товар получил бы свою новую страницу и пустую корзину."

  - id: c3-l4-k6
