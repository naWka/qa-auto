        ru: "Я посмотре{ла|л} тест логина на наборе данных от Petal: три строки, в одной неверные данные. Запроси{ла|л} изменения."

checkPool:
  - id: c3-l4-k1
    kind: input
    keyPoint: kp-parametrize
    placement: true
    prompt:
      en: "How many tests will this file create?"
      ru: "Сколько тестов создаст этот файл?"
    code: |
      STATUSES = ["Processing", "Shipped", "Delivered", "Cancelled"]


      @pytest.mark.parametrize("status", STATUSES)
      def test_orders_can_be_filtered_by_status(page: Page, status):
          # Anna is already logged in (saved login state)
          page.goto("/orders")
          page.get_by_label("Status").select_option(status)
          expect(page.get_by_test_id("order-row").first).to_contain_text(status)
    answers: ["4", "four"]
    placeholder: "Number of tests"
    hints:
      - { en: "One test per item of `STATUSES`.", ru: "По тесту на каждый элемент `STATUSES`." }
      - { en: "Count the strings in the square brackets.", ru: "Посчитай строки в квадратных скобках." }
    explain:
      en: "4 statuses → 4 tests: `test_orders_can_be_filtered_by_status[Processing]`, `[Shipped]`, `[Delivered]` and `[Cancelled]`."
      ru: "4 статуса → 4 теста: `test_orders_can_be_filtered_by_status[Processing]`, `[Shipped]`, `[Delivered]` и `[Cancelled]`."

  - id: c3-l4-k2
    kind: choice
    keyPoint: kp-list
    prompt:
      en: "What will this script print?"
      ru: "Что выведет этот скрипт?"
    code: |
      products = ["Rose Bouquet", "Sunny Tulips", "Lavender Pot"]
      print(products[0], len(products))
    options:
      - text: "Rose Bouquet 3"
        correct: true
        why: { en: "Index 0 is the first item, and `len()` counts all three items.", ru: "Индекс 0 — первый элемент, а `len()` считает все три элемента." }
      - text: "Sunny Tulips 3"
        why: { en: "That's `products[1]`. Counting starts at 0.", ru: "Это `products[1]`. Счёт начинается с 0." }
      - text: "Rose Bouquet 2"
        why: { en: "`len()` counts the items — 3. The last *index* is 2, because counting starts at 0.", ru: "`len()` считает элементы — их 3. Последний *индекс* — 2, потому что счёт идёт с 0." }
    optionsCode: true
    run: script
    hints:
      - { en: "Counting positions starts at 0.", ru: "Позиции считаются с 0." }
      - { en: "`len()` counts items, not positions.", ru: "`len()` считает элементы, а не позиции." }
    explain:
      en: "`products[0]` → \"Rose Bouquet\", the first item; `len(products)` → 3. `print` with two values puts a space between them."
      ru: "`products[0]` → «Rose Bouquet», первый элемент; `len(products)` → 3. `print` с двумя значениями ставит между ними пробел."

  - id: c3-l4-k3
    kind: review
    keyPoint: kp-dict
    prompt:
      en: "Review Petal's data-driven search test. Flag the wrong data row and any other problem."
      ru: "Сделай ревью теста поиска на наборе данных от Petal. Отметь неверную строку данных и любые другие проблемы."
    context:
      en: "Bloomly's products: Rose Bouquet, Sunny Tulips, Lavender Pot, Peony Dream, Mint Succulent, White Orchid. Search looks for the text in product names."
      ru: "Товары Bloomly: Rose Bouquet, Sunny Tulips, Lavender Pot, Peony Dream, Mint Succulent, White Orchid. Поиск ищет текст в названиях товаров."
    code: |
      import pytest
      from playwright.sync_api import Page, expect

      CASES = [
          {"q": "rose", "expected": "1 product"},
          {"q": "pot", "expected": "1 product"},
          {"q": "tulip", "expected": "2 products"},
      ]


      @pytest.mark.parametrize("case", CASES, ids=["rose", "pot", "tulip"])
      def test_search_shows_the_right_count(page: Page, case):
          page.goto("/shop")
          page.get_by_label("Search").fill(case["q"])
          assert page.get_by_test_id("results-count").text_content() == case["expected"]
    issues:
      - line: 7
        type: wrong-data
        note:
          en: "Only Sunny Tulips contains \"tulip\": the expected result is \"1 product\"."
          ru: "«tulip» есть только в Sunny Tulips: ожидаемый результат — \"1 product\"."
      - line: 15
        type: weak-assertion
        note:
          en: "`text_content()` reads the text once, with no retry: if the count updates a moment later, the test fails at random. Use `expect(page.get_by_test_id(\"results-count\")).to_have_text(case[\"expected\"])`."
          ru: "`text_content()` читает текст один раз, без повторов: если счётчик обновится чуть позже, тест упадёт случайно. Нужно `expect(page.get_by_test_id(\"results-count\")).to_have_text(case[\"expected\"])`."
    types: [wrong-data, weak-assertion, wrong-assertion, hard-wait, no-assertion]
    hints:
      - { en: "Check every row against the product list in the context.", ru: "Сверь каждую строку со списком товаров из контекста." }
      - { en: "Then look at how the count is checked: does it wait and retry?", ru: "Потом посмотри, как проверяется счётчик: ждёт ли проверка и повторяет ли попытки?" }
      - { en: "Line 7 and line 15.", ru: "Строка 7 и строка 15." }
    explain:
      en: "One wrong row breaks one test — `test_search_shows_the_right_count[tulip]`. One weak check in the function weakens every test the decorator creates."
      ru: "Одна неверная строка ломает один тест — `test_search_shows_the_right_count[tulip]`. Одна слабая проверка в функции ослабляет каждый тест, который создаёт декоратор."

