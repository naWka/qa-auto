        ru: "Теперь сверь объяснение Petal с приложением: растения — Lavender Pot €18.00, Mint Succulent €12.00, White Orchid €29.00. Значит, 3 карточки, самое дешёвое первым — Mint Succulent. Объяснение верное. (Настоящий агент каждый раз ответит другими словами — но способ спрашивать и проверять остаётся тем же.)"

  - type: task
    task:
      id: c3-l4-t8
      kind: vocab
      mode: cloze
      sentence:
        en: "Petal put the test data into an ___ and used a loop to create one test per row."
        ru: "Petal сложил тестовые данные в массив и с помощью цикла создал по тесту на каждую строку."
      answer: array
      options: [array, object, string]

  - type: mistakes
    title: { en: "Typical loop and data mistakes", ru: "Типичные ошибки с циклами и данными" }
    items:
      - wrong: "for (const user in users) {"
        right: "for (const user of users) {"
        why:
          en: "`in` gives positions (0, 1, 2), not the rows. Agents mix them up; one letter changes everything."
          ru: "`in` даёт позиции (0, 1, 2), а не строки. Агенты их путают; одна буква меняет всё."
      - wrong: "test('user can log in', async ({ page }) => {"
        right: "test(`${user.name} can log in`, async ({ page }) => {"
        why:
          en: "Inside a loop every test gets the same title: Playwright reports duplicate titles, and you can't tell which row failed."
          ru: "Внутри цикла все тесты получат одно название: Playwright сообщит о дублях, и не поймёшь, какая строка упала."
      - wrong: "await expect(heading).toHaveText('Welcome back, Anna!');"
        right: "await expect(heading).toHaveText(`Welcome back, ${user.name}!`);"
        why:
          en: "A hard-coded expected value inside a loop fits only one row."
          ru: "Жёстко прописанное ожидаемое значение внутри цикла подходит только одной строке."
      - wrong: "const firstUser = users[1];"
        right: "const firstUser = users[0];"
        why:
          en: "Indexes start at 0. `users[1]` is the second user."
          ru: "Индексы начинаются с 0. `users[1]` — второй пользователь."

  - type: explain
    keyPoint: kp-read-strategy
    prompt:
      en: "In your own words: how do you read a test file you've never seen, generated by an agent?"
      ru: "Своими словами: как ты читаешь незнакомый тестовый файл, сгенерированный агентом?"
    model:
      en: "I read it in passes, like a test case. First the titles: what does each test promise? Then the steps: do they match the scenario? Then the assertions: is every expected result checked, with the exact text? Then the data: constants, arrays and arguments — is every value right, and does a loop create the number of tests I expect? If a line is unclear, I ask the agent to explain it line by line without changing the code, and I check its explanation against the code and the app."
      ru: "Я читаю его проходами, как тест-кейс. Сначала названия: что обещает каждый тест? Потом шаги: совпадают ли они со сценарием? Потом проверки: каждый ли ожидаемый результат проверяется, и с точным текстом? Потом данные: константы, массивы и аргументы — каждое ли значение верное и создаёт ли цикл столько тестов, сколько я жду? Если строка непонятна, прошу агента объяснить построчно, не меняя код, и сверяю его объяснение с кодом и приложением."

  - type: phrases
    items:
      - context: code-review
        en: "The data row for Tom has the wrong password; the rest of the loop looks good."
        ru: "В строке данных Тома неверный пароль; остальной цикл выглядит хорошо."
      - context: code-review
        en: "Could you make the test title unique per row, e.g. include the user's name?"
        ru: "Можешь сделать название теста уникальным для каждой строки, например добавить имя пользователя?"
      - context: prompt
        en: "Explain this test line by line. Don't change the code."
        ru: "Объясни этот тест построчно. Код не меняй."
      - context: prompt
        en: "List every assertion in this file and what it checks."
        ru: "Перечисли все проверки в этом файле и что каждая проверяет."
      - context: standup
        en: "I reviewed Petal's data-driven login test: three rows, one had wrong data. I requested changes."
        ru: "Я посмотре{ла|л} тест логина на наборе данных от Petal: три строки, в одной неверные данные. Запроси{ла|л} изменения."
      - context: meeting
        en: "Before I approve it, I want to understand every line — I'll ask Petal to walk me through it first."
        ru: "Прежде чем одобрить, хочу понимать каждую строку — сначала попрошу Petal пройтись со мной по коду."
        note:
          en: "A calm, professional way to say \"I won't approve what I don't understand\"."
          ru: "Спокойный профессиональный способ сказать «я не одобряю то, чего не понимаю»."

checkPool:
  - id: c3-l4-k1
    kind: input
    keyPoint: kp-loop
    placement: true
    prompt:
      en: "How many tests will this file create?"
      ru: "Сколько тестов создаст этот файл?"
    code: |
      const statuses = ['Processing', 'Shipped', 'Delivered', 'Cancelled'];

      for (const status of statuses) {
        test(`orders can be filtered by ${status}`, async ({ page }) => {
          // Anna is already logged in (saved login state)
          await page.goto('/orders');
          await page.getByLabel('Status').selectOption(status);
          await expect(page.getByTestId('order-row').first()).toContainText(status);
        });
      }
    answers: ["4", "four"]
    placeholder: "Number of tests"
    hints:
      - { en: "One test per item of `statuses`.", ru: "По тесту на каждый элемент `statuses`." }
      - { en: "Count the strings in the square brackets.", ru: "Посчитай строки в квадратных скобках." }
    explain:
      en: "4 statuses → 4 tests: \"orders can be filtered by Processing\", \"…Shipped\", \"…Delivered\", \"…Cancelled\"."
      ru: "4 статуса → 4 теста: «orders can be filtered by Processing», «…Shipped», «…Delivered», «…Cancelled»."

  - id: c3-l4-k2
    kind: choice
    keyPoint: kp-array
    prompt:
      en: "What will this script print?"
      ru: "Что выведет этот скрипт?"
    code: |
      const products = ['Rose Bouquet', 'Sunny Tulips', 'Lavender Pot'];
      console.log(products[0]);
    options:
      - text: "Rose Bouquet"
        correct: true
        why: { en: "Index 0 is the first item.", ru: "Индекс 0 — первый элемент." }
      - text: "Sunny Tulips"
        why: { en: "That's `products[1]`.", ru: "Это `products[1]`." }
      - text: "undefined"
        why: { en: "Index 0 exists — it's the first item.", ru: "Индекс 0 существует — это первый элемент." }
    optionsCode: true
    run: script
    hints:
      - { en: "Counting starts at 0.", ru: "Счёт начинается с 0." }
    explain:
      en: "`products[0]` → \"Rose Bouquet\", the first item of the list."
      ru: "`products[0]` → «Rose Bouquet», первый элемент списка."

  - id: c3-l4-k3
    kind: review
    keyPoint: kp-array
    prompt:
      en: "Review Petal's data-driven search test. Flag the wrong data row and any other problem."
      ru: "Сделай ревью теста поиска на наборе данных от Petal. Отметь неверную строку данных и любые другие проблемы."
    context:
      en: "Bloomly's products: Rose Bouquet, Sunny Tulips, Lavender Pot, Peony Dream, Mint Succulent, White Orchid. Search looks for the text in product names."
      ru: "Товары Bloomly: Rose Bouquet, Sunny Tulips, Lavender Pot, Peony Dream, Mint Succulent, White Orchid. Поиск ищет текст в названиях товаров."
    code: |
      import { test, expect } from '@playwright/test';

      const cases = [
        { q: 'rose', expected: '1 product' },
        { q: 'pot', expected: '1 product' },
        { q: 'tulip', expected: '2 products' },
      ];

      for (const c of cases) {
        test(`search for ${c.q}`, async ({ page }) => {
          await page.goto('/shop');
          page.getByLabel('Search').fill(c.q);
          await expect(page.getByTestId('results-count')).toHaveText(c.expected);
        });
      }
    issues:
      - line: 6
        type: wrong-data
        note:
          en: "Only Sunny Tulips contains \"tulip\": the expected result is '1 product'."
          ru: "«tulip» есть только в Sunny Tulips: ожидаемый результат — '1 product'."
      - line: 12
        type: missing-await
        note:
          en: "`fill` isn't awaited — the check can start before the search text is typed."
          ru: "`fill` без await — проверка может начаться до того, как текст поиска введён."
    types: [wrong-data, missing-await, wrong-assertion, hard-wait, no-assertion]
    hints:
      - { en: "Check every row against the product list in the context.", ru: "Сверь каждую строку со списком товаров из контекста." }
      - { en: "Then scan each step inside the loop for `await`.", ru: "Потом проверь каждый шаг внутри цикла на `await`." }
      - { en: "Line 6 and line 12.", ru: "Строка 6 и строка 12." }
    explain:
      en: "One wrong row breaks one test; one missing `await` inside the loop breaks every test the loop creates."
      ru: "Одна неверная строка ломает один тест; один забытый `await` внутри цикла ломает каждый тест, который цикл создаёт."

  - id: c3-l4-k4
    kind: predict
    keyPoint: kp-loop
    prompt:
      en: "Will the whole run be green?"
      ru: "Весь прогон будет зелёным?"
    code: |
      import { test, expect } from '@playwright/test';

      const products = ['Rose Bouquet', 'Peony Dream', 'Mint Succulent'];

      for (const product of products) {
        test(`can add ${product} to the cart`, async ({ page }) => {
          await page.goto('/shop');
          await page.getByTestId('product-card').filter({ hasText: product })
            .getByRole('button', { name: 'Add to cart' }).click();
          await expect(page.getByTestId('cart-count')).toHaveText('1');
        });
      }
    outcome: pass
    reasons:
      - text:
          en: "Yes: each test gets a fresh browser page with an empty cart, so the count is 1 every time"
          ru: "Да: каждый тест получает новую страницу браузера с пустой корзиной, поэтому счётчик каждый раз 1"
        correct: true
      - text:
          en: "No: the third test sees 3 items, because the loop adds them one after another"
          ru: "Нет: третий тест увидит 3 товара, потому что цикл добавляет их один за другим"
        why: { en: "The loop creates separate tests. Each starts clean, like a fresh test environment.", ru: "Цикл создаёт отдельные тесты. Каждый начинается с чистого листа, как в новом окружении." }
      - text:
          en: "No: Mint Succulent is out of stock"
          ru: "Нет: Mint Succulent нет в наличии"
        why: { en: "Only White Orchid is out of stock.", ru: "Нет в наличии только White Orchid." }
    hints:
      - { en: "Remember what `{ page }` gives every test.", ru: "Вспомни, что `{ page }` даёт каждому тесту." }
      - { en: "Do the three tests share one cart?", ru: "У трёх тестов общая корзина?" }
    explain:
      en: "Three independent tests, each with a fresh page and an empty cart. After one click the count is \"1\" in each of them."
      ru: "Три независимых теста, у каждого новая страница и пустая корзина. После одного клика в каждом счётчик «1»."

  - id: c3-l4-k5
    kind: choice
    keyPoint: kp-read-strategy
    prompt:
      en: "Petal explains its test: \"Line 8 checks that the order total is €39.90.\" What do you do?"
      ru: "Petal объясняет свой тест: «Строка 8 проверяет, что сумма заказа — €39.90». Что ты делаешь?"
    code: |
      // line 8:
      await expect(page.getByTestId('order-total')).toBeVisible();
    options:
      - text: { en: "Trust the code, not the explanation: line 8 only checks visibility. Flag it as a weak assertion and ask for `toHaveText`", ru: "Верить коду, а не объяснению: строка 8 проверяет только видимость. Отметить слабую проверку и попросить `toHaveText`" }
        correct: true
        why: { en: "The explanation describes what the line *should* do. The code shows what it does.", ru: "Объяснение описывает, что строка *должна* делать. Код показывает, что она делает." }
      - text: { en: "Approve — Petal explained it clearly", ru: "Одобрить — Petal всё понятно объяснил" }
        why: { en: "A confident explanation is not evidence. €39.90 appears nowhere in the code.", ru: "Уверенное объяснение — не доказательство. €39.90 в коде нигде нет." }
      - text: { en: "Delete line 8 — it doesn't check anything useful", ru: "Удалить строку 8 — она ничего полезного не проверяет" }
        why: { en: "Then nothing would be checked at all. Make the check stronger instead.", ru: "Тогда не проверялось бы вообще ничего. Лучше сделать проверку сильнее." }
    hints:
      - { en: "Find \"39.90\" in the code.", ru: "Найди «39.90» в коде." }
      - { en: "What does `toBeVisible()` actually check?", ru: "Что на самом деле проверяет `toBeVisible()`?" }
    explain:
      en: "Always verify an explanation against the code. The right line would be `await expect(page.getByTestId('order-total')).toHaveText('Total to pay: €39.90');`."
      ru: "Объяснение всегда сверяй с кодом. Правильная строка была бы такой: `await expect(page.getByTestId('order-total')).toHaveText('Total to pay: €39.90');`."

  - id: c3-l4-k6
    kind: choice
    multi: true
    keyPoint: kp-read-strategy
    prompt:
      en: "Which prompts help you understand unfamiliar generated code? Pick all that apply."
      ru: "Какие промпты помогают понять незнакомый сгенерированный код? Выбери все подходящие."
    options:
      - text: "Explain this test line by line. Don't change the code."
        correct: true
        why: { en: "Specific, and it keeps the code as it is.", ru: "Конкретно, и код остаётся как есть." }
      - text: "List every assertion in this file and what it checks."
        correct: true
        why: { en: "Assertions are what you approve — get them listed.", ru: "Одобряешь ты именно проверки — пусть их перечислят." }
      - text: "Rewrite everything to make it better."
        why: { en: "You'd get a new test to review instead of understanding the old one.", ru: "Получишь новый тест на ревью вместо понимания старого." }
      - text: "Is this test good?"
        why: { en: "Too vague — the agent will most likely just say yes.", ru: "Слишком размыто — агент, скорее всего, просто скажет «да»." }
    optionsCode: true
    hints:
      - { en: "Good prompts are specific and don't invite rewriting.", ru: "Хорошие промпты конкретные и не провоцируют переписывание." }
      - { en: "Two prompts are good.", ru: "Хороших промптов два." }
    explain:
      en: "Ask for a line-by-line explanation and a list of assertions, keep the code unchanged — then verify the answer yourself."
      ru: "Проси построчное объяснение и список проверок, код не меняй — а ответ проверяй {сама|сам}."

  - id: c3-l4-k7
