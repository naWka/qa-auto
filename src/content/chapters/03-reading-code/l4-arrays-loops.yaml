            ru: "Вот тот же тест с моими объяснениями в комментариях — код я не менял. Проверок две: 1) `toHaveCount(3)` — на странице ровно 3 карточки товаров (3 растения); 2) первая карточка содержит «Mint Succulent» — самое дешёвое растение (€12.00) идёт первым. Сверь, пожалуйста, цены с магазином."
