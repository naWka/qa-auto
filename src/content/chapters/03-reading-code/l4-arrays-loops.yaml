id: c3-l4
chapter: c3
title: { en: "Lists, dicts and loops", ru: "Списки, словари и циклы" }
goal:
  en: "Read test data in lists and dicts, tell a loop inside one test from parametrize, and count how many tests a file really creates."
  ru: "Читать тестовые данные в списках и словарях, отличать цикл внутри одного теста от parametrize и считать, сколько тестов файл создаёт на самом деле."
minutes: 11
keyPoints:
  - id: kp-list
    title: { en: "A list is a column of test data; positions start at 0", ru: "Список — колонка тестовых данных; позиции считаются с 0" }
  - id: kp-dict
    title: { en: "A dict is one data row with named columns: user[\"email\"]", ru: "Словарь — одна строка данных с подписанными колонками: user[\"email\"]" }
  - id: kp-loop
    title: { en: "for item in items: repeats steps — inside one test", ru: "for item in items: повторяет шаги — внутри одного теста" }
  - id: kp-parametrize
    title: { en: "@pytest.mark.parametrize turns each data row into its own test", ru: "@pytest.mark.parametrize превращает каждую строку данных в отдельный тест" }
terms: [list, dictionary, loop, decorator, test-data, data-driven-testing, parameterization, test-report]

steps:
  - type: story
    lines:
      - who: sofia
        text:
          en: "We deliver to Lisbon, Berlin and Warsaw. Do we have login tests for users from every city?"
          ru: "Мы доставляем в Лиссабон, Берлин и Варшаву. У нас есть тесты логина для пользователей из каждого города?"
      - who: petal
        text:
          en: "Yes! One test, all our users — I put them in a list and wrote a loop. Very elegant."
          ru: "Да! Один тест, все наши пользователи — я сложил их в список и написал цикл. Очень элегантно."
      - who: maya
        text:
          en: "Elegant until one user fails: then the whole test is red, and the report doesn't say who. Let's learn to read lists, dicts and loops — and pytest's way to give every user their own test."
          ru: "Элегантно — пока не упадёт один пользователь: тогда красным станет весь тест, а по отчёту не понять, кто именно. Научимся читать списки, словари и циклы — и разберём способ pytest дать каждому пользователю собственный тест."

  - type: pretest
    intro:
      en: "Quick guess before we start. Wrong answers are fine — they help you remember."
      ru: "Быстрая догадка перед началом. Ошибаться можно — так лучше запоминается."
    items:
      - id: c3-l4-p1
        kind: input
        keyPoint: kp-parametrize
        prompt:
          en: "Guess: how many tests will this file show in the report?"
          ru: "Угадай: сколько тестов этот файл покажет в отчёте?"
        code: |
          @pytest.mark.parametrize("email", [
              "anna@bloomly.app",
              "tom@bloomly.app",
              "maya@bloomly.app",
          ])
          def test_user_can_open_the_account_page(page: Page, email):
              page.goto("/login")
              # ...log in with this email, open the account page
        answers: ["3", "three"]
        placeholder: "Number of tests"
        hints:
          - { en: "The line with `@` above the function brings a list of data. pytest makes one test per item.", ru: "Строка с `@` над функцией приносит список данных. pytest делает по тесту на каждый элемент." }
          - { en: "Count the emails in the square brackets.", ru: "Посчитай email-адреса в квадратных скобках." }
        explain:
          en: "Three emails → three tests: `test_user_can_open_the_account_page[anna@bloomly.app]`, `[tom@bloomly.app]` and `[maya@bloomly.app]`. One function, three lines in the report. Let's see how to read this."
          ru: "Три email → три теста: `test_user_can_open_the_account_page[anna@bloomly.app]`, `[tom@bloomly.app]` и `[maya@bloomly.app]`. Одна функция — три строки в отчёте. Сейчас разберём, как это читать."

  - type: theory
    keyPoint: kp-list
    title: { en: "A list is a column of test data", ru: "Список — колонка тестовых данных" }
    body:
      - en: "Remember the [[test data|test-data]] column in a test case: several values, one per row. In Python that's a [[list]]: square brackets, items separated by commas."
        ru: "Вспомни колонку [[тестовых данных|test-data]] в тест-кейсе: несколько значений, по одному на строку. В Python это [[список|list]]: квадратные скобки, элементы через запятую."
      - en: "Each item has a position number — an index. Counting starts at **0**: `searches[0]` is the first item, `searches[1]` the second. `len(searches)` tells you how many items there are."
        ru: "У каждого элемента есть номер позиции — индекс. Счёт начинается с **0**: `searches[0]` — первый элемент, `searches[1]` — второй. А `len(searches)` говорит, сколько всего элементов."
      - en: "Ask for a position that doesn't exist — `searches[3]` in a list of three — and Python stops with `IndexError: list index out of range`."
        ru: "Если попросить позицию, которой нет, — `searches[3]` в списке из трёх, — Python остановится с ошибкой `IndexError: list index out of range`."
    code: |
      searches = ["rose", "tulips", "orchid"]

      print(searches[0])    # rose
      print(searches[2])    # orchid
      print(len(searches))  # 3

  - type: task
    task:
      id: c3-l4-t1
      kind: choice
      keyPoint: kp-list
      prompt:
        en: "What will this script print?"
        ru: "Что выведет этот скрипт?"
      code: |
        cities = ["Lisbon", "Berlin", "Warsaw"]
        print(cities[1])
      options:
        - text: "Berlin"
          correct: true
          why: { en: "Index 1 is the second item: counting starts at 0.", ru: "Индекс 1 — второй элемент: счёт начинается с 0." }
        - text: "Lisbon"
          why: { en: "Lisbon is `cities[0]`.", ru: "Lisbon — это `cities[0]`." }
        - text: "Warsaw"
          why: { en: "Warsaw is `cities[2]`.", ru: "Warsaw — это `cities[2]`." }
      optionsCode: true
      run: script
      hints:
        - { en: "Indexes start at 0.", ru: "Индексы начинаются с 0." }
        - { en: "0 → Lisbon, 1 → ?", ru: "0 → Lisbon, 1 → ?" }
      praise:
        en: "Right — the \"counting from zero\" habit is now yours."
        ru: "Верно — привычка «считать с нуля» теперь у тебя есть."
      explain:
        en: "`cities[1]` is the second item, \"Berlin\". Agents and humans both slip on this — `users[1]` is the second user, not the first."
        ru: "`cities[1]` — второй элемент, «Berlin». На этом спотыкаются и агенты, и люди: `users[1]` — второй пользователь, а не первый."

  - type: theory
    keyPoint: kp-dict
    title: { en: "A dict is a data row with named columns", ru: "Словарь — строка данных с подписанными колонками" }
    body:
      - en: "A row of a test case often has several columns: email, password, expected name. In Python one such row is a [[dictionary]] (dict): curly braces, `\"key\": value` pairs."
        ru: "Строка тест-кейса часто состоит из нескольких колонок: email, пароль, ожидаемое имя. В Python такая строка — [[словарь|dictionary]] (dict): фигурные скобки, пары `\"ключ\": значение`."
      - en: "You read a value by its key in square brackets: `user[\"email\"]`. A key that isn't there — a typo, or a column the agent invented — stops the code with `KeyError: 'mail'`."
        ru: "Значение читают по ключу в квадратных скобках: `user[\"email\"]`. Ключ, которого нет, — опечатка или колонка, которую придумал агент, — останавливает код с ошибкой `KeyError: 'mail'`."
      - en: "A list of dicts is a whole test data table. And JSON from an API looks exactly the same — you'll meet it again in the API chapter."
        ru: "Список словарей — это уже целая таблица тестовых данных. А JSON из API выглядит точно так же — ты ещё встретишь его в главе про API."
    code: |
      user = {"email": "tom@bloomly.app", "password": "tulips42", "name": "Tom"}
      print(user["email"])     # tom@bloomly.app

      users = [
          {"email": "anna@bloomly.app", "name": "Anna"},
          {"email": "tom@bloomly.app", "name": "Tom"},
      ]
      print(users[1]["name"])  # Tom
      print(user["mail"])      # KeyError: 'mail'

  - type: task
    task:
      id: c3-l4-t2
      kind: input
      keyPoint: kp-dict
      prompt:
        en: "Anna lives in Lisbon. What does the last line do? If it prints something, type it. If Python stops with an error, type the error's name."
        ru: "Анна живёт в Лиссабоне. Что сделает последняя строка? Если она что-то напечатает — напиши это. Если Python остановится с ошибкой — напиши название ошибки."
      code: |
        anna = {"email": "anna@bloomly.app", "password": "bloom123", "name": "Anna"}

        print(anna["name"])
        print(anna["city"])
      answers: ["KeyError", "KeyError: 'city'"]
      placeholder: "Printed text or error name"
      run: script
      hints:
        - { en: "Read the keys in the curly braces: which columns does this row have?", ru: "Прочитай ключи в фигурных скобках: какие колонки есть в этой строке?" }
        - { en: "There is no key \"city\". Python doesn't guess — and doesn't know where Anna lives.", ru: "Ключа \"city\" нет. Python не угадывает — и не знает, где живёт Анна." }
        - { en: "A missing key → `…Error`, as on the previous screen.", ru: "Нет ключа → `…Error`, как на прошлом экране." }
      praise:
        en: "Exactly — you read the keys, not what you know about Anna."
        ru: "Именно — ты {прочитала|прочитал} ключи, а не то, что знаешь про Анну."
      explain:
        en: "The first line prints \"Anna\". The dict has no key \"city\", so the second line stops with `KeyError: 'city'`. Python never returns an empty value for a missing key — and the error names the key. When a test fails with a KeyError, compare that key with the keys in the data: usually it's a typo or a column the agent invented."
        ru: "Первая строка печатает «Anna». Ключа \"city\" в словаре нет, поэтому вторая строка останавливается с `KeyError: 'city'`. Для отсутствующего ключа Python никогда не возвращает пустое значение — а в ошибке называет сам ключ. Если тест упал с KeyError, сравни этот ключ с ключами в данных: обычно это опечатка или колонка, которую придумал агент."

  - type: theory
    keyPoint: kp-loop
    title: { en: "A loop: the same steps for every item", ru: "Цикл: одни и те же шаги для каждого элемента" }
    body:
      - en: "A data-driven test case says: \"Repeat steps 1–3 for each row of the table.\" In code that's a [[loop]]: `for q in searches:` and the indented lines below it."
        ru: "Тест-кейс на наборе данных говорит: «Повтори шаги 1–3 для каждой строки таблицы». В коде это [[цикл|loop]]: `for q in searches:` и строки с отступом под ним."
      - en: "Read it as: \"for each `q` in `searches`, do the indented block\". On every round `q` is the next item: first \"rose\", then \"tulips\". Where the indentation ends, the block ends."
        ru: "Читай так: «для каждого `q` из `searches` выполни блок с отступом». На каждом проходе `q` — следующий элемент: сначала \"rose\", потом \"tulips\". Где кончается отступ, там кончается и блок."
      - en: "The catch: a loop inside a test is still **one** test. The first failing item stops it — the items after it never run — and the [[test report|test-report]] shows one red test without saying which item broke it."
        ru: "Подвох: цикл внутри теста — это всё равно **один** тест. Первый упавший элемент его останавливает — следующие уже не выполняются, — а в [[отчёте|test-report]] один красный тест, и не сказано, на каком элементе он сломался."
    code: |
      def test_search_finds_each_flower(page: Page):
          searches = ["rose", "tulips", "lavender"]
          page.goto("/shop")
          for q in searches:
              page.get_by_label("Search").fill(q)
              expect(page.get_by_test_id("results-count")).to_have_text("1 product")

      # report: one line — test_search_finds_each_flower
    mentor:
      en: "It's like running a test case with a data table, stopping at the first failure and filing one bug called \"search is broken\". Which row? Go and find out."
      ru: "Это как пройти тест-кейс с таблицей данных, остановиться на первой ошибке и завести один баг «поиск сломан». На какой строке? Разбирайся {сама|сам}."

  - type: task
    task:
      id: c3-l4-t3
      kind: predict
      keyPoint: kp-loop
      prompt:
        en: "Petal checks four searches in one test with a loop. Will the test pass?"
        ru: "Petal проверяет четыре поисковых запроса в одном тесте с помощью цикла. Тест пройдёт?"
      code: |
        from playwright.sync_api import Page, expect


        def test_search_finds_each_flower(page: Page):
            page.goto("/shop")
            for q in ["rose", "tulips", "daisy", "orchid"]:
                page.get_by_label("Search").fill(q)
                expect(page.get_by_test_id("results-count")).to_have_text("1 product")
      outcome: fail
      reasons:
        - text:
            en: "No: on \"daisy\" the shop shows \"0 products\" — the test stops there, and \"orchid\" is never checked"
            ru: "Нет: на «daisy» магазин покажет «0 products» — тест на этом остановится, а «orchid» так и не проверится"
          correct: true
        - text:
            en: "No: White Orchid is out of stock, so \"orchid\" finds nothing"
            ru: "Нет: White Orchid нет в наличии, поэтому «orchid» ничего не найдёт"
          why: { en: "Search still shows out-of-stock products: \"1 product\". And the test never even gets to \"orchid\".", ru: "Поиск всё равно показывает товары не в наличии: «1 product». И до «orchid» тест даже не доходит." }
        - text:
            en: "Yes: three of the four searches pass, and the loop counts the majority"
            ru: "Да: три поиска из четырёх проходят, а цикл считает по большинству"
          why: { en: "One failing check fails the whole test. A loop doesn't give its items separate results.", ru: "Одна упавшая проверка роняет весь тест. Цикл не даёт своим элементам отдельных результатов." }
      hints:
        - { en: "Check each search word against Bloomly's products.", ru: "Сверь каждое слово поиска с товарами Bloomly." }
        - { en: "Products: Rose Bouquet, Sunny Tulips, Lavender Pot, Peony Dream, Mint Succulent, White Orchid.", ru: "Товары: Rose Bouquet, Sunny Tulips, Lavender Pot, Peony Dream, Mint Succulent, White Orchid." }
        - { en: "And what happens to the items after the first failure?", ru: "А что происходит с элементами после первой ошибки?" }
      praise:
        en: "Right — you checked every data item against the app and noticed where the loop stops."
        ru: "Верно — ты {сверила|сверил} каждый элемент данных с приложением и {заметила|заметил}, где цикл останавливается."
      explain:
        en: "The test fails on \"daisy\": `Actual value: 0 products`. The report shows one red test, `test_search_finds_each_flower` — the word \"daisy\" isn't in its name, you have to work it out from the data. And \"orchid\" was never checked at all. That's the price of a loop inside one test."
        ru: "Тест падает на «daisy»: `Actual value: 0 products`. В отчёте один красный тест, `test_search_finds_each_flower`, — слова «daisy» в его названии нет, догадываться приходится по данным. А «orchid» не проверился вовсе. Вот цена цикла внутри одного теста."

  - type: theory
    keyPoint: kp-parametrize
    title: { en: "parametrize: one data row — one test", ru: "parametrize: одна строка данных — один тест" }
    body:
      - en: "pytest has a better tool for data tables: the [[decorator]] `@pytest.mark.parametrize` above the test. Its first argument names the columns, the second is the list of rows."
        ru: "Для таблиц данных в pytest есть инструмент получше — [[декоратор|decorator]] `@pytest.mark.parametrize` над тестом. Его первый аргумент называет колонки, второй — список строк."
      - en: "pytest runs the function once per row and passes the row's values into the parameters with the same names. Each run is a **separate test** with its own result and its own id in the report: `test_orders_filter[Shipped-1]`."
        ru: "pytest запускает функцию по разу на каждую строку и передаёт значения строки в параметры с теми же именами. Каждый запуск — **отдельный тест** со своим результатом и своим id в отчёте: `test_orders_filter[Shipped-1]`."
      - en: "So one red row doesn't hide the others, and the id tells you which row it was. This is [[data-driven testing|data-driven-testing]], pytest-style."
        ru: "Поэтому одна красная строка не прячет остальные, а id сразу говорит, какая это строка. Это [[тестирование на основе данных|data-driven-testing]] в стиле pytest."
    code: |
      @pytest.mark.parametrize("status, count", [
          ("Shipped", 1),
          ("Delivered", 3),
          ("Cancelled", 1),
      ])
      def test_orders_filter(page: Page, status, count):
          page.goto("/orders")
          page.get_by_label("Status").select_option(status)
          expect(page.get_by_test_id("order-row")).to_have_count(count)

      # report: test_orders_filter[Shipped-1] PASSED
      #         test_orders_filter[Delivered-3] PASSED
      #         test_orders_filter[Cancelled-1] PASSED
    mentor:
      en: "Read the decorator first: it's the data table. Count the rows — that's how many tests you'll see — and check each row against the app. Then read the function once: it runs for every row, so one hard-coded value there breaks all of them."
      ru: "Сначала читай декоратор: это таблица данных. Посчитай строки — столько тестов и будет — и сверь каждую с приложением. Потом один раз прочитай функцию: она выполняется для каждой строки, поэтому одно жёстко прописанное значение в ней ломает их все."

  - type: example
    keyPoint: kp-parametrize
    title: { en: "A data-driven login test", ru: "Тест логина на наборе данных" }
    intro:
      en: "Petal's login test for three users, rewritten with parametrize. One function — three tests in the report."
      ru: "Тест логина от Petal для трёх пользователей, переписанный через parametrize. Одна функция — три теста в отчёте."
    code: |
      import pytest
      from playwright.sync_api import Page, expect


      @pytest.mark.parametrize("email, password, first_name", [
          ("anna@bloomly.app", "bloom123", "Anna"),
          ("tom@bloomly.app", "tulips42", "Tom"),
          ("maya@bloomly.app", "qa-rocks", "Maya"),
      ])
      def test_user_can_log_in(page: Page, email, password, first_name):
          page.goto("/login")
          page.get_by_label("Email").fill(email)
          page.get_by_label("Password").fill(password)
          page.get_by_role("button", name="Log in").click()
          expect(page.get_by_role("heading", level=1)).to_have_text(f"Welcome back, {first_name}!")
    notes:
      - lines: 1
        text:
          en: "The decorator comes from pytest, so the file imports it."
          ru: "Декоратор берётся из pytest, поэтому файл его импортирует."
      - lines: 5
        text:
          en: "The decorator. `\"email, password, first_name\"` names the three columns of the table."
          ru: "Декоратор. `\"email, password, first_name\"` называет три колонки таблицы."
      - lines: [6, 7, 8]
        text:
          en: "The test data table: 3 rows → 3 tests. Each row sits in round brackets, values in the same order as the column names."
          ru: "Таблица тестовых данных: 3 строки → 3 теста. Каждая строка — в круглых скобках, значения в том же порядке, что и названия колонок."
      - lines: 10
        text:
          en: "The test asks for the columns by name, and pytest fills them from the current row. In the report: `test_user_can_log_in[anna@bloomly.app-bloom123-Anna]` and two more."
          ru: "Тест просит колонки по имени, и pytest подставляет их из текущей строки. В отчёте: `test_user_can_log_in[anna@bloomly.app-bloom123-Anna]` и ещё два."
      - lines: [12, 13]
        text:
          en: "The values of the current row — no hard-coded email or password."
          ru: "Значения текущей строки — никаких жёстко прописанных email и пароля."
      - lines: 15
        text:
          en: "The expected result is built from the same row with an f-string, so it changes with the data."
          ru: "Ожидаемый результат собирается из той же строки через f-строку — он меняется вместе с данными."
    runnable: true

  - type: task
    task:
      id: c3-l4-t4
      kind: review
      keyPoint: kp-dict
      prompt:
        en: "Review Petal's data-driven login test. One data row is wrong, and one check only works for one row."
        ru: "Сделай ревью теста логина на наборе данных от Petal. Одна строка данных неверная, а одна проверка работает только для одной строки."
      testCase:
        id: TC-020
        title: Registered users can log in
        preconditions: ["Users: anna@bloomly.app / bloom123 (Anna), tom@bloomly.app / tulips42 (Tom)"]
        steps:
          - { action: "Open the login page" }
          - { action: "Log in with the user's email and password", data: "each user from the table" }
          - { action: "Look at the account heading", expected: "\"Welcome back, <first name>!\"" }
      code: |
        import pytest
        from playwright.sync_api import Page, expect

        USERS = [
            {"email": "anna@bloomly.app", "password": "bloom123", "name": "Anna"},
            {"email": "tom@bloomly.app", "password": "bloom123", "name": "Tom"},
        ]


        @pytest.mark.parametrize("user", USERS, ids=["anna", "tom"])
