    prompt:
      en: "Will this test pass?"
      ru: "Этот тест пройдёт?"
    code: |
      from playwright.sync_api import Page, expect

      ANNA = {"email": "anna@bloomly.app", "password": "bloom123", "name": "Anna"}


      def test_anna_can_log_in(page: Page):
          page.goto("/login")
          page.get_by_label("Email").fill(ANNA["email"])
          page.get_by_label("Password").fill(ANNA["pass"])
          page.get_by_role("button", name="Log in").click()
          expect(page.get_by_role("heading", level=1)).to_have_text("Welcome back, Anna!")
    outcome: fail
    reasons:
      - text:
          en: "No: `KeyError: 'pass'` — the dict has no such key, so the password is never typed"
          ru: "Нет: `KeyError: 'pass'` — такого ключа в словаре нет, поэтому пароль так и не вводится"
        correct: true
      - text:
          en: "No: the app shows \"Invalid email or password.\""
          ru: "Нет: приложение покажет «Invalid email or password.»"
        why: { en: "The test never gets that far: Python stops on `ANNA[\"pass\"]` before anything is typed into the password field.", ru: "До этого тест не доходит: Python останавливается на `ANNA[\"pass\"]` раньше, чем что-то вводится в поле пароля." }
      - text:
          en: "Yes: Python finds the closest key, \"password\""
          ru: "Да: Python найдёт ближайший ключ, \"password\""
        why: { en: "Python never guesses keys. A key must match exactly.", ru: "Python никогда не угадывает ключи. Ключ должен совпадать в точности." }
    hints:
      - { en: "Compare every key the test reads with the keys in the dict.", ru: "Сравни каждый ключ, который читает тест, с ключами в словаре." }
      - { en: "Line 9 asks for \"pass\". Is there such a key?", ru: "Строка 9 просит \"pass\". Есть такой ключ?" }
    explain:
      en: "The dict has \"password\", the test asks for \"pass\" — `KeyError: 'pass'` on line 9. A typical slip when an agent writes the data and the test in different places. The fix is one word: `ANNA[\"password\"]`."
      ru: "В словаре ключ \"password\", а тест просит \"pass\" — `KeyError: 'pass'` на строке 9. Типичная ошибка, когда агент пишет данные и тест в разных местах. Исправление — одно слово: `ANNA[\"password\"]`."

