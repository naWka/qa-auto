id: c4-l1
chapter: c4
title: { en: "The page as a tree: the DOM", ru: "Страница как дерево: DOM" }
goal:
  en: "Read a short piece of Bloomly HTML and find elements, tags and nesting in the DOM tree."
  ru: "Читать короткий фрагмент HTML Bloomly и находить в DOM-дереве элементы, теги и вложенность."
minutes: 10
keyPoints:
  - id: kp-html-vs-dom
    title: { en: "HTML is the source; the DOM is the live tree", ru: "HTML — исходный текст, DOM — живое дерево" }
  - id: kp-element-nesting
    title: { en: "Elements are tags with content, nested like folders", ru: "Элементы — теги с содержимым, вложенные как папки" }
  - id: kp-dom-not-pixels
    title: { en: "Playwright searches the DOM, not the pixels", ru: "Playwright ищет в DOM, а не по пикселям" }
terms: [dom, html, element, tag, attribute, devtools, inspect, locator]

steps:
  - type: story
    lines:
      - who: petal
        text:
          en: "Problem! I read Bloomly's index.html to write the login test, and its `<main>` is empty. There is no “Log in” button anywhere. Is the login page broken?"
          ru: "Проблема! Я прочитал index.html Bloomly, чтобы написать тест на вход, а там `<main>` пустой. Кнопки «Log in» нигде нет. Страница входа сломана?"
      - who: kai
        text:
          en: "It isn't broken. index.html is only a skeleton — our JavaScript builds the page in the browser after it loads."
          ru: "Не сломана. index.html — только каркас: страницу строит наш JavaScript прямо в браузере, уже после загрузки."
      - who: maya
        text:
          en: "So the file and the page are two different things. Today we'll look at what the browser actually builds — because that's where tests look for elements."
          ru: "Значит, файл и страница — это разные вещи. Сегодня посмотрим, что браузер строит на самом деле, — ведь именно там тесты ищут элементы."

  - type: pretest
    intro:
      en: "Quick guess before we start. Wrong answers are fine — they help you remember."
      ru: "Быстрая догадка перед началом. Ошибаться можно — так лучше запоминается."
    items:
      - id: c4-l1-p1
        kind: input
        keyPoint: kp-html-vs-dom
        prompt:
          en: "This is the `<main>` part of Bloomly's index.html — the file the server sends to the browser. How many “Add to cart” buttons are in it? Type a number."
          ru: "Это часть `<main>` из index.html Bloomly — файла, который сервер отправляет браузеру. Сколько в нём кнопок «Add to cart»? Введи число."
        code: |
          <main id="main"></main>
        answers: ["0", "zero", "none", "ноль", "нет", "ни одной"]
        hints:
          - en: 'Look at what is between `<main id="main">` and `</main>`.'
            ru: 'Посмотри, что стоит между `<main id="main">` и `</main>`.'
          - en: "The closing tag comes right after the opening one."
            ru: "Закрывающий тег идёт сразу после открывающего."
        explain:
          en: "Zero: `<main>` is empty in the file. The six product cards with their buttons are created by JavaScript in the browser. You won't find them in the source, but they are on the live page — and that's where tests look."
          ru: "Ноль: в файле `<main>` пустой. Шесть карточек товаров с кнопками создаёт JavaScript в браузере. В исходном файле их не найти, но на живой странице они есть — и тесты ищут именно там."

      - id: c4-l1-p2
        kind: choice
        keyPoint: kp-dom-not-pixels
        prompt:
          en: 'A test runs `page.get_by_role("button", name="Log in").click()`. How does Playwright find the button?'
          ru: 'Тест выполняет `page.get_by_role("button", name="Log in").click()`. Как Playwright находит кнопку?'
        options:
          - text:
              en: "It searches the page's tree of elements for a button named “Log in” and clicks that element"
              ru: "Ищет в дереве элементов страницы кнопку с именем «Log in» и кликает по этому элементу"
            correct: true
            why:
              en: "Exactly: it searches the structure of the page, not the picture."
              ru: "Именно: он ищет в структуре страницы, а не на картинке."
          - text:
              en: "It takes a screenshot and looks for the words “Log in” in it"
              ru: "Делает скриншот и ищет на нём слова «Log in»"
            why:
              en: "Playwright doesn't read the picture. Besides, the words “Log in” appear on that screen three times: the heading, a menu link and the button."
              ru: "Playwright не читает картинку. К тому же слова «Log in» на этом экране встречаются трижды: заголовок, ссылка в меню и кнопка."
          - text:
              en: "It clicks the spot where the button was when the test was written"
              ru: "Кликает в то место, где кнопка была, когда писали тест"
            why:
              en: "That would break as soon as the layout moves. Playwright finds the element again on every run."
              ru: "Это сломалось бы при первом же сдвиге вёрстки. Playwright заново находит элемент при каждом запуске."
        hints:
          - en: 'Read the locator: does `get_by_role("button", …)` describe a place on the screen or a kind of element?'
            ru: 'Прочитай локатор: `get_by_role("button", …)` описывает место на экране или вид элемента?'
        explain:
          en: "Playwright asks the page's structure — the DOM — for an element with the role button and the name “Log in”, then scrolls to it and clicks it. Position, color and size don't matter."
          ru: "Playwright запрашивает у структуры страницы — DOM — элемент с ролью button и именем «Log in», затем прокручивает к нему и кликает. Положение, цвет и размер не важны."

  - type: theory
    keyPoint: kp-html-vs-dom
    title: { en: "HTML is the source, the DOM is the live tree", ru: "HTML — исходный текст, DOM — живое дерево" }
    body:
      - en: "[[HTML|html]] is the text a page is written in. The server sends it, and the browser reads it and builds the [[DOM|dom]] (Document Object Model): a tree of objects that you see on the screen and that tests search."
        ru: "[[HTML|html]] — текст, на котором написана страница. Сервер его присылает, а браузер читает и строит [[DOM|dom]] (Document Object Model) — дерево объектов, которое ты видишь на экране и в котором ищут тесты."
      - en: "The DOM is alive: JavaScript adds, removes and changes elements while you are on the page. Bloomly's index.html has an empty `<main>`. The shop appears only after the script runs — first “Loading products…”, then six cards."
        ru: "DOM живой: пока ты на странице, JavaScript добавляет, удаляет и меняет элементы. В index.html Bloomly `<main>` пустой. Магазин появляется, только когда отработает скрипт: сначала «Loading products…», потом шесть карточек."
      - en: "It's the difference between a test case and a test run. The case is written in advance and doesn't change; the run is happening now — statuses change, comments appear. Tests, like you, work with the run."
        ru: "Это как разница между тест-кейсом и прогоном. Кейс написан заранее и не меняется, а прогон идёт прямо сейчас — меняются статусы, появляются комментарии. Тесты, как и ты, работают с прогоном."
    code: |
      <!-- index.html — what the server sends -->
      <main id="main"></main>

      <!-- The live DOM on /login a moment later (shortened) -->
      <main id="main">
        <h1>Log in</h1>
        <form id="login-form">…</form>
      </main>
    mentor:
      en: "Try it in Chrome. Right-click → “View page source” shows the HTML file. Right-click → [[Inspect|inspect]] opens [[DevTools|devtools]] → Elements: the live DOM. When a locator works or fails, the answer is always in Elements."
      ru: "Попробуй в Chrome. Правый клик → «Просмотр кода страницы» показывает HTML-файл. Правый клик → «Просмотреть код» ([[inspect]]) открывает [[DevTools|devtools]] → Elements — живой DOM. Сработал локатор или нет — ответ всегда в Elements."

  - type: inspect
    keyPoint: kp-html-vs-dom
    title: { en: "The live DOM of the login page", ru: "Живой DOM страницы входа" }
    intro:
      en: "On the left is Bloomly's /login, on the right the Elements tree — the live DOM. The “Log in” button is already selected. Click other elements on the page and watch the tree follow you; the arrows open and close nodes like folders. Compare this `<main>` with the empty one in index.html."
      ru: "Слева — страница /login Bloomly, справа — дерево Elements, то есть живой DOM. Кнопка «Log in» уже выбрана. Нажимай на другие элементы страницы и смотри, как дерево следует за тобой; стрелки раскрывают и сворачивают узлы, как папки. Сравни этот `<main>` с пустым из index.html."
    app: { route: /login }
    focus: "[data-testid='login-button']"
    view: dom
    mentor:
      en: "This is the view Petal didn't have this morning: it read the file, not the page. Coding agents often guess from source files. Ask them to look at the live page (through [[Playwright MCP|mcp]]) — or check their locators here yourself."
      ru: "Вот этого вида у Petal утром и не было: он читал файл, а не страницу. Агенты, которые пишут код, часто угадывают по исходникам. Проси их смотреть на живую страницу (через [[Playwright MCP|mcp]]) — или {сама|сам} сверяй их локаторы здесь."

  - type: example
    keyPoint: kp-element-nesting
    title: { en: "Reading HTML: the login form", ru: "Читаем HTML: форма входа" }
    intro:
      en: "An [[element|element]] is one piece of the page, written with [[tags|tag]]: `<h1>` opens it, `</h1>` closes it. Elements nest like folders in your test management tool — project → suite → test case. Read this real piece of Bloomly's login page (slightly shortened) with the notes."
      ru: "[[Элемент|element]] — это одна часть страницы, записанная [[тегами|tag]]: `<h1>` открывает её, `</h1>` закрывает. Элементы вложены друг в друга, как папки в твоей системе управления тестами: проект → набор → тест-кейс. Прочитай реальный кусок страницы входа Bloomly (слегка сокращённый) вместе с пояснениями."
    code: |
      <main id="main">
        <h1>Log in</h1>
        <form id="login-form">
          <label for="email">Email</label>
          <input id="email" type="text">
          <label for="password">Password</label>
          <input id="password" type="password">
          <button type="submit">Log in</button>
        </form>
      </main>
    notes:
      - lines: [1, 10]
        text:
          en: "`<main>` opens on line 1 and closes on line 10 with `</main>`. Everything in between is inside it: `<main>` is the *parent* of the heading and the form."
          ru: "`<main>` открывается в строке 1 и закрывается в строке 10 тегом `</main>`. Всё, что между ними, — внутри: `<main>` — *родитель* заголовка и формы."
      - lines: 2
        text:
          en: "A whole element on one line: the opening tag `<h1>`, the content “Log in”, the closing tag `</h1>`. `h1` is the main heading of the page."
          ru: "Целый элемент в одной строке: открывающий тег `<h1>`, содержимое «Log in», закрывающий тег `</h1>`. `h1` — главный заголовок страницы."
      - lines: [3, 9]
        text:
          en: "`<form>` is a container inside `<main>`: it opens on line 3 and closes on line 9. The labels, the fields and the button are its *children*. The indentation helps you see the nesting."
          ru: "`<form>` — контейнер внутри `<main>`: открывается в строке 3 и закрывается в строке 9. Подписи, поля и кнопка — его *дочерние* элементы. Отступы помогают увидеть вложенность."
      - lines: [4, 5]
        text:
          en: "`<label>` holds the caption you see (“Email”). `<input>` is the field itself: no content and no closing tag. Its settings are [[attributes|attribute]] in the opening tag — `id` and `type`. The next lesson is about them."
          ru: "`<label>` содержит подпись, которую ты видишь («Email»). `<input>` — само поле: без содержимого и без закрывающего тега. Его настройки — [[атрибуты|attribute]] в открывающем теге: `id` и `type`. О них — следующий урок."
      - lines: 7
        text:
          en: 'Same tag `<input>`, different attribute: `type="password"` makes the browser hide what you type.'
          ru: 'Тот же тег `<input>`, другой атрибут: `type="password"` заставляет браузер скрывать вводимые символы.'
      - lines: 8
        text:
          en: 'The text between `<button>` and `</button>` is what you see on the button — and what `get_by_role("button", name="Log in")` looks for.'
          ru: 'Текст между `<button>` и `</button>` — то, что написано на кнопке, и то, что ищет `get_by_role("button", name="Log in")`.'

  - type: theory
    keyPoint: kp-dom-not-pixels
    title: { en: "Playwright looks at the DOM, not at the screen", ru: "Playwright смотрит в DOM, а не на экран" }
    body:
      - en: "You find the “Log in” button with your eyes: by its place, color and size. A [[locator|locator]] doesn't look at the picture at all: it's a search request to the DOM — “an element with the role button and the name Log in”. On every run Playwright finds that element again, scrolls to it and clicks it."
        ru: "Ты находишь кнопку «Log in» глазами: по месту, цвету и размеру. [[Локатор|locator]] на картинку не смотрит вообще: это поисковый запрос к DOM — «элемент с ролью button и именем Log in». При каждом запуске Playwright заново находит этот элемент, прокручивает к нему и кликает."
      - en: "So a redesign that moves or recolors a button doesn't break a good locator: the element in the tree is still the same. It's like finding a test case by its ID and title, not as “the fifth row on the screen” — the row moves when someone re-sorts the list, the ID doesn't."
        ru: "Поэтому редизайн, который сдвинул или перекрасил кнопку, хороший локатор не ломает: элемент в дереве остался тем же. Это как искать тест-кейс по ID и названию, а не как «пятую строку на экране»: строка уедет, если кто-то пересортирует список, а ID — нет."
      - en: "And the DOM holds more than you see. Bloomly's login error box is in the tree from the start — empty and hidden. Playwright knows the difference: actions wait until an element is visible, and `to_be_visible()` checks exactly that."
        ru: "А ещё в DOM больше, чем видно глазу. Блок ошибки на странице входа Bloomly есть в дереве с самого начала — пустой и скрытый. Playwright эту разницу знает: действия ждут, пока элемент станет видимым, а `to_be_visible()` проверяет именно это."
    code: |
      # Searches the DOM: role "button" + name "Log in" — survives a redesign
      page.get_by_role("button", name="Log in").click()

      # Clicks a point on the screen — breaks when the layout moves
      page.mouse.click(612, 344)
    mentor:
      en: "Agents that work from screenshots sometimes produce exactly that second line. If you see coordinates in generated code, ask for a locator by role and name instead."
      ru: "Агенты, которые работают со скриншотами, иногда выдают ровно такую вторую строку. Видишь в сгенерированном коде координаты — проси вместо них локатор по роли и имени."

  - type: task
    task:
      id: c4-l1-t1
      kind: choice
      keyPoint: kp-element-nesting
      prompt:
        en: "Here is one product card from the shop's live DOM (shortened). Which element is the parent of the “Add to cart” button?"
        ru: "Вот одна карточка товара из живого DOM магазина (в сокращении). Какой элемент — родитель кнопки «Add to cart»?"
      code: |
        <article class="product-card" data-testid="product-card">
          <img src="rose.svg" alt="Bouquet of pink roses">
          <h2>Rose Bouquet</h2>
          <p class="price" data-testid="product-price">€35.00</p>
          <button type="button" data-testid="add-to-cart">Add to cart</button>
        </article>
      options:
        - text: "<article>"
          correct: true
          why:
            en: "The button sits between `<article …>` (line 1) and `</article>` (line 6), so the card contains it."
            ru: "Кнопка стоит между `<article …>` (строка 1) и `</article>` (строка 6), значит, карточка её содержит."
        - text: "<h2>"
          why:
            en: "`<h2>` closes on the same line with `</h2>` and contains only the text “Rose Bouquet”. It's the button's neighbour, not its parent."
            ru: "`<h2>` закрывается в той же строке тегом `</h2>` и содержит только текст «Rose Bouquet». Это сосед кнопки, а не родитель."
        - text: '<p class="price">'
          why:
            en: "The price paragraph closes before the button starts. They are neighbours inside the same card."
            ru: "Абзац с ценой закрывается до того, как начинается кнопка. Они соседи внутри одной карточки."
        - text: "<img>"
          why:
            en: "`<img>` has no content and no closing tag — it can't contain anything."
            ru: "У `<img>` нет ни содержимого, ни закрывающего тега — он ничего не может содержать."
      optionsCode: true
      hints:
        - en: "A parent contains its child: the child sits between the parent's opening and closing tags."
          ru: "Родитель содержит дочерний элемент: тот стоит между открывающим и закрывающим тегами родителя."
        - en: "Which opening tag is still not closed when the button starts on line 5?"
          ru: "Какой открывающий тег ещё не закрыт, когда в строке 5 начинается кнопка?"
        - en: "Only one tag opens before line 5 and closes after it, on line 6."
          ru: "Только один тег открывается до строки 5 и закрывается после неё, в строке 6."
      praise:
        en: "Right — you matched opening and closing tags instead of guessing. That's how you read any HTML."
        ru: "Верно — ты {сопоставила|сопоставил} открывающие и закрывающие теги, а не {угадывала|угадывал}. Так читается любой HTML."
      explain:
        en: "`<img>`, `<h2>`, `<p>` and `<button>` are all children of `<article>` and neighbours to each other. That's why a test can say “the button inside the Rose Bouquet card”: the card is the container."
        ru: "`<img>`, `<h2>`, `<p>` и `<button>` — дочерние элементы `<article>` и соседи друг другу. Поэтому тест может сказать «кнопка внутри карточки Rose Bouquet»: карточка — это контейнер."

  - type: task
    task:
      id: c4-l1-t2
      kind: inspect
      keyPoint: kp-element-nesting
      app: { route: /shop }
      prompt:
        en: "Select the whole product card of **Peony Dream** — the `<article>` element, not its heading, picture or price."
        ru: "Выбери всю карточку товара **Peony Dream** — элемент `<article>`, а не её заголовок, картинку или цену."
      target: "[data-product-id='peony-dream']"
      view: dom
      show: [attributes]
      hints:
        - en: "Scroll the page down to Peony Dream and click its name. Which element did you get?"
          ru: "Прокрути страницу до Peony Dream и нажми на название. Какой элемент выбрался?"
        - en: "You got the `<h2>` — a child. Its parent is the closest row above it in the tree that is indented one step less."
          ru: "Выбрался `<h2>` — дочерний элемент. Его родитель — ближайшая строка выше в дереве, у которой отступ на шаг меньше."
        - en: 'Select the row `<article class="product-card" … data-product-id="peony-dream">`.'
          ru: 'Выбери строку `<article class="product-card" … data-product-id="peony-dream">`.'
      praise:
        en: "You climbed from the child to its parent. That's the move you'll make whenever a locator should search inside one card."
        ru: "Ты {поднялась|поднялся} от дочернего элемента к родителю. Это движение понадобится каждый раз, когда локатор должен искать внутри одной карточки."
      explain:
        en: "A click on the page always picks the innermost element under the cursor. The card is the `<article>` that contains the picture, the heading, the price and the button — in the tree it's the parent row above them."
        ru: "Клик по странице всегда выбирает самый внутренний элемент под курсором. Карточка — это `<article>`, в котором лежат картинка, заголовок, цена и кнопка; в дереве это родительская строка над ними."

  - type: task
    task:
      id: c4-l1-t3
      kind: predict
      keyPoint: kp-html-vs-dom
      context:
        en: "Remember: Bloomly's index.html has an empty `<main>`, and on /shop the product list appears about 150 ms after the page opens."
        ru: "Напомним: в index.html Bloomly пустой `<main>`, а на /shop список товаров появляется примерно через 150 мс после открытия страницы."
      prompt:
        en: "Will this test pass or fail?"
        ru: "Этот тест пройдёт или упадёт?"
      code: |
        from playwright.sync_api import Page, expect


        def test_shop_shows_all_six_products(page: Page):
            page.goto("/shop")
            expect(page.get_by_test_id("product-card")).to_have_count(6)
      outcome: pass
      reasons:
        - text:
            en: "It passes: the test searches the live DOM, and the assertion retries until JavaScript has added all six cards"
            ru: "Пройдёт: тест ищет в живом DOM, а проверка повторяется, пока JavaScript не добавит все шесть карточек"
          correct: true
        - text:
            en: "It fails: index.html contains no product cards"
            ru: "Упадёт: в index.html нет карточек товаров"
          why:
            en: "Tests don't read index.html. They look at the live DOM, where the cards appear a moment later."
            ru: "Тесты не читают index.html. Они смотрят в живой DOM, где карточки появляются чуть позже."
        - text:
            en: "It fails: the cards are still loading when the check runs"
            ru: "Упадёт: в момент проверки карточки ещё грузятся"
          why:
            en: "`expect(...)` doesn't look just once — it retries for up to 5 seconds. 150 ms is nothing."
            ru: "`expect(...)` смотрит не один раз — он повторяет попытки до 5 секунд. 150 мс — это ничто."
      hints:
        - en: "Where does Playwright look: in the file or in the browser?"
          ru: "Куда смотрит Playwright: в файл или в браузер?"
        - en: "How long does `expect(...)` keep trying?"
          ru: "Сколько времени `expect(...)` продолжает попытки?"
