            expect(page.get_by_test_id("login-error")).to_have_count(1)
      solution: |
        from playwright.sync_api import Page, expect


        def test_wrong_password_shows_an_error(page: Page):
            page.goto("/login")
            page.get_by_label("Email").fill("anna@bloomly.app")
            page.get_by_label("Password").fill("wrong-pass")
            page.get_by_role("button", name="Log in").click()
            expect(page.get_by_test_id("login-error")).to_have_text("Invalid email or password.")
      checks:
        expect: pass
        static: [hasAssertion]
        also:
          - app: { bugs: [login-no-error] }
            expect: fail
      hints:
        - en: "Is the error box in the DOM *before* you click “Log in”? You found it in an earlier task."
          ru: "Есть ли блок ошибки в DOM *до* клика по «Log in»? Ты {нашла|нашёл} его в одном из прошлых заданий."
        - en: "`to_have_count(1)` only proves the element exists. Check its text instead."
          ru: "`to_have_count(1)` доказывает только, что элемент существует. Проверь лучше его текст."
        - en: 'Line 9: `expect(page.get_by_test_id("login-error")).to_have_text("Invalid email or password.")`'
          ru: 'Строка 9: `expect(page.get_by_test_id("login-error")).to_have_text("Invalid email or password.")`'
      praise:
        en: "Now the test checks what the user sees, not just what the DOM contains. Red on the broken build, green on the good one."
        ru: "Теперь тест проверяет то, что видит пользователь, а не просто содержимое DOM. Красный на сломанной сборке, зелёный на рабочей."
      explain:
        en: "The error box is always in the DOM — hidden and empty until an error happens. So `to_have_count(1)` is true on every build, even on one that shows no error at all. `to_have_text` checks the actual message (an empty hidden box fails it), so the test can finally catch the bug."
        ru: "Блок ошибки всегда есть в DOM — скрытый и пустой, пока ошибка не случится. Поэтому `to_have_count(1)` выполняется на любой сборке, даже на той, где ошибка вообще не показывается. `to_have_text` проверяет само сообщение (пустой скрытый блок эту проверку не пройдёт), и тест наконец может поймать баг."

  - type: mistakes
    keyPoint: kp-dom-not-pixels
    title: { en: "DOM mistakes agents make", ru: "Ошибки с DOM, которые делают агенты" }
    items:
      - wrong: "page.mouse.click(612, 344)  # the Log in button"
        right: 'page.get_by_role("button", name="Log in").click()'
        why:
          en: "Coordinates are pixels, not elements. Screenshot-based tools write them; a new banner or another window size breaks them."
          ru: "Координаты — это пиксели, а не элементы. Их пишут инструменты, работающие со скриншотами; новый баннер или другой размер окна их ломает."
      - wrong: "page.wait_for_timeout(3000)  # let JavaScript build the page"
        right: 'expect(page.get_by_test_id("product-card")).to_have_count(6)'
        why:
          en: "The DOM fills in after loading, but don't guess how long it takes. Assert the state you need — `expect` retries until the DOM has it."
          ru: "DOM заполняется после загрузки, но не угадывай, сколько это займёт. Проверяй нужное состояние — `expect` повторяет попытки, пока оно не появится в DOM."
      - wrong: 'expect(page.get_by_test_id("login-error")).to_have_count(1)'
        right: 'expect(page.get_by_test_id("login-error")).to_have_text("Invalid email or password.")'
        why:
          en: "“In the DOM” isn't “shown to the user”. The hidden, empty error box is always there."
          ru: "«Есть в DOM» не значит «показано пользователю». Скрытый пустой блок ошибки там есть всегда."
      - wrong: "# index.html has no Add to cart button, so the shop is broken"
        right: "# check the live DOM: DevTools → Elements on /shop"
        why:
          en: "The source file is a skeleton. Judge the page by the live DOM — that's what users and tests get."
          ru: "Исходный файл — только каркас. Судить о странице нужно по живому DOM: именно его получают пользователи и тесты."

  - type: explain
    keyPoint: kp-html-vs-dom
    prompt:
      en: "In your own words: Petal says “index.html has no Log in button, so the login page is broken.” What would you answer? Where do tests look for elements?"
      ru: "Своими словами: Petal говорит: «В index.html нет кнопки Log in, значит, страница входа сломана». Что ты ответишь? Где тесты ищут элементы?"
    model:
      en: "index.html is only the source the server sends; on Bloomly its `<main>` is empty. The browser builds the DOM from it, and JavaScript then adds the form and the button. Tests — and DevTools → Elements — work with that live DOM, not with the file and not with the pixels on the screen. So the page isn't broken: Petal looked in the wrong place. I'd ask it to take locators from the live page."
      ru: "index.html — это только исходный текст, который присылает сервер; в Bloomly `<main>` там пустой. Браузер строит из него DOM, а потом JavaScript добавляет форму и кнопку. Тесты — и DevTools → Elements — работают с этим живым DOM, а не с файлом и не с пикселями на экране. Так что страница не сломана: Petal искал не там. Я бы {попросила|попросил} его брать локаторы с живой страницы."

