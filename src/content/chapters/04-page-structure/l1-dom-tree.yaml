    prompt:
      en: "Select the whole table row of **Sunny Tulips** — the `<tr>` element, not a single cell."
      ru: "Выбери всю строку таблицы **Sunny Tulips** — элемент `<tr>`, а не отдельную ячейку."
    target: "[data-testid='cart-row'][data-id='sunny-tulips']"
    view: dom
    show: [attributes]
    hints:
      - en: "Clicking the product name selects a `<td>` — a cell. Its parent is the row."
        ru: "Клик по названию товара выбирает `<td>` — ячейку. Её родитель — строка."
      - en: "In the tree: `<table>` → `<tbody>` → `<tr>` → `<td>`. Go one level up from the cell."
        ru: "В дереве: `<table>` → `<tbody>` → `<tr>` → `<td>`. Поднимись от ячейки на уровень выше."
      - en: 'Select `<tr data-testid="cart-row" data-id="sunny-tulips">`.'
