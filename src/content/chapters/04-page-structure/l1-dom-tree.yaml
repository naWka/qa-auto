  - type: task
    task:
      id: c4-l1-t5
      kind: review
      keyPoint: kp-dom-not-pixels
      context:
        en: "Petal tried a new screenshot-based tool: “I looked at the screen and clicked where the button is. Green on my laptop!”"
        ru: "Petal попробовал новый инструмент, который работает со скриншотами: «Я посмотрел на экран и кликнул туда, где кнопка. На моём ноутбуке зелёный!»"
      prompt:
        en: "Review Petal's test against TC-402. Flag every problem line."
        ru: "Проверь тест Petal по TC-402. Отметь каждую проблемную строку."
      testCase:
        id: TC-402
        title: Customer can add a product to the cart
        steps:
          - action: "Open the shop"
          - action: "Click \"Add to cart\" on the Sunny Tulips card"
            expected: "The cart counter in the header shows 1"
      code: |
        from playwright.sync_api import Page, expect


        def test_customer_can_add_a_product_to_the_cart(page: Page):
            page.goto("/shop")
            page.wait_for_timeout(3000)  # let JavaScript build the page
            page.mouse.click(395, 610)  # "Add to cart" under the 2nd picture
            expect(page.get_by_test_id("cart-count")).to_have_text("1")
      issues:
        - line: 6
          type: hard-wait
          note:
            en: "A fixed 3-second pause. The cards are in the DOM after about 150 ms, and locators and `expect` wait on their own. The pause slows every run and is still a guess: on a slow day 3 seconds may not be enough."
            ru: "Фиксированная пауза в 3 секунды. Карточки появляются в DOM примерно через 150 мс, а локаторы и `expect` ждут сами. Пауза замедляет каждый прогон и всё равно остаётся угадыванием: в медленный день 3 секунд может не хватить."
        - line: 7
          type: fragile-locator
          note:
            en: "A point on the screen, not an element. Another window size, a cookie banner or a new card order — and the click lands somewhere else. Find the “Add to cart” button inside the Sunny Tulips card in the DOM."
            ru: "Точка на экране, а не элемент. Другой размер окна, баннер про cookies или новый порядок карточек — и клик попадёт в другое место. Найди в DOM кнопку «Add to cart» внутри карточки Sunny Tulips."
      types: [fragile-locator, hard-wait, no-assertion, wrong-data, hallucination]
      hints:
        - en: "The assertion on line 8 matches TC-402. Look at how the test waits and how it clicks."
          ru: "Проверка в строке 8 соответствует TC-402. Посмотри, как тест ждёт и как кликает."
        - en: "Which line depends on pixels instead of the DOM? Which one depends on a guessed time?"
          ru: "Какая строка зависит от пикселей, а не от DOM? А какая — от угаданного времени?"
        - en: "Line 6 is a hard-wait; line 7 is a fragile-locator."
          ru: "Строка 6 — hard-wait, строка 7 — fragile-locator."
      praise:
        en: "Both caught. “Green on my laptop” didn't fool you — you asked what happens on another screen."
        ru: "Обе пойманы. «Зелёный на моём ноутбуке» тебя не убедил: ты {спросила|спросил}, что будет на другом экране."
      explain:
        en: "Both lines bet on how the screen looks and how fast it is. A DOM-based version finds the button inside the Sunny Tulips card and lets `expect` do the waiting — it works on any screen size and at any speed."
        ru: "Обе строки делают ставку на то, как выглядит экран и насколько он быстрый. Версия на основе DOM находит кнопку внутри карточки Sunny Tulips и доверяет ожидание `expect` — она работает при любом размере экрана и любой скорости."

