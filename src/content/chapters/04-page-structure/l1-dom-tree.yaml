          ru: "Без карточки, внутри которой искать, Petal не понял, какую из шести цен ты имеешь в виду. Он либо взял все шесть сразу (strict mode violation), либо выбрал одну по положению — а положение меняется, стоит кому-то отсортировать магазин по цене."
