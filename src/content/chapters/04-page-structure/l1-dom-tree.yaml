        - id: scope
          text: 'There are six product cards (data-testid="product-card"), each with its own price (data-testid="product-price"). Take the card that contains the text "Sunny Tulips" and check the price inside that card.'
          ru: 'На странице шесть карточек товаров (data-testid="product-card"), у каждой своя цена (data-testid="product-price"). Возьми карточку, в которой есть текст «Sunny Tulips», и проверь цену внутри этой карточки.'
        - id: live
          text: "Take locators from the live page at /shop, not from index.html."
          ru: "Бери локаторы с живой страницы /shop, а не из index.html."
        - id: polite
          text: "Please be careful, this test is important."
          ru: "Пожалуйста, будь внимателен, этот тест важный."
      responses:
        - when: [scope]
          best: true
