        - en: "The price is a child of the card. Petal needs the parent to search inside."
          ru: "Цена — дочерний элемент карточки. Petal нужен родитель, внутри которого искать."
        - en: "Include the block about the card that contains “Sunny Tulips”."
          ru: "Добавь блок про карточку, в которой есть «Sunny Tulips»."
      praise:
