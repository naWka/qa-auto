          ru: "Кликни в то место экрана, где обычно бывает кнопка."
        why:
          en: "Pixels move. Playwright needs an element from the DOM, not a point on the screen."
          ru: "Пиксели сдвигаются. Playwright нужен элемент из DOM, а не точка на экране."
      - text:
          en: "Search app.js instead and copy whatever selector you find there."
          ru: "Поищи лучше в app.js и скопируй любой селектор, который там найдёшь."
        why:
          en: "The script shows how the page *could* be built, with all its conditions. What is actually there right now is in the live DOM — check it there."
          ru: "Скрипт показывает, как страница *может* строиться, со всеми условиями. А что на ней есть прямо сейчас — видно в живом DOM; проверяй там."
    hints:
      - en: "Where does the cart's content come from on Bloomly?"
        ru: "Откуда в Bloomly берётся содержимое корзины?"
      - en: "Tests look where users look: at the page in the browser."
        ru: "Тесты смотрят туда же, куда пользователи: на страницу в браузере."
    explain:
      en: "On Bloomly almost everything inside `<main>` is created by JavaScript. Searching the HTML files finds nothing, while the live DOM has the Apply button. Point the agent — or yourself — to the running page."
      ru: "В Bloomly почти всё внутри `<main>` создаёт JavaScript. Поиск по HTML-файлам ничего не находит, а в живом DOM кнопка Apply есть. Отправляй агента — и себя — к работающей странице."

  - id: c4-l1-k2
    kind: predict
    keyPoint: kp-html-vs-dom
    app: { state: { user: anna@bloomly.app } }
    context:
      en: "Anna is logged in and has 6 orders. On /orders the table appears about 0.4 s after the page opens; until then the page shows “Loading orders…”."
      ru: "Анна вошла в систему, у неё 6 заказов. На /orders таблица появляется примерно через 0,4 с после открытия страницы, а до этого видно «Loading orders…»."
    prompt:
      en: "Will this test pass or fail?"
      ru: "Этот тест пройдёт или упадёт?"
    code: |
      from playwright.sync_api import Page, expect


      def test_anna_sees_six_orders(page: Page):
          page.goto("/orders")
          rows = page.get_by_test_id("order-row").count()
          assert rows == 6
    outcome: fail
    reasons:
      - text:
          en: "It fails: `count()` looks at the DOM once, right away — the rows aren't there yet, so it gets 0"
          ru: "Упадёт: `count()` смотрит в DOM один раз и сразу — строк там ещё нет, поэтому получается 0"
        correct: true
      - text:
          en: "It passes: Anna has exactly six orders"
          ru: "Пройдёт: у Анны ровно шесть заказов"
        why:
          en: "She does — but the test counts before JavaScript has added them to the DOM."
          ru: "Это так, но тест считает раньше, чем JavaScript добавит их в DOM."
      - text:
          en: "It fails: /orders requires a login"
          ru: "Упадёт: для /orders нужен вход"
        why:
          en: "Anna is already logged in (preset state)."
          ru: "Анна уже вошла (предустановленное состояние)."
    hints:
      - en: "What is on the page right after `goto`?"
        ru: "Что на странице сразу после `goto`?"
      - en: "Does `count()` wait and retry, like `expect(...).to_have_count(6)` does?"
        ru: "`count()` ждёт и повторяет попытки, как `expect(...).to_have_count(6)`?"
    explain:
      en: 'The DOM changes after the page opens: first “Loading orders…”, 0.4 s later six rows. `count()` takes one look and gets 0, so `assert 0 == 6` fails. `expect(page.get_by_test_id("order-row")).to_have_count(6)` would retry until the live tree is ready.'
      ru: 'DOM меняется уже после открытия страницы: сначала «Loading orders…», через 0,4 с — шесть строк. `count()` смотрит один раз и получает 0, поэтому `assert 0 == 6` падает. `expect(page.get_by_test_id("order-row")).to_have_count(6)` повторял бы попытки, пока живое дерево не будет готово.'

  - id: c4-l1-k3
    kind: inspect
    keyPoint: kp-element-nesting
    app: { route: /login }
    prompt:
      en: "Select the element that contains *both* the Email field and the “Log in” button — their closest common parent."
      ru: "Выбери элемент, который содержит *и* поле Email, *и* кнопку «Log in», — их ближайшего общего родителя."
    target: "#login-form"
    view: dom
    show: []
    hints:
      - en: "Both sit in the same container. Find the Email `<input>` in the tree and look one level up."
        ru: "Оба лежат в одном контейнере. Найди в дереве `<input>` для Email и посмотри на уровень выше."
      - en: "It's not `<main>` — that one is further up. Take the closest one."
        ru: "Это не `<main>` — он выше. Нужен ближайший."
      - en: 'Select `<form id="login-form" …>`.'
        ru: 'Выбери `<form id="login-form" …>`.'
    explain:
      en: '`<form id="login-form">` is the parent of the labels, both fields, the checkbox and the button. `<main>` contains them too, but only as grandchildren — the form is the closest common parent.'
      ru: '`<form id="login-form">` — родитель подписей, обоих полей, чекбокса и кнопки. `<main>` тоже их содержит, но только как «внуков»; ближайший общий родитель — форма.'

  - id: c4-l1-k4
    kind: choice
    keyPoint: kp-element-nesting
    placement: true
    prompt:
      en: "This is Bloomly's main menu in the DOM. What text does the Cart link contain, as Playwright reads it?"
      ru: "Это главное меню Bloomly в DOM. Какой текст содержит ссылка Cart с точки зрения Playwright?"
    code: |
      <nav aria-label="Main">
        <a href="/shop">Shop</a>
        <a href="/orders">Orders</a>
        <a href="/cart">Cart <span data-testid="cart-count">0</span></a>
        <a href="/login">Log in</a>
      </nav>
    options:
      - text:
          en: "“Cart 0” — the `<span>` is inside the link"
          ru: "«Cart 0» — `<span>` лежит внутри ссылки"
        correct: true
        why:
          en: "The `<span>` opens and closes between `<a href=\"/cart\">` and `</a>`, so its text is part of the link's text."
          ru: '`<span>` открывается и закрывается между `<a href="/cart">` и `</a>`, поэтому его текст входит в текст ссылки.'
      - text:
          en: "“Cart” — the `<span>` is a separate element"
          ru: "«Cart» — `<span>` — это отдельный элемент"
        why:
          en: "Separate, yes — but nested *inside* `<a>`. A parent's text includes its children's text."
          ru: "Отдельный, да, — но вложенный *внутрь* `<a>`. Текст родителя включает текст дочерних элементов."
      - text:
          en: "“0” — the counter replaces the word"
          ru: "«0» — счётчик заменяет слово"
        why:
          en: "Both pieces of text sit between `<a …>` and `</a>`; nothing is replaced."
          ru: "Оба куска текста стоят между `<a …>` и `</a>`; ничего не заменяется."
      - text:
          en: "“Cart 0 Log in” — the text runs on into the next link"
          ru: "«Cart 0 Log in» — текст продолжается в следующей ссылке"
        why:
          en: "`</a>` closes the Cart link before the next `<a>` starts. Neighbours don't share text."
          ru: "`</a>` закрывает ссылку Cart до того, как начнётся следующий `<a>`. Соседи текстом не делятся."
    hints:
      - en: "Where does the `<span>` open and close — inside or outside the `<a>`?"
        ru: "Где открывается и закрывается `<span>` — внутри `<a>` или снаружи?"
      - en: "A parent's text includes the text of everything nested inside it."
        ru: "Текст родителя включает текст всего, что в него вложено."
    explain:
      en: "The counter `<span>` is a child of the Cart link. That's why tests see the link as “Cart 0” (or “Cart 2” with two items in the cart), not just “Cart”."
      ru: "`<span>` со счётчиком — дочерний элемент ссылки Cart. Поэтому тесты видят ссылку как «Cart 0» (или «Cart 2», если в корзине два товара), а не просто «Cart»."

  - id: c4-l1-k5
    kind: predict
    keyPoint: kp-dom-not-pixels
    app: { state: { cart: [{ id: rose-bouquet, qty: 1 }] } }
    context:
      en: "The cart has one Rose Bouquet. On /checkout, the gift message field is shown only after you tick “This is a gift”."
      ru: "В корзине один Rose Bouquet. На /checkout поле для поздравления показывается, только если отметить «This is a gift»."
    prompt:
      en: "Will this test pass or fail?"
      ru: "Этот тест пройдёт или упадёт?"
    code: |
      from playwright.sync_api import Page, expect


      def test_customer_can_write_a_gift_message(page: Page):
          page.goto("/checkout")
          page.get_by_label("Gift message").fill("Happy birthday!")
          expect(page.get_by_test_id("gift-counter")).to_have_text("15/200")
    outcome: fail
    reasons:
      - text:
          en: "It fails: the field is in the DOM but hidden, and Playwright won't type into an element a user can't see"
          ru: "Упадёт: поле есть в DOM, но скрыто, а Playwright не вводит текст в элемент, которого пользователь не видит"
        correct: true
      - text:
          en: "It passes: the field exists in the DOM, so Playwright can fill it"
          ru: "Пройдёт: поле есть в DOM, значит, Playwright может его заполнить"
        why:
          en: "Being in the DOM isn't enough. Before typing, Playwright waits for the field to become visible — a real user would need that too."
          ru: "Быть в DOM недостаточно. Прежде чем вводить текст, Playwright ждёт, пока поле станет видимым, — настоящему пользователю это тоже нужно."
      - text:
          en: "It fails: there is no element labelled “Gift message” anywhere in the DOM"
          ru: "Упадёт: элемента с подписью «Gift message» в DOM нет вообще"
        why:
          en: "It's there — the label and the textarea sit inside a hidden block. Playwright finds the field; it just never becomes visible."
          ru: "Он есть — подпись и textarea лежат внутри скрытого блока. Playwright поле находит, просто оно так и не становится видимым."
    hints:
      - en: "Is the field in the DOM? Is it visible?"
        ru: "Есть ли поле в DOM? Видно ли оно?"
      - en: "What does a user have to do first to see the field?"
        ru: "Что пользователь должен сделать сначала, чтобы увидеть поле?"
    explain:
      en: 'Playwright found the textarea in the DOM, waited for it to become visible until the timeout ran out and gave up. Add `page.get_by_label("This is a gift").check()` before typing, and the test passes.'
      ru: 'Playwright нашёл поле (textarea) в DOM, до конца таймаута ждал, пока оно станет видимым, и сдался. Добавь `page.get_by_label("This is a gift").check()` перед вводом — и тест пройдёт.'

  - id: c4-l1-k6
    kind: choice
    keyPoint: kp-dom-not-pixels
    multi: true
    context:
      en: "Kai's redesign changes only the CSS: new colors, a bigger header, the menu moves to the left. The HTML stays exactly the same."
      ru: "Редизайн Кая меняет только CSS: новые цвета, шапка побольше, меню переезжает влево. HTML остаётся ровно тем же."
    prompt:
      en: "Which of these lines will still work after the redesign? Pick all that apply."
      ru: "Какие из этих строк будут работать после редизайна? Выбери все подходящие."
    options:
      - text: 'page.get_by_role("link", name="Shop").click()'
        correct: true
        why:
          en: "It searches the DOM by role and name, and the redesign touched neither."
          ru: "Ищет в DOM по роли и имени, а редизайн не тронул ни то, ни другое."
      - text: 'expect(page.get_by_test_id("cart-count")).to_have_text("0")'
        correct: true
        why:
          en: "The test id is in the HTML, and the HTML didn't change."
          ru: "Test id записан в HTML, а HTML не изменился."
      - text: "page.mouse.click(1105, 32)  # the Cart link"
        why:
          en: "A point on the screen. The menu has moved, so the click lands on something else — or on nothing."
          ru: "Точка на экране. Меню переехало, и клик попадёт во что-то другое — или в пустоту."
      - text: 'page.get_by_label("Email").fill("anna@bloomly.app")'
        correct: true
        why:
          en: "The label and the field are the same elements in the DOM as before."
          ru: "Подпись и поле остались теми же элементами в DOM."
    optionsCode: true
    hints:
      - en: "What did the redesign change: the DOM or the picture?"
        ru: "Что изменил редизайн: DOM или картинку?"
      - en: "Only one line depends on where things are drawn on the screen."
        ru: "Только одна строка зависит от того, где что нарисовано на экране."
    explain:
      en: "CSS changes how elements look and where they are drawn; the DOM stays the same. Locators that search the DOM survive; a click at fixed coordinates doesn't."
      ru: "CSS меняет то, как элементы выглядят и где они нарисованы; DOM остаётся прежним. Локаторы, которые ищут в DOM, выживают, а клик по фиксированным координатам — нет."

  - id: c4-l1-k7
    kind: predict
    keyPoint: kp-dom-not-pixels
    prompt:
      en: "On /login you see one big green “Log in” button. Will this test pass or fail?"
      ru: "На /login ты видишь одну большую зелёную кнопку «Log in». Этот тест пройдёт или упадёт?"
    code: |
      from playwright.sync_api import Page, expect


      def test_anna_can_log_in(page: Page):
          page.goto("/login")
          page.get_by_label("Email").fill("anna@bloomly.app")
          page.get_by_label("Password").fill("bloom123")
          page.get_by_text("Log in").click()
          expect(page).to_have_url("http://localhost:3000/account")
    outcome: fail
    reasons:
      - text:
          en: "It fails: three elements in the DOM have the text “Log in” — the heading, the menu link and the button — and Playwright refuses to guess which one you mean"
          ru: "Упадёт: в DOM три элемента с текстом «Log in» — заголовок, ссылка в меню и кнопка, — и Playwright отказывается угадывать, какой из них имеется в виду"
        correct: true
      - text:
          en: "It passes: Playwright clicks the big green button"
          ru: "Пройдёт: Playwright кликнет по большой зелёной кнопке"
        why:
          en: "Size and color mean nothing to Playwright. In the DOM, the heading and the menu link say “Log in” too."
          ru: "Размер и цвет для Playwright ничего не значат. В DOM заголовок и ссылка в меню тоже говорят «Log in»."
      - text:
          en: "It fails: the password is wrong"
          ru: "Упадёт: пароль неверный"
        why:
          en: "bloom123 is Anna's correct password."
          ru: "bloom123 — правильный пароль Анны."
    hints:
      - en: "Look at the page with DOM eyes: where else does the text “Log in” appear?"
        ru: "Посмотри на страницу глазами DOM: где ещё встречается текст «Log in»?"
      - en: "Count them: the heading, the menu, the button."
        ru: "Посчитай: заголовок, меню, кнопка."
    explain:
      en: 'You see one button; the DOM has three elements with the text “Log in”. `get_by_text("Log in")` matches all three, so Playwright stops with a *strict mode violation* instead of clicking a random one. `get_by_role("button", name="Log in")` points to exactly one element.'
      ru: 'Ты видишь одну кнопку, а в DOM три элемента с текстом «Log in». `get_by_text("Log in")` находит все три, и Playwright останавливается с ошибкой *strict mode violation*, а не кликает наугад. `get_by_role("button", name="Log in")` указывает ровно на один элемент.'

  - id: c4-l1-k8
