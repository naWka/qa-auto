    reasons:
      - text:
          en: "Pass: all six buttons share the test id `add-to-cart` — one per card"
          ru: "Пройдёт: у всех шести кнопок общий test id `add-to-cart` — по одной на карточку"
        correct: true
        why:
          en: "Right — a test id can mark a repeated kind of element."
          ru: "Да — test id может помечать повторяющийся вид элементов."
      - text:
          en: "Fail: a test id must be unique, so Playwright throws a strict mode error"
          ru: "Упадёт: test id должен быть уникальным, поэтому Playwright выдаст ошибку строгого режима"
        why:
          en: "Strict mode applies to actions and single-element checks. `to_have_count` is made for many elements — and test ids may repeat."
          ru: "Строгий режим касается действий и проверок одного элемента. `to_have_count` создан для многих элементов — а test id могут повторяться."
