  - type: mistakes
    title: { en: "Attribute mistakes agents make", ru: "Ошибки с атрибутами, которые делают агенты" }
    items:
      - wrong: 'page.locator(".btn").click()'
        right: 'page.get_by_role("button", name="Proceed to checkout").click()'
        why:
          en: "A class is a style many elements share — three on the cart page alone. And Kai's redesign renames it."
          ru: "Класс — это стиль, общий для многих элементов: только в корзине их три. А Кай переименует его в редизайне."
      - wrong: 'expect(page.get_by_test_id("cart-counter")).to_have_text("1")'
        right: 'expect(page.get_by_test_id("cart-count")).to_have_text("1")'
        why:
          en: "Agents invent test ids that sound right. A test id exists only if a developer put it into the HTML — check it in DevTools."
          ru: "Агенты придумывают test id, которые звучат правдоподобно. Test id существует, только если разработчик добавил его в HTML, — проверь в DevTools."
      - wrong: 'expect(page.get_by_test_id("login-error")).to_be_attached()'
        right: 'expect(page.get_by_role("alert")).to_have_text("Invalid email or password.")'
        why:
          en: "The error box is always in the DOM, just `hidden`. “It exists” proves nothing — check that it shows the right text."
          ru: "Блок ошибки всегда есть в DOM, просто с `hidden`. «Он существует» ничего не доказывает — проверь, что он показывает нужный текст."
      - wrong: '<button type="button" data-testid="qty-plus">+</button>'
        right: '<button type="button" aria-label="Increase Rose Bouquet" data-testid="qty-plus">+</button>'
        why:
          en: "A test id never replaces a name for people. Add it next to `aria-label`, not instead of it."
          ru: "Test id никогда не заменяет имя для людей. Добавляй его рядом с `aria-label`, а не вместо него."

  - type: explain
    keyPoint: kp-class-vs-testid
    prompt:
      en: "In your own words: why does `data-testid=\"cart-count\"` survive Kai's redesign while `class=\"badge\"` doesn't? And why isn't a test id enough for the + button?"
      ru: 'Своими словами: почему `data-testid="cart-count"` переживёт редизайн Кая, а `class="badge"` — нет? И почему для кнопки + одного test id мало?'
    model:
      en: "A class is a style name: the team changes it whenever the look changes, and many elements share it. A data-testid exists only for tests, users never see it, and the team agrees not to rename it — so it survives a redesign. But a test id is invisible to people. The + button also needs its aria-label, “Increase Rose Bouquet”, because that's the only name a screen reader can announce — and the name get_by_role and the agent rely on."
      ru: "Класс — это имя стиля: команда меняет его при каждой смене внешнего вида, и его носят многие элементы. data-testid существует только для тестов, пользователь его не видит, а команда договорилась его не переименовывать — поэтому он переживает редизайн. Но test id невидим для людей. Кнопке + нужен ещё и aria-label «Increase Rose Bouquet»: это единственное имя, которое может произнести скринридер, — и то имя, на которое опираются get_by_role и агент."

