id: c4-l2
chapter: c4
title: { en: "Attributes: id, class, data-testid, aria-*", ru: "Атрибуты: id, class, data-testid, aria-*" }
goal:
  en: "Tell attributes that describe an element for people and tests from attributes that only serve styling."
  ru: "Отличать атрибуты, которые описывают элемент для людей и тестов, от атрибутов, которые нужны только для стилей."
minutes: 10
keyPoints:
  - id: kp-attributes
    title: { en: "Attributes are name=\"value\" pairs in the opening tag", ru: "Атрибуты — пары name=\"value\" в открывающем теге" }
  - id: kp-class-vs-testid
    title: { en: "class is for styling; data-testid exists only for tests", ru: "class — для стилей, data-testid — только для тестов" }
  - id: kp-aria-attributes
    title: { en: "aria-* give names and states to screen readers — and to Playwright", ru: "aria-* дают имена и состояния скринридерам — и Playwright" }
terms: [attribute, tag, element, css-selector, xpath, test-id, accessibility, locator]

steps:
  - type: story
    lines:
      - who: kai
        text:
          en: "Heads-up: the Bloomly 3.0 redesign is coming. New look, new CSS class names everywhere — `.btn`, `.badge` and all the rest will change."
          ru: "Предупреждаю: скоро выходит редизайн Bloomly 3.0. Новый вид и новые имена CSS-классов повсюду — `.btn`, `.badge` и все остальные поменяются."
      - who: petal
        text:
          en: "No problem! Most of my tests click `.btn`… oh."
          ru: "Без проблем! Почти все мои тесты кликают по `.btn`… ой."
      - who: maya
        text:
          en: "Let's look inside the tags. Some attributes change with every redesign; others are a promise to tests and to people. Today we learn to tell them apart."
          ru: "Давай заглянем внутрь тегов. Одни атрибуты меняются при каждом редизайне, другие — обещание тестам и людям. Сегодня научимся их различать."

  - type: pretest
    intro:
      en: "Quick guess before we start. Wrong answers are fine — they help you remember."
      ru: "Быстрая догадка перед стартом. Ошибаться можно — так лучше запоминается."
    items:
      - id: c4-l2-p1
        kind: input
        keyPoint: kp-attributes
        prompt:
          en: "How many attributes does this button have? Type a number."
          ru: "Сколько атрибутов у этой кнопки? Введи число."
        code: |
          <button type="submit" class="btn" data-testid="login-button">Log in</button>
        answers: ["3", "three", "три"]
        hints:
          - en: 'An attribute looks like `name="value"`.'
            ru: 'Атрибут выглядит как `name="value"`.'
          - en: "Count the `=` signs inside the opening tag `<button …>`."
            ru: "Посчитай знаки `=` внутри открывающего тега `<button …>`."
        explain:
          en: "Three: `type`, `class` and `data-testid`. They live inside the opening tag. “Log in” is the content, and `</button>` is the closing tag — neither is an attribute."
          ru: "Три: `type`, `class` и `data-testid`. Они живут внутри открывающего тега. «Log in» — содержимое, а `</button>` — закрывающий тег; ни то ни другое не атрибут."
      - id: c4-l2-p2
        kind: choice
        keyPoint: kp-class-vs-testid
        prompt:
          en: "Kai renames all CSS classes in the redesign. Which locator for the cart counter in the header survives?"
          ru: "Кай переименовывает при редизайне все CSS-классы. Какой локатор счётчика корзины в шапке это переживёт?"
        options:
          - text: 'page.get_by_test_id("cart-count")'
            correct: true
            why:
              en: "`data-testid` exists only for tests; a redesign doesn't touch it."
              ru: "`data-testid` существует только для тестов, редизайн его не трогает."
          - text: 'page.locator(".badge")'
            why:
              en: "`.badge` is a CSS class — exactly what Kai's redesign renames."
              ru: "`.badge` — это CSS-класс, ровно то, что Кай переименует в редизайне."
          - text: 'page.locator("header nav a:nth-child(3) span")'
            why:
              en: "It depends on the order and nesting of elements: one new nav link, and it points somewhere else."
              ru: "Он зависит от порядка и вложенности элементов: появится ещё одна ссылка в меню — и он укажет не туда."
        optionsCode: true
        hints:
          - en: "Which attribute has nothing to do with how the page looks?"
            ru: "Какой атрибут никак не связан с тем, как выглядит страница?"
          - en: "Its name even says who it's for."
            ru: "Его название прямо говорит, для кого он."
        explain:
          en: "Classes describe the look, so a redesign changes them. A test id is a promise to tests: “this is the cart counter”, whatever it looks like."
          ru: "Классы описывают внешний вид, поэтому редизайн их меняет. Test id — обещание тестам: «это счётчик корзины», как бы он ни выглядел."

  - type: theory
    keyPoint: kp-attributes
    title: { en: "Attributes: the fields of an element", ru: "Атрибуты: поля элемента" }
    body:
      - en: 'In the previous lesson you met [[tags|tag]] like `<button>` and `<input>`. An opening tag can carry extra information — [[attributes|attribute]]. Each one is a `name="value"` pair: `type="password"`, `placeholder="you@example.com"`.'
        ru: 'В прошлом уроке ты познакоми{лась|лся} с [[тегами|tag]] вроде `<button>` и `<input>`. Открывающий тег может нести дополнительную информацию — [[атрибуты|attribute]]. Каждый атрибут — пара `name="value"`: `type="password"`, `placeholder="you@example.com"`.'
      - en: "Think of a ticket in Jira. Everyone reads the title; the fields — key, priority, labels — describe the ticket. Attributes are the element's fields. `id` is like the ticket key: unique on the page (`id=\"email\"`). `type` changes behaviour: `type=\"password\"` hides what you type. `placeholder` is the grey hint in an empty field."
        ru: 'Вспомни тикет в Jira. Заголовок читают все, а поля — ключ, приоритет, метки — описывают сам тикет. Атрибуты — это поля элемента. `id` похож на ключ тикета: он уникален на странице (`id="email"`). `type` меняет поведение: `type="password"` скрывает вводимые символы. `placeholder` — серая подсказка в пустом поле.'
      - en: "Some attributes have no value at all: `disabled`, `hidden`, `checked`. Being there *is* the value. White Orchid's button below has `disabled`, so nobody can click it."
        ru: "У некоторых атрибутов значения нет вовсе: `disabled`, `hidden`, `checked`. Значение — *само их присутствие*. У кнопки White Orchid ниже есть `disabled`, поэтому нажать её нельзя."
    code: |
      <button type="button" class="btn small" data-testid="add-to-cart" data-id="white-orchid" disabled>Add to cart</button>
    mentor:
      en: "In DevTools, attributes appear right inside the tag, in their own colour. In a minute you'll read them on a live Bloomly page."
      ru: "В DevTools атрибуты видны прямо внутри тега, своим цветом. Через минуту ты прочитаешь их на живой странице Bloomly."

  - type: theory
    keyPoint: kp-class-vs-testid
    title: { en: "class is for looks, data-testid is for tests", ru: "class — для внешнего вида, data-testid — для тестов" }
    body:
      - en: '`class` holds style names for the stylesheet (CSS): `class="btn small secondary"` is three classes separated by spaces. Many [[elements|element]] share a class — every Bloomly button has `btn` — and the names change whenever the design does.'
        ru: '`class` хранит имена стилей для таблицы стилей (CSS): `class="btn small secondary"` — это три класса через пробел. Один класс носят многие [[элементы|element]] — у каждой кнопки Bloomly есть `btn`, — а имена меняются при каждой смене дизайна.'
      - en: "You'd never write a test step like “click the green rounded button”: after a redesign it's blue. A [[CSS selector|css-selector]] like `.btn.small` is that same step written in code. An [[XPath|xpath]] that walks the tree, like `//li[4]//button`, is no better: one extra wrapper, and it points somewhere else."
        ru: "Ты бы никогда не написал{а|} шаг теста «нажми зелёную скруглённую кнопку»: после редизайна она станет синей. [[CSS-селектор|css-selector]] вроде `.btn.small` — тот же шаг, только в коде. [[XPath|xpath]], который идёт по дереву, например `//li[4]//button`, не лучше: добавят одну обёртку — и он укажет на другое."
      - en: "Attributes that start with `data-` hold custom data for the page's own scripts (`data-id=\"rose-bouquet\"`). One of them is a convention just for tests: `data-testid`. Users never see it, a redesign doesn't touch it, and Playwright reads it with `get_by_test_id(\"cart-count\")`. That's a [[test ID|test-id]] — a contract between developers and QA."
        ru: 'Атрибуты, которые начинаются с `data-`, хранят собственные данные для скриптов страницы (`data-id="rose-bouquet"`). Один из них — договорённость только для тестов: `data-testid`. Пользователь его не видит, редизайн его не трогает, а Playwright читает его через `get_by_test_id("cart-count")`. Это [[test ID|test-id]] — контракт между разработчиками и QA.'
    figure: locator-priority
    mentor:
      en: "Roles and labels still come first — they check what users see. A test id is for things without a good name: the cart counter, a total, a product card. And agents love classes: when Petal writes `.btn.small`, ask which attribute would survive the redesign."
      ru: "Роли и подписи всё равно идут первыми — они проверяют то, что видит пользователь. Test id — для того, у чего нет хорошего имени: счётчик корзины, итоговая сумма, карточка товара. А агенты обожают классы: когда Petal пишет `.btn.small`, спроси, какой атрибут переживёт редизайн."

  - type: theory
    keyPoint: kp-aria-attributes
    title: { en: "aria-*: names and states for screen readers", ru: "aria-*: имена и состояния для скринридеров" }
    body:
      - en: "Some people don't look at the page — they listen to it through a screen reader. [[Accessibility|accessibility]] attributes, written `aria-*`, tell the screen reader what an element is called and what state it's in. Users who see the screen never notice them."
        ru: "Некоторые люди не смотрят на страницу — они слушают её через скринридер. Атрибуты [[доступности|accessibility]], которые пишутся как `aria-*`, сообщают скринридеру, как называется элемент и в каком он состоянии. Зрячие пользователи их даже не замечают."
      - en: |
          In Bloomly:
          - `aria-label` — a name when the visible text isn't enough: the cart's + button shows “+”, but it's named “Increase Rose Bouquet”.
          - `aria-hidden="true"` — “skip me”: the ✿ in the logo is decoration.
          - `aria-invalid="true"`, `aria-disabled="true"` — states: “this field is wrong”, “this control is off”. After a failed signup the Email field gets `aria-invalid`, and `aria-describedby` points to its error text.
          - `role="alert"` — same family: “read this out right away”. The login error box has it.
        ru: |
          В Bloomly:
          - `aria-label` — имя, когда видимого текста мало: кнопка + в корзине показывает «+», а называется «Increase Rose Bouquet».
          - `aria-hidden="true"` — «пропусти меня»: ✿ в логотипе — просто украшение.
          - `aria-invalid="true"`, `aria-disabled="true"` — состояния: «поле заполнено неверно», «элемент выключен». После неудачной регистрации поле Email получает `aria-invalid`, а `aria-describedby` указывает на текст ошибки.
          - `role="alert"` — из той же семьи: «прочитай это сразу». Он стоит на блоке ошибки входа.
      - en: "You've always checked that a wrong field shows an error. These attributes are the same check for a user who can't see the red border — real requirements you can test. Playwright reads them too: `get_by_role(\"button\", name=\"Increase Rose Bouquet\")` finds the + button through its `aria-label`. The next lesson goes deeper into roles and names."
        ru: 'Ты всегда проверял{а|}, что неверно заполненное поле показывает ошибку. Эти атрибуты — та же проверка для пользователя, который не видит красной рамки: настоящие требования, которые можно тестировать. Playwright тоже их читает: `get_by_role("button", name="Increase Rose Bouquet")` находит кнопку + через её `aria-label`. В следующем уроке разберём роли и имена подробнее.'
    code: |
      <a href="/" class="logo" aria-label="Bloomly home"><span class="logo-mark" aria-hidden="true">✿</span> Bloomly</a>
      <button type="button" data-qty="1" data-idx="0" aria-label="Increase Rose Bouquet">+</button>
    mentor:
      en: "An agent reads the page much like a screen reader does. A + button without `aria-label` is just “+” to Petal, so missing aria attributes turn into guessed locators. In a review that's two problems at once: an accessibility bug and a fragile test."
      ru: "Агент читает страницу почти так же, как скринридер. Кнопка + без `aria-label` для Petal — просто «+», поэтому из-за отсутствующих aria-атрибутов появляются угаданные локаторы. На ревью это сразу две проблемы: баг доступности и хрупкий тест."

  - type: inspect
    keyPoint: kp-attributes
    title: { en: "Read attributes on a live page", ru: "Читаем атрибуты на живой странице" }
    intro:
      en: "The cart with one Rose Bouquet, opened in the inspector. The − button is selected: read its attributes in the panel under the tree. Then click “Remove” and the total, and compare."
      ru: "Корзина с одним Rose Bouquet, открытая в инспекторе. Кнопка − уже выбрана: прочитай её атрибуты на панели под деревом. Потом нажми на «Remove» и на итоговую сумму и сравни."
    app: { route: /cart, state: { cart: [{ id: rose-bouquet, qty: 1 }] } }
    focus: "[aria-label='Decrease Rose Bouquet']"
    view: dom
    mentor:
      en: "For every attribute, ask: who is it for? **Behaviour and state:** `type`, `disabled`. **The app's own scripts:** `data-qty`, `data-idx`. **Looks:** `class`. **Tests:** `data-testid`. **People:** `aria-label` and the visible text. Find elements by the last two piles; check states like `disabled` with assertions such as `to_be_disabled()`."
      ru: "Про каждый атрибут спрашивай: для кого он? **Поведение и состояние:** `type`, `disabled`. **Собственные скрипты приложения:** `data-qty`, `data-idx`. **Внешний вид:** `class`. **Тесты:** `data-testid`. **Люди:** `aria-label` и видимый текст. Находи элементы по двум последним группам, а состояния вроде `disabled` проверяй проверками, например `to_be_disabled()`."

  - type: task
    task:
      id: c4-l2-t1
      kind: match
      keyPoint: kp-attributes
      prompt:
        en: "Match each attribute from Bloomly's HTML with its job."
        ru: "Сопоставь каждый атрибут из HTML Bloomly с его задачей."
      pairs:
        - left: 'id="email"'
          right: { en: "The element's unique address on the page", ru: "Уникальный адрес элемента на странице" }
        - left: 'type="password"'
          right: { en: "Changes behaviour: the field hides what you type", ru: "Меняет поведение: поле скрывает вводимые символы" }
        - left: 'class="btn small"'
          right: { en: "Style names for CSS: how it looks", ru: "Имена стилей для CSS: как элемент выглядит" }
        - left: 'data-testid="cart-total"'
          right: { en: "A hook that exists only for tests", ru: "Зацепка, которая существует только для тестов" }
        - left: 'aria-label="Increase Rose Bouquet"'
          right: { en: "A name for screen readers (and for Playwright)", ru: "Имя для скринридеров (и для Playwright)" }
        - left: "disabled"
          right: { en: "A state with no value: being there is enough", ru: "Состояние без значения: достаточно самого атрибута" }
      leftCode: true
      hints:
        - en: "Start with the ones whose names say it all: `data-testid`, `aria-label`."
          ru: "Начни с тех, чьи названия говорят сами за себя: `data-testid`, `aria-label`."
        - en: "`class` is about looks, `id` is about being the only one."
          ru: "`class` — про внешний вид, `id` — про то, что такой элемент один."
      praise:
        en: "Six attributes, six jobs. You can now read an opening tag like the fields of a ticket."
        ru: "Шесть атрибутов — шесть задач. Теперь ты читаешь открывающий тег, как поля тикета."
      explain:
        en: "Every attribute has one job. For a tester, two questions matter most: does a user see or hear it, and will it survive a redesign? `aria-label` and `data-testid` say yes; `class` says no."
        ru: "У каждого атрибута одна задача. Для тестировщика важнее всего два вопроса: видит или слышит ли его пользователь и переживёт ли он редизайн? У `aria-label` и `data-testid` ответ «да», у `class` — «нет»."

  - type: task
    task:
      id: c4-l2-t2
      kind: inspect
      keyPoint: kp-attributes
      app: { route: /login }
      prompt:
        en: "On the login page the error box is already in the DOM — you just can't see it. Find it in the Elements tree."
        ru: "На странице входа блок с ошибкой уже есть в DOM — просто его не видно. Найди его в дереве Elements."
      target: "[data-testid='login-error']"
      view: dom
      show: [attributes]
      hints:
        - en: "You can't click an invisible element on the page. Use the tree: open `<form id=\"login-form\">`."
          ru: 'По невидимому элементу на странице не кликнешь. Используй дерево: раскрой `<form id="login-form">`.'
        - en: "Look for an attribute with no value that hides an element."
          ru: "Ищи атрибут без значения, который прячет элемент."
        - en: "It's the first child of the form: `<div role=\"alert\" … hidden>`."
          ru: 'Это первый потомок формы: `<div role="alert" … hidden>`.'
      praise:
        en: "Found without seeing it. That's what reading the DOM gives you — tests see this tree, not the screen."
        ru: "Наш{ла|ёл}, не видя его. Вот что даёт чтение DOM: тесты видят это дерево, а не экран."
      explain:
        en: "`hidden` is a boolean attribute: while it's there, the box is invisible. After a wrong password the app removes `hidden` and fills in the text. So “the element exists” proves nothing here — a test checks `to_have_text(\"Invalid email or password.\")`. And `role=\"alert\"` makes screen readers announce the message as soon as it appears. (The panel says the name is empty — right: there's no text in the box yet.)"
        ru: '`hidden` — атрибут без значения: пока он есть, блок невидим. После неверного пароля приложение убирает `hidden` и вписывает текст. Поэтому «элемент существует» здесь ничего не доказывает — тест проверяет `to_have_text("Invalid email or password.")`. А `role="alert"` заставляет скринридер объявить сообщение, как только оно появится. (Панель пишет, что имя пустое, — так и есть: текста в блоке пока нет.)'

  - type: task
    task:
      id: c4-l2-t3
      kind: predict
      keyPoint: kp-class-vs-testid
      context:
        en: "Petal wrote this test before the redesign. The cart already has one Rose Bouquet."
        ru: "Petal написал этот тест ещё до редизайна. В корзине уже лежит один Rose Bouquet."
      prompt:
        en: "Will it pass or fail — today, before Kai changes anything?"
        ru: "Он пройдёт или упадёт — сегодня, пока Кай ничего не поменял?"
      app: { state: { cart: [{ id: rose-bouquet, qty: 1 }] } }
      code: |
        from playwright.sync_api import Page, expect


        def test_cart_leads_to_checkout(page: Page):
            page.goto("/cart")
            page.locator(".btn").click()
            expect(page).to_have_url("http://localhost:3000/checkout")
      outcome: fail
      reasons:
        - text:
            en: "Fail: three elements on the cart page have the class `btn`"
            ru: "Упадёт: класс `btn` есть у трёх элементов корзины"
          correct: true
          why:
            en: "Yes — Apply, Continue shopping and Proceed to checkout. A strict mode violation: one click, three candidates, and Playwright refuses to guess."
            ru: "Да — Apply, Continue shopping и Proceed to checkout. Нарушение строгого режима: один клик, три кандидата, и Playwright отказывается угадывать."
        - text:
            en: "Pass: `.btn` is the checkout button"
            ru: "Пройдёт: `.btn` — это кнопка оформления заказа"
          why:
            en: "`btn` is a button *style*. A class says how something looks, not what it is — and three elements look like that."
            ru: "`btn` — это *стиль* кнопки. Класс говорит, как элемент выглядит, а не что это, — а так выглядят три элемента."
        - text:
            en: "Fail: `/checkout` needs a login first"
            ru: "Упадёт: для `/checkout` сначала нужен вход"
          why:
            en: "Guests can open checkout. The test never gets that far anyway."
            ru: "Гости тоже могут открыть оформление заказа. Да тест туда и не доходит."
      hints:
        - en: "How many elements on the cart page look like Bloomly buttons?"
          ru: "Сколько элементов в корзине выглядят как кнопки Bloomly?"
        - en: "A class is shared. Count the elements with `btn` among their classes: Apply, Continue shopping, Proceed to checkout."
          ru: "Класс общий. Посчитай элементы, у которых среди классов есть `btn`: Apply, Continue shopping, Proceed to checkout."
      praise:
        en: "Right — the test is broken even before the redesign. A class was never an address."
        ru: "Верно — тест сломан ещё до редизайна. Класс никогда не был адресом."
      explain:
        en: 'The locator matches 3 elements, so `click()` stops with a strict mode violation instead of clicking a random one. A class describes a look that many elements share. Better: `get_by_role("button", name="Proceed to checkout")` or `get_by_test_id("checkout-button")`.'
        ru: 'Локатор находит 3 элемента, поэтому `click()` останавливается с нарушением строгого режима, а не кликает наугад. Класс описывает внешний вид, общий для многих элементов. Лучше: `get_by_role("button", name="Proceed to checkout")` или `get_by_test_id("checkout-button")`.'

  - type: task
    task:
      id: c4-l2-t4
