    hints:
      - en: "Is a test id like an `id` (one per page) or like a label for a kind of element?"
        ru: "Test id — это как `id` (один на страницу) или как метка для вида элементов?"
      - en: "`to_have_count` counts every match, disabled ones too."
        ru: "`to_have_count` считает все совпадения, неактивные тоже."
