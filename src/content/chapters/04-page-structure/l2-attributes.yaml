      - context: code-review
        en: "There's no data-testid=\"cart-counter\" in the DOM — it's cart-count. Please check test ids in DevTools before using them."
        ru: "В DOM нет data-testid=\"cart-counter\" — он называется cart-count. Пожалуйста, проверяй test id в DevTools, прежде чем их использовать."
      - context: code-review
        en: "Could you keep the aria-label next to the new data-testid? Without it, the + button has no name for screen readers."
        ru: "Можешь оставить aria-label рядом с новым data-testid? Без него у кнопки + нет имени для скринридеров."
        note:
          en: "A review comment on a developer's PR, not only on tests: accessibility is part of quality."
          ru: "Комментарий к PR разработчика, а не только к тестам: доступность — тоже часть качества."
      - context: chat
        en: "Kai, could we get a data-testid on the delivery estimate? It has no role or label we could use."
        ru: "Кай, можно добавить data-testid для срока доставки? У него нет ни роли, ни подписи, за которые можно зацепиться."
      - context: standup
        en: "Before the redesign lands, I'm moving our locators from CSS classes to roles and test ids."
        ru: "До выхода редизайна я перевожу наши локаторы с CSS-классов на роли и test id."
      - context: prompt
        en: "Don't use CSS classes or ids in locators. Prefer get_by_role and get_by_label; use get_by_test_id only for elements without a name."
        ru: "Не используй в локаторах CSS-классы и id. Предпочитай get_by_role и get_by_label; get_by_test_id — только для элементов без имени."
        note:
          en: "Worth saving in the project's rules for the agent, so you don't repeat it in every prompt."
          ru: "Это стоит один раз записать в правила проекта для агента, чтобы не повторять в каждом промпте."

