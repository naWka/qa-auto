      ru: 'Шесть карточек, шесть кнопок, один общий test id. Чтобы нажать одну из них, сузь поиск: `get_by_test_id("product-card").filter(has_text="Sunny Tulips").get_by_test_id("add-to-cart")`. Уникальным на странице обязан быть только атрибут `id`.'

