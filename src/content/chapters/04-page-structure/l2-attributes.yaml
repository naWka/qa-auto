  - id: c4-l2-k8
    kind: fix
    keyPoint: kp-aria-attributes
    app: { state: { cart: [{ id: rose-bouquet, qty: 1 }, { id: sunny-tulips, qty: 1 }] } }
    context:
      en: "The cart has two rows: Rose Bouquet and Sunny Tulips. Petal's test is red with a strict mode violation."
      ru: "В корзине две строки: Rose Bouquet и Sunny Tulips. Тест Petal красный из-за нарушения строгого режима."
    prompt:
      en: "Fix line 6: find the + button of the Sunny Tulips row by the name its `aria-label` gives it."
      ru: "Исправь строку 6: найди кнопку + в строке Sunny Tulips по имени, которое ей даёт `aria-label`."
    starter: |
      from playwright.sync_api import Page, expect


      def test_plus_raises_the_sunny_tulips_quantity(page: Page):
          page.goto("/cart")
          page.locator(".qty button:last-child").click()
          expect(page.get_by_label("Quantity of Sunny Tulips")).to_have_value("2")
    solution: |
      from playwright.sync_api import Page, expect


      def test_plus_raises_the_sunny_tulips_quantity(page: Page):
          page.goto("/cart")
          page.get_by_role("button", name="Increase Sunny Tulips").click()
          expect(page.get_by_label("Quantity of Sunny Tulips")).to_have_value("2")
    checks:
      expect: pass
      static: [noFragile]
    hints:
      - en: "`.qty button:last-child` matches the + button in *every* row. The aria-label tells the rows apart."
        ru: "`.qty button:last-child` находит кнопку + в *каждой* строке. Строки различает aria-label."
      - en: 'The + buttons are named “Increase <product>”. Use `page.get_by_role("button", name=...)`.'
        ru: 'Кнопки + называются «Increase <товар>». Используй `page.get_by_role("button", name=...)`.'
      - en: 'Line 6: `page.get_by_role("button", name="Increase Sunny Tulips").click()`'
        ru: 'Строка 6: `page.get_by_role("button", name="Increase Sunny Tulips").click()`'
    explain:
      en: "On screen both + buttons look identical; their `aria-label`s are different. That's why the same attribute that helps a screen-reader user also gives the test a precise, redesign-proof locator. Line 7 already uses one: `get_by_label` reads `aria-label` too."
      ru: "На экране обе кнопки + одинаковые, а их `aria-label` разные. Поэтому тот же атрибут, что помогает пользователю скринридера, даёт тесту точный локатор, которому не страшен редизайн. Строка 7 уже им пользуется: `get_by_label` тоже читает `aria-label`."
