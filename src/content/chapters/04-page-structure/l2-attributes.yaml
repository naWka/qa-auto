  - type: task
    task:
      id: c4-l2-t6
      kind: choice
      keyPoint: kp-aria-attributes
      context:
        en: "Kai wants the cart to be easier to test and opened a pull request. Here's his change to the + button in the cart row."
        ru: "Кай хочет, чтобы корзину было проще тестировать, и открыл пулл-реквест. Вот его изменение кнопки + в строке корзины."
      prompt:
        en: "You're the reviewer. What's your verdict?"
        ru: "Ты ревьюер. Какой вердикт?"
      diff:
        before: |
          <button type="button" data-qty="1" data-idx="0" aria-label="Increase Rose Bouquet">+</button>
        after: |
          <button type="button" data-qty="1" data-idx="0" data-testid="qty-plus">+</button>
      options:
        - text: { en: "Request changes: keep the `aria-label` and add the test id next to it", ru: "Запросить правки: оставить `aria-label`, а test id добавить рядом" }
          correct: true
          why:
            en: "Test ids and aria attributes serve different readers. Without `aria-label` the button is just “+” for a screen reader — and for Petal. That's an accessibility bug."
            ru: "Test id и aria-атрибуты служат разным читателям. Без `aria-label` кнопка для скринридера — да и для Petal — просто «+». Это баг доступности."
        - text: { en: "Approve: a test id is more stable than an aria-label", ru: "Одобрить: test id стабильнее, чем aria-label" }
          why:
            en: "Stability for tests isn't worth a nameless button for people. Both attributes can live on the same element."
            ru: "Стабильность для тестов не стоит безымянной кнопки для людей. Оба атрибута спокойно уживаются на одном элементе."
        - text: { en: "Approve: the button still shows “+”, so nothing changed for users", ru: "Одобрить: кнопка всё так же показывает «+», для пользователей ничего не изменилось" }
          why:
            en: "Nothing changed for sighted users. A screen-reader user now hears “+” — plus what? Rose Bouquet or Peony Dream?"
            ru: "Для зрячих — ничего. А пользователь скринридера теперь слышит «+» — плюс чего? Rose Bouquet или Peony Dream?"
        - text: { en: "Request changes: test ids don't belong in production HTML", ru: "Запросить правки: test id не место в боевом HTML" }
          why:
            en: "Test ids in production HTML are common and harmless. The real problem is the removed `aria-label`."
            ru: "Test id в боевом HTML — обычное и безвредное дело. Настоящая проблема — удалённый `aria-label`."
      hints:
        - en: "Read the diff attribute by attribute: what was added, what was removed?"
          ru: "Прочитай дифф по атрибутам: что добавилось, что пропало?"
        - en: "Who reads `aria-label`? Who reads `data-testid`?"
          ru: "Кто читает `aria-label`? А кто — `data-testid`?"
      praise:
        en: "You reviewed a frontend change like a tester: not “does it look the same”, but “does every reader still get what they need”."
        ru: "Ты проверил{а|} фронтенд-изменение как тестировщик: не «выглядит ли так же», а «получает ли каждый читатель то, что ему нужно»."
      explain:
        en: "`data-testid` is for tests; `aria-label` is for people — and for `get_by_role`. Kai can add one without removing the other: `aria-label=\"Increase Rose Bouquet\" data-testid=\"qty-plus\"`. In the next lesson you'll learn to catch accessibility bugs like this one with a test."
        ru: '`data-testid` — для тестов, `aria-label` — для людей, а заодно для `get_by_role`. Кай может добавить один, не удаляя другой: `aria-label="Increase Rose Bouquet" data-testid="qty-plus"`. В следующем уроке ты научишься ловить такие баги доступности тестом.'

