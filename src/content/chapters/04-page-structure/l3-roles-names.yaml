      solution: |
        from playwright.sync_api import Page, expect


        def test_customer_can_add_sunny_tulips_to_the_cart(page: Page):
            page.goto("/shop")
            card = page.get_by_test_id("product-card").filter(has_text="Sunny Tulips")
