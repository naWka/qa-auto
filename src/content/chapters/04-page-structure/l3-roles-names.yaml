  - type: theory
    keyPoint: kp-a11y-bug
    title: { en: "An accessibility bug is a real bug", ru: "Баг доступности — настоящий баг" }
    body:
      - en: "On Kai's preview build, “Add to cart” is a `<div>` styled like a button. With a mouse, everything works. But a `<div>` has no role: the Tab key never reaches it, Enter does nothing, and a screen reader doesn't announce a button. For keyboard and screen-reader users, the shop has no “Add to cart” at all."
        ru: "В превью-сборке Кая «Add to cart» — это `<div>`, оформленный как кнопка. Мышкой всё работает. Но у `<div>` нет роли: клавиша Tab до него не доходит, Enter ничего не делает, скринридер не объявляет кнопку. Для тех, кто пользуется клавиатурой или скринридером, кнопки «Add to cart» в магазине просто нет."
      - en: "That's an [[accessibility]] [[bug]] — as real as a wrong total. There's a standard rule for exactly this, WCAG 4.1.2 “Name, Role, Value”. And in the EU, the European Accessibility Act has made accessibility a legal requirement for most online shops since June 2025."
        ru: "Это [[баг|bug]] [[доступности|accessibility]] — такой же настоящий, как неверная сумма. Для него есть отдельное правило стандарта — WCAG 4.1.2 «Name, Role, Value». А в ЕС Европейский акт о доступности (European Accessibility Act) с июня 2025 года сделал доступность обязательной для большинства интернет-магазинов."
      - en: "A test that finds things by role and name fails on this build — it has caught the bug. A test with `get_by_text` or a CSS class stays green and hides it. And Petal? In its snapshot the `<div>` is a nameless `generic` — clickable, but with no role and no name — so for the test it guesses a locator, usually that CSS class."
        ru: "Тест, который ищет по роли и имени, на этой сборке падает — он поймал баг. Тест с `get_by_text` или CSS-классом остаётся зелёным и баг прячет. А Petal? В его снимке `<div>` — безымянный `generic`: по нему можно кликнуть, но ни роли, ни имени нет, поэтому для теста он угадывает локатор — обычно тот самый CSS-класс."
    code: |
      - button "Add to cart" [ref=e6]                    # normal build, in Petal's snapshot
      - generic [ref=e6] [cursor=pointer]: Add to cart   # Kai's preview build: no role, no name
    mentor:
      en: "When a role + name locator can't find something you can see, don't rush to “fix” the locator. Inspect the element first — maybe the test has just found a bug."
      ru: "Если локатор по роли и имени не находит то, что ты видишь, не спеши «чинить» локатор. Сначала проинспектируй элемент — возможно, тест только что нашёл баг."

