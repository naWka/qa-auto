            ru: "Не совсем понял, что ты хочешь, поэтому сделал по-своему: `.qty input` и `.qty button`. Зелёный ✅"
          code: |
            from playwright.sync_api import Page, expect


            def test_quantity_buttons_change_the_quantity(page: Page):
                page.goto("/cart")
                quantity = page.locator(".qty input")
                expect(quantity).to_have_value("1")
                page.locator(".qty button").last.click()
                expect(quantity).to_have_value("2")
                expect(page.get_by_test_id("row-subtotal")).to_have_text("€70.00")
      missing:
        keep:
          en: "Without “don't change the locators”, Petal “helpfully” made the test green with CSS. Now the suite can't notice the missing names — on this build or ever again."
          ru: "Без «не меняй локаторы» Petal «услужливо» сделал тест зелёным через CSS. Теперь набор тестов не заметит пропавшие имена — ни в этой сборке, ни потом."
        cause:
          en: "Without the cause, Petal's report says the button is “missing”. Kai will open the cart, see the “+”, and close the ticket as “works for me”."
          ru: "Без причины в отчёте Petal написано, что кнопка «отсутствует». Кай откроет корзину, увидит «+» и закроет тикет с пометкой «у меня работает»."
        report:
          en: "Without asking for a bug report, the finding stays in this chat — Kai never hears about it, and the bug ships."
          ru: "Без просьбы о баг-репорте находка остаётся в этом чате — Кай о ней не узнает, и баг уйдёт в релиз."
      checks:
        expect: fail
        static: [hasAssertion, noHardWait, noFragile]
        also:
          - app: { state: { cart: [{ id: rose-bouquet, qty: 1 }] } }
            expect: pass
      hints:
        - en: "Petal needs three things from you: what to do with the test, why it's red, and what happens next."
          ru: "Petal нужны от тебя три вещи: что делать с тестом, почему он красный и что дальше."
        - en: "“Any locator that works” turns a found bug into a hidden one."
          ru: "«Любой работающий локатор» превращает найденный баг в спрятанный."
        - en: "Pick keep, cause and report — and leave out “goes green”."
          ru: "Выбери «не меняй локаторы», «причина» и «баг-репорт» — а «чтобы позеленел» не бери."
      praise:
        en: "The test stays honest, and Kai gets a report he can act on. That's how a QA lead talks to an agent."
        ru: "Тест остался честным, а Кай получит отчёт, с которым можно работать. Так с агентом разговаривает QA-лид."
      explain:
        en: "A red role + name test on a build that *looks* fine is often the most valuable test in the suite. Your reply kept it, named the cause and turned it into a report with expected and actual accessible names. Petal on its own aims for green — it can't tell a test problem from a product bug. You can."
        ru: "Красный тест по роли и имени на сборке, которая *выглядит* нормально, — часто самый ценный тест в наборе. Твой ответ его сохранил, назвал причину и превратил находку в баг-репорт с ожидаемыми и фактическими доступными именами. Сам по себе Petal стремится к зелёному — он не отличает проблему теста от бага продукта. А ты отличаешь."

  - type: mistakes
    keyPoint: kp-accessible-name
    title: { en: "Role and name mistakes agents make", ru: "Ошибки с ролями и именами, которые делают агенты" }
    items:
      - wrong: 'page.get_by_role("button", name="+").click()'
        right: 'page.get_by_role("button", name="Increase Rose Bouquet").click()'
        why:
          en: "The name isn't what's drawn on screen. Inspect the element: the “+” is named by its aria-label."
          ru: "Имя — это не то, что нарисовано на экране. Проинспектируй элемент: «+» получает имя из aria-label."
      - wrong: 'page.get_by_role("password", name="Password").fill("bloom123")'
        right: 'page.get_by_role("textbox", name="Password").fill("bloom123")'
        why:
          en: "“password” is an input type, not a role. A password field is a textbox."
          ru: "«password» — это тип поля, а не роль. Поле пароля — это textbox."
      - wrong: 'page.get_by_role("link", name="Cart", exact=True).click()'
        right: 'page.get_by_role("link", name="Cart").click()'
        why:
          en: "The link's full name includes the count: “Cart 0”. `exact=True` needs the whole name, so it finds nothing."
          ru: "Полное имя ссылки включает количество: «Cart 0». `exact=True` требует имя целиком, поэтому ничего не находит."
      - wrong: 'page.locator("div.btn.small").click()  # no button found by role, so use the class'
        right: 'page.get_by_role("button", name="Add to cart").click()  # keep it red, report the bug'
        why:
          en: "A workaround makes the test green and hides an accessibility bug from everyone."
          ru: "Обходной путь делает тест зелёным и прячет баг доступности от всех."

  - type: explain
    keyPoint: kp-role-name-stable
    prompt:
      en: "In your own words: what are a role and an accessible name, and why is `get_by_role` with a name such a stable way to find an element?"
      ru: "Своими словами: что такое роль и доступное имя и почему `get_by_role` с именем — такой устойчивый способ найти элемент?"
    model:
      en: "A role says what an element is: button, link, textbox, heading. Most tags have one built in; a plain div has none. The accessible name is what a screen reader announces — it comes from an aria-label, a label, alt text or the text inside, so it isn't always what I see on screen. Users find things by exactly these two: “the Log in button”. So a role + name locator breaks only when users would notice a change too, while classes and layout can change in a redesign without anyone noticing. And when a role + name locator can't find an element I can see, I inspect it first: it may be an accessibility bug, not a broken test."
      ru: "Роль говорит, что это за элемент: button, link, textbox, heading. У большинства тегов она встроена, у обычного div её нет. Доступное имя — то, что произносит скринридер; оно берётся из aria-label, label, alt или текста внутри, поэтому не всегда совпадает с тем, что я вижу на экране. Пользователи находят элементы именно по этим двум вещам: «кнопка Log in». Поэтому локатор по роли и имени ломается, только когда изменение заметили бы и пользователи, а классы и вёрстка могут поменяться при редизайне так, что никто и не заметит. А если локатор по роли и имени не находит элемент, который я вижу, я сначала его инспектирую: возможно, это баг доступности, а не сломанный тест."

  - type: phrases
    items:
      - context: bug-report
        en: "Accessibility: \"Add to cart\" is a div, not a button — you can't reach it with Tab, and screen readers don't announce it."
        ru: "Доступность: «Add to cart» — это div, а не кнопка: до него не дойти клавишей Tab, и скринридеры его не объявляют."
        note:
          en: "Name the user impact, not just the markup. WCAG 4.1.2 is a good reference for the ticket."
          ru: "Называй, как это влияет на пользователей, а не только разметку. Хорошая ссылка для тикета — WCAG 4.1.2."
      - context: code-review
        en: 'Could we use get_by_role("button", name="Increase Rose Bouquet") instead of the CSS path? It''ll survive the redesign.'
        ru: 'Может, используем get_by_role("button", name="Increase Rose Bouquet") вместо CSS-пути? Он переживёт редизайн.'
      - context: chat
        en: "Kai, the −/+ buttons lost their aria-labels in the preview build — screen readers just say “plus, button”."
        ru: "Кай, в превью-сборке кнопки −/+ потеряли aria-label — скринридеры говорят просто «плюс, кнопка»."
      - context: standup
        en: "The cart test is red on the preview build, and that's correct: it caught an accessibility bug. I've filed it for Kai."
        ru: "Тест корзины на превью-сборке красный, и это правильно: он поймал баг доступности. Я {завела|завёл} его на Кая."
      - context: prompt
        en: "Use the role and accessible name from the page, not what the icon looks like. If an element has no name, tell me instead of guessing."
        ru: "Бери роль и доступное имя со страницы, а не то, как выглядит иконка. Если у элемента нет имени, скажи мне, а не угадывай."
        note:
          en: "The last sentence matters most: it turns a silent guess into a finding."
          ru: "Главное — последнее предложение: оно превращает молчаливую догадку в находку."

checkPool:
  - id: c4-l3-k1
