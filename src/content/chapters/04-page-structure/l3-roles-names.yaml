id: c4-l3
chapter: c4
title: { en: "Roles and accessible names", ru: "Роли и доступные имена" }
goal:
  en: "Name the role and accessible name of any Bloomly element: button \"Log in\", textbox \"Email\", link \"Cart 0\"."
  ru: "Называть роль и доступное имя любого элемента Bloomly: button «Log in», textbox «Email», link «Cart 0»."
minutes: 11
keyPoints:
  - id: kp-role
    title: { en: "A role says what an element is", ru: "Роль говорит, что это за элемент" }
  - id: kp-accessible-name
    title: { en: "The accessible name comes from text, label, alt or aria-label", ru: "Доступное имя берётся из текста, label, alt или aria-label" }
  - id: kp-role-name-stable
    title: { en: "Role + name: how users find things — and the most stable way for tests", ru: "Роль + имя: так ищут пользователи — и так надёжнее всего искать тестам" }
  - id: kp-a11y-bug
    title: { en: "An accessibility bug is a real bug — and it confuses the agent too", ru: "Баг доступности — настоящий баг, и он сбивает с толку агента" }
terms: [accessible-name, accessibility, announce, reach, user-impact, workaround]

steps:
  - type: story
    lines:
      - who: kai
        text:
          en: "This week I'm redesigning the shop and the cart: new layout, new CSS classes. Petal's tests will survive that, right?"
          ru: "На этой неделе я переделываю дизайн магазина и корзины: новая вёрстка, новые CSS-классы. Тесты Petal ведь это переживут?"
      - who: sofia
        text:
          en: "And a beta tester who uses a screen reader says the cart on Kai's preview build only announces “minus, button… plus, button”. For which flower?"
          ru: "А ещё бета-тестировщица, которая пользуется скринридером, говорит, что корзина в превью-сборке Кая произносит только «минус, кнопка… плюс, кнопка». Для какого цветка?"
      - who: maya
        text:
          en: "Two questions, one answer: roles and accessible names. Let's learn to read them the way a screen reader, Playwright and Petal do."
          ru: "Два вопроса — один ответ: роли и доступные имена. Давай научимся читать их так, как это делают скринридер, Playwright и Petal."

  - type: pretest
    intro:
      en: "Quick guess before we start. Wrong answers are fine — they help you remember."
      ru: "Быстрая догадка перед стартом. Ошибаться можно — так лучше запоминается."
    items:
      - id: c4-l3-p1
        kind: choice
        keyPoint: kp-role
        prompt:
          en: "On the Bloomly login page a screen reader announces: “Remember me, checkbox, not checked”. Which word is the element's *role*?"
          ru: "На странице входа Bloomly скринридер произносит: «Remember me, checkbox, not checked». Какое слово здесь — *роль* элемента?"
        options:
          - text: "checkbox"
            correct: true
            why:
              en: "The role says what kind of element it is — and what you can do with it: tick it."
              ru: "Роль говорит, что это за элемент и что с ним можно делать: поставить галочку."
          - text: "Remember me"
            why:
              en: "That's its name: what it's called, not what it is."
              ru: "Это его имя: как он называется, а не что это такое."
          - text: "not checked"
            why:
              en: "That's its state. The state changes when you click; the role doesn't."
              ru: "Это его состояние. Состояние меняется от клика, а роль — нет."
          - text: "input"
            why:
              en: "That's the HTML tag. Screen readers don't announce tags — they announce roles."
              ru: "Это HTML-тег. Скринридер не произносит теги — он произносит роли."
        hints:
          - en: "How would you describe it in a test case: “tick the Remember me ___”?"
            ru: "Как бы ты описал{а|} его в тест-кейсе: «поставить галочку в ___ Remember me»?"
          - en: "One word is the name, one is the state, one is the tag."
            ru: "Одно слово — имя, одно — состояние, одно — тег."
        explain:
          en: 'A screen reader announces the name, the role and the state. `get_by_role("checkbox", name="Remember me")` searches by exactly the first two.'
          ru: 'Скринридер произносит имя, роль и состояние. `get_by_role("checkbox", name="Remember me")` ищет ровно по первым двум.'
      - id: c4-l3-p2
        kind: predict
        keyPoint: kp-accessible-name
        app: { state: { cart: [{ id: rose-bouquet, qty: 1 }] } }
        context:
          en: "The cart has 1 Rose Bouquet. On the screen, the button next to the quantity shows only a “+”."
          ru: "В корзине 1 Rose Bouquet. На экране кнопка рядом с количеством показывает только «+»."
        prompt:
          en: "Pass or fail?"
          ru: "Пройдёт или упадёт?"
        code: |
          from playwright.sync_api import Page, expect


          def test_plus_button_increases_the_quantity(page: Page):
              page.goto("/cart")
              page.get_by_role("button", name="Increase Rose Bouquet").click()
              expect(page.get_by_test_id("qty-input")).to_have_value("2")
        outcome: pass
        reasons:
          - text:
              en: "Pass: the button's accessible name is “Increase Rose Bouquet” — the “+” is only what's drawn on screen"
              ru: "Пройдёт: доступное имя кнопки — «Increase Rose Bouquet», а «+» — только то, что нарисовано на экране"
            correct: true
          - text:
              en: "Fail: there's no button with the text “Increase Rose Bouquet” on the page"
              ru: "Упадёт: на странице нет кнопки с текстом «Increase Rose Bouquet»"
            why:
              en: "There's no such *text* — but there is such a *name*. A name doesn't have to be visible."
              ru: "Такого *текста* нет — а такое *имя* есть. Имя не обязано быть видимым."
          - text:
              en: "Fail: get_by_role can't find buttons that show symbols"
              ru: "Упадёт: get_by_role не умеет находить кнопки, на которых нарисованы символы"
            why:
              en: "It finds any button by its role and name, whatever is drawn on it."
              ru: "Он находит любую кнопку по роли и имени, что бы на ней ни было нарисовано."
        hints:
          - en: "In lesson 2 you met an attribute that gives an element a name for screen readers."
            ru: "Во втором уроке ты {познакомилась|познакомился} с атрибутом, который даёт элементу имя для скринридеров."
          - en: "Kai gave the “+” button an `aria-label`."
            ru: "Кай добавил кнопке «+» атрибут `aria-label`."
        explain:
          en: "The button has `aria-label=\"Increase Rose Bouquet\"`. That's its accessible name: what a screen reader announces and what `get_by_role` matches. The “+” on screen doesn't matter. Let's see where names come from."
          ru: 'У кнопки есть `aria-label="Increase Rose Bouquet"`. Это её доступное имя: его произносит скринридер, и с ним сравнивает `get_by_role`. «+» на экране тут ни при чём. Давай разберёмся, откуда берутся имена.'

  - type: theory
    keyPoint: kp-role
    title: { en: "Role: what an element is", ru: "Роль: что это за элемент" }
    body:
      - en: "In a bug report you write “the **Log in button**”, “the **Email field**”, “the **Cart link**”. You say what kind of [[element]] it is — that's its [[role]]. A screen reader announces it (“Log in, button”), and `get_by_role` searches by it."
        ru: "В баг-репорте ты пишешь «**кнопка** Log in», «**поле** Email», «**ссылка** Cart». Ты называешь, что это за [[элемент|element]], — это и есть его [[роль|role]]. Скринридер её произносит («Log in, button»), а `get_by_role` по ней ищет."
      - en: 'Most [[tags|tag]] have a role built in: `<button>` is a button, `<a href=…>` is a link, `<h1>`–`<h6>` are headings, `<input type="checkbox">` is a checkbox. Some are less obvious: a password field and a text field are both a **textbox**, a number field is a **spinbutton**.'
        ru: 'У большинства [[тегов|tag]] роль встроена: `<button>` — это button, `<a href=…>` — link, `<h1>`–`<h6>` — heading, `<input type="checkbox">` — checkbox. Есть и неочевидные: и поле пароля, и обычное текстовое поле — это **textbox**, а числовое поле — **spinbutton**.'
      - en: "A role can also be written by hand: Bloomly's login error box is `<div role=\"alert\">`. And a plain `<div>` or `<span>` has no role at all — it's just a box, whatever it looks like on screen."
        ru: 'Роль можно задать и вручную: блок ошибки на странице входа Bloomly — это `<div role="alert">`. А у обычного `<div>` или `<span>` роли нет вовсе — это просто коробка, как бы она ни выглядела на экране.'
    code: |
      <button type="submit">Log in</button>   <!-- button -->
      <a href="/cart">Cart 0</a>              <!-- link -->
      <input type="password">                 <!-- textbox -->
      <input type="checkbox">                 <!-- checkbox -->
      <h1>Your cart</h1>                      <!-- heading (level 1) -->
      <div role="alert">…</div>               <!-- alert (written by hand) -->
      <div class="btn">Add to cart</div>      <!-- no role: just a box -->
    mentor:
      en: "You've been reading `get_by_role(\"button\", name=\"Log in\")` since chapter 1. The first part is the role. Now you know where it comes from."
      ru: 'Ты читаешь `get_by_role("button", name="Log in")` с первой главы. Первая часть — это роль. Теперь ты знаешь, откуда она берётся.'

  - type: theory
    keyPoint: kp-accessible-name
    title: { en: "Accessible name: what it's called", ru: "Доступное имя: как элемент называется" }
    body:
      - en: 'In a test case you quote the label: click “Proceed to checkout”. For the browser, that quote is the [[accessible name|accessible-name]] — the words a screen reader says before the role: “Proceed to checkout, button”. The `name="…"` part of `get_by_role` is compared with it.'
        ru: 'В тест-кейсе ты берёшь надпись в кавычки: нажать «Proceed to checkout». Для браузера эти слова в кавычках — [[доступное имя|accessible-name]]: то, что скринридер произносит перед ролью: «Proceed to checkout, button». С ним и сравнивается часть `name="…"` в `get_by_role`.'
      - en: 'Where it comes from: an `aria-label`, if there is one, wins. Otherwise each element has its own source — the text inside for buttons, links and headings; the `<label>` for form fields; `alt` for images; `<caption>` for tables. A `placeholder` is only a weak last resort for fields. Anything marked `aria-hidden="true"` is skipped.'
        ru: 'Откуда оно берётся: если есть `aria-label`, побеждает он. Иначе у каждого элемента свой источник: текст внутри — у кнопок, ссылок и заголовков; `<label>` — у полей формы; `alt` — у картинок; `<caption>` — у таблиц. `placeholder` — лишь слабый запасной вариант для полей. Всё, что помечено `aria-hidden="true"`, пропускается.'
      - en: "So the name isn't always what you see. In the cart, the “+” is named “Increase Rose Bouquet”. The header link reads “Cart 1” — the count is part of its name."
        ru: "Поэтому имя — не всегда то, что видно. В корзине «+» называется «Increase Rose Bouquet». А ссылка в шапке читается как «Cart 1» — количество входит в её имя."
    mentor:
      en: "The name is what a screen-reader user hears — and what Petal reads in its [[accessibility snapshot|accessibility-snapshot]]. When a name is empty or vague, both of them are lost."
      ru: "Имя — это то, что слышит пользователь скринридера и что Petal читает в своём [[снимке доступности|accessibility-snapshot]]. Если имя пустое или невнятное, теряются оба."

  - type: inspect
    keyPoint: kp-accessible-name
    title: { en: "Look under the hood of the cart", ru: "Загляни под капот корзины" }
    intro:
      en: "This is the live Bloomly cart with one Rose Bouquet. Click elements on the page or in the tree and watch **Role** and **Accessible name** in the panel — the arrow shows where the name comes from. Try the “−” and “+” buttons, the quantity field, “Remove” and the last column header, which looks empty. Then open the **Agent’s view** tab."
      ru: "Это живая корзина Bloomly с одним Rose Bouquet. Нажимай на элементы на странице или в дереве и смотри на **Роль** и **Доступное имя** на панели — стрелка показывает, откуда взялось имя. Попробуй кнопки «−» и «+», поле количества, «Remove» и заголовок последней колонки, который выглядит пустым. Потом открой вкладку **Взгляд агента**."
    app: { route: /cart, state: { cart: [{ id: rose-bouquet, qty: 1 }] } }
    focus: "[aria-label='Increase Rose Bouquet']"
    view: both
    mentor:
      en: "The empty-looking header is named “Actions”: the text is hidden from the eye with CSS, but not from screen readers. And in the Agent’s view almost every line is a role followed by a name. That's all Petal gets."
      ru: "Пустой на вид заголовок называется «Actions»: текст спрятан от глаз с помощью CSS, но не от скринридера. А во «Взгляде агента» почти каждая строка — это роль, а за ней имя. Больше Petal ничего не получает."

  - type: task
    task:
      id: c4-l3-t1
      kind: match
      keyPoint: kp-role
      prompt:
        en: "Match each piece of Bloomly HTML with the role Playwright gives it."
        ru: "Сопоставь каждый фрагмент HTML Bloomly с ролью, которую ему даёт Playwright."
      pairs:
        - { left: '<button type="submit">Log in</button>', right: "button" }
        - { left: '<a href="/orders">Orders</a>', right: "link" }
        - { left: '<input type="password" id="password">', right: "textbox" }
        - { left: '<input type="checkbox" id="remember">', right: "checkbox" }
        - { left: '<h1>Your cart</h1>', right: "heading" }
        - { left: '<div role="alert">…</div>', right: "alert" }
      leftCode: true
      rightCode: true
      hints:
        - en: "Read each one aloud the way a screen reader would: “Orders, …?”"
          ru: "Прочитай каждый вслух, как скринридер: «Orders, …?»"
        - en: "A password field is still a field you type text into."
          ru: "Поле пароля — всё равно поле, в которое вводят текст."
        - en: "Only one element has its role written by hand, as an attribute."
          ru: "Только у одного элемента роль задана вручную — атрибутом."
      praise:
        en: "Six for six — including the password field, which trips up many people (and agents)."
        ru: "Шесть из шести — включая поле пароля, на котором спотыкаются многие (и агенты тоже)."
      explain:
        en: "Five roles come built into the tags; `alert` is written by hand with `role=\"alert\"`. The tricky one: there's no role “password”. A password input is a textbox, so `get_by_role(\"textbox\")` on /login finds two fields — Email and Password."
        ru: 'Пять ролей встроены в теги, а `alert` задан вручную через `role="alert"`. Подвох в другом: роли «password» не существует. Поле пароля — это textbox, поэтому `get_by_role("textbox")` на /login находит два поля — Email и Password.'

  - type: task
    task:
      id: c4-l3-t2
      kind: inspect
      keyPoint: kp-accessible-name
      app: { route: /cart, state: { cart: [{ id: rose-bouquet, qty: 1 }, { id: sunny-tulips, qty: 2 }] } }
      prompt:
        en: "Both rows show the same “−” sign. Find the button a screen reader announces as “Decrease Sunny Tulips, button”."
        ru: "В обеих строках один и тот же знак «−». Найди кнопку, которую скринридер объявляет как «Decrease Sunny Tulips, button»."
      target: "[aria-label='Decrease Sunny Tulips']"
      view: both
      show: [role, name]
      hints:
        - en: "Click a “−” and read the Accessible name in the panel."
          ru: "Нажми на «−» и прочитай Доступное имя на панели."
        - en: "The name comes from an `aria-label`, and each row has its own."
          ru: "Имя берётся из `aria-label`, и у каждой строки он свой."
        - en: "It's the “−” in the Sunny Tulips row — the second row of the table."
          ru: "Это «−» в строке Sunny Tulips — второй строке таблицы."
      praise:
        en: "You looked past the “−” to the name. That's exactly how get_by_role sees the page."
        ru: "Ты {посмотрела|посмотрел} сквозь «−» на имя. Ровно так страницу видит get_by_role."
      explain:
        en: "Every “−” looks the same, but each has its own `aria-label`: “Decrease Rose Bouquet”, “Decrease Sunny Tulips”. That's what a screen reader announces — and why `get_by_role(\"button\", name=\"Decrease Sunny Tulips\")` finds exactly one button, wherever the row is."
        ru: 'Все «−» выглядят одинаково, но у каждого свой `aria-label`: «Decrease Rose Bouquet», «Decrease Sunny Tulips». Именно это произносит скринридер — и поэтому `get_by_role("button", name="Decrease Sunny Tulips")` находит ровно одну кнопку, где бы ни стояла строка.'

  - type: task
    task:
      id: c4-l3-t3
      kind: choice
      keyPoint: kp-accessible-name
      prompt:
        en: "This is Bloomly's logo link from the header. What is its accessible name?"
        ru: "Это ссылка-логотип из шапки Bloomly. Какое у неё доступное имя?"
      code: |
        <a href="/" class="logo" aria-label="Bloomly home">
          <span class="logo-mark" aria-hidden="true">✿</span> Bloomly
        </a>
      options:
        - text: "Bloomly home"
          correct: true
          why:
            en: "`aria-label` wins over the text inside."
            ru: "`aria-label` побеждает текст внутри."
        - text: "✿ Bloomly"
          why:
            en: "That's what's drawn. The flower is `aria-hidden`, and the `aria-label` replaces the text anyway."
            ru: "Это то, что нарисовано. Цветок помечен `aria-hidden`, а текст всё равно заменяет `aria-label`."
        - text: "Bloomly"
          why:
            en: "That's the visible text — but when an element has an `aria-label`, the text inside isn't used for the name."
            ru: "Это видимый текст, но если у элемента есть `aria-label`, текст внутри для имени не используется."
        - text: "logo"
          why:
            en: "That's a CSS class. Classes are for styling and never become names."
            ru: "Это CSS-класс. Классы нужны для стилей и именами не становятся."
      hints:
        - en: "Which source wins when an element has an `aria-label`?"
          ru: "Какой источник побеждает, если у элемента есть `aria-label`?"
        - en: '`aria-hidden="true"` hides the flower from screen readers; `class` is only for styling.'
          ru: '`aria-hidden="true"` прячет цветок от скринридеров, а `class` нужен только для стилей.'
      praise:
        en: "Right — you read the markup the way a screen reader does, not the way the screen looks."
        ru: "Верно — ты {прочитала|прочитал} разметку так, как её читает скринридер, а не так, как выглядит экран."
      explain:
        en: 'The link is announced as “Bloomly home, link”, so its locator is `get_by_role("link", name="Bloomly home")`. Good to know: by default Playwright matches part of the name, so `name="Bloomly"` would find it too — but now you know the full name.'
        ru: 'Ссылку объявляют как «Bloomly home, link», поэтому её локатор — `get_by_role("link", name="Bloomly home")`. Полезно знать: по умолчанию Playwright сравнивает и часть имени, так что `name="Bloomly"` её тоже найдёт, — но теперь ты знаешь полное имя.'

  - type: theory
    keyPoint: kp-role-name-stable
    title: { en: "Role + name: find things the way users do", ru: "Роль + имя: искать так, как ищут пользователи" }
    body:
      - en: "Nobody writes “click the third blue box in the form”. Users — and screen readers — find things by what they are and what they're called. A [[locator]] like `get_by_role(\"button\", name=\"Log in\")` says exactly that."
        ru: 'Никто не пишет «нажми на третий синий прямоугольник в форме». Пользователи — и скринридеры — находят элементы по тому, что это и как оно называется. [[Локатор|locator]] вида `get_by_role("button", name="Log in")` говорит ровно это.'
      - en: "That's why it's stable. Kai's redesign changes classes, colors, layout and the order of `<div>`s — users don't notice, and a role + name locator doesn't either. It breaks only when users would notice too: the button got a new name or stopped being a button. Then the test *should* fail."
        ru: "Поэтому он устойчивый. Редизайн Кая меняет классы, цвета, вёрстку и порядок `<div>` — пользователи этого не замечают, и локатор по роли и имени тоже. Он ломается, только когда изменение заметили бы и пользователи: у кнопки новое имя или она перестала быть кнопкой. Тогда тест *и должен* упасть."
      - en: "Petal's snapshot is made of roles and names, so it writes `get_by_role` naturally — when the page gives it real names. Where a name is missing, or Petal reads it off a screenshot (“+”), it guesses: an invented name or a CSS path. (Chapter 5 ranks all the locator types.)"
        ru: "Снимок Petal состоит из ролей и имён, поэтому `get_by_role` получается у него естественно — если страница даёт настоящие имена. Где имени нет или Petal читает его со скриншота («+»), он угадывает: выдумывает имя или строит CSS-путь. (Все виды локаторов мы разложим по полочкам в главе 5.)"
    code: |
      # Breaks when Kai renames a class or moves the button:
      page.locator(".qty > button:nth-child(3)").click()

      # Survives the redesign: this is how a user finds it
      page.get_by_role("button", name="Increase Rose Bouquet").click()
    mentor:
      en: "If a role + name test fails after a redesign, read the change first. Did the visible name change on purpose? Then the test case and the test get updated together — users will notice that change too."
      ru: "Если тест по роли и имени упал после редизайна, сначала посмотри на изменение. Видимое имя поменяли намеренно? Тогда вместе обновляются и тест-кейс, и тест — пользователи это изменение тоже заметят."

  - type: task
    task:
      id: c4-l3-t4
      kind: review
      keyPoint: kp-role-name-stable
      app: { state: { cart: [{ id: rose-bouquet, qty: 1 }] } }
      context:
        en: "Petal wrote this test for TC-441 from a screenshot of the cart, before Kai's redesign."
