      ru: "Ты {нашла|нашёл} слепое пятно во взгляде Petal — ровно там, где агент начинает угадывать."
    explain:
      en: "The quantity field lost its `aria-label`, and there's no `<label>` either, so the snapshot shows only `spinbutton` and its value. A screen reader says “spin button, 1” — 1 of what? Petal can't write `get_by_role(\"spinbutton\", name=…)` here, so it will guess. That's a bug to report, not a locator to work around."
      ru: 'Поле количества потеряло `aria-label`, а `<label>` у него тоже нет, поэтому в снимке видны только `spinbutton` и значение. Скринридер скажет «spin button, 1» — один чего? Petal не сможет написать здесь `get_by_role("spinbutton", name=…)` и начнёт угадывать. Это баг, о котором надо сообщить, а не повод искать обходной локатор.'

  - id: c4-l3-k8
    kind: choice
    keyPoint: kp-a11y-bug
    context:
      en: 'Kai''s preview build. Petal''s search test is red: `get_by_label("Search")` finds nothing. You inspect the field and see this — the `<label>` that used to be next to it is gone. Petal: “Shall I switch to `get_by_placeholder("Search flowers")`? Then it''s green.”'
      ru: 'Превью-сборка Кая. Тест поиска от Petal красный: `get_by_label("Search")` ничего не находит. Ты инспектируешь поле и видишь вот это — `<label>`, который раньше стоял рядом, пропал. Petal: «Переключиться на `get_by_placeholder("Search flowers")`? Тогда будет зелёный».'
    code: |
      <input id="search" type="search" placeholder="Search flowers">
    prompt:
      en: "What do you do?"
      ru: "Что ты сделаешь?"
    options:
      - text:
          en: "Keep the test and report an accessibility bug: the search field lost its label, and the placeholder is only a weak fallback name that disappears as soon as you type"
          ru: "Оставить тест и завести баг доступности: поле поиска потеряло подпись, а placeholder — лишь слабое запасное имя, которое исчезает, как только начинаешь печатать"
        correct: true
        why:
          en: "The test noticed a real regression. Your job is to make sure Kai hears about it."
          ru: "Тест заметил настоящую регрессию. Твоя задача — чтобы Кай о ней узнал."
      - text:
          en: "Approve Petal's change: the test goes green"
          ru: "Одобрить правку Petal: тест станет зелёным"
        why:
          en: "Green, and the bug ships. The test would stop checking what users rely on."
          ru: "Зелёный — и баг уходит в релиз. Тест перестанет проверять то, на что опираются пользователи."
      - text:
          en: "Re-run it: it's probably flaky"
          ru: "Перезапустить: наверное, он нестабильный"
        why:
          en: "It fails the same way every time. Nothing random here — the label is gone."
          ru: "Он каждый раз падает одинаково. Ничего случайного — подписи просто нет."
      - text:
          en: "Ask Petal to fix the test: it invented the label “Search”"
          ru: "Попросить Petal исправить тест: он выдумал подпись «Search»"
        why:
          en: "No — on the normal build the field has the label “Search”. The build changed, not the test."
          ru: "Нет — в обычной сборке у поля есть подпись «Search». Изменилась сборка, а не тест."
    hints:
      - en: "Did the test change, or the page?"
        ru: "Что изменилось — тест или страница?"
      - en: "Where does this field's name come from now? Is that a good source?"
        ru: "Откуда теперь берётся имя этого поля? Хороший ли это источник?"
    explain:
      en: "A missing label is an accessibility bug: screen readers fall back to the placeholder, and sighted users lose the hint as soon as they start typing. Switching the locator would hide it. Keep the test red, report the bug, and let the test go green when Kai puts the label back."
      ru: "Пропавшая подпись — баг доступности: скринридеры берут вместо неё placeholder, а зрячие пользователи теряют подсказку, как только начинают печатать. Смена локатора баг спрячет. Оставь тест красным, заведи баг — и пусть тест позеленеет, когда Кай вернёт подпись."
