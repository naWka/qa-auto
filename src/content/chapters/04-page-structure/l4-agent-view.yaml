      solution: |
        import { test, expect } from '@playwright/test';

        test('Delivered filter shows delivered orders only', async ({ page }) => {
          await page.goto('/orders');
          await page.getByRole('combobox', { name: 'Status' }).selectOption('Delivered');
          await expect(page.getByTestId('orders-summary')).toHaveText('Showing 3 of 6 orders');
        });
      checks:
        expect: pass
        static:
          - hasAssertion
          - noHardWait
          - rule: notRegex
            value: "Filter by status"
            message:
              en: "There is no element named “Filter by status” — take the name from the snapshot."
              ru: "Элемента с именем «Filter by status» нет — возьми имя из снимка."
      hints:
        - en: "Find the `combobox` line in the snapshot. What's in the quotes?"
