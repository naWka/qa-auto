  - id: c4-l4-k8
    kind: predict
    keyPoint: kp-verify-locators
    placement: true
    context:
      en: "Petal: “The home page has a big green ‘Shop now’ button. Verified ✅”"
      ru: "Petal: «На главной есть большая зелёная кнопка ‘Shop now’. Проверено ✅»"
    prompt:
      en: "Pass or fail?"
      ru: "Пройдёт или упадёт?"
    code: |
      import { test, expect } from '@playwright/test';

      test('Shop now opens the shop', async ({ page }) => {
        await page.goto('/');
        await page.getByRole('button', { name: 'Shop now' }).click();
        await expect(page).toHaveURL('/shop');
      });
    outcome: fail
    reasons:
      - text:
          en: "Fail: it looks like a button, but it's a link — `link \"Shop now\"` in the snapshot. No button has this name."
          ru: "Упадёт: выглядит как кнопка, но это ссылка — в снимке `link \"Shop now\"`. Кнопки с таким именем нет."
        correct: true
      - text:
          en: "Pass: the text “Shop now” is on the page."
          ru: "Пройдёт: текст «Shop now» есть на странице."
      - text:
          en: "Fail: the shop loads its products too slowly."
          ru: "Упадёт: магазин слишком медленно загружает товары."
    hints:
      - en: "Where does “Shop now” take you? What tag does that usually mean?"
        ru: "Куда ведёт «Shop now»? Какой тег это обычно означает?"
      - en: "Role first: is it `button` or `link`?"
        ru: "Сначала роль: это `button` или `link`?"
    explain:
      en: "Styling says “button”, the role says “link”: it's an `<a href=\"/shop\">`. `getByRole` checks the role, not the looks. One look in DevTools — or at the snapshot line — would have caught it."
      ru: "По стилю это «кнопка», по роли — «ссылка»: это `<a href=\"/shop\">`. `getByRole` проверяет роль, а не внешний вид. Один взгляд в DevTools — или на строку снимка — и ошибка была бы поймана."
