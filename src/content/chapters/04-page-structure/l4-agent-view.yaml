          - text: Status
          - combobox "Status" [ref=e10]:
            - option "All" [selected] [ref=e11]
            - option "Processing" [ref=e12]
            - option "Shipped" [ref=e13]
            - option "Delivered" [ref=e14]
            - option "Cancelled" [ref=e15]
          - text: Search orders
          - searchbox "Search orders" [ref=e16]:
            - /placeholder: Order number or product
          ```
      prompt:
