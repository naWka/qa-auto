          ru: "Имя — «Business». «Business account» — выдуманное, более длинное имя, с ним ничего не совпадёт."
    hints:
      - en: "Read the line: role first, name in quotes."
        ru: "Прочитай строку: сначала роль, потом имя в кавычках."
      - en: "`[checked]` on Personal shows the default; you need the other radio."
        ru: "`[checked]` у Personal показывает выбор по умолчанию; тебе нужна другая радиокнопка."
    explain:
      en: "`radio \"Business\"` → `getByRole('radio', { name: 'Business' })`. The snapshot also tells Petal that Personal is checked by default — useful when you write test cases."
      ru: "`radio \"Business\"` → `getByRole('radio', { name: 'Business' })`. А ещё снимок сообщает Petal, что по умолчанию выбран Personal, — это пригодится, когда пишешь тест-кейсы."

  - id: c4-l4-k5
    kind: review
    keyPoint: kp-snapshot-gaps
    app:
      bugs: [a11y-add-to-cart-div]
    context:
      en: |
        In this build “Add to cart” is a `<div>`. Petal's snapshot of the Sunny Tulips card:
        ```
        - article [ref=e28]:
          - img "Bunch of yellow tulips" [ref=e29]
          - heading "Sunny Tulips" [level=2] [ref=e30]
          - paragraph [ref=e31]: €24.00
          - generic [ref=e32] [cursor=pointer]: Add to cart
        ```
        Petal clicked `e32` while exploring — it worked. Then it wrote the test.
      ru: |
        В этой сборке «Add to cart» — это `<div>`. Снимок карточки Sunny Tulips, который получил Petal:
        ```
        - article [ref=e28]:
          - img "Bunch of yellow tulips" [ref=e29]
          - heading "Sunny Tulips" [level=2] [ref=e30]
          - paragraph [ref=e31]: €24.00
          - generic [ref=e32] [cursor=pointer]: Add to cart
        ```
        Исследуя страницу, Petal кликнул по `e32` — сработало. Потом он написал тест.
    prompt:
      en: "Petal had to fill gaps to write this test. Flag the invented parts."
      ru: "Чтобы написать этот тест, Petal пришлось заполнять дыры. Отметь выдуманные места."
    testCase:
      id: TC-465
      title: Product can be added to the cart from the shop
      steps:
        - { action: "Open /shop" }
        - { action: "Click \"Add to cart\" on the Sunny Tulips card", expected: "The header link shows \"Cart 1\"" }
    code: |
      import { test, expect } from '@playwright/test';

      test('Sunny Tulips can be added to the cart', async ({ page }) => {
        await page.goto('/shop');
        const card = page.getByTestId('product-card').filter({ hasText: 'Sunny Tulips' });
        await card.locator('.add-to-cart-btn').click();
        await expect(page.getByRole('link', { name: 'Cart (1)' })).toBeVisible();
      });
    issues:
      - line: 6
        type: hallucination
        note:
          en: "A snapshot never shows CSS classes, and the div has no role or name — so Petal invented `.add-to-cart-btn`. No element has this class. Report the missing button role instead."
          ru: "Снимок никогда не показывает CSS-классы, а у div нет ни роли, ни имени, — поэтому Petal выдумал `.add-to-cart-btn`. Элемента с таким классом нет. Вместо этого сообщи о пропавшей роли кнопки."
      - line: 7
        type: hallucination
        note:
          en: "The cart link is named “Cart 1”, not “Cart (1)”. Petal never looked at the header after the click and guessed a common format."
          ru: "Ссылка корзины называется «Cart 1», а не «Cart (1)». Petal не посмотрел на шапку после клика и угадал распространённый формат."
    types: [hallucination, wrong-assertion, wrong-data, hard-wait, no-assertion]
    hints:
      - en: "Compare each locator with the snapshot: does that class or that name appear anywhere?"
        ru: "Сравни каждый локатор со снимком: встречается ли там такой класс или такое имя?"
      - en: "One locator fills the gap left by the div; one name is a plain guess."
        ru: "Один локатор закрывает дыру, оставленную div; одно имя — просто догадка."
      - en: "Lines 6 and 7."
        ru: "Строки 6 и 7."
    explain:
      en: "The ref let Petal click during exploration, but a test needs a role and a name — and the div has neither, so Petal made up a class. Line 5 is fine. The honest fix is a bug report: once “Add to cart” is a button again, `card.getByRole('button', { name: 'Add to cart' })` works, and until then that test stays red for the right reason."
      ru: "Ref позволил Petal кликнуть при исследовании, но тесту нужны роль и имя, а у div нет ни того, ни другого, — вот Petal и придумал класс. Строка 5 в порядке. Честное исправление — баг-репорт: когда «Add to cart» снова станет кнопкой, сработает `card.getByRole('button', { name: 'Add to cart' })`, а до тех пор такой тест будет красным по правильной причине."

  - id: c4-l4-k6
    kind: choice
    keyPoint: kp-snapshot-gaps
    context:
      en: "After Kai's latest build, Petal's search test fails at `getByLabel('Search')`. Petal took a snapshot — it now shows `searchbox \"Search flowers\"` with no `text: Search` before it — and pushed this change: “Green again ✅”."
      ru: "После свежей сборки Кая тест поиска от Petal падает на `getByLabel('Search')`. Petal снял снимок — теперь там `searchbox \"Search flowers\"` и нет `text: Search` перед ним — и прислал такое изменение: «Снова зелёный ✅»."
    diff:
      before: |
        await page.getByLabel('Search').fill('rose');
      after: |
        await page.getByPlaceholder('Search flowers').fill('rose');
    prompt:
      en: "What do you do?"
      ru: "Что ты сделаешь?"
    options:
      - text: { en: "Request changes and report a bug: the search field lost its `<label>`. Keep `getByLabel('Search')`.", ru: "Запросить правки и завести баг: поле поиска потеряло `<label>`. Оставить `getByLabel('Search')`." }
        correct: true
        why:
          en: "The test caught a real accessibility regression. The fix belongs in the app, not in the test."
          ru: "Тест поймал настоящую регрессию доступности. Чинить нужно приложение, а не тест."
      - text: { en: "Approve: the test is green again", ru: "Одобрить: тест снова зелёный" }
        why:
          en: "It's green because it adapted to the bug. Now nothing will notice that the label is gone."
          ru: "Он зелёный, потому что подстроился под баг. Теперь никто не заметит, что метки нет."
      - text: { en: "Approve, but use `page.locator('#search')` — ids are more stable", ru: "Одобрить, но использовать `page.locator('#search')` — id надёжнее" }
        why:
          en: "Another workaround: the bug stays hidden, and screen reader users still get a field without a label."
          ru: "Ещё один обходной путь: баг остаётся скрытым, а пользователи скринридеров всё так же получают поле без метки."
      - text: { en: "Ask Petal to add `waitForTimeout(2000)` — the label may load late", ru: "Попросить Petal добавить `waitForTimeout(2000)` — метка может грузиться позже" }
        why:
          en: "The label isn't late, it's gone — the snapshot shows that. There's nothing to wait for."
          ru: "Метка не опаздывает — её нет, это видно по снимку. Ждать нечего."
    hints:
      - en: "Why did `getByLabel('Search')` start failing? Is it the test or the app that changed?"
        ru: "Почему `getByLabel('Search')` начал падать? Что изменилось — тест или приложение?"
      - en: "A missing label is an accessibility bug (lesson 3)."
        ru: "Пропавшая метка — это баг доступности (урок 3)."
    explain:
      en: "When the snapshot shows a gap that wasn't there before, ask “is this a bug?” before “how do we get green?”. A test that keeps the user-facing locator is your early warning for accessibility regressions."
      ru: "Если в снимке появилась дыра, которой раньше не было, сначала спроси «это баг?», а потом «как сделать зелёным?». Тест с локатором, ориентированным на пользователя, — твоё раннее предупреждение о регрессиях доступности."

  - id: c4-l4-k7
