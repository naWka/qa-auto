      ru: "Тесту нужен аккаунт типа Business. Какую строку должен написать Petal?"
    optionsCode: true
    options:
      - text: "await page.getByRole('radio', { name: 'Business' }).check();"
        correct: true
        why:
          en: "Role `radio`, name “Business” — straight from the snapshot line."
          ru: "Роль `radio`, имя «Business» — прямо из строки снимка."
      - text: "await page.getByRole('button', { name: 'Business' }).click();"
        why:
          en: "It looks like a choice button, but the snapshot says `radio`."
          ru: "Похоже на кнопку выбора, но в снимке написано `radio`."
      - text: "await page.locator('[ref=e22]').check();"
        why:
          en: "Refs are only in the snapshot, never in the page."
