      praise:
        en: "One word changed, and the test now points at the real filter. That's a fix based on evidence, not on a hunch."
        ru: "Одно слово — и тест указывает на настоящий фильтр. Это исправление на основе фактов, а не догадки."
      explain:
        en: "The role was right; the name was a description of what the control *does* (“Filter by status”) instead of what it's *called* (“Status”, from its `<label>`). Snapshot or DevTools tell you the name in seconds — adding a wait would never have helped."
        ru: "Роль была верной, а имя описывало, что элемент *делает* («Filter by status»), а не как он *называется* («Status», из его `<label>`). Снимок или DevTools подскажут имя за секунды — а ожидание здесь не помогло бы никогда."

  - type: mistakes
    keyPoint: kp-snapshot-gaps
    title: { en: "Typical mistakes with the agent's view", ru: "Типичные ошибки со взглядом агента" }
    items:
      - wrong: "await page.getByRole('button', { name: 'Increase quantity' }).click();"
        right: "await page.getByRole('button', { name: 'Increase Rose Bouquet' }).click();"
        why:
          en: "The name was guessed from other shops. Take names from the snapshot or DevTools, not from memory."
          ru: "Имя угадано по другим магазинам. Бери имена из снимка или DevTools, а не из памяти."
      - wrong: "await page.locator('[ref=e41]').click();"
        right: "await page.getByRole('button', { name: 'Apply' }).click();"
        why:
          en: "A ref lives only inside one snapshot. Turn the snapshot line into role + name."
          ru: "Ref живёт только внутри одного снимка. Превращай строку снимка в роль + имя."
      - wrong: "// getByLabel('Search') fails → switch to getByPlaceholder('Search flowers'). Green ✅"
        right: "// getByLabel('Search') fails → inspect: the <label> is gone → report an accessibility bug"
        why:
          en: "A gap in the snapshot is often a real bug. Don't let the agent work around it and hide it."
          ru: "Дыра в снимке — часто настоящий баг. Не давай агенту обойти его и спрятать."
      - wrong: "// Petal: \"Verified ✅\" → approve"
        right: "// Inspect each locator: role, exact name, exactly one match"
        why:
          en: "“Verified” is a claim, not evidence. Ten seconds in DevTools is evidence."
          ru: "«Проверено» — это заявление, а не доказательство. Десять секунд в DevTools — доказательство."

  - type: explain
    keyPoint: kp-mcp-snapshot
    prompt:
      en: "In your own words: how does Petal “see” Bloomly, and what happens when an element has no name in that view?"
      ru: "Своими словами: как Petal «видит» Bloomly и что происходит, если у элемента в этом представлении нет имени?"
    model:
      en: "Through Playwright MCP Petal gets an accessibility snapshot: a text tree of roles, names, states and refs — no colours, no layout. It writes locators from those roles and names. If an element has no role or no name, the snapshot has a gap, and Petal fills it with a guess from other sites — a locator that finds nothing or the wrong element. So I inspect the element in DevTools: role, exact name, one match. And if the name is really missing, I report an accessibility bug instead of letting the test work around it."
      ru: "Через Playwright MCP Petal получает снимок доступности — текстовое дерево из ролей, имён, состояний и ref, без цветов и вёрстки. Локаторы он пишет по этим ролям и именам. Если у элемента нет роли или имени, в снимке дыра, и Petal заполняет её догадкой с других сайтов — локатором, который ничего не находит или находит не то. Поэтому я проверяю элемент в DevTools: роль, точное имя, одно совпадение. А если имени действительно нет, я завожу баг доступности, а не даю тесту его обойти."

  - type: phrases
    items:
      - context: prompt
        en: "Before writing locators, open /cart with Playwright MCP and take a snapshot. Use roles and names exactly as they appear there — don't guess."
        ru: "Прежде чем писать локаторы, открой /cart через Playwright MCP и сними снимок. Используй роли и имена ровно так, как они там записаны, — не угадывай."
        note:
          en: "Add this line to any prompt that touches a page the agent hasn't seen yet."
          ru: "Добавляй эту строку в любой промпт о странице, которую агент ещё не видел."
      - context: code-review
        en: "Line 6: there's no button named “Increase quantity”. I inspected it — the accessible name is “Increase Rose Bouquet”."
        ru: "Строка 6: кнопки с именем «Increase quantity» нет. Я проверил{а|} в DevTools — доступное имя «Increase Rose Bouquet»."
      - context: code-review
        en: "This locator matches two elements — there's a “Remove” button in every row. Please filter by the row first."
        ru: "Этот локатор находит два элемента — кнопка «Remove» есть в каждой строке. Пожалуйста, сначала отфильтруй по строке."
      - context: bug-report
        en: "Accessibility: the search field on /shop has no label. Its accessible name comes only from the placeholder, and getByLabel('Search') finds nothing."
        ru: "Доступность: у поля поиска на /shop нет метки. Доступное имя берётся только из плейсхолдера, и getByLabel('Search') ничего не находит."
      - context: chat
        en: "Kai, quick one: in the latest build “Add to cart” is a div, so it has no button role. Was that intended?"
        ru: "Кай, быстрый вопрос: в последней сборке «Add to cart» — это div, поэтому у него нет роли button. Так и задумано?"
      - context: standup
        en: "Yesterday I checked Petal's locators in DevTools — three names were invented. Today I'm reviewing the fixes."
        ru: "Вчера я сверил{а|} локаторы Petal в DevTools — три имени были выдуманы. Сегодня проверяю исправления."

checkPool:
  - id: c4-l4-k1
    kind: choice
    keyPoint: kp-devtools-inspect
    placement: true
    prompt:
      en: "You right-click the “−” button in the cart and choose Inspect. The Elements panel shows the tag below. What does the Accessibility pane show?"
      ru: "Ты нажимаешь правой кнопкой на «−» в корзине и выбираешь «Просмотреть код». Панель Elements показывает тег ниже. Что покажет вкладка Accessibility?"
    code: |
      <button type="button" data-qty="-1" data-idx="0" aria-label="Decrease Rose Bouquet" disabled>−</button>
    options:
      - text: { en: "Role: button · Name: “Decrease Rose Bouquet”", ru: "Роль: button · имя: «Decrease Rose Bouquet»" }
        correct: true
        why:
          en: "A `<button>` has the button role, and `aria-label` gives the name — it wins over the “−” inside."
          ru: "У `<button>` роль button, а имя даёт `aria-label` — он важнее, чем «−» внутри."
      - text: { en: "Role: button · Name: “−”", ru: "Роль: button · имя: «−»" }
        why:
          en: "“−” is the visible text, but `aria-label` replaces it as the name."
          ru: "«−» — видимый текст, но имя заменяет `aria-label`."
      - text: { en: "Role: link · Name: “Decrease Rose Bouquet”", ru: "Роль: link · имя: «Decrease Rose Bouquet»" }
        why:
          en: "The tag is `<button>`, so the role is button. Links are `<a href>`."
          ru: "Тег — `<button>`, значит, роль button. Ссылки — это `<a href>`."
      - text: { en: "No name — the button is disabled", ru: "Имени нет — кнопка неактивна" }
        why:
          en: "Disabled elements keep their name; the snapshot just adds `[disabled]`."
          ru: "У неактивных элементов имя сохраняется; снимок просто добавляет `[disabled]`."
    hints:
      - en: "The tag gives the role; look for the attribute that gives the name."
        ru: "Тег даёт роль; найди атрибут, который даёт имя."
      - en: "`aria-label` beats the text inside."
        ru: "`aria-label` важнее текста внутри."
    explain:
      en: "Role from the tag, name from `aria-label`. That's what Playwright's `getByRole` and Petal's snapshot both use: `button \"Decrease Rose Bouquet\" [disabled]`."
      ru: "Роль — из тега, имя — из `aria-label`. Ровно это используют и `getByRole` в Playwright, и снимок Petal: `button \"Decrease Rose Bouquet\" [disabled]`."

  - id: c4-l4-k2
    kind: inspect
    keyPoint: kp-devtools-inspect
    app:
      route: /cart
      state: { cart: [{ id: rose-bouquet, qty: 1 }] }
    prompt:
      en: "The last column of the cart table has no visible header, yet Petal's snapshot lists `columnheader \"Actions\"`. Find where “Actions” lives: select it in the Elements tree or on the page."
      ru: "У последней колонки таблицы корзины нет видимого заголовка, но в снимке Petal есть `columnheader \"Actions\"`. Найди, где живёт «Actions»: выбери его в дереве Elements или на странице."
    target: "thead th:last-child, .sr-only"
    view: dom
    show: [attributes]
    hints:
      - en: "Column headers live in `<thead>`, inside `<table>`."
        ru: "Заголовки колонок живут в `<thead>`, внутри `<table>`."
      - en: "Open the last `<th>`: something is inside it that you can't see on screen."
        ru: "Раскрой последний `<th>`: внутри есть что-то, чего не видно на экране."
      - en: "Select `<span class=\"sr-only\">Actions</span>` (or its `<th>`)."
        ru: "Выбери `<span class=\"sr-only\">Actions</span>` (или его `<th>`)."
    explain:
      en: "The header holds `<span class=\"sr-only\">Actions</span>`: text hidden from the eyes with CSS but kept for screen readers. You can't see it; DevTools and the snapshot can. So when the agent “knows” a name you don't see — inspect before you call it a hallucination."
      ru: "В заголовке лежит `<span class=\"sr-only\">Actions</span>` — текст, спрятанный от глаз с помощью CSS, но оставленный для скринридеров. Ты его не видишь, а DevTools и снимок — видят. Поэтому, если агент «знает» имя, которого ты не видишь, — проверь в DevTools, прежде чем называть это галлюцинацией."

  - id: c4-l4-k3
    kind: predict
    keyPoint: kp-mcp-snapshot
    context:
      en: "Petal explored /cart through Playwright MCP, saw the line `- heading \"Your cart\" [level=1] [ref=e9]` and pasted the ref straight into the test."
      ru: "Petal исследовал /cart через Playwright MCP, увидел строку `- heading \"Your cart\" [level=1] [ref=e9]` и вставил ref прямо в тест."
    prompt:
      en: "Pass or fail?"
      ru: "Пройдёт или упадёт?"
    code: |
      import { test, expect } from '@playwright/test';

      test('cart page has a heading', async ({ page }) => {
        await page.goto('/cart');
        await expect(page.locator('[ref=e9]')).toHaveText('Your cart');
      });
    outcome: fail
    reasons:
      - text:
          en: "Fail: refs exist only inside the snapshot. The page's HTML has no `ref` attribute, so nothing matches."
          ru: "Упадёт: ref существуют только внутри снимка. В HTML страницы атрибута `ref` нет, совпадений не будет."
        correct: true
      - text:
          en: "Pass: e9 is the heading, the snapshot says so."
          ru: "Пройдёт: e9 — это заголовок, так написано в снимке."
      - text:
          en: "Fail: the heading on an empty cart is “Cart”, not “Your cart”."
          ru: "Упадёт: на пустой корзине заголовок «Cart», а не «Your cart»."
    hints:
      - en: "Where does `[ref=e9]` come from — the page's HTML or the snapshot?"
        ru: "Откуда берётся `[ref=e9]` — из HTML страницы или из снимка?"
      - en: "`page.locator('[ref=e9]')` looks for an HTML attribute called `ref`."
        ru: "`page.locator('[ref=e9]')` ищет HTML-атрибут с именем `ref`."
    explain:
      en: "Refs are handles the agent uses while exploring; the page never has them. The test should use the line's role and name: `getByRole('heading', { name: 'Your cart' })`."
      ru: "Ref — это ярлыки, которыми агент пользуется при исследовании; на самой странице их нет. В тесте нужны роль и имя из строки: `getByRole('heading', { name: 'Your cart' })`."

  - id: c4-l4-k4
    kind: choice
    keyPoint: kp-mcp-snapshot
    context:
      en: "Part of Petal's /signup snapshot:"
      ru: "Часть снимка /signup, который получил Petal:"
    code: |
      - group "Account type" [ref=e20]:
        - text: Account type
        - radio "Personal" [checked] [ref=e21]
        - text: Personal
