            test('shop shows products', async ({ page }) => {
              await page.goto('/shop');
              await expect(page.getByTestId('product-card')).toHaveCount(6);
            });
      missing:
        case:
          en: "Without the test case Petal didn't know which product or which result to check — it only counted the cards."
          ru: "Без тест-кейса Petal не знал, какой товар и какой результат проверять, — он просто посчитал карточки."
        ladder:
          en: "Without the locator ladder Petal fell back on CSS classes and list positions from memory: green on production, red after Kai's redesign."
          ru: "Без лестницы локаторов Petal вернулся к CSS-классам и позициям в списке, которые помнил: зелёный на проде, красный после редизайна Кая."
        narrow:
          en: "Without the rule for several matches Petal silenced strict mode with `.last()`: green today, the wrong product as soon as the sort order or the catalogue changes."
          ru: "Без правила про несколько совпадений Petal заглушил строгий режим через `.last()`: сегодня зелёный, а при новой сортировке или новом товаре — уже не тот товар."
        snapshot:
          en: "Without the snapshot rule Petal guessed the button name from memory. “Add White Orchid to cart” doesn't exist, so the test fails for the wrong reason."
          ru: "Без правила про снимок Petal угадал имя кнопки по памяти. Кнопки «Add White Orchid to cart» не существует, поэтому тест падает не по той причине."
      checks:
        expect: pass
        static:
          - hasAssertion
          - noFragile
          - noHardWait
          - rule: notRegex
            value: '\.(first|last|nth)\('
            message:
              en: "The test picks an element by its position. Narrow to the White Orchid card instead."
              ru: "Тест выбирает элемент по позиции. Вместо этого сузь поиск до карточки White Orchid."
