        - en: "One trap ties locators to today's markup; the other answers “which one?” with a position. You've fixed both kinds of problem in this boss."
          ru: "Одна ловушка привязывает локаторы к сегодняшней разметке, другая отвечает на вопрос «какой именно?» позицией. Обе такие проблемы ты уже {исправляла|исправлял} в этом боссе."
        - en: "Take the test case, the locator ladder, the rule for several matches and the snapshot rule. Leave out the design-system classes and “pick by position”."
          ru: "Возьми тест-кейс, лестницу локаторов, правило про несколько совпадений и правило про снимок. Блоки про классы дизайн-системы и «выбери по позиции» не бери."
      praise:
        en: "You left out both shortcuts and kept every rule that matters. These lines now go into CLAUDE.md — and every next prompt gets them for free."
        ru: "Ты {обошла|обошёл} обе ловушки и {оставила|оставил} все важные правила. Эти строки теперь отправятся в CLAUDE.md — и каждый следующий промпт получит их бесплатно."
      explain:
        en: "The best prompt is TC-582 plus three rules: the locator ladder, “narrow, don't pick by position” and “take names from the live page”. Each rule closes a failure you saw today: CSS from memory breaks on a redesign, positions break on a new sort order, guessed names break on day one. Written into CLAUDE.md (or `.github/copilot-instructions.md` for Copilot), the rules are read at the start of every session — you write the policy once instead of in 400 prompts. Petal's best test passes on production and on Kai's redesign."
        ru: "Лучший промпт — это TC-582 плюс три правила: лестница локаторов, «сужай, а не выбирай по позиции» и «бери имена с живой страницы». Каждое правило закрывает сбой, который ты сегодня {видела|видел}: CSS по памяти ломается при редизайне, позиции — при новой сортировке, выдуманные имена — в первый же день. Записанные в CLAUDE.md (или в `.github/copilot-instructions.md` для Copilot), правила читаются в начале каждой сессии — политику пишешь один раз, а не в 400 промптах. Лучший тест Petal проходит и на проде, и на редизайне Кая."
