id: c5-l1
chapter: c5
title: { en: "get_by_* locators: find it like a user", ru: "Локаторы get_by_*: ищем как пользователь" }
goal:
  en: "Pick the right built-in get_by_* locator for any element on the Bloomly login and shop pages."
  ru: "Подбирать подходящий встроенный локатор get_by_* для любого элемента на страницах входа и магазина Bloomly."
minutes: 10
keyPoints:
  - id: kp-locator-priority
    title:
      en: "The ladder: role → label → text → test id; CSS last"
      ru: "Лестница: роль → подпись → текст → test id; CSS — последним"
  - id: kp-role-label
    title:
      en: "get_by_role + name for controls, get_by_label for fields"
      ru: "get_by_role с именем — для элементов управления, get_by_label — для полей"
  - id: kp-testid-contract
    title:
      en: "get_by_test_id: a contract, stable but invisible to users"
      ru: "get_by_test_id: договорённость — стабильно, но не видно пользователю"
terms: [last-resort, reach-for, read-like, user-facing, contract, trade-off, breaking-change]

steps:
  - type: story
    lines:
      - who: leo
        text:
          en: "Kai's redesign lands next sprint. Before that, I want the login and shop tests on locators that won't even notice it."
          ru: "Редизайн Кая выходит в следующем спринте. До этого я хочу перевести тесты входа и магазина на локаторы, которые его даже не заметят."
      - who: petal
        text:
          en: "Easy! I'll copy the selectors straight from the HTML: `.btn`, `.toolbar input`, `label.check > input`…"
          ru: "Легко! Скопирую селекторы прямо из HTML: `.btn`, `.toolbar input`, `label.check > input`…"
      - who: maya
        text:
          en: "Those are exactly the names Kai is changing. Let's find each element the way a user does: the button that says “Log in”, the field labelled “Email”."
          ru: "Это ровно те имена, которые Кай меняет. Давай искать каждый элемент так, как это делает пользователь: кнопку с надписью «Log in», поле с подписью «Email»."

  - type: pretest
    intro:
      en: "Quick guess before we start. Wrong answers are fine — they help you remember."
      ru: "Быстрая догадка перед стартом. Ошибаться можно — так лучше запоминается."
    items:
      - id: c5-l1-p1
        kind: choice
        keyPoint: kp-locator-priority
        prompt:
          en: "A step from your test case: “Type ‘rose’ into the Search field.” Which locator reads most like this step?"
          ru: "Шаг из твоего тест-кейса: «Ввести ‘rose’ в поле Search». Какой локатор больше всего похож на этот шаг?"
        optionsCode: true
        options:
          - text: 'page.get_by_label("Search")'
            correct: true
            why:
              en: "It names the field the way the step does: by its label “Search”."
              ru: "Он называет поле так же, как шаг: по подписи «Search»."
          - text: 'page.locator("div.toolbar > input:first-of-type")'
            why:
              en: "It describes the layout: a class and a position. Nobody reading the step would look for the field this way."
              ru: "Он описывает вёрстку: класс и позицию. Никто, читая шаг, не стал бы искать поле так."
          - text: 'page.locator("//main/div[1]/input")'
            why:
              en: "An XPath route through the page structure. One new wrapper `<div>`, and it points to nothing."
              ru: "XPath-маршрут по структуре страницы. Добавят одну обёртку `<div>` — и он ни на что не указывает."
        hints:
          - en: "Read each option out loud. Which one sounds like your test step?"
            ru: "Прочитай каждый вариант вслух. Какой звучит как твой шаг?"
          - en: "The step names the field by its label."
            ru: "Шаг называет поле по его подписи."
        explain:
          en: 'A good locator reads like a test step: it names what the user sees. `get_by_label("Search")` keeps working when the layout changes, because the label stays.'
          ru: 'Хороший локатор читается как шаг теста: он называет то, что видит пользователь. `get_by_label("Search")` продолжает работать, когда меняется вёрстка, потому что подпись остаётся.'
      - id: c5-l1-p2
        kind: input
        keyPoint: kp-role-label
        prompt:
          en: "Picture the Bloomly login page: the top menu, the page title, the form. How many elements show the text “Log in”? Type a number."
          ru: "Представь страницу входа Bloomly: меню сверху, заголовок страницы, форма. Сколько элементов показывают текст «Log in»? Введи число."
        answers: ["3", "three"]
        placeholder: "1, 2, 3…"
        hints:
          - en: "Look at the menu, the title and the form separately."
            ru: "Посмотри отдельно на меню, заголовок и форму."
          - en: "Count the menu link, the heading and the submit button."
            ru: "Посчитай ссылку в меню, заголовок и кнопку отправки формы."
        explain:
          en: "Three: the “Log in” link in the menu, the heading “Log in” and the “Log in” button. So the text alone doesn't say which one you mean — the role does: `link`, `heading` or `button`."
          ru: "Три: ссылка «Log in» в меню, заголовок «Log in» и кнопка «Log in». Поэтому один текст не говорит, какой элемент ты имеешь в виду, — это говорит роль: `link`, `heading` или `button`."

  - type: theory
    keyPoint: kp-locator-priority
    title: { en: "Find it like a user", ru: "Ищи как пользователь" }
    body:
      - en: "In a test case you write “Click the **Log in** button”, not “click the third blue rectangle in the form”. Users find things by what they see: what kind of thing it is and what it says."
        ru: "В тест-кейсе ты пишешь «Нажать кнопку **Log in**», а не «нажать третий синий прямоугольник в форме». Пользователи находят элементы по тому, что видят: что это за элемент и что на нём написано."
      - en: "Playwright's built-in [[locators|locator]] work the same way. Try them in this order: `get_by_role` → `get_by_label` → `get_by_text` / `get_by_placeholder` → `get_by_test_id`. A [[CSS selector|css-selector]] or [[XPath|xpath]] is the last resort."
        ru: "Встроенные [[локаторы|locator]] Playwright работают так же. Пробуй их в таком порядке: `get_by_role` → `get_by_label` → `get_by_text` / `get_by_placeholder` → `get_by_test_id`. [[CSS-селектор|css-selector]] или [[XPath|xpath]] — крайний случай."
      - en: "The higher the rung, the closer it is to what the user sees — so the test breaks when the user's experience changes, not when Kai renames a class. That's a [[resilient locator|resilient-locator]]. The Playwright docs give the same advice, and its recorder (codegen) also prefers role, text and test id locators."
        ru: "Чем выше ступенька, тем ближе локатор к тому, что видит пользователь, — и тест ломается, когда меняется опыт пользователя, а не когда Кай переименовал класс. Это и есть [[устойчивый локатор|resilient-locator]]. Документация Playwright советует то же самое, и его рекордер (codegen) тоже предпочитает локаторы по роли, тексту и test id."
    figure: locator-priority
    mentor:
      en: "Petal reads the HTML like a developer, so it reaches for classes first. You read the page like a user. In this chapter, your way wins."
      ru: "Petal читает HTML как разработчик, поэтому первым делом хватается за классы. Ты читаешь страницу как пользователь. В этой главе побеждает твой подход."

  - type: theory
    keyPoint: kp-role-label
    title: { en: "get_by_role for controls, get_by_label for fields", ru: "get_by_role — для элементов управления, get_by_label — для полей" }
    body:
      - en: '`get_by_role("button", name="Log in")` finds an [[element|element]] by its [[role|role]] (the first argument) and [[accessible name|accessible-name]] (the keyword argument `name=`) — the pair you met in chapter 4. Use it for what users click, tick or read as a title: `button`, `link`, `checkbox`, `radio`, `heading`.'
        ru: '`get_by_role("button", name="Log in")` находит [[элемент|element]] по [[роли|role]] (первый аргумент) и [[доступному имени|accessible-name]] (именованный аргумент `name=`) — эту пару ты уже знаешь по главе 4. Используй его для того, на что пользователи нажимают, что отмечают галочкой или читают как заголовок: `button`, `link`, `checkbox`, `radio`, `heading`.'
      - en: 'For form fields use `get_by_label("Email")`: it finds the field that the label “Email” belongs to — just like your step “Enter the email in the Email field”. `get_by_text` is for plain text such as messages; `get_by_placeholder` only when a field has no label.'
        ru: 'Для полей формы используй `get_by_label("Email")`: он находит поле, к которому относится подпись «Email», — прямо как твой шаг «Ввести email в поле Email». `get_by_text` — для обычного текста, например сообщений; `get_by_placeholder` — только если у поля нет подписи.'
      - en: 'The name matches part of the text and ignores case: `name="Cart"` finds the link “Cart 0”. Add `exact=True` when only the whole name will do.'
        ru: 'Имя совпадает по части текста и без учёта регистра: `name="Cart"` находит ссылку «Cart 0». Добавь `exact=True`, когда подходит только полное имя.'
    code: |
      page.get_by_role("heading", name="Log in")
      page.get_by_role("button", name="Log in")
      page.get_by_role("link", name="Create an account")
      page.get_by_role("checkbox", name="Remember me")
      page.get_by_label("Email")
      page.get_by_text("Your cart is empty.")
    mentor:
      en: 'Why not just `get_by_text("Log in")`? On /login that text is on three elements. The role says which one you mean — the same way your test case says “the button”, not “the words”.'
      ru: 'Почему не просто `get_by_text("Log in")`? На /login этот текст есть у трёх элементов. Роль говорит, какой из них ты имеешь в виду, — так же, как тест-кейс говорит «кнопка», а не «слова».'

  - type: theory
    keyPoint: kp-testid-contract
    title: { en: "get_by_test_id: a contract with developers", ru: "get_by_test_id: договорённость с разработчиками" }
    body:
      - en: 'Some elements have no role name and no label: the products count “6 products”, the cart total, the number on the cart link. For them Kai adds a `data-testid`, and you use `get_by_test_id("results-count")`.'
        ru: 'У некоторых элементов нет ни имени по роли, ни подписи: счётчик «6 products», итог корзины, число на ссылке корзины. Для них Кай добавляет `data-testid`, а ты используешь `get_by_test_id("results-count")`.'
      - en: "A [[test ID|test-id]] is like a test case ID: TC-500 stays the same when someone rewords the title, but no customer ever sees it. It's a contract: Kai keeps the id, you rely on it. It survives redesigns and even text changes."
        ru: "[[Тестовый идентификатор|test-id]] похож на ID тест-кейса: TC-500 не меняется, когда кто-то переписывает название, но ни один клиент его никогда не видит. Это договорённость: Кай сохраняет id, ты на него опираешься. Он переживает и редизайн, и даже смену текста."
      - en: "The price: it's invisible. If “Add to cart” stops being a real button, a `get_by_test_id` test stays green, while a `get_by_role` test catches it. So: test ids for what has no user-facing name — role and label for everything else."
        ru: "Цена — невидимость. Если «Add to cart» перестанет быть настоящей кнопкой, тест с `get_by_test_id` останется зелёным, а тест с `get_by_role` это поймает. Поэтому test id — для того, у чего нет видимого пользователю имени, а роль и подпись — для всего остального."
    mentor:
      en: 'Agents love test ids: easy to copy, rarely ambiguous. Worse, they invent them — `get_by_test_id("search-input")` looks perfect, and Bloomly has no such id. Every test id in a test must exist on the page.'
      ru: 'Агенты обожают test id: их легко скопировать, и они редко бывают неоднозначными. Хуже того, агенты их выдумывают: `get_by_test_id("search-input")` выглядит идеально, но в Bloomly такого id нет. Каждый test id в тесте должен существовать на странице.'

  - type: example
    keyPoint: kp-locator-priority
    title: { en: "One test, every rung explained", ru: "Один тест — и каждая ступенька с объяснением" }
    intro:
      en: "TC-500: Anna logs in with “Remember me” ticked. Every locator is picked from the ladder — the notes say why. Press Run to see it green."
      ru: "TC-500: Anna входит с отмеченным «Remember me». Каждый локатор выбран по лестнице — в заметках объяснено почему. Нажми Run, чтобы увидеть зелёный прогон."
    code: |
      from playwright.sync_api import Page, expect


      def test_user_can_log_in_with_remember_me(page: Page):
          page.goto("/login")
          expect(page.get_by_role("heading", name="Log in")).to_be_visible()
          page.get_by_label("Email").fill("anna@bloomly.app")
          page.get_by_label("Password").fill("bloom123")
          page.get_by_role("checkbox", name="Remember me").check()
          page.get_by_role("button", name="Log in").click()
          expect(page.get_by_role("heading", name="Welcome back, Anna!")).to_be_visible()
          expect(page.get_by_test_id("account-email")).to_have_text("anna@bloomly.app")
    notes:
      - lines: 6
        text:
          en: "Rung 1: role + name. Three elements say “Log in”; `heading` picks the page title."
          ru: "Ступенька 1: роль + имя. «Log in» написано на трёх элементах; `heading` выбирает заголовок страницы."
      - lines: [7, 8]
        text:
          en: "Rung 2: fields by their label, like the step “Enter the email in the Email field”. The placeholder “you@example.com” would work too — but it's only a hint that disappears as you type, one rung lower."
          ru: "Ступенька 2: поля по подписи, как в шаге «Ввести email в поле Email». Плейсхолдер «you@example.com» тоже сработал бы — но это лишь подсказка, которая исчезает при вводе, на ступеньку ниже."
      - lines: 9
        text:
          en: "Rung 1: a checkbox by its role and the text of its label."
          ru: "Ступенька 1: чекбокс по роли и тексту его подписи."
      - lines: 10
        text:
          en: "Same name as line 6, different role. The menu link “Log in” is a `link`, so `button` matches only the form button."
          ru: "То же имя, что в строке 6, но другая роль. Ссылка «Log in» в меню — это `link`, поэтому `button` находит только кнопку формы."
      - lines: 11
        text:
          en: "Rung 1 again: the greeting is a heading, and its name is the exact text from the test case."
          ru: "Снова ступенька 1: приветствие — заголовок, а его имя — точный текст из тест-кейса."
      - lines: 12
        text:
          en: "Rung 4: the email on the account page is a plain value — no role name, no label. Kai's test id is the honest choice. `get_by_text(\"anna@bloomly.app\")` would find it only if the value were already right."
          ru: 'Ступенька 4: email на странице аккаунта — просто значение, без имени по роли и без подписи. Test id от Кая — честный выбор. `get_by_text("anna@bloomly.app")` нашёл бы его, только если значение уже правильное.'
    runnable: true

  - type: task
    task:
      id: c5-l1-t1
      kind: pick-locator
      keyPoint: kp-locator-priority
      app: { route: /login }
      target: "[data-testid='login-button']"
      prompt:
        en: "TC-500, step 4: “Click the **Log in** button.” Pick the locator for the highlighted button."
        ru: "TC-500, шаг 4: «Нажать кнопку **Log in**». Выбери локатор для подсвеченной кнопки."
      options:
        - text: 'page.get_by_role("button", name="Log in")'
          correct: true
          why:
            en: "Rung 1: what the user sees — a button that says “Log in”. Exactly one element matches."
            ru: "Ступенька 1: то, что видит пользователь, — кнопка с надписью «Log in». Подходит ровно один элемент."
        - text: 'page.get_by_test_id("login-button")'
          why:
            en: "Stable and unique — but rung 4. Users never see test ids, and this button has a perfectly good role and name. Keep test ids for elements that have neither."
            ru: "Стабильный и уникальный — но это ступенька 4. Пользователи не видят test id, а у этой кнопки есть отличные роль и имя. Test id оставь для элементов, у которых нет ни того, ни другого."
        - text: 'page.get_by_text("Log in")'
          why:
            en: "Three elements show this text: the menu link, the heading and the button. Which one? The text alone can't say."
            ru: "Этот текст есть у трёх элементов: ссылки в меню, заголовка и кнопки. Какой из них? Сам текст этого не скажет."
        - text: 'page.locator("#login-form > button.btn")'
          why:
            en: "CSS tied to the class `btn` and the form structure — the first thing Kai's redesign changes. Last rung."
            ru: "CSS, привязанный к классу `btn` и структуре формы, — первое, что изменит редизайн Кая. Последняя ступенька."
      hints:
        - en: "Climb the ladder from the top: does the button have a role and a name?"
          ru: "Иди по лестнице сверху: есть ли у кнопки роль и имя?"
        - en: "Three of the four would click this button today. Which of them describes what the user sees?"
          ru: "Сегодня эту кнопку нажали бы три варианта из четырёх. Какой из них описывает то, что видит пользователь?"
        - en: 'A button that says “Log in”: `get_by_role("button", …)`.'
          ru: 'Кнопка с надписью «Log in»: `get_by_role("button", …)`.'
      praise:
        en: "Top rung, one match, reads like the test step. That's the locator a senior reviewer approves without a comment."
        ru: "Верхняя ступенька, одно совпадение, читается как шаг теста. Такой локатор сеньор на ревью одобрит без единого комментария."
      explain:
        en: "Start at the top of the ladder and stop at the first rung that finds exactly one element. Here rung 1 already works: role `button`, name “Log in”."
        ru: "Начинай с верха лестницы и останавливайся на первой ступеньке, которая находит ровно один элемент. Здесь срабатывает уже ступенька 1: роль `button`, имя «Log in»."

  - type: task
    task:
      id: c5-l1-t2
      kind: match
      keyPoint: kp-role-label
      prompt:
        en: "Match each element of the login page with its locator. Careful: two of them have the same name."
        ru: "Сопоставь каждый элемент страницы входа с его локатором. Осторожно: у двух из них одинаковое имя."
      pairs:
        - left: { en: "The page title “Log in”", ru: "Заголовок страницы «Log in»" }
          right: 'page.get_by_role("heading", name="Log in")'
        - left: { en: "The “Log in” button in the form", ru: "Кнопка «Log in» в форме" }
          right: 'page.get_by_role("button", name="Log in")'
        - left: { en: "The “Create an account” link", ru: "Ссылка «Create an account»" }
          right: 'page.get_by_role("link", name="Create an account")'
        - left: { en: "The “Remember me” checkbox", ru: "Чекбокс «Remember me»" }
          right: 'page.get_by_role("checkbox", name="Remember me")'
        - left: { en: "The Password field", ru: "Поле Password" }
          right: 'page.get_by_label("Password")'
      rightCode: true
      hints:
        - en: "The first argument of `get_by_role` says what kind of element it is."
          ru: "Первый аргумент `get_by_role` говорит, что это за элемент."
        - en: "A title is a `heading`; the thing that submits the form is a `button`."
          ru: "Заголовок — это `heading`; то, чем отправляют форму, — `button`."
        - en: "A field with a label → `get_by_label`."
          ru: "Поле с подписью → `get_by_label`."
      praise:
        en: "Same name, different roles — you kept the heading and the button apart."
        ru: "Имя одно, роли разные — и ты не {перепутала|перепутал} заголовок с кнопкой."
      explain:
        en: "The role answers “what is it?”, the name answers “which one?”. Together they describe the element the way a user would. For a field, the label does both jobs."
        ru: "Роль отвечает на вопрос «что это?», имя — на вопрос «какой именно?». Вместе они описывают элемент так, как это сделал бы пользователь. У поля обе задачи решает подпись."

  - type: task
    task:
      id: c5-l1-t3
      kind: inspect
      keyPoint: kp-role-label
      app: { route: /shop }
      prompt:
        en: 'Your step: “Sort the shop by Price: low to high.” The test will use `page.get_by_label("Sort by")`. Click the element this locator returns.'
        ru: 'Твой шаг: «Отсортировать магазин по Price: low to high». Тест будет использовать `page.get_by_label("Sort by")`. Нажми на элемент, который вернёт этот локатор.'
      target: "#sort"
      view: both
      show: [role, name]
      hints:
        - en: "There are two candidates: the words “Sort by” and the dropdown next to them."
          ru: "Кандидатов два: слова «Sort by» и выпадающий список рядом с ними."
        - en: "`get_by_label` returns the thing you can type into or choose from, not its caption."
          ru: "`get_by_label` возвращает то, во что можно вводить или из чего можно выбирать, а не надпись к нему."
        - en: 'The dropdown: `<select id="sort">`, role `combobox`, name “Sort by”.'
          ru: 'Выпадающий список: `<select id="sort">`, роль `combobox`, имя «Sort by».'
      praise:
        en: "You picked the field, not its caption — that's exactly what get_by_label does."
        ru: "Ты {выбрала|выбрал} поле, а не надпись к нему, — именно так и работает get_by_label."
      explain:
        en: "`<label for=\"sort\">` gives the dropdown its accessible name “Sort by”. `get_by_label` follows that link and returns the dropdown itself, so `select_option(\"price-asc\")` works on it. The caption is just text — there's nothing to choose in it."
        ru: '`<label for="sort">` даёт выпадающему списку доступное имя «Sort by». `get_by_label` идёт по этой связи и возвращает сам список, поэтому `select_option("price-asc")` на нём работает. Надпись — просто текст, в ней ничего не выберешь.'

