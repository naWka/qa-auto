  - type: mistakes
    keyPoint: kp-locator-priority
    title: { en: "Locator mistakes to catch in review", ru: "Ошибки в локаторах, которые ловят на ревью" }
    items:
      - wrong: "page.locator('.btn.btn-primary')"
        right: "page.getByRole('button', { name: 'Log in' })"
        why:
          en: "Classes are for styling, and Kai renames them next sprint. The user sees a button called “Log in”."
          ru: "Классы нужны для стилей, и Кай переименует их в следующем спринте. Пользователь видит кнопку «Log in»."
      - wrong: "page.getByButton('Log in')"
        right: "page.getByRole('button', { name: 'Log in' })"
        why:
          en: "There is no `getByButton` in Playwright — a typical agent invention. The role is the first argument of `getByRole`."
          ru: "В Playwright нет `getByButton` — типичная выдумка агента. Роль — это первый аргумент `getByRole`."
      - wrong: "page.getByPlaceholder('you@example.com')"
        right: "page.getByLabel('Email')"
        why:
          en: "The field has a label. A placeholder is a hint that disappears as you type and changes freely — use it only when there's no label."
          ru: "У поля есть подпись. Плейсхолдер — подсказка, которая исчезает при вводе и легко меняется; используй его, только если подписи нет."
      - wrong: "page.getByTestId('login-button')"
        right: "page.getByRole('button', { name: 'Log in' })"
        why:
          en: "It works, but it skips three rungs. Test ids are for elements with no role name or label; this button has both."
          ru: "Работает, но перепрыгивает через три ступеньки. Test id — для элементов без имени по роли и без подписи, а у этой кнопки есть и то, и другое."

  - type: explain
    keyPoint: kp-locator-priority
    prompt:
      en: "In your own words: in what order do you choose a locator, and when is `getByTestId` the right choice?"
      ru: "Своими словами: в каком порядке ты выбираешь локатор и когда `getByTestId` — правильный выбор?"
    model:
      en: "I start from what the user sees: getByRole with a name for buttons, links, headings and checkboxes; getByLabel for form fields; then getByText or getByPlaceholder. I use getByTestId when an element has no role name and no label, like a count or a total. A test id is a contract with developers: stable, but invisible to users, so it won't notice when an element stops being accessible. CSS and XPath only as a last resort, because they describe the layout — and the layout changes with every redesign."
      ru: "Я начинаю с того, что видит пользователь: getByRole с именем — для кнопок, ссылок, заголовков и чекбоксов; getByLabel — для полей формы; потом getByText или getByPlaceholder. getByTestId я использую, когда у элемента нет ни имени по роли, ни подписи, например у счётчика или итоговой суммы. Test id — это договорённость с разработчиками: стабильно, но невидимо для пользователей, поэтому такой локатор не заметит, если элемент станет недоступным. CSS и XPath — только в крайнем случае, потому что они описывают вёрстку, а вёрстка меняется с каждым редизайном."

