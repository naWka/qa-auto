    optionsCode: true
    options:
      - text: "page.getByRole('button', { name: 'Proceed to checkout' })"
        correct: true
        why:
          en: "Rung 1: a button with a visible name. Nothing beats what the user sees."
          ru: "Ступенька 1: кнопка с видимым именем. Ничто не надёжнее того, что видит пользователь."
      - text: "page.getByTestId('checkout-button')"
        why:
          en: "It exists and it's stable — but it's rung 4. Use it when there's no role name; this button has one."
          ru: "Он существует и стабилен — но это ступенька 4. Его берут, когда нет имени по роли, а у этой кнопки оно есть."
      - text: "page.getByText('Proceed')"
        why:
          en: "Rung 3, and only half the name. It doesn't say it's a button, and “Proceed” may appear somewhere else tomorrow."
          ru: "Ступенька 3, да ещё и половина имени. Он не говорит, что это кнопка, а «Proceed» завтра может появиться где-то ещё."
      - text: "page.locator('.row-actions .btn:last-child')"
        why:
          en: "Classes and a position — exactly what the design system changes."
          ru: "Классы и позиция — ровно то, что меняет дизайн-система."
    hints:
      - en: "Start at the top of the ladder."
        ru: "Начни с верха лестницы."
      - en: "Does the button have a role and a visible name?"
        ru: "Есть ли у кнопки роль и видимое имя?"
    explain:
      en: "Always try the top rung first. You go down only when the element has no role name or label — not because a lower rung is easier to copy."
      ru: "Всегда начинай с верхней ступеньки. Спускаешься ниже, только когда у элемента нет имени по роли или подписи, — а не потому, что нижнюю ступеньку проще скопировать."

  - id: c5-l1-k3
    kind: review
    keyPoint: kp-locator-priority
    context:
      en: "Petal wrote TC-505 without opening the signup page."
      ru: "Petal написал TC-505, не открывая страницу регистрации."
    prompt:
      en: "Review the locators. Flag each problem line and pick the issue type."
      ru: "Проверь локаторы. Отметь каждую проблемную строку и выбери тип проблемы."
    testCase:
      id: TC-505
      title: New user can create an account
      steps:
        - { action: "Open /signup" }
        - { action: "Fill in Full name, Email and Password", data: "Nina Kowalska / nina@bloomly.app / petals2026" }
        - { action: "Choose the country", data: "Poland" }
        - { action: "Accept the Terms of Service" }
        - { action: "Click \"Create account\"", expected: "\"Account created!\" is shown" }
    code: |
      import { test, expect } from '@playwright/test';

      test('new user can create an account', async ({ page }) => {
        await page.goto('/signup');
        await page.getByLabel('Full name').fill('Nina Kowalska');
        await page.getByTestId('signup-email').fill('nina@bloomly.app');
        await page.getByLabel('Password').fill('petals2026');
        await page.getByLabel('Country').selectOption('Poland');
        await page.locator('xpath=//form/label[last()]/input').check();
        await page.getByRole('submit', { name: 'Create account' }).click();
        await expect(page.getByRole('heading', { name: 'Account created!' })).toBeVisible();
      });
    issues:
      - line: 6
        type: hallucination
        note:
          en: "The signup Email field has no test id — Petal invented one. It has a label: `getByLabel('Email')`."
          ru: "У поля Email на странице регистрации нет test id — Petal его выдумал. Зато есть подпись: `getByLabel('Email')`."
      - line: 9
        type: fragile-locator
        note:
          en: "“The last label in the form” is a position. Add one more checkbox at the end, and the test ticks the wrong box. Use `getByRole('checkbox', { name: 'I agree to the Terms of Service' })`."
          ru: "«Последняя подпись в форме» — это позиция. Добавят ещё один чекбокс в конец — и тест отметит не тот. Используй `getByRole('checkbox', { name: 'I agree to the Terms of Service' })`."
      - line: 10
        type: hallucination
        note:
          en: "`submit` is the button's `type`, not a role. The role is `button`: `getByRole('button', { name: 'Create account' })`."
          ru: "`submit` — это `type` кнопки, а не роль. Роль — `button`: `getByRole('button', { name: 'Create account' })`."
    types: [hallucination, fragile-locator, wrong-data, weak-assertion, hard-wait]
    hints:
      - en: "Check every test id and every role against the real signup page."
        ru: "Сверь каждый test id и каждую роль с настоящей страницей регистрации."
      - en: "One invented test id, one invented role, one locator that depends on position."
        ru: "Один выдуманный test id, одна выдуманная роль, один локатор, зависящий от позиции."
      - en: "Lines 6, 9 and 10."
        ru: "Строки 6, 9 и 10."
    explain:
      en: "Petal mixed three habits: a test id that “should” exist, counting positions in the form, and confusing the button's `type=\"submit\"` with its role. The ladder fixes all three: `getByLabel('Email')`, `getByRole('checkbox', { name: 'I agree to the Terms of Service' })`, `getByRole('button', { name: 'Create account' })`."
      ru: "Petal смешал три привычки: test id, который «должен» быть, отсчёт позиций в форме и путаницу между `type=\"submit\"` кнопки и её ролью. Лестница исправляет все три: `getByLabel('Email')`, `getByRole('checkbox', { name: 'I agree to the Terms of Service' })`, `getByRole('button', { name: 'Create account' })`."

  - id: c5-l1-k4
    kind: predict
    keyPoint: kp-testid-contract
    placement: true
    app: { variant: sign-in }
    context:
      en: "Sofia's copy change has shipped: the login button now says “Sign in”. Kai kept its `data-testid=\"login-button\"`."
      ru: "Правка текста от Софии уже в продакшене: кнопка входа теперь называется «Sign in». Кай сохранил у неё `data-testid=\"login-button\"`."
    prompt:
      en: "Will this test pass or fail after the change?"
      ru: "Этот тест пройдёт или упадёт после изменения?"
    code: |
      import { test, expect } from '@playwright/test';

      test('registered user can log in', async ({ page }) => {
        await page.goto('/login');
        await page.getByLabel('Email').fill('anna@bloomly.app');
        await page.getByLabel('Password').fill('bloom123');
        await page.getByTestId('login-button').click();
        await expect(page).toHaveURL('/account');
      });
    outcome: pass
    reasons:
      - text:
          en: "Pass: the test id didn't change, and nothing in the test looks at the button's text."
          ru: "Пройдёт: test id не изменился, а на текст кнопки в тесте ничто не смотрит."
        correct: true
      - text:
          en: "Fail: the button text changed, so the locator breaks."
          ru: "Упадёт: текст кнопки изменился, значит, локатор сломается."
        why:
          en: "That would happen with `getByRole('button', { name: 'Log in' })`. A test id doesn't care about the text."
          ru: "Так было бы с `getByRole('button', { name: 'Log in' })`. Локатору по test id всё равно, какой текст на кнопке."
      - text:
          en: "Fail: after the change, login no longer opens /account."
          ru: "Упадёт: после изменения вход больше не открывает /account."
        why:
          en: "Only the button text changed — logging in works exactly as before."
          ru: "Изменился только текст кнопки — вход работает точно так же."
    hints:
      - en: "What changed: the text, the test id, or both?"
        ru: "Что изменилось: текст, test id или и то и другое?"
      - en: "Does any line of the test read the button's text?"
        ru: "Читает ли хоть одна строка теста текст кнопки?"
    explain:
      en: "Kai kept the contract, so the test is stable through a text change. But notice what it can't see: if your test case says the button reads “Log in”, nothing here tells you it changed. `getByRole('button', { name: 'Log in' })` would fail and send you back to the test case. Stable or user-facing — choose on purpose."
      ru: "Кай сохранил договорённость, поэтому тест пережил смену текста. Но обрати внимание, чего он не видит: если в тест-кейсе кнопка называется «Log in», здесь ничто не скажет, что она изменилась. `getByRole('button', { name: 'Log in' })` упал бы и вернул тебя к тест-кейсу. Стабильность или взгляд пользователя — выбирай осознанно."

