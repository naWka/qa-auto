      - text: "page.locator('#sort')"
        why:
          en: "It works and even survives the redesign — ids don't change there. But users never see ids, and nothing promises it stays: it's CSS, the last rung. The label is right there."
          ru: "Работает и даже переживёт редизайн — id там не меняются. Но пользователи не видят id, и никто не обещает, что он останется: это CSS, последняя ступенька. А подпись — вот она."
      - text: "page.locator('.toolbar select:last-child')"
        why:
          en: "A class and a position. Add a filter to the toolbar or rename the class, and it points elsewhere."
          ru: "Класс и позиция. Добавят фильтр в панель или переименуют класс — и он укажет на другое."
    hints:
      - en: "Does the dropdown have a label?"
        ru: "Есть ли у выпадающего списка подпись?"
      - en: "A role without a name may match more than one element."
        ru: "Роль без имени может найти больше одного элемента."
      - en: "Fields → `getByLabel`."
        ru: "Поля → `getByLabel`."
    explain:
      en: "Fields → `getByLabel`: it reads like the step and finds exactly one element. `getByRole('combobox', { name: 'Sort by' })` would be fine too — the name is what makes a role locator precise."
      ru: "Поля → `getByLabel`: читается как шаг и находит ровно один элемент. `getByRole('combobox', { name: 'Sort by' })` тоже подошёл бы — точным локатор по роли делает именно имя."

  - id: c5-l1-k2
