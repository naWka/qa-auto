id: c5-l1
chapter: c5
title: { en: "getBy* locators: find it like a user", ru: "Локаторы getBy*: ищем как пользователь" }
goal:
  en: "Pick the right built-in locator for any element on the Bloomly login and shop pages."
  ru: "Подбирать подходящий встроенный локатор для любого элемента на страницах входа и магазина Bloomly."
minutes: 10
keyPoints:
  - id: kp-locator-priority
    title:
      en: "The ladder: role → label → text → test id; CSS last"
      ru: "Лестница: роль → подпись → текст → test id; CSS — последним"
  - id: kp-role-label
    title:
      en: "getByRole + name for controls, getByLabel for fields"
      ru: "getByRole с именем — для элементов управления, getByLabel — для полей"
  - id: kp-testid-contract
    title:
      en: "getByTestId: a contract, stable but invisible to users"
      ru: "getByTestId: договорённость — стабильно, но не видно пользователю"
terms: [locator, role, accessible-name, element, test-id, css-selector, xpath, resilient-locator]

steps:
  - type: story
    lines:
      - who: leo
        text:
          en: "Kai's redesign lands next sprint. Before that, I want the login and shop tests on locators that won't even notice it."
          ru: "Редизайн Кая выходит в следующем спринте. До этого я хочу перевести тесты входа и магазина на локаторы, которые его даже не заметят."
      - who: petal
        text:
          en: "Easy! I'll copy the selectors straight from the HTML: `.btn`, `.toolbar input`, `label.check > input`…"
          ru: "Легко! Скопирую селекторы прямо из HTML: `.btn`, `.toolbar input`, `label.check > input`…"
      - who: maya
        text:
          en: "Those are exactly the names Kai is changing. Let's find each element the way a user does: the button that says “Log in”, the field labelled “Email”."
          ru: "Это ровно те имена, которые Кай меняет. Давай искать каждый элемент так, как это делает пользователь: кнопку с надписью «Log in», поле с подписью «Email»."

  - type: pretest
    intro:
      en: "Quick guess before we start. Wrong answers are fine — they help you remember."
      ru: "Быстрая догадка перед стартом. Ошибаться можно — так лучше запоминается."
    items:
      - id: c5-l1-p1
        kind: choice
        keyPoint: kp-locator-priority
        prompt:
          en: "A step from your test case: “Type ‘rose’ into the Search field.” Which locator reads most like this step?"
          ru: "Шаг из твоего тест-кейса: «Ввести ‘rose’ в поле Search». Какой локатор больше всего похож на этот шаг?"
        optionsCode: true
        options:
          - text: "page.getByLabel('Search')"
            correct: true
            why:
              en: "It names the field the way the step does: by its label “Search”."
              ru: "Он называет поле так же, как шаг: по подписи «Search»."
          - text: "page.locator('div.toolbar > input:first-of-type')"
            why:
              en: "It describes the layout: a class and a position. Nobody reading the step would look for the field this way."
              ru: "Он описывает вёрстку: класс и позицию. Никто, читая шаг, не стал бы искать поле так."
          - text: "page.locator('//main/div[1]/input')"
            why:
              en: "An XPath route through the page structure. One new wrapper `<div>`, and it points to nothing."
              ru: "XPath-маршрут по структуре страницы. Добавят одну обёртку `<div>` — и он ни на что не указывает."
        hints:
          - en: "Read each option out loud. Which one sounds like your test step?"
            ru: "Прочитай каждый вариант вслух. Какой звучит как твой шаг?"
          - en: "The step names the field by its label."
            ru: "Шаг называет поле по его подписи."
        explain:
          en: "A good locator reads like a test step: it names what the user sees. `getByLabel('Search')` keeps working when the layout changes, because the label stays."
          ru: "Хороший локатор читается как шаг теста: он называет то, что видит пользователь. `getByLabel('Search')` продолжает работать, когда меняется вёрстка, потому что подпись остаётся."
      - id: c5-l1-p2
        kind: input
        keyPoint: kp-role-label
        prompt:
          en: "Picture the Bloomly login page: the top menu, the page title, the form. How many elements show the text “Log in”? Type a number."
          ru: "Представь страницу входа Bloomly: меню сверху, заголовок страницы, форма. Сколько элементов показывают текст «Log in»? Введи число."
        answers: ["3", "three"]
        placeholder: "1, 2, 3…"
        hints:
          - en: "Look at the menu, the title and the form separately."
            ru: "Посмотри отдельно на меню, заголовок и форму."
          - en: "Count the menu link, the heading and the submit button."
            ru: "Посчитай ссылку в меню, заголовок и кнопку отправки формы."
        explain:
          en: "Three: the “Log in” link in the menu, the heading “Log in” and the “Log in” button. So the text alone doesn't say which one you mean — the role does: `link`, `heading` or `button`."
          ru: "Три: ссылка «Log in» в меню, заголовок «Log in» и кнопка «Log in». Поэтому один текст не говорит, какой элемент ты имеешь в виду, — это говорит роль: `link`, `heading` или `button`."

  - type: theory
    keyPoint: kp-locator-priority
    title: { en: "Find it like a user", ru: "Ищи как пользователь" }
    body:
      - en: "In a test case you write “Click the **Log in** button”, not “click the third blue rectangle in the form”. Users find things by what they see: what kind of thing it is and what it says."
        ru: "В тест-кейсе ты пишешь «Нажать кнопку **Log in**», а не «нажать третий синий прямоугольник в форме». Пользователи находят элементы по тому, что видят: что это за элемент и что на нём написано."
      - en: "Playwright's built-in [[locators|locator]] work the same way. Try them in this order: `getByRole` → `getByLabel` → `getByText` / `getByPlaceholder` → `getByTestId`. A [[CSS selector|css-selector]] or [[XPath|xpath]] is the last resort."
        ru: "Встроенные [[локаторы|locator]] Playwright работают так же. Пробуй их в таком порядке: `getByRole` → `getByLabel` → `getByText` / `getByPlaceholder` → `getByTestId`. [[CSS-селектор|css-selector]] или [[XPath|xpath]] — крайний случай."
      - en: "The higher the rung, the closer it is to what the user sees — so the test breaks when the user's experience changes, not when Kai renames a class. That's a [[resilient locator|resilient-locator]]. The Playwright docs give the same advice, and its recorder (codegen) also prefers role, text and test id locators."
        ru: "Чем выше ступенька, тем ближе локатор к тому, что видит пользователь, — и тест ломается, когда меняется опыт пользователя, а не когда Кай переименовал класс. Это и есть [[устойчивый локатор|resilient-locator]]. Документация Playwright советует то же самое, и его рекордер (codegen) тоже предпочитает локаторы по роли, тексту и test id."
    figure: locator-priority
    mentor:
      en: "Petal reads the HTML like a developer, so it reaches for classes first. You read the page like a user. In this chapter, your way wins."
      ru: "Petal читает HTML как разработчик, поэтому первым делом хватается за классы. Ты читаешь страницу как пользователь. В этой главе побеждает твой подход."

  - type: theory
    keyPoint: kp-role-label
    title: { en: "getByRole for controls, getByLabel for fields", ru: "getByRole — для элементов управления, getByLabel — для полей" }
    body:
      - en: "`getByRole(role, { name })` finds an [[element|element]] by its [[role|role]] and [[accessible name|accessible-name]] — the pair you met in chapter 4. Use it for what users click, tick or read as a title: `button`, `link`, `checkbox`, `radio`, `heading`."
        ru: "`getByRole(role, { name })` находит [[элемент|element]] по его [[роли|role]] и [[доступному имени|accessible-name]] — эту пару ты уже знаешь по главе 4. Используй его для того, на что пользователи нажимают, что отмечают галочкой или читают как заголовок: `button`, `link`, `checkbox`, `radio`, `heading`."
      - en: "For form fields use `getByLabel('Email')`: it finds the field that the label “Email” belongs to — just like your step “Enter the email in the Email field”. `getByText` is for plain text such as messages; `getByPlaceholder` only when a field has no label."
        ru: "Для полей формы используй `getByLabel('Email')`: он находит поле, к которому относится подпись «Email», — прямо как твой шаг «Ввести email в поле Email». `getByText` — для обычного текста, например сообщений; `getByPlaceholder` — только если у поля нет подписи."
      - en: "The name matches part of the text and ignores case: `{ name: 'Cart' }` finds the link “Cart 0”. Add `exact: true` when only the whole name will do."
        ru: "Имя совпадает по части текста и без учёта регистра: `{ name: 'Cart' }` находит ссылку «Cart 0». Добавь `exact: true`, когда подходит только полное имя."
    code: |
      page.getByRole('heading', { name: 'Log in' })
      page.getByRole('button', { name: 'Log in' })
      page.getByRole('link', { name: 'Create an account' })
      page.getByRole('checkbox', { name: 'Remember me' })
      page.getByLabel('Email')
      page.getByText('Your cart is empty.')
    mentor:
      en: "Why not just `getByText('Log in')`? On /login that text is on three elements. The role says which one you mean — the same way your test case says “the button”, not “the words”."
      ru: "Почему не просто `getByText('Log in')`? На /login этот текст есть у трёх элементов. Роль говорит, какой из них ты имеешь в виду, — так же, как тест-кейс говорит «кнопка», а не «слова»."

  - type: theory
    keyPoint: kp-testid-contract
    title: { en: "getByTestId: a contract with developers", ru: "getByTestId: договорённость с разработчиками" }
    body:
      - en: "Some elements have no role name and no label: the products count “6 products”, the cart total, the number on the cart link. For them Kai adds a `data-testid`, and you use `getByTestId('results-count')`."
        ru: "У некоторых элементов нет ни имени по роли, ни подписи: счётчик «6 products», итог корзины, число на ссылке корзины. Для них Кай добавляет `data-testid`, а ты используешь `getByTestId('results-count')`."
      - en: "A [[test ID|test-id]] is like a test case ID: TC-500 stays the same when someone rewords the title, but no customer ever sees it. It's a contract: Kai keeps the id, you rely on it. It survives redesigns and even text changes."
        ru: "[[Тестовый идентификатор|test-id]] похож на ID тест-кейса: TC-500 не меняется, когда кто-то переписывает название, но ни один клиент его никогда не видит. Это договорённость: Кай сохраняет id, ты на него опираешься. Он переживает и редизайн, и даже смену текста."
      - en: "The price: it's invisible. If “Add to cart” stops being a real button, a `getByTestId` test stays green, while a `getByRole` test catches it. So: test ids for what has no user-facing name — role and label for everything else."
        ru: "Цена — невидимость. Если «Add to cart» перестанет быть настоящей кнопкой, тест с `getByTestId` останется зелёным, а тест с `getByRole` это поймает. Поэтому test id — для того, у чего нет видимого пользователю имени, а роль и подпись — для всего остального."
    mentor:
      en: "Agents love test ids: easy to copy, rarely ambiguous. Worse, they invent them — `getByTestId('search-input')` looks perfect, and Bloomly has no such id. Every test id in a test must exist on the page."
      ru: "Агенты обожают test id: их легко скопировать, и они редко бывают неоднозначными. Хуже того, агенты их выдумывают: `getByTestId('search-input')` выглядит идеально, но в Bloomly такого id нет. Каждый test id в тесте должен существовать на странице."

  - type: example
    keyPoint: kp-locator-priority
    title: { en: "One test, every rung explained", ru: "Один тест — и каждая ступенька с объяснением" }
    intro:
      en: "TC-500: Anna logs in with “Remember me” ticked. Every locator is picked from the ladder — the notes say why. Press Run to see it green."
      ru: "TC-500: Anna входит с отмеченным «Remember me». Каждый локатор выбран по лестнице — в заметках объяснено почему. Нажми Run, чтобы увидеть зелёный прогон."
    code: |
      import { test, expect } from '@playwright/test';

      test('user can log in with Remember me', async ({ page }) => {
        await page.goto('/login');
        await expect(page.getByRole('heading', { name: 'Log in' })).toBeVisible();
        await page.getByLabel('Email').fill('anna@bloomly.app');
        await page.getByLabel('Password').fill('bloom123');
        await page.getByRole('checkbox', { name: 'Remember me' }).check();
        await page.getByRole('button', { name: 'Log in' }).click();
        await expect(page.getByRole('heading', { name: 'Welcome back, Anna!' })).toBeVisible();
        await expect(page.getByTestId('account-email')).toHaveText('anna@bloomly.app');
      });
    notes:
      - lines: 5
        text:
          en: "Rung 1: role + name. Three elements say “Log in”; `heading` picks the page title."
          ru: "Ступенька 1: роль + имя. «Log in» написано на трёх элементах; `heading` выбирает заголовок страницы."
      - lines: [6, 7]
        text:
          en: "Rung 2: fields by their label, like the step “Enter the email in the Email field”. The placeholder “you@example.com” would work too — but it's only a hint that disappears as you type, one rung lower."
          ru: "Ступенька 2: поля по подписи, как в шаге «Ввести email в поле Email». Плейсхолдер «you@example.com» тоже сработал бы — но это лишь подсказка, которая исчезает при вводе, на ступеньку ниже."
      - lines: 8
        text:
          en: "Rung 1: a checkbox by its role and the text of its label."
          ru: "Ступенька 1: чекбокс по роли и тексту его подписи."
      - lines: 9
        text:
          en: "Same name as line 5, different role. The menu link “Log in” is a `link`, so `button` matches only the form button."
          ru: "То же имя, что в строке 5, но другая роль. Ссылка «Log in» в меню — это `link`, поэтому `button` находит только кнопку формы."
      - lines: 10
        text:
          en: "Rung 1 again: the greeting is a heading, and its name is the exact text from the test case."
          ru: "Снова ступенька 1: приветствие — заголовок, а его имя — точный текст из тест-кейса."
      - lines: 11
        text:
          en: "Rung 4: the email on the account page is a plain value — no role name, no label. Kai's test id is the honest choice. `getByText('anna@bloomly.app')` would find it only if the value were already right."
          ru: "Ступенька 4: email на странице аккаунта — просто значение, без имени по роли и без подписи. Test id от Кая — честный выбор. `getByText('anna@bloomly.app')` нашёл бы его, только если значение уже правильное."
    runnable: true

  - type: task
    task:
      id: c5-l1-t1
      kind: pick-locator
      keyPoint: kp-locator-priority
      app: { route: /login }
      target: "[data-testid='login-button']"
      prompt:
        en: "TC-500, step 4: “Click the **Log in** button.” Pick the locator for the highlighted button."
        ru: "TC-500, шаг 4: «Нажать кнопку **Log in**». Выбери локатор для подсвеченной кнопки."
      options:
        - text: "page.getByRole('button', { name: 'Log in' })"
          correct: true
          why:
            en: "Rung 1: what the user sees — a button that says “Log in”. Exactly one element matches."
            ru: "Ступенька 1: то, что видит пользователь, — кнопка с надписью «Log in». Подходит ровно один элемент."
        - text: "page.getByTestId('login-button')"
          why:
            en: "Stable and unique — but rung 4. Users never see test ids, and this button has a perfectly good role and name. Keep test ids for elements that have neither."
            ru: "Стабильный и уникальный — но это ступенька 4. Пользователи не видят test id, а у этой кнопки есть отличные роль и имя. Test id оставь для элементов, у которых нет ни того, ни другого."
        - text: "page.getByText('Log in')"
          why:
            en: "Three elements show this text: the menu link, the heading and the button. Which one? The text alone can't say."
            ru: "Этот текст есть у трёх элементов: ссылки в меню, заголовка и кнопки. Какой из них? Сам текст этого не скажет."
        - text: "page.locator('#login-form > button.btn')"
          why:
            en: "CSS tied to the class `btn` and the form structure — the first thing Kai's redesign changes. Last rung."
            ru: "CSS, привязанный к классу `btn` и структуре формы, — первое, что изменит редизайн Кая. Последняя ступенька."
      hints:
        - en: "Climb the ladder from the top: does the button have a role and a name?"
          ru: "Иди по лестнице сверху: есть ли у кнопки роль и имя?"
        - en: "Three of the four would click this button today. Which of them describes what the user sees?"
          ru: "Сегодня эту кнопку нажали бы три варианта из четырёх. Какой из них описывает то, что видит пользователь?"
        - en: "A button that says “Log in”: `getByRole('button', …)`."
          ru: "Кнопка с надписью «Log in»: `getByRole('button', …)`."
      praise:
        en: "Top rung, one match, reads like the test step. That's the locator a senior reviewer approves without a comment."
        ru: "Верхняя ступенька, одно совпадение, читается как шаг теста. Такой локатор сеньор на ревью одобрит без единого комментария."
      explain:
        en: "Start at the top of the ladder and stop at the first rung that finds exactly one element. Here rung 1 already works: role `button`, name “Log in”."
        ru: "Начинай с верха лестницы и останавливайся на первой ступеньке, которая находит ровно один элемент. Здесь срабатывает уже ступенька 1: роль `button`, имя «Log in»."

  - type: task
    task:
      id: c5-l1-t2
      kind: match
      keyPoint: kp-role-label
      prompt:
        en: "Match each element of the login page with its locator. Careful: two of them have the same name."
        ru: "Сопоставь каждый элемент страницы входа с его локатором. Осторожно: у двух из них одинаковое имя."
      pairs:
        - left: { en: "The page title “Log in”", ru: "Заголовок страницы «Log in»" }
          right: "page.getByRole('heading', { name: 'Log in' })"
        - left: { en: "The “Log in” button in the form", ru: "Кнопка «Log in» в форме" }
          right: "page.getByRole('button', { name: 'Log in' })"
        - left: { en: "The “Create an account” link", ru: "Ссылка «Create an account»" }
          right: "page.getByRole('link', { name: 'Create an account' })"
        - left: { en: "The “Remember me” checkbox", ru: "Чекбокс «Remember me»" }
          right: "page.getByRole('checkbox', { name: 'Remember me' })"
        - left: { en: "The Password field", ru: "Поле Password" }
          right: "page.getByLabel('Password')"
      rightCode: true
      hints:
        - en: "The first argument of `getByRole` says what kind of element it is."
          ru: "Первый аргумент `getByRole` говорит, что это за элемент."
        - en: "A title is a `heading`; the thing that submits the form is a `button`."
          ru: "Заголовок — это `heading`; то, чем отправляют форму, — `button`."
        - en: "A field with a label → `getByLabel`."
          ru: "Поле с подписью → `getByLabel`."
      praise:
        en: "Same name, different roles — you kept the heading and the button apart."
        ru: "Имя одно, роли разные — и ты не {перепутала|перепутал} заголовок с кнопкой."
      explain:
        en: "The role answers “what is it?”, the name answers “which one?”. Together they describe the element the way a user would. For a field, the label does both jobs."
        ru: "Роль отвечает на вопрос «что это?», имя — на вопрос «какой именно?». Вместе они описывают элемент так, как это сделал бы пользователь. У поля обе задачи решает подпись."

  - type: task
    task:
      id: c5-l1-t3
      kind: inspect
      keyPoint: kp-role-label
      app: { route: /shop }
      prompt:
        en: "Your step: “Sort the shop by Price: low to high.” The test will use `page.getByLabel('Sort by')`. Click the element this locator returns."
        ru: "Твой шаг: «Отсортировать магазин по Price: low to high». Тест будет использовать `page.getByLabel('Sort by')`. Нажми на элемент, который вернёт этот локатор."
      target: "#sort"
      view: both
      show: [role, name]
      hints:
        - en: "There are two candidates: the words “Sort by” and the dropdown next to them."
          ru: "Кандидатов два: слова «Sort by» и выпадающий список рядом с ними."
        - en: "`getByLabel` returns the thing you can type into or choose from, not its caption."
          ru: "`getByLabel` возвращает то, во что можно вводить или из чего можно выбирать, а не надпись к нему."
        - en: "The dropdown: `<select id=\"sort\">`, role `combobox`, name “Sort by”."
          ru: "Выпадающий список: `<select id=\"sort\">`, роль `combobox`, имя «Sort by»."
      praise:
        en: "You picked the field, not its caption — that's exactly what getByLabel does."
        ru: "Ты {выбрала|выбрал} поле, а не надпись к нему, — именно так и работает getByLabel."
      explain:
        en: "`<label for=\"sort\">` gives the dropdown its accessible name “Sort by”. `getByLabel` follows that link and returns the dropdown itself, so `selectOption('price-asc')` works on it. The caption is just text — there's nothing to choose in it."
        ru: "`<label for=\"sort\">` даёт выпадающему списку доступное имя «Sort by». `getByLabel` идёт по этой связи и возвращает сам список, поэтому `selectOption('price-asc')` на нём работает. Надпись — просто текст, в ней ничего не выберешь."

  - type: task
    task:
      id: c5-l1-t4
      kind: fill
      keyPoint: kp-role-label
      prompt:
        en: "Complete TC-502 with locators from the ladder. The finished test runs against Bloomly."
        ru: "Допиши TC-502 локаторами с лестницы. Готовый тест запустится на Bloomly."
      testCase:
        id: TC-502
        title: Search finds a product by name
        steps:
          - { action: "Open /shop" }
          - { action: "Type the search term into \"Search\"", data: "tulips", expected: "The \"Sunny Tulips\" card is shown; the count says \"1 product\"" }
      code: |
        import { test, expect } from '@playwright/test';

        test('search finds Sunny Tulips', async ({ page }) => {
          await page.goto('/shop');
          await page.___('Search').fill('tulips');
          await expect(page.getByRole('___', { name: 'Sunny Tulips' })).toBeVisible();
          await expect(page.___('results-count')).toHaveText('1 product');
        });
      blanks:
        - { answers: [getByLabel], options: [getByLabel, getByText, getByTestId] }
        - { answers: [heading], options: [heading, button, link] }
        - { answers: [getByTestId] }
      checks: { expect: pass }
      hints:
        - en: "Line 5 is a form field with a label. Line 6 is the product name — the title of the card."
          ru: "Строка 5 — поле формы с подписью. Строка 6 — название товара, заголовок карточки."
        - en: "The products count has no role name and no label — only a test id."
          ru: "У счётчика товаров нет ни имени по роли, ни подписи — только test id."
        - en: "In order: getByLabel, heading, getByTestId."
          ru: "По порядку: getByLabel, heading, getByTestId."
      praise:
        en: "Three rungs in one test, each chosen for a reason — and it's green."
        ru: "Три ступеньки в одном тесте, каждая выбрана не случайно, — и тест зелёный."
      explain:
        en: "The field has a label → `getByLabel`. The product name is an `<h2>` → role `heading`. “1 product” is plain text with no name of its own → `getByTestId('results-count')`, the contract Kai keeps for tests."
        ru: "У поля есть подпись → `getByLabel`. Название товара — `<h2>` → роль `heading`. «1 product» — обычный текст без собственного имени → `getByTestId('results-count')`, договорённость, которую Кай сохраняет для тестов."

  - type: task
    task:
      id: c5-l1-t5
      kind: review
      keyPoint: kp-locator-priority
      context:
        en: "Petal's first try at TC-500, copied straight from the HTML."
        ru: "Первая попытка Petal для TC-500 — скопирована прямо из HTML."
      prompt:
        en: "Flag every locator that sits too low on the ladder or can't tell which element it means, and pick the issue type."
        ru: "Отметь каждый локатор, который стоит слишком низко на лестнице или не может сказать, какой элемент имеется в виду, и выбери тип проблемы."
      testCase:
        id: TC-500
        title: User can log in with Remember me
        preconditions: ["User anna@bloomly.app / bloom123 exists"]
        steps:
          - { action: "Open /login" }
          - { action: "Enter email and password", data: "anna@bloomly.app / bloom123" }
          - { action: "Tick \"Remember me\"" }
          - { action: "Click \"Log in\"", expected: "The account page shows \"Welcome back, Anna!\"" }
      code: |
        import { test, expect } from '@playwright/test';

        test('user can log in with Remember me', async ({ page }) => {
          await page.goto('/login');
          await page.locator('#login-form > input:nth-of-type(1)').fill('anna@bloomly.app');
          await page.getByLabel('Password').fill('bloom123');
          await page.locator('.check input').check();
          await page.getByText('Log in').click();
          await expect(page.getByRole('heading', { name: 'Welcome back, Anna!' })).toBeVisible();
        });
      issues:
        - line: 5
          type: fragile-locator
          note:
            en: "“The first input in the form” is a position. Kai's redesign wraps every field in a `<div>`, and this finds nothing. Use `getByLabel('Email')`."
            ru: "«Первое поле в форме» — это позиция. Редизайн Кая оборачивает каждое поле в `<div>`, и этот селектор ничего не найдёт. Используй `getByLabel('Email')`."
        - line: 7
          type: fragile-locator
          note:
            en: "`.check` is a style class. Use `getByRole('checkbox', { name: 'Remember me' })`."
            ru: "`.check` — класс стиля. Используй `getByRole('checkbox', { name: 'Remember me' })`."
        - line: 8
          type: fragile-locator
          note:
            en: "“Log in” is on three elements, so this click fails with a strict mode violation. Use `getByRole('button', { name: 'Log in' })`."
            ru: "«Log in» есть у трёх элементов, поэтому клик падает с ошибкой strict mode. Используй `getByRole('button', { name: 'Log in' })`."
      types: [fragile-locator, hallucination, weak-assertion, hard-wait, missing-await]
      hints:
        - en: "Go line by line: does the locator describe what the user sees?"
          ru: "Иди построчно: описывает ли локатор то, что видит пользователь?"
        - en: "Watch for positions (`nth-of-type`), classes (`.check`) and text that appears more than once."
          ru: "Ищи позиции (`nth-of-type`), классы (`.check`) и текст, который встречается не один раз."
        - en: "Lines 5, 7 and 8 — all fragile-locator."
          ru: "Строки 5, 7 и 8 — все fragile-locator."
      praise:
        en: "Three weak locators, three catches — and you left the good ones alone."
        ru: "Три слабых локатора — три находки, а хорошие ты не {тронула|тронул}."
      explain:
        en: "Line 8 is the trap: `getByText` is on the ladder, but here the text alone is ambiguous. Lines 5 and 7 work today and break on the redesign. Lines 6 and 9 are already on rungs 1–2."
        ru: "Строка 8 — ловушка: `getByText` есть на лестнице, но здесь одного текста мало. Строки 5 и 7 работают сегодня и сломаются при редизайне. Строки 6 и 9 уже стоят на ступеньках 1–2."

  - type: task
    task:
      id: c5-l1-t6
      kind: predict
      keyPoint: kp-testid-contract
      app: { bugs: [a11y-add-to-cart-div] }
      context:
        en: "Kai's refactor slipped: “Add to cart” is now a `<div>` that only looks like a button — keyboard and screen-reader users can't use it (the accessibility bug from chapter 4). The shop opens pre-filtered to one card."
        ru: "В рефакторинг Кая закралась ошибка: «Add to cart» теперь `<div>`, который только выглядит как кнопка, — пользователи клавиатуры и скринридеров не могут им воспользоваться (баг доступности из главы 4). Магазин открывается с фильтром, и на странице одна карточка."
      prompt:
        en: "Will Petal's test pass or fail on this build?"
        ru: "Тест Petal пройдёт или упадёт на этой сборке?"
      code: |
        import { test, expect } from '@playwright/test';

        test('add Sunny Tulips to the cart', async ({ page }) => {
          await page.goto('/shop?q=sunny');
          await page.getByTestId('add-to-cart').click();
          await expect(page.getByTestId('cart-count')).toHaveText('1');
        });
      outcome: pass
      reasons:
        - text:
            en: "Pass: the `<div>` still has `data-testid=\"add-to-cart\"`, and a mouse click still works. The test id doesn't care that it's no longer a button."
            ru: "Пройдёт: у `<div>` остался `data-testid=\"add-to-cart\"`, а клик мышью по-прежнему работает. Локатору по test id всё равно, что это больше не кнопка."
          correct: true
        - text:
            en: "Fail: a `<div>` can't be clicked."
            ru: "Упадёт: по `<div>` нельзя кликнуть."
          why:
            en: "A mouse click on a `<div>` works fine — that's why this bug is easy to miss by eye, too."
            ru: "Клик мышью по `<div>` прекрасно работает — поэтому этот баг легко пропустить и глазами."
        - text:
            en: "Fail: the cart count doesn't update."
            ru: "Упадёт: счётчик корзины не обновляется."
          why:
            en: "It updates — adding to the cart works. Only the button role is gone."
            ru: "Обновляется — добавление в корзину работает. Пропала только роль кнопки."
      hints:
        - en: "What does `getByTestId` look at: the role or the attribute?"
          ru: "На что смотрит `getByTestId`: на роль или на атрибут?"
        - en: "Did Kai's refactor remove the `data-testid`?"
          ru: "Убрал ли рефакторинг Кая `data-testid`?"
        - en: "It passes. Now think: is that good news?"
          ru: "Пройдёт. А теперь подумай: это хорошая новость?"
      praise:
        en: "Right — and you saw the catch: green here means the bug slipped through."
        ru: "Верно — и ты {заметила|заметил} подвох: зелёный здесь значит, что баг проскочил."
      explain:
        en: "The test id survived the refactor, so the test is green — while keyboard and screen-reader users can't add anything to the cart. With `getByRole('button', { name: 'Add to cart' })` the same test fails and reports the bug. Stable but invisible: that's the trade-off of rung 4."
        ru: "Test id пережил рефакторинг, поэтому тест зелёный — а пользователи клавиатуры и скринридеров ничего не могут добавить в корзину. С `getByRole('button', { name: 'Add to cart' })` тот же тест падает и сообщает о баге. Стабильно, но невидимо — вот цена ступеньки 4."

