          ru: "Без шагов и ожидаемого результата Petal проверил другое: «rose» строчными буквами и «видна какая-то карточка». Суть TC-503 — заглавные буквы — потерялась."
        policy:
          en: "Without a locator policy Petal either copied class names from the HTML (`.toolbar`, `.product-card` — green today, red after Kai's redesign) or, told only to be “stable”, used test ids everywhere and invented one Bloomly doesn't have."
