        ru: "Читает ли хоть одна строка теста текст кнопки?"
    explain:
      en: "Kai kept the contract, so the test is stable through a text change. But notice what it can't see: if your test case says the button reads “Log in”, nothing here tells you it changed. `get_by_role(\"button\", name=\"Log in\")` would fail and send you back to the test case. Stable or user-facing — choose on purpose."
      ru: 'Кай сохранил договорённость, поэтому тест пережил смену текста. Но обрати внимание, чего он не видит: если в тест-кейсе кнопка называется «Log in», здесь ничто не скажет, что она изменилась. `get_by_role("button", name="Log in")` упал бы и вернул тебя к тест-кейсу. Стабильность или взгляд пользователя — выбирай осознанно.'

