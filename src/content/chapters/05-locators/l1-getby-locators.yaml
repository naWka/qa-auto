      ru: "Счётчик — обычный `<p>`: роль `paragraph`, ни имени, ни подписи. Пользователь его читает, но не может указать на него по имени, — поэтому Кай дал ему `data-testid=\"results-count\"`. У остальных трёх есть роль и имя или подпись, им test id не нужен."

  - id: c5-l1-k7
    kind: fix
    keyPoint: kp-role-label
    context:
      en: "Petal's TC-508 test is red: one locator times out. Petal suggests “a longer timeout”."
      ru: "Тест Petal для TC-508 красный: один локатор не дожидается элемента. Petal предлагает «таймаут подлиннее»."
    prompt:
      en: "Find the invented locator and replace it with one from the ladder. Then run the test."
