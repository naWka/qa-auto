  - id: c5-l1-k8
    kind: choice
    keyPoint: kp-testid-contract
    context:
      en: "Kai's PR “Rename product list test ids” changes one line in the shop page."
      ru: "PR Кая «Rename product list test ids» меняет одну строку на странице магазина."
    prompt:
      en: "What do you comment in the review?"
      ru: "Что ты напишешь в ревью?"
    diff:
      before: |
        <p data-testid="results-count">6 products</p>
      after: |
        <p data-testid="product-count">6 products</p>
    options:
      - text:
          en: '“Our tests use get_by_test_id("results-count"), so this rename breaks them. Please keep the old id, or update the tests in the same PR.”'
          ru: '«Наши тесты используют get_by_test_id("results-count"), так что это переименование их сломает. Пожалуйста, оставь старый id или обнови тесты в этом же PR.»'
        correct: true
        why:
          en: "A test id is a contract: renaming it is a breaking change for tests, even though users see no difference."
          ru: "Test id — это договорённость: его переименование ломает тесты, хотя пользователи никакой разницы не видят."
      - text:
          en: "Nothing — test ids are stable, so the tests don't care."
          ru: "Ничего — test id стабильные, тестам всё равно."
        why:
          en: "They're stable only while the contract holds. This PR breaks it."
          ru: "Они стабильны, только пока соблюдается договорённость. Этот PR её нарушает."
      - text:
          en: "Nothing — users still see the same “6 products”."
          ru: "Ничего — пользователи по-прежнему видят те же «6 products»."
        why:
          en: "That's exactly why users won't notice — and why the tests will: they look for the old id."
          ru: "Именно поэтому пользователи ничего не заметят — а тесты заметят: они ищут старый id."
      - text:
          en: "Ask Kai to drop test ids and use CSS classes instead."
          ru: "Попросить Кая убрать test id и использовать CSS-классы."
        why:
          en: "Classes are what the redesign changes. That makes things worse."
          ru: "Классы — это как раз то, что меняет редизайн. Так станет только хуже."
    hints:
      - en: "What exactly do the tests search for?"
        ru: "Что именно ищут тесты?"
      - en: 'Would `get_by_test_id("results-count")` still find anything after this PR?'
        ru: 'Найдёт ли `get_by_test_id("results-count")` хоть что-то после этого PR?'
    explain:
      en: "Users see no change, so a role or text locator wouldn't care. A test id locator does: the contract is the attribute value itself. That's why test id renames go into one PR together with the tests — or don't happen at all."
      ru: "Пользователи изменений не видят, поэтому локатору по роли или тексту было бы всё равно. А локатору по test id — нет: договорённость — это само значение атрибута. Поэтому переименование test id делают в одном PR вместе с тестами — или не делают вовсе."
