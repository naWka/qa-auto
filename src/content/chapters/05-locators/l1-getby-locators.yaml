  - id: c5-l1-k3
    kind: review
    keyPoint: kp-locator-priority
    context:
      en: "Petal wrote TC-505 without opening the signup page."
      ru: "Petal написал TC-505, не открывая страницу регистрации."
    prompt:
      en: "Review the locators. Flag each problem line and pick the issue type."
      ru: "Проверь локаторы. Отметь каждую проблемную строку и выбери тип проблемы."
    testCase:
      id: TC-505
      title: New user can create an account
      steps:
        - { action: "Open /signup" }
        - { action: "Fill in Full name, Email and Password", data: "Nina Kowalska / nina@bloomly.app / petals2026" }
        - { action: "Choose the country", data: "Poland" }
        - { action: "Accept the Terms of Service" }
        - { action: "Click \"Create account\"", expected: "\"Account created!\" is shown" }
    code: |
      from playwright.sync_api import Page, expect


      def test_new_user_can_create_an_account(page: Page):
          page.goto("/signup")
          page.get_by_label("Full name").fill("Nina Kowalska")
          page.get_by_test_id("signup-email").fill("nina@bloomly.app")
          page.get_by_label("Password").fill("petals2026")
          page.get_by_label("Country").select_option("Poland")
          page.locator("xpath=//form/label[last()]/input").check()
          page.get_by_role("submit", name="Create account").click()
          expect(page.get_by_role("heading", name="Account created!")).to_be_visible()
    issues:
      - line: 7
        type: hallucination
        note:
          en: 'The signup Email field has no test id — Petal invented one. It has a label: `get_by_label("Email")`.'
          ru: 'У поля Email на странице регистрации нет test id — Petal его выдумал. Зато есть подпись: `get_by_label("Email")`.'
      - line: 10
        type: fragile-locator
        note:
          en: '“The last label in the form” is a position. Add one more checkbox at the end, and the test ticks the wrong box. Use `get_by_role("checkbox", name="I agree to the Terms of Service")`.'
          ru: '«Последняя подпись в форме» — это позиция. Добавят ещё один чекбокс в конец — и тест отметит не тот. Используй `get_by_role("checkbox", name="I agree to the Terms of Service")`.'
      - line: 11
        type: hallucination
        note:
          en: "`submit` is the button's `type`, not a role. The role is `button`: `get_by_role(\"button\", name=\"Create account\")`."
          ru: '`submit` — это `type` кнопки, а не роль. Роль — `button`: `get_by_role("button", name="Create account")`.'
    types: [hallucination, fragile-locator, wrong-data, weak-assertion, hard-wait]
    hints:
      - en: "Check every test id and every role against the real signup page."
        ru: "Сверь каждый test id и каждую роль с настоящей страницей регистрации."
      - en: "One invented test id, one invented role, one locator that depends on position."
        ru: "Один выдуманный test id, одна выдуманная роль, один локатор, зависящий от позиции."
      - en: "Lines 7, 10 and 11."
        ru: "Строки 7, 10 и 11."
    explain:
      en: "Petal mixed three habits: a test id that “should” exist, counting positions in the form, and confusing the button's `type=\"submit\"` with its role. The ladder fixes all three: `get_by_label(\"Email\")`, `get_by_role(\"checkbox\", name=\"I agree to the Terms of Service\")`, `get_by_role(\"button\", name=\"Create account\")`."
      ru: 'Petal смешал три привычки: test id, который «должен» быть, отсчёт позиций в форме и путаницу между `type="submit"` кнопки и её ролью. Лестница исправляет все три: `get_by_label("Email")`, `get_by_role("checkbox", name="I agree to the Terms of Service")`, `get_by_role("button", name="Create account")`.'

  - id: c5-l1-k4
    kind: predict
    keyPoint: kp-testid-contract
    placement: true
    app: { variant: sign-in }
    context:
