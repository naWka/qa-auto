  - type: task
    task:
      id: c5-l1-t5
      kind: review
      keyPoint: kp-locator-priority
      context:
        en: "Petal's first try at TC-500, copied straight from the HTML."
        ru: "Первая попытка Petal для TC-500 — скопирована прямо из HTML."
      prompt:
        en: "Flag every locator that sits too low on the ladder or can't tell which element it means, and pick the issue type."
        ru: "Отметь каждый локатор, который стоит слишком низко на лестнице или не может сказать, какой элемент имеется в виду, и выбери тип проблемы."
      testCase:
        id: TC-500
        title: User can log in with Remember me
        preconditions: ["User anna@bloomly.app / bloom123 exists"]
        steps:
          - { action: "Open /login" }
          - { action: "Enter email and password", data: "anna@bloomly.app / bloom123" }
          - { action: "Tick \"Remember me\"" }
          - { action: "Click \"Log in\"", expected: "The account page shows \"Welcome back, Anna!\"" }
      code: |
        from playwright.sync_api import Page, expect


        def test_user_can_log_in_with_remember_me(page: Page):
            page.goto("/login")
            page.locator("#login-form > input:nth-of-type(1)").fill("anna@bloomly.app")
            page.get_by_label("Password").fill("bloom123")
            page.locator(".check input").check()
            page.get_by_text("Log in").click()
            expect(page.get_by_role("heading", name="Welcome back, Anna!")).to_be_visible()
      issues:
        - line: 6
          type: fragile-locator
          note:
            en: "“The first input in the form” is a position. Kai's redesign wraps every field in a `<div>`, and this finds nothing. Use `get_by_label(\"Email\")`."
            ru: '«Первое поле в форме» — это позиция. Редизайн Кая оборачивает каждое поле в `<div>`, и этот селектор ничего не найдёт. Используй `get_by_label("Email")`.'
        - line: 8
          type: fragile-locator
          note:
            en: '`.check` is a style class. Use `get_by_role("checkbox", name="Remember me")`.'
            ru: '`.check` — класс стиля. Используй `get_by_role("checkbox", name="Remember me")`.'
        - line: 9
          type: fragile-locator
          note:
            en: '“Log in” is on three elements, so this click fails with a strict mode violation. Use `get_by_role("button", name="Log in")`.'
            ru: '«Log in» есть у трёх элементов, поэтому клик падает с ошибкой strict mode. Используй `get_by_role("button", name="Log in")`.'
      types: [fragile-locator, hallucination, weak-assertion, hard-wait, not-called]
      hints:
        - en: "Go line by line: does the locator describe what the user sees?"
          ru: "Иди построчно: описывает ли локатор то, что видит пользователь?"
        - en: "Watch for positions (`nth-of-type`), classes (`.check`) and text that appears more than once."
          ru: "Ищи позиции (`nth-of-type`), классы (`.check`) и текст, который встречается не один раз."
        - en: "Lines 6, 8 and 9 — all fragile-locator."
          ru: "Строки 6, 8 и 9 — все fragile-locator."
      praise:
        en: "Three weak locators, three catches — and you left the good ones alone."
        ru: "Три слабых локатора — три находки, а хорошие ты не {тронула|тронул}."
      explain:
        en: "Line 9 is the trap: `get_by_text` is on the ladder, but here the text alone is ambiguous. Lines 6 and 8 work today and break on the redesign. Lines 7 and 10 are already on rungs 1–2."
        ru: "Строка 9 — ловушка: `get_by_text` есть на лестнице, но здесь одного текста мало. Строки 6 и 8 работают сегодня и сломаются при редизайне. Строки 7 и 10 уже стоят на ступеньках 1–2."

  - type: task
    task:
      id: c5-l1-t6
      kind: predict
      keyPoint: kp-testid-contract
      app: { bugs: [a11y-add-to-cart-div] }
      context:
        en: "Kai's refactor slipped: “Add to cart” is now a `<div>` that only looks like a button — keyboard and screen-reader users can't use it (the accessibility bug from chapter 4). The shop opens pre-filtered to one card."
        ru: "В рефакторинг Кая закралась ошибка: «Add to cart» теперь `<div>`, который только выглядит как кнопка, — пользователи клавиатуры и скринридеров не могут им воспользоваться (баг доступности из главы 4). Магазин открывается с фильтром, и на странице одна карточка."
      prompt:
        en: "Will Petal's test pass or fail on this build?"
        ru: "Тест Petal пройдёт или упадёт на этой сборке?"
      code: |
        from playwright.sync_api import Page, expect


        def test_add_sunny_tulips_to_the_cart(page: Page):
            page.goto("/shop?q=sunny")
            page.get_by_test_id("add-to-cart").click()
            expect(page.get_by_test_id("cart-count")).to_have_text("1")
      outcome: pass
      reasons:
        - text:
            en: "Pass: the `<div>` still has `data-testid=\"add-to-cart\"`, and a mouse click still works. The test id doesn't care that it's no longer a button."
            ru: 'Пройдёт: у `<div>` остался `data-testid="add-to-cart"`, а клик мышью по-прежнему работает. Локатору по test id всё равно, что это больше не кнопка.'
          correct: true
        - text:
            en: "Fail: a `<div>` can't be clicked."
            ru: "Упадёт: по `<div>` нельзя кликнуть."
          why:
            en: "A mouse click on a `<div>` works fine — that's why this bug is easy to miss by eye, too."
            ru: "Клик мышью по `<div>` прекрасно работает — поэтому этот баг легко пропустить и глазами."
        - text:
            en: "Fail: the cart count doesn't update."
            ru: "Упадёт: счётчик корзины не обновляется."
          why:
            en: "It updates — adding to the cart works. Only the button role is gone."
            ru: "Обновляется — добавление в корзину работает. Пропала только роль кнопки."
      hints:
        - en: "What does `get_by_test_id` look at: the role or the attribute?"
          ru: "На что смотрит `get_by_test_id`: на роль или на атрибут?"
        - en: "Did Kai's refactor remove the `data-testid`?"
          ru: "Убрал ли рефакторинг Кая `data-testid`?"
        - en: "It passes. Now think: is that good news?"
          ru: "Пройдёт. А теперь подумай: это хорошая новость?"
      praise:
        en: "Right — and you saw the catch: green here means the bug slipped through."
        ru: "Верно — и ты {заметила|заметил} подвох: зелёный здесь значит, что баг проскочил."
      explain:
        en: "The test id survived the refactor, so the test is green — while keyboard and screen-reader users can't add anything to the cart. With `get_by_role(\"button\", name=\"Add to cart\")` the same test fails and reports the bug. Stable but invisible: that's the trade-off of rung 4."
        ru: 'Test id пережил рефакторинг, поэтому тест зелёный — а пользователи клавиатуры и скринридеров ничего не могут добавить в корзину. С `get_by_role("button", name="Add to cart")` тот же тест падает и сообщает о баге. Стабильно, но невидимо — вот цена ступеньки 4.'

  - type: task
