        - { id: policy, text: "Locators: get_by_role with the accessible name, get_by_label for form fields. Use get_by_test_id only for elements with no role name or label, like the products count. No CSS classes, no XPath.", ru: "Локаторы: get_by_role с доступным именем, get_by_label для полей формы. get_by_test_id — только для элементов без имени по роли и без подписи, например для счётчика товаров. Никаких CSS-классов и XPath." }
