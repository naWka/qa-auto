        ru: "После редизайна Petal «вылечил» красный тест промокода: открыл страницу на стейджинге и скопировал новые имена классов. На стейджинге зелёный ✅"
      prompt:
        en: "Review the healed test. Flag every line that will go red again — or slows down every run."
        ru: "Сделай ревью «вылеченного» теста. Отметь каждую строку, которая снова покраснеет или замедляет каждый прогон."
      testCase:
        id: TC-521
        title: BLOOM10 gives 10% off
        preconditions: ["Cart has 1 Rose Bouquet (€35.00)"]
        steps:
          - { action: "Open /cart" }
          - { action: "Enter the promo code and click \"Apply\"", data: "BLOOM10", expected: "Total is €36.40" }
      code: |
        from playwright.sync_api import Page, expect


        def test_bloom10_gives_10_percent_off(page: Page):
            page.goto("/cart")
            page.locator(".bl_promo__33cjx > input").fill("BLOOM10")
            page.locator(".bl_promo__33cjx > .bl_btn__375kd").click()
