        ru: "Локатор по роли и имени читает то же, что пользователь или скринридер."
    explain:
      en: "A resilient locator stays green on changes only the code sees and goes red on changes users see. A renamed button is a user-facing change — the test should notice it."
      ru: "Устойчивый локатор остаётся зелёным при изменениях, которые видит только код, и краснеет при изменениях, которые видят пользователи. Переименованная кнопка — изменение для пользователя, и тест должен его заметить."

  - id: c5-l2-k3
    kind: review
    keyPoint: kp-layout-breaks
    context:
      en: "Kai's redesign lands on Friday: new class names, and every label with its field gets a wrapper `div`. Petal's test is green today."
      ru: "Редизайн Кая выходит в пятницу: новые имена классов, а каждая подпись с полем получит обёртку `div`. Сегодня тест Petal зелёный."
    prompt:
      en: "Flag every line that will go red after the redesign — and only those."
      ru: "Отметь каждую строку, которая покраснеет после редизайна, — и только их."
    testCase:
      id: TC-524
      title: Gift message counter counts characters
      preconditions: ["Cart has 1 Rose Bouquet"]
      steps:
        - { action: "Open /checkout" }
        - { action: "Tick \"This is a gift\"" }
        - { action: "Type a gift message", data: "Happy birthday!", expected: "The counter shows 15/200" }
    code: |
      from playwright.sync_api import Page, expect


      def test_gift_message_counter_counts_characters(page: Page):
          page.goto("/checkout")
          page.locator("//form/label[5]/input").check()
          page.get_by_label("Gift message").fill("Happy birthday!")
          expect(page.locator("#checkout-form > div > p.hint")).to_have_text("15/200")
    issues:
      - line: 6
        type: fragile-locator
        note:
          en: 'XPath by position: “the 5th label directly inside the form”. After the wrappers the form has only one direct label left. Use `get_by_role("checkbox", name="This is a gift")`.'
          ru: 'XPath по позиции: «пятая подпись прямо внутри формы». После обёрток у формы останется только одна прямая подпись. Используй `get_by_role("checkbox", name="This is a gift")`.'
      - line: 8
        type: fragile-locator
        note:
          en: 'A path plus a class: `form > div > p.hint`. The class becomes `bl_hint__…`, and the form gets more `div`s. Use `get_by_test_id("gift-counter")`.'
          ru: 'Путь плюс класс: `form > div > p.hint`. Класс станет `bl_hint__…`, а `div` в форме прибавится. Используй `get_by_test_id("gift-counter")`.'
    types: [fragile-locator, hard-wait, wrong-assertion, wrong-data]
    hints:
      - en: "For each locator: does it rely on a position, a path, a class — or on what the user sees?"
        ru: "Про каждый локатор: опирается он на позицию, путь, класс — или на то, что видит пользователь?"
      - en: "Two lines rely on the layout: one XPath and one CSS path."
        ru: "На вёрстку опираются две строки: один XPath и один CSS-путь."
      - en: "Lines 6 and 8."
        ru: "Строки 6 и 8."
    explain:
      en: "Line 7 survives: `get_by_label(\"Gift message\")` follows the label wherever it sits. Lines 6 and 8 describe the form's structure — exactly what the redesign changes. On Friday both go red with no bug in checkout."
      ru: 'Строка 7 выживет: `get_by_label("Gift message")` идёт за подписью, где бы та ни находилась. Строки 6 и 8 описывают устройство формы — ровно то, что меняет редизайн. В пятницу обе покраснеют, хотя в чекауте не будет ни одного бага.'

  - id: c5-l2-k4
    kind: fix
    keyPoint: kp-user-facing-resilient
    app: { variant: redesign, state: { user: anna@bloomly.app } }
    prompt:
      en: "Make the test pass on both builds: the editor runs it on Kai's redesign, and the check also runs the old build."
      ru: "Сделай так, чтобы тест проходил на обеих сборках: редактор запускает его на редизайне Кая, а проверка — ещё и на старой сборке."
    testCase:
      id: TC-525
      title: Account page shows the city and links to orders
      preconditions: ["Anna is logged in"]
      steps:
        - { action: "Open /account", expected: "City shows \"Lisbon\"" }
        - { action: "Click \"My orders\"", expected: "The orders page opens (/orders)" }
    starter: |
      from playwright.sync_api import Page, expect


      def test_account_page_shows_the_city_and_links_to_orders(page: Page):
          page.goto("/account")
          expect(page.locator("dl.details > dd:nth-child(6)")).to_have_text("Lisbon")
          page.locator(".row-actions > .btn.secondary").click()
          expect(page).to_have_url("http://localhost:3000/orders")
    solution: |
      from playwright.sync_api import Page, expect


      def test_account_page_shows_the_city_and_links_to_orders(page: Page):
          page.goto("/account")
          expect(page.get_by_test_id("account-city")).to_have_text("Lisbon")
          page.get_by_role("link", name="My orders").click()
          expect(page).to_have_url("http://localhost:3000/orders")
    checks:
