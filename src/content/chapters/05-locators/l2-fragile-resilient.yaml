          ru: "Сегодня на стейджинге он зелёный. Про каждую строку спроси: что сломает её в следующем месяце?"
        - en: "Look for `bl_…__xxxxx` names and positions like `nth-child`. One more line costs time, not stability."
          ru: "Ищи имена вида `bl_…__xxxxx` и позиции вроде `nth-child`. А ещё одна строка бьёт не по стабильности, а по времени."
        - en: "Lines 6, 7 and 9 are fragile; line 8 is a hard wait."
