            expect(page.locator(".bl_summary__vi46o > dd:nth-child(8)")).to_have_text("€36.40")
      issues:
        - line: 6
          type: fragile-locator
          note:
            en: "A generated class plus a path. `bl_promo__33cjx` is today's hash — the next design-system build can rename it again. Use `get_by_label(\"Promo code\")`."
            ru: 'Сгенерированный класс плюс путь. `bl_promo__33cjx` — сегодняшний хеш, следующая сборка дизайн-системы может снова его переименовать. Используй `get_by_label("Promo code")`.'
        - line: 7
          type: fragile-locator
          note:
            en: 'The same problem twice: generated classes for the block and for the button. Use `get_by_role("button", name="Apply")`.'
            ru: 'Та же проблема дважды: сгенерированные классы у блока и у кнопки. Используй `get_by_role("button", name="Apply")`.'
        - line: 8
          type: hard-wait
          note:
