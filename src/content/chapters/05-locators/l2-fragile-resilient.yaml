        ru: "Два локатора зависят от классов и позиций."
      - en: "The city has a test id, `account-city`. “My orders” is a link with a name."
        ru: "У города есть test id — `account-city`. «My orders» — ссылка с именем."
      - en: '`page.get_by_test_id("account-city")` and `page.get_by_role("link", name="My orders")`.'
        ru: '`page.get_by_test_id("account-city")` и `page.get_by_role("link", name="My orders")`.'
    explain:
      en: "“The 6th child of the details list” and “the secondary button in the actions row” describe the layout. The test id and the link's name describe what's there, so they pass on both builds."
      ru: "«Шестой потомок списка данных» и «второстепенная кнопка в ряду действий» описывают вёрстку. Test id и имя ссылки описывают то, что там есть, поэтому проходят на обеих сборках."

