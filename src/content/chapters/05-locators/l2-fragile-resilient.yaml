  - id: c5-l2-k6
    kind: choice
    keyPoint: kp-false-alarms
    context:
      en: "Petal: “To stop the red nights, I'll rerun every failed test 3 times (`pytest --reruns 3`) and add `wait_for_timeout(3000)` before every click.”"
      ru: "Petal: «Чтобы красные ночи прекратились, я буду перезапускать каждый упавший тест 3 раза (`pytest --reruns 3`) и добавлю `wait_for_timeout(3000)` перед каждым кликом»."
    prompt:
      en: "The red tests fail on `.btn` and `nth-child` selectors after the redesign. What do you reply?"
      ru: "Красные тесты падают на селекторах с `.btn` и `nth-child` после редизайна. Что ты ответишь?"
    options:
      - text: { en: "No: these selectors fail every time — no wait or retry finds a class that's gone. Let's replace them with user-facing locators.", ru: "Нет: эти селекторы падают каждый раз — никакое ожидание или повтор не найдёт класс, которого нет. Давай заменим их локаторами, понятными пользователю." }
        correct: true
        why:
          en: "The cause is the locator, so the fix is the locator."
          ru: "Причина в локаторе — значит, и исправлять нужно локатор."
      - text: { en: "Yes: retries are how you fix flaky tests.", ru: "Да: повторные запуски — способ лечить нестабильные тесты." }
        why:
          en: "These tests aren't flaky: they fail 100% of the time. Retries triple the time to red — and teach the team that red is normal."
          ru: "Эти тесты не флакают: они падают в 100% случаев. Повторы втрое удлиняют путь к красному — и приучают команду, что красный — это нормально."
      - text: { en: "Yes, but make it 5 seconds to be safe.", ru: "Да, но лучше 5 секунд, для надёжности." }
        why:
          en: "A longer wait for an element that doesn't exist is still a failure — just slower, on every run."
          ru: "Более долгое ожидание элемента, которого нет, всё равно заканчивается падением — только медленнее, на каждом прогоне."
      - text: { en: "Delete the 38 tests: they're just noise.", ru: "Удалить эти 38 тестов: это просто шум." }
        why:
          en: "That removes the noise and the protection. The checks are fine; only the locators are stale."
          ru: "Так уйдёт и шум, и защита. Проверки в порядке, устарели только локаторы."
    hints:
      - en: "Would the class `btn` appear if you waited longer?"
        ru: "Появится ли класс `btn`, если подождать подольше?"
      - en: "Fix the cause: how the test finds elements."
        ru: "Исправляй причину — то, как тест ищет элементы."
    explain:
      en: "Waits and retries are about timing — and even there they only hide the problem. A fragile selector after a redesign isn't a timing problem: it points at something that no longer exists, so it fails every time. Only a resilient locator ends the red nights — without hiding real failures."
      ru: "Ожидания и повторы — это про время, и даже там они только прячут проблему. Хрупкий селектор после редизайна — не проблема времени: он указывает на то, чего больше нет, поэтому падает каждый раз. Только устойчивый локатор прекращает красные ночи — и не прячет настоящие падения."

  - id: c5-l2-k7
    kind: pick-locator
    keyPoint: kp-user-facing-resilient
    app: { route: /cart, variant: redesign, state: { cart: [{ id: rose-bouquet, qty: 1 }] } }
    target: "[data-testid='checkout-button']"
    prompt:
      en: "This is the cart after Kai's redesign. Pick the locator for the highlighted button that survives this redesign — and the next one."
      ru: "Это корзина после редизайна Кая. Выбери локатор для подсвеченной кнопки, который переживёт этот редизайн — и следующий."
    options:
      - text: 'page.get_by_role("button", name="Proceed to checkout")'
        correct: true
        why:
          en: "The role and the name are what customers rely on. They didn't change in this redesign and won't change in the next one unless customers see a change too."
          ru: "На роль и имя опираются покупатели. В этом редизайне они не поменялись — и в следующем не поменяются, если только изменение не увидят сами покупатели."
      - text: 'page.locator(".bl_btn__375kd")'
        why:
          en: "Today's generated class — and it matches three elements: “Apply”, “Continue shopping” and this button."
          ru: "Сегодняшний сгенерированный класс — и под него подходят три элемента: «Apply», «Continue shopping» и эта кнопка."
      - text: 'page.locator(".row-actions > button")'
        why:
          en: "The old class name — after the redesign it matches nothing."
          ru: "Старое имя класса — после редизайна под него ничего не подходит."
      - text: 'page.locator("//main/div[last()]/button")'
        why:
          en: "Works today: “the button in the last block of the page”. Add a block below the summary, and it points elsewhere or nowhere."
          ru: "Сегодня работает: «кнопка в последнем блоке страницы». Добавят блок под итогом — и он укажет на другое или в пустоту."
    hints:
      - en: "Two options depend on class names, one on the order of blocks."
        ru: "Два варианта зависят от имён классов, один — от порядка блоков."
      - en: "What would a customer call this button?"
        ru: "Как эту кнопку назвал бы покупатель?"
    explain:
      en: "Role + name describes the button the way a customer finds it. The XPath works today by luck — luck runs out at the next layout change."
      ru: "Роль и имя описывают кнопку так, как её находит покупатель. XPath сегодня работает по везению — а везение кончится при следующем изменении вёрстки."

  - id: c5-l2-k8
    kind: inspect
    keyPoint: kp-layout-breaks
    app: { route: /signup, variant: redesign }
    prompt:
      en: "Petal's signup test fills `page.locator(\"#signup-form > input:nth-child(2)\")` and times out on Kai's redesign. Find the field it was meant for and look at its parent."
      ru: 'Тест регистрации от Petal заполняет `page.locator("#signup-form > input:nth-child(2)")` и падает по таймауту на редизайне Кая. Найди поле, которое имелось в виду, и посмотри на его родителя.'
    target: "#fullName"
    view: dom
    show: [attributes]
    hints:
      - en: 'Open `<form id="signup-form">` in the tree.'
        ru: 'Раскрой в дереве `<form id="signup-form">`.'
      - en: "The first field of the form is “Full name”. In the redesign its label and input share a new parent."
        ru: "Первое поле формы — «Full name». В редизайне у его подписи и поля общий новый родитель."
      - en: "It's `<input id=\"fullName\">` inside the first `<div class=\"bl_field__…\">`."
        ru: 'Это `<input id="fullName">` внутри первого `<div class="bl_field__…">`.'
    explain:
      en: "In the old build the input was the form's 2nd child, right after its label. Now both sit inside `<div class=\"bl_field__2ty9n\">`, so the form has no direct `input` children at all. The label is still linked to the field (`for=\"fullName\"`), so `get_by_label(\"Full name\")` finds it on both builds."
      ru: 'В старой сборке поле было вторым потомком формы, сразу после подписи. Теперь оба лежат внутри `<div class="bl_field__2ty9n">`, и прямых потомков `input` у формы нет вообще. Подпись по-прежнему связана с полем (`for="fullName"`), поэтому `get_by_label("Full name")` находит его на обеих сборках.'
