            ru: 'Сгенерированный класс плюс позиция: «восьмой потомок итогового блока». Добавят строку вроде «Gift wrap» — и он прочитает не то значение. Используй `get_by_test_id("cart-total")`.'
      types: [fragile-locator, hard-wait, wrong-assertion, wrong-data, hallucination]
      hints:
