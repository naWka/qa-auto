      solution: |
        from playwright.sync_api import Page, expect


        def test_user_logs_in_with_remember_me(page: Page):
            page.goto("/login")
            page.get_by_label("Email").fill("anna@bloomly.app")
            page.get_by_label("Password").fill("bloom123")
            page.get_by_role("checkbox", name="Remember me").check()
            page.get_by_role("button", name="Log in").click()
            expect(page.get_by_role("heading", name="Welcome back, Anna!")).to_be_visible()
      checks:
        expect: pass
        static: [noFragile]
        also:
          - app: {}
            expect: pass
      hints:
        - en: "Three lines find elements by position or class. Line 7 already shows the resilient way."
          ru: "Три строки ищут элементы по позиции или классу. Строка 7 уже показывает устойчивый способ."
        - en: "Fields → `get_by_label`. The checkbox and the button have a role and a name."
          ru: "Поля → `get_by_label`. У чекбокса и кнопки есть роль и имя."
        - en: 'Lines 6, 8 and 9: `page.get_by_label("Email")`, `page.get_by_role("checkbox", name="Remember me")`, `page.get_by_role("button", name="Log in")`.'
          ru: 'Строки 6, 8 и 9: `page.get_by_label("Email")`, `page.get_by_role("checkbox", name="Remember me")`, `page.get_by_role("button", name="Log in")`.'
      praise:
        en: "Green on both builds — and every locator reads like a step of TC-523."
        ru: "Зелёный на обеих сборках — и каждый локатор читается как шаг TC-523."
      explain:
        en: "Your locators describe what Anna sees: the Email field, the Remember me checkbox, the Log in button. The redesign's wrappers and classes touch none of that, so the test passes on both builds — and it will fail only if one of those changes for users too."
        ru: "Твои локаторы описывают то, что видит Anna: поле Email, чекбокс Remember me, кнопку Log in. Обёртки и классы редизайна ничего из этого не трогают, поэтому тест проходит на обеих сборках — и упадёт, только если что-то из этого изменится и для пользователей."

  - type: mistakes
    keyPoint: kp-false-alarms
    title: { en: "Quick “fixes” that keep the false alarms coming", ru: "Быстрые «исправления», после которых ложные тревоги возвращаются" }
    items:
      - wrong: 'page.locator(".bl_btn__375kd").click()  # healed'
        right: 'page.get_by_role("button", name="Log in").click()'
        why:
          en: "A generated class name changes with the styles. Copying it fixes today's red and books the next false alarm."
          ru: "Сгенерированное имя класса меняется вместе со стилями. Скопировать его — значит убрать сегодняшний красный и заказать следующую ложную тревогу."
      - wrong: "page.wait_for_timeout(3000)\npage.locator(\".btn\").click()"
        right: 'page.get_by_role("button", name="Log in").click()'
        why:
          en: "A selector that matches nothing fails every time. A wait — or a retry — only makes the red arrive later. Fragile isn't flaky."
          ru: "Селектор, который ничего не находит, падает каждый раз. Ожидание или повторный запуск только откладывают красный. Хрупкий — не значит нестабильный."
      - wrong: 'expect(page.get_by_test_id("order-row").first).to_be_visible()'
        right: 'expect(page.get_by_test_id("order-row")).to_have_count(3)'
        why:
          en: "Fragile is about *how you find* elements, not *what you check*. Fix the locator; keep the assertion as strict as the test case."
          ru: "Хрупкость — про то, *как ищешь* элементы, а не про то, *что проверяешь*. Исправь локатор, а проверку оставь такой же строгой, как в тест-кейсе."
      - wrong: |-
          @pytest.mark.skip(reason="red after the redesign")
          def test_delivered_filter_shows_delivered_orders_only(page: Page):
              ...
        right: |-
          def test_delivered_filter_shows_delivered_orders_only(page: Page):
              page.goto("/orders")
              page.get_by_label("Status").select_option("Delivered")
              expect(page.get_by_test_id("order-row")).to_have_count(3)
        why:
          en: "A skipped test raises no alarms at all — false or real. Muting noisy tests is how real bugs slip through after a red week. Fix the locators instead."
          ru: "Пропущенный тест не поднимает никаких тревог — ни ложных, ни настоящих. Именно так, через отключённые шумные тесты, настоящие баги и проскакивают после красной недели. Лучше исправь локаторы."

  - type: explain
    keyPoint: kp-user-facing-resilient
    prompt:
      en: "In your own words: why did 38 tests go red after Kai's redesign, and what would have kept them green — without making them blind to real bugs?"
      ru: "Своими словами: почему после редизайна Кая покраснели 38 тестов и что сохранило бы их зелёными — но так, чтобы они не ослепли к настоящим багам?"
    model:
      en: "The tests found elements by how the page was built: class names, positions, paths. The redesign changed exactly those things while users saw the same texts and buttons, so the tests failed without a bug — false alarms. Locators that describe what users see — a role and a name, a label, a visible text — or a test id agreed with the developers don't depend on the layout, so they stay green. They still fail when the user's experience changes: a renamed button or a lost role turns them red, and that red is worth reading."
      ru: "Тесты искали элементы по тому, как устроена страница: по именам классов, позициям, путям. Редизайн поменял именно это, а пользователи видели те же тексты и кнопки, поэтому тесты упали без бага — ложные тревоги. Локаторы, которые описывают то, что видит пользователь, — роль и имя, подпись, видимый текст, — или test id, о котором договорились с разработчиками, не зависят от вёрстки, поэтому остаются зелёными. И всё равно падают, когда меняется опыт пользователя: переименованная кнопка или потерянная роль делают их красными, и такой красный стоит читать."

  - type: phrases
    items:
      - context: standup
        en: "After the redesign 38 tests went red, but all of them are false alarms — the locators were tied to CSS classes. Real bugs: zero."
        ru: "После редизайна покраснели 38 тестов, но все они — ложные тревоги — локаторы были привязаны к CSS-классам. Настоящих багов — ноль."
      - context: code-review
        en: 'Line 6 copies a generated class name — it''ll break with the next design-system build. Could you use get_by_label("Promo code") instead?'
        ru: 'В строке 6 скопировано сгенерированное имя класса — оно сломается при следующей сборке дизайн-системы. Можешь использовать get_by_label("Promo code")?'
      - context: chat
        en: "Heads-up: tonight's red run is a locator issue, not a product issue. No need to stop the release."
        ru: "К сведению: сегодняшний красный прогон — проблема локаторов, а не продукта. Останавливать релиз не нужно."
      - context: bug-report
        en: "Not a test issue: after the redesign “Add to cart” is no longer a button, so screen-reader users can't add products."
        ru: "Это не проблема теста: после редизайна «Add to cart» больше не кнопка, и пользователи скринридеров не могут добавлять товары."
        note:
          en: "When a role + name locator fails, check the app before you touch the test."
          ru: "Когда падает локатор по роли и имени, сначала проверь приложение, а потом уже трогай тест."
      - context: prompt
        en: "Replace CSS classes and nth-child paths with get_by_role, get_by_label or get_by_test_id. Keep every assertion as it is."
        ru: "Замени CSS-классы и пути с nth-child на get_by_role, get_by_label или get_by_test_id. Все проверки оставь как есть."
      - context: meeting
        en: "If we keep CSS selectors, every redesign costs us a day of triage — and the team stops trusting red."
        ru: "Если оставим CSS-селекторы, каждый редизайн будет стоить нам дня разбора — и команда перестанет доверять красному."

checkPool:
  - id: c5-l2-k1
    kind: predict
    keyPoint: kp-layout-breaks
    placement: true
    app: { variant: redesign }
    context:
      en: "Kai's redesign: new class names, and every product card now shows the price above the name. Sorting works exactly as before."
      ru: "Редизайн Кая: новые имена классов, а на каждой карточке товара цена теперь над названием. Сортировка работает точно так же, как раньше."
    prompt:
      en: "Will Petal's test pass on the redesign build?"
      ru: "Пройдёт ли тест Petal на сборке с редизайном?"
    code: |
      from playwright.sync_api import Page, expect


      def test_cheapest_product_comes_first(page: Page):
          page.goto("/shop")
          page.get_by_label("Sort by").select_option("Price: low to high")
          expect(page.locator("li:first-child article > h2 + p")).to_have_text("€12.00")
    outcome: fail
    reasons:
      - text:
          en: "Fail: `h2 + p` means “the paragraph right after the name”, and now the price comes before the name."
          ru: "Упадёт: `h2 + p` значит «абзац сразу после названия», а цена теперь идёт перед названием."
        correct: true
      - text:
          en: "Pass: Mint Succulent is still first and still costs €12.00."
          ru: "Пройдёт: Mint Succulent по-прежнему первый и всё так же стоит €12.00."
        why:
          en: "True for shoppers — but the locator describes the order of tags, and that changed."
          ru: "Для покупателя это так, но локатор описывает порядок тегов, а он изменился."
      - text:
          en: "Fail: sorting by price is broken."
          ru: "Упадёт: сортировка по цене сломана."
        why:
          en: "Sorting works. The test just can't find the price."
          ru: "Сортировка работает. Тест просто не может найти цену."
    hints:
      - en: "Read `h2 + p` aloud: which element comes first?"
        ru: "Прочитай `h2 + p` вслух: какой элемент идёт первым?"
      - en: "In the redesign, what comes right after the product name on Mint Succulent's card?"
        ru: "Что в редизайне идёт сразу после названия на карточке Mint Succulent?"
    explain:
      en: "A false alarm in one line: the shop is right, the selector is stale. A test id inside the first card — `get_by_test_id(\"product-price\")` — doesn't care which tag comes first."
      ru: 'Ложная тревога в одну строку: магазин прав, селектор устарел. Локатору по test id внутри первой карточки — `get_by_test_id("product-price")` — всё равно, какой тег идёт первым.'

  - id: c5-l2-k2
