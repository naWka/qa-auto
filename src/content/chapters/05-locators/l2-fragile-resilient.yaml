        en: "Petal fixed the symptom (today's red) and kept the cause (locators tied to styling). The generated names will change again, and the suite will cry wolf again. Note what's fine: the steps, the data and the expected €36.40 match TC-521 — only the way of finding elements is wrong."
        ru: "Petal вылечил симптом (сегодняшний красный) и оставил причину (локаторы, привязанные к стилям). Сгенерированные имена снова поменяются, и набор снова поднимет ложную тревогу. Заметь, что здесь в порядке: шаги, данные и ожидаемые €36.40 совпадают с TC-521 — неправилен только способ искать элементы."

  - type: theory
    keyPoint: kp-false-alarms
    title: { en: "A false alarm costs more than one red test", ru: "Ложная тревога стоит дороже одного красного теста" }
    body:
      - en: "A test that fails without a bug in the app is a [[false positive|false-positive]] — a false alarm. One costs fifteen minutes of triage. Thirty-eight after a redesign cost the team a day."
        ru: "Тест, который падает без бага в приложении, — это [[ложное срабатывание|false-positive]], ложная тревога. Одна стоит пятнадцати минут разбора. Тридцать восемь после редизайна стоят команде целого дня."
      - en: "The bigger cost is trust. After a few red nights the team learns “red means the tests again”: people re-run, skip, stop reading the report. The night a real bug turns a test red, nobody looks. It's the boy who cried wolf — for a whole [[test suite|test-suite]]."
        ru: "Главная цена — доверие. После нескольких красных ночей команда усваивает: «красный — это опять тесты». Люди перезапускают, пропускают, перестают читать отчёт. А в ночь, когда тест покраснеет из-за настоящего бага, никто не посмотрит. Это мальчик, который кричал «Волки!», — только для целого [[набора тестов|test-suite]]."
      - en: "Agents tend to treat the symptom. Petal adds waits and retries — but a fragile selector isn't a [[flaky test|flaky-test]]: it fails every single time, so waiting only delays the red. Or Petal copies today's class names — green until the next build. The real fix is a locator a user would recognize."
        ru: "Агенты обычно лечат симптом. Petal добавляет ожидания и повторные запуски — но хрупкий селектор не [[флаки-тест|flaky-test]]: он падает каждый раз, и ожидание только откладывает красный. Или Petal копирует сегодняшние имена классов — зелёный до следующей сборки. Настоящее исправление — локатор, который узнал бы пользователь."
    mentor:
      en: "In the standup, give two numbers: “Red: 38. Real bugs: 0.” That pair is the best argument for resilient locators."
      ru: "На стендапе называй два числа: «Красных: 38. Настоящих багов: 0». Эта пара — лучший аргумент за устойчивые локаторы."

  - type: task
    task:
      id: c5-l2-t5
      kind: choice
      keyPoint: kp-false-alarms
      context:
        en: "Tuesday's night run on the redesign build: four red tests. These are their error lines from the report."
        ru: "Ночной прогон во вторник на сборке с редизайном: четыре красных теста. Вот их строки с ошибками из отчёта."
      prompt:
        en: "Which failures are false alarms — the app is fine, and the test must change? Pick all that apply."
        ru: "Какие падения — ложные тревоги: приложение в порядке, а менять нужно тест? Выбери все подходящие."
      multi: true
      optionsCode: true
      options:
        - text: 'TimeoutError: Locator.click: Timeout 5000ms exceeded — waiting for locator(".btn")'
          correct: true
          why:
            en: "The class `btn` is gone after the redesign. The button is there; the selector is stale."
            ru: "Класса `btn` после редизайна нет. Кнопка на месте, устарел селектор."
        - text: 'TimeoutError: Locator.fill: Timeout 5000ms exceeded — waiting for locator("#login-form > input:nth-child(3)")'
          correct: true
          why:
            en: "The Email field moved into a wrapper `div`. The field works; the path doesn't."
            ru: "Поле Email переехало в обёртку `div`. Поле работает, а путь — нет."
        - text: 'AssertionError: Locator expected to have text ''€36.40'' — Actual value: €31.50 — waiting for get_by_test_id("cart-total")'
          why:
            en: "The locator found the total — the value is wrong: €35.00 − €3.50 and no €4.90 delivery. A real bug: report it."
            ru: "Локатор нашёл итог, а неверно значение: €35.00 − €3.50 и нет доставки за €4.90. Настоящий баг: заводи баг-репорт."
        - text: 'TimeoutError: Locator.click: Timeout 5000ms exceeded — waiting for get_by_role("button", name="Add to cart")'
          why:
            en: "A role + name locator failing after a redesign means “Add to cart” stopped being a button — screen readers can't use it either. An accessibility bug, not a test problem."
            ru: "Если после редизайна падает локатор по роли и имени, значит, «Add to cart» перестала быть кнопкой — скринридер её тоже не найдёт. Это баг доступности, а не проблема теста."
      hints:
        - en: "For each line, ask: did the test find the element and get a wrong value — or not find it at all?"
          ru: "Про каждую строку спроси: тест нашёл элемент и получил неверное значение — или вообще его не нашёл?"
        - en: "A missing class or path → the test is stale. A wrong value, or a missing role + name → users are affected."
          ru: "Пропал класс или путь → устарел тест. Неверное значение или пропавшие роль и имя → это касается пользователей."
        - en: "The first two are false alarms."
          ru: "Ложные тревоги — первые две."
      praise:
        en: "Two false alarms, one real bug, one accessibility bug — that's the triage the team needs before anyone says “stop the release”."
        ru: "Две ложные тревоги, один настоящий баг и один баг доступности — именно такой разбор нужен команде, прежде чем кто-то скажет «останавливаем релиз»."
      explain:
        en: "Fragile selectors fail with “waiting for locator(…)” on a class or a path — the app is fine. A resilient locator that fails, or an assertion that receives a wrong value, points at something users would see. That's why resilient locators make red worth reading."
        ru: "Хрупкие селекторы падают с «waiting for locator(…)» на классе или пути — приложение в порядке. Упавший устойчивый локатор или проверка с неверным значением указывают на то, что увидели бы пользователи. Поэтому с устойчивыми локаторами красный стоит читать."

