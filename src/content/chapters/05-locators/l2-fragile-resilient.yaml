id: c5-l2
chapter: c5
title: { en: "Fragile vs resilient", ru: "Хрупкие и устойчивые" }
goal:
  en: "Spot fragile CSS and XPath selectors and explain which change in the app will break them."
  ru: "Замечать хрупкие CSS- и XPath-селекторы и объяснять, какое изменение в приложении их сломает."
minutes: 11
keyPoints:
  - id: kp-layout-breaks
    title:
      en: "Selectors tied to layout break on a redesign, not on a bug"
      ru: "Селекторы, привязанные к вёрстке, ломаются от редизайна, а не от бага"
  - id: kp-user-facing-resilient
    title:
      en: "A resilient locator fails only when the user's experience changes"
      ru: "Устойчивый локатор падает, только когда меняется опыт пользователя"
  - id: kp-false-alarms
    title:
      en: "False alarms cost the team its trust in the suite"
      ru: "Ложные тревоги подрывают доверие команды к набору тестов"
terms: [fragile-selector, resilient-locator, css-selector, xpath, locator, false-positive, flaky-test, test-suite]

steps:
  - type: story
    lines:
      - who: sofia
        text:
          en: "Kai's redesign went to staging last night, and now 38 of 120 tests are red. Do we stop the release?"
          ru: "Вчера вечером редизайн Кая выкатили на стейджинг, а теперь красные 38 тестов из 120. Останавливаем релиз?"
      - who: petal
        text:
          en: "I can regenerate all 38 tests in ten minutes!"
          ru: "Я могу перегенерировать все 38 тестов за десять минут!"
      - who: maya
        text:
          en: "Nobody stops or regenerates anything yet. Kai says users see the same texts and buttons. So first we find out what broke — the app or the tests."
          ru: "Пока никто ничего не останавливает и не перегенерирует. Кай говорит, что пользователи видят те же тексты и кнопки. Значит, сначала выясним, что сломалось — приложение или тесты."

  - type: pretest
    intro:
      en: "Quick guess before we start. Wrong answers are fine — they help you remember."
      ru: "Быстрая догадка перед началом. Ошибаться можно — так лучше запоминается."
    items:
      - id: c5-l2-p1
        kind: predict
        keyPoint: kp-layout-breaks
        app: { variant: redesign }
        context:
          en: "Kai's redesign renames every CSS class. On screen the login page looks and works the same."
          ru: "Редизайн Кая переименовывает все CSS-классы. На экране страница входа выглядит и работает так же."
        prompt:
          en: "Will Petal's test pass on the redesign build?"
          ru: "Пройдёт ли тест Petal на сборке с редизайном?"
        code: |
          from playwright.sync_api import Page, expect


          def test_registered_user_can_log_in(page: Page):
              page.goto("/login")
              page.get_by_label("Email").fill("anna@bloomly.app")
              page.get_by_label("Password").fill("bloom123")
              page.locator(".btn").click()
              expect(page.get_by_role("heading", name="Welcome back, Anna!")).to_be_visible()
        outcome: fail
        reasons:
          - text:
              en: "Fail: line 8 looks for the class `btn`, and that class no longer exists — although login itself works."
              ru: "Упадёт: строка 8 ищет класс `btn`, а такого класса больше нет, — хотя сам вход работает."
            correct: true
          - text:
              en: "Pass: the button is still there and still says “Log in”."
              ru: "Пройдёт: кнопка на месте, и на ней всё так же написано «Log in»."
            why:
              en: "It is — but the test doesn't look for “Log in”. It looks for the class, and the class is gone."
              ru: "Да, но тест ищет не «Log in». Он ищет класс, а класса больше нет."
          - text:
              en: "Fail: the redesign broke the login."
              ru: "Упадёт: редизайн сломал вход."
            why:
              en: "Login works: a user can still fill in the form and click “Log in”. Only the test's way of finding the button broke."
              ru: "Вход работает: пользователь всё так же заполняет форму и нажимает «Log in». Сломался только способ, которым тест ищет кнопку."
        hints:
          - en: "Which line depends on a CSS class?"
            ru: "Какая строка зависит от CSS-класса?"
          - en: "After the redesign the button's class is `bl_btn__375kd`. Does `.btn` match it?"
            ru: "После редизайна у кнопки класс `bl_btn__375kd`. Подходит ли под него `.btn`?"
        explain:
          en: "The test fails on the click: `locator(\".btn\")` waits 5 seconds for an element with the class `btn` and finds none. Nothing is wrong for users, so this red is a false alarm. That's what happened to the 38 tests last night."
          ru: 'Тест падает на клике: `locator(".btn")` 5 секунд ждёт элемент с классом `btn` и не находит. Для пользователей всё в порядке, так что этот красный — ложная тревога. Именно это этой ночью и случилось с 38 тестами.'

      - id: c5-l2-p2
        kind: choice
        keyPoint: kp-false-alarms
        prompt:
          en: "For the third night in a row, 38 tests are red after the redesign — and every time the app turned out to be fine. Tonight the suite is red again. What's the biggest risk?"
          ru: "Третью ночь подряд после редизайна красные 38 тестов — и каждый раз приложение оказывалось в порядке. Сегодня набор снова красный. Какой риск самый большой?"
        options:
          - text: { en: "Nobody looks closely anymore — and tonight one of the red tests is a real bug", ru: "Никто уже не смотрит внимательно, а сегодня один из красных тестов — настоящий баг" }
            correct: true
            why:
              en: "False alarms train people to ignore red. That's how a real bug gets through a fully automated regression."
              ru: "Ложные тревоги приучают людей не обращать внимания на красный. Так настоящий баг и проходит через полностью автоматизированную регрессию."
          - text: { en: "The run takes a few minutes longer", ru: "Прогон идёт на несколько минут дольше" }
            why:
              en: "True, but minor. What really wears out is the team's attention."
              ru: "Верно, но это мелочь. По-настоящему изнашивается внимание команды."
          - text: { en: "The tests will start passing on their own", ru: "Тесты сами начнут проходить" }
            why:
              en: "They won't: a selector that matches nothing fails every night until someone changes it."
              ru: "Не начнут: селектор, который ничего не находит, будет падать каждую ночь, пока его не поменяют."
        hints:
          - en: "Think about people, not machines. What does a team learn after three red nights with no bugs?"
            ru: "Думай о людях, а не о машинах. Чему учится команда после трёх красных ночей без багов?"
          - en: "Remember the boy who cried wolf."
            ru: "Вспомни мальчика, который кричал «Волки!»."
        explain:
          en: "Each false alarm costs triage time, but the real price is trust: once “red” means “the tests again”, a real red goes unread."
          ru: "Каждая ложная тревога стоит времени на разбор, но настоящая цена — доверие: когда «красный» значит «опять тесты», настоящий красный никто не читает."

  - type: theory
    keyPoint: kp-layout-breaks
    title: { en: "A fragile selector describes the layout", ru: "Хрупкий селектор описывает вёрстку" }
    body:
      - en: "Look at what a selector actually says. `#login-form > input:nth-child(3)` means “the third child of the login form, if it's an input”. That's a description of the layout, not of the Email field."
        ru: "Посмотри, что на самом деле говорит селектор. `#login-form > input:nth-child(3)` значит «третий потомок формы входа, если это input». Это описание вёрстки, а не поля Email."
      - en: "In a test case you'd never write “click the third button from the left”: one new button, and the step is wrong while the feature still works. A [[fragile selector|fragile-selector]] is that step written in code. It breaks on a redesign, not on a bug."
        ru: "В тест-кейсе ты бы никогда не написал{а|} «нажми третью кнопку слева»: добавят одну кнопку — и шаг неверен, хотя функция работает. [[Хрупкий селектор|fragile-selector]] — это такой шаг, записанный кодом. Он ломается от редизайна, а не от бага."
      - en: "The usual suspects in [[CSS|css-selector]] and [[XPath|xpath]]: **position** (`nth-child`, `li[2]`), **long paths** (`nav > a > span`) and **class names** — worst of all generated ones like `bl_btn__375kd`, where the part after `__` is a hash that changes whenever the styles change."
        ru: "Обычные подозреваемые в [[CSS|css-selector]] и [[XPath|xpath]]: **позиция** (`nth-child`, `li[2]`), **длинные пути** (`nav > a > span`) и **имена классов** — хуже всего сгенерированные, вроде `bl_btn__375kd`: часть после `__` — это хеш, который меняется при любом изменении стилей."
    code: |
      # Tied to layout: each one breaks when the page is rebuilt
      page.locator("li:nth-child(2) .btn")  # position + class
      page.locator("#login-form > input:nth-child(3)")  # path + position
      page.locator(".bl_btn__375kd")  # generated class
      page.locator("//main/form/input[1]")  # XPath by position
    mentor:
      en: "For every selector, ask: “What change would break it?” If the answer is “a designer's change”, it's fragile."
      ru: "Про каждый селектор спрашивай: «Какое изменение его сломает?» Если ответ — «изменение от дизайнера», он хрупкий."

  - type: example
    keyPoint: kp-layout-breaks
    title: { en: "Same check, two ways — run on the redesign", ru: "Одна проверка, два способа — запуск на редизайне" }
    intro:
      en: "Petal's old test and a resilient version of the same check. This run uses Kai's redesign build. Run it, then read the notes."
      ru: "Старый тест Petal и устойчивая версия той же проверки. Этот запуск идёт на сборке с редизайном Кая. Запусти, потом прочитай заметки."
    app: { variant: redesign }
    runnable: true
    code: |
      from playwright.sync_api import Page, expect


      def test_fragile_adds_sunny_tulips_to_the_cart(page: Page):
          page.goto("/shop")
          page.locator("li:nth-child(2) .btn").click()
          expect(page.locator("nav > a:nth-child(3) > .badge")).to_have_text("1")


      def test_resilient_adds_sunny_tulips_to_the_cart(page: Page):
          page.goto("/shop")
          card = page.get_by_test_id("product-card").filter(has_text="Sunny Tulips")
          card.get_by_role("button", name="Add to cart").click()
          expect(page.get_by_test_id("cart-count")).to_have_text("1")
    notes:
      - lines: 6
        text:
          en: "`li:nth-child(2)` = “the second product in the list”: it breaks when the sort order or the catalog changes. `.btn` = the button's look: it breaks when classes are renamed. On the redesign the run times out right here — two ways to break, and neither is a bug."
          ru: "`li:nth-child(2)` = «второй товар в списке»: ломается, когда меняется сортировка или каталог. `.btn` = внешний вид кнопки: ломается, когда переименовывают классы. На редизайне прогон падает по таймауту прямо здесь — два способа сломаться, и ни один из них не баг."
      - lines: 7
        text:
          en: "A path through the menu: `nav` → its third link → the element with the class `badge`. The redesign wrapped the links in a new `div` and renamed the class — two breaks in one line."
          ru: "Путь через меню: `nav` → его третья ссылка → элемент с классом `badge`. Редизайн завернул ссылки в новый `div` и переименовал класс — две поломки в одной строке."
      - lines: [12, 13]
        text:
          en: "The product card that contains the text “Sunny Tulips”, then the button by role and name inside it. Nothing here depends on order, nesting or styling. (`filter` gets its own lesson next.)"
          ru: "Карточка товара, в которой есть текст «Sunny Tulips», а внутри неё — кнопка по роли и имени. Здесь ничего не зависит от порядка, вложенности или стилей. (Про `filter` — отдельный следующий урок.)"
      - lines: 14
        text:
          en: "The counter by its test id. Result: test 1 red, test 2 green — on the same app, where nothing changed for users."
          ru: "Счётчик по его test id. Итог: тест 1 красный, тест 2 зелёный — на одном и том же приложении, где для пользователей ничего не изменилось."

  - type: task
    task:
      id: c5-l2-t1
      kind: match
      keyPoint: kp-layout-breaks
      prompt:
        en: "Match each locator with the change that breaks it."
        ru: "Сопоставь каждый локатор с изменением, которое его сломает."
      pairs:
        - left: 'page.locator(".btn")'
          right: { en: "New design tokens: every CSS class gets a new name", ru: "Новые дизайн-токены: у каждого CSS-класса новое имя" }
        - left: 'page.locator("#login-form > input:nth-child(3)")'
          right: { en: "Each label and its field get wrapped in a new `div`", ru: "Каждую подпись с её полем заворачивают в новый `div`" }
        - left: 'page.locator("//ul/li[2]//button")'
          right: { en: "The “Most popular” order in the shop changes", ru: "Меняется порядок «Most popular» в магазине" }
        - left: 'page.locator("article > h2 + p")'
          right: { en: "The price moves above the product name", ru: "Цена переезжает над названием товара" }
        - left: 'page.get_by_role("button", name="Log in")'
          right: { en: "The button text changes to “Sign in”", ru: "Текст кнопки меняется на «Sign in»" }
      leftCode: true
      hints:
        - en: "Read what each locator relies on: a class, a path, a position, the order of tags — or the button's name."
          ru: "Прочитай, на что опирается каждый локатор: на класс, путь, позицию, порядок тегов — или на имя кнопки."
        - en: "`li[2]` means “the second item”. What can make another product the second one? `h2 + p` means “the paragraph right after the heading”."
          ru: "`li[2]` значит «второй элемент». Что может сделать вторым другой товар? `h2 + p` значит «абзац сразу после заголовка»."
        - en: "Only the last locator relies on something users see — so only a change users notice breaks it."
          ru: "Только последний локатор опирается на то, что видит пользователь, — значит, его ломает только заметное пользователю изменение."
      praise:
        en: "You read each selector as a sentence and found the change behind it — that's the review question in one move."
        ru: "Ты {прочитала|прочитал} каждый селектор как предложение и {нашла|нашёл} изменение, которое за ним стоит, — это и есть вопрос ревью в одно действие."
      explain:
        en: "Every fragile selector has its own weak spot: the class, the nesting, the position, the order of tags. Notice the last pair: the role + name locator breaks only on a change users see too. That's the next idea."
        ru: "У каждого хрупкого селектора своё слабое место: класс, вложенность, позиция, порядок тегов. Обрати внимание на последнюю пару: локатор по роли и имени ломается только от изменения, которое видят и пользователи. Это следующая идея."

  - type: task
    task:
      id: c5-l2-t2
      kind: inspect
      keyPoint: kp-layout-breaks
      app: { route: /shop, variant: redesign }
      prompt:
        en: "This is the shop after Kai's redesign. Petal's test reads prices with `page.locator(\"article > h2 + p\")` — “the paragraph right after the product name”. Find the price of Sunny Tulips and see where it sits now."
        ru: 'Это магазин после редизайна Кая. Тест Petal читает цены через `page.locator("article > h2 + p")` — «абзац сразу после названия товара». Найди цену Sunny Tulips и посмотри, где она теперь.'
      target: "[data-product-id='sunny-tulips'] [data-testid='product-price']"
      view: dom
      show: [attributes]
      hints:
        - en: 'Scroll the page to the Sunny Tulips card (second in the list) and click its price — or open it in the tree: `<div id="results">` → `<ul>` → the second `<li>` → `<article>`.'
          ru: 'Прокрути страницу до карточки Sunny Tulips (вторая в списке) и нажми на её цену — или раскрой её в дереве: `<div id="results">` → `<ul>` → второй `<li>` → `<article>`.'
        - en: 'The price is a `<p>` with `data-testid="product-price"`. Check what comes right before and after it.'
          ru: 'Цена — это `<p>` с `data-testid="product-price"`. Посмотри, что идёт прямо перед ним и после него.'
        - en: "It's `<p … data-testid=\"product-price\">€24.00</p>` — now above `<h2>Sunny Tulips</h2>`."
          ru: 'Это `<p … data-testid="product-price">€24.00</p>` — теперь он выше `<h2>Sunny Tulips</h2>`.'
      praise:
        en: "Found it — and you can see exactly why the old selector misses: same price, new place in the tree."
        ru: "Наш{ла|ёл} — и теперь видно, почему старый селектор промахивается: цена та же, место в дереве новое."
      explain:
        en: "In the old build a card went: image, name (`h2`), price (`p`). The redesign puts the price above the name, so for Sunny Tulips the element right after `h2` is the button — “the `p` after `h2`” is gone. Shoppers see the same card and the same €24.00. The class changed too (`bl_price__…`), but the test id `product-price` didn't — that's what a resilient locator uses."
        ru: "В старой сборке карточка шла так: картинка, название (`h2`), цена (`p`). Редизайн поставил цену над названием, поэтому у Sunny Tulips сразу после `h2` идёт кнопка — «`p` после `h2`» больше нет. Покупатель видит ту же карточку и те же €24.00. Класс тоже поменялся (`bl_price__…`), а test id `product-price` — нет; именно на него и опирается устойчивый локатор."

  - type: theory
    keyPoint: kp-user-facing-resilient
    title: { en: "Resilient means red for the right reason", ru: "Устойчивый — значит красный по правильной причине" }
    body:
      - en: "A [[resilient locator|resilient-locator]] describes what the user sees: a role and a name, a label, a visible text. `get_by_role(\"button\", name=\"Log in\")` is “the Log in button” — exactly how your test case says it. Kai's redesign changed classes and wrappers, not that."
        ru: '[[Устойчивый локатор|resilient-locator]] описывает то, что видит пользователь: роль и имя, подпись, видимый текст. `get_by_role("button", name="Log in")` — это «кнопка Log in», ровно как в твоём тест-кейсе. Редизайн Кая поменял классы и обёртки, но не это.'
      - en: "Resilient doesn't mean “never fails”. If the button is renamed to “Sign in”, the test fails — and it should: users see a new button, so the test case changes too. If the button stops being a button for screen readers, it fails — and that's an accessibility bug worth reporting."
        ru: "Устойчивый не значит «никогда не падает». Если кнопку переименуют в «Sign in», тест упадёт — и правильно: пользователи видят новую кнопку, значит, меняется и тест-кейс. Если кнопка перестанет быть кнопкой для скринридера, тест упадёт — и это баг доступности, о котором стоит сообщить."
      - en: "So the rule: a good [[locator]] fails **only when the user's experience changes**. New classes and wrappers, which only the code sees → green. A new button text or a lost role, which users notice → red."
        ru: "Отсюда правило: хороший [[локатор|locator]] падает, **только когда меняется опыт пользователя**. Новые классы и обёртки, которые видит только код, → зелёный. Новый текст кнопки или потерянная роль, которые замечают пользователи, → красный."
    figure: red-green
    mentor:
      en: "`get_by_test_id` survives a rename too — handy when an element has no good name. But it won't tell you that the button text changed. Choose knowing what you want to catch."
      ru: "`get_by_test_id` переживает и переименование — удобно, когда у элемента нет хорошего имени. Но он не скажет тебе, что текст кнопки изменился. Выбирай, понимая, что именно хочешь поймать."

  - type: task
    task:
      id: c5-l2-t3
      kind: predict
      keyPoint: kp-user-facing-resilient
      app: { variant: redesign }
      context:
        en: "Kai's redesign wrapped each label with its field on the signup form in a new `div` and renamed every class. This form changed more than any other page."
        ru: "Редизайн Кая завернул каждую подпись вместе с её полем в форме регистрации в новый `div` и переименовал все классы. Эта форма поменялась сильнее любой другой страницы."
      prompt:
        en: "Will this test pass on the redesign build?"
        ru: "Пройдёт ли этот тест на сборке с редизайном?"
      code: |
        from playwright.sync_api import Page, expect


        def test_new_customer_can_sign_up(page: Page):
            page.goto("/signup")
            page.get_by_label("Full name").fill("Lena Ferreira")
            page.get_by_label("Email").fill("lena@bloomly.app")
            page.get_by_label("Password").fill("sunflower8")
            page.get_by_label("Country").select_option("Portugal")
            page.get_by_label("I agree to the Terms of Service").check()
            page.get_by_role("button", name="Create account").click()
            expect(page.get_by_role("heading", name="Account created!")).to_be_visible()
      outcome: pass
      reasons:
        - text:
            en: "Pass: every locator uses a label, a role or a name — the wrappers and classes changed none of them."
            ru: "Пройдёт: каждый локатор опирается на подпись, роль или имя — обёртки и классы ничего из этого не поменяли."
          correct: true
        - text:
            en: "Fail: the fields moved into new wrappers, so the locators lose them."
            ru: "Упадёт: поля переехали в новые обёртки, и локаторы их теряют."
          why:
            en: "`get_by_label` follows the link between a label and its field (`for` → `id`), not their position in the tree."
            ru: "`get_by_label` идёт по связи между подписью и её полем (`for` → `id`), а не по их месту в дереве."
        - text:
            en: "Fail: the “Create account” button has a new class."
            ru: "Упадёт: у кнопки «Create account» новый класс."
          why:
            en: "The test never mentions a class. It finds the button by role and name."
            ru: "Тест нигде не упоминает класс. Он находит кнопку по роли и имени."
      hints:
        - en: "Does any locator mention a class, a position or a path?"
          ru: "Упоминает ли хоть один локатор класс, позицию или путь?"
        - en: "`get_by_label` finds a field through its label. Did the redesign change any label text?"
          ru: "`get_by_label` находит поле через его подпись. Поменял ли редизайн текст хоть одной подписи?"
        - en: "None of these locators depends on the layout."
          ru: "Ни один из этих локаторов не зависит от вёрстки."
      praise:
        en: "You trusted the locators for the right reason: they describe the form the way a customer fills it in."
        ru: "Ты {доверилась|доверился} локаторам по правильной причине: они описывают форму так, как её заполняет покупатель."
      explain:
        en: "The signup form got four new wrappers and new classes everywhere — and the test didn't notice, because it never relied on them. That's what resilient means in practice: green on a change users don't care about."
        ru: "Форма регистрации получила четыре новые обёртки и новые классы повсюду — а тест ничего не заметил, потому что никогда на них не опирался. Вот что значит «устойчивый» на практике: зелёный при изменении, которое пользователям безразлично."

  - type: task
    task:
