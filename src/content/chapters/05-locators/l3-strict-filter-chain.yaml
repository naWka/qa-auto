            en: "The test is already green ✅ — I'm not sure what to change. Shall I leave it as it is?"
            ru: "Тест и так зелёный ✅ — не понимаю, что менять. Оставить как есть?"
          code: |
            import { test, expect } from '@playwright/test';

            test('remove Sunny Tulips from the cart', async ({ page }) => {
              await page.goto('/cart');
              await page.getByRole('button', { name: 'Remove' }).first().click();
              await expect(page.getByTestId('cart-row')).toHaveCount(1);
              await expect(page.getByTestId('toast')).toContainText('removed from cart');
            });
      missing:
        row:
          en: "Without the row block Petal kept `.first()`: the test removes Rose Bouquet itself and then complains that it's gone. It would be red on a healthy app too — a false alarm, not a bug report."
          ru: "Без блока про строку Petal оставил `.first()`: тест сам удаляет Rose Bouquet и потом жалуется, что его нет. Он был бы красным и на исправном приложении — это ложная тревога, а не баг-репорт."
        expected:
          en: "Without the expected result Petal kept the old checks: one row and a toast. That's green on the buggy build — one row is left either way."
          ru: "Без ожидаемого результата Petal оставил старые проверки: одна строка и уведомление. На сборке с багом это зелёный тест — одна строка остаётся в любом случае."
      checks:
        expect: fail
        static:
          - rule: notRegex
            value: '\.(first|last|nth)\('
        also:
          - app: { state: { cart: [{ id: rose-bouquet, qty: 1 }, { id: sunny-tulips, qty: 1 }] } }
            expect: pass
      hints:
        - en: "Two things are missing in the current test: *which* row, and *what* should stay."
          ru: "В текущем тесте не хватает двух вещей: *какая* строка и *что* должно остаться."
        - en: "One block sounds helpful but turns an honest red test into a lie. Which one?"
          ru: "Один блок звучит полезно, но превращает честный красный тест в ложь. Какой?"
        - en: "Take the row block and the expected-result block. Leave out “adjust the assertions”."
          ru: "Возьми блок про строку и блок с ожидаемым результатом. «Подправь проверки» не бери."
      praise:
        en: "A red test that points straight at a real bug — and you didn't let Petal “fix” it back to green."
        ru: "Красный тест, который указывает прямо на настоящий баг, — и ты не дал{а|} Petal «починить» его обратно в зелёный."
      explain:
        en: "Red is the right result here: the locator names the Sunny Tulips row, the assertion names what should stay, and the app removed the wrong row. That's a bug report, not a broken test. Notice the two traps: without the row block Petal kept `.first()` and raised a false alarm; with “adjust the assertions” Petal rewrote the expected result to match the bug. Expected results come from the test case, never from the screen."
        ru: "Красный здесь — правильный результат: локатор называет строку Sunny Tulips, проверка называет, что должно остаться, а приложение удалило не ту строку. Это баг-репорт, а не сломанный тест. Обрати внимание на две ловушки: без блока про строку Petal оставил `.first()` и поднял ложную тревогу; с «подправь проверки» Petal переписал ожидаемый результат под баг. Ожидаемый результат берётся из тест-кейса, а не с экрана."

  - type: mistakes
    title: { en: "Locator shortcuts (often the agent's)", ru: "Уловки с локаторами (часто от агента)" }
    items:
      - wrong: "await page.getByRole('button', { name: 'Add to cart' }).first().click();"
        right: "await page.getByTestId('product-card').filter({ hasText: 'Sunny Tulips' }).getByRole('button', { name: 'Add to cart' }).click();"
        why:
          en: "`.first()` picks by position — Rose Bouquet today. The test case picks by product."
          ru: "`.first()` выбирает по позиции — сегодня это Rose Bouquet. Тест-кейс выбирает по товару."
      - wrong: "await page.getByRole('button', { name: 'Add to cart' }).nth(2).click(); // Sunny Tulips, 2nd card"
        right: "await page.getByTestId('product-card').filter({ hasText: 'Sunny Tulips' }).getByRole('button', { name: 'Add to cart' }).click();"
        why:
          en: "`nth` counts from zero: `nth(2)` is the third card, Lavender Pot. And any new product or sort order moves it again."
          ru: "`nth` считает с нуля: `nth(2)` — третья карточка, Lavender Pot. А любой новый товар или другая сортировка снова её сдвинут."
      - wrong: "await expect(page.getByTestId('order-row').filter({ hasText: 'Rose Bouquet' })).toContainText('Delivered');"
        right: "await expect(page.getByTestId('order-row').filter({ hasText: '#1042' })).toContainText('Delivered');"
        why:
          en: "Two of Anna's orders contain Rose Bouquet — strict mode again. Filter by what is unique: the order number."
          ru: "Rose Bouquet есть в двух заказах Anna — снова строгий режим. Фильтруй по уникальному: по номеру заказа."
      - wrong: "await page.getByText('Log in').click();"
        right: "await page.getByRole('button', { name: 'Log in' }).click();"
        why:
          en: "Not every strict mode error needs a filter. Sometimes a more specific getBy* is enough: there is only one *button* called “Log in”."
          ru: "Не каждой ошибке строгого режима нужен фильтр. Иногда хватает более точного getBy*: *кнопка* «Log in» на странице одна."

  - type: explain
    keyPoint: kp-strict-mode
    prompt:
      en: "Petal fixed a strict mode violation with `.first()`. In your own words: what does strict mode protect you from, and what would you write in the review?"
      ru: "Petal исправил нарушение строгого режима через `.first()`. Своими словами: от чего тебя защищает строгий режим и что ты напишешь в ревью?"
    model:
      en: "Strict mode stops the test when a locator matches more than one element, so the test never acts on a guess. `.first()` silences that question instead of answering it: the test now picks by position, can click the wrong product, and can't notice bugs like “Remove deletes the wrong row”. In the review I'd write: “Line 5: `.first()` hides which product we add. TC-541 says Sunny Tulips — please filter the card: `getByTestId('product-card').filter({ hasText: 'Sunny Tulips' }).getByRole('button', { name: 'Add to cart' })`.” `.first()` is fine only when the position itself is the requirement, like “the newest order is on top”."
      ru: "Строгий режим останавливает тест, когда локатор находит больше одного элемента, поэтому тест никогда не действует наугад. `.first()` глушит этот вопрос вместо того, чтобы на него ответить: тест выбирает по позиции, может нажать не тот товар и не заметит баги вроде «Remove удаляет не ту строку». В ревью я бы написал{а|}: «Line 5: `.first()` hides which product we add. TC-541 says Sunny Tulips — please filter the card: `getByTestId('product-card').filter({ hasText: 'Sunny Tulips' }).getByRole('button', { name: 'Add to cart' })`.» `.first()` уместен, только когда сама позиция и есть требование, например «самый новый заказ — сверху»."

  - type: phrases
    items:
      - context: code-review
        en: "Line 5: .first() hides which product we add. Could you filter the card by 'Sunny Tulips' instead?"
        ru: "Строка 5: .first() прячет, какой товар мы добавляем. Можешь вместо этого отфильтровать карточку по 'Sunny Tulips'?"
        note:
          en: "Name the line, the problem and the fix — the same mini bug report as in chapter 2."
          ru: "Назови строку, проблему и исправление — тот же мини-баг-репорт, что во второй главе."
      - context: chat
        en: "The test fails with a strict mode violation: the locator matches six 'Add to cart' buttons. I'll narrow it down to the right card."
        ru: "Тест падает с нарушением строгого режима: локатор находит шесть кнопок 'Add to cart'. Уточню его до нужной карточки."
      - context: prompt
        en: "Don't silence strict mode with .first() or .nth(). Find the container by its text, then the element inside it."
        ru: "Не глуши строгий режим через .first() или .nth(). Найди контейнер по тексту, потом элемент внутри него."
        note:
          en: "A good line for your project rules file — more on that in the next lesson."
          ru: "Хорошая строка для файла правил проекта — подробнее в следующем уроке."
      - context: bug-report
        en: "Steps: in a cart with Rose Bouquet and Sunny Tulips, click 'Remove' in the Sunny Tulips row. Actual: Rose Bouquet is removed. Expected: Sunny Tulips is removed."
        ru: "Шаги: в корзине с Rose Bouquet и Sunny Tulips нажать 'Remove' в строке Sunny Tulips. Фактически: удаляется Rose Bouquet. Ожидается: удаляется Sunny Tulips."
      - context: standup
        en: "I replaced the .nth() locators in our cart tests with row filters. One of the rewritten tests caught the 'Remove' bug right away."
        ru: "Я заменил{а|} локаторы с .nth() в тестах корзины на фильтры по строкам. Один из переписанных тестов сразу поймал баг с 'Remove'."

checkPool:
  - id: c5-l3-k1
    kind: predict
    keyPoint: kp-strict-mode
    placement: true
    prompt:
      en: "Will this test pass or fail?"
      ru: "Этот тест пройдёт или упадёт?"
    code: |
      import { test, expect } from '@playwright/test';

      test('home page links to the shop', async ({ page }) => {
        await page.goto('/');
        await page.getByRole('link', { name: 'Shop' }).click();
        await expect(page).toHaveURL('/shop');
      });
    outcome: fail
    reasons:
      - text:
          en: "Fail: a name matches by part, so both the menu link “Shop” and the “Shop now” link fit — strict mode stops the click."
          ru: "Упадёт: имя совпадает по части, поэтому подходят и ссылка «Shop» в меню, и ссылка «Shop now» — строгий режим останавливает клик."
        correct: true
      - text:
          en: "Pass: there is a “Shop” link in the menu."
          ru: "Пройдёт: в меню есть ссылка «Shop»."
        why:
          en: "There is — and one more: “Shop now” on the home page. A name matches by part unless you add `exact: true`."
          ru: "Есть — и ещё одна: «Shop now» на главной. Имя совпадает по части, если не добавить `exact: true`."
      - text:
          en: "Fail: the home page has no link to the shop."
          ru: "Упадёт: на главной нет ссылки на магазин."
        why:
          en: "It has two — that's the problem."
          ru: "Их две — в этом и проблема."
    hints:
      - en: "Which links on the home page have “Shop” in their name?"
        ru: "У каких ссылок на главной в имени есть «Shop»?"
      - en: "By default a name matches by part, in any letter case."
        ru: "По умолчанию имя совпадает по части и без учёта регистра."
    explain:
      en: "`{ name: 'Shop' }` matches “Shop” and “Shop now”. Two ways out: `{ name: 'Shop', exact: true }`, or a chain that names the container: `page.getByRole('navigation', { name: 'Main' }).getByRole('link', { name: 'Shop' })`."
      ru: "`{ name: 'Shop' }` подходит и к «Shop», и к «Shop now». Два выхода: `{ name: 'Shop', exact: true }` или цепочка, которая называет контейнер: `page.getByRole('navigation', { name: 'Main' }).getByRole('link', { name: 'Shop' })`."

  - id: c5-l3-k2
    kind: choice
    keyPoint: kp-strict-mode
    multi: true
    context:
      en: "The shop page has loaded all six products."
      ru: "Страница магазина загрузила все шесть товаров."
    prompt:
      en: "Which lines stop with a strict mode violation? Pick all that apply."
      ru: "Какие строки остановятся с нарушением строгого режима? Выбери все подходящие."
    optionsCode: true
    options:
      - text: "await expect(page.getByTestId('product-card')).toHaveCount(6);"
        why:
          en: "Counting is about many elements — strict mode doesn't apply."
          ru: "Подсчёт — про много элементов, строгий режим к нему не относится."
      - text: "await expect(page.getByTestId('product-price')).toHaveText('€35.00');"
        correct: true
        why:
          en: "Six cards, six prices. To check Rose Bouquet's price, filter the card first."
          ru: "Шесть карточек — шесть цен. Чтобы проверить цену Rose Bouquet, сначала отфильтруй карточку."
      - text: "await expect(page.getByRole('button', { name: 'Add to cart' })).toBeEnabled();"
        correct: true
        why:
          en: "Six buttons. Assertions need exactly one element too, not only clicks."
          ru: "Шесть кнопок. Ровно один элемент нужен не только кликам, но и проверкам."
      - text: "await expect(page.getByText('Out of stock')).toBeVisible();"
        why:
          en: "Only the White Orchid card says it — one element."
          ru: "Это написано только на карточке White Orchid — один элемент."
      - text: "await page.getByLabel('Search').fill('rose');"
        why:
          en: "There is one search field."
          ru: "Поле поиска одно."
    hints:
      - en: "For each locator, count the matches on the shop page."
        ru: "Для каждого локатора посчитай совпадения на странице магазина."
      - en: "Something that every card has → six matches. But one matcher is fine with many."
        ru: "То, что есть на каждой карточке, — шесть совпадений. Но одному матчеру много элементов не мешает."
      - en: "The price line and the button line."
        ru: "Строка с ценой и строка с кнопкой."
    explain:
      en: "Strict mode applies to actions *and* to assertions about one element (`toHaveText`, `toBeEnabled`, `toBeVisible`…). Anything that repeats on every card gives six matches; `toHaveCount` is the exception because counting needs many."
      ru: "Строгий режим действует на действия *и* на проверки одного элемента (`toHaveText`, `toBeEnabled`, `toBeVisible`…). Всё, что повторяется на каждой карточке, даёт шесть совпадений; `toHaveCount` — исключение, потому что для подсчёта нужно много."

  - id: c5-l3-k3
    kind: pick-locator
    keyPoint: kp-filter-chaining
    app:
      route: /cart
      state: { cart: [{ id: rose-bouquet, qty: 1 }, { id: sunny-tulips, qty: 1 }, { id: lavender-pot, qty: 1 }] }
    target: "tr[data-id='lavender-pot'] [data-testid='remove-item']"
    prompt:
      en: "The cart has Rose Bouquet, Sunny Tulips and Lavender Pot. Pick the locator for “Remove” in the Lavender Pot row."
      ru: "В корзине Rose Bouquet, Sunny Tulips и Lavender Pot. Выбери локатор для «Remove» в строке Lavender Pot."
    options:
      - text: "page.getByRole('row').filter({ hasText: 'Lavender Pot' }).getByRole('button', { name: 'Remove' })"
        correct: true
        why:
          en: "The row that contains “Lavender Pot”, then the button inside it. Exactly one element, whatever the order of rows."
          ru: "Строка, где есть «Lavender Pot», потом кнопка внутри неё. Ровно один элемент при любом порядке строк."
      - text: "page.getByRole('button', { name: 'Remove' }).nth(3)"
        why:
          en: "`nth` counts from zero: the third row is `nth(2)`, so `nth(3)` finds nothing. And a position isn't a product anyway."
          ru: "`nth` считает с нуля: третья строка — это `nth(2)`, так что `nth(3)` не найдёт ничего. Да и позиция — это не товар."
      - text: "page.getByRole('button', { name: 'Remove Lavender Pot' })"
        why:
          en: "The − and + buttons carry product names (“Increase Lavender Pot”), but “Remove” doesn't: it's just “Remove” in every row. This finds nothing."
          ru: "У кнопок − и + в имени есть товар («Increase Lavender Pot»), а у «Remove» — нет: в каждой строке она просто «Remove». Не найдёт ничего."
      - text: "page.getByTestId('remove-item').last()"
        why:
          en: "Lavender Pot is last today. Add one more product, and this removes that one instead."
          ru: "Сегодня Lavender Pot последний. Добавь ещё один товар — и удалится уже он."
    hints:
      - en: "Which option names the row by its product?"
        ru: "Какой вариант называет строку по товару?"
      - en: "Check the accessible name of “Remove”: does it include the product?"
        ru: "Проверь доступное имя «Remove»: есть ли в нём товар?"
    explain:
      en: "Row → filter → button: the same chain as for product cards. It doesn't depend on how many rows there are or in which order."
      ru: "Строка → filter → кнопка: та же цепочка, что и для карточек товаров. Она не зависит от того, сколько строк и в каком порядке."

  - id: c5-l3-k4
    kind: fill
    keyPoint: kp-filter-chaining
    placement: true
    app: { state: { user: anna@bloomly.app } }
    testCase:
      id: TC-544
      title: Order #1041 is shipped
      preconditions: ["Anna is logged in"]
      steps:
        - { action: "Open /orders", expected: "Order #1041 has the status \"Shipped\"" }
    prompt:
      en: "Type the two missing words: keep only the row of order #1041."
      ru: "Впиши два пропущенных слова: оставь только строку заказа #1041."
    code: |
      import { test, expect } from '@playwright/test';

      test('order #1041 is shipped', async ({ page }) => {
        await page.goto('/orders');
        const order = page.getByTestId('order-row').___({ ___: '#1041' });
        await expect(order).toContainText('Shipped');
      });
    blanks:
      - { answers: [filter] }
      - { answers: [hasText] }
    checks: { expect: pass }
    hints:
      - en: "Six order rows → one: which locator method keeps only some of them?"
        ru: "Шесть строк заказов → одна: какой метод локатора оставляет только часть из них?"
      - en: "The option for “contains this text”."
        ru: "Опция для «содержит этот текст»."
      - en: "The answer: filter, hasText."
        ru: "Ответ: filter, hasText."
    explain:
      en: "`filter({ hasText: '#1041' })` keeps the one row with that order number, and `toContainText` checks its status. The order number is unique; product names are not (Rose Bouquet is in two orders)."
      ru: "`filter({ hasText: '#1041' })` оставляет одну строку с этим номером заказа, а `toContainText` проверяет её статус. Номер заказа уникален, а названия товаров — нет (Rose Bouquet есть в двух заказах)."

  - id: c5-l3-k5
    kind: review
    keyPoint: kp-first-nth-red-flag
    app: { state: { user: anna@bloomly.app } }
    prompt:
      en: "Review Petal's test for TC-545. Flag each problem line and pick the issue type."
      ru: "Сделай ревью теста Petal для TC-545. Отметь каждую проблемную строку и выбери тип проблемы."
    testCase:
      id: TC-545
      title: Cancelled order is marked as cancelled
      preconditions: ["Anna is logged in"]
      steps:
        - { action: "Open /orders", expected: "Order #1038 has the status \"Cancelled\"" }
    code: |
      import { test, expect } from '@playwright/test';

      test('cancelled order is marked Cancelled', async ({ page }) => {
        await page.goto('/orders');
        await page.waitForTimeout(1000);
        const order = page.getByTestId('order-row').nth(4);
        await expect(order).toContainText('Cancelled');
      });
    issues:
      - line: 5
        type: hard-wait
        note:
          en: "A fixed second on every run. `toContainText` already waits for the orders to load."
          ru: "Фиксированная секунда на каждом прогоне. `toContainText` и так ждёт загрузки заказов."
      - line: 6
        type: fragile-locator
        note:
          en: "`.nth(4)` is #1038 only while Anna has exactly these orders, newest first. Her next order (#1043) shifts every row, and the test checks #1039 — “Delivered”, red for no reason. Use `.filter({ hasText: '#1038' })`."
          ru: "`.nth(4)` — это #1038, только пока у Anna ровно эти заказы, от новых к старым. Следующий заказ (#1043) сдвинет все строки, и тест проверит #1039 — «Delivered», красный без причины. Используй `.filter({ hasText: '#1038' })`."
    types: [hard-wait, fragile-locator, wrong-data, weak-assertion, missing-await, hallucination]
    hints:
      - en: "The test is green today. Ask the `.nth()`: which order, and why that one?"
        ru: "Сегодня тест зелёный. Спроси у `.nth()`: какой заказ и почему этот?"
      - en: "What happens to row 5 when a new order appears on top?"
        ru: "Что станет с пятой строкой, когда сверху появится новый заказ?"
      - en: "Lines 5 and 6."
        ru: "Строки 5 и 6."
    explain:
      en: "The case is about order #1038, so the locator should say #1038. A position-based locator turns into a false alarm the moment the data changes — and new orders are the most normal change there is."
      ru: "Кейс про заказ #1038, значит, и локатор должен говорить #1038. Локатор по позиции превращается в ложную тревогу, как только меняются данные, — а новые заказы — самое обычное изменение."

  - id: c5-l3-k6
    kind: choice
    keyPoint: kp-first-nth-red-flag
    context:
      en: "TC-546: Anna's orders are sorted newest first — the top row is #1042. While tidying up, Petal changed the assertion."
      ru: "TC-546: заказы Anna отсортированы от новых к старым — верхняя строка #1042. Наводя порядок, Petal поменял проверку."
    prompt:
      en: "Approve or request changes?"
      ru: "Одобрить или запросить правки?"
    diff:
      before: |
        await expect(page.getByTestId('order-row').filter({ hasText: '#1042' })).toBeVisible();
      after: |
        await expect(page.getByTestId('order-row').first()).toContainText('#1042');
    options:
      - text: { en: "Approve: here the position is the requirement — “newest first” means #1042 must be the *first* row.", ru: "Одобрить: здесь позиция и есть требование — «новые сверху» значит, что #1042 должен быть *первой* строкой." }
        correct: true
        why:
          en: "The old line passed wherever #1042 was in the table. `.first()` checks exactly what the case is about."
          ru: "Старая строка проходила, где бы ни стоял #1042 в таблице. `.first()` проверяет ровно то, о чём кейс."
      - text: { en: "Request changes: `.first()` in AI code is always wrong.", ru: "Запросить правки: `.first()` в коде агента всегда неправильный." }
        why:
          en: "A red flag means “ask why”, not “always reject”. Here the answer to “why the first one?” is the requirement itself."
          ru: "Тревожный знак значит «спроси почему», а не «всегда отклоняй». Здесь ответ на «почему первый?» — само требование."
      - text: { en: "Request changes: the old filter was better because it doesn't depend on the order.", ru: "Запросить правки: старый фильтр был лучше, потому что не зависит от порядка." }
        why:
          en: "Not depending on order is good — unless order is what you test. The old line would stay green if the sorting broke."
          ru: "Не зависеть от порядка — хорошо, если только порядок не то, что ты проверяешь. Старая строка осталась бы зелёной, даже если бы сортировка сломалась."
      - text: { en: "Request changes: use `.nth(0)` instead of `.first()`.", ru: "Запросить правки: использовать `.nth(0)` вместо `.first()`." }
        why:
          en: "Same thing, just harder to read."
          ru: "То же самое, только читается хуже."
    hints:
      - en: "Ask the review question: which one, and why that one?"
        ru: "Задай вопрос ревью: какой именно и почему этот?"
      - en: "What exactly does TC-546 check — that #1042 exists, or where it is?"
        ru: "Что именно проверяет TC-546 — что #1042 есть или где он стоит?"
    explain:
      en: "`.first()` is a red flag when it hides *which product*. When the test case is about *order* — newest first, sorting by price — the position is the expected result, and `.first()` says it out loud."
      ru: "`.first()` — тревожный знак, когда он прячет, *какой товар*. Когда тест-кейс про *порядок* — новые сверху, сортировка по цене, — позиция и есть ожидаемый результат, и `.first()` говорит об этом прямо."

  - id: c5-l3-k7
    kind: find-bug
    keyPoint: kp-filter-chaining
    app:
      bugs: [remove-wrong-item]
      state: { cart: [{ id: rose-bouquet, qty: 1 }, { id: sunny-tulips, qty: 1 }, { id: lavender-pot, qty: 1 }] }
    context:
      en: "Kai's build still has the “Remove” bug. Petal's test for TC-547 is green on it."
      ru: "В сборке Кая всё ещё баг с «Remove». Тест Petal для TC-547 на ней зелёный."
    prompt:
      en: "Rewrite the test: remove the item in the Lavender Pot row and check the expected result. On this build it should go red."
      ru: "Перепиши тест: удали товар в строке Lavender Pot и проверь ожидаемый результат. На этой сборке он должен покраснеть."
    testCase:
      id: TC-547
      title: Remove Lavender Pot from the cart
      preconditions: ["Cart has 1 Rose Bouquet, 1 Sunny Tulips and 1 Lavender Pot"]
      steps:
        - { action: "Open /cart" }
        - { action: "Click \"Remove\" in the Lavender Pot row", expected: "No Lavender Pot row; total €59.00 (free delivery)" }
    starter: |
      import { test, expect } from '@playwright/test';

      test('remove Lavender Pot from the cart', async ({ page }) => {
        await page.goto('/cart');
        await page.getByRole('button', { name: 'Remove' }).last().click();
        await expect(page.getByTestId('cart-row')).toHaveCount(2);
        await expect(page.getByTestId('toast')).toBeVisible();
      });
    solution: |
      import { test, expect } from '@playwright/test';

      test('remove Lavender Pot from the cart', async ({ page }) => {
        await page.goto('/cart');
        const lavender = page.getByRole('row').filter({ hasText: 'Lavender Pot' });
        await lavender.getByRole('button', { name: 'Remove' }).click();
        await expect(page.getByRole('row').filter({ hasText: 'Lavender Pot' })).toHaveCount(0);
        await expect(page.getByTestId('cart-total')).toHaveText('€59.00');
      });
    checks:
      expect: fail
      static:
        - rule: notRegex
          value: '\.(first|last|nth)\('
          message:
            en: "Name the row instead of its position: filter the rows by 'Lavender Pot'."
            ru: "Назови строку, а не её позицию: отфильтруй строки по 'Lavender Pot'."
      also:
        - app: { state: { cart: [{ id: rose-bouquet, qty: 1 }, { id: sunny-tulips, qty: 1 }, { id: lavender-pot, qty: 1 }] } }
          expect: pass
    hints:
      - en: "Two changes: the locator (which row?) and the assertions (what should the cart look like?)."
        ru: "Два изменения: локатор (какая строка?) и проверки (какой должна стать корзина?)."
      - en: "Click Remove inside `page.getByRole('row').filter({ hasText: 'Lavender Pot' })`, then check that no Lavender Pot row is left and the total from the case."
        ru: "Нажми Remove внутри `page.getByRole('row').filter({ hasText: 'Lavender Pot' })`, потом проверь, что строки Lavender Pot не осталось, и итог из кейса."
      - en: "`await expect(page.getByRole('row').filter({ hasText: 'Lavender Pot' })).toHaveCount(0);` and `await expect(page.getByTestId('cart-total')).toHaveText('€59.00');`"
        ru: "`await expect(page.getByRole('row').filter({ hasText: 'Lavender Pot' })).toHaveCount(0);` и `await expect(page.getByTestId('cart-total')).toHaveText('€59.00');`"
    explain:
      en: "On the buggy build the click in the Lavender Pot row deletes Rose Bouquet, so the Lavender Pot row is still there and the total is €46.90 instead of €59.00 — red. On a fixed build the same test is green. The old test couldn't see any of it: `.last()` doesn't say which product, and “2 rows + a toast” is true whichever row disappears."
      ru: "На сборке с багом клик в строке Lavender Pot удаляет Rose Bouquet, поэтому строка Lavender Pot остаётся, а итог — €46.90 вместо €59.00: красный. На исправленной сборке тот же тест зелёный. Старый тест ничего этого не видел: `.last()` не говорит, какой товар, а «2 строки + уведомление» верно, какая бы строка ни исчезла."

  - id: c5-l3-k8
    kind: inspect
    keyPoint: kp-first-nth-red-flag
    app: { route: /shop }
    context:
      en: "Petal: “For TC-541 I used `page.getByRole('button', { name: 'Add to cart' }).nth(2)` — Sunny Tulips is the second card.”"
      ru: "Petal: «Для TC-541 я использовал `page.getByRole('button', { name: 'Add to cart' }).nth(2)` — Sunny Tulips ведь вторая карточка»."
    prompt:
      en: "Click the element this locator really points to."
      ru: "Нажми на элемент, на который этот локатор указывает на самом деле."
    target: "button[data-id='lavender-pot']"
    view: both
    show: [role, name]
    hints:
      - en: "`nth` counts from zero: `nth(0)` is the first “Add to cart”."
        ru: "`nth` считает с нуля: `nth(0)` — первая «Add to cart»."
      - en: "So `nth(2)` is the third button in page order."
        ru: "Значит, `nth(2)` — третья кнопка по порядку на странице."
      - en: "The third card is Lavender Pot — click its button."
        ru: "Третья карточка — Lavender Pot. Нажми на её кнопку."
    praise:
      en: "Right — Lavender Pot, not Sunny Tulips. You counted the way the code counts."
      ru: "Верно — Lavender Pot, а не Sunny Tulips. Ты посчитал{а|} так, как считает код."
    explain:
      en: "Petal counted from one; `nth` counts from zero. But the real fix isn't a different number — it's `filter({ hasText: 'Sunny Tulips' })`, which can't be miscounted and doesn't move when the order of the cards changes."
      ru: "Petal считал с единицы, а `nth` считает с нуля. Но настоящее исправление — не другое число, а `filter({ hasText: 'Sunny Tulips' })`: его нельзя посчитать неправильно, и он не съедет, когда поменяется порядок карточек."
