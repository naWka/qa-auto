id: c5-l3
chapter: c5
title: { en: "Strict mode, filter and chaining", ru: "Строгий режим, filter и цепочки" }
goal:
  en: "Fix a strict mode violation by narrowing the locator — for example, the right \"Add to cart\" among six product cards."
  ru: "Исправлять нарушение строгого режима, сужая локатор, — например, найти нужную кнопку «Add to cart» среди шести карточек товаров."
minutes: 12
keyPoints:
  - id: kp-strict-mode
    title: { en: "Strict mode: two matches means stop, not guess", ru: "Строгий режим: два совпадения — это стоп, а не угадывание" }
  - id: kp-filter-chaining
    title: { en: "filter narrows a list, chaining searches inside", ru: "filter сужает список, цепочка ищет внутри" }
  - id: kp-first-nth-red-flag
    title: { en: "first() and nth() hide “which one?”", ru: "first() и nth() прячут вопрос «какой именно?»" }
terms: [strict-mode, filter, chaining, locator, element, error-message, code-review]

steps:
  - type: story
    lines:
      - who: petal
        text:
          en: "Strict mode violation again — six “Add to cart” buttons on the shop page. Fixed it: I added `.first()` everywhere. All green!"
          ru: "Опять нарушение строгого режима — шесть кнопок «Add to cart» на странице магазина. Я починил: везде добавил `.first()`. Всё зелёное!"
      - who: maya
        text:
          en: "Green, yes. But TC-541 adds Sunny Tulips, and `.first()` adds Rose Bouquet — every single time. Playwright asked “which one?”, and Petal answered “whichever comes first”."
          ru: "Зелёное, да. Но TC-541 добавляет Sunny Tulips, а `.first()` добавляет Rose Bouquet — каждый раз. Playwright спросил «какую именно?», а Petal ответил «ту, что первая»."
      - who: kai
        text:
          en: "And next sprint the shop gets a “New in” sort. Then “first” is a different flower every week."
          ru: "А в следующем спринте в магазине появится сортировка «New in». Тогда «первой» каждую неделю будет новый цветок."

  - type: pretest
    intro:
      en: "Quick guess before we start. Wrong answers are fine — they help you remember."
      ru: "Быстрая догадка перед стартом. Ошибаться можно — так лучше запоминается."
    items:
      - id: c5-l3-p1
        kind: predict
        keyPoint: kp-strict-mode
        prompt:
          en: "The login page opens normally. Will this test pass or fail?"
          ru: "Страница входа открывается как обычно. Этот тест пройдёт или упадёт?"
        code: |
          import { test, expect } from '@playwright/test';

          test('login page shows "Log in"', async ({ page }) => {
            await page.goto('/login');
            await expect(page.getByText('Log in')).toBeVisible();
          });
        outcome: fail
        reasons:
          - text:
              en: "Fail: “Log in” is written on three elements — the menu link, the heading and the button. Playwright won't guess which one to check."
              ru: "Упадёт: «Log in» написано на трёх элементах — ссылке в меню, заголовке и кнопке. Playwright не станет угадывать, какой из них проверять."
            correct: true
          - text:
              en: "Pass: the text is on the page, and it's visible."
              ru: "Пройдёт: текст есть на странице, и он виден."
            why:
              en: "It is visible — three times. That's exactly the problem."
              ru: "Он виден — трижды. В этом и проблема."
          - text:
              en: "Fail: getByText can't find buttons and headings."
              ru: "Упадёт: getByText не умеет находить кнопки и заголовки."
            why:
              en: "It can: getByText finds any element by its text. Here it finds too many."
              ru: "Умеет: getByText находит любой элемент по тексту. Здесь он находит слишком много."
        hints:
          - en: "Picture the login page: where does the text “Log in” appear?"
            ru: "Представь страницу входа: где встречается текст «Log in»?"
          - en: "Count them: the menu, the heading, the button."
            ru: "Посчитай: меню, заголовок, кнопка."
        explain:
          en: "An assertion needs exactly one element. `getByText('Log in')` matches three, so Playwright stops with a *strict mode violation* instead of picking one. More on this in a minute."
          ru: "Проверке нужен ровно один элемент. `getByText('Log in')` находит три, поэтому Playwright останавливается с *нарушением строгого режима* вместо того, чтобы выбрать один. Подробнее — через минуту."
      - id: c5-l3-p2
        kind: choice
        keyPoint: kp-filter-chaining
        prompt:
          en: "Six product cards, each with an “Add to cart” button. Which locator clicks the button on the Sunny Tulips card — today and after the next release?"
          ru: "Шесть карточек товаров, на каждой кнопка «Add to cart». Какой локатор нажмёт кнопку на карточке Sunny Tulips — и сегодня, и после следующего релиза?"
        optionsCode: true
        options:
          - text: "page.getByTestId('product-card').filter({ hasText: 'Sunny Tulips' }).getByRole('button', { name: 'Add to cart' })"
            correct: true
            why:
              en: "First the card with “Sunny Tulips” in it, then the button inside that card. The order of the cards doesn't matter."
              ru: "Сначала карточка, в которой есть «Sunny Tulips», потом кнопка внутри этой карточки. Порядок карточек не важен."
          - text: "page.getByRole('button', { name: 'Add to cart' }).nth(1)"
            why:
              en: "It works today: Sunny Tulips is the second card (nth counts from 0). Change the sort or add a product — and it's another flower."
              ru: "Сегодня работает: Sunny Tulips — вторая карточка (nth считает с 0). Смени сортировку или добавь товар — и это уже другой цветок."
          - text: "page.getByRole('button', { name: 'Add to cart' }).first()"
            why:
              en: "The first card is Rose Bouquet. This adds roses."
              ru: "Первая карточка — Rose Bouquet. Так добавятся розы."
          - text: "page.getByRole('button', { name: 'Add to cart Sunny Tulips' })"
            why:
              en: "No button has this name: every one is called just “Add to cart”. It finds nothing."
              ru: "Кнопки с таким именем нет: все называются просто «Add to cart». Не найдёт ничего."
        hints:
          - en: "How would you write this step in a test case — by position or by product?"
            ru: "Как бы ты записал{а|} этот шаг в тест-кейсе — по позиции или по товару?"
          - en: "Look for the option that names the product first and then the button."
            ru: "Ищи вариант, где сначала назван товар, а потом кнопка."
        explain:
          en: "A test case says “On the Sunny Tulips card, click ‘Add to cart’”. A locator can say the same: find the card, then the button inside it. That's what this lesson is about."
          ru: "В тест-кейсе пишут: «На карточке Sunny Tulips нажми ‘Add to cart’». Локатор может сказать то же самое: найди карточку, потом кнопку внутри неё. Об этом и урок."

  - type: theory
    keyPoint: kp-strict-mode
    title: { en: "Two matches? Playwright stops and asks", ru: "Два совпадения? Playwright останавливается и спрашивает" }
    body:
      - en: "Imagine a test step: “Click ‘Log in’”. On Bloomly's login page “Log in” is written three times: the menu link, the heading and the button. A colleague running your case would ask: which one?"
        ru: "Представь шаг тест-кейса: «Нажми ‘Log in’». На странице входа Bloomly «Log in» написано трижды: ссылка в меню, заголовок и кнопка. Коллега, который проходит твой кейс, спросил бы: какое из трёх?"
      - en: "Playwright asks the same. A [[locator]] used for an action or an assertion must match exactly one [[element]]. If it matches two or more, the step fails with a [[strict mode|strict-mode]] violation. The [[error message|error-message]] says how many elements were found and lists them."
        ru: "Playwright спрашивает то же самое. [[Локатор|locator]] для действия или проверки должен находить ровно один [[элемент|element]]. Если он находит два или больше, шаг падает с нарушением [[строгого режима|strict-mode]]. [[Сообщение об ошибке|error-message]] говорит, сколько элементов найдено, и перечисляет их."
      - en: "That's a feature, not a nuisance. A guess is the worst outcome: the test clicks *some* “Log in” and passes or fails for a reason nobody sees. Counting is fine, by the way: `toHaveCount(6)` is about many elements, so strict mode doesn't apply to it."
        ru: "Это полезная функция, а не помеха. Угадывание — худший исход: тест нажимает *какое-то* «Log in» и проходит или падает по причине, которую никто не видит. А вот считать можно: `toHaveCount(6)` — про много элементов, поэтому строгий режим к нему не относится."
    code: |
      await page.getByText('Log in').click();
      // Error: locator.click: Error: strict mode violation:
      // getByText('Log in') resolved to 3 elements:
      //   1) <a href="/login">Log in</a>
      //   2) <h1>Log in</h1>
      //   3) <button type="submit" …>Log in</button>
    figure: dom-tree
    mentor:
      en: "Read a strict mode error as a clarifying question from the test: “Which one did you mean?” The answer belongs in the locator — not in a workaround."
      ru: "Читай ошибку строгого режима как уточняющий вопрос от теста: «Какой из них ты имел{а|} в виду?» Ответ должен оказаться в локаторе, а не в обходном пути."

  - type: task
    task:
      id: c5-l3-t1
      kind: choice
      keyPoint: kp-strict-mode
      context:
        en: "The cart has Rose Bouquet, Sunny Tulips and Lavender Pot. Petal's cart test is red with this error."
        ru: "В корзине Rose Bouquet, Sunny Tulips и Lavender Pot. Тест корзины от Petal красный с такой ошибкой."
      prompt:
        en: "What is the error telling you?"
        ru: "О чём говорит эта ошибка?"
      code: |
        await page.getByRole('button', { name: 'Remove' }).click();
        // Error: locator.click: Error: strict mode violation:
        // getByRole('button', { name: 'Remove' }) resolved to 3 elements:
        //   1) <button … data-idx="0">Remove</button>
        //   2) <button … data-idx="1">Remove</button>
        //   3) <button … data-idx="2">Remove</button>
      options:
        - text: { en: "The locator is ambiguous: every row has a “Remove” button. The test has to say which row.", ru: "Локатор неоднозначный: кнопка «Remove» есть в каждой строке. Тест должен сказать, в какой." }
          correct: true
          why:
            en: "Exactly. Three buttons were found, and they all work — the test just didn't say which one it needs."
            ru: "Именно. Найдены три кнопки, и все они работают — просто тест не сказал, какая ему нужна."
        - text: { en: "The “Remove” button is broken — time for a bug report.", ru: "Кнопка «Remove» сломана — пора писать баг-репорт." }
          why:
            en: "Nothing is broken: Playwright found all three buttons. The problem is in the test, not in the app."
            ru: "Ничего не сломано: Playwright нашёл все три кнопки. Проблема в тесте, а не в приложении."
        - text: { en: "The cart loaded too slowly — add `waitForTimeout` before the click.", ru: "Корзина загрузилась слишком медленно — добавить `waitForTimeout` перед кликом." }
          why:
            en: "Timing has nothing to do with it. The buttons are there — three of them. Waiting longer won't make two of them disappear."
            ru: "Время тут ни при чём. Кнопки на месте — целых три. Если подождать подольше, две из них не исчезнут."
        - text: { en: "Add `.first()`, and the error will go away.", ru: "Добавить `.first()` — и ошибка пропадёт." }
          why:
            en: "It will go away — and the test will remove Rose Bouquet, whatever the test case says. The question “which one?” stays unanswered. We'll come back to this."
            ru: "Пропадёт — и тест будет удалять Rose Bouquet, что бы ни было написано в тест-кейсе. Вопрос «какую именно?» останется без ответа. Мы к этому ещё вернёмся."
      hints:
        - en: "Read the number in the error: how many elements did the locator find?"
          ru: "Прочитай число в ошибке: сколько элементов нашёл локатор?"
        - en: "Three rows in the cart, three buttons with the same name. What is missing from the locator?"
          ru: "Три строки в корзине, три кнопки с одинаковым именем. Чего не хватает локатору?"
        - en: "The test didn't say *which* row."
          ru: "Тест не сказал, *какая* строка."
      praise:
        en: "You read the error as a clarifying question — and didn't fall for the quick `.first()` patch."
        ru: "Ты прочита{ла|л} ошибку как уточняющий вопрос — и не повел{ась|ся} на быструю заплатку `.first()`."
      explain:
        en: "“resolved to 3 elements” is the key phrase: the locator works, it's just not specific enough. Every cart row has a “Remove” button with the same name, so the test has to name the row. That's the next screen."
        ru: "Ключевая фраза — «resolved to 3 elements»: локатор работает, просто он недостаточно точный. В каждой строке корзины есть кнопка «Remove» с одинаковым именем, так что тест должен назвать строку. Об этом следующий экран."

  - type: theory
    keyPoint: kp-filter-chaining
    title: { en: "Name the container, then the element", ru: "Назови контейнер, потом элемент" }
    body:
      - en: "How would you write the step in a test case? “On the Sunny Tulips card, click ‘Add to cart’.” Or: “In the Sunny Tulips row, click ‘Remove’.” First the container, then the element inside it. Nobody writes “click the second button”."
        ru: "Как бы ты записал{а|} шаг в тест-кейсе? «На карточке Sunny Tulips нажми ‘Add to cart’». Или: «В строке Sunny Tulips нажми ‘Remove’». Сначала контейнер, потом элемент внутри него. Никто не пишет «нажми вторую кнопку»."
      - en: "In code it's the same two moves. A [[filter]], `filter({ hasText })`, keeps only the elements that contain the text — six cards become one. [[Chaining|chaining]] — calling `getByRole` on that card — searches only inside it, so there is one button."
        ru: "В коде — те же два шага. [[Фильтр|filter]] `filter({ hasText })` оставляет только элементы, в которых есть этот текст, — из шести карточек остаётся одна. [[Цепочка|chaining]] — вызов `getByRole` у этой карточки — ищет только внутри неё, поэтому кнопка находится одна."
      - en: "The pattern works everywhere: card → button, cart row → “Remove”, order row → status, menu → link. The Playwright docs recommend exactly this: use chaining and filtering to make a locator unique."
        ru: "Этот приём работает везде: карточка → кнопка, строка корзины → «Remove», строка заказа → статус, меню → ссылка. Документация Playwright советует именно это: делать локатор уникальным с помощью цепочек и фильтров."
    code: |
      // card → button
      const card = page.getByTestId('product-card').filter({ hasText: 'Sunny Tulips' });
      await card.getByRole('button', { name: 'Add to cart' }).click();

      // cart row → button
      const row = page.getByRole('row').filter({ hasText: 'Sunny Tulips' });
      await row.getByRole('button', { name: 'Remove' }).click();
    mentor:
      en: "Read a chain from left to right, like a path in a test case: “product cards → the one with Sunny Tulips → its ‘Add to cart’ button”."
      ru: "Читай цепочку слева направо, как путь в тест-кейсе: «карточки товаров → та, где Sunny Tulips → её кнопка ‘Add to cart’»."

  - type: inspect
    keyPoint: kp-filter-chaining
    title: { en: "Six identical buttons, six different cards", ru: "Шесть одинаковых кнопок, шесть разных карточек" }
    intro:
      en: "The shop page in the inspector. The “Add to cart” button on the Sunny Tulips card is selected. Look at its name, then at the locator the inspector suggests at the bottom of the panel. Click another card's button and compare."
      ru: "Страница магазина в инспекторе. Выбрана кнопка «Add to cart» на карточке Sunny Tulips. Посмотри на её имя, а потом на локатор, который инспектор предлагает внизу панели. Нажми на кнопку другой карточки и сравни."
    app: { route: /shop }
    focus: "button[data-id='sunny-tulips']"
    view: both
    mentor:
      en: "The name alone can't tell the six buttons apart: in the agent's snapshot they are six `- button \"Add to cart\"` lines that differ only by their ref. What differs is the card around each one — its heading. So the suggested locator goes card → filter → button. Playwright's “Pick locator” and codegen do the same: they refine a locator until it's unique."
      ru: "По одному имени шесть кнопок не различить: в снимке агента это шесть строк `- button \"Add to cart\"`, которые отличаются только ref. Различается карточка вокруг каждой кнопки — её заголовок. Поэтому предложенный локатор идёт по пути карточка → filter → кнопка. «Pick locator» и codegen в Playwright делают так же: уточняют локатор, пока он не станет уникальным."

  - type: theory
    keyPoint: kp-filter-chaining
    title: { en: "Filter by text, by element, or by absence", ru: "Фильтр по тексту, по элементу или по отсутствию" }
    body:
      - en: "Think of the filters in your test management tool: cases whose title contains “checkout”, cases that have an attachment, cases with no linked bug. `filter` has the same three flavours."
        ru: "Вспомни фильтры в твоей системе управления тестами: кейсы, в названии которых есть «checkout», кейсы с вложением, кейсы без привязанного бага. У `filter` те же три вида."
      - en: "`hasText` — contains this text (any letter case, a part is enough). `has` — contains this element, e.g. the heading “Sunny Tulips”. `hasNot` — doesn't contain it: the cards *without* “Out of stock” are the five you can buy."
        ru: "`hasText` — содержит этот текст (регистр не важен, достаточно части). `has` — содержит этот элемент, например заголовок «Sunny Tulips». `hasNot` — не содержит его: карточки *без* «Out of stock» — это пять товаров, которые можно купить."
      - en: "Make the filter as precise as the test case. On Anna's orders page `hasText: 'Rose Bouquet'` matches two orders, #1042 and #1037 — and strict mode stops you again. Filter by what is unique: `hasText: '#1042'`."
        ru: "Делай фильтр таким же точным, как тест-кейс. На странице заказов пользователя Anna `hasText: 'Rose Bouquet'` находит два заказа, #1042 и #1037, — и строгий режим снова тебя остановит. Фильтруй по уникальному: `hasText: '#1042'`."
    code: |
      const cards = page.getByTestId('product-card');
      cards.filter({ hasText: 'Sunny Tulips' });                                  // text inside
      cards.filter({ has: page.getByRole('heading', { name: 'Sunny Tulips' }) }); // element inside
      cards.filter({ hasNot: page.getByText('Out of stock') });                   // 5 cards

      const orders = page.getByTestId('order-row');
      orders.filter({ hasText: 'Rose Bouquet' });  // 2 orders: still ambiguous
      orders.filter({ hasText: '#1042' });         // exactly 1

  - type: task
    task:
      id: c5-l3-t2
      kind: fill
      keyPoint: kp-filter-chaining
      testCase:
        id: TC-540
        title: Out-of-stock product can't be added to the cart
        steps:
          - { action: "Open /shop", expected: "\"Add to cart\" on the White Orchid card is disabled; the other 5 products are in stock" }
      prompt:
        en: "Complete Petal's test: one filter by text, one chain, one filter by absence."
        ru: "Допиши тест Petal: один фильтр по тексту, одна цепочка, один фильтр по отсутствию."
      code: |
        import { test, expect } from '@playwright/test';

        test('out-of-stock product cannot be added', async ({ page }) => {
          await page.goto('/shop');
          const orchid = page.getByTestId('product-card').___({ hasText: 'White Orchid' });
          await expect(orchid.___('button', { name: 'Add to cart' })).toBeDisabled();
          const available = page.getByTestId('product-card').filter({ ___: page.getByText('Out of stock') });
          await expect(available).toHaveCount(5);
        });
      blanks:
        - { answers: [filter], options: [filter, nth, getByText] }
        - { answers: [getByRole], options: [getByRole, getByText, locator] }
        - { answers: [hasNot], options: [hasNot, has, hasText] }
      checks: { expect: pass }
      hints:
        - en: "Blank 1 turns six cards into one. Blank 2 searches inside that card."
          ru: "Пропуск 1 превращает шесть карточек в одну. Пропуск 2 ищет внутри этой карточки."
        - en: "Blank 3: you need the cards that do *not* contain “Out of stock”."
          ru: "Пропуск 3: нужны карточки, в которых *нет* «Out of stock»."
        - en: "The answer: filter, getByRole, hasNot."
          ru: "Ответ: filter, getByRole, hasNot."
      praise:
        en: "Filter, chain, and a filter by absence — all three moves of this lesson in one test."
        ru: "Фильтр, цепочка и фильтр по отсутствию — все три приёма урока в одном тесте."
      explain:
        en: "Line 5 narrows six cards to one; line 6 finds the button only inside it — so it's White Orchid's button, not just any disabled button. Line 7 keeps the cards that have *no* “Out of stock” text. And `toHaveCount(5)` on five elements is fine: counting doesn't trigger strict mode."
        ru: "Строка 5 сужает шесть карточек до одной; строка 6 ищет кнопку только внутри неё — значит, это кнопка White Orchid, а не любая отключённая кнопка. Строка 7 оставляет карточки, в которых *нет* текста «Out of stock». А `toHaveCount(5)` на пяти элементах — это нормально: подсчёт не включает строгий режим."

  - type: task
    task:
      id: c5-l3-t3
      kind: fix
      keyPoint: kp-filter-chaining
      context:
        en: "Petal's test for TC-541 is red: strict mode violation, `getByRole('button', { name: 'Add to cart' })` resolved to 6 elements. Your fix must also pass on Kai's redesign."
        ru: "Тест Petal для TC-541 красный: нарушение строгого режима, `getByRole('button', { name: 'Add to cart' })` нашёл 6 элементов. Твоё исправление должно проходить и на редизайне Кая."
      prompt:
        en: "Fix the click on line 5: “Add to cart” on the Sunny Tulips card. No `.first()`, `.last()` or `.nth()`."
        ru: "Исправь клик в строке 5: «Add to cart» на карточке Sunny Tulips. Без `.first()`, `.last()` и `.nth()`."
      testCase:
        id: TC-541
        title: Add Sunny Tulips to the cart from the shop
        steps:
          - { action: "Open /shop" }
          - { action: "Click \"Add to cart\" on the Sunny Tulips card", expected: "Toast \"Sunny Tulips added to cart\"; cart count is 1" }
      starter: |
        import { test, expect } from '@playwright/test';

        test('add Sunny Tulips to the cart', async ({ page }) => {
          await page.goto('/shop');
          await page.getByRole('button', { name: 'Add to cart' }).click();
          await expect(page.getByTestId('toast')).toHaveText('Sunny Tulips added to cart');
          await expect(page.getByTestId('cart-count')).toHaveText('1');
        });
      solution: |
        import { test, expect } from '@playwright/test';

        test('add Sunny Tulips to the cart', async ({ page }) => {
          await page.goto('/shop');
          const card = page.getByTestId('product-card').filter({ hasText: 'Sunny Tulips' });
          await card.getByRole('button', { name: 'Add to cart' }).click();
          await expect(page.getByTestId('toast')).toHaveText('Sunny Tulips added to cart');
          await expect(page.getByTestId('cart-count')).toHaveText('1');
        });
      checks:
        expect: pass
        static:
          - awaitsActions
          - rule: notRegex
            value: '\.(first|last|nth)\('
            message:
              en: "Don't pick the card by its position: filter it by its text."
              ru: "Не выбирай карточку по позиции: отфильтруй её по тексту."
        also:
          - app: { variant: redesign }
            expect: pass
      hints:
        - en: "Start from the cards: `page.getByTestId('product-card')`."
          ru: "Начни с карточек: `page.getByTestId('product-card')`."
        - en: "Keep only the card that contains “Sunny Tulips” with `.filter({ hasText: ... })`, then look for the button inside it."
          ru: "Оставь только карточку, где есть «Sunny Tulips», через `.filter({ hasText: ... })`, потом ищи кнопку внутри неё."
        - en: "Like this: `page.getByTestId('product-card').filter({ hasText: 'Sunny Tulips' }).getByRole('button', { name: 'Add to cart' })`"
          ru: "Вот так: `page.getByTestId('product-card').filter({ hasText: 'Sunny Tulips' }).getByRole('button', { name: 'Add to cart' })`"
      praise:
        en: "Green on both versions of the shop — your locator says *which* card, and the redesign doesn't care about anything else."
        ru: "Зелёный на обеих версиях магазина — твой локатор говорит, *какая* карточка, а всё остальное редизайну безразлично."
      explain:
        en: "The card filter turns six matches into one, and the chain finds the button inside that card. On the redesign the cards look different (price above the name, new class names), but the test id, the text and the button's role and name stay the same — so it still passes. `.nth(1)` would also be green today — and wrong the day the order changes."
        ru: "Фильтр по карточке превращает шесть совпадений в одно, а цепочка находит кнопку внутри этой карточки. На редизайне карточки выглядят иначе (цена над названием, новые имена классов), но test id, текст, роль и имя кнопки те же — поэтому тест проходит. `.nth(1)` сегодня тоже был бы зелёным — и стал бы неправильным в тот день, когда поменяется порядок."

  - type: theory
    keyPoint: kp-first-nth-red-flag
    title: { en: "first() and nth(): the error is gone, the question isn't", ru: "first() и nth(): ошибки нет, а вопрос остался" }
    body:
      - en: "A test step says “Click ‘Remove’”, and the cart has three rows. A careful tester asks “which one?”. A tester in a hurry clicks the top one and marks the step as passed. `.first()` is the tester in a hurry."
        ru: "В шаге написано «Нажми ‘Remove’», а в корзине три строки. Внимательный тестировщик спросит: «какую?». Торопливый нажмёт верхнюю и отметит шаг пройденным. `.first()` — это торопливый тестировщик."
      - en: "Agents love `.first()`, `.last()` and `.nth(i)`: the strict mode error disappears, the test turns green, and the agent's job looks done. But now the test picks by position, not by meaning. A new product, another sort order, one more cart row — and it clicks something else. (Also, `nth` counts from zero: `.nth(1)` is the *second*.) The Playwright docs don't recommend these methods for exactly this reason."
        ru: "Агенты обожают `.first()`, `.last()` и `.nth(i)`: ошибка строгого режима исчезает, тест зеленеет, и задача агента выглядит выполненной. Но теперь тест выбирает по позиции, а не по смыслу. Новый товар, другая сортировка, ещё одна строка в корзине — и он нажимает что-то другое. (К тому же `nth` считает с нуля: `.nth(1)` — это *второй*.) Документация Playwright не рекомендует эти методы именно поэтому."
      - en: "They are fine when the position *is* the requirement: “the newest order is on top” → `getByTestId('order-row').first()`. In a [[code review|code-review]], ask every `.first()` and `.nth()`: “which one, and why that one?” If the answer is a name, ask for a filter."
        ru: "Они уместны, когда позиция и *есть* требование: «самый новый заказ — сверху» → `getByTestId('order-row').first()`. На [[код-ревью|code-review]] задавай каждому `.first()` и `.nth()` вопрос: «какой именно и почему этот?» Если ответ — название, проси фильтр."
    code: |
      // by position: whatever is on top today
      await page.getByRole('button', { name: 'Remove' }).first().click();

      // by meaning: the row the test case is about
      const row = page.getByRole('row').filter({ hasText: 'Sunny Tulips' });
      await row.getByRole('button', { name: 'Remove' }).click();
    mentor:
      en: "When Petal adds `.first()`, I leave one comment in the PR: “Which product did the test case mean?” Nine times out of ten, the answer turns into a filter."
      ru: "Когда Petal добавляет `.first()`, я оставляю в PR один комментарий: «Какой товар имелся в виду в тест-кейсе?» В девяти случаях из десяти ответ превращается в фильтр."

