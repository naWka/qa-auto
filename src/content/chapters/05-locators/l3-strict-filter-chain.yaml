          await expect(page.getByTestId('cart-total')).toHaveText('€51.90');
        });
      issues:
        - line: 5
          type: fragile-locator
          note:
            en: "“The first card” is Rose Bouquet only in today's “Most popular” order. Filter the card by “Rose Bouquet”."
            ru: "«Первая карточка» — это Rose Bouquet только в сегодняшнем порядке «Most popular». Отфильтруй карточку по «Rose Bouquet»."
        - line: 6
          type: wrong-step
          note:
            en: "`nth` counts from zero: `.nth(4)` is the fifth card — Mint Succulent, not Peony Dream. Filter by “Peony Dream” instead of counting."
            ru: "`nth` считает с нуля: `.nth(4)` — пятая карточка, Mint Succulent, а не Peony Dream. Вместо подсчёта отфильтруй по «Peony Dream»."
        - line: 8
          type: weak-assertion
          note:
            en: "“Some row is visible” doesn't say which products are in the cart. TC-543 expects the rows Rose Bouquet and Peony Dream."
            ru: "«Какая-то строка видна» не говорит, какие товары в корзине. TC-543 ожидает строки Rose Bouquet и Peony Dream."
        - line: 9
          type: wrong-assertion
          note:
            en: "€51.90 = Rose Bouquet + Mint Succulent + €4.90 delivery: Petal copied the total from the screen. The case expects €77.00."
            ru: "€51.90 = Rose Bouquet + Mint Succulent + €4.90 доставки: Petal переписал итог с экрана. Кейс ожидает €77.00."
      types: [fragile-locator, wrong-step, weak-assertion, wrong-assertion, hard-wait, hallucination]
      hints:
        - en: "Ask every `.first()` and `.nth()`: which product, and why that one? Count the cards from zero."
          ru: "Спроси каждый `.first()` и `.nth()`: какой товар и почему этот? Считай карточки с нуля."
        - en: "Then compare both assertions with the expected result: which rows, which total?"
          ru: "Потом сравни обе проверки с ожидаемым результатом: какие строки, какой итог?"
        - en: "Lines 5, 6, 8 and 9. Line 7 is fine."
          ru: "Строки 5, 6, 8 и 9. Строка 7 в порядке."
      praise:
        en: "Four findings — including the off-by-one that turned Peony Dream into Mint Succulent. That's the review that stops a wrong green test."
        ru: "Четыре находки — включая сдвиг на единицу, из-за которого Peony Dream превратился в Mint Succulent. Такое ревью останавливает неправильный зелёный тест."
      explain:
        en: "One shortcut led to the next: `.nth(4)` added the wrong product, the total went red, and Petal “fixed” it by copying the number from the screen. With filters (“Rose Bouquet”, “Peony Dream”) the test adds the right products, and the €77.00 check from the case passes. Line 7 is fine: only the menu link has “Cart” in its name."
        ru: "Одна уловка потянула за собой другую: `.nth(4)` добавил не тот товар, итог покраснел, и Petal «починил» его, переписав число с экрана. С фильтрами («Rose Bouquet», «Peony Dream») тест добавляет нужные товары, и проверка €77.00 из кейса проходит. Строка 7 в порядке: «Cart» в имени есть только у ссылки в меню."

