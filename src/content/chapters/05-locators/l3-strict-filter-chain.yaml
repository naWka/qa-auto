          why:
            en: "Only if it checked which product stayed — and then it would be red on a healthy app too, because `.first()` itself clicks Rose Bouquet's “Remove”. As written, one row is left either way, and the toast says “removed from cart” either way."
            ru: "Только если бы проверял, какой товар остался, — и тогда он был бы красным и на исправном приложении, ведь `.first()` сам нажимает «Remove» у Rose Bouquet. А в таком виде одна строка остаётся в любом случае, и уведомление «removed from cart» появляется в любом случае."
