id: c5-l4
chapter: c5
title: { en: "A locator policy for your agent", ru: "Политика локаторов для агента" }
goal:
  en: "Review AI-written locators and write a short locator policy into the prompt and the project rules file."
  ru: "Проверять локаторы, написанные ИИ, и записывать короткую политику локаторов в промпт и в файл правил проекта."
minutes: 10
keyPoints:
  - id: kp-ai-locator-mistakes
    title: { en: "Typical AI locator mistakes", ru: "Типичные ошибки ИИ в локаторах" }
  - id: kp-snapshot-not-memory
    title: { en: "Names from the live snapshot, not from memory", ru: "Имена — из снимка живой страницы, а не из памяти" }
  - id: kp-policy-file
    title: { en: "A policy in the rules file works for every prompt", ru: "Политика в файле правил работает для каждого промпта" }
terms: [from-memory, start-fresh, short-lived, escape-hatch, enforce, keep-in-sync, per, fail-quietly]
steps:
  - type: story
    lines:
      - who: leo
        text:
          en: "Petal opened twelve pull requests this week. In review you wrote “no CSS classes, please” nine times."
          ru: "На этой неделе Petal открыл двенадцать пулл-реквестов. На ревью ты написал{а|} «no CSS classes, please» девять раз."
      - who: petal
        text:
          en: "Sorry! Every new session starts fresh for me. Yesterday's review comments aren't in my context."
          ru: "Простите! Каждая новая сессия для меня начинается с чистого листа. Вчерашних комментариев к ревью в моём контексте нет."
      - who: maya
        text:
          en: "Then let's stop repeating ourselves. We'll write a short locator policy — into today's prompt, and into the file Petal reads every time."
          ru: "Тогда хватит повторять одно и то же. Напишем короткую политику локаторов — в сегодняшний промпт и в файл, который Petal читает каждый раз."

  - type: pretest
    intro:
      en: "Quick guess before we start. Wrong answers are fine — they help you remember."
      ru: "Быстрая догадка перед стартом. Ошибаться можно — так лучше запоминается."
    items:
      - id: c5-l4-p1
        kind: choice
        keyPoint: kp-policy-file
        prompt:
          en: "On Monday your prompt told Petal: “No CSS classes.” On Tuesday Kai asks Petal for a test — and gets `page.locator(\".btn\")` again. What's the most likely reason?"
          ru: 'В понедельник твой промпт сказал Petal: «No CSS classes». Во вторник Кай просит у Petal тест — и снова получает `page.locator(".btn")`. Какая причина вероятнее всего?'
        options:
          - text: { en: "The rule lived only in your prompt. Kai's prompt didn't have it, and the new session doesn't know yours.", ru: "Правило жило только в твоём промпте. В промпте Кая его не было, а новая сессия ничего не знает о твоём." }
            correct: true
            why:
              en: "A prompt works for one task. A rule that must apply every time needs a place the agent reads every time."
              ru: "Промпт работает для одной задачи. Правилу, которое должно действовать всегда, нужно место, которое агент читает всегда."
          - text: { en: "Petal is broken and needs a restart.", ru: "Petal сломался, его нужно перезапустить." }
            why:
              en: "A restart gives Petal an even cleaner start — without your rule."
              ru: "Перезапуск даст Petal ещё более чистый старт — без твоего правила."
          - text: { en: "Buttons can only be found by CSS class.", ru: "Кнопки можно найти только по CSS-классу." }
            why:
              en: 'Buttons have a role and a name: `get_by_role("button", name="Log in")`.'
              ru: 'У кнопок есть роль и имя: `get_by_role("button", name="Log in")`.'
        hints:
          - en: "Whose prompt was Petal answering on Tuesday?"
            ru: "На чей промпт Petal отвечал во вторник?"
          - en: "Does a new chat with the agent include what you wrote in an old one?"
            ru: "Попадает ли в новый чат с агентом то, что ты писал{а|} в старом?"
        explain:
          en: "Rules in a prompt are as short-lived as the prompt. Today you'll move them into a file the agent reads by itself."
          ru: "Правила в промпте живут ровно столько, сколько сам промпт. Сегодня ты перенесёшь их в файл, который агент читает сам."
      - id: c5-l4-p2
        kind: choice
        keyPoint: kp-snapshot-not-memory
        prompt:
          en: "Petal has never opened Bloomly's cart. You ask for a test that clicks the checkout button. Which name will Petal most likely put into the locator?"
          ru: "Petal ни разу не открывал корзину Bloomly. Ты просишь тест, который нажимает кнопку оформления заказа. Какое имя Petal, скорее всего, вставит в локатор?"
        options:
          - text: { en: "A typical name from other shops, like “Checkout now” or “Go to checkout”", ru: "Типичное имя с других сайтов, вроде «Checkout now» или «Go to checkout»" }
            correct: true
            why:
              en: "Without looking at the page, the agent fills the gap with the most common words it has seen."
              ru: "Не посмотрев на страницу, агент заполняет пробел самыми частыми словами, которые встречал."
          - text: { en: "The real one, “Proceed to checkout”", ru: "Настоящее — «Proceed to checkout»" }
            why:
              en: "Only if something gives it the real name: the live page, the test case or you."
              ru: "Только если кто-то даст ему настоящее имя: живая страница, тест-кейс или ты."
          - text: { en: "None — an agent can't write get_by_role at all without a browser", ru: "Никакое — без браузера агент вообще не может написать get_by_role" }
            why:
              en: "It can and it will. It just guesses the name."
              ru: "Может и напишет. Просто имя он угадает."
        hints:
          - en: "Where would the real name come from, if nobody shows Petal the page?"
            ru: "Откуда взяться настоящему имени, если никто не показал Petal страницу?"
          - en: "Agents learned from thousands of other shops."
            ru: "Агенты учились на тысячах других магазинов."
        explain:
          en: "From memory an agent writes the *typical* name, not the *real* one. In this lesson you'll make it look at the live page first."
          ru: "По памяти агент пишет *типичное* имя, а не *настоящее*. В этом уроке ты заставишь его сначала посмотреть на живую страницу."

  - type: theory
    keyPoint: kp-ai-locator-mistakes
    title: { en: "Four locator mistakes agents make", ru: "Четыре ошибки агентов в локаторах" }
    body:
      - en: |-
          Agents learned from millions of pages and tests — old, fragile ones included. So their [[locator]] mistakes are predictable. Watch for four:
          - **Invented methods**: `get_by_button("Log in")`, `get_by_checkbox(...)`. They sound like Playwright but don't exist.
          - **CSS classes and positions**: `.btn-primary`, `li:nth-child(2)`. The most common style in old code on the internet.
          - **Names from other sites**: “Sign in”, “Sold out”, “Add to basket”. Common words — but not Bloomly's.
          - **`.first` against strict mode**: the error goes away, and the test clicks the wrong card.
        ru: |-
          Агенты учились на миллионах страниц и тестов — включая старые и хрупкие. Поэтому их ошибки в [[локаторах|locator]] предсказуемы. Следи за четырьмя:
          - **Выдуманные методы**: `get_by_button("Log in")`, `get_by_checkbox(...)`. Звучат как Playwright, но их не существует.
          - **CSS-классы и позиции**: `.btn-primary`, `li:nth-child(2)`. Самый частый стиль в старом коде в интернете.
          - **Имена с других сайтов**: «Sign in», «Sold out», «Add to basket». Частые слова — но не те, что в Bloomly.
          - **`.first` против строгого режима**: ошибка исчезает, а тест нажимает не на ту карточку.
      - en: "Invented methods and names are [[hallucinations|hallucination]], and they fail loudly: the test is red on the first run. CSS classes and `.first` fail quietly: green today, red after Kai's redesign — or green and clicking the wrong product. The quiet ones are what your review must catch."
        ru: "Выдуманные методы и имена — это [[галлюцинации|hallucination]], и падают они громко: тест красный с первого прогона. CSS-классы и `.first` падают тихо: зелёные сегодня, красные после редизайна Кая — или зелёные, но нажимают не на тот товар. Именно тихие ошибки и должно ловить твоё ревью."
      - en: "You've seen this in manual testing: a test case copied from another project. The steps look right, but the button names belong to someone else's app."
        ru: "Ты видел{а|} такое в ручном тестировании: тест-кейс, скопированный из другого проекта. Шаги выглядят правильно, но названия кнопок — из чужого приложения."
    mentor:
      en: "When a locator looks unfamiliar, don't assume you're the one who doesn't know. Check the Playwright docs and the page. Quite often it's the agent."
      ru: "Если локатор выглядит незнакомо, не думай сразу, что это ты чего-то не знаешь. Проверь документацию Playwright и страницу. Довольно часто ошибается агент."

  - type: theory
    keyPoint: kp-snapshot-not-memory
    title: { en: "Snapshot, not memory", ru: "Снимок, а не память" }
    body:
      - en: "Why does Petal write “Sold out” or “Checkout now”? It knows thousands of shops — and nothing about Bloomly until it looks. From memory it writes the *typical* name, not the *real* one."
        ru: "Почему Petal пишет «Sold out» или «Checkout now»? Он знает тысячи магазинов — и ничего не знает о Bloomly, пока не посмотрит. По памяти он пишет *типичное* имя, а не *настоящее*."
      - en: "Through [[Playwright MCP|mcp]] (or Playwright CLI) the agent can open the live page and read its [[accessibility snapshot|accessibility-snapshot]] — the agent's view you explored in chapter 4. Every role and name in it is real. Locators copied from it can't contain invented names."
        ru: "Через [[Playwright MCP|mcp]] (или Playwright CLI) агент может открыть живую страницу и прочитать её [[снимок доступности|accessibility-snapshot]] — тот самый взгляд агента, который ты изучал{а|} в главе 4. Каждая роль и каждое имя в нём настоящие. В локаторах, списанных с него, не бывает выдуманных имён."
      - en: "You don't write test cases for a new build from memory of a similar app — you open the build and copy the exact labels. Ask the agent for the same, in so many words: “Open /cart with Playwright MCP and take every locator from the accessibility snapshot. Don't guess names.”"
        ru: "Ты не пишешь тест-кейсы к новой сборке по памяти о похожем приложении — ты открываешь сборку и переписываешь точные надписи. Попроси агента о том же прямым текстом: «Open /cart with Playwright MCP and take every locator from the accessibility snapshot. Don't guess names.»"
    code: |
      - heading "Your cart" [level=1] [ref=e9]
      - textbox "Promo code" [ref=e30]:
        - /placeholder: e.g. BLOOM10
      - button "Apply" [ref=e31]
      - link "Continue shopping" [ref=e41]:
        - /url: /shop
      - button "Proceed to checkout" [ref=e42]
    mentor:
      en: "A fragment of the cart as Petal sees it. The `[ref=…]` markers are temporary handles for clicking in the current session — they can change with the next snapshot. A test takes the role and the name, never the ref."
      ru: "Фрагмент корзины глазами Petal. Метки `[ref=…]` — временные ссылки для кликов в текущей сессии, со следующим снимком они могут измениться. Тест берёт роль и имя, но никогда не ref."

  - type: theory
    keyPoint: kp-policy-file
    title: { en: "Write it down once: the rules file", ru: "Записать один раз: файл правил" }
    body:
      - en: "A rule in your [[prompt]] lives for one task. A new session starts without yesterday's chat, and Kai won't copy your rules into his prompts. So teams keep [[project rules|project-rules]] in a file the agent reads by itself."
        ru: "Правило в [[промпте|prompt]] живёт одну задачу. Новая сессия начинается без вчерашнего чата, а Кай не будет копировать твои правила в свои промпты. Поэтому команды хранят [[правила проекта|project-rules]] в файле, который агент читает сам."
      - en: "Claude Code reads `CLAUDE.md` in the repository root at the start of every session. GitHub Copilot reads `.github/copilot-instructions.md`. Write the locator policy there once — and it works for every prompt, yours and Kai's."
        ru: "Claude Code читает `CLAUDE.md` в корне репозитория в начале каждой сессии. GitHub Copilot читает `.github/copilot-instructions.md`. Запиши политику локаторов туда один раз — и она работает для каждого промпта, твоего и Кая."
      - en: "It's like your team's test design guidelines: nobody repeats them in every test case, but every test case follows them. Keep the policy short and checkable: “No CSS classes” can be verified in a [[code review|code-review]] in seconds; “write good locators” can't."
        ru: "Это как гайдлайны по тест-дизайну в твоей команде: их не повторяют в каждом тест-кейсе, но каждый тест-кейс им следует. Делай политику короткой и проверяемой: «No CSS classes» на [[код-ревью|code-review]] проверяется за секунды, а «пиши хорошие локаторы» — никак."
    figure: locator-priority
    mentor:
      en: "Today we write only the Locators section. In chapter 8 the same file gets rules for assertions, waits and naming."
      ru: "Сегодня пишем только раздел Locators. В главе 8 в этот же файл добавятся правила для проверок, ожиданий и названий."

  - type: example
    keyPoint: kp-policy-file
    title: { en: "Bloomly's locator policy, line by line", ru: "Политика локаторов Bloomly, строка за строкой" }
    intro:
      en: "Maya's Locators section for `CLAUDE.md`. Each line blocks one of the typical mistakes — and each one can be checked in a diff."
      ru: "Раздел Locators, который Майя написала для `CLAUDE.md`. Каждая строка закрывает одну из типичных ошибок — и каждую можно проверить в диффе."
    code: |
      # Locators
      - Open the live page first — Playwright MCP or
        CLI snapshot. Never guess names.
      - Use `get_by_role` with a name,
        then `get_by_label`, then `get_by_text` /
        `get_by_placeholder`, then `get_by_test_id`.
      - No CSS classes, no `nth-child`, no XPath.
      - Strict mode error? Don't silence it with
        `.first` or `.nth()` — filter by text:
        ```python
        # the Sunny Tulips card, then its button
        cards = page.get_by_test_id("product-card")
        card = cards.filter(has_text="Sunny Tulips")
        card.get_by_role("button", name="Add to cart")
        ```
      - No role, name or test id? Stop and tell me.
        Don't invent a locator.
    notes:
      - lines: 1
        text:
          en: "One section, one topic. Later the file gets sections for assertions and waits; the agent reads all of it at the start of every session."
          ru: "Один раздел — одна тема. Позже в файле появятся разделы про проверки и ожидания; агент читает его целиком в начале каждой сессии."
      - lines: [2, 3]
        text:
          en: "Where names come from: the live page. This one line removes most invented names — “Sold out”, “Sign in”, “Add to basket”."
          ru: "Откуда берутся имена: с живой страницы. Одна эта строка убирает большую часть выдуманных имён — «Sold out», «Sign in», «Add to basket»."
      - lines: [4, 5, 6]
        text:
          en: "The ladder from lesson 1, in order. Naming real methods also leaves no room for `get_by_button`."
          ru: "Лесенка из урока 1, по порядку. А раз названы настоящие методы, для `get_by_button` места не остаётся."
      - lines: 7
        text:
          en: "Bans a reviewer can check in seconds: search the diff for `locator(\".` and `nth-child`."
          ru: 'Запреты, которые ревьюер проверяет за секунды: поищи в диффе `locator(".` и `nth-child`.'
      - lines: [8, 9, 10, 11, 12, 13, 14, 15]
        text:
          en: "Strict mode: say what to do instead of `.first` — and give an example to copy. Agents follow examples better than adjectives."
          ru: "Строгий режим: скажи, что делать вместо `.first`, — и дай пример, который можно скопировать. Примерам агенты следуют лучше, чем прилагательным."
      - lines: [16, 17]
        text:
          en: "An escape hatch. Without it, the agent invents something to look helpful. An element with no name may be an accessibility bug (chapter 4) — a finding, not a nuisance."
          ru: "Запасной выход. Без него агент что-нибудь выдумает, чтобы выглядеть полезным. Элемент без имени может оказаться багом доступности (глава 4) — это находка, а не помеха."

  - type: task
    task:
      id: c5-l4-t1
      kind: review
      keyPoint: kp-ai-locator-mistakes
      context:
        en: "Petal wrote this test for TC-560 from memory — it never opened the signup page."
        ru: "Petal написал этот тест для TC-560 по памяти — страницу регистрации он так и не открыл."
      prompt:
        en: "Check every locator for the four typical mistakes. Flag each problem line and pick the issue type."
        ru: "Проверь каждый локатор на четыре типичные ошибки. Отметь каждую проблемную строку и выбери тип проблемы."
      testCase:
        id: TC-560
        title: New customer can create an account
        steps:
          - { action: "Open /signup" }
          - { action: "Fill in Full name, Email, Password; choose Country", data: "Ines Costa / ines@example.com / spring-roses / Portugal" }
          - { action: "Tick \"I agree to the Terms of Service\"" }
          - { action: "Click \"Create account\"", expected: "Heading \"Account created!\" and the text \"Welcome to Bloomly, Ines.\"" }
      code: |
        from playwright.sync_api import Page, expect


        def test_new_customer_can_create_an_account(page: Page):
            page.goto("/signup")
            page.get_by_label("Full name").fill("Ines Costa")
            page.get_by_label("Email").fill("ines@example.com")
            page.locator('#signup-form input[type="password"]').fill("spring-roses")
            page.get_by_label("Country").select_option("PT")
            page.get_by_checkbox("I agree to the Terms of Service").check()
            page.locator("form .btn").click()
            expect(page.get_by_role("heading", name="Welcome aboard!")).to_be_visible()
      issues:
        - line: 8
          type: fragile-locator
          note:
            en: "A CSS path through the form's markup. Add a “Repeat password” field and it matches two inputs. The field has a label: `get_by_label(\"Password\")`."
            ru: 'CSS-путь по разметке формы. Стоит добавить поле «Repeat password» — и он найдёт два поля. У поля есть метка: `get_by_label("Password")`.'
        - line: 10
          type: hallucination
          note:
            en: "`get_by_checkbox` doesn't exist in Playwright — the run stops here with `AttributeError`. Use `get_by_role(\"checkbox\", name=\"I agree to the Terms of Service\")`."
            ru: '`get_by_checkbox` в Playwright нет — прогон остановится здесь с `AttributeError`. Используй `get_by_role("checkbox", name="I agree to the Terms of Service")`.'
        - line: 11
          type: fragile-locator
          note:
            en: "A CSS class: `.btn` is exactly what Kai's redesign renames. Use `get_by_role(\"button\", name=\"Create account\")`."
            ru: 'CSS-класс: `.btn` — как раз то, что переименует редизайн Кая. Используй `get_by_role("button", name="Create account")`.'
        - line: 12
          type: hallucination
          note:
            en: "There is no heading “Welcome aboard!”. Bloomly shows “Account created!” — exactly what TC-560 expects."
            ru: "Заголовка «Welcome aboard!» нет. Bloomly показывает «Account created!» — ровно то, что ожидает TC-560."
      types: [fragile-locator, hallucination, hard-wait, wrong-data, not-called]
      hints:
        - en: "Go line by line with the four mistakes: invented method, CSS or position, a name from another site, `.first`."
          ru: "Иди по строкам с четырьмя ошибками: выдуманный метод, CSS или позиция, имя с другого сайта, `.first`."
        - en: "Two lines use CSS; one calls a method Playwright doesn't have; one expects a heading the page never shows."
          ru: "В двух строках CSS; в одной вызван метод, которого в Playwright нет; в одной ожидается заголовок, которого на странице не бывает."
        - en: "Lines 8 and 11 (CSS), line 10 (method), line 12 (heading)."
          ru: "Строки 8 и 11 (CSS), строка 10 (метод), строка 12 (заголовок)."
      praise:
        en: "Four findings, each with the right label. You can tell a fragile locator from an invented one — that's what makes a review comment precise."
        ru: "Четыре находки, и у каждой правильный тип. Ты отличаешь хрупкий локатор от выдуманного — именно это делает комментарий к ревью точным."
      explain:
        en: "Lines 10 and 12 are loud: the test goes red on the first run. Lines 8 and 11 are quiet: the test may well pass today and break when the markup or the class names change. The quiet ones are the reason a locator policy exists."
        ru: "Строки 10 и 12 — громкие: тест покраснеет на первом же прогоне. Строки 8 и 11 — тихие: сегодня тест вполне может пройти и сломаться, когда поменяется разметка или имена классов. Именно из-за тихих ошибок и нужна политика локаторов."

  - type: task
    task:
      id: c5-l4-t2
      kind: predict
      keyPoint: kp-ai-locator-mistakes
      context:
        en: "Petal wrote this TC-561 test without opening the shop. It even used the recommended pattern: filter the card, then `get_by_role` inside it."
        ru: "Petal написал этот тест для TC-561, не открывая магазин. Он даже использовал рекомендованный шаблон: отфильтровать карточку, потом `get_by_role` внутри неё."
      prompt:
        en: "Pass or fail?"
        ru: "Пройдёт или упадёт?"
      testCase:
        id: TC-561
        title: Out-of-stock product can't be added to the cart
        steps:
          - { action: "Open /shop" }
          - { action: "Look at the White Orchid card", expected: "It says \"Out of stock\"; its \"Add to cart\" button is disabled" }
      code: |
        from playwright.sync_api import Page, expect


        def test_out_of_stock_product_cannot_be_added(page: Page):
            page.goto("/shop")
            card = page.get_by_test_id("product-card").filter(has_text="White Orchid")
            expect(card).to_contain_text("Out of stock")
            expect(card.get_by_role("button", name="Sold out")).to_be_disabled()
      outcome: fail
      reasons:
        - text:
            en: "Fail: there's no button named “Sold out”. The button is still “Add to cart”, just disabled — Petal invented the name."
            ru: "Упадёт: кнопки с именем «Sold out» нет. Кнопка по-прежнему «Add to cart», просто неактивна, — имя Petal выдумал."
          correct: true
        - text:
            en: "Pass: filter + get_by_role is the most resilient pattern."
            ru: "Пройдёт: filter + get_by_role — самый устойчивый шаблон."
        - text:
            en: "Fail: strict mode violation — there are six product cards."
            ru: "Упадёт: нарушение строгого режима — карточек товаров шесть."
      hints:
        - en: "The pattern is fine. What about the name inside it?"
          ru: "Шаблон хороший. А что с именем внутри него?"
        - en: "Does Bloomly rename the button of an out-of-stock product — or only disable it?"
          ru: "Bloomly переименовывает кнопку у товара, которого нет в наличии, — или только делает её неактивной?"
        - en: "It fails: no button on the page is called “Sold out”."
          ru: "Упадёт: ни одна кнопка на странице не называется «Sold out»."
      praise:
        en: "Right — a resilient pattern doesn't make an invented name real."
        ru: "Верно — устойчивый шаблон не делает выдуманное имя настоящим."
      explain:
        en: '`filter(has_text="White Orchid")` narrows six cards to one, so strict mode is fine. Then `get_by_role("button", name="Sold out")` waits until the timeout for a button that never appears. The style was right; the name came from memory. Only the live page knows the real name.'
        ru: '`filter(has_text="White Orchid")` сужает шесть карточек до одной, так что со строгим режимом всё в порядке. Дальше `get_by_role("button", name="Sold out")` до самого таймаута ждёт кнопку, которая так и не появится. Стиль правильный, а имя взято из памяти. Настоящее имя знает только живая страница.'

