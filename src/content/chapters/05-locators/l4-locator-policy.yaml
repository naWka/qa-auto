          en: "Fail: the radio is called “Personal”. “Private customer” came from memory, not from the page."
          ru: "Упадёт: радиокнопка называется «Personal». «Private customer» пришло из памяти, а не со страницы."
        correct: true
      - text:
          en: "Pass: the personal account type is checked by default."
          ru: "Пройдёт: личный тип аккаунта выбран по умолчанию."
      - text:
          en: "Fail: to_be_checked doesn't work for radio buttons."
