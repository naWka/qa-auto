                expect(page.get_by_test_id("cart-count")).to_have_text("1")
        - when: [r-snapshot, r-ladder, r-filter]
          best: true
          message:
            en: "Done! I opened /shop: six cards share the button name “Add to cart”, so I filtered the Sunny Tulips card by its text, as CLAUDE.md says. The toast is `status` in the snapshot. Green ✅"
            ru: "Готово! Я открыл /shop: у шести карточек одинаковое имя кнопки «Add to cart», поэтому я отфильтровал карточку Sunny Tulips по тексту, как сказано в CLAUDE.md. Уведомление в снимке — это `status`. Зелёный ✅"
          code: |
            from playwright.sync_api import Page, expect


            def test_adding_sunny_tulips_updates_the_cart(page: Page):
                page.goto("/shop")
                card = page.get_by_test_id("product-card").filter(has_text="Sunny Tulips")
                card.get_by_role("button", name="Add to cart").click()
                expect(page.get_by_role("status")).to_have_text("Sunny Tulips added to cart")
                expect(page.get_by_test_id("cart-count")).to_have_text("1")
        - when: [r-snapshot, r-ladder]
          message:
            en: "Done! Six buttons share the name “Add to cart”, so I took the second one — Sunny Tulips is second in the list. Green ✅"
            ru: "Готово! У шести кнопок одно имя «Add to cart», поэтому я взял вторую — Sunny Tulips в списке второй. Зелёный ✅"
          code: |
            from playwright.sync_api import Page, expect


            def test_adding_sunny_tulips_updates_the_cart(page: Page):
                page.goto("/shop")
                page.get_by_role("button", name="Add to cart").nth(1).click()
                expect(page.get_by_role("status")).to_have_text("Sunny Tulips added to cart")
                expect(page.get_by_test_id("cart-count")).to_have_text("1")
        - when: [r-ladder]
          message:
            en: "Done! Role locators, as CLAUDE.md says. Shops usually name these buttons per product, so I used “Add Sunny Tulips to cart”. Red ❌ — the button wasn't found."
            ru: "Готово! Локаторы по роли, как сказано в CLAUDE.md. Обычно в магазинах такие кнопки называют по товару, поэтому я взял «Add Sunny Tulips to cart». Красный ❌ — кнопка не найдена."
          code: |
            from playwright.sync_api import Page, expect


            def test_adding_sunny_tulips_updates_the_cart(page: Page):
                page.goto("/shop")
                page.get_by_role("button", name="Add Sunny Tulips to cart").click()
                expect(page.get_by_role("status")).to_have_text("Sunny Tulips added to cart")
                expect(page.get_by_test_id("cart-count")).to_have_text("1")
        - when: [r-snapshot]
          message:
            en: "Done! I opened /shop and used the classes I saw in the DOM: `.product-card`, `.btn`, `.toast`, `.badge`. Green ✅"
            ru: "Готово! Я открыл /shop и взял классы, которые увидел в DOM: `.product-card`, `.btn`, `.toast`, `.badge`. Зелёный ✅"
          code: |
            from playwright.sync_api import Page, expect


            def test_adding_sunny_tulips_updates_the_cart(page: Page):
                page.goto("/shop")
                page.locator(".product-card", has_text="Sunny Tulips").locator(".btn").click()
                expect(page.locator(".toast")).to_have_text("Sunny Tulips added to cart")
                expect(page.locator(".badge")).to_have_text("1")
        - when: []
          message:
            en: "Done! Sunny Tulips is the second product, so I click the button in the second `li`. Green ✅"
            ru: "Готово! Sunny Tulips — второй товар, поэтому я нажимаю кнопку во втором `li`. Зелёный ✅"
          code: |
            from playwright.sync_api import Page, expect


            def test_adding_sunny_tulips_updates_the_cart(page: Page):
                page.goto("/shop")
                page.locator("li:nth-child(2) .btn").click()
                expect(page.locator(".toast")).to_have_text("Sunny Tulips added to cart")
                expect(page.locator(".badge")).to_have_text("1")
      missing:
        r-snapshot:
          en: "No snapshot rule: nothing tells Petal to look at the live page, so names can come from memory of other shops."
          ru: "Нет правила про снимок: ничто не велит Petal смотреть на живую страницу, и имена могут прийти из памяти о других магазинах."
        r-ladder:
          en: "No locator rule: nothing stops CSS classes and positions like `li:nth-child(2) .btn` — green today, red after Kai's redesign."
          ru: "Нет правила про локаторы: ничто не мешает CSS-классам и позициям вроде `li:nth-child(2) .btn` — зелёным сегодня и красным после редизайна Кая."
        r-filter:
          en: "No filter rule: when six buttons share a name, Petal picks one by position (`.nth(1)`). It breaks as soon as the sort order changes."
          ru: "Нет правила про фильтр: когда у шести кнопок одно имя, Petal выбирает по позиции (`.nth(1)`). Это сломается, как только поменяется сортировка."
      checks:
        expect: pass
        also:
          - app: { variant: redesign }
            expect: pass
        static: [hasAssertion, noFragile]
      hints:
        - en: "Kai's prompt has no rules at all. Everything Petal knows about locators has to come from CLAUDE.md."
          ru: "В промпте Кая нет вообще никаких правил. Всё, что Petal знает о локаторах, должно прийти из CLAUDE.md."
        - en: "One line makes the test “green” by clicking the wrong product. One line is too vague to check."
          ru: "Одна строка делает тест «зелёным», нажимая не на тот товар. Одна строка слишком размытая, чтобы её проверить."
        - en: "The snapshot, ladder and filter lines. Leave out `.first` and “clean, robust, professional”."
          ru: "Строки про снимок, лесенку и фильтр. Без `.first` и без «чистых, надёжных, профессиональных»."
      praise:
        en: "Kai wrote one line without any rules — and still got a test that follows the policy. That's what a rules file is for."
        ru: "Кай написал одну строку без всяких правил — и всё равно получил тест по политике. Ради этого и нужен файл правил."
      explain:
        en: "Compare the runs. With no rules file Petal falls back to `li:nth-child(2) .btn` — green today, fragile. With the `.first` rule it adds the wrong flower and then offers to change the expected result. With only the vague line nothing changes: “robust” is nothing a reviewer can check. Three short, checkable lines changed the result for a prompt you didn't even write."
        ru: "Сравни прогоны. Без файла правил Petal возвращается к `li:nth-child(2) .btn` — зелёный сегодня, но хрупкий. С правилом про `.first` он добавляет не тот цветок, а потом предлагает поменять ожидаемый результат. С одной лишь размытой строкой ничего не меняется: «надёжность» ревьюер проверить не может. Три коротких проверяемых строки изменили результат для промпта, который ты даже не писал{а|}."

  - type: mistakes
    keyPoint: kp-policy-file
    title: { en: "Policy mistakes", ru: "Ошибки в политике" }
    items:
      - wrong: "- Locators should be robust and high quality."
        right: "- Use get_by_role with a name, then get_by_label, then get_by_text, then get_by_test_id. No CSS classes, no nth-child, no XPath."
        why:
          en: "A rule nobody can check in a diff is a wish. The agent reads “robust” its own way."
          ru: "Правило, которое нельзя проверить в диффе, — это пожелание. «Надёжность» агент понимает по-своему."
      - wrong: "- If a locator matches several elements, add .first."
        right: '- If a locator matches several elements, filter by text: .filter(has_text="Sunny Tulips").'
        why:
          en: "`.first` silences strict mode and answers “which one?” with “whichever is first” — often the wrong product."
          ru: "`.first` глушит строгий режим и отвечает на вопрос «какой именно?» словами «какой первый попадётся» — часто не тот товар."
      - wrong: 'Approve: card.get_by_role("button", name="Sold out") — filter + role, looks resilient.'
        right: "Request changes: the snapshot says button \"Add to cart\" [disabled]. Please take names from the live page."
        why:
          en: "A good style doesn't make a name real. Check names against the snapshot, not against how professional the code looks."
          ru: "Хороший стиль не делает имя настоящим. Сверяй имена со снимком, а не с тем, насколько профессионально выглядит код."
      - wrong: "Paste “no CSS classes” into every prompt and hope colleagues do the same."
        right: "Write the policy once in CLAUDE.md (Claude Code) or .github/copilot-instructions.md (Copilot)."
        why:
          en: "Prompts are per task and per person. The rules file is read every session, for everyone's prompts."
          ru: "Промпт — на одну задачу и одного человека. Файл правил читается в каждой сессии, для промптов всех."

  - type: explain
    keyPoint: kp-policy-file
    prompt:
      en: "In your own words: why should the locator policy live in CLAUDE.md (or .github/copilot-instructions.md) and not only in your prompt? Which three rules would you write first?"
      ru: "Своими словами: почему политика локаторов должна жить в CLAUDE.md (или .github/copilot-instructions.md), а не только в твоём промпте? Какие три правила ты бы записал{а|} первыми?"
    model:
      en: "A prompt works for one task: a new session doesn't remember it, and my colleagues won't copy my rules into their prompts. The agent reads the rules file by itself at the start of every session, so the policy applies to every prompt — mine and Kai's. My first three rules: 1) open the live page and take names from the accessibility snapshot, never guess; 2) get_by_role with a name → get_by_label → get_by_text → get_by_test_id, no CSS classes, nth-child or XPath; 3) no .first or .nth() to silence strict mode — filter by text. Each one blocks a typical agent mistake, and each one is easy to check in a review."
      ru: "Промпт работает для одной задачи: новая сессия его не помнит, а коллеги не станут копировать мои правила в свои промпты. Файл правил агент читает сам в начале каждой сессии, поэтому политика действует для каждого промпта — моего и Кая. Мои первые три правила: 1) открыть живую страницу и брать имена из снимка доступности, никогда не угадывать; 2) get_by_role с именем → get_by_label → get_by_text → get_by_test_id, никаких CSS-классов, nth-child и XPath; 3) никаких .first и .nth(), чтобы заглушить строгий режим, — фильтровать по тексту. Каждое правило закрывает типичную ошибку агента, и каждое легко проверить на ревью."

  - type: phrases
    items:
      - context: code-review
        en: "Line 8: this name isn't on the page — the snapshot says “Add to cart”. Please take names from the live page, not from memory."
        ru: "Строка 8: такого имени на странице нет — в снимке написано «Add to cart». Пожалуйста, бери имена с живой страницы, а не из памяти."
      - context: prompt
        en: "Open /checkout with Playwright MCP first and take every locator from the accessibility snapshot. Don't guess names."
        ru: "Сначала открой /checkout через Playwright MCP и бери каждый локатор из снимка доступности. Не угадывай имена."
      - context: code-review
        en: "Requesting changes: .first hides which card we click. Per our locator policy, please filter by the product name."
        ru: "Запрашиваю правки: .first скрывает, на какую карточку мы нажимаем. По нашей политике локаторов, пожалуйста, фильтруй по названию товара."
      - context: standup
        en: "Yesterday I added a locator policy to CLAUDE.md. Since then Petal's PRs have had no CSS selectors."
        ru: "Вчера я добавил{а|} политику локаторов в CLAUDE.md. С тех пор в PR от Petal нет CSS-селекторов."
      - context: meeting
        en: "Some of us use Copilot. Should we put the same policy into .github/copilot-instructions.md?"
        ru: "Некоторые из нас работают с Copilot. Может, положим ту же политику в .github/copilot-instructions.md?"
        note:
          en: "Two agents, one policy: keep both files in sync."
          ru: "Два агента — одна политика: держи оба файла синхронными."
      - context: chat
        en: "Heads-up: I keep the Locators section short on purpose. If you add a rule, make sure we can check it in a review."
        ru: "К сведению: раздел Locators я специально держу коротким. Если добавляешь правило, убедись, что его можно проверить на ревью."

checkPool:
  - id: c5-l4-k1
    kind: choice
