          ru: "Устойчивый стиль, неверное имя. Он ничего не найдёт."
      - text: { en: "It's a CSS class and will break on the redesign.", ru: "Это CSS-класс, и он сломается при редизайне." }
        why:
          en: "There's no CSS here: role + name."
          ru: "Здесь нет CSS: роль + имя."
    hints:
      - en: "The method is fine. Read the name."
        ru: "С методом всё в порядке. Прочитай имя."
      - en: "What does the button on Bloomly's login page say?"
        ru: "Что написано на кнопке на странице входа Bloomly?"
    explain:
      en: '“Sign in” is one of the most common synonyms an agent reaches for. A snapshot of /login would show `button "Log in"`.'
      ru: '«Sign in» — один из самых частых синонимов, которые подставляет агент. Снимок /login показал бы `button "Log in"`.'

  - id: c5-l4-k2
    kind: review
    keyPoint: kp-ai-locator-mistakes
    context:
      en: "Anna is logged in. Petal wrote this TC-570 test from memory: filtering Anna's orders by “Delivered” should show 3 of 6."
      ru: "Anna вошла в аккаунт. Petal написал этот тест для TC-570 по памяти: фильтр заказов Anna по «Delivered» должен показать 3 из 6."
    prompt:
      en: "Flag every locator problem and pick its type."
      ru: "Отметь каждую проблему с локаторами и выбери её тип."
    testCase:
      id: TC-570
      title: Status filter shows only delivered orders
      preconditions: ["Logged in as anna@bloomly.app (6 orders, 3 delivered)"]
      steps:
        - { action: "Open /orders" }
        - { action: "Choose \"Delivered\" in Status", expected: "3 rows, all Delivered; summary \"Showing 3 of 6 orders\"" }
    code: |
      from playwright.sync_api import Page, expect


      def test_status_filter_shows_only_delivered_orders(page: Page):
          page.goto("/orders")
          page.get_by_dropdown("Status").select_option("Delivered")
          expect(page.locator("table tbody tr")).to_have_count(3)
          expect(page.locator(".status-delivered").first).to_have_text("Delivered")
          expect(page.get_by_test_id("orders-summary")).to_have_text("Showing 3 of 6 orders")
    issues:
      - line: 6
        type: hallucination
        note:
          en: "`get_by_dropdown` doesn't exist — the run stops here with `AttributeError`. The select has a label: `get_by_label(\"Status\")`."
          ru: '`get_by_dropdown` не существует — прогон остановится здесь с `AttributeError`. У списка есть метка: `get_by_label("Status")`.'
      - line: 7
        type: fragile-locator
        note:
          en: "A CSS path through the table's markup. The rows have a test id: `get_by_test_id(\"order-row\")`."
          ru: 'CSS-путь по разметке таблицы. У строк есть test id: `get_by_test_id("order-row")`.'
      - line: 8
        type: fragile-locator
        note:
          en: "`.status-delivered` is a CSS class — the redesign renames it. And `.first` looks at one row only."
          ru: "`.status-delivered` — CSS-класс, редизайн его переименует. А `.first` смотрит только на одну строку."
    types: [hallucination, fragile-locator, hard-wait, not-called, wrong-data]
    hints:
      - en: "Three locators, three problems. Check each against Playwright and against the policy."
        ru: "Три локатора — три проблемы. Сверь каждый с Playwright и с политикой."
      - en: "One method doesn't exist; two locators depend on markup and class names."
        ru: "Одного метода не существует; два локатора зависят от разметки и имён классов."
      - en: "Lines 6, 7 and 8. Line 9 is fine."
        ru: "Строки 6, 7 и 8. Строка 9 в порядке."
    explain:
      en: "Line 6 fails loudly on the first run. Lines 7 and 8 fail quietly — after the next markup change or redesign. The summary check on line 9 follows the policy: a test id and the exact expected text."
      ru: "Строка 6 упадёт громко, на первом же прогоне. Строки 7 и 8 упадут тихо — после следующей правки разметки или редизайна. Проверка сводки в строке 9 соответствует политике: test id и точный ожидаемый текст."

  - id: c5-l4-k3
    kind: predict
    keyPoint: kp-snapshot-not-memory
    context:
      en: "Petal wrote this TC-571 test without opening the signup page."
      ru: "Petal написал этот тест для TC-571, не открывая страницу регистрации."
    prompt:
