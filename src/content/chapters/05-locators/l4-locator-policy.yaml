      ├── ___                  ← Claude Code reads it at the start of every session
      ├── .github/
      │   └── ___              ← GitHub Copilot reads it in this repository
      ├── pages/
      │   └── cart_page.py
      ├── tests/
      │   └── test_cart.py
      ├── conftest.py
      └── pytest.ini
    blanks:
      - { answers: [CLAUDE.md], options: [CLAUDE.md, README.md, requirements.txt] }
      - { answers: [copilot-instructions.md], options: [copilot-instructions.md, workflows, CLAUDE.md] }
    hints:
      - en: "One file sits in the repository root, the other inside `.github/`."
        ru: "Один файл лежит в корне репозитория, другой — внутри `.github/`."
      - en: "Each file is named after its agent."
        ru: "Каждый файл назван в честь своего агента."
      - en: "Answers: CLAUDE.md · copilot-instructions.md."
        ru: "Ответы: CLAUDE.md · copilot-instructions.md."
    explain:
      en: "Claude Code reads `CLAUDE.md` in the root (or `.claude/CLAUDE.md`) at the start of every session. Copilot reads `.github/copilot-instructions.md`. Same policy, two files — if your team uses both agents, keep them in sync."
      ru: "Claude Code читает `CLAUDE.md` в корне (или `.claude/CLAUDE.md`) в начале каждой сессии. Copilot читает `.github/copilot-instructions.md`. Одна политика, два файла — если в команде работают с обоими агентами, держи их синхронными."

  - id: c5-l4-k6
    kind: choice
    keyPoint: kp-policy-file
    multi: true
    context:
      en: "Kai drafted a Locators section for CLAUDE.md and asked you to review it."
      ru: "Кай набросал раздел Locators для CLAUDE.md и попросил тебя сделать ревью."
    code: |
      # Locators
      - Take names from the live page (Playwright MCP snapshot), never from memory.
      - Use get_by_role with a name, then get_by_label, then get_by_text, then get_by_test_id.
      - If several elements match, add .first to keep the test green.
      - Locators should be robust and high quality.
      - No CSS classes, no nth-child, no XPath.
    prompt:
      en: "Which two lines would you ask Kai to change?"
      ru: "Какие две строки ты попросишь Кая изменить?"
    options:
      - text: { en: "Line 4: “add .first to keep the test green”", ru: "Строка 4: «add .first to keep the test green»" }
        correct: true
        why:
          en: "It silences strict mode by clicking whatever comes first. The rule should say: filter by text."
          ru: "Она глушит строгий режим, нажимая на то, что попадётся первым. Правило должно говорить: фильтруй по тексту."
      - text: { en: "Line 5: “robust and high quality”", ru: "Строка 5: «robust and high quality»" }
        correct: true
        why:
          en: "Nobody can check it in a diff, and the agent reads it any way it likes. Delete it — lines 3 and 6 already say what “robust” means."
          ru: "Её нельзя проверить в диффе, а агент понимает её как хочет. Удалить — строки 3 и 6 уже объясняют, что значит «надёжно»."
      - text: { en: "Line 2: the snapshot rule", ru: "Строка 2: правило про снимок" }
        why:
          en: "Keep it: it's what stops invented names."
          ru: "Оставить: именно она останавливает выдуманные имена."
      - text: { en: "Line 6: no CSS classes, nth-child or XPath", ru: "Строка 6: никаких CSS-классов, nth-child и XPath" }
        why:
          en: "Keep it: checkable in seconds, and it's what survives Kai's redesign."
          ru: "Оставить: проверяется за секунды, и именно благодаря ей тесты переживут редизайн Кая."
    hints:
      - en: "Look for one rule that causes a mistake and one rule that can't be checked."
        ru: "Ищи одно правило, которое вызывает ошибку, и одно, которое невозможно проверить."
      - en: "What does `.first` click on the shop page?"
        ru: "На что нажмёт `.first` на странице магазина?"
      - en: "Lines 4 and 5."
        ru: "Строки 4 и 5."
    explain:
      en: "A rules file is reviewed like code: a wrong rule spreads to every test the agent writes, and a vague rule changes nothing. Ask Kai to replace line 4 with “filter by text instead” and delete line 5."
      ru: "Файл правил ревьюят как код: неправильное правило расползётся по всем тестам агента, а размытое ничего не изменит. Попроси Кая заменить строку 4 на «filter by text instead» и удалить строку 5."

  - id: c5-l4-k7
    kind: fix
    keyPoint: kp-ai-locator-mistakes
    app: { state: { cart: [{ id: rose-bouquet, qty: 1 }, { id: sunny-tulips, qty: 1 }] } }
    context:
      en: "TC-572: the cart has Rose Bouquet and Sunny Tulips; removing Sunny Tulips should leave only Rose Bouquet."
      ru: "TC-572: в корзине Rose Bouquet и Sunny Tulips; после удаления Sunny Tulips должен остаться только Rose Bouquet."
    prompt:
      en: "Petal's line 6 breaks the locator policy. Rewrite it so the test passes now and after Kai's redesign."
      ru: "Строка 6 у Petal нарушает политику локаторов. Перепиши её так, чтобы тест проходил сейчас и после редизайна Кая."
    starter: |
      from playwright.sync_api import Page, expect


      def test_removing_sunny_tulips_keeps_rose_bouquet(page: Page):
          page.goto("/cart")
          page.locator("tr:nth-child(2) .link-btn").click()
          expect(page.get_by_test_id("cart-row")).to_have_count(1)
          expect(page.get_by_test_id("cart-row")).to_contain_text("Rose Bouquet")
    solution: |
      from playwright.sync_api import Page, expect


      def test_removing_sunny_tulips_keeps_rose_bouquet(page: Page):
          page.goto("/cart")
          page.get_by_role("row").filter(has_text="Sunny Tulips").get_by_role("button", name="Remove").click()
          expect(page.get_by_test_id("cart-row")).to_have_count(1)
          expect(page.get_by_test_id("cart-row")).to_contain_text("Rose Bouquet")
    checks:
      expect: pass
      also:
        - app: { variant: redesign, state: { cart: [{ id: rose-bouquet, qty: 1 }, { id: sunny-tulips, qty: 1 }] } }
          expect: pass
      static: [hasAssertion, noFragile]
    hints:
      - en: "Describe the row the way a user would — by its product, not by its position."
        ru: "Опиши строку так, как сказал бы пользователь, — по товару, а не по позиции."
      - en: "Every row has a “Remove” button: find the row first, then the button inside it."
        ru: "В каждой строке есть кнопка «Remove»: сначала найди строку, потом кнопку внутри неё."
      - en: 'For example: `page.get_by_role("row").filter(has_text="Sunny Tulips").get_by_role("button", name="Remove")`'
        ru: 'Например: `page.get_by_role("row").filter(has_text="Sunny Tulips").get_by_role("button", name="Remove")`'
    explain:
      en: "The new locator says what a user would say: “the Remove button in the Sunny Tulips row”. It doesn't depend on class names or on the row order, so it also passed on the redesign."
      ru: "Новый локатор говорит то, что сказал бы пользователь: «кнопка Remove в строке Sunny Tulips». Он не зависит ни от имён классов, ни от порядка строк, поэтому прошёл и на редизайне."

  - id: c5-l4-k8
    kind: choice
    keyPoint: kp-snapshot-not-memory
    prompt:
      en: "Petal has never seen Bloomly's orders page. Which line in your prompt is most likely to give you correct locators?"
      ru: "Petal ни разу не видел страницу заказов Bloomly. Какая строка в промпте вероятнее всего даст правильные локаторы?"
    options:
      - text: "Open /orders with Playwright MCP and take every locator from the accessibility snapshot. Don't guess names."
        correct: true
        why:
          en: "The names come from the live page, so they're real."
          ru: "Имена приходят с живой страницы, поэтому они настоящие."
      - text: "Use the standard names for an orders page."
        why:
          en: "“Standard” means “from other sites” — a recipe for invented names."
          ru: "«Стандартные» значит «с других сайтов» — верный путь к выдуманным именам."
      - text: "Be careful with locators, they must be correct."
        why:
          en: "Nothing to act on: Petal has no idea what “correct” means here."
          ru: "Тут нечего выполнять: Petal не знает, что здесь значит «правильные»."
      - text: "Copy the locators from index.html in the repository."
        why:
          en: "Bloomly's index.html has an empty `<main>`: JavaScript builds the page. The file doesn't show the real elements — the live page does."
          ru: "В index.html у Bloomly пустой `<main>`: страницу строит JavaScript. Файл не показывает настоящих элементов — их показывает живая страница."
    hints:
      - en: "Which line points Petal to the real page?"
        ru: "Какая строка отправляет Petal к настоящей странице?"
      - en: "Remember chapter 4: the HTML file and the live DOM are not the same."
        ru: "Вспомни главу 4: HTML-файл и живой DOM — не одно и то же."
    explain:
      en: "Agents guess when they can't see. Point them at the live page and name the source of truth — the accessibility snapshot — and the guessing stops."
      ru: "Агенты угадывают, когда не видят. Отправь их на живую страницу и назови источник истины — снимок доступности, — и угадывание прекратится."
