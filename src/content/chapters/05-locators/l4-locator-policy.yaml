      ru: "Пройдёт или упадёт?"
    code: |
      from playwright.sync_api import Page, expect


      def test_personal_account_is_the_default_type(page: Page):
          page.goto("/signup")
          expect(page.get_by_role("radio", name="Private customer")).to_be_checked()
    outcome: fail
