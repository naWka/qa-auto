    explain:
      en: 'The default is right, but the test never reaches it: no radio is named “Private customer”, so the assertion times out. The snapshot shows `radio "Personal" [checked]` — one look would have fixed it.'
      ru: 'По умолчанию всё правильно, но тест до этого не доходит: радиокнопки с именем «Private customer» нет, и проверка падает по таймауту. В снимке видно `radio "Personal" [checked]` — одного взгляда хватило бы.'

