        correct: true
        why:
          en: "A name from other sites. The style is right; the name is invented — the click times out."
          ru: "Имя с других сайтов. Стиль правильный, а имя выдумано — клик упадёт по таймауту."
      - text: { en: "`get_by_role` is an invented method.", ru: "`get_by_role` — выдуманный метод." }
        why:
          en: "It's real — the top of the locator ladder."
          ru: "Он настоящий — верхняя ступенька лесенки локаторов."
      - text: { en: "Nothing — get_by_role is the most resilient locator.", ru: "Ничего — get_by_role самый устойчивый локатор." }
        why:
