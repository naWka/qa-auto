          message:
            en: "Done! Six buttons are called “Add to cart”, so — as CLAUDE.md says — I added `.first`. Red ❌: the toast says “Rose Bouquet added to cart”. Maybe TC-566 is outdated and I should expect Rose Bouquet?"
            ru: "Готово! Кнопок «Add to cart» шесть, поэтому — как сказано в CLAUDE.md — я добавил `.first`. Красный ❌: уведомление говорит «Rose Bouquet added to cart». Может, TC-566 устарел и ожидать надо Rose Bouquet?"
          code: |
            from playwright.sync_api import Page, expect


            def test_adding_sunny_tulips_updates_the_cart(page: Page):
