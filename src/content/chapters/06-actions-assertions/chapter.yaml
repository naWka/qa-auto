id: c6
number: 6
status: planned
title: { en: "Actions and assertions", ru: "Действия и проверки" }
department: { en: "Checkout", ru: "Оформление заказа" }
color: butter
summary:
  en: "Fill forms, click, tick checkboxes and pick options on the Bloomly checkout — and, most importantly, check the right thing. You will learn web-first assertions with `expect()`, spot the weak checks AI agents like to write — `assert x.is_visible()`, an `assert` on a locator that is always true — and turn the expected result of a test case into a precise assertion."
  ru: "Заполняем формы, кликаем, ставим галочки и выбираем варианты на оформлении заказа Bloomly — и, главное, проверяем то, что нужно. Ты освоишь web-first проверки через `expect()`, научишься замечать слабые проверки, которые любят писать ИИ-агенты, — `assert x.is_visible()`, `assert` на локатор, который истинен всегда, — и превращать ожидаемый результат тест-кейса в точную проверку."
intro:
  - who: sofia
    text:
      en: "Checkout is where we make money. If \"Place order\" breaks before the holidays, I want to know before our customers do."
      ru: "Оформление заказа — это то, где мы зарабатываем. Если «Place order» сломается перед праздниками, я хочу узнать об этом раньше клиентов."
  - who: petal
    text:
      en: "I wrote 12 checkout tests overnight. All green! Each one checks that the page has a button."
      ru: "За ночь я написал 12 тестов на оформление заказа. Все зелёные! Каждый проверяет, что на странице есть кнопка."
  - who: maya
    text:
      en: "All green and checking almost nothing. The value of a test is in its assertion — and you already know what to assert: it's in your expected results."
      ru: "Все зелёные и почти ничего не проверяют. Ценность теста — в его проверке, а что проверять, ты уже знаешь: это написано в твоих ожидаемых результатах."
plan:
  - title: { en: "Actions: fill, click, check, select_option, press", ru: "Действия: fill, click, check, select_option, press" }
    goal:
      en: "Match checkout steps to the right action: type the address, pick a city, choose a delivery time, tick \"This is a gift\" — and explain why each line waits for its action on its own."
      ru: "Сопоставлять шаги оформления заказа с нужным действием: ввести адрес, выбрать город, выбрать время доставки, отметить «This is a gift», — и объяснять, почему каждая строка сама дожидается своего действия."
    keyPoints:
      - en: "fill types into a field, click presses, check ticks a checkbox or a radio button, select_option picks from a dropdown — by value or text, `label=` or `index=` — and press sends a key such as Enter."
        ru: "fill вводит текст в поле, click нажимает, check отмечает чекбокс или радиокнопку, select_option выбирает вариант из выпадающего списка — по значению или тексту, `label=` или `index=`, — а press нажимает клавишу, например Enter."
      - en: "There is no `await` in a Python test: each line finishes its action before the next line runs."
        ru: "В тесте на Python нет `await`: каждая строка доводит своё действие до конца, и только потом выполняется следующая."
      - en: "Before acting, Playwright checks the element is actionable: visible, enabled, not covered. A disabled \"Add to cart\" can't be clicked — the step waits and fails on the timeout."
        ru: "Перед действием Playwright проверяет, что с элементом можно работать: он видим, активен и ничем не закрыт. По неактивной кнопке «Add to cart» кликнуть нельзя — шаг ждёт и падает по тайм-ауту."
      - en: "Agents sometimes click a dropdown instead of choosing an option, or call fill on a checkbox — check that the action fits the element."
        ru: "Агенты иногда кликают по выпадающему списку вместо выбора варианта или вызывают fill на чекбоксе — проверяй, что действие подходит элементу."
  - title: { en: "Web-first assertions", ru: "Web-first проверки" }
    goal:
      en: "Explain why `expect(locator).to_be_visible()` waits and retries, while `assert locator.is_visible()` checks only once."
      ru: "Объяснять, почему `expect(locator).to_be_visible()` ждёт и повторяет проверку, а `assert locator.is_visible()` проверяет только один раз."
    keyPoints:
      - en: "Web-first assertions retry until the condition is true or the timeout ends (5 seconds by default); `timeout=` changes it for one check."
        ru: "Web-first проверки повторяются, пока условие не выполнится или не истечёт тайм-аут (по умолчанию 5 секунд); `timeout=` меняет его для одной проверки."
      - en: "`assert locator.is_visible()` looks at the page once: if the app is a little slow, the test fails at random. It's a classic AI pattern — rewrite it as `expect(locator).to_be_visible()`."
        ru: "`assert locator.is_visible()` смотрит на страницу один раз: если приложение чуть притормозит, тест упадёт случайно. Это классический шаблон ИИ — переписывай его как `expect(locator).to_be_visible()`."
      - en: "Two traps that pass even on a broken page: `assert page.get_by_text(\"Saved\")` is always true — a locator describes a search, it isn't the found element — and `expect(x).to_be_visible` without `()` checks nothing."
        ru: "Две ловушки, которые проходят даже на сломанной странице: `assert page.get_by_text(\"Saved\")` истинно всегда — локатор описывает поиск, а не найденный элемент, — а `expect(x).to_be_visible` без `()` ничего не проверяет."
  - title: { en: "What exactly to assert", ru: "Что именно проверять" }
    goal:
      en: "Turn the expected result of a test case into an assertion that would catch the bug: exact text, value, count, state or URL."
      ru: "Превращать ожидаемый результат тест-кейса в проверку, которая поймает баг: точный текст, значение, количество, состояние или URL."
    keyPoints:
      - en: "Assert the outcome from the expected result, not just that something exists: to_have_text, to_have_value, to_have_count, to_be_checked, to_have_url — and `not_to_be_visible()` for what must disappear."
        ru: "Проверяй результат из ожидаемого результата, а не просто наличие элемента: to_have_text, to_have_value, to_have_count, to_be_checked, to_have_url — и `not_to_be_visible()` для того, что должно исчезнуть."
      - en: "to_have_text compares the whole text, to_contain_text only a part. For a URL with a changing order id, match part of it: `expect(page).to_have_url(re.compile(r\"/order-confirmation\"))`."
        ru: "to_have_text сравнивает весь текст, to_contain_text — только его часть. Для URL с меняющимся номером заказа сверяй часть адреса: `expect(page).to_have_url(re.compile(r\"/order-confirmation\"))`."
      - en: "The weak-assertion test: would this test still pass if the bug were there? If yes, it checks too little."
        ru: "Тест на слабую проверку: прошёл бы тест, если бы баг был на месте? Если да — он проверяет слишком мало."
      - en: "AI agents assert what they see on the page right now, bugs included. You assert what should be there."
        ru: "ИИ-агенты проверяют то, что видят на странице прямо сейчас, — вместе с багами. Ты проверяешь то, что должно там быть."
  - title: { en: "Reviewing an agent's checks", ru: "Ревью проверок от агента" }
    goal:
      en: "Review an agent's checkout test against the test case: find the weak checks, put several assertions in a sensible order and decide when to split a test."
      ru: "Проверять тест оформления заказа от агента по тест-кейсу: находить слабые проверки, выстраивать несколько проверок в разумном порядке и решать, когда тест лучше разделить."
    keyPoints:
      - en: "Typical weak checks from agents: presence instead of a value, a one-off `assert x.is_visible()`, an always-true `assert locator`, a matcher without `()`, an expected value copied from a buggy screen."
        ru: "Типичные слабые проверки от агентов: наличие вместо значения, разовое `assert x.is_visible()`, всегда истинное `assert locator`, проверка без `()`, ожидаемое значение, списанное с экрана с багом."
      - en: "The first failed assertion stops the test, and the checks after it don't run. Playwright for Python has no soft assertions (the pytest-check plugin adds them), so order checks by importance: the precondition first, then the main result."
        ru: "Первая упавшая проверка останавливает тест, и проверки после неё не выполняются. В Playwright для Python нет мягких проверок (их добавляет плагин pytest-check), поэтому выстраивай проверки по важности: сначала предусловие, потом главный результат."
      - en: "Independent values — subtotal, delivery, total — can live in separate tests: then one run shows every wrong value at once."
        ru: "Независимые значения — подытог, доставку, итог — можно разнести по отдельным тестам: тогда один прогон покажет все неверные значения сразу."
      - en: "Review against the test case: every step has an action that fits its element, every expected result has a precise assertion."
        ru: "Проверяй по тест-кейсу: у каждого шага есть действие, подходящее элементу, у каждого ожидаемого результата — точная проверка."
