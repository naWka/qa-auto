id: c8
number: 8
status: planned
title: { en: "Test plans and AI agents", ru: "Тест-планы и ИИ-агенты" }
department: { en: "QA Guild", ru: "QA-гильдия" }
color: rose
summary:
  en: "Run the full plan → generate → heal loop with agents you set up yourself. Playwright's own Test Agents work only with its JavaScript runner, so in a Python project you build the same three roles: a planner that explores Bloomly and writes a Markdown test plan, a generator that turns it into pytest tests, a healer that keeps them running. You own the plan, the project rules and every review gate in between — the agents do the typing. Docs: https://playwright.dev/docs/getting-started-mcp and https://code.claude.com/docs/en/sub-agents"
  ru: "Проводим полный цикл «план → генерация → лечение» с агентами, которых ты настраиваешь сам{а|}. Собственные Test Agents у Playwright работают только с его JavaScript-раннером, поэтому в Python-проекте ты собираешь те же три роли: планировщик исследует Bloomly и пишет тест-план в Markdown, генератор превращает его в тесты на pytest, хилер поддерживает их в рабочем состоянии. За тобой — план, правила проекта и каждая точка проверки между этапами, а код набирают агенты. Документация: https://playwright.dev/docs/getting-started-mcp и https://code.claude.com/docs/en/sub-agents"
intro:
  - who: maya
    text:
      en: "Welcome to the QA Guild. Today you stop prompting test by test and start running a process."
      ru: "Добро пожаловать в QA-гильдию. Сегодня ты перестаёшь писать промпты на каждый тест и начинаешь управлять процессом."
  - who: petal
    text:
      en: "Give me a planner, a generator and a healer, and I'll write 400 test cases for Bloomly by lunch!"
      ru: "Дайте мне планировщика, генератора и хилера — и я напишу 400 тест-кейсов для Bloomly к обеду!"
  - who: leo
    text:
      en: "Please don't. I need 50 that matter, not 400 that someone has to read."
      ru: "Пожалуйста, не надо. Мне нужны 50 важных, а не 400, которые кому-то придётся читать."
  - who: maya
    text:
      en: "Exactly. A test plan is test design, and test design is your job. Petal explores and drafts; you decide what's worth checking."
      ru: "Вот именно. Тест-план — это тест-дизайн, а тест-дизайн — твоя работа. Petal исследует и делает черновик, а ты решаешь, что стоит проверять."
plan:
  - title: { en: "A Markdown test plan is your test case", ru: "Тест-план в Markdown — это твой тест-кейс" }
    goal:
      en: "Read and edit a Markdown test plan for the Bloomly cart — scenarios, steps, expected results — and add the risks the agent missed."
      ru: "Читать и править тест-план в Markdown для корзины Bloomly — сценарии, шаги, ожидаемые результаты — и добавлять риски, которые агент пропустил."
    keyPoints:
      - en: "The planner explores the live app and saves a plan to `specs/` — numbered scenarios with steps and expected results."
        ru: "Планировщик исследует живое приложение и сохраняет план в `specs/` — пронумерованные сценарии с шагами и ожидаемыми результатами."
      - en: "It's the same test case you write by hand, just in a file the generator can read."
        ru: "Это тот же тест-кейс, который ты пишешь руками, только в файле, который может прочитать генератор."
      - en: "The agent covers the happy path well and misses risks: boundaries, negative cases, the €50 free-delivery threshold. Adding them is your job."
        ru: "Агент хорошо покрывает позитивный сценарий и пропускает риски: границы, негативные случаи, порог бесплатной доставки в €50. Добавить их — твоя работа."
      - en: "Editing the plan is the cheapest place to fix the tests — no code exists yet."
        ru: "Правка плана — самое дешёвое место, чтобы исправить тесты: кода ещё нет."
  - title: { en: "Planner, generator, healer — your own agents", ru: "Планировщик, генератор, хилер — твои собственные агенты" }
    goal:
      en: "Set up the three roles as your own agents and name what goes in and what comes out at each step, including the seed test."
      ru: "Настроить три роли как собственных агентов и называть, что входит и что выходит на каждом шаге, включая seed-тест."
    keyPoints:
      - en: "Playwright's `npx playwright init-agents` creates these agents only for JavaScript and TypeScript (the JS version: https://playwright.dev/docs/test-agents). In Python you describe the roles yourself — for example as Claude Code subagents in `.claude/agents/*.md` or as Copilot custom agents."
        ru: "Команда `npx playwright init-agents` создаёт таких агентов только для JavaScript и TypeScript (JS-версия: https://playwright.dev/docs/test-agents). В Python роли описываешь ты сам{а|} — например, как сабагентов Claude Code в `.claude/agents/*.md` или как пользовательских агентов Copilot."
      - en: "Each agent explores the live app through Playwright MCP or the Playwright CLI and runs the tests with `pytest`."
        ru: "Каждый агент исследует живое приложение через Playwright MCP или Playwright CLI и запускает тесты через `pytest`."
      - en: "Planner: app + seed test → Markdown plan. Generator: plan → `tests/test_*.py`, checking locators on the live app. Healer: failing test + error → a fix, or `xfail` and a bug report."
        ru: "Планировщик: приложение + seed-тест → план в Markdown. Генератор: план → `tests/test_*.py`, сверяя локаторы с живым приложением. Хилер: упавший тест + ошибка → исправление или `xfail` и баг-репорт."
      - en: "The seed test (`tests/test_seed.py` with fixtures from `conftest.py`) sets up the starting point — logged in, cart filled — and shows the agents your style."
        ru: "Seed-тест (`tests/test_seed.py` с фикстурами из `conftest.py`) готовит стартовую точку — вход выполнен, корзина заполнена — и показывает агентам твой стиль."
  - title: { en: "Project rules for the agent", ru: "Правила проекта для агента" }
    goal:
      en: "Write a short rules file (CLAUDE.md or .github/copilot-instructions.md) with the stack, a locator policy, assertion rules and naming conventions."
      ru: "Написать короткий файл правил (CLAUDE.md или .github/copilot-instructions.md): стек, политика локаторов, правила проверок и соглашения об именах."
    keyPoints:
      - en: "The agent reads the rules file at the start of every session — it's a standing prompt for the whole team."
        ru: "Агент читает файл правил в начале каждой сессии — это постоянный промпт для всей команды."
      - en: "Name the stack first — pytest + pytest-playwright, sync API, no `await` — so the agent doesn't slip into JavaScript."
        ru: "Первым делом назови стек — pytest + pytest-playwright, синхронный API, без `await`, — чтобы агент не сбивался на JavaScript."
      - en: "Good rules are short and checkable: \"Use get_by_role and get_by_label. No wait_for_timeout or time.sleep. Every test checks the expected result with expect().\""
        ru: "Хорошие правила короткие и проверяемые: «Use get_by_role and get_by_label. No wait_for_timeout or time.sleep. Every test checks the expected result with expect().»"
      - en: "When review finds the same mistake twice, add a rule instead of fixing it by hand forever."
        ru: "Если ревью находит одну и ту же ошибку дважды, добавь правило, а не исправляй её руками каждый раз."
  - title: { en: "Iterate and gate", ru: "Итерации и точки контроля" }
    goal:
      en: "Run a plan → generate → review → heal loop with clear human review gates, and give the agent precise feedback."
      ru: "Проводить цикл «план → генерация → ревью → лечение» с понятными точками ручной проверки и давать агенту точную обратную связь."
    keyPoints:
      - en: "Three gates: approve the plan, review the generated code, review every heal."
        ru: "Три точки контроля: утвердить план, проверить сгенерированный код, проверить каждое исправление от хилера."
      - en: "Give feedback like in a code review: which line, what's wrong, what you expect — not \"make it better\"."
        ru: "Давай обратную связь как в код-ревью: какая строка, что не так, чего ты ждёшь, — а не «сделай лучше»."
      - en: "A green run is not the finish line: make sure each test turns red when its bug comes back."
        ru: "Зелёный прогон — не финиш: убедись, что каждый тест покраснеет, если его баг вернётся."
      - en: "You stay accountable for the suite. The agent is a fast pair, not the owner."
        ru: "Ответственность за набор тестов остаётся на тебе. Агент — быстрый напарник, а не владелец."
