id: c9
number: 9
status: planned
title: { en: "Test architecture", ru: "Архитектура тестов" }
department: { en: "Architecture", ru: "Архитектура" }
color: peach
summary:
  en: "Organize a growing suite so it stays readable: test files and classes, isolated tests, fixtures in conftest.py, Page Objects and test data with parametrize. Agents happily build this structure for you — you will learn to read it, keep it tidy and ask for the right refactoring when it starts to rot."
  ru: "Наводим порядок в растущем наборе тестов, чтобы его было легко читать: тестовые файлы и классы, изолированные тесты, фикстуры в conftest.py, Page Object и тестовые данные с parametrize. Агенты охотно построят эту структуру за тебя — ты научишься её читать, поддерживать в порядке и просить правильный рефакторинг, когда она начнёт портиться."
intro:
  - who: leo
    text:
      en: "We have 180 tests now. Kai renamed one button, and 40 tests went red."
      ru: "У нас уже 180 тестов. Кай переименовал одну кнопку — и покраснели 40 тестов."
  - who: kai
    text:
      en: "In my defense, \"Log in\" became \"Sign in\" in exactly one place."
      ru: "В свою защиту: «Log in» стало «Sign in» ровно в одном месте."
  - who: petal
    text:
      en: "And I had copied that login code into all 40 tests. It was faster!"
      ru: "А я скопировал этот код входа во все 40 тестов. Так было быстрее!"
  - who: maya
    text:
      en: "Faster to write, slower to fix. Let's give the suite an architecture: one place for each thing that can change."
      ru: "Быстрее написать, дольше чинить. Дадим набору тестов архитектуру: по одному месту для каждой вещи, которая может измениться."
plan:
  - title: { en: "Test files, classes and isolation", ru: "Тестовые файлы, классы и изоляция" }
    goal:
      en: "Group tests into files and classes like `class TestCart:`, and spot tests that depend on each other."
      ru: "Группировать тесты по файлам и классам вроде `class TestCart:` и замечать тесты, которые зависят друг от друга."
    keyPoints:
      - en: "A test file groups tests like a section in TestRail; `class TestCart:` makes a smaller group inside it, and each test is a method that takes `self` and `page`."
        ru: "Тестовый файл группирует тесты, как раздел в TestRail; `class TestCart:` создаёт внутри него группу поменьше, а каждый тест — это метод, который получает `self` и `page`."
      - en: "pytest finds tests by name on its own: `test_*.py` files, `test_…` functions and the `test_…` methods of `Test…` classes."
        ru: "pytest сам находит тесты по именам: файлы `test_*.py`, функции `test_…` и методы `test_…` в классах `Test…`."
      - en: "Each test gets a fresh page and browser context: logged out, empty cart. Nothing carries over from the test before."
        ru: "Каждый тест получает новую страницу и чистый контекст браузера: вход не выполнен, корзина пуста. От предыдущего теста ничего не остаётся."
      - en: "A test that needs another test to run first is a bug in the suite. Run it alone — `pytest tests/test_cart.py::TestCart::test_remove_item` — it must pass."
        ru: "Тест, которому нужно, чтобы сначала прошёл другой тест, — это баг в наборе. Запусти его отдельно — `pytest tests/test_cart.py::TestCart::test_remove_item`, — он должен пройти."
  - title: { en: "Fixtures and conftest.py", ru: "Фикстуры и conftest.py" }
    goal:
      en: "Read a fixture such as `logged_in_page` and explain what it prepares before each test and cleans up after it."
      ru: "Читать фикстуру, например `logged_in_page`, и объяснять, что она готовит перед каждым тестом и что убирает после него."
    keyPoints:
      - en: "`@pytest.fixture` is a reusable precondition: a test asks for it by name in its parameters, and pytest passes it in — just like `page`."
        ru: "`@pytest.fixture` — переиспользуемое предусловие: тест просит его по имени в своих параметрах, и pytest передаёт его — так же, как `page`."
      - en: "Code before `yield` is the setup, code after it is the teardown — preconditions and cleanup in one place."
        ru: "Код до `yield` — подготовка, код после него — очистка: предусловия и уборка в одном месте."
      - en: "Scope decides how often a fixture runs: `function` (the default) for every test, `session` once per run — say, for an API token. `autouse=True` applies a fixture to every test without asking."
        ru: "Область действия (scope) решает, как часто запускается фикстура: `function` (по умолчанию) — для каждого теста, `session` — один раз за прогон, например для API-токена. `autouse=True` применяет фикстуру ко всем тестам без запроса."
      - en: "Shared fixtures live in `conftest.py`: every test in the folder can use them without an import."
        ru: "Общие фикстуры живут в `conftest.py`: их может использовать любой тест в папке без импорта."
  - title: { en: "Page Object Model", ru: "Page Object Model" }
    goal:
      en: "Read a `LoginPage` class the agent built, follow a test through it, and update one locator in one place."
      ru: "Читать класс `LoginPage`, который построил агент, прослеживать через него тест и обновлять локатор в одном месте."
    keyPoints:
      - en: "A page object keeps a page's locators and actions in one class: locators in `__init__`, actions as methods like `login_page.log_in(email, password)`."
        ru: "Page object хранит локаторы и действия страницы в одном классе: локаторы — в `__init__`, действия — в методах вроде `login_page.log_in(email, password)`."
      - en: "Tests read like test cases; when \"Log in\" becomes \"Sign in\", you fix one line in `pages/login_page.py`, not 40 tests."
        ru: "Тесты читаются как тест-кейсы; когда «Log in» становится «Sign in», ты правишь одну строку в `pages/login_page.py`, а не 40 тестов."
      - en: "Assertions usually stay in the test, so the page object doesn't hide what is being checked."
        ru: "Проверки обычно остаются в тесте, чтобы page object не прятал, что именно проверяется."
      - en: "Agents tend to over-engineer: base classes, a wrapper for every click. Ask for the simplest version that works."
        ru: "Агенты любят переусложнять: базовые классы, обёртка для каждого клика. Проси самый простой рабочий вариант."
  - title: { en: "Test data, parametrize and refactoring", ru: "Тестовые данные, parametrize и рефакторинг" }
    goal:
      en: "Turn five copy-pasted promo code tests into one parametrized test, and write a refactoring request the agent can follow safely."
      ru: "Превращать пять скопированных тестов промокодов в один параметризованный тест и писать запрос на рефакторинг, который агент выполнит безопасно."
    keyPoints:
      - en: "`@pytest.mark.parametrize` runs one test body over a table of inputs and expected results — your equivalence classes and boundary values as data."
        ru: "`@pytest.mark.parametrize` прогоняет одно тело теста по таблице входных данных и ожидаемых результатов — твои классы эквивалентности и граничные значения в виде данных."
      - en: "`ids=` gives each row a readable name, so the report shows exactly which case failed: `test_promo_code[expired]`."
        ru: "`ids=` даёт каждой строке понятное имя, поэтому в отчёте видно, какой именно случай упал: `test_promo_code[expired]`."
      - en: "Bigger data lives outside the test: in a dataclass such as `User(email, password, name)` or in a JSON file under `data/`."
        ru: "Данные побольше живут вне теста: в dataclass вроде `User(email, password, name)` или в JSON-файле в папке `data/`."
      - en: "Refactoring changes structure, not behavior: the same tests must pass and fail as before. Ask the agent for small steps and run `pytest` after each one."
        ru: "Рефакторинг меняет структуру, а не поведение: те же тесты должны проходить и падать, как раньше. Проси агента делать небольшие шаги и запускай `pytest` после каждого."
