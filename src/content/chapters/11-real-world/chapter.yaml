id: c11
number: 11
status: planned
title: { en: "The real world", ru: "Реальный мир" }
department: { en: "Release Day", ru: "День релиза" }
color: sky
summary:
  en: "Leave the trainer and set up the real toolkit: Python and pytest-playwright on your computer, VS Code with an AI agent, Playwright MCP or CLI, traces, reports and CI on GitHub Actions. Then do the final project: cover Bloomly with tests together with an agent, review them and publish the repository for your portfolio. Start here: https://playwright.dev/python/docs/intro"
  ru: "Выходим из тренажёра и собираем настоящий набор инструментов: Python и pytest-playwright на твоём компьютере, VS Code с ИИ-агентом, Playwright MCP или CLI, трейсы, отчёты и CI на GitHub Actions. Затем — финальный проект: покрыть Bloomly тестами вместе с агентом, проверить их и опубликовать репозиторий в портфолио. Начни отсюда: https://playwright.dev/python/docs/intro"
intro:
  - who: leo
    text:
      en: "Bloomly 3.0 ships on Friday. Regression used to take three days. Let's see what it takes now."
      ru: "Bloomly 3.0 выходит в пятницу. Раньше регресс занимал три дня. Посмотрим, сколько он займёт теперь."
  - who: maya
    text:
      en: "From here on it's real tools on your own machine. Everything you've learned works there the same way."
      ru: "Дальше — настоящие инструменты на твоём компьютере. Всё, чему ты научил{ась|ся}, там работает точно так же."
  - who: petal
    text:
      en: "I'm ready when you are. You lead, I type."
      ru: "Я готов, когда ты {готова|готов}. Ты ведёшь, я печатаю."
  - who: mochi
    text: { en: "Mrrp!", ru: "Мрр!" }
plan:
  - title: { en: "Your toolkit", ru: "Твой набор инструментов" }
    goal:
      en: "Install Python, pytest-playwright and the browsers, open the project in VS Code, connect an agent and run the first test. Guide: https://playwright.dev/python/docs/intro"
      ru: "Установить Python, pytest-playwright и браузеры, открыть проект в VS Code, подключить агента и запустить первый тест. Инструкция: https://playwright.dev/python/docs/intro"
    keyPoints:
      - en: "Python 3.12 or newer and a virtual environment for each project: `python -m venv .venv`, then activate it (`source .venv/bin/activate`; on Windows `.venv\\Scripts\\activate`) — the project's packages stay inside it."
        ru: "Python 3.12 или новее и виртуальное окружение для каждого проекта: `python -m venv .venv`, затем активируй его (`source .venv/bin/activate`; в Windows — `.venv\\Scripts\\activate`) — пакеты проекта остаются внутри него."
      - en: "`pip install pytest-playwright` installs pytest and Playwright; `playwright install` downloads the browsers."
        ru: "`pip install pytest-playwright` устанавливает pytest и Playwright; `playwright install` скачивает браузеры."
      - en: "VS Code with the Python extension: the Testing panel finds your pytest tests and runs them with one click."
        ru: "VS Code с расширением Python: панель Testing находит твои тесты pytest и запускает их одним кликом."
      - en: "The agent — Claude Code or GitHub Copilot — sees the live page through Playwright MCP or the Playwright CLI. Both need Node.js, even in a Python project."
        ru: "Агент — Claude Code или GitHub Copilot — видит живую страницу через Playwright MCP или Playwright CLI. Обоим нужен Node.js, даже в Python-проекте."
  - title: { en: "Running and configuring", ru: "Запуск и настройка" }
    goal:
      en: "Set up the suite in `pytest.ini`, run exactly the tests you need and read the results."
      ru: "Настроить набор тестов в `pytest.ini`, запускать ровно те тесты, которые нужны, и читать результаты."
    keyPoints:
      - en: "`pytest.ini` holds settings you've been using without seeing them: `addopts = --base-url http://localhost:3000 --tracing retain-on-failure`, plus your markers such as `smoke`."
        ru: "В `pytest.ini` лежат настройки, которыми ты пользовал{ась|ся}, не видя их: `addopts = --base-url http://localhost:3000 --tracing retain-on-failure`, а также твои маркеры, например `smoke`."
      - en: "Tests run headless by default. `pytest --headed` lets you watch, `-k cart` picks tests by name, `-m smoke` by marker, `--browser firefox` runs them in another browser."
        ru: "По умолчанию тесты идут без окна браузера (headless). `pytest --headed` позволяет смотреть, `-k cart` выбирает тесты по имени, `-m smoke` — по маркеру, `--browser firefox` запускает их в другом браузере."
      - en: "`playwright codegen --target python-pytest http://localhost:3000` records your clicks as a pytest test — a quick way to check locators without an agent."
        ru: "`playwright codegen --target python-pytest http://localhost:3000` записывает твои клики как тест pytest — быстрый способ проверить локаторы без агента."
      - en: "The terminal output is your first report; the pytest-html plugin (`pytest --html=report.html`) makes a page you can share."
        ru: "Вывод в терминале — твой первый отчёт; плагин pytest-html (`pytest --html=report.html`) делает страницу, которой можно поделиться."
  - title: { en: "CI on GitHub Actions", ru: "CI в GitHub Actions" }
    goal:
      en: "Run the suite on every push and pull request with GitHub Actions and open the traces of failed tests. Docs: https://playwright.dev/python/docs/ci-intro"
      ru: "Запускать набор тестов на каждый push и pull request через GitHub Actions и открывать трейсы упавших тестов. Документация: https://playwright.dev/python/docs/ci-intro"
    keyPoints:
      - en: "The workflow is a short YAML file in `.github/workflows/`: actions/setup-python, `pip install -r requirements.txt`, `python -m playwright install --with-deps chromium`, `pytest`."
        ru: "Workflow — короткий YAML-файл в `.github/workflows/`: actions/setup-python, `pip install -r requirements.txt`, `python -m playwright install --with-deps chromium`, `pytest`."
      - en: "`requirements.txt` lists the exact package versions, so CI installs the same setup as your computer."
        ru: "`requirements.txt` фиксирует точные версии пакетов, поэтому CI ставит то же самое, что и на твоём компьютере."
      - en: "Upload `test-results/` as an artifact: the traces of failed tests are one click away from the red check."
        ru: "Загружай `test-results/` как артефакт: трейсы упавших тестов — в одном клике от красной проверки."
      - en: "A red CI check on a pull request starts a conversation; it's not a tool for blame."
        ru: "Красная проверка CI в pull request — повод для разговора, а не поиск виноватых."
  - title: { en: "Final project: Bloomly with your agent", ru: "Финальный проект: Bloomly вместе с агентом" }
    goal:
      en: "Start from the Python starter repo, cover Bloomly with a regression suite together with an agent, review it and publish it on GitHub as your portfolio."
      ru: "Взять за основу стартовый Python-репозиторий, покрыть Bloomly регрессионным набором тестов вместе с агентом, проверить его и опубликовать на GitHub как портфолио."
    keyPoints:
      - en: "Start from your test design: pick 10–15 scenarios by risk — login, search, cart, promo codes, checkout, orders."
        ru: "Начни с тест-дизайна: выбери 10–15 сценариев по риску — вход, поиск, корзина, промокоды, оформление, заказы."
      - en: "Let the agent plan and generate; you review every test against your checklist — locators, assertions, waits, isolation — and prove each one can fail."
        ru: "Пусть агент планирует и генерирует, а ты проверяешь каждый тест по своему чек-листу — локаторы, проверки, ожидания, изоляция — и доказываешь, что каждый умеет падать."
      - en: "Keep your rules file in the repository from day one, commit in small steps with clear messages, and open pull requests even when you work alone."
        ru: "Держи файл правил в репозитории с первого дня, делай коммиты небольшими шагами с понятными сообщениями и открывай pull request'ы, даже если работаешь {одна|один}."
      - en: "A portfolio README says what is tested and why, how to run it, which decisions were yours and what the agent did. In interviews, talk about judgment: what you rejected in review, which bug a test caught."
        ru: "README для портфолио рассказывает, что протестировано и почему, как это запустить, что решал{а|} ты и что делал агент. На собеседовании говори о своих решениях: что ты отклонил{а|} на ревью, какой баг поймал тест."
