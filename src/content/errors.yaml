# Notes from static analysis, shown under the report even when tests pass
lint:
  hard-wait:
    en: "Line {line}: a fixed pause (`wait_for_timeout` / `time.sleep`) slows tests down and still flakes. Wait for something visible instead: `expect(locator).to_be_visible()`."
    ru: "Строка {line}: фиксированная пауза (`wait_for_timeout` / `time.sleep`) замедляет тесты и всё равно флакает. Лучше ждать видимого результата: `expect(locator).to_be_visible()`."
  not-called:
    en: "Line {line}: `{call}` is written without `()`, so nothing happens — Python only mentions the method."
    ru: "Строка {line}: `{call}` написан без `()`, поэтому ничего не происходит — Python только упоминает метод."
  no-matcher:
    en: "Line {line}: `expect(…)` without a check after it does nothing. Add a matcher: `.to_be_visible()`, `.to_have_text(…)`."
    ru: "Строка {line}: `expect(…)` без проверки после него ничего не делает. Добавь проверку: `.to_be_visible()`, `.to_have_text(…)`."
  always-true:
    en: "Line {line}: `assert {expr}` always passes — a locator is just a description of how to find an element, and it is never empty. Use `expect(locator).to_be_visible()`."
    ru: "Строка {line}: `assert {expr}` проходит всегда — локатор лишь описывает, как найти элемент, и он никогда не «пустой». Используй `expect(locator).to_be_visible()`."
  no-assertion:
    en: "Test “{title}” has no assertion — it can't catch a bug."
    ru: "В тесте «{title}» нет проверки — он не поймает баг."
  fragile-locator:
    en: "Line {line}: `{selector}` is a CSS selector tied to markup. Prefer get_by_role / get_by_label / get_by_test_id."
    ru: "Строка {line}: `{selector}` — CSS-селектор, привязанный к вёрстке. Лучше get_by_role / get_by_label / get_by_test_id."
  weak-assertion:
    en: "Line {line}: `assert` on `{method}()` checks once and doesn't wait or retry. Use a web-first assertion like `expect(locator).to_be_visible()` or `to_have_text(…)`."
    ru: "Строка {line}: `assert` по `{method}()` проверяет один раз и не ждёт, не повторяет. Используй web-first проверку вроде `expect(locator).to_be_visible()` или `to_have_text(…)`."

# Messages for failed static grading rules (tasks' checks.static)
rules:
  hasAssertion:
    en: "The test has no assertion. Add a check of the expected result."
    ru: "В тесте нет проверки. Добавь проверку ожидаемого результата."
  noHardWait:
    en: "Remove the fixed pause — rely on auto-waiting and web-first assertions."
    ru: "Убери фиксированную паузу — положись на автоожидание и web-first проверки."
  noFragile:
    en: "Replace the CSS selector `{value}` with a user-facing locator."
    ru: "Замени CSS-селектор `{value}` на локатор, понятный пользователю."
  callsMethods:
    en: "`{value}` on line {line} is missing its brackets — without `()` the method doesn't run."
    ru: "У `{value}` на строке {line} не хватает скобок — без `()` метод не выполняется."
  uses:
    en: "The solution should use `{value}`."
    ru: "В решении должно быть `{value}`."
  notUses:
    en: "The solution should not use `{value}`."
    ru: "В решении не должно быть `{value}`."
  regex:
    en: "The code is missing something required."
    ru: "В коде не хватает обязательной части."
  notRegex:
    en: "The code contains something that should be removed."
    ru: "В коде есть то, что нужно убрать."
  minExpects:
    en: "Add more assertions (at least {value})."
    ru: "Добавь больше проверок (минимум {value})."
