# Bilingual explanations for emulator errors and lint notes.
# Placeholders in {braces} come from the error data. RU uses {f|m} gender variants.
errors:
  syntax:
    title: { en: "The code can't be read", ru: "Код не читается" }
    explain: { en: "JavaScript couldn't parse line {line}: “{message}”. Usually it's a missing bracket, quote or comma nearby.", ru: "JavaScript не смог разобрать строку {line}: «{message}». Обычно рядом не хватает скобки, кавычки или запятой." }
  syntax-token:
    title: { en: "Unexpected symbol", ru: "Неожиданный символ" }
    explain: { en: "Something on line {line} is out of place — often a missing `)` or `}`, or an extra comma. Count the brackets: every `(` needs a `)`.", ru: "Что-то на строке {line} стоит не на месте — часто не хватает `)` или `}`, или лишняя запятая. Посчитай скобки: каждой `(` нужна своя `)`." }
  syntax-string:
    title: { en: "A string isn't closed", ru: "Строка не закрыта" }
    explain: { en: "A text in quotes on line {line} has no closing quote. Strings start and end with the same quote: 'Log in'.", ru: "У текста в кавычках на строке {line} нет закрывающей кавычки. Строка начинается и заканчивается одной и той же кавычкой: 'Log in'." }
  syntax-redeclare:
    title: { en: "The same name twice", ru: "Одно имя дважды" }
    explain: { en: "A `const` with this name already exists. Give the second one a different name or reuse the first.", ru: "`const` с таким именем уже есть. Дай второй переменной другое имя или используй первую." }
  async-missing:
    title: { en: "`await` without `async`", ru: "`await` без `async`" }
    explain: { en: "`await` only works inside a function marked `async`. The test header must be `async ({ page }) => { … }`.", ru: "`await` работает только внутри функции с пометкой `async`. Заголовок теста должен быть `async ({ page }) => { … }`." }
  reference:
    title: { en: "Unknown name: {name}", ru: "Неизвестное имя: {name}" }
    explain: { en: "The code uses `{name}`, but nothing with that name exists here. Check the spelling, or whether it was declared (e.g. `{ page }` in the test header).", ru: "Код использует `{name}`, но здесь нет ничего с таким именем. Проверь написание или объявлено ли оно (например, `{ page }` в заголовке теста)." }
  not-a-function:
    title: { en: "There is no method `{method}`", ru: "Метода `{method}` не существует" }
    explain: { en: "`{target}.{method}` doesn't exist in Playwright. It's either a typo (methods are case-sensitive) or an invented method — a classic AI hallucination.{suggestion}", ru: "`{target}.{method}` в Playwright не существует. Это либо опечатка (регистр букв важен), либо выдуманный метод — классическая галлюцинация ИИ.{suggestion}" }
  read-undefined:
    title: { en: "Something is undefined", ru: "Что-то не определено" }
    explain: { en: "The code tried to use `.{prop}` on something empty (undefined). Often a variable wasn't passed in, or a property name is misspelled.", ru: "Код попытался взять `.{prop}` у пустого значения (undefined). Часто переменную не передали или опечатались в имени свойства." }
  type-error:
    title: { en: "Wrong kind of value", ru: "Не тот тип значения" }
    explain: { en: "A value was used in a way it doesn't support. Look at the line and check what each name contains.", ru: "Значение использовали так, как оно не умеет. Посмотри на строку и проверь, что лежит в каждом имени." }
  strict-mode:
    title: { en: "The locator matches {count} elements", ru: "Локатор нашёл {count} элемента(ов)" }
    explain: { en: "Playwright refuses to guess which of the {count} elements you meant (strict mode). Make the locator more specific — the error lists each element with a better locator after “aka”.", ru: "Playwright не угадывает, какой из {count} элементов ты имел{а|} в виду (strict mode). Сделай локатор точнее — в ошибке у каждого элемента после «aka» есть подсказка получше." }
  action-timeout:
    title: { en: "Element not found", ru: "Элемент не найден" }
    explain: { en: "Playwright waited {timeout} ms for `{locator}` and never found it. Check the exact text/label on the page — or whether the test is on the right page at this moment.", ru: "Playwright ждал `{locator}` {timeout} мс и так и не нашёл. Проверь точный текст/подпись на странице — и на той ли странице тест в этот момент." }
  action-not-actionable:
    title: { en: "Element found, but not ready", ru: "Элемент найден, но не готов" }
    explain: { en: "`{locator}` exists, but Playwright couldn't act on it: {reason}. Auto-waiting kept retrying until the timeout.", ru: "`{locator}` есть на странице, но Playwright не смог с ним работать: {reason}. Автоожидание повторяло попытки до таймаута." }
  expect-failed:
    title: { en: "Expected ≠ received", ru: "Ожидание ≠ реальность" }
    explain: { en: "The assertion `{matcher}` failed: expected `{expected}`, but the page shows `{received}`. Now triage like a manual tester: is this a bug in the app, or is the test expecting the wrong thing?", ru: "Проверка `{matcher}` не прошла: ожидали `{expected}`, а на странице `{received}`. Дальше — как в ручном тестировании: это баг в приложении или тест ждёт не того?" }
  expect-not-found:
    title: { en: "The element for the check wasn't found", ru: "Элемент для проверки не найден" }
    explain: { en: "The assertion waited for `{locator}`, but no such element appeared. Either the expected text/role is different on the page — or the app really didn't show it (a bug!).", ru: "Проверка ждала `{locator}`, но такой элемент не появился. Либо на странице другой текст/роль — либо приложение действительно его не показало (баг!)." }
  expect-count:
    title: { en: "Wrong number of elements", ru: "Не то количество элементов" }
    explain: { en: "Expected {expected} elements, found {received}. Check filters on the page and what the locator really matches.", ru: "Ожидали {expected} элементов, нашлось {received}. Проверь фильтры на странице и что именно находит локатор." }
  expect-url:
    title: { en: "Wrong page", ru: "Не та страница" }
    explain: { en: "Expected the URL `{expected}`, but the browser is at `{received}`. Did the action really navigate — or did the app redirect somewhere else?", ru: "Ожидали адрес `{expected}`, а браузер на `{received}`. Действие действительно перевело на страницу — или приложение увело в другое место?" }
  expect-generic:
    title: { en: "Values don't match", ru: "Значения не совпали" }
    explain: { en: "`{matcher}` compared two values: expected `{expected}`, received `{received}`. Even one letter, space or case difference counts.", ru: "`{matcher}` сравнил два значения: ожидали `{expected}`, получили `{received}`. Считается даже одна буква, пробел или регистр." }
  matcher-wrong-target:
    title: { en: "This check needs a locator", ru: "Этой проверке нужен локатор" }
    explain: { en: "`{matcher}` works with a {target}, but it got a plain value. Pass the locator itself: `await expect(page.getByText('…')).{matcher}(…)` — not the text you already read.", ru: "`{matcher}` работает с объектом {target}, а получил обычное значение. Передай сам локатор: `await expect(page.getByText('…')).{matcher}(…)` — а не уже прочитанный текст." }
  missing-await:
    title: { en: "A step wasn't awaited", ru: "Шаг без await" }
    explain: { en: "Line {line} starts “{call}” without `await`, so the test didn't wait for it and moved on. In real Playwright this gives random failures — or a green test that checked nothing. Add `await` at the start of the line.", ru: "Строка {line} запускает «{call}» без `await`, поэтому тест не дождался шага и пошёл дальше. В настоящем Playwright это даёт случайные падения — или зелёный тест, который ничего не проверил. Добавь `await` в начало строки." }
  goto-external:
    title: { en: "The emulator only opens Bloomly", ru: "Эмулятор открывает только Bloomly" }
    explain: { en: "`{url}` is outside the app. In the trainer Bloomly lives at http://localhost:3000 — use relative paths like `page.goto('/login')`.", ru: "`{url}` — вне приложения. В тренажёре Bloomly живёт на http://localhost:3000 — используй относительные пути вроде `page.goto('/login')`." }
  goto-invalid:
    title: { en: "Invalid address", ru: "Неверный адрес" }
    explain: { en: "`{url}` isn't a valid URL. Use a path starting with a slash: '/login'.", ru: "`{url}` — некорректный адрес. Используй путь со слешем в начале: '/login'." }
  nav-timeout:
    title: { en: "The page didn't load", ru: "Страница не загрузилась" }
    explain: { en: "Navigation to `{url}` took too long.", ru: "Переход на `{url}` занял слишком много времени." }
  wait-url-timeout:
    title: { en: "Navigation didn't happen", ru: "Перехода не случилось" }
    explain: { en: "The test waited for the URL `{url}`, but stayed at `{actual}`.", ru: "Тест ждал адрес `{url}`, но остался на `{actual}`." }
  wait-timeout:
    title: { en: "Waited too long", ru: "Слишком долгое ожидание" }
    explain: { en: "`{locator}` never became {state}.", ru: "`{locator}` так и не стал {state}." }
  not-input:
    title: { en: "You can't type into this element", ru: "В этот элемент нельзя ввести текст" }
    explain: { en: "`fill` works only with text fields. The locator points to {element} — probably the label or a container, not the input itself.", ru: "`fill` работает только с текстовыми полями. Локатор указывает на {element} — скорее всего, на подпись или контейнер, а не на само поле." }
  fill-number:
    title: { en: "Text in a number field", ru: "Текст в числовом поле" }
    explain: { en: "This field accepts only numbers, but got “{value}”.", ru: "Это поле принимает только числа, а получило «{value}»." }
  fill-date:
    title: { en: "Wrong date format", ru: "Неверный формат даты" }
    explain: { en: "Date fields need the format YYYY-MM-DD, e.g. '2026-12-24'. Got “{value}”.", ru: "Полям даты нужен формат ГГГГ-ММ-ДД, например '2026-12-24'. Получено «{value}»." }
  fill-not-string:
    title: { en: "fill needs text", ru: "fill нужен текст" }
    explain: { en: "`fill` takes a string in quotes. Got a {got}. Wrap numbers in quotes: '3'.", ru: "`fill` принимает строку в кавычках, а получил {got}. Числа тоже в кавычки: '3'." }
  not-select:
    title: { en: "Not a dropdown", ru: "Это не выпадающий список" }
    explain: { en: "`selectOption` works only with `<select>`. The locator points to {element}.", ru: "`selectOption` работает только с `<select>`. Локатор указывает на {element}." }
  select-missing:
    title: { en: "No such option", ru: "Нет такого варианта" }
    explain: { en: "The dropdown has no option {value}. Available: {available}. Options match by value or by visible text.", ru: "В списке нет варианта {value}. Есть: {available}. Вариант ищется по value или по видимому тексту." }
  not-checkbox:
    title: { en: "Not a checkbox", ru: "Это не чекбокс" }
    explain: { en: "`check`/`uncheck` work only with checkboxes and radio buttons. The locator points to {element}.", ru: "`check`/`uncheck` работают только с чекбоксами и радиокнопками. Локатор указывает на {element}." }
  uncheck-radio:
    title: { en: "A radio can't be unchecked", ru: "Радиокнопку нельзя «снять»" }
    explain: { en: "To change a radio group, check another option instead.", ru: "Чтобы поменять выбор в группе радиокнопок, отметь другой вариант." }
  check-no-effect:
    title: { en: "The click didn't change the checkbox", ru: "Клик не поменял чекбокс" }
    explain: { en: "Playwright clicked, but the state stayed the same — something in the app blocks it.", ru: "Playwright кликнул, но состояние не изменилось — что-то в приложении это блокирует." }
  no-tests:
    title: { en: "No tests found", ru: "Тесты не найдены" }
    explain: { en: "The file has no `test('…', async ({ page }) => { … })` call, so there is nothing to run.", ru: "В файле нет вызова `test('…', async ({ page }) => { … })`, поэтому запускать нечего." }
  test-timeout:
    title: { en: "The test took too long", ru: "Тест шёл слишком долго" }
    explain: { en: "The whole test ran longer than {timeout} ms. Look for long waits or an endless loop.", ru: "Весь тест шёл дольше {timeout} мс. Поищи длинные ожидания или бесконечный цикл." }
  fixture-unknown:
    title: { en: "Unknown fixture “{name}”", ru: "Неизвестная фикстура «{name}»" }
    explain: { en: "The test asks for `{ {name} }`, but Playwright doesn't provide it. Built-in fixtures: page, request, baseURL, browserName — or define your own with test.extend.", ru: "Тест просит `{ {name} }`, но Playwright такого не даёт. Встроенные фикстуры: page, request, baseURL, browserName — или объяви свою через test.extend." }
  fixture-destructure:
    title: { en: "Use { page } in the header", ru: "Нужно { page } в заголовке" }
    explain: { en: "Playwright reads fixture names from curly braces: `async ({ page }) => …`. Without braces it can't tell what to pass.", ru: "Playwright читает имена фикстур из фигурных скобок: `async ({ page }) => …`. Без скобок он не знает, что передать." }
  fixture-no-use:
    title: { en: "The fixture didn't call use()", ru: "Фикстура не вызвала use()" }
    explain: { en: "A custom fixture must call `await use(value)` to hand the value to the test.", ru: "Своя фикстура должна вызвать `await use(value)`, чтобы передать значение тесту." }
  page-in-beforeAll:
    title: { en: "No page in beforeAll", ru: "В beforeAll нет page" }
    explain: { en: "`{name}` is created fresh for every test, so it isn't available in `{hook}`. Use beforeEach instead.", ru: "`{name}` создаётся заново для каждого теста, поэтому в `{hook}` его нет. Используй beforeEach." }
  module-not-found:
    title: { en: "File not found: {module}", ru: "Файл не найден: {module}" }
    explain: { en: "The import path doesn't match any file in this task. Check the folder and file name.", ru: "Путь в import не совпадает ни с одним файлом задания. Проверь папку и имя файла." }
  loop-guard:
    title: { en: "Endless loop", ru: "Бесконечный цикл" }
    explain: { en: "A loop ran too many times and was stopped. Check the loop condition.", ru: "Цикл выполнился слишком много раз и был остановлен. Проверь условие цикла." }
  unsupported:
    title: { en: "Not available in the trainer", ru: "Недоступно в тренажёре" }
    explain: { en: "This works in real Playwright, but the browser emulator doesn't support it.", ru: "В настоящем Playwright это работает, но эмулятор браузера этого не умеет." }
  test-inside-test:
    title: { en: "test() inside a test", ru: "test() внутри теста" }
    explain: { en: "Tests are declared at the top level or inside test.describe — not inside another test or hook.", ru: "Тесты объявляют на верхнем уровне или внутри test.describe — не внутри другого теста или хука." }
  test-title:
    title: { en: "The test needs a title", ru: "Тесту нужно название" }
    explain: { en: "The first argument of test() is its title in quotes.", ru: "Первый аргумент test() — название в кавычках." }
  test-fn:
    title: { en: "The test needs a body", ru: "Тесту нужно тело" }
    explain: { en: "After the title comes the function with steps: `async ({ page }) => { … }`.", ru: "После названия идёт функция с шагами: `async ({ page }) => { … }`." }
  describe-async:
    title: { en: "describe must not be async", ru: "describe не должен быть async" }
    explain: { en: "Remove `async` from the test.describe callback.", ru: "Убери `async` из функции внутри test.describe." }
  step-outside:
    title: { en: "test.step outside a test", ru: "test.step вне теста" }
    explain: { en: "test.step() can only be used inside a running test.", ru: "test.step() можно вызывать только внутри теста." }
  expect-outside-test:
    title: { en: "expect outside a test", ru: "expect вне теста" }
    explain: { en: "Assertions run inside test(...).", ru: "Проверки выполняются внутри test(...)." }
  expected-to-fail:
    title: { en: "Expected to fail", ru: "Ожидалось падение" }
    explain: { en: "This test is marked test.fail(), but it passed.", ru: "Тест помечен test.fail(), но прошёл." }
  no-browser:
    title: { en: "No browser here", ru: "Здесь нет браузера" }
    explain: { en: "This task runs without a browser window.", ru: "Это задание выполняется без окна браузера." }
  api-json:
    title: { en: "Empty response", ru: "Пустой ответ" }
    explain: { en: "The response has no body to parse as JSON.", ru: "У ответа нет тела, которое можно разобрать как JSON." }
  closed:
    title: { en: "The test already finished", ru: "Тест уже закончился" }
    explain: { en: "This step ran after the test was over — usually because of a missing await.", ru: "Шаг выполнялся уже после конца теста — обычно из-за пропущенного await." }
  unknown:
    title: { en: "Something went wrong", ru: "Что-то пошло не так" }
    explain: { en: "Read the message above: the first line usually names the problem.", ru: "Прочитай сообщение выше: первая строка обычно называет проблему." }

# Notes from static analysis, shown under the report even when tests pass
lint:
  hard-wait:
    en: "Line {line}: `waitForTimeout` is a hard wait — it slows tests down and still flakes. Wait for something visible instead: `await expect(locator).toBeVisible()`."
    ru: "Строка {line}: `waitForTimeout` — жёсткое ожидание: замедляет тесты и всё равно флакает. Лучше ждать видимого результата: `await expect(locator).toBeVisible()`."
  missing-await:
    en: "Line {line}: `{call}` has no `await`."
    ru: "Строка {line}: у `{call}` нет `await`."
  no-assertion:
    en: "Test “{title}” has no assertion — it can't catch a bug."
    ru: "В тесте «{title}» нет проверки — он не поймает баг."
  fragile-locator:
    en: "Line {line}: `{selector}` is a CSS selector tied to markup. Prefer getByRole / getByLabel / getByTestId."
    ru: "Строка {line}: `{selector}` — CSS-селектор, привязанный к вёрстке. Лучше getByRole / getByLabel / getByTestId."
  weak-assertion:
    en: "Line {line}: `{matcher}` on a one-off check doesn't wait or retry. Use a web-first assertion like `await expect(locator).toBeVisible()`."
    ru: "Строка {line}: `{matcher}` на разовой проверке не ждёт и не повторяет. Используй web-first проверку вроде `await expect(locator).toBeVisible()`."

# Messages for failed static grading rules (tasks' checks.static)
rules:
  hasAssertion:
    en: "The test has no assertion. Add a check of the expected result."
    ru: "В тесте нет проверки. Добавь проверку ожидаемого результата."
  noHardWait:
    en: "Remove `waitForTimeout` — rely on auto-waiting and web-first assertions."
    ru: "Убери `waitForTimeout` — положись на автоожидание и web-first проверки."
  noFragile:
    en: "Replace the CSS selector `{value}` with a user-facing locator."
    ru: "Замени CSS-селектор `{value}` на локатор, понятный пользователю."
  awaitsActions:
    en: "Every Playwright action and assertion needs `await` (see line {line})."
    ru: "Каждому действию и проверке Playwright нужен `await` (см. строку {line})."
  uses:
    en: "The solution should use `{value}`."
    ru: "В решении должно быть `{value}`."
  notUses:
    en: "The solution should not use `{value}`."
    ru: "В решении не должно быть `{value}`."
  regex:
    en: "The code is missing something required."
    ru: "В коде не хватает обязательной части."
  notRegex:
    en: "The code contains something that should be removed."
    ru: "В коде есть то, что нужно убрать."
  minExpects:
    en: "Add more assertions (at least {value})."
    ru: "Добавь больше проверок (минимум {value})."
