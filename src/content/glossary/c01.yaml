# Glossary entries owned by chapter 1 (An automated test through a tester's eyes).
- id: manual-testing
  en: manual testing
  ipa: /ˈmænjuəl ˈtɛstɪŋ/
  ru: ручное тестирование
  pos: noun
  def:
    en: "Testing done by a person who performs the steps and checks the results by hand."
    ru: "Тестирование, при котором человек сам выполняет шаги и проверяет результаты."
  example:
    en: "We keep manual testing for new features and automate the stable regression cases."
    ru: "Ручное тестирование оставляем для новых фич, а стабильные регрессионные кейсы автоматизируем."
  context: meeting
  chapter: 1

- id: test-automation
  en: test automation
  ipa: /tɛst ˌɔːtəˈmeɪʃn/
  ru: автоматизация тестирования
  pos: noun
  def:
    en: "Using code and tools to run checks automatically instead of by hand."
    ru: "Использование кода и инструментов, чтобы проверки выполнялись автоматически, а не руками."
  example:
    en: "Test automation cut our regression from three days to forty minutes."
    ru: "Автоматизация тестирования сократила нашу регрессию с трёх дней до сорока минут."
  context: meeting
  chapter: 1

- id: automated-test
  en: automated test
  ipa: /ˈɔːtəmeɪtɪd tɛst/
  ru: автотест
  pos: noun
  def:
    en: "A test case written as code that a test runner executes: a name (`def test_…`), steps and checks of the expected result."
    ru: "Тест-кейс, записанный кодом, который выполняет тест-раннер: название (`def test_…`), шаги и проверки ожидаемого результата."
  example:
    en: "We added an automated test for the login smoke check yesterday."
    ru: "Вчера мы добавили автотест на смоук-проверку логина."
  context: standup
  chapter: 1

- id: test-case
  en: test case
  ipa: /tɛst keɪs/
  ru: тест-кейс
  pos: noun
  def:
    en: "A documented check: a title, preconditions, steps, test data and the expected result."
    ru: "Задокументированная проверка: название, предусловия, шаги, тестовые данные и ожидаемый результат."
  example:
    en: "Can you link the test case in the pull request? I want to compare the steps."
    ru: "Можешь приложить тест-кейс к пул-реквесту? Хочу сверить шаги."
  context: code-review
  chapter: 1

- id: test-step
  en: test step
  ipa: /tɛst stɛp/
  ru: шаг теста
  pos: noun
  def:
    en: "One action in a test case, like \"Enter email\" or \"Click Log in\". In code, usually one line."
    ru: "Одно действие в тест-кейсе, например «Ввести email» или «Нажать Log in». В коде обычно одна строка."
  example:
    en: "Step 4 is missing in the automated test: it never ticks \"Remember me\"."
    ru: "В автотесте нет шага 4: он ни разу не ставит галочку «Remember me»."
  context: code-review
  chapter: 1

- id: expected-result
  en: expected result
  ipa: /ɪkˈspɛktɪd rɪˈzʌlt/
  ru: ожидаемый результат
  pos: noun
  def:
    en: "What should happen after a step, according to the requirements or the test case."
    ru: "Что должно произойти после шага согласно требованиям или тест-кейсу."
  example:
    en: "Expected result: the account page shows \"Welcome back, Anna!\"."
    ru: "Ожидаемый результат: на странице аккаунта написано «Welcome back, Anna!»."
  context: bug-report
  chapter: 1

- id: actual-result
  en: actual result
  ipa: /ˈæktʃuəl rɪˈzʌlt/
  ru: фактический результат
  pos: noun
  def:
    en: "What really happened when the step was performed. In a Playwright error it is shown as \"Actual value\"."
    ru: "Что на самом деле произошло при выполнении шага. В ошибке Playwright он показан как «Actual value»."
  example:
    en: "Actual result: the heading says \"Welcome back, Silva!\"."
    ru: "Фактический результат: в заголовке написано «Welcome back, Silva!»."
  context: bug-report
  chapter: 1

- id: regression-testing
  en: regression testing
  ipa: /rɪˈɡrɛʃn ˈtɛstɪŋ/
  ru: регрессионное тестирование
  pos: noun
  def:
    en: "Re-checking existing features to make sure new changes didn't break them."
    ru: "Повторная проверка существующих функций, чтобы убедиться, что новые изменения их не сломали."
  example:
    en: "Regression testing takes three days every release — that's what we're automating first."
    ru: "Регрессионное тестирование занимает три дня каждый релиз — его мы и автоматизируем в первую очередь."
  context: meeting
  chapter: 1

- id: test-suite
  en: test suite
  ipa: /tɛst swiːt/
  ru: набор тестов
  pos: noun
  def:
    en: "A group of tests that run together, for example all login tests or the whole regression."
    ru: "Группа тестов, которые запускаются вместе, например все тесты логина или вся регрессия."
  example:
    en: "The login suite has twelve tests; two of them failed last night."
    ru: "В наборе тестов логина двенадцать тестов; два из них упали ночью."
  context: standup
  chapter: 1

- id: test-file
  en: test file
  ipa: /tɛst faɪl/
  ru: файл с тестами (test file)
  pos: noun
  def:
    en: "A Python file with automated tests, such as `tests/test_login.py`. pytest collects files named `test_*.py` and runs every `test_…` function inside them."
    ru: "Python-файл с автотестами, например `tests/test_login.py`. pytest собирает файлы с именами `test_*.py` и запускает каждую функцию `test_…` внутри них."
  example:
    en: "Let's put the signup tests in a separate test file, test_signup.py."
    ru: "Давай вынесем тесты регистрации в отдельный файл, test_signup.py."
  context: code-review
  chapter: 1

- id: test-runner
  en: test runner
  ipa: /tɛst ˈrʌnər/
  ru: тест-раннер
  pos: noun
  def:
    en: "The tool that finds tests, runs them and reports the results. For us it is pytest with the pytest-playwright plugin."
    ru: "Инструмент, который находит тесты, запускает их и сообщает результаты. У нас это pytest с плагином pytest-playwright."
  example:
    en: "The test runner found 40 tests and ran them in three minutes."
    ru: "Тест-раннер нашёл 40 тестов и прогнал их за три минуты."
  context: general
  chapter: 1

- id: action
  en: action
  ipa: /ˈækʃn/
  ru: действие
  pos: noun
  def:
    en: "A command that does something on the page, like a manual step: `fill()`, `click()`, `check()`, `select_option()`."
    ru: "Команда, которая что-то делает на странице, как ручной шаг: `fill()`, `click()`, `check()`, `select_option()`."
  example:
    en: "The action is fine, but the locator points to the wrong button."
    ru: "Действие правильное, но локатор указывает не на ту кнопку."
  context: code-review
  chapter: 1

- id: assertion
  en: assertion
  ipa: /əˈsɜːrʃn/
  ru: проверка (assertion)
  pos: noun
  def:
    en: "A line of code that checks the expected result, for example `expect(page.get_by_role(\"alert\")).to_have_text(\"Invalid email or password.\")`."
    ru: "Строка кода, которая проверяет ожидаемый результат, например `expect(page.get_by_role(\"alert\")).to_have_text(\"Invalid email or password.\")`."
  example:
    en: "The test has no assertion, so it can never fail."
    ru: "В тесте нет проверки, поэтому он никогда не упадёт."
  context: code-review
  chapter: 1

- id: locator
  en: locator
  ipa: /loʊˈkeɪtər/
  ru: локатор
  pos: noun
  def:
    en: "A way to find an element on the page — \"which element\" in a step, for example `page.get_by_label(\"Email\")`."
    ru: "Способ найти элемент на странице — «какой элемент» в шаге, например `page.get_by_label(\"Email\")`."
  example:
    en: "Use a role-based locator for the button, not a CSS class."
    ru: "Для кнопки используй локатор по роли, а не CSS-класс."
  context: code-review
  chapter: 1

- id: test-report
  en: test report
  ipa: /tɛst rɪˈpɔːrt/
  ru: отчёт о тестировании
  pos: noun
  def:
    en: "The results of a test run: which tests passed or failed, with errors and durations."
    ru: "Результаты прогона тестов: какие прошли, какие упали, с ошибками и длительностью."
  example:
    en: "The test report shows one failure, and it's a real bug."
    ru: "В отчёте о тестировании одно падение, и это настоящий баг."
  context: standup
  chapter: 1

- id: pass
  en: pass
  ipa: /pæs/
  ru: пройти (о тесте), зелёный
  pos: verb
  def:
    en: "A test passes when all its steps and assertions succeed. Shown as green, or PASSED in the pytest output."
    ru: "Тест проходит, когда все его шаги и проверки успешны. Показывается зелёным, а в выводе pytest — как PASSED."
  example:
    en: "All login tests pass on staging."
    ru: "На стейджинге все тесты логина проходят."
  context: standup
  chapter: 1

- id: fail
  en: fail
  ipa: /feɪl/
  ru: упасть (о тесте), красный
  pos: verb
  def:
    en: "A test fails when a step or an assertion doesn't succeed. Shown as red, or FAILED in the pytest output."
    ru: "Тест падает, когда шаг или проверка не выполняются. Показывается красным, а в выводе pytest — как FAILED."
  example:
    en: "The checkout test fails because the total is wrong."
    ru: "Тест оформления заказа падает, потому что итоговая сумма неверная."
  context: standup
  chapter: 1

- id: precondition
  en: precondition
  ipa: /ˌpriːkənˈdɪʃn/
  ru: предусловие
  pos: noun
  def:
    en: "What must be true before the test starts, for example \"the user is logged in\"."
    ru: "Что должно быть выполнено до начала теста, например «пользователь вошёл в систему»."
  example:
    en: "Precondition: the cart contains one Rose Bouquet."
    ru: "Предусловие: в корзине лежит один Rose Bouquet."
  context: bug-report
  chapter: 1

- id: test-data
  en: test data
  ipa: /tɛst ˈdeɪtə/
  ru: тестовые данные
  pos: noun
  def:
    en: "The values a test uses: emails, passwords, product names, promo codes."
    ru: "Значения, которые использует тест: email, пароли, названия товаров, промокоды."
  example:
    en: "The test data is wrong: the password should be bloom123."
    ru: "Тестовые данные неверные: пароль должен быть bloom123."
  context: code-review
  chapter: 1

- id: smoke-test
  en: smoke test
  ipa: /smoʊk tɛst/
  ru: смоук-тест
  pos: noun
  def:
    en: "A quick check of the most important features, to see if a build is worth testing further."
    ru: "Быстрая проверка самых важных функций: стоит ли тестировать сборку дальше."
  example:
    en: "The smoke tests are green, so the build is ready for full regression."
    ru: "Смоук-тесты зелёные, значит, сборка готова к полной регрессии."
  context: standup
  chapter: 1

- id: timeout
  en: timeout
  ipa: /ˈtaɪmaʊt/
  ru: тайм-аут
  pos: noun
  def:
    en: "The maximum time to wait for something. When it runs out, the step or assertion fails."
    ru: "Максимальное время ожидания. Когда оно истекает, шаг или проверка падает."
  example:
    en: "The test failed with a timeout: the button never appeared."
    ru: "Тест упал по тайм-ауту: кнопка так и не появилась."
  context: chat
  chapter: 1

- id: bug
  en: bug
  ipa: /bʌɡ/
  ru: баг, дефект
  pos: noun
  def:
    en: "A difference between the expected and the actual behaviour of the app."
    ru: "Расхождение между ожидаемым и фактическим поведением приложения."
  example:
    en: "Bug filed: the account page greets users by their last name."
    ru: "Баг заведён: страница аккаунта приветствует пользователей по фамилии."
  context: bug-report
  chapter: 1

- id: click-through
  en: click through
  ipa: /ˈklɪk θruː/
  ru: прокликать
  pos: phrasal verb
  def:
    en: "To go through screens or test cases by clicking, step by step, usually by hand."
    ru: "Пройти экраны или тест-кейсы, кликая шаг за шагом, обычно вручную."
  example:
    en: "Before the release I had to click through the whole checkout in three browsers."
    ru: "Перед релизом мне пришлось прокликать всё оформление заказа в трёх браузерах."
  context: standup
  chapter: 1

- id: slip-through
  en: slip through
  ipa: /ˈslɪp θruː/
  ru: проскочить (о баге)
  pos: phrasal verb
  def:
    en: "Of a bug: to get past testing unnoticed and reach users."
    ru: "О баге: незаметно пройти мимо тестирования и попасть к пользователям."
  example:
    en: "How did this bug slip through regression?"
    ru: "Как этот баг проскочил через регрессию?"
  context: meeting
  chapter: 1

- id: repetitive
  en: repetitive
  ipa: /rɪˈpɛtətɪv/
  ru: однообразный, повторяющийся
  pos: adjective
  def:
    en: "Done the same way again and again: boring for people, ideal for automation."
    ru: "Повторяющийся раз за разом одинаково: скучно для людей, идеально для автоматизации."
  example:
    en: "Let's give Petal the repetitive checks and keep the new features for people."
    ru: "Давайте отдадим Petal однообразные проверки, а новые фичи оставим людям."
  context: meeting
  chapter: 1

- id: exploratory-testing
  en: exploratory testing
  ipa: /ɪkˈsplɔːrətɔːri ˈtɛstɪŋ/
  ru: исследовательское тестирование
  pos: noun
  def:
    en: "Testing without a fixed script: you learn the feature and invent new checks as you go."
    ru: "Тестирование без готового сценария: изучаешь фичу и придумываешь проверки по ходу."
  example:
    en: "I'll spend an hour on exploratory testing of the new gift-card flow."
    ru: "Час потрачу на исследовательское тестирование нового сценария с подарочными картами."
  context: standup
  chapter: 1

- id: pay-off
  en: pay off
  ipa: /ˌpeɪ ˈɔːf/
  ru: окупаться
  pos: phrasal verb
  def:
    en: "To be worth the time or money spent on it."
    ru: "Оправдать потраченное время или деньги."
  example:
    en: "Automating the banner check won't pay off — it runs only once."
    ru: "Автоматизация проверки баннера не окупится — её запустят всего один раз."
  context: meeting
  chapter: 1

- id: one-off
  en: one-off
  ipa: /ˌwʌn ˈɔːf/
  ru: разовый
  pos: adjective
  def:
    en: "Happening or needed only once."
    ru: "Происходящий или нужный только один раз."
  example:
    en: "It's a one-off check for the holiday banner, so I'll do it by hand."
    ru: "Это разовая проверка праздничного баннера, так что сделаю её руками."
  context: chat
  chapter: 1

- id: vague
  en: vague
  ipa: /veɪɡ/
  ru: размытый, расплывчатый
  pos: adjective
  def:
    en: "Not clear or specific enough to act on."
    ru: "Недостаточно ясный или конкретный, чтобы по нему действовать."
  example:
    en: "\"Test the login\" is too vague — give the agent the steps and the expected result."
    ru: "«Протестируй логин» — слишком размыто: дай агенту шаги и ожидаемый результат."
  context: prompt
  chapter: 1

- id: worth
  en: worth
  ipa: /wɜːrθ/
  ru: стоит (того)
  pos: adjective (worth + -ing)
  def:
    en: "Useful enough to spend time on: \"worth checking\", \"not worth automating\"."
    ru: "Достаточно полезный, чтобы тратить на это время: «стоит проверить», «не стоит автоматизировать»."
  example:
    en: "Is the new filter worth automating, or will it change again next sprint?"
    ru: "Стоит ли автоматизировать новый фильтр, или он опять поменяется в следующем спринте?"
  context: meeting
  chapter: 1

- id: tick
  en: tick
  ipa: /tɪk/
  ru: поставить галочку, отметить
  pos: verb
  def:
    en: "To mark a checkbox (Americans also say \"check\"). In Playwright it's `check()`."
    ru: "Поставить отметку в чекбоксе (в американском английском ещё «check»). В Playwright это `check()`."
  example:
    en: "Step 4 says to tick \"Remember me\", but the test skips it."
    ru: "Шаг 4 велит поставить галочку «Remember me», а тест его пропускает."
  context: code-review
  chapter: 1

- id: fill-in
  en: fill in
  ipa: /ˌfɪl ˈɪn/
  ru: заполнить (форму, поле)
  pos: phrasal verb
  def:
    en: "To complete a form or a field by typing the required information."
    ru: "Ввести нужные данные в форму или поле."
  example:
    en: "Steps to reproduce: fill in the sign-up form and leave Email empty."
    ru: "Шаги воспроизведения: заполнить форму регистрации и оставить Email пустым."
  context: bug-report
  chapter: 1

- id: line-by-line
  en: line by line
  ipa: /ˌlaɪn baɪ ˈlaɪn/
  ru: построчно
  pos: adverb
  def:
    en: "Going through every line in order, without skipping any."
    ru: "Проходя каждую строку по порядку, ничего не пропуская."
  example:
    en: "Compare Petal's test with TC-003 line by line — that's how you find a missing step."
    ru: "Сравни тест Petal с TC-003 построчно — так и находят пропущенный шаг."
  context: code-review
  chapter: 1

- id: swapped
  en: swapped
  ipa: /swɑːpt/
  ru: перепутанный местами
  pos: adjective
  def:
    en: "Put in each other's place by mistake, like two digits or two fields."
    ru: "Ошибочно поменянный местами — например, две цифры или два поля."
  example:
    en: "The digits in the password are swapped: tulips24 instead of tulips42."
    ru: "В пароле цифры перепутаны местами: tulips24 вместо tulips42."
  context: code-review
  chapter: 1

- id: plausible
  en: plausible
  ipa: /ˈplɔːzəbl/
  ru: правдоподобный
  pos: adjective
  def:
    en: "Looking reasonable or true, even when it is wrong."
    ru: "Выглядящий разумным или верным, даже если это ошибка."
  example:
    en: "The agent invented plausible test data: test@example.com doesn't exist in Bloomly."
    ru: "Агент придумал правдоподобные тестовые данные: пользователя test@example.com в Bloomly нет."
  context: code-review
  chapter: 1

- id: happy-path
  en: happy path
  ipa: /ˈhæpi pæθ/
  ru: позитивный сценарий
  pos: noun
  def:
    en: "The main scenario where everything goes right: valid data, no errors."
    ru: "Основной сценарий, в котором всё идёт как надо: верные данные, никаких ошибок."
  example:
    en: "Petal covered only the happy path; the wrong-password case is still missing."
    ru: "Petal покрыл только позитивный сценарий, случая с неверным паролем всё ещё нет."
  context: code-review
  chapter: 1

- id: ambiguous
  en: ambiguous
  ipa: /æmˈbɪɡjuəs/
  ru: неоднозначный
  pos: adjective
  def:
    en: "Having more than one possible meaning or match."
    ru: "Допускающий больше одного толкования или совпадения."
  example:
    en: "The step \"click Log in\" is ambiguous: there are three \"Log in\" elements on the page."
    ru: "Шаг «нажать Log in» неоднозначный: на странице три элемента «Log in»."
  context: code-review
  chapter: 1

- id: outage
  en: outage
  ipa: /ˈaʊtɪdʒ/
  ru: сбой, простой сервиса
  pos: noun
  def:
    en: "A period when a service or a feature doesn't work for users."
    ru: "Период, когда сервис или функция не работает у пользователей."
  example:
    en: "During this morning's outage nobody could log in for an hour."
    ru: "Во время утреннего сбоя целый час никто не мог войти."
  context: standup
  chapter: 1

- id: wording
  en: wording
  ipa: /ˈwɜːrdɪŋ/
  ru: формулировка
  pos: noun
  def:
    en: "The exact words used to say something, for example in a requirement or an expected result."
    ru: "Точные слова, которыми что-то сказано, — например, в требовании или ожидаемом результате."
  example:
    en: "The wording of the expected result is unclear: which error should be shown?"
    ru: "Формулировка ожидаемого результата неясная: какая именно ошибка должна показаться?"
