# Glossary entries owned by chapter 8 (Test plans and AI agents)
- id: test-plan
  en: test plan
  ipa: /ˈtest plæn/
  ru: тест-план (test plan)
  pos: noun
  def:
    en: "A document that lists what will be tested: scenarios with steps and expected results. In the plan → generate → heal loop the planner agent writes it in Markdown, and you review it before any code is generated."
    ru: "Документ со списком того, что будет протестировано: сценарии с шагами и ожидаемыми результатами. В цикле «план → генерация → лечение» его пишет в Markdown агент-планировщик, а ты проверяешь его до того, как будет сгенерирован код."
  example:
    en: "Before we run the generator, let's add the free-delivery boundary to the test plan."
    ru: "Прежде чем запускать генератор, давай добавим в тест-план границу бесплатной доставки."
  context: meeting
  chapter: 8

- id: planner
  en: planner
  ipa: /ˈplænər/
  ru: планировщик (planner)
  pos: noun
  def:
    en: "The agent role that explores the app in a real browser and writes a Markdown test plan into the specs folder. Playwright ships a ready-made planner only for JavaScript/TypeScript; in a Python project you set it up yourself, e.g. as a Claude Code subagent or a Copilot custom agent with Playwright MCP."
    ru: "Роль агента, который исследует приложение в настоящем браузере и пишет тест-план в Markdown в папку specs. Готового планировщика Playwright поставляет только для JavaScript/TypeScript; в Python-проекте его настраивают самостоятельно — например, как сабагента Claude Code или кастомного агента Copilot с Playwright MCP."
  example:
    en: "The planner missed the expired promo code case — please add it to specs/cart.md."
    ru: "Планировщик пропустил случай с просроченным промокодом — добавь его, пожалуйста, в specs/cart.md."
  context: chat
  chapter: 8

- id: generator
  en: generator
  ipa: /ˈdʒenəreɪtər/
  ru: генератор (generator)
  pos: noun
  def:
    en: "The agent role that turns a Markdown test plan into pytest test files, checking locators on the live app through Playwright MCP or CLI. In a Python project it's your own agent with your project rules."
    ru: "Роль агента, который превращает тест-план в Markdown в файлы тестов на pytest, сверяя локаторы с живым приложением через Playwright MCP или CLI. В Python-проекте это твой собственный агент с твоими правилами проекта."
  example:
    en: "The generator used `get_by_text` for the button; our rules say `get_by_role`, so I'll update the rules file."
    ru: "Генератор использовал `get_by_text` для кнопки, а в наших правилах — `get_by_role`, так что я обновлю файл правил."
  context: code-review
  chapter: 8

- id: healer
  en: healer
  ipa: /ˈhiːlər/
  ru: хилер (healer)
  pos: noun
  def:
    en: "The agent role that runs failing tests with pytest, looks for the cause, and repairs the test — or, when the app itself is broken, marks it `@pytest.mark.xfail(reason=\"BUG-123\")` instead of hiding the bug."
    ru: "Роль агента, который запускает упавшие тесты через pytest, ищет причину и чинит тест — а если сломано само приложение, помечает его `@pytest.mark.xfail(reason=\"BUG-123\")`, а не прячет баг."
  example:
    en: "The healer marked the orders filter test as xfail — it's a real bug, not a broken locator."
    ru: "Хилер пометил тест фильтра заказов как xfail — это настоящий баг, а не сломанный локатор."
  context: standup
  chapter: 8

- id: seed-test
  en: seed test
  ipa: /ˈsiːd test/
  ru: seed-тест, стартовый тест (seed test)
  pos: noun
  def:
    en: "A small, working pytest test that prepares the starting state for the agents (for example, logs in) and shows them the project's style: imports, fixtures, locators."
    ru: "Небольшой рабочий тест на pytest, который готовит стартовое состояние для агентов (например, выполняет вход) и показывает им стиль проекта: импорты, фикстуры, локаторы."
  example:
    en: "Update the seed test to log in as Anna first, so the planner can reach the orders page."
    ru: "Обнови seed-тест, чтобы он сначала входил под Анной, — тогда планировщик доберётся до страницы заказов."
  context: chat
  chapter: 8

- id: project-rules
  en: project rules
  ipa: /ˈprɑːdʒekt ruːlz/
  ru: правила проекта (project rules)
  pos: noun
  def:
    en: "A file such as CLAUDE.md or .github/copilot-instructions.md that the agent reads before every task: the stack (pytest, sync API), conventions, locator policy, things to avoid."
    ru: "Файл вроде CLAUDE.md или .github/copilot-instructions.md, который агент читает перед каждой задачей: стек (pytest, sync API), соглашения, политика локаторов, запреты."
  example:
    en: "Add \"No wait_for_timeout or time.sleep\" to the project rules — this is the third PR with a hard wait."
    ru: "Добавь «No wait_for_timeout or time.sleep» в правила проекта — это уже третий PR с жёстким ожиданием."
  context: code-review
  chapter: 8
