# Glossary entries owned by chapter 9 (Test architecture)
- id: test-isolation
  en: test isolation
  ipa: /ˈtest ˌaɪsəˈleɪʃn/
  ru: изоляция тестов (test isolation)
  pos: noun
  def:
    en: "Each test runs on its own, in a fresh browser context, and doesn't depend on other tests or their order."
    ru: "Каждый тест запускается сам по себе, в чистом контексте браузера, и не зависит от других тестов и их порядка."
  example:
    en: "This breaks test isolation: the checkout test expects the cart that the previous test filled."
    ru: "Это нарушает изоляцию тестов: тест оформления ожидает корзину, которую наполнил предыдущий тест."
  context: code-review
  chapter: 9

- id: test-class
  en: test class
  ipa: /ˈtest klæs/
  ru: тестовый класс (test class)
  pos: noun
  def:
    en: "A class whose name starts with Test, like `class TestCart:`, that groups related tests. Each test is a method with `self` as its first parameter, and the report shows it as `test_cart.py::TestCart::test_apply_promo_code`."
    ru: "Класс, имя которого начинается с Test, например `class TestCart:`, — он объединяет связанные тесты. Каждый тест — это метод с `self` первым параметром, а в отчёте он выглядит как `test_cart.py::TestCart::test_apply_promo_code`."
  example:
    en: "Let's put all promo code tests into one test class called TestPromoCodes."
    ru: "Давай сложим все тесты промокодов в один тестовый класс TestPromoCodes."
  context: code-review
  chapter: 9

- id: setup
  en: setup
  ipa: /ˈsetʌp/
  ru: подготовка (setup)
  pos: noun
  def:
    en: "Steps that prepare what a test needs before it starts: a logged-in user, a filled cart, test data. In pytest the setup lives in a fixture — the code before `yield`."
    ru: "Шаги, которые готовят всё нужное до начала теста: пользователя с выполненным входом, заполненную корзину, тестовые данные. В pytest подготовка живёт в фикстуре — это код до `yield`."
  example:
    en: "The setup takes 20 seconds through the UI; let's do it through the API."
    ru: "Подготовка через интерфейс занимает 20 секунд; давай делать её через API."
  context: meeting
  chapter: 9

- id: teardown
  en: teardown
  ipa: /ˈterdaʊn/
  ru: очистка после теста (teardown)
  pos: noun
  def:
    en: "Steps that clean up after a test, such as deleting the data it created, so the next test starts clean. In a pytest fixture the teardown is the code after `yield` — it runs even when the test fails."
    ru: "Шаги, которые убирают за тестом, например удаляют созданные им данные, чтобы следующий тест начинался с чистого листа. В pytest-фикстуре очистка — это код после `yield`; он выполняется, даже если тест упал."
  example:
    en: "The signup test needs a teardown — otherwise the second run fails with \"This email is already registered.\""
    ru: "Тесту регистрации нужна очистка — иначе второй прогон упадёт с «This email is already registered.»"
  context: code-review
  chapter: 9

- id: fixture
  en: fixture
  ipa: /ˈfɪkstʃər/
  ru: фикстура (fixture)
  pos: noun
  def:
    en: "Something pytest prepares for a test and passes into it by name: the built-in `page`, or your own, such as a logged-in page. You write one with `@pytest.fixture`: setup before `yield`, teardown after it."
    ru: "То, что pytest готовит для теста и передаёт в него по имени: встроенный `page` или твоё собственное — например, страницу с выполненным входом. Пишется через `@pytest.fixture`: подготовка до `yield`, очистка после."
  example:
    en: "Use the logged-in page fixture instead of logging in by hand in every test."
    ru: "Используй фикстуру со страницей после входа вместо ручного логина в каждом тесте."
  context: code-review
  chapter: 9

- id: conftest
  en: conftest.py
  ipa: /ˈkɑːnftest dɑːt paɪ/
  ru: conftest.py (общие фикстуры)
  pos: noun
  def:
    en: "A special file where you put fixtures shared by many test files. pytest finds conftest.py automatically: tests just ask for the fixture by name, no import needed."
    ru: "Особый файл, куда складывают фикстуры, общие для многих файлов с тестами. pytest находит conftest.py сам: тесты просто запрашивают фикстуру по имени, без импорта."
  example:
    en: "Move the login fixture to conftest.py — three test files already copy it."
    ru: "Перенеси фикстуру логина в conftest.py — её уже копируют три файла с тестами."
  context: code-review
  chapter: 9

- id: page-object-model
  en: Page Object Model
  ipa: /ˌpeɪdʒ ˈɑːbdʒekt ˌmɑːdl/
  ru: Page Object Model (POM, паттерн «объект страницы»)
  pos: noun
  def:
    en: "A pattern where each page gets a class with its locators and actions, like `LoginPage` in `pages/login_page.py`, so tests reuse them instead of repeating them."
    ru: "Паттерн, при котором у каждой страницы есть класс с её локаторами и действиями, например `LoginPage` в `pages/login_page.py`, и тесты переиспользуют их вместо повторения."
  example:
    en: "With the Page Object Model, renaming \"Log in\" to \"Sign in\" is a one-line fix in LoginPage."
    ru: "С Page Object Model переименование «Log in» в «Sign in» — исправление в одну строку в LoginPage."
  context: meeting
  chapter: 9

- id: class
  en: class
  ipa: /klæs/
  ru: класс (class)
  pos: noun
  def:
    en: "In code, a template that groups related data and methods, like a `LoginPage` class with a `log_in()` method. Not the same as a CSS class."
    ru: "В коде — шаблон, который объединяет связанные данные и методы, например класс `LoginPage` с методом `log_in()`. Не путать с CSS-классом."
  example:
    en: "The agent created a BasePage class with 30 methods we don't use — let's ask for a simpler version."
    ru: "Агент создал класс BasePage с 30 методами, которыми мы не пользуемся, — давай попросим вариант попроще."
  context: code-review
  chapter: 9

- id: parameterization
  en: parameterization
  ipa: /pəˌræmətərəˈzeɪʃn/
  ru: параметризация (parameterization)
  pos: noun
  def:
    en: "Running the same test body with different input data and expected results. In pytest it's `@pytest.mark.parametrize`: each data row becomes its own test with its own name in the report."
    ru: "Запуск одного и того же теста с разными входными данными и ожидаемыми результатами. В pytest это `@pytest.mark.parametrize`: каждая строка данных становится отдельным тестом со своим именем в отчёте."
  example:
    en: "Parameterization fits here: one promo code test, five codes, five expected messages."
    ru: "Здесь подходит параметризация: один тест промокода, пять кодов, пять ожидаемых сообщений."
  context: code-review
  chapter: 9

- id: data-driven-testing
  en: data-driven testing
  ipa: /ˌdeɪtə ˌdrɪvn ˈtestɪŋ/
  ru: тестирование на основе данных (data-driven testing)
  pos: noun
  def:
    en: "An approach where test cases are rows of data — inputs and expected results — fed into one test, for example from a list or a JSON file."
    ru: "Подход, при котором тест-кейсы — это строки данных (входные значения и ожидаемые результаты), которые подаются в один тест, например из списка или JSON-файла."
  example:
    en: "Let's make the signup password check data-driven: 7, 8 and 9 characters, each with its own expected result."
    ru: "Давай сделаем проверку пароля при регистрации тестом на основе данных: 7, 8 и 9 символов, у каждого свой ожидаемый результат."
  context: meeting
  chapter: 9

- id: refactoring
  en: refactoring
  ipa: /ˌriːˈfæktərɪŋ/
  ru: рефакторинг (refactoring)
  pos: noun
  def:
    en: "Changing the structure of code to make it cleaner without changing what it does."
    ru: "Изменение структуры кода, чтобы он стал чище, без изменения того, что он делает."
  example:
    en: "Small refactoring request: extract the cart steps into a CartPage class and don't touch the assertions."
    ru: "Небольшой запрос на рефакторинг: вынеси шаги корзины в класс CartPage и не трогай проверки."
  context: prompt
  chapter: 9
