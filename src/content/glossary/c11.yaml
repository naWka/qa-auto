# Glossary entries owned by chapter 11 (The real world)
- id: ci-cd
  en: CI/CD
  ipa: /ˌsiː aɪ ˌsiː ˈdiː/
  ru: CI/CD (непрерывная интеграция и доставка)
  pos: noun
  def:
    en: "Continuous integration and delivery: every change is built and tested automatically, then shipped."
    ru: "Непрерывная интеграция и доставка: каждое изменение автоматически собирается, тестируется и выкатывается."
  example:
    en: "Our pytest suite runs in CI/CD on every pull request, so nobody merges a red build."
    ru: "Наш набор тестов на pytest запускается в CI/CD на каждый пул-реквест, поэтому никто не мёржит красную сборку."
  context: meeting
  chapter: 11

- id: pipeline
  en: pipeline
  ipa: /ˈpaɪplaɪn/
  ru: пайплайн (pipeline)
  pos: noun
  def:
    en: "The chain of automatic steps that runs on each change: install the packages and browsers, run pytest, save the report and traces, deploy."
    ru: "Цепочка автоматических шагов, которая запускается на каждое изменение: установить пакеты и браузеры, запустить pytest, сохранить отчёт и трейсы, выкатить."
  example:
    en: "The pipeline is red on the e2e step — I'm downloading the traces of the failed tests now."
    ru: "Пайплайн красный на шаге e2e — сейчас скачиваю трейсы упавших тестов."
  context: chat
  chapter: 11

- id: codegen
  en: codegen
  ipa: /ˈkoʊd dʒen/
  ru: codegen (запись кода по действиям)
  pos: noun
  def:
    en: "A Playwright tool that records your clicks and typing in a browser and writes them as test code: `playwright codegen --target python-pytest http://localhost:3000`."
    ru: "Инструмент Playwright, который записывает твои клики и ввод в браузере и превращает их в код теста: `playwright codegen --target python-pytest http://localhost:3000`."
  example:
    en: "Run codegen on the checkout page to see which locator Playwright suggests for the date field."
    ru: "Запусти codegen на странице оформления, чтобы увидеть, какой локатор Playwright предлагает для поля даты."
  context: chat
  chapter: 11

- id: html-report
  en: HTML report
  ipa: /ˌeɪtʃ tiː em ˈel rɪˌpɔːrt/
  ru: HTML-отчёт (HTML report)
  pos: noun
  def:
    en: "A web page with the results of a run: every test, its status, errors and duration. pytest prints results in the terminal; the pytest-html plugin also saves them as a page: `pytest --html=report.html`."
    ru: "Веб-страница с результатами прогона: каждый тест, его статус, ошибки и длительность. pytest печатает результаты в терминал, а плагин pytest-html ещё и сохраняет их страницей: `pytest --html=report.html`."
  example:
    en: "I'll post the link to last night's HTML report in the release channel."
    ru: "Я скину ссылку на HTML-отчёт ночного прогона в канал релиза."
  context: chat
  chapter: 11

- id: headless
  en: headless
  ipa: /ˈhedləs/
  ru: headless-режим, без окна браузера (headless)
  pos: adjective
  def:
    en: "Running a browser without showing its window. pytest runs Playwright headless by default (that's how CI works too); add `--headed` to watch the browser."
    ru: "Запуск браузера без показа его окна. pytest по умолчанию запускает Playwright в headless-режиме (так же работает и CI); добавь `--headed`, чтобы видеть браузер."
  example:
    en: "It passes headed but fails headless — let's compare the two traces."
    ru: "С окном браузера тест проходит, а в headless падает — давай сравним два трейса."
  context: chat
  chapter: 11

- id: cross-browser-testing
  en: cross-browser testing
  ipa: /ˌkrɔːs ˈbraʊzər ˌtestɪŋ/
  ru: кроссбраузерное тестирование (cross-browser testing)
  pos: noun
  def:
    en: "Running the same tests in several browsers, such as Chromium, Firefox and WebKit (the engine behind Safari): `pytest --browser chromium --browser firefox --browser webkit`."
    ru: "Запуск одних и тех же тестов в нескольких браузерах, например в Chromium, Firefox и WebKit (движок Safari): `pytest --browser chromium --browser firefox --browser webkit`."
  example:
    en: "Cross-browser testing found it: the date picker breaks only in WebKit."
    ru: "Это нашлось благодаря кроссбраузерному тестированию: выбор даты ломается только в WebKit."
  context: standup
  chapter: 11

- id: pull-request
  en: pull request
  ipa: /ˈpʊl rɪˌkwest/
  ru: пул-реквест (pull request, PR)
  pos: noun
  def:
    en: "A request to merge your changes into the main branch; teammates review the diff and CI runs the tests."
    ru: "Запрос на слияние твоих изменений с основной веткой: коллеги смотрят дифф, а CI запускает тесты."
  example:
    en: "Here's my pull request with six new cart tests — could you review it today?"
    ru: "Вот мой пул-реквест с шестью новыми тестами корзины — сможешь посмотреть его сегодня?"
  context: chat
  chapter: 11

- id: repository
  en: repository
  ipa: /rɪˈpɑːzətɔːri/
  ru: репозиторий (repository, repo)
  pos: noun
  def:
    en: "A project folder with the full history of its changes, stored in Git — for example, on GitHub."
    ru: "Папка проекта со всей историей изменений, которая хранится в Git, — например, на GitHub."
  example:
    en: "The test repository has a README that explains how to run the suite locally."
    ru: "В репозитории с тестами есть README, где объяснено, как запустить набор локально."
  context: general
  chapter: 11

- id: commit
  en: commit
  ipa: /kəˈmɪt/
  ru: коммит (commit)
  pos: noun, verb
  def:
    en: "A saved snapshot of changes in Git, with a short message about what changed and why."
    ru: "Сохранённый снимок изменений в Git с коротким сообщением о том, что и зачем изменилось."
  example:
    en: "Please split this into two commits: one for the page object, one for the new tests."
    ru: "Пожалуйста, раздели это на два коммита: один для page object, другой для новых тестов."
  context: code-review
  chapter: 11

- id: portfolio
  en: portfolio
  ipa: /pɔːrtˈfoʊlioʊ/
  ru: портфолио (portfolio)
  pos: noun
  def:
    en: "A public collection of your work, such as GitHub repositories, that shows employers what you can do."
    ru: "Публичная подборка твоих работ, например репозиториев на GitHub, которая показывает работодателю, что ты умеешь."
  example:
    en: "My portfolio repo has 20 Bloomly tests, a CI badge and a section on how I review AI-written code."
    ru: "В моём репозитории для портфолио — 20 тестов Bloomly, бейдж CI и раздел о том, как я проверяю код от ИИ."
  context: meeting
  chapter: 11

- id: config-file
  en: config file
  ipa: /ˈkɑːnfɪɡ faɪl/
  ru: конфигурационный файл, конфиг (config file)
  pos: noun
  def:
    en: "A file with project settings. In a pytest project it's pytest.ini: default options in `addopts` such as `--base-url`, the browser and tracing, plus where the tests live."
    ru: "Файл с настройками проекта. В pytest-проекте это pytest.ini: опции по умолчанию в `addopts` — например, `--base-url`, браузер и трейсинг, — а ещё где лежат тесты."
  example:
    en: "Add `--tracing retain-on-failure` to the config file, so CI keeps a trace for every failed test."
    ru: "Добавь `--tracing retain-on-failure` в конфиг, чтобы CI сохранял трейс для каждого упавшего теста."
  context: code-review
  chapter: 11

- id: virtual-environment
  en: virtual environment
  ipa: /ˈvɜːrtʃuəl ɪnˈvaɪrənmənt/
  ru: виртуальное окружение (virtual environment, venv)
  pos: noun
  def:
    en: "A separate folder with its own Python packages for one project, \"venv\" for short, created with `python -m venv .venv`. pytest and pytest-playwright are installed into it, so projects don't get in each other's way."
    ru: "Отдельная папка с собственными Python-пакетами для одного проекта, сокращённо «venv»; создаётся командой `python -m venv .venv`. В неё устанавливают pytest и pytest-playwright, чтобы проекты не мешали друг другу."
  example:
    en: "The terminal says pytest isn't found because the virtual environment isn't active — activate it first."
    ru: "Терминал пишет, что pytest не найден, потому что виртуальное окружение не активировано, — сначала активируй его."
  context: chat
  chapter: 11
