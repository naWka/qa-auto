  - { en: "Lesson done. Bloomly's release just got a little safer.", ru: "Урок пройден. Релиз Bloomly стал чуточку надёжнее." }
  - { en: "Well done! You learned one new thing properly — that's a great day.", ru: "Молодец! Ты как следует разобрал{ась|ся} в одной новой теме — отличный день." }
  - { en: "Complete! The new terms are already in your vocabulary.", ru: "Готово! Новые термины уже в твоём словаре." }
  - { en: "That's the lesson! Have a sip of tea — you've earned it.", ru: "Урок окончен! Сделай глоток чая — ты это заслужил{а|}." }
