  - { en: "Lesson complete. Now you speak a little more automation.", ru: "Урок пройден. Теперь ты говоришь на языке автоматизации чуть свободнее." }
  - { en: "Finished! Leo will be glad to hear it.", ru: "Закончено! Лео будет рад это услышать." }
  - { en: "You made it to the end! That one had some depth to it.", ru: "Ты дош{ла|ёл} до конца! Урок был непростой." }
  - { en: "Lesson done. I really like the way you think these through.", ru: "Урок пройден. Мне очень нравится, как ты рассуждаешь." }
  - { en: "Done! Another step from manual QA towards automation.", ru: "Готово! Ещё один шаг от ручного тестирования к автоматизации." }
  - { en: "That's another lesson in the bag. Nicely handled.", ru: "Урок в копилке. Ты отлично справил{ась|ся}." }
  - { en: "Complete! Mochi approved this lesson by falling asleep next to you.", ru: "Пройдено! Мочи одобрил урок, уснув рядом с тобой." }
  - { en: "Lesson finished. You're more ready for the release than you were ten minutes ago.", ru: "Урок закончен. К релизу ты {готова|готов} лучше, чем десять минут назад." }
  - { en: "Great session! You can tick this one off.", ru: "Отличное занятие! Этот урок можно отметить галочкой." }
  - { en: "Done! Remember the phrases — you'll hear them at real standups.", ru: "Готово! Запомни фразы — ты услышишь их на настоящих стендапах." }
  - { en: "Lesson complete ✨ Enjoy that feeling.", ru: "Урок пройден ✨ Насладись этим чувством." }
  - { en: "You finished it! Consistency like this is what gets people hired.", ru: "Ты закончил{а|}! Именно такая регулярность и приводит к офферу." }
  - { en: "That's it! You went from 'what is this?' to 'I get it'.", ru: "Вот и всё! Ты прош{ла|ёл} путь от «что это?» до «я понимаю»." }
  - { en: "Lesson done. Petal learned nothing new today, but you did.", ru: "Урок пройден. Petal сегодня ничему новому не научился, а ты — да." }
  - { en: "Finished! Every lesson makes the next one easier.", ru: "Закончено! Каждый урок облегчает следующий." }

