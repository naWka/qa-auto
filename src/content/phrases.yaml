# Maya Chen's lines, shown in her speech bubble. Key = situation (see PhraseSituations in schema.ts).
# RU addresses the student with gender variants {feminine|masculine}. Maya about herself: feminine.
# Placeholders: {chapter} (chapterDone), {level} (levelUp), {streak} (streak), {badge} (badge),
# {lessons} {terms} {tasks} {days} (progress). In RU, numbers go after a colon or in neutral constructions.

greeting:
  - { en: "Good to see you! Ready for today's lesson?", ru: "Рада тебя видеть! {Готова|Готов} к сегодняшнему уроку?" }
  - { en: "Hi there! Coffee's ready, and Mochi is already on the keyboard — let's go.", ru: "Привет! Кофе готов, а Мочи уже лежит на клавиатуре — поехали." }
  - { en: "Hey, you made it! Today's plan is short and sweet.", ru: "О, привет! План на сегодня короткий и приятный." }
  - { en: "Come on in. Let's pick up right where we left off.", ru: "Заходи. Продолжим с того места, где остановились." }
  - { en: "Hi! Petal generated tests all night — let's see what it got wrong.", ru: "Привет! Petal всю ночь генерировал тесты — давай посмотрим, где он ошибся." }
  - { en: "Good to have you here. One new idea today, and a few tasks to make it stick.", ru: "Хорошо, что ты здесь. Сегодня одна новая идея и пара задач, чтобы она закрепилась." }
  - { en: "Hello again! Ten focused minutes beat an hour of scrolling through docs.", ru: "И снова привет! Десять сосредоточенных минут лучше часа листания документации." }
  - { en: "Hey! Mochi saved you the warm spot by the window.", ru: "Привет! Мочи занял для тебя тёплое место у окна." }
  - { en: "There you are! Leo asked how the regression suite is going — let's give him something to brag about.", ru: "Вот и ты! Лео спрашивал, как дела с регрессом, — дадим ему повод похвастаться." }
  - { en: "Hi! Today is a reading day: we look at code and think like testers.", ru: "Привет! Сегодня день чтения: смотрим на код и думаем как тестировщики." }
  - { en: "Good to see you. Grab a tea — this one's fun.", ru: "Рада видеть. Бери чай — сегодня будет интересно." }
  - { en: "Hello, colleague! Let's make Bloomly a little less buggy today.", ru: "Привет, коллега! Сделаем сегодня Bloomly чуточку менее багованным." }
  - { en: "Ready when you are. Small steps, real progress.", ru: "Начнём, когда будешь {готова|готов}. Маленькие шаги — настоящий прогресс." }
  - { en: "Hi! I've lined up a few tasks I think you'll enjoy.", ru: "Привет! Я подобрала несколько задач, которые, думаю, тебе понравятся." }
  - { en: "Oh good, you're here. Petal has questions, and only you have the answers.", ru: "О, отлично, ты здесь. У Petal есть вопросы, а ответы — только у тебя." }
  - { en: "Hey! The QA corner is open for business.", ru: "Привет! QA-уголок открыт и ждёт." }
  - { en: "Hi! Today we'll turn something you already know from manual testing into code.", ru: "Привет! Сегодня превратим в код то, что ты и так знаешь по ручному тестированию." }
  - { en: "Nice to see you! Let's keep the momentum going.", ru: "Приятно тебя видеть! Не будем терять темп." }
  - { en: "Hello! Mochi just knocked a pen off my desk, so I'm officially ready to work.", ru: "Привет! Мочи только что скинул ручку с моего стола, так что я официально готова работать." }
  - { en: "Hey you! A quick lesson, a couple of tasks, and you're free.", ru: "Привет-привет! Короткий урок, пара задач — и ты {свободна|свободен}." }
  - { en: "Hi! Shall we hunt down a few bugs today?", ru: "Привет! Поохотимся сегодня на пару багов?" }
  - { en: "Good to see you. The release isn't going to test itself — well, not without us.", ru: "Рада тебя видеть. Релиз сам себя не протестирует — по крайней мере, без нас." }
  - { en: "Hi! Sofia just added three new features to the release. Perfect timing for practice.", ru: "Привет! София только что добавила в релиз три новые фичи. Самое время потренироваться." }
  - { en: "Hey! Let's learn one thing well rather than five things badly.", ru: "Привет! Лучше разобраться в одном как следует, чем в пяти — кое-как." }
  - { en: "Hello! I saved the most interesting part of the codebase for you.", ru: "Привет! Я приберегла для тебя самую интересную часть кода." }
  - { en: "Hi there. Let's make today's session count — short and focused.", ru: "Привет. Пусть сегодняшнее занятие будет коротким, но насыщенным." }
  - { en: "Hey! Kai pushed new UI changes, so our locators get a workout today.", ru: "Привет! Кай выкатил новые изменения в интерфейсе — нашим локаторам сегодня будет чем заняться." }
  - { en: "Good to see you! Let's do what we do best: ask 'what could go wrong?'", ru: "Рада видеть! Займёмся тем, что у нас получается лучше всего: спросим «что может пойти не так?»" }
  - { en: "Hi! You bring the tester's eye, I'll bring the snacks.", ru: "Привет! С тебя — взгляд тестировщика, с меня — печеньки." }
  - { en: "Welcome! Today's goal: understand it well enough to explain it to Petal.", ru: "Привет! Цель на сегодня — понять тему так, чтобы объяснить её Petal." }
  - { en: "Hey, glad you're here. Mochi has been guarding your chair.", ru: "Привет, хорошо, что ты с нами. Мочи всё это время охранял твой стул." }
  - { en: "Hi! Fresh day, fresh tests. Let's see what breaks.", ru: "Привет! Новый день — новые тесты. Посмотрим, что сломается." }
  - { en: "Hello! One lesson, a few tasks, zero stress.", ru: "Привет! Один урок, несколько задач, ноль стресса." }
  - { en: "Hi! Remember: the agent writes the code, you decide what's worth checking.", ru: "Привет! Помни: код пишет агент, а что стоит проверять — решаешь ты." }
  - { en: "Hey there! Let's add another brick to your automation skills.", ru: "Привет! Добавим ещё один кирпичик в твои навыки автоматизации." }

welcomeBack:
  - { en: "Welcome back! So good to see you.", ru: "С возвращением! Как же я рада тебя видеть." }
  - { en: "Hey, you're back! Mochi noticed — he's already purring by your desk.", ru: "О, ты вернул{ась|ся}! Мочи заметил — уже мурчит у твоего стола." }
  - { en: "Welcome back! Let's start with a light refresher, no pressure.", ru: "С возвращением! Начнём с лёгкой разминки, без всякого давления." }
  - { en: "Breaks are part of learning. Your brain kept working on this while you were away.", ru: "Перерывы — часть обучения. Пока тебя не было, мозг продолжал обрабатывать материал." }
  - { en: "There you are! Everything you learned is still here, I promise.", ru: "Вот и ты! Всё, что ты выучил{а|}, никуда не делось, обещаю." }
  - { en: "Welcome back! Life happens — the tests waited patiently.", ru: "С возвращением! Жизнь есть жизнь — тесты терпеливо ждали." }
  - { en: "Good to have you back. We'll ease in gently.", ru: "Хорошо, что ты снова здесь. Втянемся потихоньку." }
  - { en: "Hi again! A short warm-up and you'll be right back in the flow.", ru: "И снова привет! Короткая разминка — и ты снова в потоке." }
  - { en: "Welcome back! Coming back is the hardest part, and you've just done it.", ru: "С возвращением! Вернуться — самое сложное, и ты это уже сделал{а|}." }
  - { en: "Oh, hello! I hope you had a good rest.", ru: "О, привет! Надеюсь, ты хорошо отдохнул{а|}." }
  - { en: "Welcome back! Petal kept your seat warm. Well, Mochi did.", ru: "С возвращением! Petal держал для тебя место. Ну ладно, Мочи держал." }
  - { en: "Hey! Picking things up after a pause is a skill too — nice.", ru: "Привет! Возвращаться после паузы — это тоже навык. Отлично." }
  - { en: "Back in the office! Let's see what you remember — probably more than you think.", ru: "Снова в офисе! Посмотрим, что ты помнишь, — скорее всего, больше, чем кажется." }
  - { en: "Welcome back! Nothing to catch up on — we simply continue.", ru: "С возвращением! Ничего догонять не надо — просто продолжаем." }
  - { en: "So glad you're here. Let's start small today.", ru: "Очень рада тебя видеть. Сегодня начнём с малого." }
  - { en: "Hey, welcome back! A little rest actually makes memories stronger.", ru: "Привет, с возвращением! Кстати, небольшой отдых даже укрепляет память." }
  - { en: "Look who's here! Mochi, say hi.", ru: "Смотри-ка, кто у нас тут! Мочи, поздоровайся." }
  - { en: "Welcome back! The release is still on track, and so are you.", ru: "С возвращением! Релиз идёт по плану, и ты тоже." }
  - { en: "Good to see you again. We'll refresh a couple of ideas first.", ru: "Рада снова тебя видеть. Сначала освежим пару идей." }
  - { en: "Hi! Whatever kept you busy, I'm glad you're here now.", ru: "Привет! Чем бы ты ни {была занята|был занят}, я рада, что ты снова здесь." }
  - { en: "Welcome back! Your progress is saved — every last bit of it.", ru: "С возвращением! Твой прогресс сохранён — весь, до последней задачки." }
  - { en: "There's my favourite tester! Ready to pick up the thread?", ru: "А вот и {моя любимая тестировщица|мой любимый тестировщик}! Продолжим?" }
  - { en: "Welcome back! Rest is part of the process, not a break from it.", ru: "С возвращением! Отдых — часть процесса, а не перерыв в нём." }
  - { en: "Hey! Let's do a gentle warm-up so it all comes back.", ru: "Привет! Сделаем мягкую разминку, чтобы всё вспомнилось." }
  - { en: "Welcome back! Fun fact: recalling things after a pause is the best way to remember them long-term.", ru: "С возвращением! Интересный факт: вспоминать после паузы — лучший способ запомнить надолго." }
  - { en: "Oh, you're here! Mochi just woke up too, so you're both right on time.", ru: "О, ты здесь! Мочи тоже только проснулся — так что вы оба как раз вовремя." }
  - { en: "Welcome back. No rush — we go at your pace.", ru: "С возвращением. Никакой спешки — идём в твоём темпе." }
  - { en: "Hi! Kai asked about you yesterday. Let's show him what you've got.", ru: "Привет! Кай вчера про тебя спрашивал. Покажем ему, на что ты способ{на|ен}." }
  - { en: "Welcome back! The best time to continue is now, and here you are.", ru: "С возвращением! Лучшее время продолжить — сейчас, и ты уже здесь." }
  - { en: "Hey there! Let's shake off the dust with something easy.", ru: "Привет! Стряхнём пыль чем-нибудь лёгким." }
  - { en: "Welcome back! Every expert takes breaks — what matters is coming back.", ru: "С возвращением! Перерывы бывают у всех экспертов — главное возвращаться." }
  - { en: "Hi! It's like you never left. Let's go.", ru: "Привет! Будто ты никуда и не уходил{а|}. Поехали." }
  - { en: "Welcome back! I kept a seat and a fresh task for you.", ru: "С возвращением! Я сберегла для тебя место и свежую задачку." }
  - { en: "Good to see you! Today we'll take it one step at a time.", ru: "Рада тебя видеть! Сегодня идём шаг за шагом." }
  - { en: "Welcome back! Bloomly's bugs were getting a little too comfortable.", ru: "С возвращением! А то баги в Bloomly совсем расслабились." }

pretestIntro:
  - { en: "Quick guess before we start. Wrong answers are totally fine here.", ru: "Быстрая догадка перед началом. Ошибаться здесь — совершенно нормально." }
  - { en: "Guess first, learn second. Guessing makes the answer stick later.", ru: "Сначала угадываем, потом учим. Догадка помогает потом лучше запомнить ответ." }
  - { en: "You haven't learned this yet — and that's the point. Just take your best guess.", ru: "Ты этого ещё не проходил{а|} — в этом и смысл. Просто попробуй угадать." }
  - { en: "A tiny warm-up question. No score, no judgement.", ru: "Маленький вопрос для разгона. Без оценок и без осуждения." }
  - { en: "Mistakes here actually help: your brain gets curious about the right answer.", ru: "Ошибки здесь даже полезны: мозгу становится интересно, какой ответ правильный." }
  - { en: "Before I explain anything — what does your tester's intuition say?", ru: "Прежде чем я что-то объясню, — что подсказывает твоя интуиция тестировщика?" }
  - { en: "Take a guess. Even a wrong one will make the lesson easier to remember.", ru: "Попробуй угадать. Даже неверная догадка поможет лучше запомнить урок." }
  - { en: "This doesn't count toward anything. It's just to wake up your curiosity.", ru: "Это ни на что не влияет. Просто чтобы разбудить любопытство." }
  - { en: "New topic! Let's see what you can figure out with zero theory.", ru: "Новая тема! Посмотрим, до чего ты догадаешься без всякой теории." }
  - { en: "Guessing is allowed. Encouraged, even.", ru: "Угадывать можно. Даже нужно." }
  - { en: "Pre-test time: think of it as exploratory testing of your own knowledge.", ru: "Время пре-теста: считай, это исследовательское тестирование собственных знаний." }
  - { en: "I don't expect you to know this yet. Just trust your gut.", ru: "Я не жду, что ты уже это знаешь. Просто доверься чутью." }
  - { en: "A couple of quick questions before the lesson. Wrong answers are part of the plan.", ru: "Пара быстрых вопросов перед уроком. Неверные ответы входят в план." }
  - { en: "Research says guessing first improves memory — so let's use that trick.", ru: "Исследования говорят: если сначала угадать, запоминается лучше. Воспользуемся этим." }
  - { en: "No pressure: I care about your thinking, not the score.", ru: "Без давления: мне важен ход твоих мыслей, а не результат." }
  - { en: "Let's poke at this topic a little before we open it up properly.", ru: "Давай немного потыкаем эту тему, прежде чем разбирать её как следует." }
  - { en: "Here's a puzzle. You know more about testing than you think — use it.", ru: "Вот загадка. О тестировании ты знаешь больше, чем кажется, — используй это." }
  - { en: "Quick one! If you get it wrong, even better — you'll remember the right answer.", ru: "Быстрый вопрос! Ошибёшься — даже лучше: запомнишь правильный ответ." }
  - { en: "Think of it as a smoke test for your brain.", ru: "Считай это смоук-тестом для мозга." }
  - { en: "Make a guess, and then we'll find out together.", ru: "Сделай предположение, а потом вместе выясним." }
  - { en: "When I started, I got questions like these wrong all the time. That's exactly why they work.", ru: "Когда я начинала, постоянно ошибалась в таких вопросах. Именно поэтому они и работают." }
  - { en: "You can't fail a pre-test. Really.", ru: "Пре-тест нельзя провалить. Правда." }
  - { en: "A sneak peek at today's topic — what do you think happens here?", ru: "Подсмотрим одним глазком в сегодняшнюю тему — как думаешь, что тут происходит?" }
  - { en: "Let's warm up your curiosity before the theory.", ru: "Разогреем любопытство перед теорией." }
  - { en: "A hunch is enough. We'll sort out the details in a minute.", ru: "Достаточно просто догадки. С деталями разберёмся через минуту." }
  - { en: "Even Petal guesses sometimes — it just never admits it. You're allowed to.", ru: "Даже Petal иногда угадывает — просто никогда в этом не признаётся. А тебе можно." }
  - { en: "Let's start with a question you can't possibly know yet. Fun, right?", ru: "Начнём с вопроса, ответ на который ты пока знать не можешь. Весело, правда?" }
  - { en: "Wrong answers now, right answers later. That's the deal.", ru: "Сейчас — неверные ответы, потом — верные. Таков уговор." }
  - { en: "Here's a little teaser. Pick what feels right.", ru: "Небольшой тизер. Выбери то, что кажется правильным." }
  - { en: "Before the lesson, a quick guess. It primes your brain for what's coming.", ru: "Перед уроком — быстрая догадка. Так мозг настраивается на новое." }
  - { en: "Treat this like a test case with an unknown expected result.", ru: "Отнесись к этому как к тест-кейсу с неизвестным ожидаемым результатом." }
  - { en: "Mochi always guesses where the bug is hiding. Your turn.", ru: "Мочи всегда угадывает, где спрятался баг. Твоя очередь." }
  - { en: "Nobody gets everything right on a pre-test, and that's how it should be.", ru: "На пре-тесте никто не отвечает на всё правильно, и так и должно быть." }
  - { en: "Go with your first instinct — we'll check it together right after.", ru: "Доверься первому впечатлению — сразу после этого проверим вместе." }

correct:
  - { en: "Great job!", ru: "Отлично!" }
  - { en: "Spot on.", ru: "В точку." }
  - { en: "Nailed it!", ru: "Есть! Прямо в яблочко." }
  - { en: "That's exactly what a senior QA would flag.", ru: "Ровно то, на что обращают внимание senior QA." }
  - { en: "This is how automation engineers think.", ru: "Именно так и думают инженеры по автоматизации." }
  - { en: "Yes! You read that code like a pro.", ru: "Да! Ты прочитал{а|} этот код как профи." }
  - { en: "Exactly right — well done!", ru: "{Умничка|Молодец}! Абсолютно верно." }
  - { en: "Correct — and for the right reason, which matters even more.", ru: "Верно — и по правильной причине, а это даже важнее." }
  - { en: "Good catch!", ru: "Отлично подмечено!" }
  - { en: "That's the one. Your tester's instinct is working.", ru: "Оно самое. Твоё чутьё тестировщика работает." }
  - { en: "Right! Petal would have missed that.", ru: "Верно! Petal бы это пропустил." }
  - { en: "Perfect. With reviews like that, any team would want you.", ru: "Идеально. С таким ревью тебя возьмут в любую команду." }
  - { en: "Yes! That's the answer of someone who has seen real bugs.", ru: "Да! Сразу видно человека, который встречал настоящие баги." }
  - { en: "Correct. A clean, confident answer.", ru: "Правильно. Чёткий, уверенный ответ." }
  - { en: "Exactly. That's the difference between a test that runs and a test that checks.", ru: "Именно. В этом разница между тестом, который просто запускается, и тестом, который действительно проверяет." }
  - { en: "You're doing great!", ru: "Ты молодец!" }
  - { en: "Bingo!", ru: "Бинго!" }
  - { en: "Right answer. Mochi approves — that's a slow blink.", ru: "Правильный ответ. Мочи одобряет — видишь, медленно моргает." }
  - { en: "Yes! That's how you keep a test suite trustworthy.", ru: "Да! Именно так набор тестов остаётся надёжным." }
  - { en: "Correct — you didn't let the green checkmark fool you.", ru: "Верно — зелёная галочка тебя не обманула." }
  - { en: "Brilliant. You picked the option that will still work next month.", ru: "Блестяще. Ты выбрал{а|} вариант, который будет работать и через месяц." }
  - { en: "Absolutely right. Kai would merge that without a second thought.", ru: "Абсолютно верно. Кай вмёрджил бы это не раздумывая." }
  - { en: "That's it! You see the risk, not just the syntax.", ru: "Оно! Ты видишь риск, а не только синтаксис." }
  - { en: "Correct! Your manual testing experience is really paying off.", ru: "Правильно! Опыт ручного тестирования явно окупается." }
  - { en: "Well done. That's a real-world answer, not a textbook one.", ru: "Здорово. Это ответ из реальной практики, а не из учебника." }
  - { en: "Yes, yes, yes! 🌸", ru: "Да, да, да! 🌸" }
  - { en: "Sharp eyes! You spotted it right away.", ru: "Зорко! Ты сразу это заметил{а|}." }
  - { en: "Correct. I'd trust you with the release checklist.", ru: "Верно. Я бы доверила тебе релизный чек-лист." }
  - { en: "Exactly right. That's what makes a test worth running.", ru: "Совершенно верно. Ради этого тест и стоит запускать." }
  - { en: "You got it! See how much you already know?", ru: "Получилось! Видишь, сколько ты уже знаешь?" }
  - { en: "Correct — that's QA thinking at its best.", ru: "Верно — это QA-мышление в лучшем виде." }
  - { en: "Right on. You'd be surprised how many people miss that.", ru: "Точно. Ты удивишься, сколько людей это упускают." }
  - { en: "That's the answer. You're reviewing like an automation engineer now.", ru: "Это правильный ответ. Ты уже делаешь ревью как инженер по автоматизации." }
  - { en: "Great call. That's exactly the question to ask Petal.", ru: "Отличное решение. Именно такой вопрос и стоит задать Petal." }
  - { en: "Correct! I couldn't have put it better myself.", ru: "Правильно! Я бы и сама лучше не сказала." }
  - { en: "Yes! One more piece of the puzzle in place.", ru: "Да! Ещё один кусочек пазла на месте." }
  - { en: "Now that's an answer! Well done.", ru: "Вот это ответ — {умничка|молодец}!" }

wrong:
  - { en: "Almost! Take another look.", ru: "Почти! Посмотри ещё раз." }
  - { en: "Good try — mistakes are how everyone learns.", ru: "Хорошая попытка — все учатся на ошибках." }
  - { en: "Not quite. What would you check first if this were a manual test?", ru: "Не совсем. А что бы ты проверил{а|} первым делом, если бы это был ручной тест?" }
  - { en: "Hmm, not this one. You're close, though.", ru: "Хм, не этот вариант. Но ты близко." }
  - { en: "Not yet. That's useful information, not a failure.", ru: "Пока нет. Это полезная информация, а не провал." }
  - { en: "Close, but no. Have a second look at the code.", ru: "Близко, но нет. Взгляни на код ещё раз." }
  - { en: "That's a common pick — and a common trap. Try again?", ru: "Частый выбор — и частая ловушка. Попробуешь ещё?" }
  - { en: "Not quite right. Mochi isn't judging, and neither am I.", ru: "Не совсем так. Мочи не осуждает, и я тоже." }
  - { en: "Oops, not this time. What's the expected result here?", ru: "Упс, не в этот раз. А какой здесь ожидаемый результат?" }
  - { en: "Nope — but I can see why you'd think so. Look again.", ru: "Нет — но я понимаю, почему ты так подумал{а|}. Посмотри ещё раз." }
  - { en: "Not this one. Every wrong answer narrows it down.", ru: "Не этот. Каждый неверный ответ сужает круг." }
  - { en: "Almost there. Something small is hiding in the details.", ru: "Почти получилось. В деталях прячется какая-то мелочь." }
  - { en: "Hmm, that's not it. Try reading it the way a user would.", ru: "Хм, не то. Попробуй прочитать это глазами пользователя." }
  - { en: "Not quite. I made exactly this mistake when I started.", ru: "Не совсем. Я сама делала ровно эту ошибку, когда начинала." }
  - { en: "Good thinking, wrong answer. Give it another shot.", ru: "Ход мыслей хороший, ответ — нет. Попробуй ещё раз." }
  - { en: "That's a bug in the answer, not in you. Try again.", ru: "Это баг в ответе, а не в тебе. Попробуй снова." }
  - { en: "Not this time — and that's okay. What else could it be?", ru: "Не в этот раз — и это нормально. Что ещё это может быть?" }
  - { en: "Close! Re-read the question once more.", ru: "Близко! Перечитай вопрос ещё раз." }
  - { en: "Not quite. Think about what could go wrong here.", ru: "Не совсем. Подумай, что тут может пойти не так." }
  - { en: "Wrong turn, right direction. Try another option.", ru: "Ты сверну{ла|л} не туда, но направление верное. Попробуй другой вариант." }
  - { en: "Hmm, no. Petal would probably pick that too — let's beat Petal.", ru: "Хм, нет. Petal, скорее всего, тоже выбрал бы это — давай обыграем Petal." }
  - { en: "Not the right one. Mistakes stick better than easy wins, so this helps.", ru: "Не тот вариант. Ошибки запоминаются лучше лёгких побед, так что это даже на пользу." }
  - { en: "Almost! Look at what the test actually checks.", ru: "Почти! Посмотри, что тест на самом деле проверяет." }
  - { en: "That's not it, but you're asking the right questions.", ru: "Не то, но вопросы ты задаёшь правильные." }
  - { en: "Not quite. Imagine you're writing a bug report — where's the evidence?", ru: "Не совсем. Представь, что ты пишешь баг-репорт, — где доказательства?" }
  - { en: "Nope, but it's a smart mistake.", ru: "Нет, но это умная ошибка." }
  - { en: "Not this one. Tricky, I know.", ru: "Не этот. Хитро, я знаю." }
  - { en: "Hmm, not quite. Want to look again?", ru: "Хм, не совсем. Посмотришь ещё раз?" }
  - { en: "Not right yet. Your second guess is usually better than your first.", ru: "Пока не то. Вторая попытка обычно точнее первой." }
  - { en: "Good try! Look at each option like a code reviewer.", ru: "Хорошая попытка! Посмотри на каждый вариант глазами ревьюера." }
  - { en: "No worries — that one trips up lots of people.", ru: "Ничего страшного — на этом спотыкаются многие." }
  - { en: "Not quite. Mochi just tilted his head at that one.", ru: "Не совсем. Мочи как-то с сомнением наклонил голову." }
  - { en: "Not quite. Compare it with the test case, step by step.", ru: "Не совсем. Сверь с тест-кейсом шаг за шагом." }
  - { en: "Wrong one — but you're learning faster than you think.", ru: "Мимо — но учишься ты быстрее, чем кажется." }
  - { en: "Oh, so close! One more look.", ru: "Ох, совсем рядом! Ещё один взгляд." }

wrongAgain:
  - { en: "Still not it — let's slow down a little.", ru: "Всё ещё не то — давай чуть притормозим." }
  - { en: "No rush. Read the case once more, line by line.", ru: "Не спеши. Прочитай кейс ещё раз, строчку за строчкой." }
  - { en: "Let's take a breath and look at one detail at a time.", ru: "Сделаем вдох и посмотрим на детали по одной." }
  - { en: "Hmm, not yet. Try reading the expected result first.", ru: "Хм, пока нет. Попробуй сначала прочитать ожидаемый результат." }
  - { en: "Still tricky, huh? Look at the exact text in the code.", ru: "Всё ещё хитро, да? Посмотри на точный текст в коде." }
  - { en: "Not quite again — totally normal. What does each line actually do?", ru: "Снова мимо — это абсолютно нормально. Что на самом деле делает каждая строка?" }
  - { en: "Let's zoom in. Which word in the question matters most?", ru: "Давай приблизим. Какое слово в вопросе самое важное?" }
  - { en: "Pause for a second. Imagine running this test by hand.", ru: "Остановись на секунду. Представь, что выполняешь этот тест вручную." }
  - { en: "Not this one either. Try ruling out the options you're sure are wrong.", ru: "И это не то. Попробуй исключить варианты, в ошибочности которых ты {уверена|уверен}." }
  - { en: "Still not right, and that's fine. Reread the task slowly.", ru: "Опять не то, и это нормально. Перечитай задание медленно." }
  - { en: "Let's step back. What is this test supposed to prove?", ru: "Давай отступим на шаг. Что этот тест должен доказать?" }
  - { en: "Hmm. Check the small things: quotes, names, the exact label.", ru: "Хм. Проверь мелочи: кавычки, названия, точную подпись." }
  - { en: "Not yet. Sometimes the answer hides in the line you skimmed.", ru: "Пока нет. Иногда ответ прячется в строчке, которую ты пробежал{а|} глазами." }
  - { en: "Still not it. Mochi suggests a slow blink and a fresh look.", ru: "Всё ещё не то. Мочи советует медленно моргнуть и посмотреть свежим взглядом." }
  - { en: "Let's go detail by detail, like checking a bug report before you send it.", ru: "Пройдёмся по деталям, как при проверке баг-репорта перед отправкой." }
  - { en: "No worries. Read the code out loud — honestly, it helps.", ru: "Ничего страшного. Прочитай код вслух — честно, помогает." }
  - { en: "A second miss just means this is worth learning properly.", ru: "Второй промах значит только одно: это стоит разобрать как следует." }
  - { en: "Take your time. Compare what the test does with what the case says.", ru: "Не торопись. Сравни, что делает тест, с тем, что написано в кейсе." }
  - { en: "Still not right. Which line would fail first?", ru: "Всё ещё не то. Какая строка упадёт первой?" }
  - { en: "Hmm, let's slow down. What would a user see on the screen?", ru: "Хм, давай медленнее. Что пользователь увидит на экране?" }
  - { en: "Not quite. Look at the data — is it the same as in the case?", ru: "Не совсем. Посмотри на данные — они совпадают с кейсом?" }
  - { en: "Still not there, but you're narrowing it down.", ru: "Ещё не то, но круг сужается." }
  - { en: "Let's try a different angle: what's missing, rather than what's wrong?", ru: "Попробуем с другой стороны: чего здесь не хватает, а не что тут не так?" }
  - { en: "Not yet. Re-read the question — it's sneakier than it looks.", ru: "Пока нет. Перечитай вопрос — он хитрее, чем кажется." }
  - { en: "Okay, slow mode on. One option at a time.", ru: "Так, включаем медленный режим. По одному варианту." }
  - { en: "Not this one. A few mistakes in a row are part of learning, really.", ru: "Не этот. Несколько ошибок подряд — нормальная часть обучения, правда." }
  - { en: "Still no. Try explaining each option to Mochi — he's a great listener.", ru: "Всё ещё нет. Попробуй объяснить каждый вариант Мочи — он отличный слушатель." }
  - { en: "Hmm. Find the one detail that makes all the difference.", ru: "Хм. Найди ту самую деталь, которая всё меняет." }
  - { en: "It's okay to slow down. Here, accuracy beats speed.", ru: "Притормозить — нормально. Здесь точность важнее скорости." }
  - { en: "Not quite. Look at the order of the steps.", ru: "Не совсем. Посмотри на порядок шагов." }
  - { en: "Let's look again together. What exactly does the expect line compare?", ru: "Давай посмотрим ещё раз вместе. Что именно сравнивает строка с expect?" }
  - { en: "Still not right. Read it as if you were reviewing someone else's test.", ru: "Пока не то. Прочитай так, будто проверяешь чужой тест." }
  - { en: "Not there yet. Close your eyes for a second, then read the case afresh.", ru: "Ещё не то. Закрой глаза на секунду и прочитай кейс заново." }
  - { en: "The second try didn't land — happens to all of us. Small details first.", ru: "Вторая попытка не сработала — со всеми бывает. Сначала мелкие детали." }

hintOffer:
  - { en: "This one's tricky — want a hint?", ru: "Это хитрая штука — хочешь подсказку?" }
  - { en: "Lots of people get stuck here. I did too when I started. A hint?", ru: "Здесь застревают многие. Я тоже застряла, когда начинала. Подсказать?" }
  - { en: "Let me give you a nudge — this topic confuses almost everyone at first.", ru: "Давай я немного подтолкну — эта тема поначалу сбивает с толку почти всех." }
  - { en: "Three tries on a hard one means you're really working. Want a small hint?", ru: "Три попытки на сложном вопросе — значит, ты по-настоящему стараешься. Дать маленькую подсказку?" }
  - { en: "There's no shame in hints. Senior engineers ask for help every day.", ru: "В подсказках нет ничего стыдного. Senior-инженеры просят помощи каждый день." }
  - { en: "Honestly, this tripped me up for weeks. Shall I point you in the right direction?", ru: "Честно, я на этом спотыкалась неделями. Подсказать направление?" }
  - { en: "How about a hint? It won't give the answer away, just the direction.", ru: "Как насчёт подсказки? Ответ она не выдаст, только направление." }
  - { en: "This is one of the trickiest bits. Want me to help a little?", ru: "Это одно из самых каверзных мест. Помочь немножко?" }
  - { en: "Let's not fight it alone. Tap the hint — that's what it's for.", ru: "Не будем бороться в одиночку. Нажми на подсказку — она для этого и есть." }
  - { en: "Even Kai asks for a hint on this one. Want one?", ru: "Даже Кай здесь просит подсказку. Хочешь?" }
  - { en: "This topic is a classic stumbling block. A hint might unlock it.", ru: "Эта тема — классический камень преткновения. Подсказка может всё прояснить." }
  - { en: "Want a clue? Mochi already has one, but he's not telling.", ru: "Хочешь подсказку? У Мочи она уже есть, но он молчит." }
  - { en: "When I learned this, I needed three hints. Here's the first one, if you like.", ru: "Когда я это учила, мне понадобилось три подсказки. Вот первая, если хочешь." }
  - { en: "Getting stuck is normal. Asking for a hint is a smart move, not a weakness.", ru: "Застрять — нормально. Попросить подсказку — умный ход, а не слабость." }
  - { en: "A small hint could save you some time. Want to see it?", ru: "Маленькая подсказка сэкономит время. Показать?" }
  - { en: "This one is hard for nearly everyone. Shall we look at a hint together?", ru: "Это сложно почти для всех. Посмотрим подсказку вместе?" }
  - { en: "Let me help. On a real team, we'd just pair up on this.", ru: "Давай помогу. В настоящей команде мы бы просто разобрали это в паре." }
  - { en: "Hint time? Understanding it is the whole point here.", ru: "Время подсказки? Здесь главное — разобраться." }
  - { en: "I can see this is a tough one. Want a gentle hint?", ru: "Вижу, задачка непростая. Дать мягкую подсказку?" }
  - { en: "Here's a secret: this exact question confuses most people who are new to automation. Hint?", ru: "Секрет: именно этот вопрос сбивает с толку почти всех, кто только приходит в автоматизацию. Подсказать?" }
  - { en: "Shall I share what helped me understand this?", ru: "Рассказать, что помогло понять это мне?" }
  - { en: "No need to guess blindly. A hint is right there.", ru: "Не нужно гадать вслепую. Подсказка рядом." }
  - { en: "This one deserves a hint. Seriously, it's sneaky.", ru: "Здесь подсказка вполне заслужена. Серьёзно, вопрос с подвохом." }
  - { en: "Let's turn frustration into progress — want a hint?", ru: "Давай превратим досаду в прогресс — хочешь подсказку?" }
  - { en: "Three misses only mean the topic is new. A hint will help it click.", ru: "Три промаха значат только то, что тема новая. С подсказкой всё встанет на место." }
  - { en: "I'd love to help here. Open a hint?", ru: "С удовольствием помогу. Открыть подсказку?" }
  - { en: "Even Petal would need a hint here — and it never asks. You can.", ru: "Тут даже Petal понадобилась бы подсказка — только он никогда не просит. А ты можешь." }
  - { en: "Lots of experienced testers pause right here. Want a hint?", ru: "Многие опытные тестировщики останавливаются именно здесь. Подсказать?" }
  - { en: "Want me to walk you through the first step?", ru: "Хочешь, я проведу тебя через первый шаг?" }
  - { en: "It's okay to ask. That's how good teams work.", ru: "Спрашивать — нормально. Так работают хорошие команды." }
  - { en: "Tricky topic alert! A hint might be the fastest way forward.", ru: "Внимание, каверзная тема! Подсказка может быть самым быстрым путём вперёд." }
  - { en: "I remember staring at this for ages. Let me save you the trouble — hint?", ru: "Помню, как сама подолгу на это смотрела. Давай сэкономлю тебе время — подсказка?" }
  - { en: "You don't have to crack this alone. Want a clue?", ru: "Не обязательно разгадывать это в одиночку. Дать зацепку?" }
  - { en: "Let's get you unstuck. One hint, coming up?", ru: "Давай сдвинемся с мёртвой точки. Показать одну подсказку?" }

testGreen:
  - { en: "Green! Your test passed.", ru: "Зелёный! Твой тест прошёл." }
  - { en: "All green. Nice work!", ru: "Всё зелёное. Отличная работа!" }
  - { en: "It passed! Now a quick question: would it fail if the app were broken?", ru: "Прошёл! А теперь вопрос: упал бы он, если бы приложение сломалось?" }
  - { en: "Green is good — when it can also be red.", ru: "Зелёный хорош, когда он может стать и красным." }
  - { en: "Look at that green checkmark. You earned it.", ru: "Посмотри на эту зелёную галочку. Ты её заслужил{а|}." }
  - { en: "Passed! Mochi is doing his happy tail thing.", ru: "Прошёл! Мочи радостно задрал хвост трубой." }
  - { en: "Green across the board! 🌿", ru: "Всё зелёное! 🌿" }
  - { en: "Test passed. That's one less thing to click through by hand.", ru: "Тест прошёл. На одну ручную проверку меньше." }
  - { en: "Green! A test that checks the right thing and passes — beautiful.", ru: "Зелёный! Тест, который проверяет нужное и проходит, — красота." }
  - { en: "It works! And it'll keep working every night in CI.", ru: "Работает! И будет работать каждую ночь в CI." }
  - { en: "Green run. Remember: a test with no assertion is green too — yours has one, right?", ru: "Зелёный прогон. Помни: тест без проверки тоже зелёный — в твоём ведь она есть?" }
  - { en: "Passed on the first run! Love to see it.", ru: "Прошёл с первого запуска! Обожаю такое." }
  - { en: "Green! That's the sound of a three-day manual regression getting shorter.", ru: "Зелёный! Так звучит сокращение трёхдневного ручного регресса." }
  - { en: "Everything passed. Leo will be pleased.", ru: "Всё прошло. Лео будет доволен." }
  - { en: "Green! Now you know it works — and you know why.", ru: "Зелёный! Теперь ты знаешь, что он работает, — и знаешь почему." }
  - { en: "Passed. Clean and confident, just like your code review.", ru: "Прошёл. Чисто и уверенно — как твоё ревью." }
  - { en: "Yes! Green and meaningful.", ru: "Да! Зелёный и осмысленный." }
  - { en: "The test is green. Bonus round: break the app in your head — would this test catch it?", ru: "Тест зелёный. Бонусный раунд: мысленно сломай приложение — этот тест бы поймал?" }
  - { en: "Passed! Petal is impressed, though it'll pretend it isn't.", ru: "Прошёл! Petal впечатлён, хотя сделает вид, что нет." }
  - { en: "Green light! That one's going into the regression suite.", ru: "Зелёный свет! Этот тест отправляется в регрессионный набор." }
  - { en: "Passed. You've made the computer check what you used to check by hand.", ru: "Прошёл. Ты заставил{а|} компьютер проверять то, что раньше проверял{а|} руками." }
  - { en: "Green! Small test, big win.", ru: "Зелёный! Маленький тест, большая победа." }
  - { en: "It passed. Trust it — but only because you know what it checks.", ru: "Прошёл. Ему можно доверять — но только потому, что ты знаешь, что он проверяет." }
  - { en: "Green! That's a test you can be proud of.", ru: "Зелёный! Таким тестом можно гордиться." }
  - { en: "Passed! Kai owes you a coffee.", ru: "Прошёл! Кай должен тебе кофе." }
  - { en: "All tests green. Take a second to enjoy it.", ru: "Все тесты зелёные. Насладись моментом." }
  - { en: "Green! A passing test is a promise: if this ever breaks, we'll know.", ru: "Зелёный! Проходящий тест — это обещание: если здесь что-то сломается, мы узнаем." }
  - { en: "Passed. Healthy suspicion check: did it really click and verify, not just load the page?", ru: "Прошёл. Проверка на здоровую подозрительность: он правда кликнул и проверил, а не просто открыл страницу?" }
  - { en: "Green and stable. That's the dream.", ru: "Зелёный и стабильный. Мечта!" }
  - { en: "The run is green ✨", ru: "Прогон зелёный ✨" }
  - { en: "Passed! I'd approve that pull request.", ru: "Прошёл! Я бы одобрила такой pull request." }
  - { en: "Green! You're officially automating Bloomly's regression.", ru: "Зелёный! Ты официально автоматизируешь регресс Bloomly." }
  - { en: "Passed. Between us: I trust a green test more once I've seen it fail.", ru: "Прошёл. Между нами: я больше доверяю зелёному тесту, когда хоть раз видела его красным." }
  - { en: "Green! That's how confidence in a release is built — one test at a time.", ru: "Зелёный! Так и строится уверенность в релизе — тест за тестом." }

testRed:
  - { en: "Red! Don't worry — red is information.", ru: "Красный! Не переживай — красный это информация." }
  - { en: "It failed. Let's read the report together.", ru: "Упал. Давай вместе прочитаем отчёт." }
  - { en: "A red run. Every automation engineer sees this a dozen times a day.", ru: "Красный прогон. Любой инженер по автоматизации видит такое по десять раз на дню." }
  - { en: "Failed — great, now we get to investigate.", ru: "Упал — отлично, теперь можно поисследовать." }
  - { en: "Red means the test is talking to us. What is it saying?", ru: "Красный значит, что тест с нами разговаривает. Что он говорит?" }
  - { en: "A failure! Let's check: is it the test or the app?", ru: "Падение! Проверим: проблема в тесте или в приложении?" }
  - { en: "Red. Start with the first error message — it usually tells the whole story.", ru: "Красный. Начни с первого сообщения об ошибке — обычно в нём вся история." }
  - { en: "It didn't pass. That's exactly why we run tests.", ru: "Не прошёл. Ровно для этого мы и запускаем тесты." }
  - { en: "Red! Maybe you've just found a bug. Let's look closer.", ru: "Красный! Возможно, ты только что наш{ла|ёл} баг. Давай присмотримся." }
  - { en: "Failing test, calm team. Let's read what happened.", ru: "Тест упал, а мы спокойны. Читаем, что произошло." }
  - { en: "Red is not a grade. It's a clue.", ru: "Красный — это не оценка. Это подсказка." }
  - { en: "Failed. Look at the line number — that's where the story starts.", ru: "Упал. Посмотри на номер строки — с неё и начинается история." }
  - { en: "Red! Mochi's ears are up. Something interesting happened.", ru: "Красный! У Мочи ушки на макушке. Случилось что-то интересное." }
  - { en: "It failed — which means it can fail. That's actually reassuring.", ru: "Упал — значит, он умеет падать. Это даже успокаивает." }
  - { en: "A red run. Expected vs actual — that's your bug report, already half written.", ru: "Красный прогон. Ожидаемое и фактическое — вот тебе наполовину готовый баг-репорт." }
  - { en: "Failed. Let's be detectives: what did the test expect, and what did it get?", ru: "Упал. Побудем детективами: что тест ожидал и что получил?" }
  - { en: "Red. Happens to me every single day, no exaggeration.", ru: "Красный. У меня такое каждый день, без преувеличения." }
  - { en: "Not green this time. Let's open the report before changing any code.", ru: "В этот раз не зелёный. Прежде чем менять код, откроем отчёт." }
  - { en: "A red test is either doing its job or asking to be fixed. Let's find out which.", ru: "Красный тест либо делает свою работу, либо просит его починить. Выясним, что из двух." }
  - { en: "Failed! Don't rush to fix it — understand it first.", ru: "Упал! Не спеши чинить — сначала разберись." }
  - { en: "Red. Read the error the way you'd read a bug report from a colleague.", ru: "Красный. Прочитай ошибку так, как читал{а|} бы баг-репорт от коллеги." }
  - { en: "Uh-oh, red. Totally normal. What's the first line of the error?", ru: "Ой, красный. Абсолютно нормально. Что в первой строке ошибки?" }
  - { en: "It failed. Good — that means we're about to learn something.", ru: "Упал. Хорошо — значит, сейчас чему-то научимся." }
  - { en: "Red! Petal would just rewrite the test. We'll read the report first.", ru: "Красный! Petal бы просто переписал тест. А мы сначала прочитаем отчёт." }
  - { en: "A failed run. The report is your best friend right now.", ru: "Прогон упал. Отчёт сейчас — твой лучший друг." }
  - { en: "Red happens. The skill is in what you do next.", ru: "Красное бывает. Мастерство — в том, что ты делаешь дальше." }
  - { en: "A failure — let's see whether the app or the test is lying.", ru: "Падение — посмотрим, кто врёт: приложение или тест." }
  - { en: "Red. Breathe. Read. Then decide.", ru: "Красный. Вдох. Читаем. Потом решаем." }
  - { en: "Not passing yet. Compare the expected text with what's actually on the page.", ru: "Пока не проходит. Сравни ожидаемый текст с тем, что реально есть на странице." }
  - { en: "It's red, and that's fine. Most of automation is reading failures.", ru: "Красный, и это нормально. Большая часть автоматизации — это чтение падений." }
  - { en: "Failed. If the app is right and the test is wrong, we fix the test. If not, we file a bug.", ru: "Упал. Если право приложение, а ошибся тест, — чиним тест. Если нет — заводим баг." }
  - { en: "Red! This is where your manual testing instincts shine.", ru: "Красный! Вот где пригодится твоё чутьё из ручного тестирования." }
  - { en: "Failing test spotted. Let's treat it like any other bug investigation.", ru: "Обнаружен падающий тест. Разберём его, как любой другой баг." }
  - { en: "Red run. No panic — the report has everything we need.", ru: "Красный прогон. Без паники — в отчёте есть всё, что нужно." }

lessonDone:
  - { en: "Lesson done! Nicely done.", ru: "Урок пройден! Здорово получилось." }
