checkPassed:
  - { en: "You know this! Topic counted.", ru: "Ты это знаешь! Тема засчитана." }
  - { en: "Check passed. No need to sit through what you already know.", ru: "Проверка пройдена. Незачем проходить то, что ты уже знаешь." }
  - { en: "Confirmed — this one's already yours. On to the next.", ru: "Подтверждено — эта тема уже твоя. Идём дальше." }
  - { en: "Passed! Your experience shows. Let's not waste your time here.", ru: "Пройдено! Опыт чувствуется. Не будем тратить твоё время." }
  - { en: "Nice — you clearly knew this already. Topic marked as done.", ru: "Здорово — ты явно это уже знал{а|}. Тема отмечена как пройденная." }
  - { en: "That's what years of real testing get you. Topic counted.", ru: "Вот что дают годы настоящего тестирования. Тема засчитана." }
  - { en: "Check passed! I love it when people show they know their stuff.", ru: "Проверка пройдена! Обожаю, когда человек показывает, что знает своё дело." }
  - { en: "You know this topic — no need to repeat it.", ru: "Эту тему ты знаешь — повторять незачем." }
  - { en: "Passed. Respect — you came in already knowing this.", ru: "Пройдено. Уважаю — ты приш{ла|ёл} уже со знаниями." }
  - { en: "Counted! We'll spend your time on what's actually new.", ru: "Засчитано! Потратим твоё время на то, что действительно ново." }
  - { en: "Check complete. You didn't need the lesson for this one.", ru: "Проверка завершена. Для этой темы урок тебе не понадобился." }
  - { en: "Passed with confidence! The topic is yours.", ru: "Уверенно пройдено! Тема твоя." }
  - { en: "Yes — you really do know this. Moving on.", ru: "Да — ты действительно это знаешь. Двигаемся дальше." }
  - { en: "That's a pass. Your knowledge is officially on the record.", ru: "Зачёт. Твои знания официально зафиксированы." }
  - { en: "Proved it! The topic is checked off.", ru: "Доказано! Тема отмечена." }
  - { en: "Check passed. Mochi gives you a respectful nod.", ru: "Проверка пройдена. Мочи уважительно кивает." }
  - { en: "Good call taking the check — you clearly knew this already.", ru: "Правильно, что ты реши{ла|л} пройти проверку, — ты это явно знал{а|}." }
  - { en: "Passed. That's the advantage of experience.", ru: "Пройдено. Вот оно, преимущество опыта." }
  - { en: "You knew it! Let's save the time for harder things.", ru: "Ты это знал{а|}! Сбережём время для задач посложнее." }
  - { en: "Counted. I'll trust you on this one — you've earned it.", ru: "Засчитано. Здесь я тебе доверяю — ты это заслужил{а|}." }
  - { en: "Passed! No point re-teaching what you already know.", ru: "Пройдено! Нет смысла заново учить тому, что ты уже знаешь." }
  - { en: "Topic confirmed. That was quick and clean.", ru: "Тема подтверждена. Быстро и чисто." }
  - { en: "Check passed — you're ahead of the curve here.", ru: "Проверка пройдена — здесь ты опережаешь программу." }
  - { en: "Well, you obviously didn't need me for this one. Counted!", ru: "Что ж, здесь я тебе явно не нужна. Засчитано!" }
  - { en: "Your existing knowledge just saved you a whole lesson. Nice.", ru: "Твои знания только что сэкономили тебе целый урок. Здорово." }
  - { en: "Passed! Experience is a shortcut, and you took it.", ru: "Пройдено! Опыт — это короткий путь, и ты им воспользовал{ась|ся}." }
  - { en: "Yes! The topic is counted — on to something new.", ru: "Да! Тема засчитана — переходим к новому." }
  - { en: "Check passed. Petal would have needed three prompts for that.", ru: "Проверка пройдена. Petal на это понадобилось бы три промпта." }
  - { en: "Counted as done. You know it, and now the app knows it too.", ru: "Засчитано. Ты это знаешь, и теперь приложение тоже знает." }
  - { en: "Passed. That's how you respect your own time.", ru: "Пройдено. Вот так и надо ценить своё время." }
  - { en: "Confirmed! This topic goes straight into your 'already know' pile.", ru: "Подтверждено! Тема отправляется прямиком в стопку «уже знаю»." }
  - { en: "Check passed ✨ Your experience speaks for itself.", ru: "Проверка пройдена ✨ Твой опыт говорит сам за себя." }
  - { en: "Done. We'll still revisit it in a warm-up now and then, just to keep it fresh.", ru: "Готово. Иногда будем возвращаться к теме в разминках, чтобы не забывалась." }
  - { en: "Passed — you've got this topic covered, like a good regression suite.", ru: "Пройдено — эта тема у тебя покрыта, как хороший регрессионный набор." }

checkFailed:
  - { en: "Not this time — let's practise just the parts that didn't click.", ru: "Не в этот раз — давай потренируем только то, что не сложилось." }
  - { en: "No worries. We'll go through the lesson — it'll be quick for you.", ru: "Ничего страшного. Пройдём урок — для тебя он будет быстрым." }
  - { en: "That's completely normal. Some parts are new, and that's why the lesson exists.", ru: "Это совершенно нормально. Что-то здесь новое — для этого и есть урок." }
  - { en: "Almost! Let's fill the gaps instead of repeating everything.", ru: "Почти! Давай закроем пробелы, а не будем повторять всё подряд." }
  - { en: "Not quite yet. Now we know where to focus.", ru: "Пока не совсем. Зато теперь понятно, на чём сосредоточиться." }
  - { en: "This check is about finding gaps, and we found one. That's useful.", ru: "Эта проверка нужна, чтобы находить пробелы, — и мы один нашли. Это полезно." }
  - { en: "No judgement here. Let's practise the tricky bits.", ru: "Никакого осуждения. Потренируем каверзные места." }
  - { en: "Good that you tried! Now we know exactly what to work on.", ru: "Хорошо, что ты попробовал{а|}! Теперь мы точно знаем, над чем работать." }
  - { en: "Not a pass yet, and that's okay. You'll breeze through the lesson.", ru: "Пока не зачёт, и это нормально. Урок пролетишь на одном дыхании." }
  - { en: "Some of it clicked, some didn't. Let's focus on the second part.", ru: "Что-то сложилось, что-то нет. Сосредоточимся на втором." }
  - { en: "That's fine — automation has its own quirks, even for experienced testers.", ru: "Это нормально — у автоматизации свои особенности даже для опытных тестировщиков." }
  - { en: "Not yet! Think of it as a test that found a gap. Good test.", ru: "Пока нет! Считай, что тест нашёл пробел. Хороший тест." }
  - { en: "No problem. One short lesson, and you'll own this topic.", ru: "Не беда. Один короткий урок — и тема будет твоей." }
  - { en: "We'll practise the parts that didn't land. You already know the rest.", ru: "Потренируем то, что не зашло. Остальное ты уже знаешь." }
  - { en: "Honestly, I'd have missed some of these at first too.", ru: "Честно, я бы поначалу тоже ошиблась в некоторых из них." }
  - { en: "That's okay! Better to find out now than in an interview.", ru: "Ничего! Лучше выяснить сейчас, чем на собеседовании." }
  - { en: "Not counted yet — but you're closer than the score suggests.", ru: "Пока не засчитано — но ты ближе, чем кажется по результату." }
  - { en: "Totally fine. Let's turn these misses into knowledge.", ru: "Всё в порядке. Превратим эти промахи в знания." }
  - { en: "No stress. Let's take the lesson — you'll see what was missing.", ru: "Без стресса. Пройдём урок — и ты увидишь, чего не хватало." }
  - { en: "Now we know where to dig. That's what checks are for.", ru: "Теперь ясно, где копать. Для этого проверки и нужны." }
  - { en: "Not this round. Mochi says: one more lesson, then a nap.", ru: "Не в этот раз. Мочи говорит: ещё один урок, а потом поспать." }
  - { en: "Let's practise. You clearly have a foundation — we'll build on it.", ru: "Давай потренируемся. Основа у тебя явно есть — будем на неё опираться." }
  - { en: "Not quite, and that's exactly why we check. Let's learn the missing piece.", ru: "Не совсем, и именно поэтому мы проверяем. Давай разберём недостающий кусочек." }
  - { en: "Fine by me! A few targeted tasks will sort this out.", ru: "Меня это устраивает! Несколько точечных задач всё исправят." }
  - { en: "No harm done. The lesson will feel like a review for you.", ru: "Ничего страшного. Урок покажется тебе повторением." }
  - { en: "Not yet — automation terms take a little time to settle.", ru: "Пока нет — термины автоматизации не сразу укладываются в голове." }
  - { en: "Okay, let's work on it together. No rush.", ru: "Хорошо, поработаем над этим вместе. Без спешки." }
  - { en: "Some answers missed the mark — that's information, not a verdict.", ru: "Некоторые ответы мимо — это информация, а не приговор." }
  - { en: "We'll go through it properly. You'll be faster than you expect.", ru: "Разберём как следует. Ты справишься быстрее, чем ожидаешь." }
  - { en: "That check was tough. Let's practise the specific bits that tripped you up.", ru: "Проверка была непростая. Потренируем именно те места, где ты споткнул{ась|ся}." }
  - { en: "Not a pass, not a problem. Let's learn.", ru: "Не зачёт — не проблема. Учимся." }
  - { en: "Good attempt. Now we know what's solid and what needs a little work.", ru: "Хорошая попытка. Теперь понятно, что уже крепко, а что надо подтянуть." }
  - { en: "Your experience got you part of the way. The lesson will cover the rest.", ru: "Опыт провёл тебя часть пути. Остальное покроет урок." }
  - { en: "No worries at all. Even senior engineers brush up on the basics.", ru: "Совершенно не о чем переживать. Даже senior-инженеры время от времени освежают базу." }

warmupStart:
  - { en: "Quick warm-up! Two or three minutes on things you've already learned.", ru: "Быстрая разминка! Две-три минуты на то, что ты уже прош{ла|ёл}." }
  - { en: "Let's stretch those memory muscles before we start.", ru: "Разомнём мышцы памяти перед началом." }
  - { en: "Warm-up time. Remembering is what makes it stick.", ru: "Время разминки. Именно вспоминание помогает закрепить." }
  - { en: "A few quick questions from earlier lessons. Ready?", ru: "Несколько быстрых вопросов из прошлых уроков. {Готова|Готов}?" }
  - { en: "Before anything new, let's visit a few old friends.", ru: "Прежде чем браться за новое, навестим старых знакомых." }
  - { en: "Warm-up: short, easy, and very good for your memory.", ru: "Разминка: коротко, легко и очень полезно для памяти." }
  - { en: "Let's see what stuck! Just a couple of minutes.", ru: "Посмотрим, что запомнилось! Всего пара минут." }
  - { en: "Mochi always stretches before doing anything. Let's do the same.", ru: "Мочи всегда потягивается, прежде чем что-то делать. Давай и мы." }
  - { en: "Quick recap round. Don't overthink it.", ru: "Быстрый круг повторения. Не перемудряй." }
  - { en: "Time for a little spaced repetition — fancy name, simple idea.", ru: "Время интервального повторения — название мудрёное, идея простая." }
  - { en: "Let's warm up with a few things you've seen before.", ru: "Разомнёмся на том, что ты уже видел{а|}." }
  - { en: "A short regression run — for your brain.", ru: "Короткий регресс — для мозга." }
  - { en: "Two minutes of review. Like a smoke test before the main suite.", ru: "Две минуты повторения. Как смоук-тест перед основным набором." }
  - { en: "Let's refresh a few ideas so the new ones have something to hold on to.", ru: "Освежим пару идей, чтобы новым было за что зацепиться." }
  - { en: "Warm-up! If something feels fuzzy, that's exactly why we do this.", ru: "Разминка! Если что-то подзабылось — для этого мы её и делаем." }
  - { en: "A few quick ones from the past. No pressure, just practice.", ru: "Пара быстрых вопросов из прошлого. Без давления, просто практика." }
  - { en: "Let's dust off some earlier topics.", ru: "Сдуем пыль с прошлых тем." }
  - { en: "Coffee in one hand, warm-up in the other. Let's go.", ru: "Кофе в одной руке, разминка — в другой. Поехали." }
  - { en: "A quick memory check before the lesson. Forgetting a bit is normal.", ru: "Быстрая проверка памяти перед уроком. Немного подзабыть — нормально." }
  - { en: "Warm-up round! These will feel easier than last time.", ru: "Разминочный раунд! В этот раз будет легче, чем раньше." }
  - { en: "Let's start by pulling a few things out of long-term memory.", ru: "Начнём с того, что достанем кое-что из долговременной памяти." }
  - { en: "Every time you recall something, the memory gets stronger. Let's recall a little.", ru: "Каждое припоминание укрепляет память. Давай немного повспоминаем." }
  - { en: "Mini-review time — just a handful of questions.", ru: "Время мини-повторения — всего несколько вопросов." }
  - { en: "Let's revisit some earlier lessons, quick and light.", ru: "Вернёмся к прошлым урокам — быстро и легко." }
  - { en: "Warm-up first. Even pros run a quick check before the big stuff.", ru: "Сначала разминка. Даже профи делают быструю проверку перед серьёзной работой." }
  - { en: "A short warm-up from your past lessons. Think of it as a sanity check.", ru: "Короткая разминка по прошлым урокам. Считай это санити-чеком." }
  - { en: "Back to some old topics for a moment. They've been waiting for you.", ru: "Ненадолго вернёмся к старым темам. Они тебя ждали." }
  - { en: "Let's warm up! Three minutes, tops.", ru: "Разминаемся! Максимум три минуты." }
  - { en: "Retrieval practice time. Your brain will thank you later.", ru: "Время практики припоминания. Мозг потом скажет спасибо." }
  - { en: "Quick! What do you remember? Let's find out.", ru: "Быстро! Что ты помнишь? Сейчас узнаем." }
  - { en: "Before the new stuff, a little look back.", ru: "Перед новым — небольшой взгляд назад." }
  - { en: "Warm-up time — Petal reruns old tests too, you know.", ru: "Время разминки — Petal ведь тоже перезапускает старые тесты." }
  - { en: "Let's make sure the basics are still solid. Quick round.", ru: "Убедимся, что база всё ещё крепкая. Быстрый раунд." }
  - { en: "A gentle warm-up to get the gears turning ✨", ru: "Мягкая разминка, чтобы шестерёнки закрутились ✨" }

progress:
  - { en: "{days} days ago you hadn't read a single Playwright test — now you review Petal's code.", ru: "В первый день ты ещё не прочитал{а|} ни одного Playwright-теста, а сейчас делаешь ревью кода Petal. Дней с того момента: {days}." }
  - { en: "Lessons done: {lessons}. That's a real foundation.", ru: "Пройдено уроков: {lessons}. Это настоящий фундамент." }
  - { en: "You've learned {terms} terms. You could follow a real standup now.", ru: "Терминов в копилке: {terms}. Ты уже можешь следить за настоящим стендапом." }
  - { en: "Tasks solved: {tasks}. Each one made you a little sharper.", ru: "Решено задач: {tasks}. Каждая сделала тебя чуточку внимательнее." }
  - { en: "{lessons} lessons, {tasks} tasks. That's not 'just studying' — that's training.", ru: "Уроков: {lessons}, задач: {tasks}. Это уже не просто учёба, а настоящая тренировка." }
  - { en: "Remember day one? That was {days} days ago. Look at you now.", ru: "Помнишь первый день? С тех пор прошло дней: {days}. Посмотри на себя сейчас." }
  - { en: "{terms} new words in your professional English. Kai noticed.", ru: "Новых слов в твоём рабочем английском: {terms}. Кай заметил." }
  - { en: "You started with manual test cases; now you read automated tests. It took {days} days.", ru: "Ты начинал{а|} с ручных тест-кейсов, а теперь читаешь автотесты. Дней на это ушло: {days}." }
  - { en: "{tasks} tasks solved — more practice than many people get in a month.", ru: "{tasks} — столько задач ты уже решил{а|}. Это больше практики, чем у многих за месяц." }
  - { en: "{lessons} lessons behind you. The next ones will build on every one of them.", ru: "Уже {lessons} — столько уроков позади. Следующие будут опираться на каждый из них." }
  - { en: "Your vocabulary: {terms} terms and counting.", ru: "Твой словарь: {terms} — и это не предел." }
  - { en: "{days} days in, and you already think in locators and assertions.", ru: "Дней с начала: {days} — а ты уже мыслишь локаторами и проверками." }
  - { en: "You've solved {tasks} tasks. Petal has generated more code, but you've made better decisions.", ru: "Решено задач: {tasks}. Кода Petal нагенерировал больше, но решения у тебя — лучше." }
  - { en: "Progress check: {lessons} lessons, {terms} terms, {tasks} tasks. Not bad at all.", ru: "Сводка: уроков — {lessons}, терминов — {terms}, задач — {tasks}. Совсем неплохо." }
  - { en: "{terms} terms learned. You could survive a code review in English now.", ru: "Терминов выучено: {terms}. Ревью на английском тебе уже по силам." }
  - { en: "{days} days ago, 'locator' was just a word. Now it's a tool you use.", ru: "В начале пути «локатор» был просто словом, а теперь это твой рабочий инструмент. Дней с тех пор: {days}." }
  - { en: "{tasks} tasks done — each one a decision a real automation engineer makes every day.", ru: "Задач решено: {tasks} — и каждая похожа на решения, которые инженер по автоматизации принимает каждый день." }
  - { en: "Look how far you've come: {lessons} lessons since you started.", ru: "Посмотри, какой путь пройден: уроков с самого начала — {lessons}." }
  - { en: "From zero to {terms} terms. Your English is growing along with your skills.", ru: "Терминов было ноль, стало {terms}. Английский растёт вместе с навыками." }
  - { en: "{days} days of learning. Your future team is lucky.", ru: "Дней учёбы: {days}. Твоей будущей команде повезло." }
  - { en: "You've finished {lessons} lessons. Leo would call that a steady velocity.", ru: "Уроков за плечами: {lessons}. Лео назвал бы это стабильной скоростью." }
  - { en: "{tasks} tasks! Every one of them a step from 'I click' to 'I automate'.", ru: "Задач: {tasks}! Каждая — шаг от «я кликаю» к «я автоматизирую»." }
  - { en: "It's been {days} days. You now read test reports as calmly as bug reports.", ru: "Прошло дней: {days}. Теперь ты читаешь отчёты о тестах так же спокойно, как баг-репорты." }
  - { en: "{lessons} lessons and {terms} terms — a solid start to a new career.", ru: "Уроки: {lessons}. Термины: {terms}. Отличное начало новой карьеры." }
  - { en: "{terms} terms in your pocket — standups in English are getting easier, right?", ru: "Терминов в кармане: {terms} — стендапы на английском уже даются легче, правда?" }
  - { en: "{days} days ago you only tested by hand. Today you automate.", ru: "Ещё недавно ты тестировал{а|} только руками. Сегодня — автоматизируешь. Дней с начала: {days}." }
  - { en: "Tasks solved so far: {tasks}. Mochi watched every single one.", ru: "Решённых задач пока: {tasks}. Мочи наблюдал за каждой." }
  - { en: "{lessons} lessons in, and you're asking the kind of questions I'd expect from a mid-level automation engineer.", ru: "Уроков позади: {lessons} — а ты уже задаёшь вопросы уровня мидл-инженера по автоматизации." }
  - { en: "In {days} days you've built a habit and a skill. Both count.", ru: "Дней с начала: {days}. За это время появились и привычка, и навык — считается и то, и другое." }
  - { en: "{tasks} tasks, {terms} terms, and a lot of determination.", ru: "Задачи: {tasks}. Термины: {terms}. И очень много упорства." }
  - { en: "You've been at this for {days} days, and it shows in how you review code.", ru: "Ты занимаешься уже {days}-й день, и это видно по твоему ревью." }
  - { en: "{lessons} lessons done. Remember when await looked scary?", ru: "Уроков пройдено: {lessons}. Помнишь, как пугал await?" }
  - { en: "{terms} terms learned — you'd follow most of a Playwright PR discussion now.", ru: "Выучено терминов: {terms} — ты уже поймёшь большую часть обсуждения в PR про Playwright." }
  - { en: "{tasks} solved tasks later, Petal checks with you before it guesses.", ru: "Решённых задач: {tasks} — и Petal теперь сначала советуется с тобой, а потом уже угадывает." }
  - { en: "Since you started {days} days ago: {lessons} lessons, {tasks} tasks, {terms} terms. Wow.", ru: "С начала пути (дней: {days}) — уроков: {lessons}, задач: {tasks}, терминов: {terms}. Ого." }

bossIntro:
  - { en: "Boss time! Everything from this chapter, in one real task.", ru: "Время босса! Всё из этой главы — в одной настоящей задаче." }
  - { en: "This is the big one. Take your time and read carefully.", ru: "Это главная задача. Не спеши и читай внимательно." }
  - { en: "Leo needs this done before the release. I know you can do it.", ru: "Лео нужно, чтобы это было готово до релиза. Я знаю, ты справишься." }
  - { en: "Chapter boss ahead. It's harder — and you're ready.", ru: "Впереди босс главы. Он сложнее — но ты {готова|готов}." }
  - { en: "Ready for a real challenge? This one is like an actual ticket from the sprint.", ru: "{Готова|Готов} к настоящему испытанию? Эта задача — как реальный тикет из спринта." }
  - { en: "Final task of the chapter. Think like the senior QA you're becoming.", ru: "Финальная задача главы. Думай как senior QA, {которой|которым} ты становишься." }
  - { en: "Boss level! Bring everything you've learned — and your QA instincts.", ru: "Босс-уровень! Бери с собой всё, что выучил{а|}, — и своё QA-чутьё." }
  - { en: "Deep breath. This is where it all comes together.", ru: "Глубокий вдох. Здесь всё сходится воедино." }
  - { en: "Boss task: this one asks for judgement, not just knowledge.", ru: "Задача-босс: здесь нужно не только знать, но и принимать решения." }
  - { en: "Mochi is hiding under the desk. That's how you know it's a boss.", ru: "Мочи спрятался под стол. Значит, босс." }
  - { en: "This is a real Bloomly scenario. Petal already tried — and didn't quite manage.", ru: "Это реальный сценарий Bloomly. Petal уже пытался — и не совсем справился." }
  - { en: "It's boss time. Read the case twice, then trust yourself.", ru: "Время босса. Прочитай кейс дважды, а потом доверься себе." }
  - { en: "The chapter's final challenge. Slow and careful wins here.", ru: "Финальное испытание главы. Здесь выигрывает тот, кто идёт медленно и внимательно." }
  - { en: "Boss ahead! Mistakes are allowed here too — it's still practice.", ru: "Впереди босс! Ошибаться можно и здесь — это всё ещё практика." }
  - { en: "Ready? This is the task that proves the chapter was worth it.", ru: "{Готова|Готов}? Эта задача покажет, что глава прошла не зря." }
  - { en: "Time to put it all together, just like on a real project.", ru: "Пора собрать всё вместе — как на настоящем проекте." }
  - { en: "Boss level. Sofia is watching this ticket closely. No pressure. 😉", ru: "Босс-уровень. София пристально следит за этим тикетом. Без давления. 😉" }
  - { en: "This is the hardest task in the chapter — and the most satisfying one to solve.", ru: "Это самая сложная задача главы — и самая приятная, когда её решишь." }
  - { en: "Final boss. You've got through every lesson so far; this is just one more step.", ru: "Финальный босс. Все уроки ты уже прош{ла|ёл}; это просто ещё один шаг." }
  - { en: "Here comes the boss. Remember: you know what's worth checking better than any agent.", ru: "А вот и босс. Помни: что стоит проверять, ты знаешь лучше любого агента." }
  - { en: "A real-world task to close the chapter. Take your time.", ru: "Задача из реальной жизни, чтобы закрыть главу. Не торопись." }
  - { en: "Boss fight! Well, boss review. Same adrenaline.", ru: "Битва с боссом! Ну, ревью с боссом. Адреналин тот же." }
  - { en: "This is your chapter exam — except it's fun.", ru: "Это твой экзамен по главе — только интересный." }
  - { en: "Big task ahead. Break it into steps, like any good test case.", ru: "Впереди большая задача. Разбей её на шаги, как любой хороший тест-кейс." }
  - { en: "Boss task unlocked. I picked this one because I know you can handle it.", ru: "Открыта задача-босс. Я выбрала её, потому что знаю: ты справишься." }
  - { en: "The release depends on this one. Just kidding — mostly. Let's go!", ru: "От этой задачи зависит релиз. Шучу — почти. Поехали!" }
  - { en: "Boss time. If it feels hard, that's because it's real.", ru: "Время босса. Если кажется сложно — это потому, что всё по-настоящему." }
  - { en: "Here's the chapter boss. Petal is nervous. You shouldn't be.", ru: "Вот и босс главы. Petal нервничает. А тебе не стоит." }
  - { en: "Final challenge! Read every line as if it's hiding a bug — because one probably is.", ru: "Финальное испытание! Читай каждую строку так, будто в ней прячется баг, — скорее всего, так и есть." }
  - { en: "Ready for the boss? Kai says he couldn't solve this on the first try.", ru: "{Готова|Готов} к боссу? Кай говорит, что сам не решил это с первой попытки." }
  - { en: "This is the moment. Show the chapter what you've learned. 💪", ru: "Вот он, момент. Покажи главе, чему ты научил{ась|ся}. 💪" }
  - { en: "Boss ahead. It's long, but you've already done every part of it before.", ru: "Впереди босс. Задача длинная, но каждую её часть ты уже делал{а|}." }
  - { en: "The boss awaits. Trust your process: read, predict, verify.", ru: "Босс ждёт. Доверься своему процессу: прочитать, предсказать, проверить." }
  - { en: "Last task before the next department. Make it count!", ru: "Последняя задача перед следующим отделом. Сделай её как следует!" }
