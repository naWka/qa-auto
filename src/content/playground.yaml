          expect(page).to_have_url("http://localhost:3000/account")

  - id: greeting-wrong-name
    area: login
    title: { en: "My account greets the customer by last name", ru: "В аккаунте приветствие по фамилии" }
    steps:
      en: "1. Log in as `anna@bloomly.app` / `bloom123`.\n2. Read the heading on **My account**."
