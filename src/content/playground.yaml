    title: { en: "A 7-character password is accepted", ru: "Пароль из 7 символов принимается" }
    steps:
      en: "1. Open **/signup**.\n2. Fill in the form with the password `flower7` (7 characters).\n3. Click **Create account**."
      ru: "1. Открой **/signup**.\n2. Заполни форму с паролем `flower7` (7 символов).\n3. Нажми **Create account**."
    expected: { en: "Error “Password must be at least 8 characters.”", ru: "Ошибка «Password must be at least 8 characters.»" }
    actual: { en: "“Account created!”", ru: "«Account created!»" }
    starter: signup
    hint:
      en: "Petal's password is long enough. Try the boundary: 7 characters, and expect the error from `password-error`."
      ru: "У Petal пароль достаточно длинный. Проверь границу: 7 символов — и жди ошибку из `password-error`."
    solution: |
      from playwright.sync_api import Page, expect


      def test_password_needs_8_characters(page: Page):
          page.goto("/signup")
          page.get_by_label("Full name").fill("Nina Park")
          page.get_by_label("Email").fill("nina@example.com")
