# Bug hunt in the Playground: Bloomly's switchable bugs written up as bug reports.
# Each bug gets Petal's draft test (`starter`: green on healthy Bloomly AND with the bug — it doesn't catch it yet),
# a hint and a reference solution (green on healthy Bloomly, red with the bug).
# `app.state` is set before the test (shown as preconditions); the bug itself is switched on by the page.
# Checked by #/dev/selftest (filter "hunt").

areas:
  - id: login
    title: { en: "Log in & account", ru: "Вход и аккаунт" }
  - id: signup
    title: { en: "Sign up", ru: "Регистрация" }
  - id: shop
    title: { en: "Shop", ru: "Каталог" }
  - id: cart
    title: { en: "Cart", ru: "Корзина" }
  - id: checkout
    title: { en: "Checkout & orders", ru: "Заказ" }
  - id: a11y
    title: { en: "Accessibility", ru: "Доступность" }
  - id: api
    title: { en: "API", ru: "API" }

