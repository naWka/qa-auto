  # ---------- cart ----------
  - id: add-to-cart-double
    area: cart
    title: { en: "One click adds two items", ru: "Один клик добавляет два товара" }
    steps:
      en: "1. Open **/shop**.\n2. Click **Add to cart** on Sunny Tulips once."
      ru: "1. Открой **/shop**.\n2. Один раз нажми **Add to cart** у Sunny Tulips."
    expected: { en: "The cart counter in the header shows 1.", ru: "Счётчик корзины в шапке показывает 1." }
    actual: { en: "The counter shows 2.", ru: "Счётчик показывает 2." }
    starter: add-to-cart
    hint:
      en: "Petal checks the pop-up message — it looks fine. Check the counter: `page.get_by_test_id(\"cart-count\")`."
      ru: "Petal проверяет всплывающее сообщение — с ним всё в порядке. Проверь счётчик: `page.get_by_test_id(\"cart-count\")`."
    solution: |
      from playwright.sync_api import Page, expect


      def test_one_click_adds_one_item(page: Page):
          page.goto("/shop")
          (
              page.get_by_test_id("product-card")
              .filter(has_text="Sunny Tulips")
              .get_by_role("button", name="Add to cart")
              .click()
          )
          expect(page.get_by_test_id("cart-count")).to_have_text("1")

