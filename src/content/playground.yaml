          expect(page.get_by_role("heading", level=1)).to_have_text("Welcome back, Anna!")

  # ---------- sign up ----------
  - id: signup-terms-ignored
    area: signup
    title: { en: "An account is created without accepting the terms", ru: "Аккаунт создаётся без согласия с условиями" }
    steps:
      en: "1. Open **/signup**.\n2. Fill in name, email, password and country.\n3. Leave **I agree to the Terms of Service** unticked.\n4. Click **Create account**."
      ru: "1. Открой **/signup**.\n2. Заполни имя, email, пароль и страну.\n3. Не ставь галочку **I agree to the Terms of Service**.\n4. Нажми **Create account**."
    expected: { en: "Error “You must accept the Terms of Service.” No account.", ru: "Ошибка «You must accept the Terms of Service.» Аккаунт не создан." }
    actual: { en: "“Account created!”", ru: "«Account created!»" }
    starter: signup
    hint:
      en: "Remove the line that ticks the box, and expect the error instead of success. The error has the test id `terms-error`."
      ru: "Убери строку, которая ставит галочку, и вместо успеха жди ошибку. У ошибки test id `terms-error`."
    solution: |
      from playwright.sync_api import Page, expect


      def test_terms_must_be_accepted(page: Page):
          page.goto("/signup")
          page.get_by_label("Full name").fill("Nina Park")
          page.get_by_label("Email").fill("nina@example.com")
          page.get_by_label("Password").fill("flowers2026")
          page.get_by_label("Country").select_option("Portugal")
          page.get_by_role("button", name="Create account").click()
          expect(page.get_by_test_id("terms-error")).to_have_text("You must accept the Terms of Service.")

