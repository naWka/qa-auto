    actual: { en: "The home page `/` opens.", ru: "Открывается главная `/`." }
    starter: login
    hint:
      en: "Petal checks the name in the header — it's there on every page. Check the address: `expect(page).to_have_url(...)`."
      ru: "Petal проверяет имя в шапке — оно есть на любой странице. Проверь адрес: `expect(page).to_have_url(...)`."
    solution: |
      from playwright.sync_api import Page, expect


      def test_login_opens_my_account(page: Page):
