        assert len(response.json()) == 6

bugs:
  # ---------- log in & account ----------
  - id: login-trim
    area: login
    title: { en: "Spaces around the email block login", ru: "Пробелы вокруг email не дают войти" }
    steps:
      en: "1. Open **/login**.\n2. Enter the email with spaces around it, as if pasted: `\"  anna@bloomly.app \"`. Password `bloom123`.\n3. Click **Log in**."
      ru: "1. Открой **/login**.\n2. Введи email с пробелами по краям, как будто его вставили из буфера: `\"  anna@bloomly.app \"`. Пароль `bloom123`.\n3. Нажми **Log in**."
    expected: { en: "The spaces are ignored, Anna is logged in.", ru: "Пробелы игнорируются, Анна входит в аккаунт." }
    actual: { en: "Error “Please enter a valid email address.”", ru: "Ошибка «Please enter a valid email address.»" }
    starter: login
    hint:
      en: "Petal's test types a clean email. Type it the way the steps say — with the spaces."
      ru: "В тесте Petal email введён без пробелов. Введи его так, как в шагах, — с пробелами."
    solution: |
      from playwright.sync_api import Page, expect


      def test_email_with_spaces_still_logs_in(page: Page):
          page.goto("/login")
          page.get_by_label("Email").fill("  anna@bloomly.app ")
          page.get_by_label("Password").fill("bloom123")
          page.get_by_role("button", name="Log in").click()
          expect(page.get_by_test_id("user-name")).to_have_text("Anna")

  - id: login-case-sensitive
    area: login
    title: { en: "An email with capital letters can't log in", ru: "Email с заглавными буквами не принимается" }
    steps:
      en: "1. Open **/login**.\n2. Enter `Anna@Bloomly.app` and `bloom123`.\n3. Click **Log in**."
      ru: "1. Открой **/login**.\n2. Введи `Anna@Bloomly.app` и `bloom123`.\n3. Нажми **Log in**."
    expected: { en: "Letter case in the email doesn't matter, Anna is logged in.", ru: "Регистр букв в email не важен, Анна входит в аккаунт." }
    actual: { en: "Error “Invalid email or password.”", ru: "Ошибка «Invalid email or password.»" }
    starter: login
    hint:
      en: "Change only the email in Petal's test: `Anna@Bloomly.app`."
      ru: "Поменяй в тесте Petal только email: `Anna@Bloomly.app`."
    solution: |
      from playwright.sync_api import Page, expect


      def test_email_is_not_case_sensitive(page: Page):
          page.goto("/login")
          page.get_by_label("Email").fill("Anna@Bloomly.app")
          page.get_by_label("Password").fill("bloom123")
          page.get_by_role("button", name="Log in").click()
          expect(page.get_by_test_id("user-name")).to_have_text("Anna")

  - id: login-no-error
    area: login
    title: { en: "A wrong password shows no error", ru: "Неверный пароль — и никакой ошибки" }
    steps:
      en: "1. Open **/login**.\n2. Enter `anna@bloomly.app` and a wrong password.\n3. Click **Log in**."
      ru: "1. Открой **/login**.\n2. Введи `anna@bloomly.app` и неверный пароль.\n3. Нажми **Log in**."
    expected: { en: "The error “Invalid email or password.” appears.", ru: "Появляется ошибка «Invalid email or password.»" }
    actual: { en: "Nothing happens: no error, the customer doesn't know what went wrong.", ru: "Ничего не происходит: ошибки нет, покупатель не понимает, что не так." }
    starter: login-wrong
    hint:
      en: "Petal only checks that the page stays on /login. Check the message too: it has the role `alert`."
      ru: "Petal проверяет только, что страница осталась на /login. Проверь и само сообщение: у него роль `alert`."
    solution: |
      from playwright.sync_api import Page, expect


      def test_wrong_password_shows_an_error(page: Page):
          page.goto("/login")
          page.get_by_label("Email").fill("anna@bloomly.app")
          page.get_by_label("Password").fill("wrong-password")
          page.get_by_role("button", name="Log in").click()
          expect(page.get_by_role("alert")).to_have_text("Invalid email or password.")

  - id: login-redirect-home
    area: login
    title: { en: "After login the customer lands on the home page", ru: "После входа покупатель попадает на главную" }
    steps:
