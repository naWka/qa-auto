    hint:
      en: "Petal checks the header, not the greeting. Check the page heading: `page.get_by_role(\"heading\", level=1)`."
      ru: "Petal проверяет шапку, а не приветствие. Проверь заголовок страницы: `page.get_by_role(\"heading\", level=1)`."
    solution: |
      from playwright.sync_api import Page, expect


      def test_account_greets_by_first_name(page: Page):
          page.goto("/login")
