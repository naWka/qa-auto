[pytest]
# Options added to every `pytest` run:
#   --base-url  tests use short paths: page.goto("/login") opens http://localhost:3000/login
#   --tracing   keeps a trace (test-results/<test>/trace.zip) for every failed test
addopts = --base-url http://localhost:3000 --tracing retain-on-failure

# Where pytest looks for test files (test_*.py)
testpaths = tests

# Lets tests import page objects: from pages.login_page import LoginPage
pythonpath = .

# Labels for tests: @pytest.mark.smoke, then run only them with `pytest -m smoke`
markers =
    smoke: quick checks of the main user flows
